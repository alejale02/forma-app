<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="theme-color" content="#12141A" />

<style>
:root{--bg:#12141A;--bg-elev:#1A1D24;--bg-elev1:#1F2229;--bg-elev2:#282C34;--text:#F5F5F7;--text-dim:#B0B3B8;--text-faint:#6B6F76;--accent:#C8FF3D;--accent-dim:#8FBF2B;--warn:#FFB84D;--danger:#FF6B4A;--success:#4ADE80;--radius:16px;--radius-lg:20px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;height:100%;-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;min-height:44px}
#root{min-height:100vh;min-height:100dvh}
.screen{min-height:100vh;padding:16px 16px 100px;max-width:480px;margin:0 auto}
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-top:8px}
.sub-header h1{font-size:22px;font-weight:800;letter-spacing:-0.3px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg-elev1);font-size:18px}
.btn-primary{width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#000;font-weight:800;font-size:16px}
.btn-secondary{width:100%;padding:13px;border-radius:14px;background:var(--bg-elev1);color:var(--text);font-weight:700;font-size:15px;border:1px solid var(--bg-elev2)}
.home-header{position:relative;padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
.home-header-left{display:flex;align-items:center;gap:10px}
.home-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000}
.home-greeting{font-size:13px;color:var(--text-dim);font-weight:600}
.home-name{font-size:18px;font-weight:800}
.home-version{font-size:10.5px;color:var(--text-faint);font-weight:700}
.master-dashboard{background:linear-gradient(145deg,rgba(200,255,61,0.06),var(--bg-elev));border:1px solid rgba(200,255,61,0.2);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px}
.md-title{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:4px}
.md-sub{font-size:12px;color:var(--text-faint);margin-bottom:12px}
.md-status{padding:14px;border-radius:var(--radius);margin-bottom:12px}
.md-status.good{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3)}
.md-status.warn{background:rgba(255,107,74,0.12);border:1px solid rgba(255,107,74,0.3)}
.md-status.accelerate{background:rgba(200,255,61,0.12);border:1px solid rgba(200,255,61,0.3)}
.md-status-icon{font-size:28px;margin-bottom:6px}
.md-status-label{font-size:18px;font-weight:800;margin-bottom:4px}
.md-status-action{font-size:14px;font-weight:700;margin-bottom:8px}
.md-status-reason{font-size:12.5px;color:var(--text-dim);line-height:1.45}
.md-now{padding:14px;border-radius:var(--radius);background:var(--bg-elev1);margin-bottom:12px}
.md-now-title{font-size:12px;font-weight:800;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px}
.md-now-score{font-size:32px;font-weight:900;color:var(--accent);line-height:1}
.md-now-reason{font-size:12.5px;color:var(--text-dim);margin-top:8px;line-height:1.45}
.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.feedback-btn{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--radius);background:var(--bg-elev);border:1px solid var(--bg-elev2);text-align:left}
.feedback-btn span:first-child{font-size:20px}
.feedback-btn b{font-size:13.5px;font-weight:800}
.feedback-btn small{font-size:11px;color:var(--text-faint)}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);border-top:1px solid var(--bg-elev2);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:10.5px;font-weight:700;color:var(--text-faint)}
.tab-btn.active{color:#000;background:var(--accent);border-radius:12px}
.tab-btn-icon{font-size:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.assistant-help-card{background:var(--bg-elev);border-radius:var(--radius-lg);width:100%;max-width:420px;max-height:85vh;display:flex;flex-direction:column;border:1px solid rgba(200,255,61,0.2)}
.assistant-chat-head{padding:16px;border-bottom:1px solid var(--bg-elev2);display:flex;align-items:center;gap:12px}
.assistant-chat-back{font-size:13px;font-weight:700;color:var(--text-dim);padding:8px 12px;border-radius:10px;background:var(--bg-elev1)}
.assistant-chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
.assistant-chat-head-main h2{font-size:16px;font-weight:800}
.assistant-chat-head-main p{font-size:11.5px;color:var(--text-faint)}
.assistant-chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.assistant-msg{max-width:85%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.assistant-msg.user{align-self:flex-end;background:var(--accent);color:#000;font-weight:600}
.assistant-msg.assistant{align-self:flex-start;background:var(--bg-elev1);border:1px solid var(--bg-elev2)}
.assistant-chat-input{padding:12px 16px;border-top:1px solid var(--bg-elev2);display:flex;gap:8px}
.assistant-chat-input input{flex:1;padding:11px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--bg-elev2);color:var(--text);font-size:14px}
.assistant-chat-input button{padding:11px 18px;border-radius:12px;background:var(--accent);color:#000;font-weight:800;font-size:14px}
.assistant-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.assistant-suggestion{padding:7px 12px;border-radius:10px;background:var(--bg-elev1);border:1px solid var(--bg-elev2);font-size:12px;font-weight:600}
.assistant-help-btn{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,255,61,0.35);z-index:90}
.progress-group{background:var(--bg-elev);border:1px solid var(--bg-elev2);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.group-title{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em}
/* Diagnóstico visible */
#diag-overlay{position:fixed;inset:0;background:#1a0000;color:#ff6b4a;padding:20px;font-family:monospace;font-size:13px;z-index:9999;overflow:auto;display:none}
#diag-overlay h2{color:#fff;margin-bottom:12px;font-size:18px}
#diag-overlay pre{white-space:pre-wrap;word-break:break-word;background:#000;padding:12px;border-radius:8px;margin:8px 0;color:#ffb84d}
#diag-overlay button{background:#c8ff3d;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center;color:#6B6F76;font-family:sans-serif">Cargando Forma 55...</div></div>
<div id="diag-overlay"></div>

<script>
// Captura global de errores ANTES de que React arranque
window.__forma55Errors = [];
window.onerror = function(msg, src, line, col, err) {
  window.__forma55Errors.push({ type: 'error', msg: String(msg), src: src, line: line, col: col, stack: err && err.stack });
  showDiag();
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  window.__forma55Errors.push({ type: 'promise', msg: String(e.reason), stack: e.reason && e.reason.stack });
  showDiag();
});

function showDiag() {
  var el = document.getElementById('diag-overlay');
  if (!el) return;
  var html = '<h2>⚠️ Forma 55 · Diagnóstico</h2>';
  html += '<p>Se ha detectado un error. Copia este texto y pégalo en el chat:</p>';
  html += '<pre>';
  html += 'UA: ' + navigator.userAgent + '\n';
  html += 'React: ' + (window.React ? React.version : 'NO CARGADO') + '\n';
  html += 'ReactDOM: ' + (window.ReactDOM ? 'OK' : 'NO CARGADO') + '\n';
  html += 'HTM: ' + (window.htm ? 'OK' : 'NO CARGADO') + '\n';
  html += 'Babel: ' + (window.Babel ? 'OK' : 'NO CARGADO') + '\n\n';
  html += 'ERRORES CAPTURADOS:\n';
  window.__forma55Errors.forEach(function(e, i) {
    html += '\n--- Error ' + (i+1) + ' (' + e.type + ') ---\n';
    html += 'Msg: ' + e.msg + '\n';
    if (e.src) html += 'Source: ' + e.src + '\n';
    if (e.line) html += 'Line: ' + e.line + ':' + e.col + '\n';
    if (e.stack) html += 'Stack:\n' + e.stack + '\n';
  });
  html += '</pre>';
  html += '<button onclick="navigator.clipboard.writeText(document.querySelector(\'#diag-overlay pre\').innerText).then(function(){alert(\'Copiado\')})">Copiar diagnóstico</button>';
  html += '<button onclick="location.reload()" style="margin-left:8px">Recargar</button>';
  el.innerHTML = html;
  el.style.display = 'block';
}

// Verificar que las dependencias cargaron
window.addEventListener('load', function() {
  setTimeout(function() {
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.htm) missing.push('HTM');
    if (!window.Babel) missing.push('Babel');
    if (missing.length) {
      window.__forma55Errors.push({ type: 'deps', msg: 'Dependencias no cargadas: ' + missing.join(', ') + '. Comprueba tu conexión a internet.' });
      showDiag();
    }
  }, 2000);
});
</script>

<script type="text/babel">
const { useState, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

const FORMA55_APP_VERSION = 'V252';
const STORAGE_KEY = 'forma55_state_v4';
const APP_SCHEMA_VERSION = 14;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) {
    window.__forma55Errors.push({ type: 'react', msg: error.message, stack: error.stack + '\n\n' + (info.componentStack || '') });
    showDiag();
  }
  render() {
    if (this.state.hasError) {
      return html`<div style="padding:20px;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <div style="font-size:48px">⚠️</div>
        <h2 style="font-size:20px;font-weight:800">Error en la app</h2>
        <p style="font-size:14px;color:var(--text-dim)">Tu progreso está guardado. Pulsa "Ver diagnóstico" para ver el error.</p>
        <button class="btn-primary" style="max-width:240px" onClick=${() => showDiag()}>Ver diagnóstico</button>
        <button class="btn-secondary" style="max-width:240px" onClick=${() => window.location.reload()}>Recargar</button>
      </div>`;
    }
    return this.props.children;
  }
}

function getRecentSessions(state, days = 7) {
  const cutoff = Date.now() - days * 86400000;
  return (state.sessionLog || []).filter(s => {
    const t = new Date(s.date || s.timestamp || '').getTime();
    return Number.isFinite(t) && t >= cutoff;
  });
}

function localDateKey(d = new Date()) { return d.toISOString().slice(0, 10); }

function buildHabitsKPIs(state, days = 35) {
  const cutoff = Date.now() - days * 86400000;
  const measurements = (state.measurements || []).filter(m => {
    const t = new Date(m.date).getTime();
    return Number.isFinite(t) && t >= cutoff;
  }).sort((a, b) => a.date.localeCompare(b.date));
  const recentSessions = getRecentSessions(state, days);
  const weightTrend = measurements.length >= 2 ? (measurements[measurements.length - 1].weightKg - measurements[0].weightKg) / measurements.length : null;
  const waistTrend = measurements.length >= 2 ? (measurements[measurements.length - 1].waistCm - measurements[0].waistCm) / measurements.length : null;
  return { measurements, recentSessions, weightTrend, waistTrend, sessionCount: recentSessions.length };
}

function getTransformationEngine(state) {
  const kpi = buildHabitsKPIs(state, 42);
  const weightRate = kpi.weightTrend != null ? kpi.weightTrend * 7 : null;
  const waistRate = kpi.waistTrend != null ? kpi.waistTrend * 7 : null;
  let action = 'Mantener', score = 65;
  if (waistRate != null && waistRate < -0.3 && weightRate != null && weightRate > -0.5) { action = 'Progresar'; score = 80; }
  else if (waistRate != null && waistRate > 0.2) { action = 'Frenar'; score = 50; }
  return { action, score, weightRate, waistRate };
}

function getAestheticPriorityIndex(state) {
  const t = getTransformationEngine(state);
  return { score: t.score, focusLabel: 'Transformación estética', block: 'Definición inteligente' };
}

function recommendRounds(state) {
  const phase = state.cycleWeek || 1;
  const baseRounds = phase === 4 ? 2 : 3;
  const recent = getRecentSessions(state, 7);
  const avgRpe = recent.length ? recent.reduce((s, x) => s + (x.avgRpe || 7), 0) / recent.length : 7;
  let rec = baseRounds;
  const reasons = [];
  if (avgRpe <= 6.5 && phase !== 4) { rec = Math.min(5, baseRounds + 1); reasons.push('RPE bajo reciente'); }
  else if (avgRpe >= 8.5) { rec = Math.max(2, baseRounds - 1); reasons.push('RPE alto reciente'); }
  return { rounds: rec, reason: reasons.join(' + ') || 'Dosis base', avgRpe };
}

function computeReadinessScore(r) {
  if (!r || typeof r !== 'object') return null;
  const v = Object.values(r).filter(Number.isFinite);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function getTodayReadiness(state) { return state.readinessLog?.[localDateKey()] || null; }

function HomeScreen({ state, onOpenIndicators, onStartCircuit }) {
  const t = useMemo(() => getTransformationEngine(state), [state]);
  const r = useMemo(() => recommendRounds(state), [state]);
  const readiness = getTodayReadiness(state);
  const rs = computeReadinessScore(readiness);
  return html`
    <div class="screen">
      <header class="home-header">
        <div class="home-header-left">
          <div class="home-avatar">F</div>
          <div><div class="home-greeting">Buenos días</div><div class="home-name">Alex</div></div>
        </div>
        <span class="home-version">${FORMA55_APP_VERSION}</span>
      </header>
      <section class="master-dashboard">
        <p class="md-title">Decisión de hoy</p>
        <p class="md-sub">Una única lectura del sistema</p>
        <div class=${`md-status ${t.action === 'Progresar' ? 'accelerate' : t.action === 'Frenar' ? 'warn' : 'good'}`}>
          <div class="md-status-icon">${t.action === 'Progresar' ? '🚀' : t.action === 'Frenar' ? '⚠️' : '✅'}</div>
          <div class="md-status-label">${t.action}</div>
          <div class="md-status-action">${r.rounds} ${r.rounds === 1 ? 'vuelta' : 'vueltas'} · ${r.reason}</div>
          <div class="md-status-reason">${rs != null ? `Readiness: ${rs.toFixed(1)}/5` : 'Sin readiness hoy'}</div>
        </div>
        <div class="md-now">
          <div class="md-now-title">Índice de transformación</div>
          <div class="md-now-score">${t.score}/100</div>
          <div class="md-now-reason">
            ${t.weightRate != null ? `Peso: ${t.weightRate > 0 ? '+' : ''}${t.weightRate.toFixed(2)} kg/sem` : 'Sin tendencia'}
            ${t.waistRate != null ? ` · Cintura: ${t.waistRate > 0 ? '+' : ''}${t.waistRate.toFixed(2)} cm/sem` : ''}
          </div>
        </div>
        <button class="btn-primary" onClick=${onStartCircuit}>Empezar circuito</button>
        <button class="btn-secondary" style="margin-top:10px" onClick=${onOpenIndicators}>Ver indicadores</button>
      </section>
      <div class="feedback-grid">
        <button class="feedback-btn" onClick=${() => alert('Registro de preparación')}>
          <span>🔋</span><b>Preparación</b><small>${readiness ? 'Registrada' : 'Pendiente'}</small>
        </button>
        <button class="feedback-btn" onClick=${() => alert('Registro de dolor')}>
          <span>🩹</span><b>Dolor</b><small>${state.painLog?.[localDateKey()] ? 'Registrado' : 'Sin dolor'}</small>
        </button>
      </div>
    </div>`;
}

function IndicatorsScreen({ state, onBack }) {
  const a = useMemo(() => getAestheticPriorityIndex(state), [state]);
  const t = useMemo(() => getTransformationEngine(state), [state]);
  return html`
    <div class="screen">
      <header class="sub-header">
        <button class="icon-btn" onClick=${onBack}>←</button>
        <h1>Indicadores</h1>
      </header>
      <div class="progress-group">
        <p class="group-title">🎯 Índice estético</p>
        <div style="font-size:32px;font-weight:900;color:var(--accent);margin:10px 0">${a.score}/100</div>
        <p style="font-size:12.5px;color:var(--text-faint)">${a.focusLabel} · ${a.block}</p>
      </div>
      <div class="progress-group">
        <p class="group-title">📊 Transformación</p>
        <div style="font-size:32px;font-weight:900;color:var(--accent);margin:10px 0">${t.score}/100</div>
        <p style="font-size:12.5px;color:var(--text-faint)">Acción: ${t.action}</p>
      </div>
    </div>`;
}

function AssistantModal({ open, onClose, state }) {
  const [msgs, setMsgs] = useState([{ role: 'assistant', text: 'Hola Alex. ¿En qué puedo ayudarte?' }]);
  const [input, setInput] = useState('');
  const send = () => {
    if (!input.trim()) return;
    setMsgs(p => [...p, { role: 'user', text: input }]);
    let r = 'Entendido. Estoy procesando tu consulta.';
    if (/qué hago|que hago|qué me toca|que me toca/i.test(input)) {
      const rr = recommendRounds(state);
      r = `Te toca hacer ${rr.rounds} ${rr.rounds === 1 ? 'vuelta' : 'vueltas'}. ${rr.reason}.`;
    } else if (/cómo voy|como voy|progreso/i.test(input)) {
      const tt = getTransformationEngine(state);
      r = `Tu índice de transformación está en ${tt.score}/100. Acción: ${tt.action}.`;
    }
    setTimeout(() => setMsgs(p => [...p, { role: 'assistant', text: r }]), 400);
    setInput('');
  };
  if (!open) return null;
  return html`
    <div class="modal-overlay" onClick=${onClose}>
      <div class="assistant-help-card" onClick=${e => e.stopPropagation()}>
        <header class="assistant-chat-head">
          <button class="assistant-chat-back" onClick=${onClose}>← Volver</button>
          <div class="assistant-chat-avatar">🤖</div>
          <div class="assistant-chat-head-main"><h2>Forma 55 · Asistente</h2><p>V252</p></div>
        </header>
        <div class="assistant-chat-body">
          ${msgs.map(m => html`<div class=${`assistant-msg ${m.role}`}>${m.text}</div>`)}
        </div>
        <div class="assistant-suggestions">
          <button class="assistant-suggestion" onClick=${() => setInput('¿Qué hago ahora?')}>¿Qué hago ahora?</button>
          <button class="assistant-suggestion" onClick=${() => setInput('¿Cómo voy?')}>¿Cómo voy?</button>
        </div>
        <div class="assistant-chat-input">
          <input value=${input} onChange=${e => setInput(e.target.value)} onKeyPress=${e => e.key === 'Enter' && send()} placeholder="Pregunta algo..." />
          <button onClick=${send}>Enviar</button>
        </div>
      </div>
    </div>`;
}

function App() {
  const [screen, setScreen] = useState('home');
  const [asst, setAsst] = useState(false);
  const [state] = useState(() => {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) { const p = JSON.parse(s); p.schemaVersion = APP_SCHEMA_VERSION; return p; }
    } catch (e) { console.warn('Forma55: error leyendo estado guardado', e); }
    return {
      schemaVersion: APP_SCHEMA_VERSION,
      sessionLog: [],
      measurements: [{ date: '2026-09-23', weightKg: 67.5, waistCm: 86, armCm: 33, chestCm: 101.5 }],
      readinessLog: {}, painLog: {}, nutritionPhase: 'deficit_activo', cycleWeek: 1
    };
  });
  return html`
    <${ErrorBoundary}>
      ${screen === 'home' && html`<${HomeScreen} state=${state} onOpenIndicators=${() => setScreen('indicators')} onStartCircuit=${() => alert('Iniciando circuito')} />`}
      ${screen === 'indicators' && html`<${IndicatorsScreen} state=${state} onBack=${() => setScreen('home')} />`}
      <${AssistantModal} open=${asst} onClose=${() => setAsst(false)} state=${state} />
      <button class="assistant-help-btn" onClick=${() => setAsst(true)}>🤖</button>
      <nav class="tab-bar">
        <button class=${`tab-btn ${screen === 'home' ? 'active' : ''}`} onClick=${() => setScreen('home')}>
          <span class="tab-btn-icon">🏠</span>Inicio
        </button>
