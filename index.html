// Semáforo de salubridad: verde = ayuda al objetivo (recuperación,
// saciedad, densidad nutricional), amarillo = neutro/moderación, rojo =
// entorpece el ritmo de recuperación o el déficit (alcohol, ultraprocesado,
// azúcar añadida sin apenas proteína/fibra). Es un criterio de "para ESTE
// plan", no una etiqueta médica general.
function semaforoEmoji(color) {
  return color === 'verde' ? '🟢' : color === 'amarillo' ? '🟡' : color === 'rojo' ? '🔴' : '';
}
function foodKcal(food, amount) {
  if (!food) return 0;
  return food.unit === 'ud' ? Math.round(food.kcalPerUnit * amount) : Math.round(food.kcalPer100 * amount / 100);
}
function foodProtein(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.proteinPerUnit || 0) * amount : (food.proteinPer100 || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
// Carbohidrato/grasa/fibra por ración — mismo patrón que foodProtein.
// Todos los alimentos de FOOD_DB ya llevan carbG/fatG/fiberG por 100g
// (o por unidad, para los que usan kcalPerUnit) desde la ampliación de
// macros completos (agosto 2026).
function foodCarb(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.carbG || 0) * amount : (food.carbG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
function foodFat(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.fatG || 0) * amount : (food.fatG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
function foodFiber(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.fiberG || 0) * amount : (food.fiberG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
// Normalización no destructiva de registros históricos: si una entrada
// antigua tiene foodId y cantidad pero no carb/fat/fiber, los recuperamos
// automáticamente desde FOOD_DB al mostrar/calcular. No se reescribe el
// histórico hasta que el usuario vuelva a guardar esa comida.
function normalizeFoodItem(item) {
  if (!item) return item;
  const resolvedId = item.foodId || FOOD_LEGACY_ALIASES[String(item.name || '').trim()];
  if (!resolvedId) return item;
  const food = FOOD_DB.find(f => f.id === resolvedId);
  if (!food || !item.amount) return item;
  return {
    ...item,
    foodId: item.foodId || resolvedId,
    carbG: item.carbG != null ? item.carbG : foodCarb(food, Number(item.amount) || 0),
    fatG: item.fatG != null ? item.fatG : foodFat(food, Number(item.amount) || 0),
    fiberG: item.fiberG != null ? item.fiberG : foodFiber(food, Number(item.amount) || 0)
  };
}

// Total real de una comida a partir de los alimentos añadidos con el
// calculador (calEntry.realFoods[mealKey]) — si el usuario ha metido al
// menos un alimento ahí, ese total manda sobre la estimación fija del
// plan (checkbox), porque es más preciso.
function mealRealKcal(calEntry, mealKey) {
  const items = calEntry.realFoods && calEntry.realFoods[mealKey];
  if (!items || !items.length) return null;
  return items.reduce((sum, it) => sum + it.kcal, 0);
}
function mealDisplayKcal(calEntry, mealKey, planChecked, planKcal) {
  const real = mealRealKcal(calEntry, mealKey);
  if (real != null) return real;
  return planChecked ? planKcal : 0;
}
// Mismo mecanismo que mealDisplayKcal pero para proteína: antes solo
// sumaba si usabas la calculadora manual, lo que causaba el bug real de
// "0g de proteína" aunque hubieras marcado todas las comidas del plan.
// Ahora, igual que con las kcal, marcar el check usa la estimación de
// proteína de esa comida (planProteinG) si no has registrado el detalle
// real — consistente en los dos sitios en vez de solo en uno.
function mealRealProtein(calEntry, mealKey) {
  const items = calEntry.realFoods && calEntry.realFoods[mealKey];
  if (!items || !items.length) return null;
  return Math.round(items.reduce((sum, it) => sum + (it.proteinG || 0), 0) * 10) / 10;
}
function mealDisplayProtein(calEntry, mealKey, planChecked, planProteinG) {
  const real = mealRealProtein(calEntry, mealKey);
  if (real != null) return real;
  return planChecked ? (planProteinG || 0) : 0;
}

// Totales nutricionales de un día: ÚNICA fuente para Nutrición, Hábitos y
// el dashboard. Una comida marcada como "seguí el plan" usa la estimación
// del plan; si tiene alimentos reales registrados, esos sustituyen esa comida.
// Así los tres apartados muestran exactamente el mismo dato y no hay dos
// cálculos distintos que puedan desincronizarse.
function getDayNutritionTotals(state, key) {
  const calEntry = (state.calorieLog && state.calorieLog[key]) || { meals:{}, realFoods:{} };
  const d = new Date(key + 'T00:00:00');
  const jsDay = d.getDay();
  const isoDay = jsDay === 0 ? 7 : jsDay;
  const dayPlan = getScaledPlanDay(state, NUTRITION_PLAN.find(p => p.day === isoDay));
  if (!dayPlan) return null;
  const mealItems = [
    { key:'breakfast', kcal:NUTRITION_COFFEE.kcal, proteinG:NUTRITION_COFFEE.proteinG },
    { key:'midMorning', kcal:dayPlan.midMorningKcal, proteinG:dayPlan.midMorningProteinG },
    { key:'lunch', kcal:dayPlan.lunchKcal, proteinG:dayPlan.lunchProteinG },
    { key:'merienda', kcal:NUTRITION_MERIENDA.kcal, proteinG:NUTRITION_MERIENDA.proteinG },
    { key:'dinner', kcal:dayPlan.dinnerKcal, proteinG:dayPlan.dinnerProteinG }
  ].map(m => ({...m, planMacros:planMealMacros(dayPlan.day,m.key)}));
  let kcal=0, protein=0, carb=0, fat=0, fiber=0, any=false;
  mealItems.forEach(m => {
    const checked=!!(calEntry.meals && calEntry.meals[m.key]);
    const realItems=(calEntry.realFoods && calEntry.realFoods[m.key]) || [];
    if (checked || realItems.length) any=true;
    kcal += mealDisplayKcal(calEntry,m.key,checked,m.kcal);
    protein += mealDisplayProtein(calEntry,m.key,checked,m.proteinG);
    const mm=mealDisplayMacros(calEntry,m.key,checked,m.planMacros);
    carb += mm.carbG; fat += mm.fatG; fiber += mm.fiberG;
  });
  kcal += Number(calEntry.extraKcal) || 0;
  return {
    kcalTotal: any || (Number(calEntry.extraKcal)||0)>0 ? Math.round(kcal*10)/10 : null,
    kcalTarget: dayPlan.kcal,
    proteinTotal: any ? Math.round(protein*10)/10 : null,
    carbTotal: any ? Math.round(carb*10)/10 : null,
    fatTotal: any ? Math.round(fat*10)/10 : null,
    fiberTotal: any ? Math.round(fiber*10)/10 : null,
    dayPlan,
    hasFoodOrPlan: any
  };
}

// Objetivo de proteína revisado de 155g a 145g (2,07 g/kg): 155g exigía
// raciones de carne/pescado poco realistas para llegar solo con comida
// "normal". 145g sigue en la parte alta del rango recomendado (1,6-2,2
// g/kg) para preservar músculo en déficit a los 55 años, y es alcanzable
// de verdad con el plan + el desayuno de claras/huevo + el snack
// post-entreno de comida real (ver NUTRITION_SNACK) — sin depender de
// suplementos, todo con alimentos normales de alta eficiencia
// proteína/kcal (claras, gambas, pavo/pollo en lonchas).
// Hidratación — parámetro añadido a petición expresa (agosto 2026).
// Relevante de verdad para este plan, no un genérico "bebe agua":
// - Construcción muscular: el músculo es ~75% agua; la síntesis proteica
//   y el transporte de nutrientes al músculo dependen de buena hidratación.
// - Pérdida de grasa: la deshidratación, aunque sea leve, se confunde con
//   hambre con facilidad — riesgo real de comer de más sin necesitarlo
//   estando en déficit.
// - Entrenamiento 6 días/semana + descompresión en barra: más pérdida por
//   sudor de lo que cubre la referencia genérica de un adulto sedentario.
// Fórmula: ~35ml/kg de peso corporal (referencia estándar para adulto
// activo) + 500ml extra los días de entreno por la sudoración añadida.
// No es una prescripción médica — ajusta a la baja si tienes alguna
// restricción de líquidos indicada por un profesional.
function computeWaterTargetMl(weightKg, isTrainingDay) {
  const base = Math.round((weightKg || 68) * 35);
  return base + (isTrainingDay ? 500 : 0);
}

const NUTRITION_TARGETS = { kcal: 1760, proteinG: 145, fatG: 58, carbG: 154, fiberG: 32, bmr: 1460, tdee: 2260 };
// =====================================================================
// Fase 3 (roadmap) — BMR/TDEE DINÁMICO
// NUTRITION_TARGETS.bmr/tdee eran una constante estática calculada en su
// día con Mifflin-St Jeor para el peso de partida (BIOTYPE.weightKg=70).
// A medida que el sujeto pierde peso real, su BMR/TDEE real baja también
// — comparar el déficit real contra un TDEE desactualizado desvía
// lentamente la comparación real-vs-objetivo con el paso de los meses.
// getDynamicBMR recalcula BMR con Mifflin-St Jeor usando la ÚLTIMA
// medición de peso real (cae de vuelta a BIOTYPE.weightKg si aún no hay
// ninguna), conservando altura/edad/sexo (no cambian) y el mismo factor
// de actividad implícito ya usado en el diseño original
// (TDEE/BMR ≈ 1.548 ≈ actividad moderada-alta, coherente con ~6
// sesiones/semana) — no se inventa un multiplicador nuevo.
// No cambia la fase elegida por el usuario ni las kcal ya registradas:
// solo hace que el objetivo calculado siga siendo fiel al cuerpo real.
// =====================================================================
function getDynamicBMR(state) {
  const weights = ((state && state.measurements) || [])
    .filter(m => m && m.date && Number.isFinite(Number(m.weightKg)))
    .sort((a, b) => a.date.localeCompare(b.date));
  const weightKg = weights.length ? Number(weights[weights.length - 1].weightKg) : BIOTYPE.weightKg;
  const ageYears = getCurrentAgeYears();
  const bmr = Math.round(10 * weightKg + 6.25 * BIOTYPE.heightCm - 5 * ageYears + 5);
  const activityFactor = NUTRITION_TARGETS.tdee / NUTRITION_TARGETS.bmr;
  const tdee = Math.round(bmr * activityFactor);
  return { bmr, tdee, weightUsed: weightKg };
}
// =====================================================================
// V79 — VENTANAS TEMPORALES CANÓNICAS (BLOQUE DE ROBUSTEZ)
// Antes cada motor usaba su propio número de días "a ojo" (7/14/21/28/30/
// 35/42 repartidos sin criterio único). Se fija un único vocabulario para
// las 4 ventanas que sí tienen un significado nutricional/físico distinto;
// las ventanas de volumen de entrenamiento (7/14 días, "exposiciones
// recientes por familia muscular") son un concepto distinto y deliberadamente
// no se tocan aquí para no cambiar el comportamiento ya validado de esas
// tarjetas.
const FORMA55_WINDOWS = {
  DEFICIT_DAYS: 7,          // déficit calórico real (buildHabitsKPIs → deficitAvg7)
  BODY_TREND_DAYS: 35,      // tendencia de peso/cintura (real vs previsto)
  TRANSFORMATION_DAYS: 42,  // motor de transformación (weightRate/waistRate/rendimiento)
  AESTHETIC_DAYS: 28,       // checkpoint visual / prioridad estética consolidada
};


// =====================================================================
// V99 — CONTINUIDAD INTELIGENTE / REENTRADA TRAS PAUSAS
// No reinicia niveles ni borra historial. Detecta pausas reales a partir de
// sessionLog (excluye standalone) y propone una reentrada temporal para que
// el sujeto vuelva al rendimiento previo lo antes posible SIN volver de
// golpe al volumen anterior. La recomendación se recalcula cada render con
// los datos nuevos.
// =====================================================================
function getContinuityState(state) {
  const records = (state?.sessionLog || [])
    .filter(x => x && x.date && !x.standalone)
    .map(x => localDateKey(new Date(x.date)))
    .filter(Boolean);
  const dates = [...new Set(records)].sort();
  const today = localDateKey();
  const dayDiff = (a,b) => Math.max(0, Math.round((new Date(b+'T00:00:00').getTime() - new Date(a+'T00:00:00').getTime()) / 86400000));

  if (!dates.length) {
    return { lastTrainingDate:null, gapDays:null, active:false, stage:'sin_historial',
      sessionsAfterBreak:0, reentrySessionsRemaining:0, reason:'Aún no hay sesiones reales suficientes para evaluar una pausa.' };
  }

  const lastTrainingDate = dates[dates.length - 1];
  const gapDays = dayDiff(lastTrainingDate, today);

  let latestBreak = null;
  for (let i=1;i<dates.length;i++) {
    const gap = dayDiff(dates[i-1], dates[i]) - 1;
    if (gap >= 7) latestBreak = { start:dates[i-1], end:dates[i], days:gap };
  }

  let sessionsAfterBreak = 0;
  if (latestBreak) sessionsAfterBreak = dates.filter(d => d > latestBreak.end && d <= today).length;

  let stage='continuidad_normal';
  if (gapDays >= 28) stage='pausa_prolongada';
  else if (gapDays >= 14) stage='pausa_moderada';
  else if (gapDays >= 7) stage='pausa_corta';
  else if (latestBreak && sessionsAfterBreak < 2) stage='reentrada_activa';

  const active = stage !== 'continuidad_normal';
  let reentrySessionsRemaining = 0;
  if (stage === 'pausa_corta' || stage === 'pausa_moderada' || stage === 'pausa_prolongada') {
    reentrySessionsRemaining = 2;
  } else if (stage === 'reentrada_activa') {
    reentrySessionsRemaining = Math.max(0, 2 - sessionsAfterBreak);
  }

  const reason = stage==='pausa_prolongada'
    ? `Llevas ${gapDays} días sin una sesión real. Conviene una reentrada de 2 sesiones antes de recuperar el volumen habitual.`
    : stage==='pausa_moderada'
      ? `Llevas ${gapDays} días sin una sesión real. La mejor vía rápida es recuperar técnica y tolerancia antes de volver al volumen previo.`
      : stage==='pausa_corta'
        ? `Llevas ${gapDays} días sin una sesión real. Una reducción breve de volumen permite recuperar el ritmo sin perder tiempo.`
        : stage==='reentrada_activa'
          ? `Has vuelto tras una pausa de ${latestBreak?.days || 7} días. Quedan ${reentrySessionsRemaining} sesión(es) de reentrada antes de liberar el volumen habitual.`
          : 'Continuidad normal: no hay una pausa reciente que justifique una reentrada.';

  return { lastTrainingDate, gapDays, active, stage, latestBreak,
    sessionsAfterBreak, reentrySessionsRemaining, reason };
}

// =====================================================================
// V99 — MOTOR LONGITUDINAL DE ESTADO
// Une continuidad, reentrada, recuperación, rendimiento, composición y
// objetivo estético en UNA máquina de estados. No borra historial ni
// reescribe niveles/pesos/fase nutricional: recalcula el estado actual y
// devuelve la acción más rápida y segura para volver al nivel previo.
// Estados: continuidad → pausa → reentrada → recuperación → progresión →
// zona_objetivo → mantenimiento → ganancia_controlada.
// La edad actualiza BMR/TDEE; no se aplica una "penalización por edad"
// arbitraria: solo aumenta la prudencia cuando coincide con señales reales
// de recuperación/rendimiento.
// =====================================================================
function getLongitudinalState(state){
  const s=state||{};
  try{
    const continuity=getContinuityState(s);
    const recovery=getRecoveryTrend(s);
    const todayReadiness=getTodayReadiness(s);
    const readinessScore=computeReadinessScore(todayReadiness);
    const perf=getPerformanceStability(s,60);
    const comp=getCompositionMotor(s);
    const transform=getTransformationEngine(s);
    const maintenance=getMaintenanceReadiness(s);
    const confidence=getDataConfidenceControl(s);
    const dynamic=getDynamicBMR(s);

    const today=localDateKey();
    const painRaw=s.painLog?.[today];
    const painRecorded=Object.prototype.hasOwnProperty.call(s.painLog||{},today);
    const painBad=painRecorded && painRaw && !['none','sin dolor','Sin dolor relevante'].includes(String(painRaw));

    const recoveryScore=Number.isFinite(recovery?.currentScore) ? recovery.currentScore*5 : readinessScore;
    const recoveryLow=Number.isFinite(recoveryScore) && recoveryScore<3.0;
    const performanceWatch=perf?.state==='watch' || perf?.state==='unstable' || perf?.state==='A vigilar';
    const muscleRisk=!!transform?.muscleRisk;
    const enough=confidence.score>=65;
    const targetReached=maintenance.status==='candidato_mantenimiento';

    // La reentrada tiene prioridad mientras exista una pausa activa. Si el
    // usuario vuelve y responde bien, se libera antes: no obligamos a esperar
    // una "cuarentena" fija cuando los datos ya demuestran tolerancia.
    if(continuity.active){
      if(painBad || recoveryLow || performanceWatch){
        return {state:'reentrada_protegida',label:'Reentrada protegida',priority:'alta',
          action:'Reentrada con volumen reducido. Mantén la carga conocida, prioriza técnica y vuelve a valorar tras la próxima sesión.',
          reason:painBad?'Hay una señal de molestia hoy.':recoveryLow?'La recuperación reciente está baja.':'El rendimiento reciente aún no está estable.',
          continuity,recoveryScore,readinessScore,dynamic,confidenceScore:confidence.score};
      }
      if(continuity.reentrySessionsRemaining>0){
        return {state:'reentrada_activa',label:'Reentrada activa',priority:'alta',
          action:`Completa la reentrada prevista. Quedan ${continuity.reentrySessionsRemaining} sesión(es); si el rendimiento y la recuperación siguen estables, se libera progresivamente el volumen.`,
          reason:continuity.reason,continuity,recoveryScore,readinessScore,dynamic,confidenceScore:confidence.score};
      }
    }

    if(painBad){
      return {state:'recuperacion_por_senal',label:'Recuperación por señal',priority:'alta',
        action:'Reduce exigencia hoy y usa el registro de molestias. No compenses la sesión perdida aumentando volumen después.',
        reason:'La señal de dolor/molestia tiene prioridad sobre la progresión.',
        continuity,recoveryScore,readinessScore,dynamic,confidenceScore:confidence.score};
    }

    if(recoveryLow || performanceWatch || muscleRisk){
      return {state:'recuperacion',label:'Recuperación y estabilización',priority:'alta',
        action:'Mantén el nivel actual y prioriza sueño, técnica y calidad de ejecución. La progresión se reabre cuando las señales vuelvan a estabilizarse.',
        reason:muscleRisk?'El motor detecta riesgo de pérdida muscular.':recoveryLow?'La recuperación está por debajo del nivel deseable.':'El rendimiento reciente necesita estabilización.',
        continuity,recoveryScore,readinessScore,dynamic,confidenceScore:confidence.score};
    }

    if(targetReached){
      return {state:'mantenimiento',label:'Zona de mantenimiento',priority:'media',
        action:'Revisa pasar a mantenimiento. El motor no cambia la fase nutricional por sí solo; propone el cambio cuando las medidas y el rendimiento lo respaldan.',
        reason:'Las señales corporales y de rendimiento ya encajan con la zona de mantenimiento prudente.',
        continuity,recoveryScore,readinessScore,dynamic,confidenceScore:confidence.score};
    }

    // "progresión" exige datos suficientes; con baja confianza no inventamos
    // velocidad. La recomendación sigue siendo continuar y medir.
    if(!enough){

function getMaintenanceReadiness(state) {
  try {
    const s=state||{};
    const measurements=[...(s.measurements||[])].filter(m=>m&&m.date).sort((a,b)=>a.date.localeCompare(b.date));
    const waist=measurements.filter(m=>Number.isFinite(Number(m.waistCm)));
    const weight=measurements.filter(m=>Number.isFinite(Number(m.weightKg)));
    const arm=measurements.filter(m=>Number.isFinite(Number(m.armCm)));
    const chest=measurements.filter(m=>Number.isFinite(Number(m.chestCm)));
    const targets=computeAestheticTargets(BIOTYPE.heightCm);
    // "Zona de mantenimiento" no es el target estético exacto: es una banda
    // prudente alrededor de él. Evita esperar a una cifra perfecta o usar el
    // peso como proxy de grasa corporal sin una medición de composición.
    const waistZoneMax=Math.max(targets.waistTarget+6, BIOTYPE.heightCm*0.50);
    const waistZoneMin=Math.max(55, targets.waistTarget-2);
    const lastWaist=waist[waist.length-1]?.waistCm;
    const lastWeight=weight[weight.length-1]?.weightKg;
    const recent21=waist.filter(m => {
      const t=new Date(m.date+'T00:00:00').getTime();
      return Date.now()-t<=21*86400000;
    });
    const waistRate=recent21.length>=2 ? (recent21[recent21.length-1].waistCm-recent21[0].waistCm) / Math.max(1,(new Date(recent21[recent21.length-1].date)-new Date(recent21[0].date))/86400000) * 7 : null;

    const lastArm=arm[arm.length-1]?.armCm;
    const firstArm=arm.length>=2 ? arm[arm.length-2]?.armCm : null;
    const lastChest=chest[chest.length-1]?.chestCm;
    const firstChest=chest.length>=2 ? chest[chest.length-2]?.chestCm : null;
    const muscleStable = (firstArm==null || lastArm-firstArm >= -0.5) && (firstChest==null || lastChest-firstChest >= -0.5);

    const confidence = typeof getDataConfidenceControl==='function' ? getDataConfidenceControl(s) : {score:50};
    const perf = typeof getPerformanceStability==='function' ? getPerformanceStability(s,60) : {state:'tracking'};
    const comp = typeof getCompositionMotor==='function' ? getCompositionMotor(s) : {actual:null};
    const enough = waist.length>=3 && measurements.length>=3 && confidence.score>=65;
    const waistInZone = Number.isFinite(lastWaist) && lastWaist>=waistZoneMin && lastWaist<=waistZoneMax;
    const stabilizing = waistRate==null || waistRate>-0.35;
    const performanceOK = !perf || ['stable','tracking','initial'].includes(perf.state);
    const noMuscleRisk = !(getTransformationEngine(s)?.muscleRisk);
    const candidate = enough && waistInZone && stabilizing && muscleStable && performanceOK && noMuscleRisk;

    let status='seguir_definiendo', label='Seguir definiendo';
    if (!enough) { status='datos_insuficientes'; label='Necesitamos más datos'; }
    else if (candidate) { status='candidato_mantenimiento'; label='Candidato a mantenimiento'; }
    else if (Number.isFinite(lastWaist) && lastWaist<=waistZoneMax+3) { status='acercandose'; label='Acercándose a la zona'; }

    const distance = Number.isFinite(lastWaist) ? Math.max(0,lastWaist-waistZoneMax) : null;
    let action;
    if (status==='datos_insuficientes') action='Sigue registrando cintura, peso y rendimiento; todavía no conviene decidir un cambio de fase.';
    else if (candidate) action='Revisa pasar a Mantenimiento. La app lo propone, pero nunca cambia la fase automáticamente.';
    else if (distance!=null) action=`Aún faltan aproximadamente ${distance.toFixed(1)} cm de cintura para entrar en la zona de mantenimiento prudente.`;
    else action='Mantén el proceso actual y sigue acumulando medidas comparables.';

    return {status,label,candidate,measurementsCount:measurements.length,waistCount:waist.length,lastWaist,lastWeight,
      waistTarget:targets.waistTarget,waistZoneMin,waistZoneMax,waistDistance:distance,waistRate7:waistRate,
      muscleStable,performanceOK,noMuscleRisk,confidenceScore:confidence.score,phase:s.nutritionPhase||'deficit_activo',
      actualDeficit:comp.actual,action};
  } catch(e) {
    console.warn('Forma55 V99 maintenance readiness skipped:',e);
    return {status:'datos_insuficientes',label:'Necesitamos más datos',candidate:false,action:'No se pudo calcular la recomendación sin inventar datos.'};
  }
}

// F — Fases de nutrición (no mantener un déficit fijo indefinidamente).
// El objetivo de kcal ya no es un único número fijo para siempre: son 4
// fases posibles sobre el mismo TDEE base, y el usuario elige cuál aplica
// desde Ajustes cuando lo decide (nunca se cambia solo/automáticamente —
// mismo principio que readiness/volumeBalancing: el motor SUGIERE, la
// persona decide). La proteína se mantiene igual entre fases (prioridad
// de preservar músculo, no varía con el objetivo calórico); grasa se fija
// en ~30% de las kcal de la fase y el carbohidrato absorbe el resto.
const NUTRITION_PHASES = {
  deficit_activo:      { label: 'Déficit activo',       kcalDelta: -500, desc: 'Fase actual del plan: pérdida de grasa a ritmo sostenido (~500kcal/día por debajo del gasto estimado).' },

  mantenimiento:        { label: 'Mantenimiento',        kcalDelta: 0,    desc: 'Kcal ≈ gasto estimado. Pausa activa de la pérdida de grasa: consolidar, recuperar señales hormonales/sueño, sin ganar ni perder.' },
  ganancia_controlada:  { label: 'Ganancia controlada',  kcalDelta: 250,  desc: 'Ligero superávit — solo si el objetivo pasa a priorizar ganancia de músculo sobre seguir bajando grasa.' },

function getNutritionTargets(state) {
  const phaseKey = (state && state.nutritionPhase) || 'deficit_activo';
  const dyn = getDynamicBMR(state);
  const delta = phaseKey === 'deficit_activo' || !NUTRITION_PHASES[phaseKey] ? -500 : NUTRITION_PHASES[phaseKey].kcalDelta;
  const kcal = Math.max(1400, dyn.tdee + delta);

  return { kcal, proteinG, fatG, carbG, fiberG: NUTRITION_TARGETS.fiberG, bmr: dyn.bmr, tdee: dyn.tdee, phaseKey: NUTRITION_PHASES[phaseKey] ? phaseKey : 'deficit_activo' };

function getScaledPlanDay(state, dayPlan) {
  if (!dayPlan) return dayPlan;
  const targets = getNutritionTargets(state);
  if (targets.phaseKey === 'deficit_activo') return dayPlan;
  const factor = targets.kcal / NUTRITION_TARGETS.kcal;
  return {
    ...dayPlan,
    kcal: Math.round(dayPlan.kcal * factor),
    lunchKcal: Math.round(dayPlan.lunchKcal * factor),
    midMorningKcal: Math.round(dayPlan.midMorningKcal * factor),
    dinnerKcal: Math.round(dayPlan.dinnerKcal * factor),
    scaledFromDeficitActivo: true,
    scaleFactor: factor,
    originalKcal: dayPlan.kcal,
  };
}

// =====================================================================
// SINCRONIZACIÓN ENTRE DISPOSITIVOS — sin servidor de terceros.
// Se probó primero con jsonblob.com (almacenamiento JSON público), pero
// se detectó que su API ya no es fiable para este uso: la creación
// devolvía un identificador con apariencia válida que después no existía
// al consultarlo (probablemente por un cambio reciente en su servicio).
// En vez de depender de un tercero que puede fallar sin previo aviso, el
// propio código/QR contiene el progreso esencial codificado en base64 —
// no hay ninguna petición de red de por medio, así que no puede fallar
// por falta de conexión ni por que un servidor externo esté caído.
// Para mantener el código manejable (cabe en un QR sin problema), solo
// incluye lo esencial para continuar el plan en otro dispositivo: niveles
// de cada ejercicio, semana del ciclo, peso de mancuernas/mochila, ritmo
// y vueltas por día. El historial detallado de sesiones pasadas (fechas,
// calorías, duración) NO cabe de forma razonable en un código para
// escribir o escanear, así que para llevarlo completo se usa el archivo
// de exportación/importación (ver ExportImportBlock), que sí lo incluye
// todo sin límite de tamaño.
// =====================================================================
const QUICK_SYNC_FIELDS = ['cycleWeek', 'totalSessionsDone', 'roundsPerDay', 'pace', 'dumbbellWeight', 'backpackWeight', 'equipment', 'exerciseLevels', 'exerciseWeights', 'lastWeightReviewDate', 'weightReviewDue', 'weightReviewSnoozeUntil', 'postureCheckins', 'lastPostureCheckinDate', 'postureCheckinSnoozeUntil', 'painLog', 'heightPostureLog', 'occiputWallLog', 'primaryGoal', 'secondaryGoals'];

// El código lleva un marcador de una letra al principio para saber cómo
// leerlo: 'Z' = comprimido (deflate), 'R' = sin comprimir (respaldo para
// navegadores muy antiguos sin CompressionStream). Un código sin ninguno
// de los dos marcadores se trata como generado por una versión anterior de
// la app (compatibilidad hacia atrás, sin romper códigos ya compartidos).
function bytesToBase64Url(bytes) {
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function encodeQuickSync(state) {
  const payload = {};
  QUICK_SYNC_FIELDS.forEach(k => { payload[k] = state[k]; });
  const json = JSON.stringify(payload);
  if (typeof CompressionStream !== 'undefined') {
    try {
      const cs = new CompressionStream('deflate-raw');
      const writer = cs.writable.getWriter();
      writer.write(new TextEncoder().encode(json));
      writer.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'Z' + bytesToBase64Url(new Uint8Array(buf));
    } catch (e) { /* si algo falla al comprimir, cae al método sin comprimir de abajo */ }
  }
  return 'R' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function decodeQuickSync(code) {
  const trimmed = (code || '').trim();
  if (!trimmed) throw new Error('Pega o escanea un código antes de vincular.');
  const marker = trimmed[0];
  const rest = trimmed.slice(1);
  let json;
  try {
    if (marker === 'Z') {
      if (typeof DecompressionStream === 'undefined') throw new Error('unsupported');
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(base64UrlToBytes(rest));
      writer.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      json = new TextDecoder().decode(buf);
    } else if (marker === 'R') {
      let b64 = rest.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      json = decodeURIComponent(escape(atob(b64)));
    } else {
      // Código generado por una versión anterior de la app (sin marcador).
      let b64 = trimmed.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      json = decodeURIComponent(escape(atob(b64)));
    }
  } catch (e) {
    throw new Error('Ese código no es válido, o tu navegador no puede leerlo (puede estar incompleto, mal copiado, o generado desde un navegador muy antiguo). Revisa que lo hayas pegado entero.');
  }
  let payload;
  try { payload = JSON.parse(json); } catch (e) { throw new Error('Ese código no es válido (los datos que contiene están dañados).'); }
  if (!payload || typeof payload !== 'object' || !('exerciseLevels' in payload)) {
    throw new Error('Ese código no parece de Forma 55.');
  }
  return payload;
}

// Aplica un código rápido al estado actual del dispositivo, conservando el
// historial local (el código rápido nunca lo toca, así que no hay riesgo
// de perderlo por vincular con otro dispositivo).
async function applyQuickSync(code) {
  const payload = await decodeQuickSync(code);
  const current = loadState();
  const merged = { ...current, ...payload };
  saveState(merged);
  return merged;
}

// Si guardar en localStorage falla (cuota agotada, modo privado, etc.), la
// app seguía funcionando en apariencia pero dejaba de guardar nada en
// silencio — la persona no se enteraría hasta perder progreso de verdad.
// Ahora se registra el fallo para poder avisar de forma visible.
let lastSaveError = null;
let lastSaveVerifiedAt = null;
function saveState(state) {
  try {
    const serialized = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, serialized);
    // Verificación inmediata: si WebKit/navegador acepta la escritura pero
    // no conserva exactamente el contenido, lo tratamos como fallo y lo
    // hacemos visible en vez de dar por guardado un progreso que no lo está.
    const verified = localStorage.getItem(STORAGE_KEY) === serialized;
    if (!verified) throw new Error('La escritura no pudo verificarse');
    lastSaveError = null;
    lastSaveVerifiedAt = new Date().toISOString();
    return true;
  } catch (e) {
    lastSaveError = { message: (e && e.message) || 'Error desconocido al guardar', at: new Date().toISOString() };
    return false;
  }
}

// Genera y descarga el archivo de progreso — extraído a función reutilizable
// para poder ofrecer la exportación en un toque desde el aviso de copia de
// seguridad de Home, no solo desde Ajustes.
// P3 — Export enriquecido con versión y fecha. Se añade __exportMeta
// como campo adicional plano sobre el propio estado (no se anida en un
// wrapper nuevo) para que un archivo exportado siga siendo, byte a byte,
// un estado válido importable/migrable como hasta ahora — compatibilidad
// total con exports antiguos que no tienen este campo.
function exportBackupFile() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return false;
  let payload = raw;
  try {
    const obj = JSON.parse(raw);
    obj.__exportMeta = { app: 'Forma55', exportedAt: new Date().toISOString(), schemaVersion: APP_SCHEMA_VERSION };
    payload = JSON.stringify(obj);
  } catch (e) { /* si no se puede parsear, se exporta el raw tal cual (mismo comportamiento que antes) */ }
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `forma55-progreso-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return true;
}
function getExerciseLevel(state, exerciseId, defaultLevel) {
  const rec = state.exerciseLevels[exerciseId];
  return rec ? rec.level : (defaultLevel != null ? defaultLevel : DEFAULT_LEVEL);
}
function getVolumeBonus(state, exerciseId) {
  const rec = state.exerciseLevels && state.exerciseLevels[exerciseId];
  return rec ? Math.max(0, Math.min(MAX_VOLUME_BONUS_DEFAULT, Number(rec.volumeBonus) || 0)) : 0;
}
// BUG REAL encontrado y corregido: devolvía el nivel de la PRIMERA entrada
// que encontraba con ese prefijo (orden de inserción del objeto), no el
// nivel más alto alcanzado. Cada vez que subes de variante dentro de una
// familia (p.ej. de sq_03 a sq_04), se crea una entrada NUEVA con el id
// del ejercicio recién estrenado — la entrada antigua (sq_03) se queda
// para siempre en el objeto con su último nivel guardado. Al iterar y
// devolver la primera coincidencia, la familia podía quedarse "anclada"
// al nivel antiguo aunque hubiera una entrada más reciente con nivel
// superior. Verificado con datos reales: las familias 'sq' e 'hip' ya
// llevaban semanas usando nivel 4 en vez del 5 real alcanzado — eso
// bloqueaba en la práctica llegar a variantes con mochila que empiezan en
// nivel 5+ (hip_05, por ejemplo), sin que hubiera ningún aviso de ello.
function getFamilyProgress(state, prefix) {
  const entries = Object.entries(state.exerciseLevels || {})
    .filter(([id, rec]) => id.split('_')[0] === prefix && rec && Number.isFinite(Number(rec.level)));
  if (!entries.length) return { prefix, level: DEFAULT_LEVEL, exerciseId: null, record: null };
  entries.sort((a, b) => {
    const levelDiff = Number(b[1].level) - Number(a[1].level);
    if (levelDiff) return levelDiff;
    return String(b[1].updatedAt || '').localeCompare(String(a[1].updatedAt || ''));
  });
  return { prefix, level: Number(entries[0][1].level), exerciseId: entries[0][0], record: entries[0][1] };
}
function getCurrentFamilyRecord(state, prefix) { return getFamilyProgress(state, prefix); }
function getFamilyLevel(state, prefix) { return getFamilyProgress(state, prefix).level; }
function findVariantByLevel(baseGroupId, targetLevel, state) {
  const hasEquip = e => !e.reqEquip || (state && state.equipment && state.equipment[e.reqEquip]);
  const family = EXERCISES.filter(e => e.id.split('_')[0] === baseGroupId && hasEquip(e));
  if (!family.length) return null;
  family.sort((a, b) => a.level - b.level);
  let best = family[0];
  for (const e of family) { if (e.level <= targetLevel) best = e; }
  return best;
}

// V107 — NIVEL EFECTIVO TEMPORAL POR EJERCICIO/FAMILIA.
// Separa el mejor nivel histórico (que nunca se borra) del nivel que conviene
// utilizar HOY cuando existe una pausa. La reducción es solo una recomendación
// de reentrada: no modifica exerciseLevels ni exerciseWeights por sí misma.
// Al completar una sesión con buena respuesta, el motor vuelve a poder usar
// automáticamente el nivel histórico en la siguiente exposición.
// V107 — MOTOR DE RECUPERACIÓN ESPECÍFICA POR FAMILIA.
// Aprende de las últimas exposiciones reales de cada familia (RPE, reps y
// continuidad) para decidir cuándo liberar la variante temporal de reentrada.
// Nunca modifica el nivel histórico guardado: solo calcula el nivel efectivo.
function getExerciseRecoveryReadiness(state, prefix) {
  try {
    const rows=(state.history||[]).filter(h=>h && h.exerciseId && h.exerciseId.split('_')[0]===prefix)
      .sort((a,b)=>String(b.date||b.timestamp||'').localeCompare(String(a.date||a.timestamp||''))).slice(0,4);
    if (!rows.length) return {score:50,status:'sin_datos',goodExposures:0,poorExposures:0};
    const real=(v)=>Number.isFinite(Number(v))?Number(v):null;
    const rpes=rows.map(h=>real(h.rpe)).filter(v=>v!=null);
    const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
    let repSignal=0, repN=0;
    rows.forEach(h=>{
      const reps=Array.isArray(h.reps)?h.reps.map(Number).filter(Number.isFinite):[];
      if(!reps.length)return;
      const target=real(h.targetReps);
      if(target && target>0){ repSignal += Math.max(-1,Math.min(1,(reps.reduce((a,b)=>a+b,0)/reps.length-target)/Math.max(1,target))); repN++; }
    });
    const repAvg=repN?repSignal/repN:0;
    const good=rows.filter(h=>{const r=real(h.rpe);return r!=null && r<=6.5;}).length;
    const poor=rows.filter(h=>{const r=real(h.rpe);return r!=null && r>=8;}).length;
    let score=50;
    if(avgRpe!=null) score += (6.5-avgRpe)*10;
    score += repAvg*20;
    score += good*4-poor*8;
    score=Math.max(0,Math.min(100,Math.round(score)));
    let status='estable';
    if(score>=70) status='lista_para_liberar';
    else if(score<40) status='respuesta_baja';
    else if(score<55) status='cautela';
    return {score,status,goodExposures:good,poorExposures:poor,avgRpe:rpes.length?Math.round(avgRpe*10)/10:null};
  } catch(e){ return {score:50,status:'sin_datos',goodExposures:0,poorExposures:0}; }
}

function getEffectiveExerciseLevel(state, prefix, historicalLevel) {
  const level = Number.isFinite(Number(historicalLevel)) ? Number(historicalLevel) : DEFAULT_LEVEL;
  try {
    const continuity = getContinuityState(state);
    if (!continuity || !continuity.active) return { level, temporary:false, reason:null };

    const gap = Number(continuity.gapDays) || 0;
    const sessionsAfterBreak = Number(continuity.sessionsAfterBreak) || 0;
    // No regresamos más de dos niveles: el objetivo es recuperar rápido,
    // no convertir una pausa en una regresión permanente.
    let drop = 0;
    if (gap >= 21) drop = 2;
    else if (gap >= 14) drop = 1;
    else if (gap >= 7) drop = 1;

    // V107: la liberación ya no depende solo de sesiones globales. Cada
    // familia aprende de su propia respuesta reciente. Una familia que ha
    // respondido bien recupera antes su nivel histórico; una que responde
    // mal conserva la protección aunque otras familias ya estén liberadas.
    const recovery = getExerciseRecoveryReadiness(state, prefix);
    const adaptive = getAdaptiveRecoveryRelease(state, prefix);
    const familyRows=(state.history||[]).filter(h=>h && h.exerciseId && h.exerciseId.split('_')[0]===prefix);
    const familyAfterBreak = latestBreakDate => familyRows.filter(h=>String(h.date||'').slice(0,10) > String(latestBreakDate||'')).length;
    const famSessions = continuity.latestBreakDate ? familyAfterBreak(continuity.latestBreakDate) : 0;
    if (famSessions >= 1 && recovery.status === 'lista_para_liberar') drop = Math.max(0, drop - 1);
    if (recovery.status === 'respuesta_baja') drop = Math.min(2, Math.max(1, drop + 1));
    if (adaptive.release === 'liberar_nivel_historico') drop = 0;
    else if (adaptive.release === 'probar_nivel_historico') drop = Math.max(0, drop - 1);
    else if (adaptive.release === 'proteger_familia') drop = Math.min(2, Math.max(1, drop + 1));

    // Si el nivel histórico es muy bajo, no tiene sentido reducirlo.
    const effective = Math.max(DEFAULT_LEVEL, level - drop);
    return {
      level: effective,
      temporary: effective < level,
      recoveryScore: recovery.score,
      recoveryStatus: recovery.status,
      adaptiveReleaseScore: adaptive.score,
      adaptiveRelease: adaptive.release,
      reason: effective < level
        ? `Reentrada temporal: ${gap} días de pausa; respuesta de ${prefix}: ${recovery.status}. Se usa una variante ${drop} nivel(es) por debajo del mejor nivel histórico.`
        : null
    };
  } catch (e) {
    return { level, temporary:false, reason:null };
  }
}
// V107 — MOTOR DE LIBERACIÓN ADAPTATIVA POR FAMILIA.
// Convierte la recuperación específica de V102 en una decisión longitudinal:
// no solo pregunta si una familia respondió bien, sino si ya existen señales
// suficientes para liberar su nivel histórico. La liberación es temporal y
// calculada: nunca modifica exerciseLevels ni exerciseWeights.
function getAdaptiveRecoveryRelease(state, prefix) {
  try {
    const recovery = getExerciseRecoveryReadiness(state, prefix);
    const continuity = getContinuityState(state);
    const hist = (state.history || []).filter(h => h && h.exerciseId && h.exerciseId.split('_')[0] === prefix)
      .sort((a,b)=>String(b.date||b.timestamp||'').localeCompare(String(a.date||a.timestamp||'')));
    const recent = hist.slice(0,3);
    let score = recovery.score;
    const readinessRows = Object.entries(state.readinessLog || {})
      .sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).slice(0,3)
      .map(([,v])=>Number(v)).filter(Number.isFinite);
    if (readinessRows.length) {
      const avg = readinessRows.reduce((a,b)=>a+b,0)/readinessRows.length;
      if (avg >= 4) score += 8;
      else if (avg < 2.5) score -= 10;
    }
    const sleepRows = Object.entries(state.sleepLog || {})
      .sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).slice(0,3)
      .map(([,v])=>Number(v)).filter(Number.isFinite);
    if (sleepRows.length) {
      const avg = sleepRows.reduce((a,b)=>a+b,0)/sleepRows.length;
      if (avg >= 7) score += 5;
      else if (avg < 6) score -= 7;
    }
    // El dolor/molestia se usa como señal de prudencia, no como diagnóstico.
    const pain = state.painLog || {};
    const painKeys = Object.keys(pain).sort().reverse().slice(0,7);
    const painValues = painKeys.map(k=>String(pain[k]||'').toLowerCase()).filter(v=>v && v!=='none' && v!=='sin dolor' && v!=='sin dolor relevante');
    if (painValues.length) {
      const familyPain = ({cervical:['retract','ytw','wall','lu'],hombro:['press','bpress','fly','lat','retract','ytw'],espalda:['row','deadbug','hip','wall'],cadera:['hip','sq','stepup','slu'],rodilla:['sq','stepup','slu']});
      const mapped = familyPain;
      const relevant = Object.entries(mapped).some(([area,prefixes]) => painValues.length && prefixes.includes(prefix) && painValues.some(v=>v.includes(area)));
      if (relevant) score -= 18;
    }
    if (continuity && continuity.active) {
      const sessions = Number(continuity.sessionsAfterBreak)||0;
      if (sessions===0) score -= 12;

    }
    score = Math.max(0, Math.min(100, Math.round(score)));
    let release='mantener_reentrada';
    if (!continuity || !continuity.active) release='nivel_normal';
    else if (score>=78 && recent.length>=1) release='liberar_nivel_historico';
    else if (score>=62 && recent.length>=1) release='probar_nivel_historico';
    else if (score<42) release='proteger_familia';
    return {score,release,recentExposures:recent.length,recoveryStatus:recovery.status};
  } catch(e) {
    return {score:50,release:'mantener_reentrada',recentExposures:0,recoveryStatus:'sin_datos'};
  }
}

// Clasificación única de tipo de estímulo — usada tanto por el rango de
// reps (P1.2) como por el descanso individualizado (P1.1). Antes cada
// función tenía su propia copia de esta lógica; unificarla evita que las
// dos definiciones diverjan con el tiempo al añadir ejercicios nuevos.
function exerciseStimulusType(exercise) {
  if (exercise.isTimeBased) return 'isometric';
  if (exercise.group === 'core' || exercise.group === 'cardio') return 'accessory';
  if (exercise.group === 'superior_empuje' || exercise.group === 'superior_traccion' || exercise.group === 'inferior') return 'compound';
  return 'corrective';
}
// P1.2 — Rango máximo de repeticiones por tipo de estímulo. El bonus de
// volumen ya no puede empujar indefinidamente las reps: al llegar al techo
// se debe buscar una progresión de estímulo (variante/carga/palanca/tempo)
// en lugar de convertir el ejercicio en una serie interminable.
const REP_RANGES = {
  compound:  { min: 5, max: 20 },
  accessory: { min: 6, max: 25 },
  corrective:{ min: 6, max: 20 },
  isometric: { min: 10, max: 60 },
};
function exerciseRepRange(exercise) { return REP_RANGES[exerciseStimulusType(exercise)]; }
// P1.1 — Descanso individualizado por tipo de estímulo, no solo por fase.
// Antes TODA la sesión heredaba el mismo restSec de la fase (p.ej. 60s en
// Intensidad incluso para un correctivo postural que no lo necesita).
// Ahora cada tipo tiene su propio rango realista (compuestos 45-75s,
// accesorios/correctivos/isométricos 30-60s, por debajo del rango de un
// compuesto) y la fase solo decide EN QUÉ PUNTO de ese rango cae — más
// densidad en Volumen, descanso completo en Fuerza/Intensidad para no
// degradar la calidad del estímulo, moderado en Descarga.
const REST_RANGES = {
  compound:   { min: 45, max: 75 },
  accessory:  { min: 30, max: 60 },
  corrective: { min: 30, max: 55 },
  isometric:  { min: 20, max: 45 },
};
const PHASE_REST_FACTOR = { 1: 0.2, 2: 0.7, 3: 0.9, 4: 0.45 };
function computeRestSec(exercise, phaseKey) {
  const range = REST_RANGES[exerciseStimulusType(exercise)];
  const factor = PHASE_REST_FACTOR[phaseKey] != null ? PHASE_REST_FACTOR[phaseKey] : 0.5;
  return Math.round(range.min + (range.max - range.min) * factor);
}
function computeTargetReps(exercise, phaseKey, state) {
  const phase = PHASES[phaseKey];
  const volBonus = getVolumeBonus(state, exercise.id);
  let raw = Math.round(exercise.baseReps * phase.repsMult) + volBonus * 2;
  // P1.3 — La resistencia seleccionada de la banda es funcional. No se
  // traduce a kg (sería una falsa precisión): una banda ligera deja algo más
  // de margen de repeticiones y una fuerte reduce ligeramente el objetivo.
  if (exercise.equip === 'banda') {
    const band = state.bandLevel || 'media';
    if (band === 'ligera') raw += 2;
    else if (band === 'fuerte') raw -= 2;
  }
  const range = exerciseRepRange(exercise);
  return Math.max(range.min, Math.min(range.max, raw));
}
function computeTargetSeries(exercise, phaseKey) {
  const phase = PHASES[phaseKey];
  return Math.max(2, Math.round(exercise.baseSeries * phase.seriesMult));
}
// ---- Temporización automática de la serie (para que la app avance sola) ----
const PACE_MULT = { lento: 1.28, normal: 1.0, rapido: 0.82 };
// BUG REAL encontrado y corregido (agosto 2026, confirmado por el
// usuario con el tiempo de burpee con salto): `parseFloat(p) || 1` trata
// cualquier fase de tempo igual a "0" (pausa cero, segmento MUY común —
// "2-0-2", "3-0-1"...) como si fuera 1s, porque 0 es falsy en JS y cae en
// el fallback pensado para segmentos no numéricos. Esto inflaba ~1s extra
// por cada tempo con pausa 0 en CASI TODOS los ejercicios de fuerza del
// catálogo, no solo burpees. Fix: comprobar explícitamente si es un
// número válido en vez de usar `||`.
function secondsPerRep(tempo) {
  if (tempo === 'iso') return null;
  return Math.max(1.4, tempo.split('-').reduce((sum, p) => {
    const t = p.trim().toUpperCase();
    if (t === 'X') return sum + 0.4;
    const n = parseFloat(t);
    return sum + (isNaN(n) ? 1 : n);
  }, 0));
}
function computeWorkSeconds(exercise, pace) {
  const mult = PACE_MULT[pace] || 1.0;
  if (exercise.isTimeBased) return exercise.targetReps; // ya es un tiempo objetivo real, no se escala por ritmo
  // secPerRepOverride: para movimientos compuestos donde la notación de
  // tempo (pensada para gestos simples de una sola articulación) se queda
  // corta frente al tiempo real de ejecución — un burpee con salto son
  // varios gestos encadenados (sentadilla, plancha, salto de pies,
  // salto vertical), no un curl. Confirmado insuficiente por el usuario
  // con datos reales de uso; el propio tempo "X-0-X" (pensado para
  // explosividad, no para duración real) no representa cuánto se tarda
  // de verdad en completar el gesto completo.
  const secPerRep = exercise.secPerRepOverride || secondsPerRep(exercise.tempo);
  return Math.max(6, Math.round(exercise.targetReps * secPerRep * mult));
}
// ---- RPE automático a partir de las reps confirmadas vs. objetivo (sin escala táctil) ----
// Tiempo total estimado del día: N vueltas del circuito (trabajo + confirmación
// de reps + descansos, incluido el descanso entre vueltas) + bloque hipopresivo
// final. Usa exactamente la misma lógica que la sesión real (computeWorkSeconds,
// CONFIRM_SECONDS, restSec de la fase), así que es una previsión fiel, no una
// media genérica.
function estimateDaySeconds(session, rounds, pace) {
  const perExercise = session.exercises.reduce((sum, ex) => sum + computeWorkSeconds(ex, pace) + CONFIRM_SECONDS + ex.restSec, 0);
  const roundTransition = session.exercises.length ? Math.round(session.exercises[0].restSec * 1.8) : 0;
  const circuitsSeconds = perExercise * rounds + roundTransition * Math.max(0, rounds - 1);
  const hypoSeconds = HYPOPRESSIVE_BLOCK.reduce((sum, s) => sum + s.duration, 0);
  return circuitsSeconds + hypoSeconds;
}
function fmtMinutes(totalSeconds) { return Math.round(totalSeconds / 60); }

// Recomendación de vueltas del día — motor adaptativo orientado a progreso: antes el selector era un simple 1/2/3
// fijo sin ninguna sugerencia, decisión 100% manual cada día. Con datos
// reales ya hay señal suficiente para proponer algo mejor que "el número
// que tocó ayer": la fase del mes fija una base razonable, y el RPE medio
// reciente + el sueño de las últimas noches la ajustan hacia arriba o
// abajo. Techo ampliado a 5 (antes 3) porque con 40 años de base atlética
// y HIIT reciente, en fase Volumen con buena recuperación 3 vueltas se
// queda corto — pero solo se sugiere subir de 3 cuando los datos
// realmente lo apoyan, no por defecto.
// V130 — CONTROLADOR DE PRESIÓN ESTÉTICA.
// No añade otro cuadro de mando: traduce la jerarquía de objetivos y la
// respuesta corporal en una sola señal que puede usar el motor de dosis.
// La transformación estética sigue siendo el objetivo principal; pérdida de
// grasa + preservación/ganancia muscular son los soportes. Postura y altura
// postural siguen siendo importantes, pero no pueden reducir por sí solas un
// estímulo productivo salvo que exista una señal real de dolor/recuperación.
// Nunca cambia pesos, niveles, fase nutricional ni historial.
function getAestheticGoalController(state){
  try{
    const t=getTransformationEngine(state)||{};
    const measurements=[...(state.measurements||[])].filter(m=>m&&m.date).sort((a,b)=>a.date.localeCompare(b.date));
    const recent=measurements.slice(-6);
    const first=recent[0], last=recent[recent.length-1];
    const days=first&&last?Math.max(1,(new Date(last.date+'T12:00:00')-new Date(first.date+'T12:00:00'))/86400000):null;
    const waistDelta=first?.waistCm!=null&&last?.waistCm!=null&&days>=6 ? Number(last.waistCm)-Number(first.waistCm) : null;
    const readiness=computeReadinessScore(getTodayReadiness(state));
    const sleepDates=Object.keys(state.sleepLog||{}).sort().slice(-3);
    const sleep=sleepDates.map(d=>Number(state.sleepLog[d])).filter(Number.isFinite);
    const avgSleep=sleep.length?sleep.reduce((a,b)=>a+b,0)/sleep.length:null;
    const recentSets=(state.history||[]).slice(-24).flatMap(h=>h?.setsDone||[]).map(x=>Number(x.rpe)).filter(Number.isFinite);
    const avgRpe=recentSets.length?recentSets.reduce((a,b)=>a+b,0)/recentSets.length:null;
    const painToday=(state.painLog||{})[localDateKey()];
    const pain=!!painToday && !['none','sin dolor','Sin dolor relevante'].includes(painToday);
    const performance=t.performanceTrend;
    const waistImproving=waistDelta!=null && waistDelta<=-0.5;
    const performanceStable=performance==null || performance>=-2;
    const recoveryOK=readiness==null || readiness>=3.4;
    const sleepOK=avgSleep==null || avgSleep>=6.5;
    const productiveEffort=avgRpe==null || avgRpe<=7.4;
    let stateKey='mantener', label='Mantener dosis productiva', pressure=0;
    const reasons=[];
    if(pain){ stateKey='proteger'; label='Proteger hoy'; pressure=-2; reasons.push('molestia actual'); }
    else if((readiness!=null&&readiness<=2.5) || (avgSleep!=null&&avgSleep<6.0) || t.action==='Frenar'){
      stateKey='proteger'; label='Proteger recuperación'; pressure=-1; reasons.push('recuperación insuficiente');
    } else if(waistImproving && performanceStable && recoveryOK && sleepOK && productiveEffort){
      stateKey='empujar'; label='Empujar transformación'; pressure=1;
      reasons.push('cintura descendiendo');
      if(performance!=null) reasons.push(`rendimiento ${performance>=0?'+':''}${performance.toFixed(1)}%`);
      if(readiness!=null) reasons.push(`preparación ${readiness.toFixed(1)}/5`);
    } else if(t.action==='Acelerar' && performanceStable && recoveryOK){
      stateKey='empujar'; label='Aprovechar margen'; pressure=1; reasons.push('motor de transformación detecta margen');
    } else if(!performanceStable){
      stateKey='consolidar'; label='Consolidar rendimiento'; pressure=0; reasons.push('rendimiento a vigilar');
    }
    return {stateKey,label,pressure,reasons,waistDelta,waistImproving,performance,performanceStable,readiness,avgSleep,avgRpe,pain};
  }catch(e){
    console.warn('Forma55 V130 aesthetic goal controller skipped:',e);
    return {stateKey:'mantener',label:'Mantener dosis productiva',pressure:0,reasons:['modo seguro'],waistDelta:null,waistImproving:false,performance:null,performanceStable:true,readiness:null,avgSleep:null,avgRpe:null,pain:false};
  }
}

// V131 — ASIGNACIÓN DEL ESTÍMULO DENTRO DE LA SESIÓN.
// El controlador anterior decide si hoy existe margen para empujar. Esta
// capa traduce esa señal a la selección de familias, sin crear más volumen.
// La ventaja está deliberadamente acotada para que el reparto histórico,
// la rotación, el dolor y la recuperación sigan teniendo prioridad.
function getAestheticGoalSelectionBoost(state,prefix){
  try{
    const c=getAestheticGoalController(state);
    if(!c || c.stateKey!=='empujar') return 0;
    const map={bpress:1.0,fly:.92,curl:.72,tricep:.72,wrist:.55,hip:.58,hipabd:.54,slu:.46,retract:.34,ytw:.30,rotator:.28};
    const base=Number(map[prefix]||0);
    if(!base) return 0;
    // Con cintura descendiendo + rendimiento estable + recuperación suficiente,
    // favorece ligeramente las familias con mayor impacto sobre la silueta.
    // No es una orden de hipertrofia ni altera series/peso.
    return Math.min(.42,base*.42);
  }catch(e){return 0;}
}

function recommendRounds(state) {
  const phaseKey = state.cycleWeek;
  // V129 — Volumen adaptativo orientado a transformación:
  // el objetivo no es "hacer el máximo número de vueltas", sino usar el
  // máximo volumen que siga siendo productivo. Se evita que RPE bajo +
  // preparación alta cuenten dos veces y disparen artificialmente hasta 5.
  const baseByPhase = { 1: 3, 2: 2, 3: 2, 4: 2 };
  let recommended = baseByPhase[phaseKey] || 2;
  const reasons = [];

  const continuity = getContinuityState(state);
  const longitudinal = getLongitudinalState(state);
  if (continuity.active) {
    const cap = longitudinal.state === 'reentrada_protegida' || continuity.stage === 'pausa_prolongada' ? 1 : 2;
    recommended = Math.min(recommended, cap);
    reasons.push(continuity.reason);
  } else if (['recuperacion','recuperacion_por_senal'].includes(longitudinal.state)) {
    recommended = Math.min(recommended, Math.max(1, (baseByPhase[phaseKey] || 2) - 1));
    reasons.push(longitudinal.action);
  }

  const recentDates = [...new Set((state.history || []).map(h => h.date.slice(0, 10)))].sort().slice(-3);
  const recentSets = (state.history || [])
    .filter(h => recentDates.includes(h.date.slice(0, 10)))
    .flatMap(h => h.setsDone || [])
    .filter(s => s.rpe != null);
  const avgRpe = recentSets.length ? recentSets.reduce((a, s) => a + Number(s.rpe), 0) / recentSets.length : null;

  const lastTrainingDate = recentDates.length ? recentDates[recentDates.length - 1] : null;
  const lastTraining = lastTrainingDate
    ? (state.history || []).filter(h => h.date.slice(0, 10) === lastTrainingDate)
    : [];
  const lastRoundCounts = lastTraining.map(h => (h.setsDone || []).length).filter(n => n > 0);
  const lastRoundCount = lastRoundCounts.length ? Math.max(...lastRoundCounts) : null;
  const lastSessionRpe = lastTraining.flatMap(h => h.setsDone || []).map(s => Number(s.rpe)).filter(Number.isFinite);
  const lastSessionAvgRpe = lastSessionRpe.length ? lastSessionRpe.reduce((a,b)=>a+b,0)/lastSessionRpe.length : null;

  // Sueño: no permitimos que un RPE históricamente bajo "compre" volumen
  // cuando la recuperación actual ya está deteriorándose.
  const sleepDates = Object.keys(state.sleepLog || {}).sort().slice(-3);
  const sleepVals = sleepDates.map(d => Number(state.sleepLog[d])).filter(Number.isFinite);
  const avgSleep = sleepVals.length ? sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length : null;

  const readiness = getTodayReadiness(state);
  const readinessScore = computeReadinessScore(readiness);

  const todayKey = localDateKey();
  const todayPain = (state.painLog || {})[todayKey];
  const painToday = todayPain && todayPain !== 'none';

  // Primera aceleración: solo una vuelta adicional sobre la base.
  if (avgRpe != null && avgRpe <= 7.0) {
    recommended += 1;
    reasons.push(`RPE reciente bajo (${avgRpe.toFixed(1)}) — hay margen para una vuelta adicional`);
  } else if (avgRpe != null && avgRpe >= 8.2) {
    recommended -= 1;
    reasons.push(`RPE reciente alto (${avgRpe.toFixed(1)}) — hoy prima la calidad`);
  }

  if (avgSleep != null && avgSleep < 6.5) {
    recommended -= 1;
    reasons.push(`sueño reciente corto (${avgSleep.toFixed(1)} h) — protege recuperación`);
  }

  if (readinessScore != null && readinessScore <= 2.2) {
    recommended -= 1;
    reasons.push(`preparación baja (${readinessScore.toFixed(1)}/5) — reduce volumen`);
  } else if (readinessScore != null && readinessScore < 3.2) {
    recommended = Math.min(recommended, baseByPhase[phaseKey] || 2);
    reasons.push(`preparación moderada (${readinessScore.toFixed(1)}/5) — mantén el volumen base`);
  }

  // V129 — 5 vueltas deja de ser una consecuencia matemática de sumar señales.
  // Solo se libera como "aceleración excepcional" cuando hay evidencia
  // concurrente de margen y no acaba de demostrarse fatiga con 5 vueltas.
  // V183 — la calidad subjetiva del sueño de HOY tiene prioridad para liberar
  // 5 vueltas. No basta con dormir >=7 h de media si hoy el usuario ha marcado
  // sueño 1–2/5: la duración puede ser buena y la recuperación percibida no.
  const todaySleepQuality = readiness && Number.isFinite(Number(readiness.sleep)) ? Number(readiness.sleep) : null;
  const highRecovery = readinessScore != null && readinessScore >= 4.0 && avgSleep != null && avgSleep >= 7.0 && (todaySleepQuality == null || todaySleepQuality >= 3);
  const lowEffort = avgRpe != null && avgRpe <= 6.8;
  const lastFiveWereEasy = lastRoundCount === 5 && lastSessionAvgRpe != null && lastSessionAvgRpe <= 6.8;
  const transformation = (() => { try { return getTransformationEngine(state) || {}; } catch(e) { return {}; } })();
  const aestheticControl = getAestheticGoalController(state);
  const transformationFavorable = transformation.action !== 'Frenar' && transformation.performanceTrend !== 'caida_significativa' && aestheticControl.stateKey !== 'proteger';
  if (aestheticControl.stateKey === 'empujar' && recommended < 4 && phaseKey !== 4 && !continuity.active) {
    recommended += 1;
    reasons.push(`presión estética favorable: ${aestheticControl.reasons.slice(0,2).join(' + ')}`);
  }
  if (aestheticControl.stateKey === 'consolidar') {
    recommended = Math.min(recommended, 3);
    reasons.push('consolidación: no añadir volumen hasta confirmar rendimiento');
  }
  const noPain = !painToday;

  if (phaseKey !== 4 && highRecovery && lowEffort && transformationFavorable && noPain && lastRoundCount !== 5) {
    recommended = Math.max(recommended, 5);
    reasons.push('aceleración excepcional: recuperación alta + RPE muy bajo + sueño actual compatible + transformación estable');
  } else if (phaseKey !== 4 && readinessScore != null && readinessScore >= 4.0 && avgSleep != null && avgSleep >= 7.0 && todaySleepQuality != null && todaySleepQuality < 3 && recommended >= 5) {
    recommended = 4;
    reasons.push(`sueño subjetivo de hoy ${todaySleepQuality}/5 — consolida 4 vueltas aunque la duración del sueño sea suficiente`);
  } else if (lastRoundCount === 5 && lastSessionAvgRpe != null && lastSessionAvgRpe > 6.8) {
    // No encadenar 5 por inercia: después de una sesión de 5 con esfuerzo
    // significativo, la siguiente vuelve a 4 como techo productivo.
    recommended = Math.min(recommended, 4);
    reasons.push(`la última sesión ya tuvo ${lastRoundCount} vueltas con RPE ${lastSessionAvgRpe.toFixed(1)} — consolida antes de repetir el máximo`);
  } else if (lastFiveWereEasy && highRecovery && noPain && transformationFavorable) {
    recommended = 5;
    reasons.push('5 vueltas liberadas por evidencia repetida de buena tolerancia');
  }

  // En Descarga el techo sigue siendo 2.
  const preCapRecommended = recommended;
  if (phaseKey === 4) recommended = Math.min(recommended, 2);
  if (phaseKey === 4 && preCapRecommended > recommended) {
    reasons.push('fase Descarga: se prioriza recuperación aunque exista margen');
  }

  // Techo general productivo: 4. El 5 solo se libera por la puerta
  // excepcional anterior, y nunca por suma ciega de señales.
  if (recommended > 4) {
    const exceptionalFive = phaseKey !== 4 && highRecovery && lowEffort && transformationFavorable && noPain && lastRoundCount !== 5;
    recommended = exceptionalFive ? 5 : 4;
  }

  recommended = Math.max(1, Math.min(5, recommended));

  if (continuity.active) {
    const reentryCap = longitudinal.state === 'reentrada_protegida' || continuity.stage === 'pausa_prolongada' ? 1 : 2;
    recommended = Math.min(recommended, reentryCap);
  } else if (['recuperacion','recuperacion_por_senal'].includes(longitudinal.state)) {
    recommended = Math.min(recommended, Math.max(1, (baseByPhase[phaseKey] || 2) - 1));
  }
  if (painToday) {
    recommended = Math.min(recommended, Math.max(1, baseByPhase[phaseKey] || 2));
    reasons.push('hay molestia registrada hoy — no se acelera el volumen');
  }
  if (!reasons.length) reasons.push(`base estándar de la fase ${PHASES[phaseKey].name}`);
  return { recommended, reasons, avgRpe, avgSleep, lastRoundCount, lastSessionAvgRpe };
}

// El esfuerzo estimado ya no es fijo por fase: sube con cada vuelta extra
// que haces ese día (+0.4 RPE por vuelta después de la primera), reflejando
// la fatiga real de encadenar series sin descanso completo entre vueltas —
// antes daba el mismo RPE en la vuelta 1 que en la 4, lo cual no era honesto.
function estimateRpe(actualReps, targetReps, phaseKey, roundIdx = 0) {
  const base = { 1: 7, 2: 7.5, 3: 8.5, 4: 6 }[phaseKey] || 7;
  const fatigueBump = Math.max(0, roundIdx) * 0.4;
  const ratio = targetReps > 0 ? actualReps / targetReps : 1;
  let rpe = base + fatigueBump;
  if (ratio >= 1.15) rpe -= 1.5;
  else if (ratio >= 1.0) rpe -= 0.5;
  else if (ratio >= 0.9) rpe += 0;
  else if (ratio >= 0.75) rpe += 1;
  else rpe += 2;
  return Math.max(3, Math.min(10, Math.round(rpe)));
}
// V120 — FASE G: la causa recurrente específica puede cerrar temporalmente la puerta a progresar.
function applyResult(state, exercise, setsDone, phaseKey) {
  if (!setsDone || !setsDone.length) {
    const levelNow = getExerciseLevel(state, exercise.id, exercise.level);
    return { levelBefore: levelNow, levelAfter: levelNow, progressed: false, regressed: false, decision: 'skip' };
  }
  const validSets = setsDone.filter(x => Number.isFinite(Number(x.reps)) && Number.isFinite(Number(x.rpe)));
  if (!validSets.length) {
    const levelNow = getExerciseLevel(state, exercise.id, exercise.level);
    return { levelBefore: levelNow, levelAfter: levelNow, progressed: false, regressed: false, decision: 'invalid' };
  }

  const targetReps = computeTargetReps(exercise, phaseKey, state);
  const avgReps = validSets.reduce((sum, x) => sum + Number(x.reps), 0) / validSets.length;
  const avgRpe = validSets.reduce((sum, x) => sum + Number(x.rpe), 0) / validSets.length;
  const levelBefore = getExerciseLevel(state, exercise.id, exercise.level);
  const volBefore = Math.max(0, Math.min(MAX_VOLUME_BONUS_DEFAULT, getVolumeBonus(state, exercise.id)));
  let levelAfter = levelBefore;
  let volAfter = volBefore;
  let decision = 'maintain';
  const pctOfTarget = avgReps / Math.max(1, targetReps);
  const familyPrefix = exercise.id.split('_')[0];

  // V120 — FASE G: PUERTA CAUSAL DE PROGRESIÓN ESPECÍFICA.
  // Una buena media de reps/RPE no libera por sí sola una variante superior
  // si este ejercicio concreto acumula una causa recurrente al costar.
  // El historial sigue intacto: esto solo cambia la decisión de esta sesión.
  const causalGate = getExerciseCausalResponse(state, exercise.id, 84);
  const causalBlocksProgress = !!(causalGate && causalGate.dominantCause && causalGate.status !== 'resuelto' && causalGate.confidence >= 0.65);

  if (pctOfTarget >= 1.0 && avgRpe <= 7) {
    const nextVariant = findVariantByLevel(familyPrefix, levelBefore + 1, state);
    if (nextVariant && nextVariant.level > levelBefore && !causalBlocksProgress) {
      levelAfter = nextVariant.level;
      volAfter = 0;
      decision = 'progress_variant';
    } else if (nextVariant && nextVariant.level > levelBefore && causalBlocksProgress) {
      levelAfter = levelBefore;
      volAfter = volBefore;
      decision = 'causal_gate_hold';
    } else {
      volAfter = Math.min(MAX_VOLUME_BONUS_DEFAULT, volBefore + 1);
      decision = volAfter > volBefore && !causalBlocksProgress ? 'ceiling_volume_limited' : 'ceiling_maintain';
    }
  } else if (pctOfTarget < 0.75 || avgRpe >= 9) {
    const prevVariant = findVariantByLevel(familyPrefix, levelBefore - 1, state);

// con suficiente actividad reciente y cuando existe una diferencia clara de
// volumen entre familias. Así evitamos que una semana irregular provoque
// cambios bruscos.
function getRecentMuscleEffectiveVolume(state, days=14) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  const totals = {};
  let sessions = 0;
  const seenDays = new Set();
  (state.history || []).forEach(h => {
    const t = new Date(h.date).getTime();
    if (!Number.isFinite(t) || t < cutoff || !h.exerciseId) return;
    seenDays.add(String(h.date).slice(0,10));
    const prefix = h.exerciseId.split('_')[0];
    const focuses = EFFECTIVE_VOLUME_FOCUS[prefix];
    if (!focuses || !Array.isArray(h.setsDone)) return;
    const share = 1 / focuses.length;
    h.setsDone.forEach(set => {
      const factor = effectiveSetFactor(set.rpe);
      focuses.forEach(m => totals[m] = (totals[m] || 0) + factor * share);
    });
  });
  sessions = seenDays.size;
  return { totals, sessions };
}

function familyVolumePriority(state, prefix, recent) {
  const focuses = EFFECTIVE_VOLUME_FOCUS[prefix] || [];
  if (!focuses.length || recent.sessions < 3) return 0;
  return focuses.reduce((sum, m) => sum + (recent.totals[m] || 0), 0) / focuses.length;
}

function shouldUseVolumeBalancing(state, recent) {
  if (recent.sessions < 3) return false;
  const vals = Object.values(recent.totals).filter(v => v > 0);
  if (vals.length < 3) return false;
  return Math.max(...vals) - Math.min(...vals) >= 2.0;

// No inferimos hipertrofia real a partir del entrenamiento: sin perímetros/fotos

// "respuesta de entrenamiento" de cada familia: progresión reciente, capacidad

function getFamilyTrainingResponse(state, prefix, days=56) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;

    const sets = h.setsDone || [];

    const rpe = sets.reduce((a,x)=>a + (Number(x.rpe)||7),0) / Math.max(1,sets.length);
