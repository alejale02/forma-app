<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Forma 55 — Circuito diario</title>
<meta name="theme-color" content="#12141A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forma 55" />
<link id="manifest-link" rel="manifest" href="data:application/manifest+json,">
<link rel="apple-touch-icon" id="apple-touch-icon">
<link rel="icon" id="favicon">
<style>
:root{
  --bg:#12141A; --bg-elev:#1B1E27; --bg-elev2:#242835;
  --accent:#C8FF3D; --accent-dim:#8FBF2B;
  --text:#F4F6F8; --text-dim:#9AA0AC; --text-faint:#5C616E;
  --danger:#FF6B4A; --up:#7DD8FF;
  --radius:20px; --radius-sm:12px;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;}
h1,h2{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); padding-top:calc(24px + env(safe-area-inset-top)); animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---- MÓVIL EN HORIZONTAL — pantallas de sesión activa (poco alto, ancho de sobra) ---- */
@media (orientation: landscape) and (max-height: 560px) {
  .screen.work, .screen.prep, .screen.rest, .screen.roundrest, .screen.hypo {
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center;
    align-content: center; gap: 2px 22px; padding: 10px 26px; overflow-y: auto;
  }
  .screen.work h2, .screen.prep h2, .screen.rest .rest-next, .screen.roundrest .roundrest-badge,
  .screen.work .eyebrow, .screen.prep .eyebrow, .screen.rest .eyebrow, .screen.work .round-badge, .screen.prep .round-badge,
  .screen.work .circuit-progress, .screen.hypo .eyebrow {
    width: 100%; text-align: center; margin: 1px 0;
  }
  .screen.work .figure-wrap, .screen.prep .figure-wrap, .screen.work .photo-wrap, .screen.prep .photo-wrap { width: 108px !important; height: 108px !important; margin: 2px 0; }
  .screen.hypo .ring-center .figure-wrap, .screen.hypo .ring-center .photo-wrap { width: 78px !important; height: 78px !important; }
  .timer-big{ font-size: 34px; margin: 2px 0; }
  .prep-count{ font-size: 46px; margin: 2px 0; }
  .target-reps-badge{ padding: 8px 20px; margin: 2px 0; }
  .target-reps-num{ font-size: 32px; }
  .exercise-cue{ max-width: 240px; font-size: 12px; padding: 8px 10px; margin: 2px 0; }
  .auto-note, .level-hint, .cue-text{ display: none; }
  .btn-secondary{ padding: 10px 16px; font-size: 13px; }
  .session-controls{ position: fixed; }
}

.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px;}

/* ---- HOME ---- */
.home-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
.home-header h1{font-size:30px;}
.icon-btn{background:var(--bg-elev); color:var(--text); width:44px; height:44px; border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.weight-reminder{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.weight-reminder-title{font-weight:800; font-size:14.5px; margin-bottom:6px;}
.weight-reminder-text{font-size:13px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}
.weight-reminder-actions{display:flex; gap:8px; flex-wrap:wrap;}
.weight-reminder-actions .btn-primary{flex:1 1 auto; min-width:150px;}
.weight-reminder-actions .btn-secondary{flex:1 1 auto; min-width:130px;}
.phase-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; margin-bottom:16px; border-left:4px solid var(--phase-color);}
.phase-name{font-family:var(--font-display); font-size:24px; color:var(--phase-color); margin-bottom:6px;}
.phase-desc{color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:16px;}
.phase-progress{display:flex; gap:5px; margin-bottom:8px;}
.dot{width:100%; height:6px; border-radius:3px; background:var(--bg-elev2);}
.dot.filled{background:var(--phase-color);}
.phase-progress-label{font-size:12px; color:var(--text-faint);}

.cycle-track{display:flex; gap:8px; margin-bottom:20px;}
.cycle-step{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--bg-elev); opacity:0.45;}
.cycle-step.active{opacity:1; background:var(--bg-elev2); outline:1.5px solid var(--accent);}
.cycle-step.done{opacity:0.7;}
.cycle-num{display:block; font-family:var(--font-display); font-size:16px;}
.cycle-label{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.btn-primary{background:var(--accent); color:#0C0D10; font-weight:800; border-radius:var(--radius-sm); padding:16px; font-size:16px;}
.btn-primary:disabled{opacity:0.35;}
.btn-huge{width:100%; padding:20px; font-size:17px; border-radius:16px; margin:8px 0;}
.btn-secondary{background:var(--bg-elev2); color:var(--text); border-radius:var(--radius-sm); padding:16px; font-size:15px; font-weight:600;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); border-radius:var(--radius-sm); padding:14px 20px; font-weight:700; width:100%;}

.stat-row{display:flex; gap:10px; margin:16px 0;}
.stat-box{flex:1; background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; text-align:center;}
.stat-num{font-family:var(--font-display); font-size:26px; color:var(--accent);}
.stat-label{font-size:11px; color:var(--text-dim); margin-top:2px;}

.link-btn{background:none; color:var(--text-dim); text-align:center; padding:10px; font-size:14px; text-decoration:underline; text-underline-offset:3px;}

/* ---- ROUND SELECTOR ---- */
.rounds-block{background:var(--bg-elev); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
.rounds-label{font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
.rounds-picker{display:flex; gap:8px;}
.round-btn{flex:1; padding:12px; border-radius:12px; background:var(--bg-elev2); color:var(--text); font-weight:800; text-align:center;}
.round-btn .rn{display:block; font-family:var(--font-display); font-size:20px;}
.round-btn .rl{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; margin-top:2px;}
.round-btn.active{background:var(--accent); }
.round-btn.active .rn,.round-btn.active .rl{color:#0C0D10;}
.rounds-hint{font-size:11.5px; color:var(--text-faint); margin-top:10px; line-height:1.4;}
.time-estimate{font-size:13px; color:var(--text); background:var(--bg-elev2); border-radius:10px; padding:10px 12px; margin-top:10px;}
.time-estimate strong{color:var(--accent);}

/* ---- TODAY PREVIEW / REST DAY ---- */
.today-preview{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:6px;}
.today-title{font-weight:800; font-size:15px; margin-bottom:12px;}
.today-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.today-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--bg-elev2); gap:10px;}
.today-row:last-child{border-bottom:none;}
.today-ex-name{font-size:14px; flex:1;}
.today-ex-detail{font-size:12.5px; color:var(--accent); font-weight:700; white-space:nowrap;}
.rest-day-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; text-align:center;}
.rest-day-title{font-family:var(--font-display); font-size:20px; margin-bottom:10px; color:var(--up);}

/* ---- WEEKLY PLAN ---- */
.weekplan-intro{text-align:left; max-width:none; margin-bottom:18px;}
.weekplan-day{background:var(--bg-elev); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}
.weekplan-day.is-today{outline:1.5px solid var(--accent);}
.weekplan-day-header{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.weekplan-day-name{font-family:var(--font-display); font-size:15px;}
.weekplan-day-focus{font-size:12px; color:var(--text-dim);}
.weekplan-today-badge{margin-left:auto; background:var(--accent); color:#0C0D10; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.weekplan-ex-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--bg-elev2); font-size:13px;}
.weekplan-ex-row:first-of-type{border-top:none;}
.weekplan-ex-name{flex:1;}
.weekplan-ex-detail{color:var(--text-dim); white-space:nowrap; font-weight:600;}
.rest-summary{opacity:0.6;}

/* ---- WORK / REST / LOGGING / HYPO shared ---- */
.hypo,.work,.rest,.logging,.roundrest{align-items:center; text-align:center; justify-content:center;}
.mobility-ring{position:relative; width:186px; height:216px; margin:16px 0;}
.ring-svg{width:100%; height:100%; transform:rotate(-90deg); position:absolute; inset:0;}
.ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:5;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:339.3; transition:stroke-dashoffset 1s linear;}
.ring-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--accent);}

h2{font-size:23px; margin:8px 0;}
.cue-text{color:var(--text-dim); font-size:15px; line-height:1.5; max-width:340px; margin:0 auto 12px;}
.timer-big{font-family:var(--font-display); font-size:52px; margin:12px 0; letter-spacing:-0.02em;}
.prep-count{font-family:var(--font-display); font-size:88px; color:var(--accent); margin:10px 0; line-height:1;}
.target-reps-badge{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg-elev2); border:2px solid var(--accent); border-radius:18px; padding:14px 28px; margin:6px 0 14px;}
.target-reps-num{font-family:var(--font-display); font-size:56px; color:var(--accent); line-height:1;}
.target-reps-unit{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
.rest-next-reps{color:var(--accent); font-weight:700;}
.rest-timer{color:var(--up);}
.rest-next{color:var(--text); font-size:15px; font-weight:700; margin-bottom:2px;}
.rest-next-detail{color:var(--accent); font-size:13px; font-weight:700; margin-bottom:24px;}
.roundrest .timer-big{color:var(--danger);}
.roundrest-badge{background:rgba(255,107,74,0.15); color:var(--danger); font-size:12px; font-weight:800; padding:6px 14px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em;}
.extend-prompt h2{margin:10px 0 12px;}
.link-prompt{justify-content:center; text-align:center;}
.link-prompt-title{font-size:22px; margin-bottom:12px;}
.link-prompt .btn-huge, .link-prompt .btn-secondary{width:100%; margin-bottom:10px;}
.extend-prompt .btn-huge{margin-bottom:10px;}

.mobility-controls{display:flex; gap:10px; width:100%; margin-top:16px;}
.mobility-controls .btn-secondary,.mobility-controls .btn-primary{flex:1; margin:0;}
.mobility-dots{display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
.mdot{width:8px; height:8px; border-radius:50%; background:var(--bg-elev2);}
.mdot.active{background:var(--accent); width:22px; border-radius:4px;}
.mdot.done{background:var(--accent-dim);}

.figure-wrap{position:relative; width:180px; height:210px; margin:8px 0; display:flex; align-items:center; justify-content:center;}
.figure-wrap svg{width:100%; height:100%;}
.photo-wrap{position:relative; margin:8px auto; border-radius:16px; overflow:hidden; background:#000;}
.photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-credit{position:absolute; bottom:2px; right:6px; font-size:8px; color:rgba(255,255,255,0.55); background:rgba(0,0,0,0.4); padding:1px 5px; border-radius:6px;}

/* ---- STORYBOARD "Ejercicios de hoy" ---- */
.today-cards-title{font-weight:800; font-size:15px; margin:22px 0 12px;}
.today-card{background:var(--bg-elev); border-radius:var(--radius); padding:14px; margin-bottom:14px; display:flex; gap:12px;}
.today-card-num{font-family:var(--font-display); font-size:22px; color:var(--accent); width:26px; flex-shrink:0;}
.today-card-body{flex:1; min-width:0;}
.today-card-name{font-weight:800; font-size:15px; margin-bottom:4px;}
.today-card-meta{font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:2px;}
.today-card-group{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;}
.today-card-frames{display:flex; align-items:center; gap:2px;}
.today-frame{flex:1; min-width:0; background:radial-gradient(circle at 50% 38%, var(--bg-elev2) 0%, var(--bg) 100%); border-radius:12px; padding:6px 2px 8px; text-align:center;}
.today-frame .figure-wrap{width:100% !important; height:104px !important; margin:0 auto;}
.today-frame-cap{font-size:10px; color:var(--text-dim); margin-top:2px; line-height:1.25; font-weight:600;}
.today-frame-arrow{color:var(--text-faint); font-size:15px; flex-shrink:0; width:12px;}
.today-card-body .photo-wrap{width:100% !important; height:160px !important; margin:2px 0 0;}

/* ---- AUTO-CONFIRM de repeticiones (sin toques obligatorios) ---- */
.confirm-ring{position:relative; width:76px; height:76px; margin:6px auto 18px;}
.confirm-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.confirm-ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:6;}
.confirm-ring-fg{fill:none; stroke:var(--up); stroke-width:6; stroke-linecap:round; stroke-dasharray:219.9; transition:stroke-dashoffset 1s linear;}
.confirm-ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; color:var(--up);}
.confirm-reps-row{display:flex; align-items:center; gap:18px; margin:10px 0 6px;}
.confirm-adj-btn{width:56px; height:56px; border-radius:50%; background:var(--bg-elev2); color:var(--text); font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.confirm-reps-num{font-family:var(--font-display); font-size:56px; color:var(--accent); min-width:90px; text-align:center;}
.confirm-hint{font-size:12px; color:var(--text-faint); margin-bottom:8px;}
.auto-note{font-size:11.5px; color:var(--text-faint); margin-top:14px;}
.session-controls{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:5; display:flex; justify-content:space-between;}
.pause-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text-dim); font-size:15px; display:flex; align-items:center; justify-content:center;}
.pause-btn.active{background:var(--accent); color:#0C0D10;}
.end-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--danger); font-size:15px; display:flex; align-items:center; justify-content:center;}

/* ---- Selector de ritmo (Settings) ---- */
.pace-picker{display:flex; gap:8px; flex-wrap:wrap;}
.pace-picker .pace-btn{flex:1 1 auto; min-width:56px;}
.pace-btn{flex:1; padding:12px 6px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700; font-size:13px; text-align:center;}
.pace-btn.active{background:var(--accent); color:#0C0D10;}
.sync-code-row{display:flex; align-items:center; gap:8px; background:var(--bg-elev2); border-radius:10px; padding:10px 12px;}
.sync-code{flex:1; font-family:var(--font-mono, monospace); font-size:12px; color:var(--accent); word-break:break-all;}
.sync-copy-btn{flex-shrink:0; padding:8px 12px; font-size:12.5px;}
.sync-link-row{display:flex; gap:8px; margin-top:6px;}
.sync-code-input{flex:1; background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13px;}
.sync-msg{font-size:12.5px; margin-top:8px;}
.sync-ok{color:var(--up);}
.sync-err{color:var(--danger);}
.circuit-progress{display:flex; gap:6px; margin:2px 0 4px; justify-content:center;}
.circuit-dot{width:26px; height:5px; border-radius:3px; background:var(--bg-elev2);}
.circuit-dot.done{background:var(--accent);}
.circuit-dot.current{background:var(--up);}
.round-badge{display:inline-block; background:var(--bg-elev2); color:var(--text-dim); font-size:11px; font-weight:800; padding:5px 12px; border-radius:20px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.03em;}
.target-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0 8px;}
.chip{background:var(--bg-elev); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; color:var(--text-dim);}
.chip-emphasis{background:var(--accent); color:#0C0D10; font-weight:800;}
.exercise-cue{color:var(--text-dim); font-size:13.5px; line-height:1.5; max-width:320px; margin:4px auto 8px; background:var(--bg-elev); padding:12px 14px; border-radius:var(--radius-sm);}
.level-hint{color:var(--text-faint); font-size:12px; margin-top:12px;}

.reps-input{width:140px; font-family:var(--font-display); font-size:48px; text-align:center; background:var(--bg-elev); color:var(--accent); border:2px solid var(--bg-elev2); border-radius:var(--radius-sm); padding:12px; margin:12px 0 4px;}
.reps-input:focus{outline:none; border-color:var(--accent);}
.target-hint{color:var(--text-faint); font-size:13px; margin-bottom:20px;}
.rpe-label{font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:600;}
.rpe-scale{display:flex; gap:6px; margin-bottom:6px;}
.rpe-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text); font-weight:700; font-size:14px;}
.rpe-btn.active{background:var(--accent); color:#0C0D10;}
.rpe-legend{display:flex; justify-content:space-between; width:100%; max-width:290px; font-size:10px; color:var(--text-faint); margin-bottom:20px; text-transform:uppercase; letter-spacing:0.05em;}

/* ---- SUMMARY ---- */
/* ---- MODAL: extensión hipopresiva opcional ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(8,9,12,0.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; animation:fadein .2s ease;}
.modal-card{background:var(--bg-elev); border-radius:var(--radius); padding:26px 22px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.modal-card h2{font-size:22px; margin:6px 0 12px;}
.modal-actions{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.modal-actions .btn-huge{margin:0;}

.summary h1{font-size:28px; margin-bottom:20px;}
.summary-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; text-align:left;}
.summary-title{font-weight:700; font-size:14px; margin-bottom:10px; color:var(--text-dim);}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--bg-elev2);}
.summary-row:first-of-type{border-top:none;}
.badge{font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge-up{background:rgba(200,255,61,0.15); color:var(--accent);}
.badge-down{background:rgba(255,107,74,0.15); color:var(--danger);}

/* ---- PROGRESS ---- */
.sub-header{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.sub-header h1{font-size:22px;}
/* ---- CALENDARIO DE PROGRESO ---- */
.icon-btn.small{width:34px; height:34px; font-size:16px; border-radius:9px;}
.calendar-card{background:var(--bg-elev); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.calendar-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calendar-month{font-weight:800; font-size:15px; text-transform:capitalize;}
.calendar-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px;}
.calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:9px; background:transparent; color:var(--text-dim); font-size:12px;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.has-session{background:var(--bg-elev2); color:var(--text); font-weight:700; cursor:pointer;}
.cal-cell.is-today{outline:1.5px solid var(--accent);}
.cal-cell.is-selected{background:var(--accent); color:#0C0D10;}
.cal-cell.is-selected .cal-dot{background:#0C0D10;}
.cal-dot{width:5px; height:5px; border-radius:50%; background:var(--dot-color, var(--accent)); margin-top:2px;}
.calendar-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid var(--bg-elev2);}
.legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-dim);}
.legend-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

.day-detail-card{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:14px;}
.day-detail-title{font-weight:800; font-size:14px; text-transform:capitalize; margin-bottom:12px;}
.day-detail-stats{display:flex; gap:8px; margin-bottom:12px;}
.day-stat{flex:1; text-align:center; background:var(--bg-elev2); border-radius:10px; padding:10px 4px;}
.day-stat-num{display:block; font-family:var(--font-display); font-size:18px; color:var(--accent);}
.day-stat-label{display:block; font-size:10px; color:var(--text-dim); margin-top:2px;}
.day-detail-breakdown{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-dim);}

.month-summary{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:18px;}
.month-summary-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--bg-elev2);}
.month-summary-row:first-of-type{border-top:none;}
.calorie-disclaimer{font-size:10.5px; color:var(--text-faint); line-height:1.4; margin:-8px 0 20px;}

.progress-group{margin-bottom:20px;}
.group-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;}
.level-track-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bg-elev);}
.level-track-name{font-size:14px;}
.level-track{display:flex; gap:4px;}
.level-pip{width:14px; height:6px; border-radius:3px; background:var(--bg-elev2);}
.level-pip.filled{background:var(--accent);}
.history-list{margin-top:8px;}
.history-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--bg-elev); font-size:13px;}
.history-date{color:var(--text-faint);}

/* ---- SETTINGS ---- */
.settings-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:18px; margin-bottom:14px;}
.advice-block{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35);}
.advice-line{font-size:13px; color:var(--text); line-height:1.5; margin-top:8px;}
.advice-line strong{color:var(--accent);}
.settings-label{font-weight:700; font-size:14px; margin-bottom:12px;}
.week-picker{display:flex; gap:8px; margin-bottom:10px;}
.week-btn{flex:1; padding:12px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700;}
.week-btn.active{background:var(--accent); color:#0C0D10;}
.settings-hint{font-size:12px; color:var(--text-faint); line-height:1.5; margin-top:6px;}
.settings-toggle-row{display:flex; justify-content:space-between; align-items:center;}
.switch{width:46px; height:26px; border-radius:20px; background:var(--bg-elev2); position:relative; flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch-knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--text); transition:transform .15s ease;}
.switch.on .switch-knob{transform:translateX(20px); background:#0C0D10;}

@media (prefers-reduced-motion: reduce){
  .figure-wrap svg{animation:none !important;}
}

<script type="importmap">
{

<script type="module">
import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
const h = React.createElement;
const html = htm.bind(h);

// =====================================================================
// SOUND — Web Audio API, síntesis pura (offline, sin ficheros)
// Nota iOS: si el interruptor físico de silencio está activado, Safari
// silencia el audio de las páginas web (incluida esta instalada como app).
// Es una restricción del sistema operativo, no de la aplicación.
// =====================================================================
const Sound = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, duration, opts = {}) {
    const { type = 'sine', gain = 0.18, delay = 0 } = opts;
    const c = getCtx();
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + duration);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + duration + 0.02);
  }
  return {
    unlock() { try { getCtx(); } catch (e) {} },
    playSetStart() { tone(520, 0.09, { type: 'triangle', gain: 0.2 }); tone(780, 0.11, { type: 'triangle', gain: 0.16, delay: 0.09 }); },
    playSetEnd() { tone(660, 0.12, { gain: 0.18 }); tone(440, 0.16, { gain: 0.15, delay: 0.1 }); },
    playCountdownBeep(isLast) { tone(isLast ? 880 : 600, isLast ? 0.24 : 0.11, { type: 'sine', gain: isLast ? 0.2 : 0.12 }); },
    playRestEnd() { tone(700, 0.09, { type: 'triangle', gain: 0.2 }); tone(1000, 0.14, { type: 'triangle', gain: 0.18, delay: 0.1 }); },
    playRoundEnd() { tone(392, 0.16, { type: 'triangle', gain: 0.14 }); tone(523, 0.18, { type: 'triangle', gain: 0.16, delay: 0.13 }); },
    playExerciseComplete() { tone(523, 0.1, { gain: 0.16 }); tone(659, 0.1, { gain: 0.16, delay: 0.1 }); tone(784, 0.18, { gain: 0.18, delay: 0.2 }); },
    playSessionComplete() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, { type: 'triangle', gain: 0.2, delay: i * 0.13 })); },
    playWorkStart() { tone(330, 0.09, { type: 'triangle', gain: 0.17 }); tone(494, 0.13, { type: 'triangle', gain: 0.15, delay: 0.09 }); },
    playConfirmOpen() { tone(880, 0.07, { type: 'sine', gain: 0.13 }); tone(1174, 0.1, { type: 'sine', gain: 0.11, delay: 0.07 }); },
    playAdjustTick() { tone(1046, 0.05, { type: 'triangle', gain: 0.08 }); },
    playAutoLogged() { tone(587, 0.08, { type: 'triangle', gain: 0.15 }); tone(880, 0.12, { type: 'triangle', gain: 0.16, delay: 0.07 }); },
    playHypoStep() { tone(349, 0.17, { type: 'sine', gain: 0.13 }); tone(523, 0.19, { type: 'sine', gain: 0.12, delay: 0.11 }); },
  };
})();
let soundsOn = true;
function playIfOn(fn) { if (soundsOn) fn(); }

// =====================================================================
// VOZ — Web Speech API nativa del navegador (sin claves, sin dependencias
// externas). Anuncia ejercicios, cuenta atrás y frases motivacionales.
// Se degrada sola y en silencio si el navegador no soporta síntesis de voz.
// =====================================================================
const VoiceCoach = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let esVoice = null;
  if (supported) {
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      // Preferencia estricta por castellano de España; dentro de ese grupo,
      // prioriza voces "de red"/mejoradas (Google, Microsoft Online) sobre
      // las locales del sistema, que suelen sonar más robóticas.
      const esES = voices.filter(v => v.lang === 'es-ES');
      const esAny = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      const pool = esES.length ? esES : esAny;
      esVoice = pool.find(v => /google|online|natural|wavenet/i.test(v.name)) || pool[0] || null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, { rate = 0.97, pitch = 1.0, priority = false } = {}) {
    if (!supported || !voiceOn) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; if (esVoice) u.voice = esVoice;
      // Pequeña variación aleatoria de tono/ritmo en cada frase: una persona
      // real no dice cada frase exactamente igual — esto rompe la sensación
      // de "máquina en bucle" sin sonar artificial.
      u.rate = rate + (Math.random() * 0.05 - 0.025);
      u.pitch = pitch + (Math.random() * 0.05 - 0.025);
      u.volume = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const ENCOURAGEMENTS = [
    'Buen ritmo, sigue así', 'Aguanta, ya casi lo tienes', 'Vamos, mantén la forma',
    'Fuerza, tú puedes con esto', 'No aflojes ahora', 'Respira y sigue empujando',
    'Perfecto, controla el movimiento', 'Un poco más, no te rindas',
  ];
  const SESSION_OPENERS = [
    'Empezamos. Vamos a por este circuito', 'Arranca el entreno de hoy. A por ello',
    'Circuito listo. Concéntrate y vamos',
  ];
  const ROUND_PHRASES = n => [`Vuelta ${n} completada. Buen trabajo`, `Fin de la vuelta ${n}. Sigue así`, `Vuelta ${n} hecha. Aguanta el ritmo`];
  const CIRCUIT_DONE = ['Circuito terminado. Gran trabajo hoy', 'Ya está. Entreno completado, enhorabuena', 'Circuito completo. Muy buen trabajo hoy'];
  return {
    supported,
    sessionStart() { say(pick(SESSION_OPENERS), { rate: 0.98, priority: true }); },
    announceExercise(name, isTimeBased) { say(isTimeBased ? `${name}. Mantén la posición` : name, { priority: true }); },
    countdownGo() { say('Vamos', { rate: 1.0, pitch: 1.02, priority: true }); },
    encourage() { say(pick(ENCOURAGEMENTS)); },
    rest() { say('Descansa', { rate: 0.94, priority: true }); },
    roundDone(n) { say(pick(ROUND_PHRASES(n)), { priority: true }); },
    circuitDone() { say(pick(CIRCUIT_DONE), { priority: true }); },
    hypoStep(name) { say(name, { rate: 0.9, priority: true }); },
    phaseChanged(name) { say(`Nueva fase del plan: ${name}`, { priority: true }); },
  };
})();
let voiceOn = true;

// =====================================================================
// DATA — hombre 55 años, 165cm, ~70kg, nivel AVANZADO.
// Peso corporal + mancuernas 2kg. Ciclo de 4 semanas SIN fase de
// adaptación (ya entrena a diario): arranca directo en Volumen.
// =====================================================================
const BIOTYPE = { ageYears: 55, heightCm: 165, weightKg: 70, sex: 'male' };

// ---- Estimación de calorías (fórmula MET estándar: kcal/min = MET·3.5·kg/200) ----
// MET del circuito por fase: la densidad de trabajo (descanso corto = más
// intensidad media) sube el MET en Intensidad y lo baja en Descarga. Valores
// tomados del Compendium of Physical Activities para "resistance/circuit
// training" de esfuerzo moderado-vigoroso, ajustados por fase.
const MET_CIRCUIT_BY_PHASE = { 1: 6.5, 2: 6.0, 3: 7.5, 4: 5.0 };
const MET_HYPO = 2.8; // trabajo respiratorio/vacío abdominal, esfuerzo bajo
function estimateCalories(circuitSec, hypoSec, phaseKey) {
  const metCircuit = MET_CIRCUIT_BY_PHASE[phaseKey] || 6.5;
  const kcalCircuit = metCircuit * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, circuitSec) / 60);
  const kcalHypo = MET_HYPO * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, hypoSec) / 60);
  return Math.round(kcalCircuit + kcalHypo);
}

const PHASES = {
  1: { name: 'Volumen',    color: '#C8FF3D', desc: 'Base de trabajo del mes: más repeticiones, técnica sólida bajo fatiga moderada. RPE objetivo 7.', seriesMult: 1.0, repsMult: 1.0,  restSec: 40 },
  2: { name: 'Fuerza',     color: '#7DD8FF', desc: 'Menos repeticiones, más descanso, variantes más exigentes. RPE objetivo 7-8.',                     seriesMult: 1.0, repsMult: 0.85, restSec: 55 },
  3: { name: 'Intensidad', color: '#FF6B4A', desc: 'Descansos cortos, máxima densidad de trabajo. RPE objetivo 8-9.',                                   seriesMult: 1.1, repsMult: 1.1,  restSec: 25 },
  4: { name: 'Descarga',   color: '#9AA0AC', desc: 'Recuperación activa. Volumen -35%, prioridad a la técnica antes de subir de nuevo la exigencia.',   seriesMult: 0.65,repsMult: 0.8,  restSec: 45 },
};

const EXERCISES = [
  { id: 'sq_01', name: 'Sentadilla asistida (silla)',        group: 'inferior', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'chair', equip: 'peso corporal', cue: 'Pies a la anchura de hombros, baja hasta rozar el asiento, empuja con talones al subir.' },
  { id: 'sq_02', name: 'Sentadilla peso corporal',           group: 'inferior', level: 2, baseReps: 15, baseSeries: 3, tempo: '2-0-1', icon: 'squat', equip: 'peso corporal', cue: 'Rodillas siguen la línea de los pies, pecho arriba, baja hasta 90° de rodilla.' },
  { id: 'sq_03', name: 'Sentadilla goblet con mancuerna',    group: 'inferior', level: 3, baseReps: 12, baseSeries: 4, tempo: '3-0-1', icon: 'squat', equip: 'mancuernas', weight: 2, cue: 'Sujeta la mancuerna vertical pegada al pecho con ambas manos. Baja controlado 3s, sube fuerte.' },
  { id: 'sq_04', name: 'Sentadilla búlgara con mancuernas',  group: 'inferior', level: 4, baseReps: 10, baseSeries: 4, tempo: '2-0-1', icon: 'lunge', equip: 'mancuernas', weight: 2, cue: 'Pie trasero elevado en silla, una mancuerna en cada mano. Baja recto, rodilla delantera no sobrepasa la punta del pie.' },
  { id: 'sq_05', name: 'Sentadilla a una pierna (asistida)', group: 'inferior', level: 5, baseReps: 6,  baseSeries: 4, tempo: '3-1-1', icon: 'pistol', equip: 'peso corporal', cue: 'Sujeta un punto de apoyo con una mano para equilibrio. Baja controlado a una pierna.' },
  { id: 'sq_06', name: 'Sentadilla goblet con mochila cargada', group: 'inferior', level: 6, baseReps: 12, baseSeries: 4, tempo: '3-0-1', icon: 'squat', equip: 'mochila', reqEquip: 'mochila', cue: 'Mochila cargada (libros/botellas) pegada al pecho como si fuera una pesa. Baja controlado 3s, sube fuerte. Progresión real más allá del techo de las mancuernas de 2-8kg.' },
  { id: 'lu_01', name: 'Zancada estática',                   group: 'inferior', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'peso corporal', cue: 'Paso largo, baja hasta que ambas rodillas formen 90°. Tronco vertical.' },
  { id: 'lu_02', name: 'Zancada caminando con mancuernas',   group: 'inferior', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'mancuernas', weight: 2, cue: 'Una mancuerna en cada mano a los lados. Zancadas alternas avanzando, controla la rodilla delantera.' },
  { id: 'lu_03', name: 'Zancada búlgara alterna',            group: 'inferior', level: 4, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'peso corporal', cue: 'Sin salto (protege rodilla a los 55): alterna pierna delantera cada repetición con control.' },
  { id: 'lu_04', name: 'Zancada con mochila cargada',        group: 'inferior', level: 5, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'mochila', reqEquip: 'mochila', cue: 'Mochila a la espalda bien ceñida (como si fueras de excursión). Zancadas alternas controladas, más carga que con mancuernas fijas.' },
  { id: 'hip_01', name: 'Puente de glúteo',                  group: 'inferior', level: 1, baseReps: 15, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'peso corporal', cue: 'Empuja con talones, aprieta glúteo arriba 1s antes de bajar.' },
  { id: 'hip_02', name: 'Puente de glúteo con mancuerna',    group: 'inferior', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'mancuernas', weight: 2, cue: 'Mancuerna apoyada sobre la cadera, sujeta con ambas manos. Sube y aprieta glúteo arriba.' },
  { id: 'hip_03', name: 'Peso muerto a una pierna con mancuerna', group: 'inferior', level: 4, baseReps: 8, baseSeries: 3, tempo: '3-0-1', icon: 'rdl', equip: 'mancuernas', weight: 2, cue: 'Mancuerna en la mano contraria a la pierna de apoyo. Bisagra de cadera, espalda recta.' },
  { id: 'calf_01', name: 'Elevación de talones con mancuernas', group: 'inferior', level: 2, baseReps: 20, baseSeries: 3, tempo: '1-1-1', icon: 'calf', equip: 'mancuernas', weight: 2, cue: 'Mancuernas a los lados, sube en punta de pies, pausa 1s arriba, baja controlado.' },
  { id: 'wall_01', name: 'Silla contra pared (isométrico)',  group: 'inferior', level: 2, baseReps: 35, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'chair', equip: 'peso corporal', cue: 'Espalda pegada a la pared, rodillas a 90°. Aguanta respirando de forma controlada.' },

  { id: 'pu_01', name: 'Flexión inclinada (manos elevadas)', group: 'superior_empuje', level: 1, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Manos en una superficie elevada (mesa/banco). Cuerpo recto, baja el pecho hacia las manos.' },
  { id: 'pu_02', name: 'Flexión de rodillas',                group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Rodillas apoyadas, cadera-hombro-rodilla en línea. Codos a 45° del cuerpo.' },

  { id: 'pu_04', name: 'Flexión con mochila cargada',        group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'mochila', reqEquip: 'mochila', cue: 'Mochila centrada sobre la parte alta de la espalda (entre los omóplatos), bien ajustada. Misma técnica que la flexión estándar, más resistencia. No la cargues más de lo que aguantes en forma estricta.' },
  { id: 'press_01', name: 'Press de hombro con mancuernas (sentado)', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'press', equip: 'mancuernas', weight: 2, cue: 'Sentado, mancuernas a la altura del hombro, empuja arriba sin bloquear codo del todo.' },
  { id: 'fly_01', name: 'Aperturas de pecho con mancuernas (suelo)', group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 3, tempo: '3-0-1', icon: 'fly', equip: 'mancuernas', weight: 2, cue: 'Tumbado, brazos abiertos con ligera flexión de codo, baja controlado, sube juntando.' },
  { id: 'dip_01', name: 'Fondos en silla',                   group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'dip', equip: 'peso corporal', cue: 'Manos en el borde de la silla, piernas extendidas. Baja hasta 90° de codo, sin hundir hombros.' },
  { id: 'pike_01', name: 'Flexión pike (hombro)',            group: 'superior_empuje', level: 4, baseReps: 8,  baseSeries: 3, tempo: '2-0-1', icon: 'pike', equip: 'peso corporal', cue: 'Cadera elevada en V invertida. Baja la cabeza entre las manos, empuja de vuelta arriba.' },
  { id: 'lat_01', name: 'Elevaciones laterales con mancuernas', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'lateral', equip: 'mancuernas', weight: 2, cue: 'Brazos a los lados, sube hasta la altura del hombro con ligera flexión de codo. Sin impulso.' },

  { id: 'row_01', name: 'Remo invertido (mesa)',             group: 'superior_traccion', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'peso corporal', cue: 'Cuerpo bajo la mesa, agarra el borde, tira del pecho hacia arriba manteniendo el cuerpo recto.' },
  { id: 'row_02', name: 'Remo a una mano con mancuerna',     group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'mancuernas', weight: 2, cue: 'Apoyo con una mano en silla/mesa, tira de la mancuerna hacia la cadera, codo pegado al cuerpo.' },
  { id: 'row_03', name: 'Superman',                          group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'superman', equip: 'peso corporal', cue: 'Tumbado boca abajo, eleva brazos y piernas a la vez, aprieta lumbar y glúteo.' },

const STORAGE_KEY = 'forma55_state_v4';
const DEFAULT_LEVEL = 3;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.equipment) s.equipment = { mochila: false };
      if (!s.backpackWeight) s.backpackWeight = 6;

// =====================================================================
// SINCRONIZACIÓN ENTRE DISPOSITIVOS — vía jsonblob.com (almacenamiento
// JSON público, sin cuenta ni clave). Cada perfil tiene un "código" que
// es el ID del blob; guardar hace PUT a ese blob, y en otro dispositivo
// se introduce el mismo código para traer (GET) ese progreso. Si un
// código no se usa en 75 días el servicio lo borra automáticamente.
// =====================================================================
const SYNC_API = 'https://jsonblob.com/api/jsonBlob';
let syncTimer = null;
let syncing = false;
let syncCreateInFlight = null;

async function syncCreate(state) {
  if (syncCreateInFlight) return syncCreateInFlight;
  syncCreateInFlight = (async () => {
    try {
      const res = await fetch(SYNC_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
      const loc = res.headers.get('Location') || '';
      const id = loc.split('/').pop();
      if (id) { state.syncCode = id; saveState(state); }
    } catch (e) { /* sin conexión: se reintenta en el próximo cambio */ }
  })();
  try { await syncCreateInFlight; } finally { syncCreateInFlight = null; }
}
function syncPush(state) {
  if (!state.syncCode) { syncCreate(state); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try { await fetch(`${SYNC_API}/${state.syncCode}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) }); } catch (e) {}
  }, 1200);
}
async function syncPull(code) {
  const res = await fetch(`${SYNC_API}/${code.trim()}`);
  if (!res.ok) throw new Error('Código no encontrado');
  const remote = await res.json();
  remote.syncCode = code.trim();
  if (!remote.equipment) remote.equipment = { mochila: false };
  if (!remote.backpackWeight) remote.backpackWeight = 6;
  saveState(remote);
  return remote;
}

function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); if (!syncing) syncPush(state); }
function getExerciseLevel(state, exerciseId, defaultLevel) {
  const rec = state.exerciseLevels[exerciseId];
  return rec ? rec.level : (defaultLevel != null ? defaultLevel : DEFAULT_LEVEL);
}
function getVolumeBonus(state, exerciseId) { const rec = state.exerciseLevels[exerciseId]; return rec ? (rec.volumeBonus || 0) : 0; }
function getFamilyLevel(state, prefix) {
  for (const [exId, rec] of Object.entries(state.exerciseLevels)) { if (exId.split('_')[0] === prefix) return rec.level; }
  return DEFAULT_LEVEL;
}
function findVariantByLevel(baseGroupId, targetLevel, state) {
  const hasEquip = e => !e.reqEquip || (state && state.equipment && state.equipment[e.reqEquip]);
  const family = EXERCISES.filter(e => e.id.split('_')[0] === baseGroupId && hasEquip(e));
  if (!family.length) return null;
  family.sort((a, b) => a.level - b.level);
  let best = family[0];
  for (const e of family) { if (e.level <= targetLevel) best = e; }
  return best;
}
function computeTargetReps(exercise, phaseKey, state) {
  const phase = PHASES[phaseKey];
  const volBonus = getVolumeBonus(state, exercise.id);
  return Math.round(exercise.baseReps * phase.repsMult) + volBonus * 2;
}
function computeTargetSeries(exercise, phaseKey) {
  const phase = PHASES[phaseKey];
  return Math.max(2, Math.round(exercise.baseSeries * phase.seriesMult));
}
// ---- Temporización automática de la serie (para que la app avance sola) ----
const PACE_MULT = { lento: 1.28, normal: 1.0, rapido: 0.82 };
function secondsPerRep(tempo) {
  if (tempo === 'iso') return null;
  return Math.max(1.4, tempo.split('-').reduce((sum, p) => sum + (p.trim().toUpperCase() === 'X' ? 0.4 : (parseFloat(p) || 1)), 0));
}
function computeWorkSeconds(exercise, pace) {
  const mult = PACE_MULT[pace] || 1.0;
  if (exercise.isTimeBased) return exercise.targetReps; // ya es un tiempo objetivo real, no se escala por ritmo
  return Math.max(6, Math.round(exercise.targetReps * secondsPerRep(exercise.tempo) * mult));
}
// ---- RPE automático a partir de las reps confirmadas vs. objetivo (sin escala táctil) ----
// Tiempo total estimado del día: N vueltas del circuito (trabajo + confirmación
// de reps + descansos, incluido el descanso entre vueltas) + bloque hipopresivo
// final. Usa exactamente la misma lógica que la sesión real (computeWorkSeconds,
// CONFIRM_SECONDS, restSec de la fase), así que es una previsión fiel, no una
// media genérica.
function estimateDaySeconds(session, rounds, pace) {
  const perExercise = session.exercises.reduce((sum, ex) => sum + computeWorkSeconds(ex, pace) + CONFIRM_SECONDS + ex.restSec, 0);
  const roundTransition = session.exercises.length ? Math.round(session.exercises[0].restSec * 1.8) : 0;
  const circuitsSeconds = perExercise * rounds + roundTransition * Math.max(0, rounds - 1);
  const hypoSeconds = HYPOPRESSIVE_BLOCK.reduce((sum, s) => sum + s.duration, 0);
  return circuitsSeconds + hypoSeconds;
}
function fmtMinutes(totalSeconds) { return Math.round(totalSeconds / 60); }

function estimateRpe(actualReps, targetReps, phaseKey) {
  const base = { 1: 7, 2: 7.5, 3: 8.5, 4: 6 }[phaseKey] || 7;
  const ratio = targetReps > 0 ? actualReps / targetReps : 1;
  let rpe = base;
  if (ratio >= 1.15) rpe = base - 1.5;
  else if (ratio >= 1.0) rpe = base - 0.5;
  else if (ratio >= 0.9) rpe = base;
  else if (ratio >= 0.75) rpe = base + 1;
  else rpe = base + 2;
  return Math.max(3, Math.min(10, Math.round(rpe)));
}
function applyResult(state, exercise, setsDone, phaseKey) {
  const targetReps = computeTargetReps(exercise, phaseKey, state);
  const avgReps = setsDone.reduce((s, x) => s + x.reps, 0) / setsDone.length;
  const avgRpe = setsDone.reduce((s, x) => s + x.rpe, 0) / setsDone.length;
  const levelBefore = getExerciseLevel(state, exercise.id, exercise.level);
  const volBefore = getVolumeBonus(state, exercise.id);
  let levelAfter = levelBefore, volAfter = volBefore;
  const pctOfTarget = avgReps / targetReps;
  const familyPrefix = exercise.id.split('_')[0];
  if (pctOfTarget >= 1.0 && avgRpe <= 7) {
    const nextVariant = findVariantByLevel(familyPrefix, levelBefore + 1, state);
    if (nextVariant && nextVariant.level > levelBefore) { levelAfter = nextVariant.level; volAfter = 0; }
    else { volAfter = volBefore + 1; }
  } else if (pctOfTarget < 0.75 || avgRpe >= 9) {
    const prevVariant = findVariantByLevel(familyPrefix, levelBefore - 1, state);
    if (prevVariant && prevVariant.level < levelBefore) levelAfter = prevVariant.level;
    volAfter = 0;
  } else { volAfter = volBefore + 1; }
  state.exerciseLevels[exercise.id] = { level: levelAfter, volumeBonus: volAfter };
  state.history.push({ date: new Date().toISOString(), phase: phaseKey, exerciseId: exercise.id, setsDone, levelBefore, levelAfter });
  saveState(state);
  return { levelBefore, levelAfter, progressed: levelAfter > levelBefore, regressed: levelAfter < levelBefore };
}
function pickExercisesForTemplate(state, template) {
  const picked = []; const groups = template.groups; let gi = 0; const usedIds = new Set(); let guard = 0;
  while (picked.length < EXERCISES_PER_SESSION && guard < 40) {
    guard++;
    const group = groups[gi % groups.length];
    const candidates = EXERCISES.filter(e => e.group === group && !usedIds.has(e.id.split('_')[0]) && (!e.reqEquip || (state.equipment && state.equipment[e.reqEquip])));
    if (candidates.length) {
      const familyPrefixes = [...new Set(candidates.map(e => e.id.split('_')[0]))];
      const prefix = familyPrefixes[picked.length % familyPrefixes.length];
      const effectiveLevel = getFamilyLevel(state, prefix);
      const variant = findVariantByLevel(prefix, effectiveLevel, state) || candidates[0];
      picked.push(variant); usedIds.add(prefix);
    }
    gi++;
  }
  return picked;
}
function withCurrentWeight(ex, state) {
  if (ex.equip === 'mancuernas') return { ...ex, weight: state.dumbbellWeight || 2 };
  if (ex.equip === 'mochila') return { ...ex, weight: state.backpackWeight || 6 };
  return ex;
}
function hasReqEquip(ex, state) { return !ex.reqEquip || (state.equipment && state.equipment[ex.reqEquip]); }

// ---- Recomendación de cuándo subir el peso ----
// Criterio: si el usuario ya está en la variante más difícil disponible con
// mancuernas/mochila para una familia de ejercicio, y lleva volumeBonus >= 3
// (varias sesiones seguidas cumpliendo o superando el objetivo con buen RPE
// sin poder subir de nivel porque ya no hay variante más difícil), significa
// que el peso actual se le ha quedado corto — el próximo paso lógico es
// aumentar la carga externa, no añadir más repeticiones sin límite.
function computeWeightAdvice(state) {
  const families = [...new Set(EXERCISES.map(e => e.id.split('_')[0]))];
  const advice = { dumbbell: [], backpack: [] };
  for (const prefix of families) {
    const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix);
    const rec = state.exerciseLevels[Object.keys(state.exerciseLevels).find(id => id.split('_')[0] === prefix)];
    if (!rec) continue;
    const currentLevel = rec.level;
    const currentEx = family.find(e => e.level === currentLevel);
    if (!currentEx) continue;
    const maxDumbbellLevel = Math.max(0, ...family.filter(e => e.equip === 'mancuernas').map(e => e.level));
    const maxBackpackLevel = Math.max(0, ...family.filter(e => e.equip === 'mochila').map(e => e.level));
    if (currentEx.equip === 'mancuernas' && currentLevel === maxDumbbellLevel && (rec.volumeBonus || 0) >= 3) {
      advice.dumbbell.push(currentEx.name);
    }
    if (currentEx.equip === 'mochila' && currentLevel === maxBackpackLevel && (rec.volumeBonus || 0) >= 3) {
      advice.backpack.push(currentEx.name);
    }
  }
  return advice;
}
function generateSession(state) {
  const jsDay = new Date().getDay(); const isoDay = jsDay === 0 ? 7 : jsDay;
  let template = WEEKLY_TEMPLATE.find(t => t.day === isoDay);
  if (!template) template = WEEKLY_TEMPLATE[state.totalSessionsDone % WEEKLY_TEMPLATE.length];
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  const picked = pickExercisesForTemplate(state, template);
  const exercisesWithTargets = picked.map(ex => ({ ...withCurrentWeight(ex, state), targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: phase.restSec }));
  return { templateName: template.name, phaseKey, phase, exercises: exercisesWithTargets };
}
function getWeeklyPlan(state) {
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  return WEEKLY_TEMPLATE.map(template => {
    const picked = pickExercisesForTemplate(state, template);
    return { day: template.day, name: template.name, exercises: picked.map(ex => ({ ...withCurrentWeight(ex, state), targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: phase.restSec })) };
  });
}
function completeSession(state, roundsCompleted, circuitDurationSec) {
  state.totalSessionsDone += 1;
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: roundsCompleted,
    phase: state.cycleWeek,
    circuitDurationSec: Math.max(0, Math.round(circuitDurationSec || 0)),
    hypoDurationSec: 0,
    calories: estimateCalories(circuitDurationSec || 0, 0, state.cycleWeek),
  });
  if (state.totalSessionsDone % 6 === 0) {
    const wasDescarga = state.cycleWeek >= 4;
    state.cycleWeek = state.cycleWeek >= 4 ? 1 : state.cycleWeek + 1;
    setTimeout(() => VoiceCoach.phaseChanged(PHASES[state.cycleWeek].name), 1800);
    // Cada 4 semanas, al cerrar Descarga y arrancar Volumen de nuevo, es el
    // mejor momento fisiológico para probar más peso (cuerpo fresco tras el
    // deload). Se marca aquí en vez de depender de que el usuario se acuerde.
    if (wasDescarga && state.cycleWeek === 1) state.weightReviewDue = true;
  }
  saveState(state);
}

// Se llama al terminar el bloque hipopresivo (con o sin la extensión de 2 min)
// para completar el registro del día: hasta este punto no se sabe el tiempo
// real de hipopresivos, así que la entrada del calendario/progreso se rellena
// aquí y no en completeSession.
function finalizeSessionStats(state, hypoDurationSec) {
  const entry = state.sessionLog[state.sessionLog.length - 1];
  if (!entry) return;
  entry.hypoDurationSec = Math.max(0, Math.round(hypoDurationSec || 0));
  entry.calories = estimateCalories(entry.circuitDurationSec, entry.hypoDurationSec, entry.phase);
  saveState(state);
}

function useFigureLoop(period, active) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) % period) / period), 55);
    return () => clearInterval(id);
  }, [period, active]);
  return t;
}
function triWave(t) { return t < 0.5 ? t * 2 : (1 - t) * 2; }

function useFlip(period) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setOn(o => !o), period);
    return () => clearInterval(id);
  }, [period]);
  return on;
}

// Visual de un ejercicio: foto real (flipbook 2 fotogramas) si existe
// una correspondencia verificada para ESE ejercicio exacto; si no, la
// silueta animada por FK como respaldo (nunca se rompe la pantalla ni
// se repite la foto de otro ejercicio distinto).
function ExerciseVisual({ exId, iconKey, size = 150 }) {
  const entry = EXERCISE_TO_PHOTO[exId];
  const [broken, setBroken] = useState(false);
  const flip = useFlip(750);
  if (!entry || broken) return html`<${Figure} iconKey=${iconKey} size=${size} />`;
  if (typeof entry === 'object') {
    return html`
      <div class="photo-wrap" style=${{ width: size, height: size }}>
        <img src=${entry.url} alt="" style=${{ background: '#fff', objectFit: 'contain', padding: '8px' }} onError=${() => setBroken(true)} />
        ${entry.credit ? html`<span class="photo-credit">${entry.credit}</span>` : null}
      </div>
    `;
  }
  return html`
    <div class="photo-wrap" style=${{ width: size, height: size }}>
      <img src=${`${PHOTO_BASE}${entry}/${flip ? 1 : 0}.jpg`} alt="" onError=${() => setBroken(true)} />
    </div>
  `;
}

function Figure({ iconKey, size = 140, phase, vivid = true }) {
  const poseKey = ICON_TO_POSE[iconKey] || 'vacuum';
  const t = useFigureLoop(1450, phase == null);
  const p = phase != null ? phase : triWave(t);
  const svg = buildFigureMarkup(poseKey, p, vivid);
  return html`<div class="figure-wrap" style=${{ width: size, height: size * 1.25 }}>
    <svg viewBox="0 0 120 150" style=${{ width: '100%', height: '100%' }} dangerouslySetInnerHTML=${{ __html: svg }} />
  </div>`;
}

// Construye el SVG completo (torso + cabeza + 2 brazos + 2 piernas) por FK real,
// con gradientes de volumen, articulaciones redondeadas, manos/pies y sombra
// de suelo para una lectura mucho más realista del movimiento.
function buildFigureMarkup(poseKey, phase, vivid) {
  const cfg = FIG_POSES[poseKey] || FIG_POSES.vacuum;
  const A = cfg.A, B = cfg.B;
  const torso = lerp(A.torso, B.torso, phase), dy = lerp(A.dy, B.dy, phase);
  const legL = pairL(A.legL, B.legL, phase), legR = pairL(A.legR, B.legR, phase);
  const armL = pairL(A.armL, B.armL, phase), armR = pairL(A.armR, B.armR, phase);
  const orient = A.orient || 0;
  const { hipY, shY, headR, thigh, shin, uarm, farm, hipDx, shDx } = FIG;
  const torsoLen = hipY - shY;
  const lLeg = fkPoint(0, 0, thigh, legL[0], shin, legL[1]);
  const rLeg = fkPoint(0, 0, thigh, legR[0], shin, legR[1]);
  const lArm = fkPoint(0, 0, uarm, armL[0], farm, armL[1]);
  const rArm = fkPoint(0, 0, uarm, armR[0], farm, armR[1]);
  const bodyC = vivid ? 'url(#gBody)' : 'var(--text-dim)';
  const armC = vivid ? 'url(#gArm)' : 'var(--text-dim)';
  const legC = vivid ? 'url(#gLeg)' : 'var(--text-dim)';
  const belly = poseKey === 'vacuum' ? `<ellipse cx="0" cy="${-torsoLen * 0.42}" rx="${lerp(14, 7, triWave((phase + 0.5) % 1))}" ry="9" fill="var(--bg)" opacity="0.6"/>` : '';
  const lFootAng = legL[0] + legL[1], rFootAng = legR[0] + legR[1];
  const defs = `
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.body}"/><stop offset="100%" stop-color="${COL.bodyDark}"/>
      </linearGradient>
      <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${COL.arm}"/><stop offset="100%" stop-color="${COL.armDark}"/>
      </linearGradient>
      <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.leg}"/><stop offset="100%" stop-color="${COL.legDark}"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  const shadow = `<ellipse cx="60" cy="132" rx="${orient !== 0 ? 40 : 26}" ry="7" fill="url(#gShadow)"/>`;
  return `
    ${defs}
    ${shadow}
    <g transform="translate(60 ${hipY + dy}) rotate(${orient} 0 ${-dy})">
      <line x1="${-hipDx}" y1="0" x2="${lLeg.mx}" y2="${lLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${lLeg.mx - hipDx}" y1="${lLeg.my}" x2="${lLeg.ex - hipDx}" y2="${lLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${lLeg.mx - hipDx * 0.5}" cy="${lLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${lLeg.ex - hipDx + 6 * Math.sin(lFootAng * Math.PI / 180)}" cy="${lLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${lFootAng * 0.4} ${lLeg.ex - hipDx} ${lLeg.ey})"/>
      <line x1="${hipDx}" y1="0" x2="${rLeg.mx}" y2="${rLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${rLeg.mx + hipDx}" y1="${rLeg.my}" x2="${rLeg.ex + hipDx}" y2="${rLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${rLeg.mx + hipDx * 0.5}" cy="${rLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${rLeg.ex + hipDx + 6 * Math.sin(rFootAng * Math.PI / 180)}" cy="${rLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${rFootAng * 0.4} ${rLeg.ex + hipDx} ${rLeg.ey})"/>
      <g transform="rotate(${torso})">
        <rect x="-6" y="${-torsoLen - 8}" width="12" height="12" rx="5" fill="${bodyC}"/>
        <path d="M -21,${-torsoLen + 2} Q -22,${-torsoLen - 6} -12,${-torsoLen - 9} Q 0,${-torsoLen - 12} 12,${-torsoLen - 9} Q 22,${-torsoLen - 6} 21,${-torsoLen + 2} L 14,-6 Q 15,4 8,10 L -8,10 Q -15,4 -14,-6 Z" fill="${bodyC}"/>
        <path d="M -13,${-torsoLen + 10} Q 0,${-torsoLen + 4} 13,${-torsoLen + 10} L 13,${-torsoLen + 22} Q 0,${-torsoLen + 16} -13,${-torsoLen + 22} Z" fill="#000" opacity="0.08"/>
        <circle cx="0" cy="${-torsoLen - headR - 10}" r="${headR}" fill="${bodyC}"/>
        <path d="M ${-headR + 1},${-torsoLen - headR - 15} Q 0,${-torsoLen - headR - 24} ${headR - 1},${-torsoLen - headR - 15} Q ${headR - 1},${-torsoLen - headR - 20} 0,${-torsoLen - headR - 19} Q ${-headR + 1},${-torsoLen - headR - 20} ${-headR + 1},${-torsoLen - headR - 15} Z" fill="#000" opacity="0.16"/>
        ${belly}
        <line x1="${-shDx}" y1="${-torsoLen}" x2="${lArm.mx - shDx}" y2="${lArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${lArm.mx - shDx}" cy="${lArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${lArm.mx - shDx}" y1="${lArm.my - torsoLen}" x2="${lArm.ex - shDx}" y2="${lArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${lArm.ex - shDx}" cy="${lArm.ey - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${shDx}" y1="${-torsoLen}" x2="${rArm.mx + shDx}" y2="${rArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${rArm.mx + shDx}" cy="${rArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${rArm.mx + shDx}" y1="${rArm.my - torsoLen}" x2="${rArm.ex + shDx}" y2="${rArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${rArm.ex + shDx}" cy="${rArm.ey - torsoLen}" r="6" fill="${armC}"/>
      </g>
    </g>`;
}

function fmtTime(s) { const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec.toString().padStart(2, '0')}`; }
function useCountdown(initial, onComplete, running) {
  const [remaining, setRemaining] = useState(initial);
  const cb = useRef(onComplete); cb.current = onComplete;
  const prevRunning = useRef(false);
  // Al activarse (running pasa de false a true), el valor debe partir SIEMPRE
  // de `initial`, nunca del remanente de la vez anterior (p.ej. el "0" con el
  // que terminó el ciclo pasado). Corregirlo aquí, durante el render, evita
  // que el efecto de abajo llegue a ver ese remanente y se autocomplete al
  // instante — que es lo que provocaba el salto de un ejercicio entero al
  // pulsar "Saltar descanso" (un fix anterior que solo corregía esto dentro
  // de un useEffect no bastaba: ambos efectos del mismo hook se ejecutan en
  // la misma pasada de render con el valor todavía obsoleto). Verificado con
  // un arnés de pruebas real (React + temporizadores simulados) antes de
  // aplicar este cambio.
  let effectiveRemaining = remaining;
  if (running && !prevRunning.current && remaining !== initial) {
    setRemaining(initial);
    effectiveRemaining = initial;
  }
  prevRunning.current = running;
  useEffect(() => {
    if (!running) return;
    if (effectiveRemaining <= 0) { cb.current && cb.current(); return; }
    const t = setTimeout(() => setRemaining(r => r - 1), 1000);
    return () => clearTimeout(t);
  }, [effectiveRemaining, running]);
  return [effectiveRemaining, setRemaining];
}

const GROUP_LABELS = { inferior: 'Tren inferior', superior_empuje: 'Empuje (pecho/hombro)', superior_traccion: 'Tracción (espalda)', core: 'Core', cardio: 'Cardio / metabólico' };
const TIME_CAPTIONS = ['1. Posición inicial', '2. Mantén la tensión', '3. Suelta controlado'];
const REP_CAPTIONS = ['1. Posición inicial', '2. Ejecuta el movimiento', '3. Vuelve controlado'];

// Tarjeta-storyboard de un ejercicio: número, nombre, reps/series, grupo
// muscular y 3 fotogramas estáticos de la silueta (inicio → medio → fin),
// igual que el guion visual de referencia pero con la figura propia.
function TodayExerciseCard({ ex, num }) {
  const hasPhoto = !!EXERCISE_TO_PHOTO[ex.id];
  const captions = ex.isTimeBased ? TIME_CAPTIONS : REP_CAPTIONS;
  const frames = [0, 0.5, 1];
  return html`
    <div class="today-card">
      <span class="today-card-num">${num}</span>
      <div class="today-card-body">
        <p class="today-card-name">${ex.name}</p>
        <p class="today-card-meta">${ex.isTimeBased ? `${ex.targetReps}s` : `${ex.targetReps} reps`} · ${ex.targetSeries}${ex.equip === 'mancuernas' || ex.equip === 'mochila' ? ` · ${ex.weight}kg` : ''}</p>
        <p class="today-card-group">${GROUP_LABELS[ex.group] || ex.group}</p>
        ${hasPhoto ? html`
          <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${240} />
        ` : html`
          <div class="today-card-frames">
            ${frames.map((f, i) => html`
              <${React.Fragment} key=${i}>
                <div class="today-frame">
                  <${Figure} iconKey=${ex.icon} size=${104} phase=${f} vivid=${true} />
                  <p class="today-frame-cap">${captions[i]}</p>
                </div>
                ${i < frames.length - 1 ? html`<span class="today-frame-arrow">→</span>` : null}
              </${React.Fragment}>
            `)}
          </div>
        `}
      </div>
    </div>
  `;
}
function TodayExerciseCards({ exercises }) {
  return html`
    <div>
      <p class="today-cards-title">Ejercicios de hoy, paso a paso</p>
      ${exercises.map((ex, i) => html`<${TodayExerciseCard} key=${ex.id} ex=${ex} num=${i + 1} />`)}
    </div>
  `;
}

function Home({ state, onStart, onOpenProgress, onOpenSettings, onOpenWeekPlan, todaySession, onSetRounds, onReviewWeightsNow, onSnoozeWeights }) {
  const phase = PHASES[state.cycleWeek];
  const sessionsInWeek = state.totalSessionsDone % 6;
  const jsDay = new Date().getDay();
  const isoDay = jsDay === 0 ? 7 : jsDay;
  const isRestDay = isoDay === REST_DAY;

  // --- Aviso automático de revisión de peso: cada 4 semanas al arrancar
  // Volumen tras el Descarga (mejor momento fisiológico para probar más
  // carga), y como red de seguridad, también si pasan 14 días sin revisar
  // aunque no haya coincidido con el cambio de fase. Se puede posponer 3
  // días sin perder el aviso de fondo. */
  const today = new Date().toISOString().slice(0, 10);
  const daysSinceReview = Math.floor((new Date(today) - new Date(state.lastWeightReviewDate)) / 86400000);
  const snoozed = state.weightReviewSnoozeUntil && state.weightReviewSnoozeUntil > today;
  const showWeightReminder = !snoozed && (state.weightReviewDue || daysSinceReview >= 14);

  return html`
    <div class="screen home">
      <header class="home-header">
        <div>
          <p class="eyebrow">${DAY_NAMES[isoDay]} · Semana ${state.cycleWeek} del plan mensual</p>
          <h1>${phase.name}</h1>
        </div>
        <button class="icon-btn" onClick=${onOpenSettings} aria-label="Configuración">⚙</button>
      </header>

      ${showWeightReminder ? html`
        <div class="weight-reminder">

// =====================================================================
// PANTALLA: CIRCUITO (rondas de 5 ejercicios, con descanso entre rondas)
// =====================================================================
// Flujo 100% automático: trabajo (temporizado según objetivo+tempo) → confirmación
// de reps de 5s (ajustable con ±, si no se toca nada se autorregistra el objetivo)
// → descanso → siguiente ejercicio/vuelta, todo encadenado sin necesidad de tocar
// la pantalla. El botón de pausa es la única acción que corta la cadena.
const CONFIRM_SECONDS = 10;

function TrainingSession({ session, state, rounds, onFinishCircuit, onExit }) {
  const [roundIdx, setRoundIdx] = useState(0);
  const [exIdx, setExIdx] = useState(0);
  const [phase, setPhase] = useState('countdown'); // countdown | work | rest | roundrest | extend-prompt
  const [setsLog, setSetsLog] = useState({});
  const [paused, setPaused] = useState(false);
  const [extraRounds, setExtraRounds] = useState(0);
  const circuitStartRef = useRef(Date.now());

  const ex = session.exercises[exIdx];
  const isLastExInRound = exIdx === session.exercises.length - 1;
  const effectiveRounds = rounds + extraRounds;
  const isLastRound = roundIdx === effectiveRounds - 1;
  const pace = state.pace || 'normal';

  function finalizeCircuit() {
    playIfOn(Sound.playSessionComplete);
    VoiceCoach.circuitDone();
    const results = [];
    session.exercises.forEach(e => {
      const doneSets = setsLog[e.id] || [];
      if (doneSets.length) results.push({ exercise: e, ...applyResult(state, e, doneSets, session.phaseKey) });
    });
    const circuitDurationSec = Math.round((Date.now() - circuitStartRef.current) / 1000);
    completeSession(state, effectiveRounds, circuitDurationSec);
    onFinishCircuit(results);
  }

  // --- Cuenta atrás de 5s antes de cada ejercicio (deja tiempo a la voz a
  // nombrar el ejercicio sin cortarse, transición limpia) ---
  const COUNTDOWN_SECONDS = 5;
  const [countRemaining, setCountRemaining] = useCountdown(COUNTDOWN_SECONDS, () => setPhase('work'), phase === 'countdown' && !paused);
  useEffect(() => { if (phase === 'countdown') { setCountRemaining(COUNTDOWN_SECONDS); playIfOn(Sound.playConfirmOpen); VoiceCoach.announceExercise(ex.name, ex.isTimeBased); } }, [phase, roundIdx, exIdx]);

  // --- Temporizador de TRABAJO (auto): cuenta el tiempo estimado de la serie y
  // registra sola el objetivo propuesto al terminar — sin pedir confirmación.
  // También se puede forzar a 0 con "Ya he terminado" para pasar antes. ---
  const workSeconds = computeWorkSeconds(ex, pace);
  const [workRemaining, setWorkRemaining] = useCountdown(workSeconds, () => {
    playIfOn(Sound.playAutoLogged);
    const rpe = estimateRpe(ex.targetReps, ex.targetReps, session.phaseKey);
    setSetsLog(prev => ({ ...prev, [ex.id]: [...(prev[ex.id] || []), { reps: ex.targetReps, rpe }] }));
    setPhase('rest');
  }, phase === 'work' && !paused);
  useEffect(() => { if (phase === 'work') { setWorkRemaining(workSeconds); playIfOn(Sound.playWorkStart); VoiceCoach.countdownGo(); } }, [phase, roundIdx, exIdx]);
  const encouragedRef = useRef(null);
  useEffect(() => {
    if (phase !== 'work') return;
    const key = `${roundIdx}-${exIdx}`;
    if (workSeconds >= 14 && workRemaining === Math.round(workSeconds / 2) && encouragedRef.current !== key) {
      encouragedRef.current = key;
      VoiceCoach.encourage();
    }
  }, [phase, workRemaining]);

  // --- Descansos (entre series/ejercicios y entre vueltas) ---
  const restDuration = phase === 'roundrest' ? Math.round(ex.restSec * 1.8) : ex.restSec;
  const [restRemaining, setRestRemaining] = useCountdown(restDuration, () => {
    if (phase === 'roundrest') {
      playIfOn(Sound.playRestEnd);
      setRoundIdx(r => r + 1); setExIdx(0); setPhase('countdown');
      return;
    }
    playIfOn(Sound.playRestEnd);
    if (isLastExInRound) {
      if (isLastRound) { playIfOn(Sound.playRoundEnd); VoiceCoach.roundDone(roundIdx + 1); setPhase('extend-prompt'); }
      else { playIfOn(Sound.playRoundEnd); VoiceCoach.roundDone(roundIdx + 1); setPhase('roundrest'); }
    } else {
      setExIdx(i => i + 1); setPhase('countdown');
    }
  }, (phase === 'rest' || phase === 'roundrest') && !paused);
  useEffect(() => { if (phase === 'rest' || phase === 'roundrest') { setRestRemaining(restDuration); VoiceCoach.rest(); } }, [phase, roundIdx, exIdx]);

  const lastBeepedRef = useRef(null);
  useEffect(() => {
    if (phase !== 'rest' && phase !== 'roundrest') return;
    if (restRemaining <= 3 && restRemaining > 0 && lastBeepedRef.current !== restRemaining) {
      lastBeepedRef.current = restRemaining;
      playIfOn(() => Sound.playCountdownBeep(restRemaining === 1));
    }
  }, [phase, restRemaining]);

  function acceptExtraRound() {
    setExtraRounds(r => r + 1);
    setRoundIdx(r => r + 1); setExIdx(0); setPhase('countdown');
  }

  const PauseBtn = html`
    <div class="session-controls">
      <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el progreso de esta vuelta sin registrar.')) onExit(); }} aria-label="Volver al inicio">←</button>
      <button class=${`pause-btn ${paused ? 'active' : ''}`} onClick=${() => setPaused(p => !p)} aria-label="Pausar">${paused ? '▶' : '❚❚'}</button>
    </div>
  `;

  if (phase === 'extend-prompt') {
    return html`
      <div class="screen extend-prompt">
        ${PauseBtn}
        <p class="eyebrow">Vuelta ${roundIdx + 1}/${effectiveRounds} completada</p>
        <h2>¿Una vuelta más para trabajar más?</h2>
        <p class="cue-text">Has terminado las vueltas previstas de hoy. Puedes añadir una vuelta extra ahora mismo o cerrar el circuito y pasar al bloque hipopresivo.</p>
        <button class="btn-primary btn-huge" onClick=${acceptExtraRound}>Sí, una vuelta más</button>
        <button class="btn-secondary" onClick=${finalizeCircuit}>No, terminar aquí</button>
      </div>
    `;
  }

  if (phase === 'roundrest') {
    return html`
      <div class="screen roundrest">
        ${PauseBtn}
        <span class="roundrest-badge">Fin de vuelta ${roundIdx + 1}/${effectiveRounds}</span>
        <p class="timer-big">${fmtTime(restRemaining)}</p>
        <p class="cue-text">Descanso entre vueltas del circuito. La vuelta ${roundIdx + 2} empieza sola cuando acaba la cuenta.</p>
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'rest') {
    const nextIsRoundEnd = isLastExInRound;
    const nextEx = nextIsRoundEnd ? null : session.exercises[exIdx + 1];
    const nextName = nextIsRoundEnd ? (isLastRound ? 'Fin del circuito' : `Descanso entre vueltas`) : nextEx.name;
    return html`
      <div class="screen rest">
        ${PauseBtn}
        <p class="eyebrow">Descanso · Vuelta ${roundIdx + 1}/${effectiveRounds}</p>
        <p class="timer-big rest-timer">${fmtTime(restRemaining)}</p>
        <p class="rest-next">Siguiente: ${nextName}</p>
        ${nextEx ? html`
          <p class="rest-next-detail">
            <span class="rest-next-reps">${nextEx.isTimeBased ? `${nextEx.targetReps}s` : `${nextEx.targetReps} reps`}</span>${nextEx.equip === 'mancuernas' ? ` · mancuernas ${nextEx.weight}kg` : nextEx.equip === 'mochila' ? ` · mochila ${nextEx.weight}kg` : ''}
          </p>
        ` : null}
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'countdown') {
    return html`
      <div class="screen prep">
        ${PauseBtn}
        <span class="round-badge">Vuelta ${roundIdx + 1} de ${effectiveRounds}</span>
        <p class="eyebrow">Ejercicio ${exIdx + 1}/${session.exercises.length}</p>
        <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${140} />
        <h2>${ex.name}</h2>
        <p class="prep-count">${countRemaining || '¡Vamos!'}</p>
        <p class="cue-text">Prepárate: empieza sola en un momento.</p>
        <button class="btn-secondary" onClick=${() => setCountRemaining(0)}>Empezar ya</button>
      </div>
    `;
  }

  return html`
    <div class="screen work">
      ${PauseBtn}
      <span class="round-badge">Vuelta ${roundIdx + 1} de ${effectiveRounds}</span>
      <p class="eyebrow">${session.templateName} · Ejercicio ${exIdx + 1}/${session.exercises.length}</p>
      <div class="circuit-progress">
        ${session.exercises.map((e, i) => html`<span key=${e.id} class=${`circuit-dot ${i < exIdx ? 'done' : i === exIdx ? 'current' : ''}`} />`)}
      </div>
      <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${160} />
      <h2>${ex.name}</h2>
      <div class="target-reps-badge">
        <span class="target-reps-num">${ex.targetReps}</span>
        <span class="target-reps-unit">${ex.isTimeBased ? 'segundos' : 'repeticiones'}</span>
      </div>
      <div class="target-chips">
        <span class="chip">${ex.equip === 'mancuernas' ? `Mancuernas ${ex.weight}kg` : ex.equip === 'mochila' ? `Mochila ${ex.weight}kg` : 'Peso corporal'}</span>
        <span class="chip">Tempo ${ex.tempo}</span>
      </div>
      <p class="exercise-cue">${ex.cue}</p>
      <p class="timer-big">${fmtTime(workRemaining)}</p>
      <button class="btn-secondary" onClick=${() => setWorkRemaining(0)}>Ya he terminado</button>
      ${roundIdx === 0 ? html`<p class="level-hint">Nivel actual: ${getExerciseLevel(state, ex.id, ex.level)}/5</p>` : null}
      <p class="auto-note">Al acabar el tiempo pasa sola a descanso.</p>
    </div>
  `;
}

// PANTALLA: HIPOPRESIVOS (bloque final, no calentamiento)
// =====================================================================
function HypopressiveBlock({ onDone, onExit, steps = HYPOPRESSIVE_BLOCK, title = 'Bloque final · Hipopresivos' }) {
  const [idx, setIdx] = useState(0);
  const [running, setRunning] = useState(true);
  const step = steps[idx];
  const startRef = useRef(Date.now());
  const advance = useCallback(() => {
    playIfOn(Sound.playRestEnd);
    if (idx < steps.length - 1) setIdx(i => i + 1);
    else onDone(Math.round((Date.now() - startRef.current) / 1000));
  }, [idx, onDone, steps]);
  const [remaining, setRemaining] = useCountdown(step.duration, advance, running);
  useEffect(() => { setRemaining(step.duration); }, [idx]);
  useEffect(() => { playIfOn(Sound.playHypoStep); VoiceCoach.hypoStep(step.name); }, [idx]);
  const pct = ((step.duration - remaining) / step.duration) * 100;

  return html`
    <div class="screen hypo">
      <div class="session-controls">
        <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el registro de esta vuelta.')) onExit(); }} aria-label="Volver al inicio">←</button>
      </div>
      <p class="eyebrow">${title} · Paso ${idx + 1}/${steps.length}</p>
      <div class="mobility-ring">
        <svg viewBox="0 0 120 120" class="ring-svg">
          <circle cx="60" cy="60" r="54" class="ring-bg" />
          <circle cx="60" cy="60" r="54" class="ring-fg" style=${{ strokeDashoffset: 339.3 - (339.3 * pct) / 100 }} />
        </svg>
        <div class="ring-center"><${ExerciseVisual} exId=${step.id} iconKey=${step.icon} size=${120} /></div>
      </div>
      <h2>${step.name}</h2>
      <p class="cue-text">${step.cue}</p>
      <p class="timer-big">${fmtTime(remaining)}</p>
      <div class="mobility-controls">
        <button class="btn-secondary" onClick=${() => setRunning(r => !r)}>${running ? 'Pausar' : 'Reanudar'}</button>
        <button class="btn-primary" onClick=${advance}>${idx < steps.length - 1 ? 'Saltar paso' : 'Finalizar'}</button>
      </div>
      <div class="mobility-dots">
        ${steps.map((s, i) => html`<span key=${s.id} class=${`mdot ${i === idx ? 'active' : ''} ${i < idx ? 'done' : ''}`} />`)}
      </div>
    </div>
  `;
}
