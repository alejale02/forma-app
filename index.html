<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Forma 55 — Circuito diario</title>
<meta name="theme-color" content="#12141A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forma 55" />
<link id="manifest-link" rel="manifest" href="data:application/manifest+json,">
<link rel="apple-touch-icon" id="apple-touch-icon">
<link rel="icon" id="favicon">
<style>
:root{
  --bg:#12141A; --bg-elev:#1B1E27; --bg-elev2:#242835;
  --accent:#C8FF3D; --accent-dim:#8FBF2B;
  /* Contraste subido para presbicia: --text-dim y --text-faint eran grises
     medios (#AEB4C0 / #868C99) — perfectamente legibles con vista normal,
     pero de las primeras cosas que cuesta leer con vista cansada. Subidos
     a tonos más claros mantiene la jerarquía visual (siguen siendo más
     discretos que --text) sin sacrificar legibilidad real. */
  --text:#FFFFFF; --text-dim:#C7CCD6; --text-faint:#9DA3B0;
  --danger:#FF6B4A; --up:#7DD8FF;
  --radius:20px; --radius-sm:12px;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none; background:none; color:inherit;}
h1,h2{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); padding-top:calc(24px + env(safe-area-inset-top)); animation:fadein .25s ease;}
/* Home a petición explícita: las tarjetas (pasos, fase del mes, vueltas)
   se veían con demasiado margen a los lados en el móvil real — se
   reduce el padding lateral de la pantalla completa de Hoy para que
   aprovechen más ancho, sin tocar el resto de pantallas (settings,
   modales, etc. mantienen su padding de siempre). */
.screen.home{ padding-left:10px; padding-right:10px; }
/* Deja hueco al fondo en las 4 pantallas "hub" para que el tab bar fijo no
   tape el último contenido — se activa con la clase has-tabbar en app-shell
   en vez de tocar cada pantalla individualmente. */
.app-shell.has-tabbar > .screen{padding-bottom:calc(100px + env(safe-area-inset-bottom));}
.tab-bar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; background:var(--bg-elev); border-top:1px solid var(--bg-elev2);}
.tab-bar-inner{display:flex; width:100%; max-width:520px; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); gap:8px;}
.tab-bar-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:11px 2px; border-radius:16px; background:none; color:var(--text-faint); font-size:13px; font-weight:700; transition:background .15s ease, color .15s ease, transform .1s ease;}
.tab-bar-btn .tbi{font-size:28.5px; line-height:1; filter:grayscale(1) opacity(0.75);}
.tab-bar-btn.active{background:var(--accent); color:#0C0D10; transform:translateY(-1px); box-shadow:0 4px 14px rgba(200,255,61,0.28);}
.tab-bar-btn.active .tbi{filter:none;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes breathe{0%,100%{transform:scale(0.72);} 50%{transform:scale(1.18);}}
.breathe-circle{width:130px; height:130px; border-radius:50%; background:var(--accent); opacity:0.16; animation:breathe 8s ease-in-out infinite; margin:18px auto;}
.breathe-label{text-align:center; font-family:var(--font-display); font-size:23px; color:var(--accent); margin-top:-92px; margin-bottom:70px;}
/* El truco de margen negativo de arriba superponía el texto encima del
   círculo cuando eran hermanos directos en el flujo normal. Ahora, en la
   pantalla "bleed" de estiramiento/hipopresivos, el círculo vive en el
   fondo a pantalla completa (.bleed-figure-fallback) y la etiqueta va en
   el bloque de texto de abajo (.bleed-bottom) — ya no son hermanos, así
   que ese margen negativo solo la descolocaría empujándola hacia arriba
   contra el resto del texto. Se resetea aquí, específicamente donde se
   usa así. */
.bleed-bottom .breathe-label{margin-top:0; margin-bottom:4px;}
.circuit-rest-note{color:var(--text-dim); font-size:14px; text-align:center; margin-top:4px;}
.warmup-step-name{font-family:var(--font-display); font-size:21.5px; text-align:center; margin:6px 0 8px;}
.camera-preview-wrap{position:relative; width:100%; aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:#000; margin-top:10px;}
.camera-preview-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
.camera-preview-wrap video.mirrored{transform:scaleX(-1);}
.camera-flash{position:absolute; inset:0; background:#fff; animation:cameraFlash 0.25s ease;}
@keyframes cameraFlash{from{opacity:0.9;} to{opacity:0;}}
.camera-countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:82px; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,0.6); background:rgba(0,0,0,0.15);}
.camera-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.camera-actions .btn-primary{grid-column:1/-1;}


.eyebrow{font-size:13.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px;}

/* ---- HOME ---- */
.home-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
.home-header h1{font-size:34px;}
.icon-btn{background:var(--bg-elev); color:var(--text); width:44px; height:44px; border-radius:12px; font-size:20.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.weight-reminder{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.steps-nudge{cursor:pointer;}
.bar-nudge{cursor:pointer;}
.weight-reminder.bar-nudge{background:linear-gradient(135deg, rgba(180,140,255,0.16), var(--bg-elev)); border-color:rgba(180,140,255,0.4);}
.weight-reminder.posture-nudge{background:linear-gradient(135deg, rgba(255,180,120,0.16), var(--bg-elev)); border-color:rgba(255,180,120,0.4);}
.weight-reminder.photo-reminder{background:linear-gradient(135deg, rgba(125,216,255,0.14), var(--bg-elev)); border-color:rgba(125,216,255,0.35);}
.weight-reminder.backup-reminder{background:linear-gradient(135deg, rgba(255,140,60,0.16), var(--bg-elev)); border-color:rgba(255,140,60,0.4);}
.save-error-banner{background:rgba(255,107,74,0.16); border:1px solid rgba(255,107,74,0.45); border-radius:12px; padding:10px 14px; margin:0 20px 12px; margin-top:calc(10px + env(safe-area-inset-top)); font-size:13.5px; color:var(--text); line-height:1.4;}
.photo-compare{margin-bottom:18px;}
.photo-compare-picker{display:flex; align-items:center; gap:8px; margin:8px 0 12px;}
.photo-compare-picker select{flex:1; min-width:0; background:var(--bg-elev); color:var(--text); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 6px; font-size:15px;}
.photo-compare-picker span{color:var(--text-dim); font-size:13.5px;}
.photo-compare-row{display:flex; gap:10px; margin-top:8px;}
.photo-compare-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
.photo-compare-col img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--bg-elev2);}
.photo-compare-col span{font-size:12.5px; color:var(--text-dim);}
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
.photo-grid-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none;}
.photo-grid-item img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--bg-elev2);}
.photo-grid-item span{font-size:11px; color:var(--text-faint);}
.photo-viewer{position:fixed; inset:0; z-index:50; background:rgba(6,7,10,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;}
.photo-viewer img{max-width:100%; max-height:70vh; border-radius:14px; object-fit:contain;}
.photo-viewer p{color:var(--text-dim); font-size:15px; text-transform:capitalize;}
.weight-reminder-title{font-weight:800; font-size:16.5px; margin-bottom:6px;}
.weight-reminder-text{font-size:15px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}
.weight-reminder-actions{display:flex; gap:8px; flex-wrap:wrap;}
.weight-reminder-actions .btn-primary{flex:1 1 auto; min-width:150px;}
.weight-reminder-actions .btn-secondary{flex:1 1 auto; min-width:130px;}
.alert-chip-row{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:-8px 0 16px;}
.alert-chip-hint{font-size:12.5px; color:var(--text-faint); font-weight:600;}
.alert-chip{background:var(--bg-elev2); color:var(--text-dim); border-radius:20px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap;}
.alert-chip:active{background:var(--bg-elev); color:var(--text);}
.phase-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; margin-bottom:16px; border-left:4px solid var(--phase-color);}
.phase-name{font-family:var(--font-display); font-size:27.5px; color:var(--phase-color); margin-bottom:6px;}
.phase-desc{color:var(--text-dim); font-size:16px; line-height:1.5; margin-bottom:16px;}
.phase-progress{display:flex; gap:5px; margin-bottom:8px;}
.dot{width:100%; height:6px; border-radius:3px; background:var(--bg-elev2);}
.dot.filled{background:var(--phase-color);}
.phase-progress-label{font-size:13.5px; color:var(--text-faint);}

.cycle-track{display:flex; gap:8px; margin-bottom:20px;}
.cycle-step{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--bg-elev); opacity:0.45;}
.cycle-step.active{opacity:1; background:var(--bg-elev2); outline:1.5px solid var(--accent);}
.cycle-step.done{opacity:0.7;}
.cycle-num{display:block; font-family:var(--font-display); font-size:18px;}
.cycle-label{display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.btn-primary{background:var(--accent); color:#0C0D10; font-weight:800; border-radius:var(--radius-sm); padding:16px; font-size:18px;}
.btn-primary:disabled{opacity:0.35;}
.btn-huge{width:100%; padding:20px; font-size:19.5px; border-radius:16px; margin:8px 0;}
.rate-screen{display:flex; flex-direction:column; justify-content:center; min-height:60vh;}
.rate-buttons{display:flex; flex-direction:column; gap:12px;}
.rate-btn{font-weight:700; text-align:left; padding:18px 20px;}
.rate-btn.rate-hard{background:rgba(255,107,74,0.16); color:var(--text); border:1px solid rgba(255,107,74,0.4);}
.rate-btn.rate-ok{background:var(--accent); color:#0C0D10;}
.rate-btn.rate-easy{background:rgba(125,216,255,0.16); color:var(--text); border:1px solid rgba(125,216,255,0.4);}
.btn-secondary{background:var(--bg-elev2); color:var(--text); border-radius:var(--radius-sm); padding:16px; font-size:17px; font-weight:600;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); border-radius:var(--radius-sm); padding:14px 20px; font-weight:700; width:100%;}

.coach-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin:16px 0; border:1px solid rgba(255,255,255,0.06);}
.last-session-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin:16px 0; border:1px solid rgba(125,216,255,0.2);}
.last-session-card-tap{width:100%; text-align:left; display:block;}
.last-session-card-tap:active{background:var(--bg-elev2);}
.last-session-taphint{display:block; font-size:11px; font-weight:600; color:var(--up); margin-top:2px;}
.session-detail-modal{max-width:440px; text-align:left; max-height:80vh; overflow-y:auto;}
.modal-header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px;}
.modal-header h2{font-size:19px; text-transform:capitalize; margin:0;}
.session-detail-row{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left; padding:12px 4px; border-top:1px solid var(--bg-elev2); background:none; color:var(--text);}
.session-detail-row:active{background:var(--bg-elev2);}
.session-detail-name{font-size:13.5px; font-weight:600; color:var(--text);}
.session-detail-level{font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;}
.session-back-btn{display:block; background:none; color:var(--up); font-weight:700; font-size:13.5px; padding:0 0 14px; text-align:left;}
.last-session-date{font-family:var(--font-display); font-weight:800; font-size:18px; text-transform:capitalize; margin:2px 0 8px;}
.last-session-stats{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:var(--text-dim); font-weight:600;}
.coach-card-title{font-family:var(--font-display); font-weight:800; font-size:15px; margin-bottom:12px;}
.coach-insight{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--bg-elev2);}
.coach-insight:first-of-type{border-top:none; padding-top:0;}
.coach-insight-icon{font-size:18px; line-height:1.3; flex-shrink:0;}
.coach-insight-text{font-size:15px; line-height:1.42; color:var(--text-dim);}
.coach-insight.coach-warn .coach-insight-text{color:var(--text);}
.coach-insight.coach-good .coach-insight-text{color:var(--accent);}
.stat-row{display:flex; gap:10px; margin:16px 0;}
.stat-box{flex:1; background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; text-align:center;}
.stat-num{font-family:var(--font-display); font-size:29.5px; color:var(--accent);}
.stat-label{font-size:13.5px; color:var(--text-dim); margin-top:2px;}

.link-btn{background:none; color:var(--text-dim); text-align:center; padding:10px; font-size:16px; text-decoration:underline; text-underline-offset:3px;}
.quick-links-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0 8px;}
.quick-link-tile{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--bg-elev); border-radius:14px; padding:12px 4px; color:var(--text-dim); font-size:12px; font-weight:700; text-align:center;}
.qlt-icon{font-size:23px;}

/* ---- ROUND SELECTOR ---- */
.rounds-block{background:var(--bg-elev); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
.rounds-label{font-size:15px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
.rounds-picker{display:flex; gap:6px;}
.posture-symptom-row{margin-bottom:20px;}
.posture-scale{display:flex; gap:8px; margin-top:8px;}
.posture-scale-btn{flex:1; padding:12px 0; border-radius:12px; background:var(--bg-elev2); color:var(--text-dim); font-weight:800; font-size:16px;}
.posture-scale-btn.active{background:var(--accent); color:#0C0D10;}
.strength-family-select{width:100%; padding:10px 12px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-size:15px; font-weight:700; border:1px solid var(--border, #2A2C31); margin-bottom:10px;}
.pain-active-note{font-size:13.5px; color:var(--text-dim); margin:10px 0; padding:8px 12px; background:var(--bg-elev2); border-radius:10px;}
.pain-clear-btn{color:var(--accent); font-weight:700; text-decoration:underline;}
.pain-check{margin:10px 0; font-size:14px; color:var(--text-faint);}
.pain-check summary{cursor:pointer; padding:4px 0;}
.pain-check-options{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.pain-check-btn{padding:8px 14px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-size:13.5px; font-weight:700;}
.voice-rate-picker{display:flex; gap:8px; margin-top:8px;}
.round-btn{flex:1; padding:10px 4px; border-radius:12px; background:var(--bg-elev2); color:var(--text); font-weight:800; text-align:center;}
.round-btn .rn{display:block; font-family:var(--font-display); font-size:21px;}
.round-btn .rl{display:block; font-size:9.5px; color:var(--text-dim); text-transform:uppercase; margin-top:2px;}
.round-btn.active{background:var(--accent); }
.round-btn.active .rn,.round-btn.active .rl{color:#0C0D10;}
.round-btn.recommended:not(.active){box-shadow:inset 0 0 0 2px var(--accent);}
.rounds-recommendation{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35); border-radius:12px; padding:10px 14px; margin-bottom:10px;}
.rounds-rec-badge{font-weight:800; color:var(--accent); font-size:15px;}
.rounds-rec-why{font-size:14px; color:var(--text-dim); line-height:1.4;}
.rounds-rec-matched{margin-bottom:10px; color:var(--text-dim); font-size:12.5px;}
.rounds-hint{font-size:15px; color:var(--text-faint); margin-top:10px; line-height:1.4;}
.time-estimate{font-size:15px; color:var(--text); background:var(--bg-elev2); border-radius:10px; padding:10px 12px; margin-top:10px;}
.time-estimate strong{color:var(--accent);}

/* ---- TODAY PREVIEW / REST DAY ---- */
.today-preview{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:6px;}
.today-title{font-weight:800; font-size:17px; margin-bottom:12px;}
.today-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.today-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--bg-elev2); gap:10px;}
.today-row:last-child{border-bottom:none;}
.today-ex-name{font-size:16px; flex:1;}
.today-ex-detail{font-size:14px; color:var(--accent); font-weight:700; white-space:nowrap;}
.rest-day-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; text-align:center;}
.morning-hypo-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
.morning-hypo-title{font-weight:800; font-size:17px; margin-bottom:6px;}
.morning-hypo-card .btn-secondary{margin-top:10px; width:100%;}
.rest-day-title{font-family:var(--font-display); font-size:23px; margin-bottom:10px; color:var(--up);}

/* ---- WEEKLY PLAN ---- */
.weekplan-intro{text-align:left; max-width:none; margin-bottom:18px;}
.weekplan-day{background:var(--bg-elev); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}

/* ---- NUTRICIÓN ---- */
.nutrition-intro{text-align:left; max-width:none; margin-bottom:18px;}
.nutrition-targets-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.today-progress-card{background:linear-gradient(135deg, rgba(200,255,61,0.10), var(--bg-elev)); border:1px solid rgba(200,255,61,0.25); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.today-progress-row{display:flex; flex-direction:column; gap:12px; margin-top:4px;}
.today-progress-item{display:flex; flex-direction:column; gap:6px;}
.today-progress-bar-track{height:10px; background:var(--bg-elev2); border-radius:6px; overflow:hidden;}
.today-progress-bar-fill{height:100%; background:var(--accent); border-radius:6px; transition:width .3s ease;}
.today-progress-bar-fill.protein{background:#7DD8FF;}
.today-progress-bar-fill.carb{background:#FFD166;}
.today-progress-bar-fill.fat{background:#FF8FA3;}
.today-progress-bar-fill.fiber{background:#B8F2A0;}
.today-progress-bar-fill.water{background:#5EC8F2;}
.water-quick-add{display:flex; gap:8px; margin-top:12px;}
.water-quick-add button{flex:1;}
.today-progress-num{font-family:var(--font-display); font-size:19.5px; font-weight:800; color:var(--text);}
.today-progress-of{font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--text-dim);}
.today-progress-empty{display:block; width:100%; text-align:left; background:var(--bg-elev2); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; color:var(--text-dim); font-size:15.5px; font-weight:600;}
.nutrition-targets-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.nt-box{background:var(--bg-elev2); border-radius:10px; padding:10px 4px; text-align:center;}
.today-real-macros{margin-top:14px; padding-top:14px; border-top:1px solid var(--bg-elev2);}
.micro-reference-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.micro-reference-card summary{cursor:pointer; font-size:17px; font-weight:800;}

.nutrition-item-kcal{color:var(--text-faint); font-size:13px; white-space:nowrap;}

.weekplan-day.is-today{outline:1.5px solid var(--accent);}
.weekplan-day-header{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.weekplan-day-name{font-family:var(--font-display); font-size:17px;}
.weekplan-day-focus{font-size:13.5px; color:var(--text-dim);}
.weekplan-today-badge{margin-left:auto; background:var(--accent); color:#0C0D10; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.weekplan-ex-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--bg-elev2); font-size:15px;}
.weekplan-ex-row:first-of-type{border-top:none;}
.weekplan-ex-name{flex:1;}
.weekplan-ex-detail{color:var(--text-dim); white-space:nowrap; font-weight:600;}
.rest-summary{opacity:0.6;}

/* ---- WORK / REST / LOGGING / HYPO shared ---- */
.hypo,.work,.rest,.logging,.roundrest{align-items:center; text-align:center; justify-content:center;}

h2{font-size:26px; margin:8px 0;}
.cue-text{color:var(--text-dim); font-size:17px; line-height:1.5; max-width:340px; margin:0 auto 12px;}
.timer-big{font-family:var(--font-display); font-size:59.5px; margin:12px 0; letter-spacing:-0.02em;}
.prep-count{font-family:var(--font-display); font-size:100.5px; color:var(--accent); margin:10px 0; line-height:1;}
.target-reps-badge{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg-elev2); border:2px solid var(--accent); border-radius:14px; padding:6px 18px; margin:4px 0 10px;}
.target-reps-num{font-family:var(--font-display); font-size:38px; color:var(--accent); line-height:1;}
.target-reps-unit{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px;}
/* Foto real durante la ejecución (pantalla 'work'): antes 160px, casi el
   mismo espacio visual que el contador de repeticiones — el usuario pidió
   explícitamente ver mejor el gesto del ejercicio en marcha. Se agranda a
   costa de encoger el contador de arriba (64px→38px, que sigue siendo
   perfectamente legible) en vez de simplemente crecer y desplazar el resto
   de la pantalla. `!important` necesario porque ExerciseVisual fija
   width/height por inline style (prop `size`) — mismo patrón ya usado en
   la media query de apaisado (línea ~111) para el motivo contrario. */
.rest-next-reps{color:var(--accent); font-weight:700;}
.rest-timer{color:var(--up);}
.rest-next{color:var(--text); font-size:17px; font-weight:700; margin-bottom:2px;}
.rest-next-detail{color:var(--accent); font-size:15px; font-weight:700; margin-bottom:24px;}
.roundrest .timer-big{color:var(--danger);}
.roundrest-badge{background:rgba(255,107,74,0.15); color:var(--danger); font-size:13.5px; font-weight:800; padding:6px 14px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em;}
.extend-prompt h2{margin:10px 0 12px;}
.link-prompt{justify-content:center; text-align:center;}
.link-prompt-title{font-size:25px; margin-bottom:12px;}
.link-prompt .btn-huge, .link-prompt .btn-secondary{width:100%; margin-bottom:10px;}
.extend-prompt .btn-huge{margin-bottom:10px;}

.mobility-controls{display:flex; gap:10px; width:100%; margin-top:16px;}
.mobility-controls .btn-secondary,.mobility-controls .btn-primary{flex:1; margin:0;}
.mobility-dots{display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
.mdot{width:8px; height:8px; border-radius:50%; background:var(--bg-elev2);}
.mdot.active{background:var(--accent); width:22px; border-radius:4px;}
.mdot.done{background:var(--accent-dim);}

.figure-wrap{position:relative; width:180px; height:210px; margin:8px 0; display:flex; align-items:center; justify-content:center;}
.figure-wrap svg{width:100%; height:100%;}
.photo-wrap{position:relative; margin:8px auto; border-radius:16px; overflow:hidden; background:#000;}

/* ---- PANTALLA "BLEED": foto real a pantalla completa de fondo, con todo
   lo demás sobreimpreso en degradados arriba/abajo — mismo patrón que
   apps de entreno de referencia. Se usa en circuito, cuenta atrás,
   calentamiento e hipopresivos/rutina matutina. Al ser position:absolute
   dentro de .bleed-screen (relative), funciona igual en vertical y en
   horizontal sin necesitar trucos de reordenar con flexbox por
   orientación — la foto siempre ocupa el 100% del contenedor. */
.bleed-screen{position:relative; padding:0 !important; overflow:hidden; background:#000;}
.photo-wrap-bleed{position:absolute; inset:0; z-index:0;}
.photo-wrap-bleed img{width:100%; height:100%; object-fit:cover; display:block;}
.bleed-figure-fallback{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, var(--bg-elev2), var(--bg));}
.bleed-scrim-top{position:absolute; top:0; left:0; right:0; height:38%; z-index:1; pointer-events:none; background:linear-gradient(to bottom, rgba(8,9,11,0.92), rgba(8,9,11,0.5) 60%, transparent);}
.bleed-scrim-bottom{position:absolute; bottom:0; left:0; right:0; height:64%; z-index:1; pointer-events:none; background:linear-gradient(to top, rgba(8,9,11,0.96) 35%, rgba(8,9,11,0.75) 65%, transparent);}
/* BUG REAL encontrado y corregido: bleed-top (flujo normal, arriba) y
   bleed-bottom (position:absolute; bottom:0) no tenían ninguna relación
   entre sí — si sus contenidos combinados eran más altos que la pantalla
   (típico en horizontal, poco alto disponible), bleed-bottom subía y se
   solapaba literalmente encima de bleed-top en vez de quedar debajo,
   como se vio en captura real (nombre del ejercicio pisando "vuelta X de
   Y" y el aviso de pasos). Fix: un único contenedor flex en columna con
   space-between envuelve a los dos — así arriba y abajo nunca pueden
   invadirse el uno al otro; si el contenido no cabe entero, es el
   contenedor el que hace scroll interno, nunca un solapado invisible. */
.bleed-overlay{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:space-between; overflow-y:auto;}
.bleed-top{flex-shrink:0; padding:calc(16px + env(safe-area-inset-top)) 20px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;}
.bleed-bottom{flex-shrink:0; padding:8px 20px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; text-align:center;}
.bleed-info-tap{background:none; padding:2px 8px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.bleed-info-tap h2{margin:0;}
.bleed-btn-row{display:flex; gap:10px; width:100%; margin-top:6px;}
.bleed-btn-row button{flex:1;}
.bleed-progress-bar{width:100%; max-width:340px; height:5px; border-radius:3px; background:rgba(255,255,255,0.18); overflow:hidden; margin-top:4px;}
.bleed-progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width 1s linear;}
.photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-credit{position:absolute; bottom:2px; right:6px; font-size:9px; color:rgba(255,255,255,0.55); background:rgba(0,0,0,0.4); padding:1px 5px; border-radius:6px;}

/* ---- STORYBOARD "Ejercicios de hoy" ---- */
.today-cards-title{font-weight:800; font-size:17px; margin:22px 0 12px;}
.today-card{background:var(--bg-elev); border-radius:var(--radius); padding:14px; margin-bottom:14px; display:flex; gap:12px;}
.today-card-num{font-family:var(--font-display); font-size:25px; color:var(--accent); width:26px; flex-shrink:0;}
.today-card-body{flex:1; min-width:0;}
.today-card-name{font-weight:800; font-size:17px; margin-bottom:4px;}
.today-card-meta{font-size:14px; color:var(--accent); font-weight:700; margin-bottom:2px;}
.today-card-group{font-size:14px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;}
.today-card-frames{display:flex; align-items:center; gap:2px;}
.today-card-tap{display:block; width:100%; background:none; padding:0; text-align:left;}
.today-card-taphint{display:block; text-align:center; font-size:12.5px; color:var(--accent); font-weight:700; margin-top:6px;}
.today-frame{flex:1; min-width:0; background:radial-gradient(circle at 50% 38%, var(--bg-elev2) 0%, var(--bg) 100%); border-radius:12px; padding:6px 2px 8px; text-align:center;}
.today-frame .figure-wrap{width:100% !important; height:104px !important; margin:0 auto;}
.today-frame-cap{font-size:11.5px; color:var(--text-dim); margin-top:2px; line-height:1.25; font-weight:600;}
.today-frame-arrow{color:var(--text-faint); font-size:17px; flex-shrink:0; width:12px;}
.today-card-body .photo-wrap{width:100% !important; height:160px !important; margin:2px 0 0;}

/* ---- AUTO-CONFIRM de repeticiones (sin toques obligatorios) ---- */
.confirm-ring{position:relative; width:76px; height:76px; margin:6px auto 18px;}
.confirm-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.confirm-ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:6;}
.confirm-ring-fg{fill:none; stroke:var(--up); stroke-width:6; stroke-linecap:round; stroke-dasharray:219.9; transition:stroke-dashoffset 1s linear;}
.confirm-ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:25px; color:var(--up);}
.confirm-reps-row{display:flex; align-items:center; gap:18px; margin:10px 0 6px;}
.confirm-adj-btn{width:56px; height:56px; border-radius:50%; background:var(--bg-elev2); color:var(--text); font-size:29.5px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.confirm-reps-num{font-family:var(--font-display); font-size:64px; color:var(--accent); min-width:90px; text-align:center;}
.confirm-hint{font-size:15px; color:var(--text-faint); margin-bottom:8px;}
.auto-note{font-size:15px; color:var(--text-faint); margin-top:14px;}
.session-controls{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:5; display:flex; justify-content:space-between;}
.pause-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text-dim); font-size:17px; display:flex; align-items:center; justify-content:center;}
.pause-btn.active{background:var(--accent); color:#0C0D10;}
.end-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--danger); font-size:17px; display:flex; align-items:center; justify-content:center;}

/* ---- Selector de ritmo (Settings) ---- */
.pace-picker{display:flex; gap:8px; flex-wrap:wrap;}
.pace-picker .pace-btn{flex:1 1 auto; min-width:56px;}
.pace-btn{flex:1; padding:12px 6px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700; font-size:15px; text-align:center;}
.pace-btn.active{background:var(--accent); color:#0C0D10;}
.sync-share-row{display:flex; gap:8px; margin:10px 0;}
.sync-share-row .btn-primary,.sync-share-row .btn-secondary{flex:1; padding:12px; font-size:15px;}
.sync-qr-wrap{text-align:center; background:var(--bg-elev2); border-radius:12px; padding:14px; margin-bottom:10px;}
.sync-qr-img{width:180px; height:180px; border-radius:8px; background:#fff; padding:8px; margin-bottom:8px;}
.sync-code-row{display:flex; align-items:center; gap:8px; background:var(--bg-elev2); border-radius:10px; padding:10px 12px;}
.sync-code{flex:1; font-family:var(--font-mono, monospace); font-size:13.5px; color:var(--accent); word-break:break-all;}
.sync-copy-btn{flex-shrink:0; padding:8px 12px; font-size:14px;}
.sync-link-row{display:flex; gap:8px; margin-top:6px;}
.sync-code-input{flex:1; background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:15px;}
.sync-msg{font-size:14px; margin-top:8px;}
.sync-ok{color:var(--up);}
.sync-err{color:var(--danger);}
.circuit-progress{display:flex; gap:6px; margin:2px 0 4px; justify-content:center;}
.circuit-dot{width:26px; height:5px; border-radius:3px; background:var(--bg-elev2);}
.circuit-dot.done{background:var(--accent);}
.circuit-dot.current{background:var(--up);}
.round-badge{display:inline-block; background:var(--bg-elev2); color:var(--text-dim); font-size:12.5px; font-weight:800; padding:5px 12px; border-radius:20px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.03em;}
.target-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0 8px;}
.chip{background:var(--bg-elev); padding:8px 14px; border-radius:20px; font-size:15px; font-weight:600; color:var(--text-dim);}
.chip-emphasis{background:var(--accent); color:#0C0D10; font-weight:800;}
.exercise-cue{color:var(--text-dim); font-size:16.5px; line-height:1.5; max-width:320px; margin:4px auto 8px; background:var(--bg-elev); padding:12px 14px; border-radius:var(--radius-sm);}
.level-hint{color:var(--text-faint); font-size:15px; margin-top:12px;}

.reps-input{width:140px; font-family:var(--font-display); font-size:54.5px; text-align:center; background:var(--bg-elev); color:var(--accent); border:2px solid var(--bg-elev2); border-radius:var(--radius-sm); padding:12px; margin:12px 0 4px;}
.reps-input:focus{outline:none; border-color:var(--accent);}
.target-hint{color:var(--text-faint); font-size:16px; margin-bottom:20px;}
.rpe-label{font-size:15px; color:var(--text-dim); margin-bottom:10px; font-weight:600;}
.rpe-scale{display:flex; gap:6px; margin-bottom:6px;}
.rpe-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text); font-weight:700; font-size:16px;}
.rpe-btn.active{background:var(--accent); color:#0C0D10;}
.rpe-legend{display:flex; justify-content:space-between; width:100%; max-width:290px; font-size:13px; color:var(--text-faint); margin-bottom:20px; text-transform:uppercase; letter-spacing:0.05em;}

/* ---- SUMMARY ---- */
/* ---- MODAL: extensión hipopresiva opcional ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(8,9,12,0.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; animation:fadein .2s ease;}
.modal-card{background:var(--bg-elev); border-radius:var(--radius); padding:26px 22px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative;}
.exercise-detail-card{max-height:88vh; overflow-y:auto; padding-top:44px;}
.modal-close{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-size:17px;}
.exercise-detail-title{font-weight:800; font-size:16px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; text-align:left; margin:16px 0 10px;}
.exercise-detail-steps{list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:12px; text-align:left;}
.exercise-detail-steps li{display:flex; gap:12px; align-items:flex-start;}
.exercise-detail-stepnum{flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#0C0D10; font-family:var(--font-display); font-size:15px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.exercise-detail-steptext{font-size:18px; line-height:1.5; color:var(--text); padding-top:2px;}
.modal-card h2{font-size:25px; margin:6px 0 12px;}
.modal-actions{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.modal-actions .btn-huge{margin:0;}

.summary h1{font-size:32px; margin-bottom:20px;}
.summary-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; text-align:left;}
.session-rate-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin:16px 0; text-align:left;}
.session-rate-row{display:flex; gap:8px;}
.session-rate-btn{flex:1; padding:14px 6px; border-radius:12px; background:var(--bg-elev2); color:var(--text-dim); font-weight:700; font-size:13px; border:2px solid transparent;}
.session-rate-btn.active{background:rgba(200,255,61,0.15); border-color:var(--accent); color:var(--text);}
.summary-title{font-weight:700; font-size:16px; margin-bottom:10px; color:var(--text-dim);}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--bg-elev2);}
.summary-row:first-of-type{border-top:none;}
.badge{font-size:13.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge-up{background:rgba(200,255,61,0.15); color:var(--accent);}
.badge-down{background:rgba(255,107,74,0.15); color:var(--danger);}

/* ---- PROGRESS ---- */
.sub-header{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.sub-header h1{font-size:25px;}
/* ---- CALENDARIO DE PROGRESO ---- */
.icon-btn.small{width:34px; height:34px; font-size:18px; border-radius:9px;}
.icon-btn:disabled{opacity:0.3;}
.calendar-card{background:var(--bg-elev); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.calendar-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calendar-month{font-weight:800; font-size:17px; text-transform:capitalize;}
.calendar-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; font-size:12.5px; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px;}
.calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:9px; background:transparent; color:var(--text-dim); font-size:13.5px;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.has-session{background:var(--bg-elev2); color:var(--text); font-weight:700; cursor:pointer;}
.cal-cell.is-today{outline:1.5px solid var(--accent);}
.cal-cell.is-selected{background:var(--accent); color:#0C0D10;}
.cal-cell.is-selected .cal-dot{background:#0C0D10;}
.cal-dot{width:5px; height:5px; border-radius:50%; background:var(--dot-color, var(--accent)); margin-top:2px;}
.calendar-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid var(--bg-elev2);}
.legend-item{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-dim);}
.legend-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

.day-detail-card{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:14px;}
.day-habit-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--bg-elev2);}
.day-habit-chip{background:var(--bg-elev2); color:var(--text-dim); font-size:13.5px; font-weight:600; padding:6px 11px; border-radius:20px;}
.day-habit-chip.is-good{background:rgba(200,255,61,0.12); color:var(--accent);}
.day-habit-chip.is-over{background:rgba(255,140,60,0.12); color:#FFB37A;}
.measurements-card{border:1px solid rgba(200,255,61,0.25);}
.measure-input-row{display:flex; gap:10px; margin:12px 0;}
.measure-input-group{flex:1; display:flex; flex-direction:column; gap:4px;}
.measure-input-group label{font-size:14px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}
.measure-input-group input{background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:17px; width:100%;}

/* Este bloque va deliberadamente AL FINAL de la hoja de estilos, justo
   antes del cierre — no es cosmético. Sus reglas comparten especificidad con las
   reglas base de estas mismas clases (.timer-big, .target-reps-badge,
   .cue-text, .btn-secondary...) definidas más arriba en este archivo; en
   CSS, con especificidad empatada, gana la que aparece MÁS TARDE en el
   documento, sin importar si está dentro de un @media o no. Estando este
   bloque casi al principio del archivo (como estaba antes), las reglas
   base de más abajo lo pisaban silenciosamente en horizontal real — bug
   confirmado con capturas reales (timer y botones sin comprimir pese a
   existir la regla). Cualquier override de horizontal nuevo debe añadirse
   AQUÍ, al final, para heredar esta garantía. */
/* ---- MÓVIL EN HORIZONTAL — pantallas de sesión activa (poco alto, ancho de sobra) ---- */
/* BUG REAL encontrado y corregido: la condición `max-height:560px` no
   coincidía con la altura real en horizontal del móvil del usuario (se
   vio en capturas reales — timer gigante, botones en columna en vez de
   fila, nada de esto se aplicaba). Esa condición era fràgil porque
   depende de density pixel ratio / modelo exacto de móvil, algo que no
   se puede fijar a ciegas. Se quita la condición de alto: estas reglas
   ahora se aplican en CUALQUIER horizontal, no solo por debajo de un
   umbral de píxeles que no se cumplía en la práctica. */
@media (orientation: landscape) {
  /* La lógica de layout de abajo (flex-row + wrap) ya estaba bien pensada,
     pero el contenedor padre .app-shell seguía limitado a 520px de ancho
     máximo — en un móvil apaisado real (800-950px de ancho) eso dejaba
     huecos enormes a los lados sin usar, exactamente lo que se reportó.
     Ampliar el ancho aquí (solo en horizontal, la vista vertical no se
     toca) es lo que faltaba para que el resto de reglas de abajo puedan
     aprovechar el espacio real. */
  .app-shell{max-width:min(94vw, 960px);}
  .tab-bar-inner{max-width:min(94vw, 960px);}
  /* work/prep/warmup-screen/hypo ya NO necesitan flex-row+reorder: ahora
     son pantallas "bleed" (foto de fondo a pantalla completa, todo lo
     demás sobreimpreso en position:absolute) — ese layout ya funciona
     igual en vertical y horizontal sin necesitar hacks de orientación.
     Este bloque se queda solo para las pantallas que NO se rediseñaron
     (rest, roundrest): esas siguen con el layout normal en flujo, que sí
     necesita reordenarse en horizontal por falta de alto. circuit-rest
     pasó a bleed-screen también (agosto 2026, segunda ronda — la primera
     migración se quedó a medio camino: se cambió el HTML pero no se
     limpiaron estas reglas viejas con `order` fijo pensadas para la
     estructura anterior, y el timer/estiramientos quedaban mal
     colocados en horizontal real — bug confirmado y corregido). */
  .screen.rest, .screen.roundrest {
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center;
    align-content: center; gap: 2px 22px; padding: 10px 26px; overflow-y: auto;
  }
  .screen.circuit-rest .breathe-circle{ width: 90px !important; height: 90px !important; }
  .screen.rest .rest-next, .screen.roundrest .roundrest-badge, .screen.rest .eyebrow {
    width: 100%; text-align: center; margin: 1px 0;
  }
  /* Las pantallas "bleed" recortan un poco el alto máximo del bloque
     inferior en horizontal (menos alto disponible que en vertical) para
     no forzar scroll salvo que el ejercicio tenga cue muy larga. */
  .bleed-overlay{ gap:2px; }
  .bleed-bottom{ padding-top:4px; gap:2px; }
  .bleed-top{ padding-top:calc(8px + env(safe-area-inset-top)); gap:2px; }
  .timer-big{ font-size:34px; margin: 2px 0; }
  .prep-count{ font-size:46px; margin: 2px 0; }
  .target-reps-badge{ padding: 4px 14px; margin: 2px 0; }
  .target-reps-num{ font-size:24px; }
  .exercise-cue, .cue-text{ font-size:13.5px; }
  .warmup-step-name{ font-size:16px; margin:2px 0; }
  .auto-note, .level-hint{ display: none; }
  .btn-secondary{ padding: 10px 16px; font-size:15px; }
  /* Pantalla de valoración (rate-screen): no es una pantalla "bleed", se
     quedó sin tratamiento de horizontal al quitar .screen.work de la
     regla de reordenado antigua (esta pantalla comparte esa clase pero
     nunca se rediseñó a foto de fondo). Sin esto los 3 botones + título +
     texto no cabían en el poco alto disponible y el tercer botón quedaba
     cortado fuera de pantalla, como se vio en captura real. Los 3 botones
     pasan a fila (en vez de columna) para ganar alto; el resto se
     compacta.
  */
  .rate-screen{ min-height:0; padding:10px 24px; justify-content:center; gap:4px; }
  .rate-screen h2{ font-size:18px; margin:2px 0; }
  .rate-screen .cue-text{ font-size:12.5px; margin:0 0 6px; }
  .rate-buttons{ flex-direction:row; gap:8px; width:100%; }
  .rate-btn{ flex:1; padding:10px 8px; font-size:12.5px; text-align:center; }
  .session-controls{ position: fixed; }
}

<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>

<script type="module">
import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
const h = React.createElement;
const html = htm.bind(h);

// P2.10 / P2.11 — fotos reales + ritmo musical ligado al pace + voz más natural.
// =====================================================================
// =====================================================================
// SOUND — Web Audio API, síntesis pura (offline, sin ficheros)
// Nota iOS: si el interruptor físico de silencio está activado, Safari
// silencia el audio de las páginas web (incluida esta instalada como app).
// Es una restricción del sistema operativo, no de la aplicación.
// =====================================================================
// AudioContext único compartido entre pitidos (Sound) y música ambiental
// (Music), para poder bajar el volumen de la música cuando suena un aviso.
let sharedAudioCtx = null;
function getSharedAudioCtx() {
  if (!sharedAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; sharedAudioCtx = new AC(); }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

const Sound = (() => {
  function getCtx() { return getSharedAudioCtx(); }
  function tone(freq, duration, opts = {}) {
    const { type = 'sine', gain = 0.18, delay = 0 } = opts;
    const c = getCtx();
    Music.duckBriefly((delay + duration) * 1000 + 300);
    LocalMusicPlayer.duckBriefly((delay + duration) * 1000 + 300);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + duration);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + duration + 0.02);
  }
  return {
    unlock() { try { getCtx(); } catch (e) {} },
    playSetStart() { tone(520, 0.09, { type: 'triangle', gain: 0.2 }); tone(780, 0.11, { type: 'triangle', gain: 0.16, delay: 0.09 }); },
    playSetEnd() { tone(660, 0.12, { gain: 0.18 }); tone(440, 0.16, { gain: 0.15, delay: 0.1 }); },
    playCountdownBeep(isLast) { tone(isLast ? 880 : 600, isLast ? 0.24 : 0.11, { type: 'sine', gain: isLast ? 0.2 : 0.12 }); },
    playRestEnd() { tone(700, 0.09, { type: 'triangle', gain: 0.2 }); tone(1000, 0.14, { type: 'triangle', gain: 0.18, delay: 0.1 }); },
    playRoundEnd() { tone(392, 0.16, { type: 'triangle', gain: 0.14 }); tone(523, 0.18, { type: 'triangle', gain: 0.16, delay: 0.13 }); },
    playExerciseComplete() { tone(523, 0.1, { gain: 0.16 }); tone(659, 0.1, { gain: 0.16, delay: 0.1 }); tone(784, 0.18, { gain: 0.18, delay: 0.2 }); },
    playSessionComplete() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, { type: 'triangle', gain: 0.2, delay: i * 0.13 })); },
    playWorkStart() { tone(330, 0.09, { type: 'triangle', gain: 0.17 }); tone(494, 0.13, { type: 'triangle', gain: 0.15, delay: 0.09 }); },
    playConfirmOpen() { tone(880, 0.07, { type: 'sine', gain: 0.13 }); tone(1174, 0.1, { type: 'sine', gain: 0.11, delay: 0.07 }); },
    playAdjustTick() { tone(1046, 0.05, { type: 'triangle', gain: 0.08 }); },
    playAutoLogged() { tone(587, 0.08, { type: 'triangle', gain: 0.15 }); tone(880, 0.12, { type: 'triangle', gain: 0.16, delay: 0.07 }); },
    playHypoStep() { tone(349, 0.17, { type: 'sine', gain: 0.13 }); tone(523, 0.19, { type: 'sine', gain: 0.12, delay: 0.11 }); },
    // Aviso de cambio de lado a mitad de tiempo en ejercicios unilaterales
    // de la rutina matutina — un solo tono corto y distinto (no la pareja
    // de tonos de playHypoStep, para no confundirlo con "siguiente
    // ejercicio") que se combina con la voz diciendo "cambio de lado".
    playSideSwitch() { tone(660, 0.1, { type: 'sine', gain: 0.14 }); },
  };
})();
let soundsOn = true;
function playIfOn(fn) { if (soundsOn) fn(); }

// =====================================================================
// MÚSICA RÍTMICA — generada en el propio navegador con Web Audio (no es
// un archivo de terceros: cero problemas de derechos de autor, funciona
// offline). Patrón de batería four-on-the-floor a 124 BPM (bombo en cada
// negra, hi-hat en corcheas, palmada en el "2" y el "4", línea de bajo
// simple) — el mismo tipo de pulso que marca el ritmo en clases de
// gimnasio, para que sea más fácil acompasar las repeticiones. Se atenúa
// sola (duck) cada vez que suena un pitido o la voz, igual que antes.
// =====================================================================
const Music = (() => {
  let masterGain = null;
  let running = false;
  let schedulerTimer = null;
  let nextNoteTime = 0;
  let currentStep = 0;
  let baseVol = 0.14;

  // BPM ahora depende de la fase de entreno del mes (Volumen/Fuerza/
  // Intensidad/Descarga) — antes era fijo siempre a 124, sonaba igual el
  // día de descarga que el día de intensidad máxima. Ahora el pulso
  // acompaña el tipo de sesión: más lento y pesado en Fuerza, más rápido
  // y percusivo en Intensidad, más calmado en Descarga.
  const PHASE_BPM = { 1: 124, 2: 117, 3: 132, 4: 106 };
  // El ritmo musical acompaña también el ritmo elegido para el circuito.
  // Así 'lento/normal/rápido' no solo cambia la duración automática de las
  // series: el pulso de fondo se adapta de verdad al ritmo de ejecución.
  const PACE_BPM_MULT = { lento: 0.90, normal: 1.00, rapido: 1.08 };
  let BPM = 124;
  let STEP_DUR = 60 / BPM / 4; // dieciseisavos (16 pasos por compás de 4/4)
  const STEPS_PER_BAR = 16;

  // ---- Secciones con distinta instrumentación (mismo groove base, pero
  // variando qué suena en cada compás) para que el ritmo evolucione en vez
  // de repetirse igual todo el entreno. A = patrón base. B = variación con
  // rim shot y bajo distinto. C = "respiro" solo con hats+shaker, sin
  // bombo/palmada, para contraste. FILL = relleno de tambores cada 8
  // compases que anuncia el regreso al patrón base. ----
  const SECTIONS = {
    A: { kick: [0, 4, 8, 12], clap: [4, 12], hatAccent: [0, 4, 8, 12], bass: [[0, 55.0], [6, 55.0], [8, 61.74], [10, 55.0], [14, 49.0]], rim: [], shaker: false, toms: [], bell: [] },
    B: { kick: [0, 4, 7, 8, 12], clap: [4, 12], hatAccent: [0, 4, 8, 12, 14], bass: [[0, 49.0], [6, 49.0], [8, 55.0], [12, 58.27]], rim: [2, 10], shaker: false, toms: [], bell: [] },
    C: { kick: [0, 8], clap: [], hatAccent: [0, 8], bass: [[0, 55.0], [8, 49.0]], rim: [], shaker: true, toms: [], bell: [] },
    // D: variación con campana marcando el contratiempo — mismo groove de
    // base que A pero con un color tímbrico distinto, para que se note un
    // compás claramente diferente sin romper el pulso general.
    D: { kick: [0, 4, 8, 12], clap: [4, 12], hatAccent: [2, 6, 10, 14], bass: [[0, 58.27], [6, 58.27], [8, 65.41], [10, 58.27], [14, 51.91]], rim: [], shaker: false, toms: [], bell: [0, 8] },
    // E: "respiro" con campana suelta y sin caja/palmada — contraste total
    // antes de un FILL, como una bajada de intensidad musical deliberada.
    E: { kick: [0, 6, 10], clap: [], hatAccent: [], bass: [[0, 49.0], [10, 43.65]], rim: [4], shaker: true, toms: [], bell: [8, 12] },
    FILL: { kick: [0, 4, 8, 10, 12, 14], clap: [4, 8, 12], hatAccent: [0, 2, 4, 6, 8, 10, 12, 14], bass: [[0, 55.0], [4, 58.27], [8, 61.74], [12, 65.41]], rim: [], shaker: false, toms: [2, 6, 10, 14], bell: [] },
  };
  // Secuencia ampliada de 8 a 16 compases (~32s en vez de ~16s antes de
  // repetirse) — con las dos secciones nuevas (D, E) intercaladas, el
  // bucle completo tarda mucho más en volver a sonar exactamente igual,
  // que era la causa real de la sensación de monotonía en sesiones largas.
  const SEQUENCE = ['A', 'A', 'B', 'A', 'D', 'B', 'C', 'D', 'A', 'B', 'E', 'D', 'B', 'A', 'C', 'FILL'];
  let barIdx = 0;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!masterGain) {
      masterGain = c.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(c.destination);
    }
    return c;
  }

  function kick(t, downbeat) {
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sine';
    // Acento en el "1" de cada compás (downbeat): un pelín más fuerte y
    // algo más grave que el resto de bombos — ayuda a sentir dónde
    // empieza cada compás sin mirar la pantalla, útil para acompasar
    // repeticiones a ciegas durante el circuito.
    osc.frequency.setValueAtTime(downbeat ? 138 : 150, t);
    osc.frequency.exponentialRampToValueAtTime(downbeat ? 38 : 42, t + 0.11);
    g.gain.setValueAtTime(downbeat ? 1.05 : 0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (downbeat ? 0.26 : 0.22));
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.3);
  }
  // Humanización: micro-variación aleatoria de tiempo (±6ms) SOLO en los
  // elementos ornamentales (hat/rim/shaker) — nunca en bombo/palmada/bajo,
  // que son los que marcan el pulso real y deben quedarse perfectamente
  // cuantizados para que sirvan de referencia de ritmo. Un metrónomo
  // perfecto en TODO suena a máquina; variar solo el "polvo" de encima
  // (como hace un batería real) da sensación orgánica sin desdibujar el
  // pulso que se usa para contar repeticiones.
  const HUMANIZE_SEC = 0.006;
  function humanize(t) { return t + (Math.random() * 2 - 1) * HUMANIZE_SEC; }
  function hat(t, accent) {
    const c = getSharedAudioCtx();
    const dur = accent ? 0.06 : 0.035;
    const size = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = c.createGain();
    g.gain.setValueAtTime(accent ? 0.2 : 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(hp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + dur + 0.01);
  }
  function clap(t) {
    const c = getSharedAudioCtx();
    const size = Math.floor(c.sampleRate * 0.16);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    noise.connect(bp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + 0.18);
  }
  function bass(t, freq) {
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + STEP_DUR * 1.7);
    osc.connect(lp).connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + STEP_DUR * 2);
  }
  // ---- Instrumentos nuevos para dar variedad tímbrica ----
  function rim(t) {
    // "rim shot": clic corto y agudo, muy distinto al hi-hat/palmada
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(1400, t); osc.frequency.exponentialRampToValueAtTime(900, t + 0.03);
    g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.05);
  }
  function tom(t, freq) {
    // golpe de tambor grave melódico, para los rellenos (fills)
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.16);
    g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.22);
  }
  // Instrumento nuevo: campana/pluck agudo con onda triangular — timbre
  // claramente distinto a kick/hat/clap/bajo, usado solo en las secciones
  // D y E para dar color tímbrico extra sin sobrecargar la mezcla.
  function bell(t) {
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(1046.5, t); // Do6
    g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.36);
  }
  function shaker(t) {
    // textura suave y continua (corchea), solo en la sección de "respiro"
    const c = getSharedAudioCtx();
    const dur = 0.045;
    const size = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size) * 0.6;
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.7;
    const g = c.createGain();
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(bp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + dur + 0.01);
  }

  function scheduleStep(step, t) {
    const sec = SECTIONS[SEQUENCE[barIdx % SEQUENCE.length]];
    if (sec.kick.includes(step)) kick(t, step === 0);
    if (sec.clap.includes(step)) clap(t);
    if (sec.rim.includes(step)) rim(humanize(t));
    if (sec.toms.includes(step)) tom(t, [220, 180, 150, 130][sec.toms.indexOf(step) % 4]);
    if (sec.bell && sec.bell.includes(step)) bell(t);
    if (sec.shaker && step % 2 === 0) shaker(humanize(t));
    if (!sec.shaker) hat(humanize(t), sec.hatAccent.includes(step));
    const bassHit = sec.bass.find(([s]) => s === step);
    if (bassHit) bass(t, bassHit[1]);
  }

  function schedulerLoop() {
    const c = ensureGraph();
    const lookahead = 0.15;
    while (nextNoteTime < c.currentTime + lookahead) {
      const step = currentStep % STEPS_PER_BAR;
      scheduleStep(step, nextNoteTime);
      if (step === STEPS_PER_BAR - 1) barIdx++;
      nextNoteTime += STEP_DUR;
      currentStep++;
    }
    schedulerTimer = setTimeout(schedulerLoop, 30);
  }

  let duckTimer = null;
  return {
    start(phaseKey, paceKey = 'normal') {
      if (running) return;
      running = true;
      BPM = Math.round((PHASE_BPM[phaseKey] || 124) * (PACE_BPM_MULT[paceKey] || 1));
      STEP_DUR = 60 / BPM / 4;
      const c = ensureGraph();
      currentStep = 0;
      barIdx = 0;
      nextNoteTime = c.currentTime + 0.08;
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol, c.currentTime + 1.0);
      schedulerLoop();
    },
    stop() {
      if (!running) return;
      running = false;
      clearTimeout(schedulerTimer);
      if (masterGain) {
        const c = getSharedAudioCtx();
        masterGain.gain.cancelScheduledValues(c.currentTime);
        masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
        masterGain.gain.linearRampToValueAtTime(0, c.currentTime + 0.6);
      }
    },
    // Baja el volumen brevemente (p.ej. mientras suena un pitido) y lo
    // devuelve solo al nivel normal pasado ms milisegundos.
    duckBriefly(ms) {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      clearTimeout(duckTimer);
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol * 0.2, c.currentTime + 0.1);
      duckTimer = setTimeout(() => {
        if (!running || !masterGain) return;
        const c2 = getSharedAudioCtx();
        masterGain.gain.cancelScheduledValues(c2.currentTime);
        masterGain.gain.setValueAtTime(masterGain.gain.value, c2.currentTime);
        masterGain.gain.linearRampToValueAtTime(baseVol, c2.currentTime + 0.4);
      }, Math.max(250, ms));
    },
    // Para hablar (voz): baja mientras dura la frase, indefinido hasta unduck().
    duck() {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol * 0.16, c.currentTime + 0.12);
    },
    unduck() {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol, c.currentTime + 0.5);
    },
    isRunning() { return running; },
  };
})();

let localMusicOn = false;

// =====================================================================
// TU MÚSICA — reproduce archivos de audio que el propio usuario elige
// desde su dispositivo (Files app / carpeta de descargas en iPhone, o el
// selector de archivos equivalente en Android). Son sus propios ficheros
// locales, así que no hay ningún problema de derechos de autor ni de red:
// todo ocurre en el propio navegador, sin subir nada a ningún servidor.
// Se enruta a través de Web Audio (igual que el ritmo generado) para
// poder atenuarse automáticamente cuando habla la voz o suena un aviso.
// Limitación real del navegador (no de la app): Safari no permite recordar
// el acceso a archivos entre sesiones, así que hay que volver a elegirlos
// cada vez que se abre la app — se avisa de esto en la propia pantalla.
// =====================================================================
const LocalMusicPlayer = (() => {
  let audioEl = null, sourceNode = null, gainNode = null;
  let running = false;
  let baseVol = 0.7;
  let tracks = []; // [{ name, url }]
  let currentIdx = 0;
  let shuffled = [];
  let onTrackChange = null;
  let duckTimer = null;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!audioEl) {
      audioEl = new Audio();
      audioEl.crossOrigin = 'anonymous';
      audioEl.addEventListener('ended', () => playNext());
      sourceNode = c.createMediaElementSource(audioEl);
      gainNode = c.createGain();
      gainNode.gain.value = baseVol;
      sourceNode.connect(gainNode).connect(c.destination);
    }
    return c;
  }

  function shuffleOrder() {
    shuffled = tracks.map((_, i) => i);
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
  }

  function playIndex(pos) {
    ensureGraph();
    currentIdx = pos;
    const track = tracks[shuffled[pos]];
    if (!track) return;
    audioEl.src = track.url;
    audioEl.play().catch(() => {});
    running = true;
    if (onTrackChange) onTrackChange(track.name, pos, tracks.length);
  }

  function playNext() {
    if (!tracks.length) return;
    const next = (currentIdx + 1) % tracks.length;
    if (next === 0) shuffleOrder(); // vuelve a barajar al completar la vuelta
    playIndex(next);
  }

  return {
    setTracks(fileList) {
      // Libera las URL temporales anteriores antes de crear las nuevas
      tracks.forEach(t => URL.revokeObjectURL(t.url));
      tracks = Array.from(fileList).map(f => ({ name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) }));
      shuffleOrder();
      currentIdx = -1;
    },
    hasTracks() { return tracks.length > 0; },
    trackCount() { return tracks.length; },
    onChange(fn) { onTrackChange = fn; },
    start() {
      if (!tracks.length) return;
      Music.stop(); // no mezclar con el ritmo generado
      playIndex(0);
    },
    stop() {
      running = false;
      if (audioEl) audioEl.pause();
    },
    isRunning() { return running; },
    duckBriefly(ms) {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      clearTimeout(duckTimer);
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.2, c.currentTime + 0.1);
      duckTimer = setTimeout(() => {
        if (!running || !gainNode) return;
        const c2 = getSharedAudioCtx();
        gainNode.gain.cancelScheduledValues(c2.currentTime);
        gainNode.gain.setValueAtTime(gainNode.gain.value, c2.currentTime);
        gainNode.gain.linearRampToValueAtTime(baseVol, c2.currentTime + 0.4);
      }, Math.max(250, ms));
    },
    duck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.16, c.currentTime + 0.12);
    },
    unduck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol, c.currentTime + 0.5);
    },
  };
})();

// =====================================================================
// VOZ — Web Speech API nativa del navegador (sin claves, sin dependencias
// externas). Anuncia ejercicios, cuenta atrás y frases motivacionales.
// Se degrada sola y en silencio si el navegador no soporta síntesis de voz.
// =====================================================================
const VoiceCoach = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let esVoice = null;
  if (supported) {
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      // Preferencia estricta por castellano de España; dentro de ese grupo,
      // prioriza voces "de red"/mejoradas (Google, Microsoft Online) sobre
      // las locales del sistema, que suelen sonar más robóticas.
      //
      // Aviso honesto (confirmado con desarrolladores independientes, no
      // solo suposición): en iOS, Safari NO expone a las apps web las
      // voces "Mejoradas/Premium" que puedas tener descargadas en Ajustes
      // → Accesibilidad → Contenido hablado — solo un grupo limitado de
      // voces "compactas", y esto ha empeorado en iOS 17/18. Es una
      // limitación de la propia plataforma (misma categoría que el Wake
      // Lock), no algo que este código pueda evitar. Esta búsqueda se deja
      // por si algún día Apple lo cambia o en otros navegadores/SO sí
      // aplica — el ritmo de voz en Ajustes es la palanca real que sí
      // tenemos bajo control para sonar más natural dentro de ese límite.
      const esES = voices.filter(v => v.lang === 'es-ES');
      const esAny = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      const pool = esES.length ? esES : esAny;
      esVoice = pool.find(v => /google|online|natural|wavenet|mejorada|enhanced|premium/i.test(v.name)) || pool[0] || null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, { rate = 0.97, pitch = 1.0, priority = false } = {}) {
    if (!supported || !voiceOn) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; if (esVoice) u.voice = esVoice;
      // Humanización P2.10: la variación grande de tono/velocidad sonaba
      // menos humana en voces compactas de iOS. Ahora la entrega es más
      // estable, con microvariaciones muy pequeñas que evitan el efecto de
      // frase idéntica sin producir cambios artificiales de timbre.
      const microRate = (Math.random() * 0.06 - 0.03);
      const microPitch = (Math.random() * 0.04 - 0.02);
      u.rate = Math.max(0.72, Math.min(1.25, (rate * voiceRateMult) + microRate));
      u.pitch = Math.max(0.88, Math.min(1.12, pitch + microPitch));
      u.volume = 1.0;
      u.onstart = () => { Music.duck(); LocalMusicPlayer.duck(); };
      u.onend = () => { Music.unduck(); LocalMusicPlayer.unduck(); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  // pickNoRepeat: igual que pick() pero recuerda la última frase elegida
  // por categoría (lastPickByCategory) y evita repetirla dos veces
  // seguidas — es lo que más rompe la sensación de "grabación en bucle"
  // cuando llevas 20 minutos oyendo las mismas 3 frases una y otra vez.
  // Con solo 2-3 frases por categoría no ayudaba mucho; con 10-12 (ver
  // pools ampliados abajo) sí se nota la diferencia real.
  const lastPickByCategory = {};
  function pickNoRepeat(category, arr) {
    if (arr.length <= 1) return arr[0];
    let choice;
    do { choice = arr[Math.floor(Math.random() * arr.length)]; }
    while (choice === lastPickByCategory[category] && arr.length > 1);
    lastPickByCategory[category] = choice;
    return choice;
  }
  const ENCOURAGEMENTS = [
    'Buen ritmo, sigue así.', 'Aguanta, ya casi lo tienes.', 'Vamos, mantén la forma.',
    'Fuerza, tú puedes con esto.', 'No aflojes ahora.', 'Respira... y sigue empujando.',
    'Perfecto, controla el movimiento.', 'Un poco más, no te rindas.',
    'Eso es, así, sigue.', 'Vale, ya lo tienes, aguanta.', 'Buen trabajo, no pares.',
    'Venga, un esfuerzo más.', 'Ahí, ahí, mantén la técnica.', 'Sigue empujando, casi está.',
    'Vale, vas bien... no sueltes.', 'Eso es, con calma, sigue.', 'Aguanta ahí, ya falta poco.',
  ];
  const SESSION_OPENERS = [
    'Empezamos, vamos a por este circuito.', 'Arranca el entreno de hoy, a por ello.',
    'Circuito listo, concéntrate y vamos.', 'Vale, toca entrenar, vamos allá.',
    'Empieza el circuito de hoy, dale caña.', 'Vamos con el entreno de hoy.',
    'Bien, empezamos... a por todas.', 'Circuito preparado, vamos a darlo todo.',
  ];
  const ROUND_PHRASES = n => [
    `Vuelta ${n} completada, buen trabajo.`, `Fin de la vuelta ${n}, sigue así.`,
    `Vuelta ${n} hecha, aguanta el ritmo.`, `Eso es, vuelta ${n} terminada.`,
    `Vuelta ${n} lista, vamos con la siguiente.`, `Bien, vuelta ${n} en el bolsillo.`,
  ];
  const CIRCUIT_DONE = [
    'Circuito terminado, gran trabajo hoy.', 'Ya está, entreno completado, enhorabuena.',
    'Circuito completo, muy buen trabajo hoy.', 'Eso es todo por hoy, buen entreno.',
    'Circuito hecho, has cumplido, enhorabuena.', 'Y ya está... entreno de hoy completado.',
  ];
  const REST_PHRASES = [
    'Descansa.', 'Recupera un momento.', 'Descanso, respira.', 'Vale, un momento de descanso.',
    'Respira hondo, un momento.', 'Toca descansar.', 'Recupera el aliento.', 'Un respiro, tú sigues.',
  ];
  const GO_PHRASES = ['Vamos', 'Adelante', 'Ahora', 'Empieza'];
  const EXERCISE_CONNECTORS = ['', 'Toca ', 'Ahora, ', 'Vamos con ', 'Siguiente: '];
  return {
    supported,
    sessionStart() { say(pickNoRepeat('opener', SESSION_OPENERS), { rate: 0.98, priority: true }); },
    announceExercise(name, isTimeBased) {
      // Pequeña variedad también aquí: no siempre "Nombre." a secas, a
      // veces un conector natural delante — de nuevo rompe la repetición,
      // que en este caso suena muchas veces por sesión (una por ejercicio).
      const connector = pickNoRepeat('connector', EXERCISE_CONNECTORS);
      const lowerName = connector ? name.charAt(0).toLowerCase() + name.slice(1) : name;
      say(isTimeBased ? `${connector}${lowerName}, mantén la posición.` : `${connector}${lowerName}.`, { priority: true });
    },
    countdownGo() {
      // Modo de energía: en vez de siempre el mismo rate/pitch base con
      // ruido encima, se sortea entre 3 "personalidades" de entrega —
      // esto es lo que de verdad rompe la sensación de "la misma persona
      // diciendo la misma frase con el mismo ánimo cada vez", más que
      // ampliar el ruido aleatorio por sí solo.
      const mode = pickNoRepeat('go-mode', [
        { rate: 1.08, pitch: 1.08 },  // enérgico
        { rate: 0.98, pitch: 1.0 },   // neutro
        { rate: 1.03, pitch: 0.96 },  // grave y firme
      ]);
      say(pickNoRepeat('go', GO_PHRASES), { ...mode, priority: true });
    },
    encourage() {
      const mode = pickNoRepeat('encourage-mode', [
        { rate: 1.05 },  // más rápido, urgente
        { rate: 0.95 },  // más pausado, tranquilizador
        { rate: 1.0 },   // neutro
      ]);
      say(pickNoRepeat('encourage', ENCOURAGEMENTS), mode);
    },
    rest() {
      const mode = pickNoRepeat('rest-mode', [
        { rate: 0.88, pitch: 0.93 },  // muy calmado
        { rate: 0.95, pitch: 0.98 },  // neutro
        { rate: 0.92, pitch: 1.0 },   // ligeramente más ligero
      ]);
      say(pickNoRepeat('restphrase', REST_PHRASES), { ...mode, priority: true });
    },
    roundDone(n) { say(pickNoRepeat('round', ROUND_PHRASES(n)), { priority: true }); },
    circuitDone() { say(pickNoRepeat('done', CIRCUIT_DONE), { priority: true }); },
    beforeHypo() { say('Antes de los hipopresivos, un par de minutos para bajar pulsaciones. Respira despacio.', { rate: 0.9, pitch: 0.97, priority: true }); },
    warmupStart() { say('Antes de empezar, un calentamiento rápido.', { priority: true }); },
    warmupStep(name) { say(`${name}.`, { priority: true }); },
    hypoStep(name) { say(`${name}.`, { rate: 0.9, priority: true }); },
    // Aviso de cambio de lado a mitad de tiempo — variedad con
    // pickNoRepeat como el resto de la voz, para que no suene siempre
    // exactamente igual en ejercicios consecutivos que lo usan.
    sideSwitch() { say(pickNoRepeat('sideswitch', ['Cambia de lado.', 'Ahora el otro lado.', 'Cambio de lado.']), { rate: 0.92, priority: true }); },
    phaseChanged(name) { say(`Nueva fase del plan, ${name}.`, { priority: true }); },
  };
})();

// Preferencia de ritmo de voz — la única palanca de "sonido más natural"
// que sí controlamos del todo (la calidad del motor de voz en sí la fija
// iOS, ver comentario en VoiceCoach). Persistida junto al resto de ajustes
// de sonido en localStorage, no en el estado del progreso.
let voiceRateMult = 1;
try { const savedRate = localStorage.getItem('forma55_voice_rate'); if (savedRate) voiceRateMult = parseFloat(savedRate) || 1; } catch (e) {}
function setVoiceRateMult(v) { voiceRateMult = v; try { localStorage.setItem('forma55_voice_rate', String(v)); } catch (e) {} }

// =====================================================================
// DATA — hombre 55 años, 165cm, ~70kg, nivel AVANZADO.
// Peso corporal + mancuernas 2kg. Ciclo de 4 semanas SIN fase de
// adaptación (ya entrena a diario): arranca directo en Volumen.
// =====================================================================
const BIOTYPE = { ageYears: 55, heightCm: 165, weightKg: 70, sex: 'male' };

// ---- Estimación de calorías (fórmula MET estándar: kcal/min = MET·3.5·kg/200) ----
// MET del circuito por fase: la densidad de trabajo (descanso corto = más
// intensidad media) sube el MET en Intensidad y lo baja en Descarga. Valores
// tomados del Compendium of Physical Activities para "resistance/circuit
// training" de esfuerzo moderado-vigoroso, ajustados por fase.
const MET_CIRCUIT_BY_PHASE = { 1: 6.5, 2: 6.0, 3: 7.5, 4: 5.0 };
const MET_HYPO = 2.8; // trabajo respiratorio/vacío abdominal, esfuerzo bajo
function estimateCalories(circuitSec, hypoSec, phaseKey) {
  const metCircuit = MET_CIRCUIT_BY_PHASE[phaseKey] || 6.5;
  const kcalCircuit = metCircuit * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, circuitSec) / 60);
  const kcalHypo = MET_HYPO * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, hypoSec) / 60);
  return Math.round(kcalCircuit + kcalHypo);
}
