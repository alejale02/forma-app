// =====================================================================
// PANTALLA: PROGRESO
// =====================================================================
function fmtDuration(totalSec) {
  const m = Math.floor(totalSec / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60); const rem = m % 60;
  return rem ? `${h}h ${rem}min` : `${h}h`;
}
function dateKey(iso) { return iso.slice(0, 10); }

function Progress({ state, onBack }) {
  const groups = [...new Set(EXERCISES.map(e => e.group))];
  const groupLabels = { inferior: 'Tren inferior', superior_empuje: 'Empuje (pecho/hombro/tríceps)', superior_traccion: 'Tracción (espalda)', core: 'Core', cardio: 'Cardio / metabólico' };
  const log = state.sessionLog || [];

  // Agrupa el log por día (por si algún día se hace más de un circuito) para
  // que el calendario y el detalle muestren el total real de ese día, no
  // entradas sueltas.
  const byDay = {};
  log.forEach(s => {
    const key = dateKey(s.date);
    if (!byDay[key]) byDay[key] = { date: key, sessions: 0, rounds: 0, circuitSec: 0, hypoSec: 0, calories: 0, phases: [] };
    const d = byDay[key];
    d.sessions += 1;
    d.rounds += s.rounds || 0;
    d.circuitSec += s.circuitDurationSec || 0;
    d.hypoSec += s.hypoDurationSec || 0;
    d.calories += s.calories || 0;
    d.phases.push(s.phase);
  });

  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth()); // 0-indexed
  const todayKey = dateKey(today.toISOString());
  const [selectedKey, setSelectedKey] = useState(byDay[todayKey] ? todayKey : null);

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7; // lunes=0
  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = firstOfMonth.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const monthKeys = Object.keys(byDay).filter(k => {
    const dt = new Date(k);
    return dt.getFullYear() === viewYear && dt.getMonth() === viewMonth;
  });
  const monthTotals = monthKeys.reduce((acc, k) => {
    const d = byDay[k];
    acc.days += 1; acc.rounds += d.rounds; acc.sec += d.circuitSec + d.hypoSec; acc.kcal += d.calories;
    return acc;
  }, { days: 0, rounds: 0, sec: 0, kcal: 0 });

  function changeMonth(delta) {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; }
    setViewMonth(m); setViewYear(y); setSelectedKey(null);
  }

  const selected = selectedKey ? byDay[selectedKey] : null;
  const dominantPhase = selected ? selected.phases[selected.phases.length - 1] : null;

  return html`
    <div class="screen progress">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Tu progreso</h1></header>

      <div class="stat-row">
        <div class="stat-box"><p class="stat-num">${state.totalSessionsDone}</p><p class="stat-label">Circuitos totales</p></div>
        <div class="stat-box"><p class="stat-num">${Object.keys(byDay).length}</p><p class="stat-label">Días entrenados</p></div>
        <div class="stat-box"><p class="stat-num">${Object.values(state.exerciseLevels).filter(v => v.level >= 4).length}</p><p class="stat-label">Ejerc. nivel avanzado+</p></div>
      </div>

      <div class="calendar-card">
        <div class="calendar-nav">
          <button class="icon-btn small" onClick=${() => changeMonth(-1)}>‹</button>
          <p class="calendar-month">${monthLabel}</p>
          <button class="icon-btn small" onClick=${() => changeMonth(1)}>›</button>
        </div>
        <div class="calendar-weekdays">
          ${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(w => html`<span key=${w}>${w}</span>`)}
        </div>
        <div class="calendar-grid">
          ${cells.map((d, i) => {
            if (d === null) return html`<span key=${`b${i}`} class="cal-cell empty" />`;
            const key = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayData = byDay[key];
            const isToday = key === todayKey;
            const isSelected = key === selectedKey;
            const phaseColor = dayData ? PHASES[dayData.phases[dayData.phases.length - 1]].color : null;
            return html`
              <button key=${key} class=${`cal-cell ${dayData ? 'has-session' : ''} ${isToday ? 'is-today' : ''} ${isSelected ? 'is-selected' : ''}`}
                style=${dayData ? { '--dot-color': phaseColor } : {}}
                onClick=${() => dayData && setSelectedKey(isSelected ? null : key)}>
                <span class="cal-daynum">${d}</span>
                ${dayData ? html`<span class="cal-dot" />` : null}
              </button>
            `;
          })}
        </div>
        <div class="calendar-legend">
          ${[1, 2, 3, 4].map(k => html`<span key=${k} class="legend-item"><span class="legend-dot" style=${{ background: PHASES[k].color }} />${PHASES[k].name}</span>`)}
        </div>
      </div>

      ${selected ? html`
        <div class="day-detail-card">
          <p class="day-detail-title">${new Date(selectedKey).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
          <div class="day-detail-stats">
            <div class="day-stat"><span class="day-stat-num">${selected.rounds}</span><span class="day-stat-label">${selected.rounds === 1 ? 'vuelta' : 'vueltas'}${selected.sessions > 1 ? ` (${selected.sessions} circuitos)` : ''}</span></div>
            <div class="day-stat"><span class="day-stat-num">${fmtDuration(selected.circuitSec + selected.hypoSec)}</span><span class="day-stat-label">tiempo total</span></div>
            <div class="day-stat"><span class="day-stat-num">${selected.calories}</span><span class="day-stat-label">kcal estimadas</span></div>
          </div>
          <div class="day-detail-breakdown">
            <span>Circuito: ${fmtDuration(selected.circuitSec)}</span>
            <span>Hipopresivos: ${fmtDuration(selected.hypoSec)}</span>
            <span>Fase: ${PHASES[dominantPhase].name}</span>
          </div>
        </div>
      ` : null}

      <div class="month-summary">
        <p class="group-title">Resumen de ${monthLabel}</p>
        <div class="month-summary-row">
          <span>${monthTotals.days} días entrenados</span>
          <span>${monthTotals.rounds} vueltas en total</span>
        </div>
        <div class="month-summary-row">
          <span>${fmtDuration(monthTotals.sec)} de trabajo</span>
          <span>${monthTotals.kcal} kcal estimadas</span>
        </div>
      </div>
      <p class="calorie-disclaimer">Calorías estimadas por fórmula MET estándar para tu perfil (hombre, 55 años, 165cm, ${BIOTYPE.weightKg}kg) — orientativas, no una medición real de gasto energético.</p>

      ${groups.map(g => {
        const familyPrefixes = [...new Set(EXERCISES.filter(e => e.group === g).map(e => e.id.split('_')[0]))];
        return html`
          <div key=${g} class="progress-group">
            <p class="group-title">${groupLabels[g]}</p>
            ${familyPrefixes.map(prefix => {
              const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix).sort((a, b) => a.level - b.level);
              let level = getFamilyLevel(state, prefix);
              const current = family.find(e => e.level === level) || family[0];
              return html`
                <div key=${prefix} class="level-track-row">
                  <span class="level-track-name">${current.name}</span>
                  <div class="level-track">${[1, 2, 3, 4, 5].map(l => html`<span key=${l} class=${`level-pip ${l <= level ? 'filled' : ''}`} />`)}</div>
                </div>
              `;
            })}
          </div>
        `;
      })}
    </div>
  `;
}

// =====================================================================
// PANTALLA: CONFIGURACIÓN
// =====================================================================
// Pantalla de bienvenida en instalaciones nuevas: antes de generar un
// código propio (y por tanto progreso vacío), da la opción de traer el
// progreso ya acumulado en otro dispositivo. Así nunca se "empieza de
// cero" por error solo por abrir la app en un móvil distinto.
function LinkOrNewPrompt({ onLink, onFresh }) {
  const [showInput, setShowInput] = useState(false);
  const [code, setCode] = useState('');
  const [status, setStatus] = useState(null); // null | 'loading' | 'error'

  function handleSubmit() {
    if (!code.trim()) return;
    setStatus('loading');
    onLink(code).catch(() => setStatus('error'));
  }

  return html`
    <div class="screen link-prompt">
      <h1 class="link-prompt-title">¿Ya usas esta app en otro dispositivo?</h1>
      <p class="cue-text">Si ya tienes progreso guardado (niveles, historial, semana del ciclo), tráelo aquí con tu código en vez de empezar de cero.</p>
      ${!showInput ? html`
        <button class="btn-primary btn-huge" onClick=${() => setShowInput(true)}>Sí, tengo un código</button>
        <button class="btn-secondary" onClick=${onFresh}>No, es la primera vez</button>
      ` : html`
        <div class="sync-link-row">
          <input class="sync-code-input" placeholder="Pega tu código aquí" value=${code} onChange=${e => setCode(e.target.value)} autoFocus />
          <button class="btn-secondary" onClick=${handleSubmit} disabled=${status === 'loading'}>${status === 'loading' ? '...' : 'Vincular'}</button>
        </div>
        ${status === 'error' ? html`<p class="sync-msg sync-err">Código no encontrado o sin conexión. Revisa que esté bien copiado, o vuelve atrás y empieza de cero.</p>` : null}
        <button class="btn-secondary" style=${{ marginTop: '14px' }} onClick=${() => setShowInput(false)}>Volver</button>
      `}
    </div>
  `;
}

function SyncBlock({ state, forceRender }) {
  const [code, setCode] = useState('');
  const [status, setStatus] = useState(null); // null | 'loading' | 'ok' | 'error'
  const [copied, setCopied] = useState(false);

  useEffect(() => { if (!state.syncCode) syncCreate(state).then(() => forceRender(x => x + 1)); }, []);

  async function handleLink() {
    if (!code.trim()) return;
    setStatus('loading');
    try {
      syncing = true;
      await syncPull(code);
      syncing = false;
      setStatus('ok');
      setTimeout(() => window.location.reload(), 900);
    } catch (e) {
      syncing = false;
      setStatus('error');
    }
  }

  function handleCopy() {
    if (!state.syncCode) return;
    navigator.clipboard?.writeText(state.syncCode).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">Sincronizar entre dispositivos</p>
      <p class="settings-hint">Tu código en este dispositivo (guarda y actualiza tu progreso automáticamente):</p>
      <div class="sync-code-row">
        <span class="sync-code">${state.syncCode || 'generando…'}</span>
        <button class="btn-secondary sync-copy-btn" onClick=${handleCopy} disabled=${!state.syncCode}>${copied ? '✓ Copiado' : 'Copiar'}</button>
      </div>
      <p class="settings-hint" style=${{ marginTop: '14px' }}>¿Ya tienes progreso en otro dispositivo? Introduce aquí ese código para traerlo a este:</p>
      <div class="sync-link-row">
        <input class="sync-code-input" placeholder="Pega el código aquí" value=${code} onChange=${e => setCode(e.target.value)} />
        <button class="btn-secondary" onClick=${handleLink} disabled=${status === 'loading'}>${status === 'loading' ? '...' : 'Vincular'}</button>
      </div>
      ${status === 'ok' ? html`<p class="sync-msg sync-ok">Progreso vinculado. Recargando…</p>` : null}
      ${status === 'error' ? html`<p class="sync-msg sync-err">Código no encontrado o sin conexión. Revisa que esté bien copiado.</p>` : null}
    </div>
  `;
}

function Settings({ state, onBack, onReset, soundsEnabled, onToggleSounds, voiceEnabled, onToggleVoice }) {
  const [, forceRender] = useState(0);
  const advice = computeWeightAdvice(state);
  return html`
    <div class="screen settings">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Configuración</h1></header>

      ${(advice.dumbbell.length || advice.backpack.length) ? html`
        <div class="settings-block advice-block">

          ${advice.backpack.length ? html`<p class="advice-line">Llevas varias sesiones dominando <strong>${advice.backpack.join(', ')}</strong> con el peso actual de mochila — puedes añadir un poco más de carga (ver más abajo).</p>` : null}
        </div>
      ` : null}

      <div class="settings-block">
        <div class="settings-toggle-row">
          <p class="settings-label">Sonidos (series y descansos)</p>

        </div>
        <p class="settings-hint">Beep de inicio/fin de serie y cuenta atrás en los últimos 3 segundos del descanso. En iPhone, si el interruptor físico de silencio está activado, iOS silencia el sonido de cualquier web o app instalada — es una restricción del sistema, no de esta app.</p>
      </div>

      <div class="settings-block">
        <div class="settings-toggle-row">
          <p class="settings-label">Voz del entrenador</p>

        </div>
        <p class="settings-hint">Anuncia el nombre de cada ejercicio, cuenta atrás, ánimo a mitad de serie y avisos de descanso/vuelta. Usa la voz nativa del navegador (sin conexión ni permisos extra); si el dispositivo no tiene voz en español instalada, se queda en silencio sin dar error.</p>

          ${[1, 2, 3, 4].map(w => html`<button key=${w} class=${`week-btn ${state.cycleWeek === w ? 'active' : ''}`} onClick=${() => { state.cycleWeek = w; saveState(state); forceRender(x => x + 1); }}>${w}</button>`)}
        </div>
        <p class="settings-hint">Fuerza manualmente la fase de periodización si lo necesitas.</p>
      </div>

      <div class="settings-block">
        <p class="settings-label">Ritmo del circuito</p>
        <div class="pace-picker">
          ${[['lento', 'Lento'], ['normal', 'Normal'], ['rapido', 'Rápido']].map(([key, label]) => html`
            <button key=${key} class=${`pace-btn ${(state.pace || 'normal') === key ? 'active' : ''}`} onClick=${() => { state.pace = key; saveState(state); forceRender(x => x + 1); }}>${label}</button>
          `)}
        </div>
        <p class="settings-hint">Ajusta cuánto dura automáticamente cada serie de trabajo antes de pasar a descanso. No afecta a los ejercicios isométricos (plancha, silla), que respetan siempre su tiempo objetivo real.</p>
      </div>

      <div class="settings-block">

          ${[2, 3, 4, 5, 6, 8].map(w => html`
            <button key=${w} class=${`pace-btn ${(state.dumbbellWeight || 2) === w ? 'active' : ''}`} onClick=${() => { state.dumbbellWeight = w; saveState(state); forceRender(x => x + 1); }}>${w}kg</button>
          `)}

        <p class="settings-label">Acerca de</p>

          Bloque hipopresivo al final de cada sesión (no al principio) para faja abdominal y reducción de cintura.
          El circuito avanza solo: 3 segundos de cuenta atrás antes de cada ejercicio, luego se cronometra según tus reps objetivo y el tempo, y al acabar pasa sola a descanso — sin pedir que confirmes nada a mano. El esfuerzo (RPE) se estima automáticamente según la fase del mes. Puedes pausar o volver al inicio en cualquier momento con los botones superiores.
        </p>
      </div>
    </div>
  `;
}

// =====================================================================
// APP ROOT
// =====================================================================
function App() {
  const [state, setState] = useState(() => loadState());
  const [needsLinkPrompt, setNeedsLinkPrompt] = useState(() => { try { return !localStorage.getItem(STORAGE_KEY); } catch (e) { return false; } });
  const [screen, setScreen] = useState('home'); // home | weekplan | session | hypo | summary | progress | settings
  const [activeSession, setActiveSession] = useState(null);
  const [activeRounds, setActiveRounds] = useState(2);
  const [lastResults, setLastResults] = useState([]);
  const [, forceRender] = useState(0);
  const todaySession = useMemo(() => generateSession(state), [state.cycleWeek, state.totalSessionsDone]);

  // Solo se crea un código de sincronización nuevo en cuanto el aviso de
  // "primera vez / vincular dispositivo" queda resuelto — así un móvil
  // nuevo nunca empieza a acumular progreso propio antes de dar al usuario
  // la opción de traer el que ya tenía en otro dispositivo.
  useEffect(() => { if (!needsLinkPrompt && !state.syncCode) syncCreate(state).then(() => forceRender(x => x + 1)); }, [needsLinkPrompt]);

  function handleStart() {
    Sound.unlock();
    if (VoiceCoach.supported) { try { window.speechSynthesis.resume(); } catch (e) {} }
    VoiceCoach.sessionStart();
    setActiveSession(generateSession(state));
    setActiveRounds(state.roundsPerDay || 2);
    setScreen('session');
  }
  function handleSetRounds(n) { state.roundsPerDay = n; saveState(state); forceRender(x => x + 1); }
  function handleReviewWeightsNow() { state.weightReviewDue = false; state.lastWeightReviewDate = new Date().toISOString().slice(0, 10); state.weightReviewSnoozeUntil = null; saveState(state); forceRender(x => x + 1); setScreen('settings'); }
  function handleSnoozeWeights() { const d = new Date(); d.setDate(d.getDate() + 3); state.weightReviewSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  const hypoSecondsRef = useRef(0);
  function handleCircuitFinish(results) { setLastResults(results); hypoSecondsRef.current = 0; setScreen('hypo'); }
  function handleHypoDone(hypoSec) { hypoSecondsRef.current = hypoSec || 0; setState({ ...state }); setScreen('hypo-extend-prompt'); }
  function handleExtendYes() { setScreen('hypo-extend'); }
  function handleExtendNo() { finalizeSessionStats(state, hypoSecondsRef.current); setState({ ...state }); setScreen('summary'); }
  function handleExtendDone(extraSec) { finalizeSessionStats(state, hypoSecondsRef.current + (extraSec || 0)); setState({ ...state }); setScreen('summary'); }
  function handleReset() {
    if (!confirm('Esto borrará todo tu progreso. ¿Continuar?')) return;
    localStorage.removeItem(STORAGE_KEY);
    setState(loadState());
    setScreen('home');
  }
  function handleToggleSounds() { soundsOn = !soundsOn; forceRender(x => x + 1); }
  function handleToggleVoice() { voiceOn = !voiceOn; if (!voiceOn && VoiceCoach.supported) window.speechSynthesis.cancel(); forceRender(x => x + 1); }

  function handleLinkExisting(code) {
    syncing = true;
    return syncPull(code).then((r) => { syncing = false; window.location.reload(); return r; }).catch((e) => { syncing = false; throw e; });
  }
  function handleStartFresh() { setNeedsLinkPrompt(false); }

  if (needsLinkPrompt) {
    return html`<div class="app-shell"><${LinkOrNewPrompt} onLink=${handleLinkExisting} onFresh=${handleStartFresh} /></div>`;
  }

  return html`
    <div class="app-shell">
      ${screen === 'home' ? html`<${Home} state=${state} onStart=${handleStart} onOpenProgress=${() => setScreen('progress')} onOpenSettings=${() => setScreen('settings')} onOpenWeekPlan=${() => setScreen('weekplan')} todaySession=${todaySession} onSetRounds=${handleSetRounds} onReviewWeightsNow=${handleReviewWeightsNow} onSnoozeWeights=${handleSnoozeWeights} />` : null}
      ${screen === 'weekplan' ? html`<${WeeklyPlan} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'session' && activeSession ? html`<${TrainingSession} session=${activeSession} state=${state} rounds=${activeRounds} onFinishCircuit=${handleCircuitFinish} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo' ? html`<${HypopressiveBlock} onDone=${handleHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo-extend-prompt' ? html`<${ExtendHypoPrompt} onYes=${handleExtendYes} onNo=${handleExtendNo} />` : null}
      ${screen === 'hypo-extend' ? html`<${HypopressiveBlock} steps=${HYPOPRESSIVE_EXTRA} title="Extra · 2 min de abdomen" onDone=${handleExtendDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'summary' ? html`<${SessionSummary} results=${lastResults} rounds=${activeRounds} onDone=${() => setScreen('home')} />` : null}
      ${screen === 'progress' ? html`<${Progress} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'settings' ? html`<${Settings} state=${state} onBack=${() => setScreen('home')} onReset=${handleReset} soundsEnabled=${soundsOn} onToggleSounds=${handleToggleSounds} voiceEnabled=${voiceOn} onToggleVoice=${handleToggleVoice} />` : null}
    </div>
  `;
}

  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);
  document.getElementById('favicon').href = iconUrl;
  document.getElementById('apple-touch-icon').href = iconUrl;
  const manifest = {
    name: 'Forma 55 — Circuito diario',
    short_name: 'Forma 55',
    start_url: './',
    display: 'standalone',
    background_color: '#12141A',
    theme_color: '#12141A',

  };
  document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

const root = createRoot(document.getElementById('root'));
root.render(h(App));
