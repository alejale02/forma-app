// V2 — READINESS DIARIO
// Registro breve (1–5). 1=peor, 5=mejor; dolor se invierte al calcular.
function getTodayReadiness(state) { return (state.readinessLog || {})[localDateKey()] || null; }
function computeReadinessScore(entry) {
  if (!entry) return null;
  const vals = ['sleep','energy','motivation','pain'].map(k => Number(entry[k]));
  if (vals.some(v => !Number.isFinite(v))) return null;
  const normalizedPain = 6 - vals[3];
  return Math.round(((vals[0]+vals[1]+vals[2]+normalizedPain)/4)*10)/10;
}
function getReadinessRecommendation(entry, baseRounds) {
  const score = computeReadinessScore(entry);
  if (score == null) return { score:null, rounds:baseRounds, label:'Sin ajustar', tone:'neutral' };
  if (score <= 2.2) return { score, rounds:Math.max(1, baseRounds-1), label:'Recuperación baja: reduce 1 vuelta y prioriza técnica', tone:'low' };
  if (score < 3.2) return { score, rounds:Math.max(1, baseRounds-1), label:'Día moderado: baja 1 vuelta si notas fatiga', tone:'mid' };
  return { score, rounds:baseRounds, label:'Preparación adecuada para el plan normal', tone:'good' };
}
function ReadinessCard({ state, onSave }) {
  const stored = getTodayReadiness(state);
  const current = stored || { sleep:3, energy:3, pain:3, motivation:3 };
  const [vals,setVals] = useState(current);
  const [status,setStatus] = useState(stored ? 'saved' : '');
  const lastActionRef = useRef(0);
  const commit = (next, statusText) => {
    const now = Date.now();
    if (now - lastActionRef.current < 500) return;
    lastActionRef.current = now;
    if (typeof onSave !== 'function') return;
    onSave(next);
    setStatus(statusText);
  };
  const rec = getReadinessRecommendation(vals, state.roundsPerDay || 2);
  const field=(key,label)=>html`<label>${label}<select value=${vals[key]} onChange=${e=>{setStatus('');setVals({...vals,[key]:Number(e.target.value)})}}>${[1,2,3,4,5].map(v=>html`<option value=${v}>${v}</option>`)}</select></label>`;
  return html`<div class="readiness-card"><div class="readiness-head"><strong>⚡ Preparación de hoy</strong><span>${status === 'saved' ? '✓ Guardado' : status === 'skipped' ? '✓ Omitido hoy' : (rec.score != null ? `Índice ${rec.score}/5` : 'Opcional')}</span></div><div class="readiness-grid">${field('sleep','Sueño')}${field('energy','Energía')}${field('pain','Dolor')}${field('motivation','Motiv.')}</div><p class="readiness-note">${rec.label}</p><div class="readiness-actions"><button type="button" class="btn-secondary" onClick=${e=>{e.preventDefault();e.stopPropagation();commit(null,'skipped')}} onPointerUp=${e=>{e.preventDefault();e.stopPropagation();commit(null,'skipped')}}>Omitir hoy</button><button type="button" class="btn-primary" onClick=${e=>{e.preventDefault();e.stopPropagation();commit({...vals},'saved')}} onPointerUp=${e=>{e.preventDefault();e.stopPropagation();commit({...vals},'saved')}}>Guardar</button></div></div>`;
}

// =====================================================================
// PANTALLA: HOME
// =====================================================================
// Resumen de un vistazo en la Home: antes había que entrar en Hábitos para
// saber "¿voy bien esta semana?" — estos 3 números son los que de verdad
// resumen la semana (déficit real, si te mueves lo suficiente, si duermes
// lo bastante para recuperar), tocables para ir directo al detalle.
function HomeGlanceStrip({ state, onOpenHabitos }) {
  const kpi = useMemo(() => buildHabitsKPIs(state, 30), [state.stepsLog, state.sleepLog, state.calorieLog, state.stepsTarget]);
  const streak = useMemo(() => computeTrainingStreak(state.sessionLog), [state.sessionLog]);
  const morningStreak = useMemo(() => computeMorningStreak(state.sessionLog), [state.sessionLog]);
  const barStreak = useMemo(() => computeBarStreak(state.sessionLog), [state.sessionLog]);
  const hasAnyData = kpi.kcalAvg7 != null || kpi.stepsAvg7 != null || kpi.sleepAvg7 != null || streak > 0 || morningStreak > 0 || barStreak > 0;
  if (!hasAnyData) {
    return html`<p class="home-glance-empty" onClick=${onOpenHabitos}>Registra pasos, sueño o calorías en Hábitos para ver aquí tu resumen de la semana →</p>`;
  }
  const deficitGood = kpi.deficitAvg7 != null && kpi.deficitAvg7 >= 0;
  // Antes estas fichas solo mostraban la racha (días SEGUIDOS, se resetea
  // con cualquier hueco) — pedido explícito: mostrar el TOTAL real de
  // entrenos terminados desde que empezaste, que no se resetea nunca.
  // state.totalSessionsDone ya es exactamente ese contador persistente
  // para el circuito (el mismo que usa el ciclo de fases, fuente de
  // verdad única). Para mañana/barra se cuenta directo de sessionLog. La
  // racha actual se queda como dato secundario pequeño al lado, no
  // desaparece, pero ya no es lo primero que se lee.
  const totalCircuit = state.totalSessionsDone || 0;
  const totalMorning = (state.sessionLog || []).filter(s => s.standalone && !s.barHang).length;
  const totalBar = (state.sessionLog || []).filter(s => s.barHang).length;
  const streakPills = [
    totalCircuit > 0 ? { val: `💪${totalCircuit}`, label: totalCircuit === 1 ? 'entreno' : 'entrenos', streak } : null,
    totalMorning > 0 ? { val: `🌅${totalMorning}`, label: totalMorning === 1 ? 'mañana' : 'mañanas', streak: morningStreak } : null,
    totalBar > 0 ? { val: `🧗${totalBar}`, label: totalBar === 1 ? 'barra' : 'barras', streak: barStreak } : null,
  ].filter(Boolean);
  const tiles = [
    kpi.deficitAvg7 != null ? { val: `${deficitGood ? '−' : '+'}${Math.abs(Math.round(kpi.deficitAvg7))}`, label: deficitGood ? 'kcal/día déficit' : 'kcal/día superávit', cls: deficitGood ? 'is-good' : 'is-over' } : null,
    kpi.stepsAvg7 != null ? { val: kpi.stepsAvg7.toLocaleString('es-ES'), label: 'pasos/día media', cls: kpi.stepsAvg7 >= kpi.stepsTarget ? 'is-good' : kpi.stepsAvg7 < kpi.stepsTarget * 0.7 ? 'is-over' : '' } : null,
    kpi.sleepAvg7 != null ? { val: `${kpi.sleepAvg7.toFixed(1)}h`, label: 'sueño medio', cls: kpi.sleepAvg7 >= SLEEP_GOAL_H ? 'is-good' : kpi.sleepAvg7 < 6 ? 'is-over' : '' } : null,
  ].filter(Boolean);
  return html`
    <div>
      ${streakPills.length ? html`
        <div class="home-streak-pills">
          ${streakPills.map((p, i) => html`<span key=${i} class="streak-pill">${p.val} <em>${p.label}</em>${p.streak >= 2 ? html` <b>🔥${p.streak}</b>` : ''}</span>`)}
        </div>
      ` : null}
      ${tiles.length ? html`
        <button class="home-glance" onClick=${onOpenHabitos}>
          ${tiles.map((t, i) => html`
            <div key=${i} class=${`home-glance-tile ${t.cls}`}>
              <span class="home-glance-val">${t.val}</span>
              <span class="home-glance-label">${t.label}</span>
            </div>
          `)}
        </button>
      ` : null}
    </div>
  `;
}

function Home({ state, onStart, onOpenProgress, onOpenSettings, onOpenWeekPlan, onOpenNutrition, onOpenHabitos, todaySession, onSetRounds, onReviewWeightsNow, onSnoozeWeights, onStartMorningHypo, onStartBar, onReviewPhotosNow, onSnoozePhotos, onBackupNow, onSnoozeBackup, onStartPostureCheckin, onSnoozePostureCheckin, onSetTodayPain, onSaveReadiness }) {
  const phase = PHASES[state.cycleWeek];
  // Centro de avisos: qué aviso está expandido ahora mismo (null = el de
  // mayor prioridad por defecto). Se resetea solo si el usuario toca un
  // chip — no hace falta persistirlo entre sesiones de la app.
  const [activeAlertId, setActiveAlertId] = useState(null);
  const sessionsInWeek = state.totalSessionsDone % 6;
  const jsDay = new Date().getDay();
  const isoDay = jsDay === 0 ? 7 : jsDay;
  const isRestDay = isoDay === REST_DAY;

  // "Hoy" en la vista previa NO es "el día de calendario de hoy" sino "la
  // próxima sesión según el contador de sesiones" (totalSessionsDone), que
  // avanza en cuanto terminas un circuito — y con él, a veces también la
  // fase (cada 6 sesiones). Sin este control, justo después de entrenar la
  // Home vuelve a mostrar "Empezar circuito de hoy" pero con la SIGUIENTE
  // sesión de la rotación, dando la falsa impresión de que hay que hacer
  // dos entrenos el mismo día.
  const todayKeyHome = localDateKey();
  // La rutina matutina (hipopresivos en solitario) también deja una entrada
  // en sessionLog, marcada con standalone:true — no cuenta como "circuito
  // de hoy hecho", solo el circuito de fuerza real (rounds > 0) debe activar
  // esta tarjeta. Sin este filtro, hacer solo la rutina matutina ya bloqueaba
  // el circuito del día como si estuviera completado.
  const todayLogEntry = [...(state.sessionLog || [])].reverse().find(s => !s.standalone && localDateKey(new Date(s.date)) === todayKeyHome);
  // Un circuito real completado cuenta siempre, sea domingo o no — antes
  // excluía el domingo a propósito, lo que provocaba justo la confusión de
  // "si entreno en domingo para recuperar un día perdido, ¿me lo cuenta o
  // sigue diciendo que toca descanso?". Ahora si entrenas en domingo, se
  // registra y se reconoce exactamente igual que cualquier otro día.
  const alreadyTrainedToday = !!todayLogEntry;
  const [trainAnyway, setTrainAnyway] = useState(false);

  // --- Aviso automático de revisión de peso: cada 4 semanas al arrancar
  // Volumen tras el Descarga (mejor momento fisiológico para probar más
  // carga), y como red de seguridad, también si pasan 14 días sin revisar
  // aunque no haya coincidido con el cambio de fase. Se puede posponer 3
  // días sin perder el aviso de fondo. */
  const today = new Date().toISOString().slice(0, 10);
  const daysSinceReview = Math.floor((new Date(today) - new Date(state.lastWeightReviewDate)) / 86400000);
  const snoozed = state.weightReviewSnoozeUntil && state.weightReviewSnoozeUntil > today;
  const showWeightReminder = !snoozed && (state.weightReviewDue || daysSinceReview >= 14);

  // --- Check-in semanal de síntomas posturales: cadencia de 7 días, con
  // posponer 2 días si se pide (ventana más corta que peso/foto porque es
  // el dato que más directamente mide si el objetivo #1 del plan está
  // funcionando — no queremos que se acumule mucho retraso).
  const daysSincePosture = Math.floor((new Date(today) - new Date(state.lastPostureCheckinDate)) / 86400000);
  const postureSnoozed = state.postureCheckinSnoozeUntil && state.postureCheckinSnoozeUntil > today;
  const showPostureCheckin = !postureSnoozed && daysSincePosture >= 7;

  // --- Aviso de foto de progreso mensual: cadencia de ~30 días, con
  // recordatorio pospuesto 5 días si se pide. Independiente del de peso
  // (cadencia y motivo distintos) para no mezclar dos avisos en el mismo
  // disparador. ---
  const daysSincePhotoReview = Math.floor((new Date(today) - new Date(state.lastPhotoReviewDate)) / 86400000);
  const photoSnoozed = state.photoReviewSnoozeUntil && state.photoReviewSnoozeUntil > today;
  const showPhotoReminder = !photoSnoozed && (state.photoReviewDue || daysSincePhotoReview >= 30);

  // --- Aviso de copia de seguridad: cadencia de 14 días. Es el más
  // importante de los tres avisos (protege TODO lo demás — historial,
  // fotos, medidas), así que la cadencia es más corta que la de fotos. ---
  const daysSinceBackup = Math.floor((new Date(today) - new Date(state.lastBackupDate)) / 86400000);
  const backupSnoozed = state.backupSnoozeUntil && state.backupSnoozeUntil > today;
  const showBackupReminder = !backupSnoozed && (state.backupDue || daysSinceBackup >= 14);

  // --- Aviso activo de pasos: a diferencia del resto de recordatorios
  // (peso/foto/backup, cadencia de días), este mira el AVANCE DE HOY a
  // lo largo del día. Con una media real de ~6.700 pasos/día frente a un
  // objetivo de 8.000 (69% de los días por debajo), es la palanca más
  // fácil de recuperar sin tocar la comida — pero solo si se avisa a
  // tiempo de actuar, no a las 23h. Ventana adelantada de 14h a 12h
  // (mediodía): con trabajo de oficina sentado, la inactividad de toda
  // la mañana ya deja una brecha real a esa hora, y avisar 2h antes da
  // margen para una caminata en la pausa de comer en vez de tener que
  // recuperarlo todo por la noche. Ritmo esperado: reparto lineal entre
  // las 7h y las 21h (jornada despierto típica). Solo avisa si vas ≥25%
  // del objetivo por debajo del ritmo esperado a esa hora.
  const nowHour = new Date().getHours();
  const todaySteps = state.stepsLog[todayKeyHome] || 0;
  const expectedFraction = Math.min(1, Math.max(0, (nowHour - 7) / (21 - 7)));
  const expectedSteps = Math.round((state.stepsTarget || 8000) * expectedFraction);
  const stepsDeficit = expectedSteps - todaySteps;
  const showStepsNudge = nowHour >= 12 && nowHour < 22 && stepsDeficit > (state.stepsTarget || 8000) * 0.25;
  const walkMinutesNeeded = Math.max(5, Math.round(stepsDeficit / 100));

  // Aviso de descompresión en barra — ventana 9h-14h, la franja de mitad
  // de mañana en horario laboral que se acordó como la fisiológicamente
  // correcta (los discos ya han acumulado varias horas de compresión por
  // estar sentado, a diferencia de nada más levantarse). Se apaga solo si
  // ya hay un registro de barra hecho hoy.
  const barDoneToday = (state.sessionLog || []).some(s => s.barHang && localDateKey(new Date(s.date)) === todayKeyHome);
  const showBarNudge = nowHour >= 9 && nowHour < 14 && !barDoneToday;

  // --- Centro de avisos unificado (mejora 3 de la propuesta de rediseño):
  // antes podían apilarse hasta 4 banners grandes seguidos (pasos, peso,
  // foto, backup) empujando todo lo demás fuera de la pantalla. Ahora se
  // recogen en un array con prioridad y se muestra solo UNO expandido a
  // la vez — el resto aparece como chips compactos tocables debajo.
  // Prioridad: backup (protege todo lo demás, riesgo de pérdida de datos)
  // > peso (accionable, afecta directamente a la progresión) > pasos
  // (urgente mientras dura el día, decae) > foto (cadencia mensual, la
  // menos urgente de las cuatro).
  const alerts = [
    showBackupReminder ? { id: 'backup', icon: '🗂️', title: 'Haz una copia de seguridad', text: 'Todo tu progreso vive solo en este teléfono — sin copia, un fallo del navegador o un cambio de móvil podría borrarlo todo. Un toque descarga el archivo completo (historial, fotos, medidas).', primaryLabel: 'Exportar ahora', onPrimary: onBackupNow, secondaryLabel: 'Recordar en 5 días', onSecondary: onSnoozeBackup, cls: 'backup-reminder' } : null,
    showWeightReminder ? { id: 'weight', icon: '💪', title: state.weightReviewDue ? 'Nuevo ciclo: buen momento para subir peso' : 'Llevas 2 semanas con el mismo peso', text: state.weightReviewDue ? 'Empiezas Volumen tras el Descarga — el cuerpo está fresco, es el mejor momento del mes para probar más kilos en mancuernas o mochila.' : 'Si llevas dos sesiones seguidas completando series con esfuerzo bajo (RPE ≤ 6), toca subir peso.', primaryLabel: 'Revisar pesos ahora', onPrimary: onReviewWeightsNow, secondaryLabel: 'Recordar en 3 días', onSecondary: onSnoozeWeights, cls: '' } : null,
    showPostureCheckin ? { id: 'posture', icon: '🧍', title: 'Check-in semanal de postura (15s)', text: 'Nuca, hombros y zona lumbar/pélvica — la única forma de saber si la corrección postural está funcionando de verdad, no solo si haces los ejercicios.', primaryLabel: 'Responder ahora', onPrimary: onStartPostureCheckin, secondaryLabel: 'Recordar en 2 días', onSecondary: onSnoozePostureCheckin, cls: 'posture-nudge' } : null,
    showStepsNudge ? { id: 'steps', icon: '🚶', title: 'Vas por debajo del ritmo de pasos de hoy', text: `Llevas ${todaySteps.toLocaleString('es-ES')} de los ${(state.stepsTarget || 8000).toLocaleString('es-ES')} — a esta hora deberías ir por ~${expectedSteps.toLocaleString('es-ES')}. Un paseo de ~${walkMinutesNeeded} min te pone al día.`, primaryLabel: 'Ir a Hábitos', onPrimary: onOpenHabitos, secondaryLabel: null, onSecondary: null, cls: 'steps-nudge' } : null,
    showBarNudge ? { id: 'bar', icon: '🧗', title: 'Momento para la barra (descompresión)', text: 'Llevas ya un rato sentado — 4 minutos de colgada activa en la barra descomprimen la columna y ayudan a soltar hombro/espalda alta. 5 días/semana, entre semana.', primaryLabel: 'Hacer ahora (4 min)', onPrimary: onStartBar, secondaryLabel: null, onSecondary: null, cls: 'bar-nudge' } : null,
    showPhotoReminder ? { id: 'photo', icon: '📸', title: 'Toca foto de progreso del mes', text: 'El ojo detecta cambios de tono y definición que ni la báscula ni la cinta métrica capturan. Solo se guarda en tu dispositivo, nunca se sube a ningún sitio.', primaryLabel: 'Hacer foto ahora', onPrimary: onReviewPhotosNow, secondaryLabel: 'Recordar en 5 días', onSecondary: onSnoozePhotos, cls: 'photo-reminder' } : null,
  ].filter(Boolean);
  const activeAlert = alerts.find(a => a.id === activeAlertId) || alerts[0];

  return html`
    <div class="screen home">
      <header class="home-header">
        <div>
          <p class="eyebrow">${DAY_NAMES[isoDay]} · Semana ${state.cycleWeek} del plan mensual</p>
          <h1>${phase.name}</h1>
        </div>
        <button class="icon-btn" onClick=${onOpenSettings} aria-label="Configuración">⚙</button>
      </header>

      <${HomeGlanceStrip} state=${state} onOpenHabitos=${onOpenHabitos} />

      <${ReadinessCard} state=${state} onSave=${onSaveReadiness} />

      ${activeAlert ? html`
        <div class=${`weight-reminder ${activeAlert.cls}`} onClick=${(activeAlert.id === 'steps' || activeAlert.id === 'bar') ? activeAlert.onPrimary : undefined}>
          <p class="weight-reminder-title">${activeAlert.icon} ${activeAlert.title}</p>
          <p class="weight-reminder-text">${activeAlert.text}</p>
          ${activeAlert.id !== 'steps' ? html`
            <div class="weight-reminder-actions">
              <button class="btn-primary" onClick=${activeAlert.onPrimary}>${activeAlert.primaryLabel}</button>
              ${activeAlert.secondaryLabel ? html`<button class="btn-secondary" onClick=${activeAlert.onSecondary}>${activeAlert.secondaryLabel}</button>` : null}
            </div>
          ` : null}
        </div>
        ${alerts.length > 1 ? html`
          <div class="alert-chip-row">
            <span class="alert-chip-hint">${alerts.length - 1} aviso${alerts.length > 2 ? 's' : ''} más:</span>
            ${alerts.filter(a => a.id !== activeAlert.id).map(a => html`
              <button key=${a.id} class="alert-chip" onClick=${() => setActiveAlertId(a.id)}>${a.icon} ${a.title}</button>
            `)}
          </div>
        ` : null}
      ` : null}

      <div class="phase-card" style=${{ '--phase-color': phase.color }}>
        <p class="phase-name">${phase.name}</p>
        <p class="phase-desc">${phase.desc}</p>
        <div class="phase-progress">
          ${[0, 1, 2, 3, 4, 5].map(i => html`<span key=${i} class=${`dot ${i < sessionsInWeek ? 'filled' : ''}`} />`)}
        </div>
        <p class="phase-progress-label">${sessionsInWeek}/6 sesiones esta semana del ciclo</p>
      </div>

      <div class="cycle-track">
        ${[1, 2, 3, 4].map(w => html`
          <div key=${w} class=${`cycle-step ${w === state.cycleWeek ? 'active' : ''} ${w < state.cycleWeek ? 'done' : ''}`}>
            <span class="cycle-num">${w}</span>
            <span class="cycle-label">${PHASES[w].name}</span>
          </div>
        `)}
      </div>

      ${alreadyTrainedToday ? html`
        <div class="rest-day-card">
          <p class="rest-day-title">✅ Entreno de hoy completado</p>
          <p class="cue-text">${todayLogEntry.rounds} ${todayLogEntry.rounds === 1 ? 'vuelta' : 'vueltas'} · fase ${PHASES[todayLogEntry.phase].name} · ~${todayLogEntry.calories} kcal estimadas. La sesión que verías aquí debajo ya es la siguiente en la rotación — grupos musculares distintos a los de hoy, no repetidos.</p>
          <button class="btn-secondary" onClick=${onStart}>Añadir una sesión extra hoy (voluntario)</button>
        </div>
      ` : (isRestDay && !trainAnyway) ? html`
        <div class="rest-day-card">
          <p class="rest-day-title">Hoy toca descanso</p>
          <p class="cue-text">Domingo: sin sesión de fuerza por defecto. El bloque hipopresivo de aquí abajo se puede hacer igualmente si quieres mantener el trabajo de faja abdominal. Si te falta una sesión de otro día, puedes recuperarla hoy sin problema.</p>
          <button class="btn-secondary" onClick=${() => setTrainAnyway(true)}>Entrenar igualmente hoy</button>
        </div>
      ` : html`
        ${(() => {
          const rec = recommendRounds(state);
          const showRecBadge = state.roundsPerDay !== rec.recommended;
          return html`
          <div class="rounds-block">
            <p class="rounds-label">¿Cuántas vueltas al circuito hoy?</p>
            ${showRecBadge ? html`
              <button class="rounds-recommendation" onClick=${() => onSetRounds(rec.recommended)}>
                <span class="rounds-rec-badge">Recomendado hoy: ${rec.recommended} ${rec.recommended === 1 ? 'vuelta' : 'vueltas'}</span>
                <span class="rounds-rec-why">${rec.reasons.join(' · ')}</span>
              </button>
            ` : html`
              <p class="rounds-rec-why rounds-rec-matched">✓ Ya tienes puesta la recomendación de hoy — ${rec.reasons.join(' · ')}</p>
            `}
            <div class="rounds-picker">
              ${[1, 2, 3, 4, 5].map(n => html`
                <button key=${n} class=${`round-btn ${state.roundsPerDay === n ? 'active' : ''} ${n === rec.recommended ? 'recommended' : ''}`} onClick=${() => onSetRounds(n)}>
                  <span class="rn">${n}</span><span class="rl">${n === 1 ? 'vuelta' : 'vueltas'}</span>
                </button>
              `)}
            </div>
            <p class="rounds-hint">Cada vuelta repite los ${todaySession.exercises.length} ejercicios de hoy en el mismo orden. Cada vuelta se registra por separado para calcular tu progresión. La recomendación se calcula con la fase del mes, tu RPE medio de las últimas 2 sesiones y tus horas de sueño recientes — no es fija, cámbiala si quieres.</p>
            <p class="time-estimate">⏱ Tiempo total de hoy: <strong>~${fmtMinutes(estimateDaySeconds(todaySession, state.roundsPerDay, state.pace || 'normal'))} min</strong> (${state.roundsPerDay} ${state.roundsPerDay === 1 ? 'vuelta' : 'vueltas'} + bloque hipopresivo)</p>
          </div>
        `; })()}

        ${(() => {
          const todayKey = localDateKey();
          const painArea = state.painLog && state.painLog[todayKey];
          const painOptions = [
            { key: 'hombro', label: 'Hombro' }, { key: 'rodilla', label: 'Rodilla' },
            { key: 'lumbar', label: 'Lumbar' }, { key: 'muneca', label: 'Muñeca' },
          ];
          return painArea ? html`
            <p class="pain-active-note">🩹 Hoy evitando ejercicios de <strong>${painOptions.find(o => o.key === painArea)?.label.toLowerCase()}</strong> en el circuito · <button class="pain-clear-btn" onClick=${() => onSetTodayPain(null)}>quitar</button></p>
          ` : html`
            <details class="pain-check">
              <summary>¿Algo te duele hoy?</summary>
              <div class="pain-check-options">
                ${painOptions.map(o => html`<button key=${o.key} class="pain-check-btn" onClick=${() => onSetTodayPain(o.key)}>${o.label}</button>`)}
              </div>
            </details>
          `;
        })()}

        <div class="today-preview">
          <p class="today-title">Hoy: ${todaySession.templateName} · ${state.roundsPerDay} ${state.roundsPerDay === 1 ? 'vuelta' : 'vueltas'}</p>
          <div class="today-list">
            ${todaySession.exercises.map(ex => html`
              <div key=${ex.id} class="today-row">
                <span class="today-ex-name">${ex.name}</span>
                <span class="today-ex-detail">
                  ${ex.isTimeBased ? `${ex.targetReps}s` : `${ex.targetReps} reps`}${ex.equip === 'mancuernas' || ex.equip === 'mochila' ? ` · ${ex.weight}kg` : ex.equip === 'banda' ? ' · banda elástica' : ''} × ${state.roundsPerDay}
                </span>
              </div>
            `)}
          </div>
          <button class="btn-primary btn-huge" onClick=${onStart}>Empezar circuito de hoy</button>
        </div>

        <${TodayExerciseCards} exercises=${todaySession.exercises} />
      `}

      <div class="morning-hypo-card">
        <p class="morning-hypo-title">🌅 Rutina matutina: postura + hipopresivos</p>
        <p class="cue-text">~6 min, independiente del circuito de hoy — ideal recién levantado, antes del café. Empieza con 3 ejercicios contra el hombro adelantado de estar sentado (chin tuck, apertura torácica, apertura de pecho), y termina con la secuencia hipopresiva completa en ayunas. No cuenta como vuelta ni afecta al ciclo semanal, pero suma a tu tiempo y calorías del día.</p>
        <button class="btn-secondary" onClick=${onStartMorningHypo}>Empezar ahora</button>
      </div>

      <div class="stat-row">
        <div class="stat-box"><p class="stat-num">${state.totalSessionsDone}</p><p class="stat-label">Sesiones totales</p></div>
        <div class="stat-box"><p class="stat-num">${Object.keys(state.exerciseLevels).length}</p><p class="stat-label">Ejercicios calibrados</p></div>
      </div>

      <div class="quick-links-grid">
        <button class="quick-link-tile" onClick=${onOpenWeekPlan}><span class="qlt-icon">📅</span><span>Plan semanal</span></button>
        <button class="quick-link-tile" onClick=${onOpenNutrition}><span class="qlt-icon">🍽️</span><span>Nutrición</span></button>
        <button class="quick-link-tile" onClick=${onOpenHabitos}><span class="qlt-icon">📊</span><span>Hábitos</span></button>
        <button class="quick-link-tile" onClick=${onOpenProgress}><span class="qlt-icon">📈</span><span>Progreso</span></button>
      </div>
    </div>
  `;
}

// =====================================================================
// PANTALLA: PLAN SEMANAL
// =====================================================================
function Habitos({ state, onBack, forceRender }) {
  const todayKey = localDateKey();
  // editKey es el día que se está viendo/editando. Por defecto hoy, pero se
  // puede navegar a días anteriores para corregir un olvido o un dato mal
  // introducido, sin perder el histórico ya guardado.
  const [editKey, setEditKey] = useState(todayKey);
  // Qué comida tiene abierto el calculador de kcal reales (null = ninguna),
  // y el picker de alimento/cantidad pendiente de añadir para esa comida.
  const [openCalcMeal, setOpenCalcMeal] = useState(null);
  const [foodPick, setFoodPick] = useState({ foodId: FOOD_DB[0].id, amount: '', manual: false, manualName: '', manualKcal: '', manualProtein: '', manualCarb: '', manualFat: '', manualFiber: '' });
  const isToday = editKey === todayKey;
  const editDateObj = new Date(editKey + 'T00:00:00');
  const editJsDay = editDateObj.getDay();
  const editIso = editJsDay === 0 ? 7 : editJsDay;
  const editPlan = NUTRITION_PLAN.find(d => d.day === editIso);
  const dayTargetKcal = editPlan ? editPlan.kcal : NUTRITION_TARGETS.kcal;
  const dayLabel = isToday ? 'Hoy' : editDateObj.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'short' });

  function goToDay(delta) {
    const next = shiftKey(editKey, delta);
    if (next > todayKey) return; // no se editan días futuros
    setEditKey(next);
  }

  const steps = state.stepsLog[editKey] || '';
  const sleep = state.sleepLog[editKey] || '';
  const calEntry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };

  // --- Banco semanal de extras: en vez de que cada extra puntual (350,
  // 450, 500 kcal en días sueltos) descuadre el déficit sin que se vea
  // venir, se convierte en un presupuesto visible de 7 días. Ventana
  // móvil de 7 días terminando en editKey (mismo criterio que el resto
  // de medias semanales de la app), no semana natural — así el número
  // siempre refleja "la última semana real", no depende de qué día caiga
  // el lunes.
  const weeklyExtraBudget = state.weeklyExtraBudgetKcal || 500;
  const last7ExtraKeys = Array.from({ length: 7 }, (_, i) => shiftKey(editKey, -i));
  const weeklyExtraUsed = last7ExtraKeys.reduce((sum, k) => sum + ((state.calorieLog[k] && state.calorieLog[k].extraKcal) || 0), 0);
  const weeklyExtraLeft = weeklyExtraBudget - weeklyExtraUsed;

  function setSteps(v) { state.stepsLog[editKey] = v === '' ? undefined : Math.max(0, parseInt(v, 10) || 0); saveState(state); forceRender(x => x + 1); }
  function setStepsTarget(v) { state.stepsTarget = Math.max(1000, parseInt(v, 10) || 8000); saveState(state); forceRender(x => x + 1); }
  function setWeeklyExtraBudget(v) { state.weeklyExtraBudgetKcal = Math.max(0, parseInt(v, 10) || 500); saveState(state); forceRender(x => x + 1); }
  function setSleep(v) { state.sleepLog[editKey] = v === '' ? undefined : Math.max(0, Math.min(14, parseFloat(v) || 0)); saveState(state); forceRender(x => x + 1); }

  function toggleMeal(mealKey) {
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    entry.meals = { ...entry.meals, [mealKey]: !entry.meals[mealKey] };
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  function setExtraKcal(v) {
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    entry.extraKcal = v === '' ? 0 : Math.max(0, parseInt(v, 10) || 0);
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  // Calculador de kcal reales por comida: en vez de fiarse solo del check
  // "seguí el plan", permite anotar exactamente qué se comió (alimento +
  // cantidad) para esa comida concreta. En cuanto hay 1+ alimento
  // añadido, ese total pasa a mandar sobre la estimación fija del plan
  // para esa comida (ver mealDisplayKcal) — más preciso para afinar el
  // déficit real del día.
  function addRealFood(mealKey, foodId, amount) {
    const food = FOOD_DB.find(f => f.id === foodId);
    if (!food || !amount || amount <= 0) return;
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    const realFoods = { ...(entry.realFoods || {}) };
    const list = realFoods[mealKey] ? [...realFoods[mealKey]] : [];
    list.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, foodId, amount, name: food.name, unit: food.unit || 'g', kcal: foodKcal(food, amount), proteinG: foodProtein(food, amount), carbG: foodCarb(food, amount), fatG: foodFat(food, amount), fiberG: foodFiber(food, amount), semaforo: food.semaforo || null });
    realFoods[mealKey] = list;
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  // Alimento manual: para lo que no está (ni va a estar nunca del todo)
  // en FOOD_DB — un plato compuesto, una marca concreta, una ración ya
  // preparada. Se anota el nombre libre y las kcal totales de esa
  // porción directamente (no por 100g), consultando el envase o una
  // estimación razonable. Queda guardado igual que cualquier otro
  // alimento, mismo formato de item. La proteína es opcional: si no se
  // sabe, se deja en 0 en vez de inventar un número — mejor un contador
  // de proteína honesto e incompleto que uno falso.
  function addManualFood(mealKey, name, kcal, proteinG, carbG, fatG, fiberG) {
    if (!name || !kcal || kcal <= 0) return;
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    const realFoods = { ...(entry.realFoods || {}) };
    const list = realFoods[mealKey] ? [...realFoods[mealKey]] : [];
    list.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, foodId: null, amount: 1, name, unit: 'ud', kcal: Math.round(kcal), proteinG: proteinG > 0 ? Math.round(proteinG * 10) / 10 : 0, carbG: carbG >= 0 ? Math.round(carbG * 10) / 10 : 0, fatG: fatG >= 0 ? Math.round(fatG * 10) / 10 : 0, fiberG: fiberG >= 0 ? Math.round(fiberG * 10) / 10 : 0 });
    realFoods[mealKey] = list;
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  function removeRealFood(mealKey, itemId) {
    const entry = state.calorieLog[editKey];
    if (!entry || !entry.realFoods || !entry.realFoods[mealKey]) return;
    const realFoods = { ...entry.realFoods };
    realFoods[mealKey] = realFoods[mealKey].filter(it => it.id !== itemId);
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }

  // Actividad extra puntual (correr, pádel, bici...) del día que se está
  // editando — distinta de los pasos: esto es gasto adicional real que el
  // TDEE fijo no contempla, así que se suma aparte y se refleja en el
  // déficit del dashboard (buildHabitsKPIs), no solo se archiva.
  const dayActivities = state.extraActivityLog[editKey] || [];
  const [actType, setActType] = useState('correr');
  const [actMinutes, setActMinutes] = useState('');
  const currentWeightKg = useMemo(() => getCurrentWeightKg(state), [state.measurements]);
  function addActivity() {
    const minutes = parseInt(actMinutes, 10);
    if (!minutes || minutes <= 0) return;
    const kcal = estimateActivityKcal(actType, minutes, currentWeightKg);
    const list = state.extraActivityLog[editKey] ? [...state.extraActivityLog[editKey]] : [];
    list.push({ id: `${Date.now()}`, type: actType, minutes, kcal });
    state.extraActivityLog[editKey] = list;
    saveState(state); forceRender(x => x + 1);
    setActMinutes('');
  }
  function removeActivity(id) {
    state.extraActivityLog[editKey] = (state.extraActivityLog[editKey] || []).filter(a => a.id !== id);
    saveState(state); forceRender(x => x + 1);
  }

  const mealItems = editPlan ? [
    { key: 'breakfast', label: 'Desayuno', text: NUTRITION_COFFEE.text, kcal: NUTRITION_COFFEE.kcal, proteinG: NUTRITION_COFFEE.proteinG },
    { key: 'midMorning', label: 'Media mañana', text: editPlan.midMorning, kcal: editPlan.midMorningKcal, proteinG: editPlan.midMorningProteinG },
    { key: 'lunch', label: 'Comida', text: editPlan.lunch, kcal: editPlan.lunchKcal, proteinG: editPlan.lunchProteinG },
    { key: 'merienda', label: 'Merienda', text: NUTRITION_MERIENDA.text, kcal: NUTRITION_MERIENDA.kcal, proteinG: NUTRITION_MERIENDA.proteinG },
    { key: 'dinner', label: 'Cena', text: editPlan.dinner, kcal: editPlan.dinnerKcal, proteinG: editPlan.dinnerProteinG },
  ].map(m => ({ ...m, planMacros: planMealMacros(editPlan.day, m.key) })) : [];

  const mealsKcal = mealItems.reduce((sum, m) => sum + mealDisplayKcal(calEntry, m.key, !!calEntry.meals[m.key], m.kcal), 0);
  const dayProteinG = Math.round(mealItems.reduce((sum, m) => sum + mealDisplayProtein(calEntry, m.key, !!calEntry.meals[m.key], m.proteinG), 0) * 10) / 10;
  const proteinTarget = NUTRITION_TARGETS.proteinG;
  const proteinPct = proteinTarget ? dayProteinG / proteinTarget : 0;
  const totalKcal = mealsKcal + (calEntry.extraKcal || 0);
  const diff = totalKcal - dayTargetKcal;
  const hasAnyLogged = mealsKcal > 0 || (calEntry.extraKcal || 0) > 0;

  const stepsPct = Math.min(100, Math.round(((state.stepsLog[editKey] || 0) / state.stepsTarget) * 100));

  return html`
    <div class="screen habitos">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Hábitos</h1></header>
      <p class="cue-text habitos-intro">Con entreno y comida ya cubiertos, esto es lo que más rápido puede acelerar o frenar el resultado sin cambiar nada más: cuánto te mueves fuera del circuito, cuánto duermes, y si de verdad te quedas en déficit cada día.</p>

      <div class="habit-day-nav">
        <button class="icon-btn small" onClick=${() => goToDay(-1)} aria-label="Día anterior">‹</button>
        <div class="habit-day-nav-label">
          <span class="habit-day-nav-main">${dayLabel}</span>
          ${!isToday ? html`<button class="habit-day-nav-today" onClick=${() => setEditKey(todayKey)}>Volver a hoy</button>` : null}
        </div>
        <button class="icon-btn small" onClick=${() => goToDay(1)} disabled=${isToday} aria-label="Día siguiente">›</button>
      </div>
      ${!isToday ? html`<p class="settings-hint habit-editing-past">✏️ Editando un día anterior para corregir un olvido — se guarda igual que "hoy".</p>` : null}

      <div class="habit-card">
        <div class="habit-card-header">
          <p class="settings-label" style=${{ marginBottom: 0 }}>🚶 ${isToday ? 'Pasos de hoy' : 'Pasos'}</p>
          <span class="habit-target-edit">
            objetivo <input class="habit-inline-input" type="number" value=${state.stepsTarget} onChange=${e => setStepsTarget(e.target.value)} />
          </span>
        </div>
        <input class="habit-big-input" type="number" placeholder="0" value=${steps} onChange=${e => setSteps(e.target.value)} />
        <div class="habit-progress-track"><div class="habit-progress-fill" style=${{ width: `${stepsPct}%` }}></div></div>
        <p class="settings-hint">${stepsPct}% del objetivo. Con trabajo de escritorio, esto es lo que más cambia el gasto calórico del día sin tocar el entreno — cada paseo cuenta.</p>
      </div>

      <div class="habit-card">
        <p class="settings-label">😴 ${isToday ? 'Horas dormidas anoche' : 'Horas dormidas'}</p>
        <input class="habit-big-input" type="number" step="0.5" placeholder="0" value=${sleep} onChange=${e => setSleep(e.target.value)} />
        <p class="settings-hint">
          ${sleep === '' ? 'Objetivo: 7-8h. Por debajo de 7h de forma sostenida, el déficit calórico pierde eficacia — peor regulación del hambre y más riesgo de perder músculo en vez de grasa, más aún a partir de los 55.'
            : sleep >= 7 ? '✅ En el rango recomendado (7-8h).'
            : sleep >= 6 ? '⚠️ Algo justo — inténtalo si puedes, sobre todo en fase de Intensidad.'
            : '⚠️ Por debajo de lo recomendable. Si se repite varios días, es más determinante para el resultado que cualquier ajuste de entreno o comida.'}
        </p>
      </div>

      <div class="habit-card">
        <p class="settings-label">🍽️ ${isToday ? 'Calorías de hoy' : 'Calorías'}</p>
        <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 10 }}>Marca lo que ${isToday ? 'de verdad has comido hoy' : 'de verdad se comió ese día'} — usa tu plan de nutrición como referencia rápida, no hace falta anotar gramos.</p>
        ${editPlan ? mealItems.map(m => {
          const realItems = (calEntry.realFoods && calEntry.realFoods[m.key]) || [];
          const realTotal = mealRealKcal(calEntry, m.key);
          const isOpen = openCalcMeal === m.key;
          return html`
          <div key=${m.key} class="habit-meal-block">
            <label class="habit-meal-row">
              <input type="checkbox" checked=${realItems.length > 0 ? true : !!calEntry.meals[m.key]} disabled=${realItems.length > 0} onChange=${() => toggleMeal(m.key)} />
              <span class="habit-meal-text"><strong>${m.label}:</strong> ${m.text}</span>
              <span class="habit-meal-kcal">${realTotal != null ? `${realTotal} real` : `~${m.kcal}`} · ${mealDisplayProtein(calEntry,m.key,!!calEntry.meals[m.key],m.proteinG)}g prot.<br/><small class="habit-meal-macros">${(() => { const mm=mealDisplayMacros(calEntry,m.key,!!calEntry.meals[m.key],m.planMacros); return `${mm.carbG}g C · ${mm.fatG}g G · ${mm.fiberG}g fibra`; })()}</small></span>
            </label>
            <button class="habit-meal-calc-toggle" onClick=${() => setOpenCalcMeal(isOpen ? null : m.key)}>
              ${realItems.length > 0 ? `🍽️ ${realItems.length} alimento(s) registrado(s) — ${isOpen ? 'ocultar' : 'editar'}` : `🍽️ ¿Comiste otra cosa? Calcula lo real ${isOpen ? '▲' : '▼'}`}
            </button>
            ${isOpen ? html`
              <div class="habit-meal-calc">
                ${realItems.length > 0 ? html`
                  <div class="habit-food-list">
                    ${realItems.map(rawIt => { const it = normalizeFoodItem(rawIt); return html`
                      <div key=${it.id} class="habit-food-row">
                        <div class="habit-food-row-main">
                          <span class="habit-food-name">${it.semaforo ? semaforoEmoji(it.semaforo) + ' ' : ''}${it.name}${it.foodId ? ` · ${it.amount}${it.unit === 'ud' ? (it.amount === 1 ? ' ud' : ' uds') : 'g'}` : ''}</span>
                          <button class="icon-btn small habit-food-del" onClick=${() => removeRealFood(m.key, it.id)} aria-label="Quitar">✕</button>
                        </div>
                        <span class="habit-food-kcal">${it.kcal} kcal${it.proteinG ? ` · ${it.proteinG}g prot` : ''}${(it.carbG || it.fatG || it.fiberG) ? ` · ${it.carbG || 0}g carb · ${it.fatG || 0}g grasa · ${it.fiberG || 0}g fibra` : ''}</span>
                      </div>
                    `; })}
                    <div class="habit-food-row habit-food-total"><div class="habit-food-row-main"><span>Total real</span><span class="habit-food-kcal">${realTotal} kcal</span></div><span class="habit-food-kcal">${(() => { const mm=mealDisplayMacros(calEntry,m.key,!!calEntry.meals[m.key],m.planMacros); return `${mm.carbG}g C · ${mm.fatG}g G · ${mm.fiberG}g fibra`; })()}</span></div>
                  </div>
                ` : null}
                <div class="habit-food-add-row">
                  <select value=${foodPick.foodId} onChange=${e => setFoodPick({ ...foodPick, foodId: e.target.value, manual: e.target.value === '__manual__' })}>
                    ${FOOD_DB_SORTED.map(f => html`<option key=${f.id} value=${f.id}>${semaforoEmoji(f.semaforo)} ${f.name}</option>`)}
                    <option value="__manual__">✏️ Otro alimento (kcal manual)…</option>
                  </select>
                  ${!foodPick.manual ? html`
                    ${(() => { const sf=FOOD_DB.find(f => f.id === foodPick.foodId); if (!sf) return null; return html`<div class="habit-food-selected"><span class="habit-food-selected-label">${sf.name} · valores calculados para la cantidad indicada</span><span class="habit-food-chip">${sf.unit === 'ud' ? 'por unidad' : 'por 100g'}</span><span class="habit-food-chip">${sf.proteinPerUnit != null && sf.unit === 'ud' ? sf.proteinPerUnit : (sf.proteinPer100 || 0)}g proteína</span><span class="habit-food-chip">${sf.unit === 'ud' ? (sf.carbG || 0) : (sf.carbG || 0)}g C</span><span class="habit-food-chip">${sf.unit === 'ud' ? (sf.fatG || 0) : (sf.fatG || 0)}g G</span><span class="habit-food-chip">${sf.unit === 'ud' ? (sf.fiberG || 0) : (sf.fiberG || 0)}g fibra</span></div>`; })()}
                    <input class="habit-inline-input" type="number" inputmode="decimal" min="0" placeholder=${FOOD_DB.find(f => f.id === foodPick.foodId)?.unit === 'ud' ? 'Cantidad (uds)' : 'Cantidad (g)'} value=${foodPick.amount} onChange=${e => setFoodPick({ ...foodPick, amount: e.target.value })} />
                    <button class="btn-secondary small" type="button" onClick=${e => { e.preventDefault(); e.stopPropagation(); addRealFood(m.key, foodPick.foodId, parseFloat((foodPick.amount || '').replace(',', '.'))); setFoodPick({ ...foodPick, amount: '' }); }}>Añadir</button>
                  ` : null}
                </div>
                ${!foodPick.manual && foodPick.amount && parseFloat((foodPick.amount || '').replace(',', '.')) > 0 ? (() => {
                  const previewFood = FOOD_DB.find(f => f.id === foodPick.foodId);
                  const amt = parseFloat((foodPick.amount || '').replace(',', '.'));
                  if (!previewFood || !amt) return null;
                  return html`<p class="habit-food-preview">Para ${amt}${previewFood.unit === 'ud' ? ' uds' : ' g'}: <strong>${foodKcal(previewFood, amt)} kcal</strong> · ${foodProtein(previewFood, amt)}g proteína · ${foodCarb(previewFood, amt)}g C · ${foodFat(previewFood, amt)}g G · <strong>${foodFiber(previewFood, amt)}g fibra</strong></p>`;
                })() : null}
                ${foodPick.manual ? html`
                  <div class="habit-food-add-row manual-macros" style=${{ marginTop: '6px' }}>
                    <input class="habit-inline-input" style=${{ flex: 2 }} type="text" placeholder="ej. Berenjena rellena (ración)" value=${foodPick.manualName} onChange=${e => setFoodPick({ ...foodPick, manualName: e.target.value })} />
                    <input class="habit-inline-input" type="number" placeholder="kcal" value=${foodPick.manualKcal} onChange=${e => setFoodPick({ ...foodPick, manualKcal: e.target.value })} />
                  </div>
                  <div class="habit-food-add-row manual-macros" style=${{ marginTop: '6px' }}>
                    <input class="habit-inline-input" type="number" placeholder="proteína g" value=${foodPick.manualProtein || ''} onChange=${e => setFoodPick({ ...foodPick, manualProtein: e.target.value })} />
                    <input class="habit-inline-input" type="number" placeholder="carbo g" value=${foodPick.manualCarb || ''} onChange=${e => setFoodPick({ ...foodPick, manualCarb: e.target.value })} />
                    <input class="habit-inline-input" type="number" placeholder="grasa g" value=${foodPick.manualFat || ''} onChange=${e => setFoodPick({ ...foodPick, manualFat: e.target.value })} />
                    <input class="habit-inline-input" type="number" placeholder="fibra g" value=${foodPick.manualFiber || ''} onChange=${e => setFoodPick({ ...foodPick, manualFiber: e.target.value })} />
                    <button type="button" class="btn-secondary small" onClick=${e => { e.preventDefault(); e.stopPropagation(); addManualFood(m.key, foodPick.manualName, parseFloat((foodPick.manualKcal || '').replace(',', '.')), parseFloat((foodPick.manualProtein || '').replace(',', '.')) || 0, parseFloat((foodPick.manualCarb || '').replace(',', '.')) || 0, parseFloat((foodPick.manualFat || '').replace(',', '.')) || 0, parseFloat((foodPick.manualFiber || '').replace(',', '.')) || 0); setFoodPick({ ...foodPick, manualName: '', manualKcal: '', manualProtein: '', manualCarb: '', manualFat: '', manualFiber: '' }); }}>Añadir</button>
                  </div>
                  <p class="settings-hint" style=${{ marginTop: '4px', marginBottom: 0 }}>Para platos compuestos (albóndigas con verduras, berenjena rellena…) o algo que no está en la lista: pon un nombre y las kcal totales de esa ración — de un envase, o a ojo combinando varios alimentos de la lista de arriba. La proteína es opcional: si no la sabes, déjala en blanco antes que inventarla.</p>
                ` : html`
                  <p class="settings-hint" style=${{ marginTop: '4px', marginBottom: 0 }}>Cantidad en gramos (crudo/cocido según el alimento) salvo huevo, tostada, bebidas y café, que van por unidades. Con 1+ alimento aquí, el check de arriba se desactiva y este total manda para el cálculo del día.</p>
                `}
              </div>
            ` : null}
          </div>
        `; }) : null}
        ${editPlan ? (() => {
          // Dashboard completo — GAP REAL encontrado (el usuario lo buscaba
          // aquí, en Hábitos, que es donde de verdad registra la comida
          // día a día; yo lo había puesto en la pantalla Nutrición, que no
          // es donde vive este flujo). Se mueve aquí, calculado para el
          // día que se esté editando (editKey), no fijo a "hoy" — coherente
          // con que esta pantalla ya permite navegar a días anteriores.
          const dayNutrition = getDayNutritionTotals(state, editKey);
          const dayRealMacros = dayNutrition && dayNutrition.carbTotal != null
            ? { carb: dayNutrition.carbTotal, fat: dayNutrition.fatTotal, fiber: dayNutrition.fiberTotal }
            : null;
          const dayJsDate = new Date(editKey + 'T00:00:00');
          const dayJs = dayJsDate.getDay();
          const dayIso = dayJs === 0 ? 7 : dayJs;
          const dayIsTraining = dayIso !== REST_DAY;
          const dayWaterTargetMl = computeWaterTargetMl(getCurrentWeightKg(state), dayIsTraining);
          const dayWaterMl = state.waterLog[editKey] || 0;

          </div>
        `; })() : null}
        ${editPlan ? html`

            <p class="habit-protein-text">
              ${proteinPct >= 1
                ? '¡Objetivo cubierto! Justo lo que necesitas para no perder músculo con el déficit de hoy.'

                  ? `Vas bien, pero te faltan ~${Math.round(proteinTarget - dayProteinG)}g. Una fuente más (pollo, huevo, atún, yogur…) y lo cierras.`

              : `⚠️ ${diff} kcal por encima del objetivo (${dayTargetKcal}) — no pasa nada por un día suelto, vigílalo si se repite.`}

      <div class="habit-card">

        <div class="habit-history-list">
          ${[...Array(14)].map((_, i) => {
            const key = shiftKey(todayKey, -i);
            const d = new Date(key + 'T00:00:00');
            const h = getHabitDataForDay(state, key);
            return html`
              <button key=${key} class=${`habit-history-row ${key === editKey ? 'is-active' : ''}`} onClick=${() => setEditKey(key)}>

                  <span class="habit-history-data">
                    ${h.steps != null ? `🚶 ${h.steps.toLocaleString('es-ES')}` : '🚶 —'}
                    · ${h.sleep != null ? `😴 ${h.sleep}h` : '😴 —'}

                  </span>

      <${HabitsKPIDashboard} state=${state} />

}

// Carbohidrato/grasa/fibra REALES de hoy — a diferencia de kcal/proteína
// (que ya mezclaban plan+real vía mealDisplayKcal/Protein), estos tres
// solo existían en el plan como números fijos por comida, nunca por
// alimento individual. Solo se puede calcular lo que se ha registrado
// como alimento real concreto (no las casillas de "seguí el plan") —
// limitación real, mejor mostrarla así de clara que fingir un dato que
// no se tiene.
function computeTodayRealMacros(calEntry) {
  if (!calEntry || !calEntry.realFoods) return null;
  let carb = 0, fat = 0, fiber = 0, any = false;
  Object.values(calEntry.realFoods).forEach(items => (items || []).forEach(it => {
    if (it.carbG != null) { carb += it.carbG; any = true; }
    if (it.fatG != null) { fat += it.fatG; any = true; }
    if (it.fiberG != null) { fiber += it.fiberG; any = true; }
  }));
  return any ? { carb: Math.round(carb * 10) / 10, fat: Math.round(fat * 10) / 10, fiber: Math.round(fiber * 10) / 10 } : null;
}

function Nutrition({ state, onBack, forceRender, onOpenHabitos }) {
  const jsDay = new Date().getDay();
  const todayIso = jsDay === 0 ? 7 : jsDay;
  const todayKey = localDateKey();
  const takenToday = !!state.creatineLog[todayKey];
  // Progreso real de HOY, reutilizando exactamente la misma función que ya
  // alimenta Hábitos (getHabitDataForDay) — nada nuevo que calcular dos
  // veces ni que pueda desincronizarse del dato real. Antes esta pantalla
  // solo enlazaba a Hábitos con un botón; ahora se ve de un vistazo si vas
  // bien encaminado sin necesidad de cambiar de pestaña.
  const todayData = useMemo(() => getHabitDataForDay(state, todayKey), [state.calorieLog, todayKey]);
  const todayNutrition = todayData || getDayNutritionTotals(state, todayKey);
  const todayRealMacros = todayNutrition && todayNutrition.carbTotal != null ? { carb: todayNutrition.carbTotal, fat: todayNutrition.fatTotal, fiber: todayNutrition.fiberTotal } : null;
  // Mismo criterio de "día de descanso" que ya usa el resto de la app
  // (día de calendario ISO, domingo=7) — no el contador de sesiones, que
  // es una cosa distinta (rotación de la plantilla semanal).
  const todayJsDay = new Date().getDay();
  const todayIsoDay = todayJsDay === 0 ? 7 : todayJsDay;
  const isTrainingDayToday = todayIsoDay !== REST_DAY;
  const waterTargetMl = computeWaterTargetMl(getCurrentWeightKg(state), isTrainingDayToday);
  function addWater(deltaMl) {
    const current = state.waterLog[todayKey] || 0;
    state.waterLog = { ...state.waterLog, [todayKey]: Math.max(0, current + deltaMl) };
    saveState(state);
    forceRender(x => x + 1);
  }

  function toggleCreatineToday() {
    state.creatineLog[todayKey] = !takenToday;
    saveState(state);
    forceRender(x => x + 1);
  }

  return html`
    <div class="screen nutrition">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Nutrición</h1></header>
      <p class="cue-text nutrition-intro">
        Guía orientativa diseñada para este perfil (hombre 55 años, 165cm, ~70kg) para maximizar el resultado del plan de entreno. No sustituye a un dietista-nutricionista — basada en fórmulas estándar, no en tu historial médico.
      </p>
      <p class="cue-text nutrition-intro">Deja pasar unas 3 horas entre la tostada de media mañana y la comida.</p>

      ${todayData && todayData.kcalTotal != null ? html`
        <div class="today-progress-card">

          <div class="today-progress-row">
            <div class="today-progress-item">
              <div class="today-progress-bar-track">

              </div>
              <span class="today-progress-num">${todayData.kcalTotal} <span class="today-progress-of">/ ${todayData.kcalTarget} kcal</span></span>
            </div>
            <div class="today-progress-item">
              <div class="today-progress-bar-track">
                <div class="today-progress-bar-fill protein" style=${{ width: `${Math.min(100, Math.round((todayData.proteinTotal || 0) / NUTRITION_TARGETS.proteinG * 100))}%` }} />
              </div>
              <span class="today-progress-num">${todayData.proteinTotal || 0}g <span class="today-progress-of">/ ${NUTRITION_TARGETS.proteinG}g prot</span></span>
            </div>
            ${todayRealMacros ? html`
              <div class="today-progress-item">
                <div class="today-progress-bar-track">
                  <div class="today-progress-bar-fill carb" style=${{ width: `${Math.min(100, Math.round(todayRealMacros.carb / NUTRITION_TARGETS.carbG * 100))}%` }} />
                </div>
                <span class="today-progress-num">${todayRealMacros.carb}g <span class="today-progress-of">/ ${NUTRITION_TARGETS.carbG}g carb</span></span>
              </div>
              <div class="today-progress-item">
                <div class="today-progress-bar-track">
                  <div class="today-progress-bar-fill fat" style=${{ width: `${Math.min(100, Math.round(todayRealMacros.fat / NUTRITION_TARGETS.fatG * 100))}%` }} />
                </div>
                <span class="today-progress-num">${todayRealMacros.fat}g <span class="today-progress-of">/ ${NUTRITION_TARGETS.fatG}g grasa</span></span>
              </div>
              <div class="today-progress-item">
                <div class="today-progress-bar-track">
                  <div class="today-progress-bar-fill fiber" style=${{ width: `${Math.min(100, Math.round(todayRealMacros.fiber / NUTRITION_TARGETS.fiberG * 100))}%` }} />
                </div>
                <span class="today-progress-num">${todayRealMacros.fiber}g <span class="today-progress-of">/ ${NUTRITION_TARGETS.fiberG}g fibra</span></span>
              </div>
            ` : html`<p class="settings-hint" style=${{ margin: '4px 0 0' }}>Carbohidratos, grasas y fibra usan el mismo criterio que Hábitos: la comida real registrada sustituye a esa comida del plan; si solo marcas el plan, se muestra su estimación.</p>`}
            <div class="today-progress-item">
              <div class="today-progress-bar-track">
                <div class="today-progress-bar-fill water" style=${{ width: `${Math.min(100, Math.round((state.waterLog[todayKey] || 0) / waterTargetMl * 100))}%` }} />
              </div>
              <span class="today-progress-num">${((state.waterLog[todayKey] || 0) / 1000).toFixed(2)}L <span class="today-progress-of">/ ${(waterTargetMl / 1000).toFixed(1)}L agua</span></span>
            </div>
          </div>
          <div class="water-quick-add">
            <button class="btn-secondary small" onClick=${() => addWater(250)}>+250ml</button>
            <button class="btn-secondary small" onClick=${() => addWater(500)}>+500ml</button>
            <button class="btn-secondary small" onClick=${() => addWater(-250)}>−250ml</button>
          </div>
          <button class="btn-secondary" style=${{ marginTop: 12, width: '100%' }} onClick=${onOpenHabitos}>Editar registro de hoy →</button>
        </div>
      ` : html`
        <button class="today-progress-empty" onClick=${onOpenHabitos}>Aún no has registrado nada hoy — toca para ir a Hábitos →</button>
      `}

      <div class="nutrition-targets-card">
        <p class="settings-label" style=${{ marginBottom: 10 }}>Objetivo diario</p>
        <div class="nutrition-targets-grid">
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.kcal}</span><span class="nt-label">kcal/día</span></div>

          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.fatG}g</span><span class="nt-label">grasa</span></div>
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.fiberG}g</span><span class="nt-label">fibra</span></div>
        </div>
        <p class="settings-hint" style=${{ marginTop: 10 }}>Gasto estimado ~${NUTRITION_TARGETS.tdee} kcal/día (BMR ~${NUTRITION_TARGETS.bmr} × actividad) menos un déficit de ~500 kcal — proteína en 145g/día (2,07 g/kg), en la parte alta del rango recomendado para preservar músculo en déficit, entrenando 6 días/semana. Fibra en 32g/día — saciedad real en déficit y salud digestiva, no solo "cuenta la macro".</p>
        ${todayRealMacros ? html`
          <div class="today-real-macros">
            <p class="settings-label" style=${{ marginBottom: 6, fontSize: 14 }}>Hoy — carbohidratos, grasas y fibra registrados</p>
            <div class="nutrition-targets-grid">

      <div class="creatine-card">

          <div class="nutrition-meal-row"><span class="nutrition-meal-label">Comida</span><span>${d.lunch} <span class="nutrition-item-kcal">(~${d.lunchKcal} kcal · ${d.lunchProteinG}g prot · ${planMealMacros(d.day,'lunch').carbG}g C · ${planMealMacros(d.day,'lunch').fatG}g G · ${planMealMacros(d.day,'lunch').fiberG}g fibra)</span></span></div>
