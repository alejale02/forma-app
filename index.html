<style>
:root{
  --bg:#12141A; --bg-elev:#1B1E27; --bg-elev2:#242835;
  --accent:#C8FF3D; --accent-dim:#8FBF2B;
  --text:#F4F6F8; --text-dim:#9AA0AC; --text-faint:#5C616E;
  --danger:#FF6B4A; --up:#7DD8FF;
  --radius:20px; --radius-sm:12px;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;}
h1,h2{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); padding-top:calc(24px + env(safe-area-inset-top)); animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px;}

/* ---- HOME ---- */
.home-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
.home-header h1{font-size:30px;}
.icon-btn{background:var(--bg-elev); color:var(--text); width:44px; height:44px; border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.phase-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; margin-bottom:16px; border-left:4px solid var(--phase-color);}
.phase-name{font-family:var(--font-display); font-size:24px; color:var(--phase-color); margin-bottom:6px;}
.phase-desc{color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:16px;}
.phase-progress{display:flex; gap:5px; margin-bottom:8px;}
.dot{width:100%; height:6px; border-radius:3px; background:var(--bg-elev2);}
.dot.filled{background:var(--phase-color);}
.phase-progress-label{font-size:12px; color:var(--text-faint);}

.cycle-track{display:flex; gap:8px; margin-bottom:20px;}
.cycle-step{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--bg-elev); opacity:0.45;}
.cycle-step.active{opacity:1; background:var(--bg-elev2); outline:1.5px solid var(--accent);}
.cycle-step.done{opacity:0.7;}
.cycle-num{display:block; font-family:var(--font-display); font-size:16px;}
.cycle-label{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.btn-primary{background:var(--accent); color:#0C0D10; font-weight:800; border-radius:var(--radius-sm); padding:16px; font-size:16px;}
.btn-primary:disabled{opacity:0.35;}
.btn-huge{width:100%; padding:20px; font-size:17px; border-radius:16px; margin:8px 0;}
.btn-secondary{background:var(--bg-elev2); color:var(--text); border-radius:var(--radius-sm); padding:16px; font-size:15px; font-weight:600;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); border-radius:var(--radius-sm); padding:14px 20px; font-weight:700; width:100%;}

.stat-row{display:flex; gap:10px; margin:16px 0;}
.stat-box{flex:1; background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; text-align:center;}
.stat-num{font-family:var(--font-display); font-size:26px; color:var(--accent);}
.stat-label{font-size:11px; color:var(--text-dim); margin-top:2px;}

.link-btn{background:none; color:var(--text-dim); text-align:center; padding:10px; font-size:14px; text-decoration:underline; text-underline-offset:3px;}

/* ---- ROUND SELECTOR ---- */
.rounds-block{background:var(--bg-elev); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
.rounds-label{font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
.rounds-picker{display:flex; gap:8px;}
.round-btn{flex:1; padding:12px; border-radius:12px; background:var(--bg-elev2); color:var(--text); font-weight:800; text-align:center;}
.round-btn .rn{display:block; font-family:var(--font-display); font-size:20px;}
.round-btn .rl{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; margin-top:2px;}
.round-btn.active{background:var(--accent); }
.round-btn.active .rn,.round-btn.active .rl{color:#0C0D10;}
.rounds-hint{font-size:11.5px; color:var(--text-faint); margin-top:10px; line-height:1.4;}
.time-estimate{font-size:13px; color:var(--text); background:var(--bg-elev2); border-radius:10px; padding:10px 12px; margin-top:10px;}
.time-estimate strong{color:var(--accent);}

/* ---- TODAY PREVIEW / REST DAY ---- */
.today-preview{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:6px;}
.today-title{font-weight:800; font-size:15px; margin-bottom:12px;}
.today-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.today-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--bg-elev2); gap:10px;}
.today-row:last-child{border-bottom:none;}
.today-ex-name{font-size:14px; flex:1;}
.today-ex-detail{font-size:12.5px; color:var(--accent); font-weight:700; white-space:nowrap;}
.rest-day-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; text-align:center;}
.rest-day-title{font-family:var(--font-display); font-size:20px; margin-bottom:10px; color:var(--up);}

/* ---- WEEKLY PLAN ---- */
.weekplan-intro{text-align:left; max-width:none; margin-bottom:18px;}
.weekplan-day{background:var(--bg-elev); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}
.weekplan-day.is-today{outline:1.5px solid var(--accent);}
.weekplan-day-header{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.weekplan-day-name{font-family:var(--font-display); font-size:15px;}
.weekplan-day-focus{font-size:12px; color:var(--text-dim);}
.weekplan-today-badge{margin-left:auto; background:var(--accent); color:#0C0D10; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.weekplan-ex-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--bg-elev2); font-size:13px;}
.weekplan-ex-row:first-of-type{border-top:none;}
.weekplan-ex-name{flex:1;}
.weekplan-ex-detail{color:var(--text-dim); white-space:nowrap; font-weight:600;}
.rest-summary{opacity:0.6;}

/* ---- WORK / REST / LOGGING / HYPO shared ---- */
.hypo,.work,.rest,.logging,.roundrest{align-items:center; text-align:center; justify-content:center;}
.mobility-ring{position:relative; width:186px; height:216px; margin:16px 0;}
.ring-svg{width:100%; height:100%; transform:rotate(-90deg); position:absolute; inset:0;}
.ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:5;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:339.3; transition:stroke-dashoffset 1s linear;}
.ring-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--accent);}

h2{font-size:23px; margin:8px 0;}
.cue-text{color:var(--text-dim); font-size:15px; line-height:1.5; max-width:340px; margin:0 auto 12px;}
.timer-big{font-family:var(--font-display); font-size:52px; margin:12px 0; letter-spacing:-0.02em;}
.rest-timer{color:var(--up);}
.rest-next{color:var(--text); font-size:15px; font-weight:700; margin-bottom:2px;}
.rest-next-detail{color:var(--accent); font-size:13px; font-weight:700; margin-bottom:24px;}
.roundrest .timer-big{color:var(--danger);}
.roundrest-badge{background:rgba(255,107,74,0.15); color:var(--danger); font-size:12px; font-weight:800; padding:6px 14px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em;}

.mobility-controls{display:flex; gap:10px; width:100%; margin-top:16px;}
.mobility-controls .btn-secondary,.mobility-controls .btn-primary{flex:1; margin:0;}
.mobility-dots{display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
.mdot{width:8px; height:8px; border-radius:50%; background:var(--bg-elev2);}
.mdot.active{background:var(--accent); width:22px; border-radius:4px;}
.mdot.done{background:var(--accent-dim);}

.figure-wrap{position:relative; width:180px; height:210px; margin:8px 0; display:flex; align-items:center; justify-content:center;}
.figure-wrap svg{width:100%; height:100%;}
.photo-wrap{position:relative; margin:8px auto; border-radius:16px; overflow:hidden; background:#000;}
.photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}

/* ---- STORYBOARD "Ejercicios de hoy" ---- */
.today-cards-title{font-weight:800; font-size:15px; margin:22px 0 12px;}
.today-card{background:var(--bg-elev); border-radius:var(--radius); padding:14px; margin-bottom:14px; display:flex; gap:12px;}
.today-card-num{font-family:var(--font-display); font-size:22px; color:var(--accent); width:26px; flex-shrink:0;}
.today-card-body{flex:1; min-width:0;}
.today-card-name{font-weight:800; font-size:15px; margin-bottom:4px;}
.today-card-meta{font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:2px;}
.today-card-group{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;}
.today-card-frames{display:flex; align-items:center; gap:2px;}
.today-frame{flex:1; min-width:0; background:radial-gradient(circle at 50% 38%, var(--bg-elev2) 0%, var(--bg) 100%); border-radius:12px; padding:6px 2px 8px; text-align:center;}
.today-frame .figure-wrap{width:100% !important; height:104px !important; margin:0 auto;}
.today-frame-cap{font-size:10px; color:var(--text-dim); margin-top:2px; line-height:1.25; font-weight:600;}
.today-frame-arrow{color:var(--text-faint); font-size:15px; flex-shrink:0; width:12px;}
.today-card-body .photo-wrap{width:100% !important; height:160px !important; margin:2px 0 0;}

/* ---- AUTO-CONFIRM de repeticiones (sin toques obligatorios) ---- */
.confirm-ring{position:relative; width:76px; height:76px; margin:6px auto 18px;}
.confirm-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.confirm-ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:6;}
.confirm-ring-fg{fill:none; stroke:var(--up); stroke-width:6; stroke-linecap:round; stroke-dasharray:219.9; transition:stroke-dashoffset 1s linear;}
.confirm-ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; color:var(--up);}
.confirm-reps-row{display:flex; align-items:center; gap:18px; margin:10px 0 6px;}
.confirm-adj-btn{width:56px; height:56px; border-radius:50%; background:var(--bg-elev2); color:var(--text); font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.confirm-reps-num{font-family:var(--font-display); font-size:56px; color:var(--accent); min-width:90px; text-align:center;}
.confirm-hint{font-size:12px; color:var(--text-faint); margin-bottom:8px;}
.auto-note{font-size:11.5px; color:var(--text-faint); margin-top:14px;}
.session-controls{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:5; display:flex; justify-content:space-between;}
.pause-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text-dim); font-size:15px; display:flex; align-items:center; justify-content:center;}
.pause-btn.active{background:var(--accent); color:#0C0D10;}
.end-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--danger); font-size:15px; display:flex; align-items:center; justify-content:center;}

/* ---- Selector de ritmo (Settings) ---- */
.pace-picker{display:flex; gap:8px;}
.pace-btn{flex:1; padding:12px 6px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700; font-size:13px; text-align:center;}
.pace-btn.active{background:var(--accent); color:#0C0D10;}
.sync-code-row{display:flex; align-items:center; gap:8px; background:var(--bg-elev2); border-radius:10px; padding:10px 12px;}
.sync-code{flex:1; font-family:var(--font-mono, monospace); font-size:12px; color:var(--accent); word-break:break-all;}
.sync-copy-btn{flex-shrink:0; padding:8px 12px; font-size:12.5px;}
.sync-link-row{display:flex; gap:8px; margin-top:6px;}
.sync-code-input{flex:1; background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13px;}
.sync-msg{font-size:12.5px; margin-top:8px;}
.sync-ok{color:var(--up);}
.sync-err{color:var(--danger);}
.circuit-progress{display:flex; gap:6px; margin:2px 0 4px; justify-content:center;}
.circuit-dot{width:26px; height:5px; border-radius:3px; background:var(--bg-elev2);}
.circuit-dot.done{background:var(--accent);}
.circuit-dot.current{background:var(--up);}
.round-badge{display:inline-block; background:var(--bg-elev2); color:var(--text-dim); font-size:11px; font-weight:800; padding:5px 12px; border-radius:20px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.03em;}
.target-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0 8px;}
.chip{background:var(--bg-elev); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; color:var(--text-dim);}
.chip-emphasis{background:var(--accent); color:#0C0D10; font-weight:800;}
.exercise-cue{color:var(--text-dim); font-size:13.5px; line-height:1.5; max-width:320px; margin:4px auto 8px; background:var(--bg-elev); padding:12px 14px; border-radius:var(--radius-sm);}
.level-hint{color:var(--text-faint); font-size:12px; margin-top:12px;}

.reps-input{width:140px; font-family:var(--font-display); font-size:48px; text-align:center; background:var(--bg-elev); color:var(--accent); border:2px solid var(--bg-elev2); border-radius:var(--radius-sm); padding:12px; margin:12px 0 4px;}
.reps-input:focus{outline:none; border-color:var(--accent);}
.target-hint{color:var(--text-faint); font-size:13px; margin-bottom:20px;}
.rpe-label{font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:600;}
.rpe-scale{display:flex; gap:6px; margin-bottom:6px;}
.rpe-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text); font-weight:700; font-size:14px;}
.rpe-btn.active{background:var(--accent); color:#0C0D10;}
.rpe-legend{display:flex; justify-content:space-between; width:100%; max-width:290px; font-size:10px; color:var(--text-faint); margin-bottom:20px; text-transform:uppercase; letter-spacing:0.05em;}

/* ---- SUMMARY ---- */
.summary h1{font-size:28px; margin-bottom:20px;}
.summary-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; text-align:left;}
.summary-title{font-weight:700; font-size:14px; margin-bottom:10px; color:var(--text-dim);}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--bg-elev2);}
.summary-row:first-of-type{border-top:none;}
.badge{font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge-up{background:rgba(200,255,61,0.15); color:var(--accent);}
.badge-down{background:rgba(255,107,74,0.15); color:var(--danger);}

/* ---- PROGRESS ---- */
.sub-header{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.sub-header h1{font-size:22px;}
.progress-group{margin-bottom:20px;}
.group-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;}
.level-track-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bg-elev);}
.level-track-name{font-size:14px;}
.level-track{display:flex; gap:4px;}
.level-pip{width:14px; height:6px; border-radius:3px; background:var(--bg-elev2);}
.level-pip.filled{background:var(--accent);}
.history-list{margin-top:8px;}
.history-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--bg-elev); font-size:13px;}
.history-date{color:var(--text-faint);}

/* ---- SETTINGS ---- */
.settings-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:18px; margin-bottom:14px;}
.settings-label{font-weight:700; font-size:14px; margin-bottom:12px;}
.week-picker{display:flex; gap:8px; margin-bottom:10px;}
.week-btn{flex:1; padding:12px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700;}
.week-btn.active{background:var(--accent); color:#0C0D10;}
.settings-hint{font-size:12px; color:var(--text-faint); line-height:1.5; margin-top:6px;}
.settings-toggle-row{display:flex; justify-content:space-between; align-items:center;}
.switch{width:46px; height:26px; border-radius:20px; background:var(--bg-elev2); position:relative; flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch-knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--text); transition:transform .15s ease;}
.switch.on .switch-knob{transform:translateX(20px); background:#0C0D10;}

@media (prefers-reduced-motion: reduce){
  .figure-wrap svg{animation:none !important;}
}
</style>

<script type="importmap">
{

    "react": "https://esm.sh/react@18.3.1",

<script type="module">
import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
const h = React.createElement;
const html = htm.bind(h);

// =====================================================================
// SOUND — Web Audio API, síntesis pura (offline, sin ficheros)
// Nota iOS: si el interruptor físico de silencio está activado, Safari
// silencia el audio de las páginas web (incluida esta instalada como app).
// Es una restricción del sistema operativo, no de la aplicación.
// =====================================================================
const Sound = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, duration, opts = {}) {
    const { type = 'sine', gain = 0.18, delay = 0 } = opts;
    const c = getCtx();
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + duration);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + duration + 0.02);
  }
  return {
    unlock() { try { getCtx(); } catch (e) {} },
    playSetStart() { tone(520, 0.09, { type: 'triangle', gain: 0.2 }); tone(780, 0.11, { type: 'triangle', gain: 0.16, delay: 0.09 }); },
    playSetEnd() { tone(660, 0.12, { gain: 0.18 }); tone(440, 0.16, { gain: 0.15, delay: 0.1 }); },
    playCountdownBeep(isLast) { tone(isLast ? 880 : 600, isLast ? 0.22 : 0.09, { type: 'square', gain: isLast ? 0.22 : 0.14 }); },
    playRestEnd() { tone(700, 0.09, { type: 'triangle', gain: 0.2 }); tone(1000, 0.14, { type: 'triangle', gain: 0.18, delay: 0.1 }); },
    playRoundEnd() { tone(392, 0.14, { type: 'sawtooth', gain: 0.14 }); tone(523, 0.16, { type: 'sawtooth', gain: 0.16, delay: 0.12 }); },
    playExerciseComplete() { tone(523, 0.1, { gain: 0.16 }); tone(659, 0.1, { gain: 0.16, delay: 0.1 }); tone(784, 0.18, { gain: 0.18, delay: 0.2 }); },

// ENGINE — nivel inicial avanzado (3/5), progresión reps+RPE, circuito
// =====================================================================
const STORAGE_KEY = 'forma55_state_v4';
const DEFAULT_LEVEL = 3;

function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { startDate: new Date().toISOString().slice(0, 10), cycleWeek: 1, totalSessionsDone: 0, roundsPerDay: 2, pace: 'normal', syncCode: null, exerciseLevels: {}, history: [], sessionLog: [] };
}

// =====================================================================
// SINCRONIZACIÓN ENTRE DISPOSITIVOS — vía jsonblob.com (almacenamiento
// JSON público, sin cuenta ni clave). Cada perfil tiene un "código" que
// es el ID del blob; guardar hace PUT a ese blob, y en otro dispositivo
// se introduce el mismo código para traer (GET) ese progreso. Si un
// código no se usa en 75 días el servicio lo borra automáticamente.
// =====================================================================
const SYNC_API = 'https://jsonblob.com/api/jsonBlob';
let syncTimer = null;
let syncing = false;

async function syncCreate(state) {
  try {
    const res = await fetch(SYNC_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
    const loc = res.headers.get('Location') || '';
    const id = loc.split('/').pop();
    if (id) { state.syncCode = id; saveState(state); }
  } catch (e) { /* sin conexión: se reintenta en el próximo cambio */ }
}
function syncPush(state) {
  if (!state.syncCode) { syncCreate(state); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try { await fetch(`${SYNC_API}/${state.syncCode}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) }); } catch (e) {}
  }, 1200);
}
async function syncPull(code) {
  const res = await fetch(`${SYNC_API}/${code.trim()}`);
  if (!res.ok) throw new Error('Código no encontrado');
  const remote = await res.json();
  remote.syncCode = code.trim();
  saveState(remote);
  return remote;
}

function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); if (!syncing) syncPush(state); }
function getExerciseLevel(state, exerciseId, defaultLevel) {
  const rec = state.exerciseLevels[exerciseId];
  return rec ? rec.level : (defaultLevel != null ? defaultLevel : DEFAULT_LEVEL);
}
function getVolumeBonus(state, exerciseId) { const rec = state.exerciseLevels[exerciseId]; return rec ? (rec.volumeBonus || 0) : 0; }
function getFamilyLevel(state, prefix) {
  for (const [exId, rec] of Object.entries(state.exerciseLevels)) { if (exId.split('_')[0] === prefix) return rec.level; }
  return DEFAULT_LEVEL;
}
function findVariantByLevel(baseGroupId, targetLevel) {
  const family = EXERCISES.filter(e => e.id.split('_')[0] === baseGroupId);
  if (!family.length) return null;
  family.sort((a, b) => a.level - b.level);
  let best = family[0];
  for (const e of family) { if (e.level <= targetLevel) best = e; }
  return best;
}
function computeTargetReps(exercise, phaseKey, state) {
  const phase = PHASES[phaseKey];
  const volBonus = getVolumeBonus(state, exercise.id);
  return Math.round(exercise.baseReps * phase.repsMult) + volBonus * 2;
}
function computeTargetSeries(exercise, phaseKey) {
  const phase = PHASES[phaseKey];
  return Math.max(2, Math.round(exercise.baseSeries * phase.seriesMult));
}
// ---- Temporización automática de la serie (para que la app avance sola) ----
const PACE_MULT = { lento: 1.28, normal: 1.0, rapido: 0.82 };
function secondsPerRep(tempo) {
  if (tempo === 'iso') return null;
  return Math.max(1.4, tempo.split('-').reduce((sum, p) => sum + (p.trim().toUpperCase() === 'X' ? 0.4 : (parseFloat(p) || 1)), 0));
}
function computeWorkSeconds(exercise, pace) {
  const mult = PACE_MULT[pace] || 1.0;
  if (exercise.isTimeBased) return exercise.targetReps; // ya es un tiempo objetivo real, no se escala por ritmo
  return Math.max(6, Math.round(exercise.targetReps * secondsPerRep(exercise.tempo) * mult));
}
// ---- RPE automático a partir de las reps confirmadas vs. objetivo (sin escala táctil) ----
// Tiempo total estimado del día: N vueltas del circuito (trabajo + confirmación
// de reps + descansos, incluido el descanso entre vueltas) + bloque hipopresivo
// final. Usa exactamente la misma lógica que la sesión real (computeWorkSeconds,
// CONFIRM_SECONDS, restSec de la fase), así que es una previsión fiel, no una
// media genérica.
function estimateDaySeconds(session, rounds, pace) {
  const perExercise = session.exercises.reduce((sum, ex) => sum + computeWorkSeconds(ex, pace) + CONFIRM_SECONDS + ex.restSec, 0);
  const roundTransition = session.exercises.length ? Math.round(session.exercises[0].restSec * 1.8) : 0;
  const circuitsSeconds = perExercise * rounds + roundTransition * Math.max(0, rounds - 1);
  const hypoSeconds = HYPOPRESSIVE_BLOCK.reduce((sum, s) => sum + s.duration, 0);
  return circuitsSeconds + hypoSeconds;
}
function fmtMinutes(totalSeconds) { return Math.round(totalSeconds / 60); }

function estimateRpe(actualReps, targetReps, phaseKey) {
  const base = { 1: 7, 2: 7.5, 3: 8.5, 4: 6 }[phaseKey] || 7;
  const ratio = targetReps > 0 ? actualReps / targetReps : 1;
  let rpe = base;
  if (ratio >= 1.15) rpe = base - 1.5;
  else if (ratio >= 1.0) rpe = base - 0.5;
  else if (ratio >= 0.9) rpe = base;
  else if (ratio >= 0.75) rpe = base + 1;
  else rpe = base + 2;
  return Math.max(3, Math.min(10, Math.round(rpe)));
}
function applyResult(state, exercise, setsDone, phaseKey) {
  const targetReps = computeTargetReps(exercise, phaseKey, state);
  const avgReps = setsDone.reduce((s, x) => s + x.reps, 0) / setsDone.length;
  const avgRpe = setsDone.reduce((s, x) => s + x.rpe, 0) / setsDone.length;
  const levelBefore = getExerciseLevel(state, exercise.id, exercise.level);
  const volBefore = getVolumeBonus(state, exercise.id);
  let levelAfter = levelBefore, volAfter = volBefore;
  const pctOfTarget = avgReps / targetReps;
  const familyPrefix = exercise.id.split('_')[0];
  if (pctOfTarget >= 1.0 && avgRpe <= 7) {
    const nextVariant = findVariantByLevel(familyPrefix, levelBefore + 1);
    if (nextVariant && nextVariant.level > levelBefore) { levelAfter = nextVariant.level; volAfter = 0; }
    else { volAfter = volBefore + 1; }
  } else if (pctOfTarget < 0.75 || avgRpe >= 9) {
    const prevVariant = findVariantByLevel(familyPrefix, levelBefore - 1);
    if (prevVariant && prevVariant.level < levelBefore) levelAfter = prevVariant.level;
    volAfter = 0;
  } else { volAfter = volBefore + 1; }
  state.exerciseLevels[exercise.id] = { level: levelAfter, volumeBonus: volAfter };
  state.history.push({ date: new Date().toISOString(), phase: phaseKey, exerciseId: exercise.id, setsDone, levelBefore, levelAfter });
  saveState(state);
  return { levelBefore, levelAfter, progressed: levelAfter > levelBefore, regressed: levelAfter < levelBefore };
}
function pickExercisesForTemplate(state, template) {
  const picked = []; const groups = template.groups; let gi = 0; const usedIds = new Set(); let guard = 0;
  while (picked.length < EXERCISES_PER_SESSION && guard < 40) {
    guard++;
    const group = groups[gi % groups.length];
    const candidates = EXERCISES.filter(e => e.group === group && !usedIds.has(e.id.split('_')[0]));
    if (candidates.length) {
      const familyPrefixes = [...new Set(candidates.map(e => e.id.split('_')[0]))];
      const prefix = familyPrefixes[picked.length % familyPrefixes.length];
      const effectiveLevel = getFamilyLevel(state, prefix);
      const variant = findVariantByLevel(prefix, effectiveLevel) || candidates[0];
      picked.push(variant); usedIds.add(prefix);
    }
    gi++;
  }
  return picked;
}
function generateSession(state) {
  const jsDay = new Date().getDay(); const isoDay = jsDay === 0 ? 7 : jsDay;
  let template = WEEKLY_TEMPLATE.find(t => t.day === isoDay);
  if (!template) template = WEEKLY_TEMPLATE[state.totalSessionsDone % WEEKLY_TEMPLATE.length];
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  const picked = pickExercisesForTemplate(state, template);
  const exercisesWithTargets = picked.map(ex => ({ ...ex, targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: phase.restSec }));
  return { templateName: template.name, phaseKey, phase, exercises: exercisesWithTargets };
}
function getWeeklyPlan(state) {
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  return WEEKLY_TEMPLATE.map(template => {
    const picked = pickExercisesForTemplate(state, template);
    return { day: template.day, name: template.name, exercises: picked.map(ex => ({ ...ex, targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: phase.restSec })) };
  });
}
function completeSession(state, roundsCompleted) {
  state.totalSessionsDone += 1;
  state.sessionLog.push({ date: new Date().toISOString(), rounds: roundsCompleted, phase: state.cycleWeek });
  if (state.totalSessionsDone % 6 === 0) state.cycleWeek = state.cycleWeek >= 4 ? 1 : state.cycleWeek + 1;
  saveState(state);
}

function fkPoint(ox, oy, len1, a1, len2, a2) {
  const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180;
  const mx = ox + len1 * Math.sin(r1), my = oy + len1 * Math.cos(r1);
  const ex = mx + len2 * Math.sin(r2), ey = my + len2 * Math.cos(r2);
  return { mx, my, ex, ey };
}
function lerp(a, b, t) { return a + (b - a) * t; }
function pairL(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }

function useFigureLoop(period, active) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) % period) / period), 55);
    return () => clearInterval(id);
  }, [period, active]);
  return t;
}
function triWave(t) { return t < 0.5 ? t * 2 : (1 - t) * 2; }

function useFlip(period) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setOn(o => !o), period);
    return () => clearInterval(id);
  }, [period]);
  return on;
}

// silueta animada por FK como respaldo (nunca se rompe la pantalla ni

function ExerciseVisual({ exId, iconKey, size = 150 }) {
  const photoId = EXERCISE_TO_PHOTO[exId];
  const [broken, setBroken] = useState(false);
  const flip = useFlip(750);
  if (!photoId || broken) return html`<${Figure} iconKey=${iconKey} size=${size} />`;
  return html`
    <div class="photo-wrap" style=${{ width: size, height: size }}>
      <img src=${`${PHOTO_BASE}${photoId}/${flip ? 1 : 0}.jpg`} alt="" onError=${() => setBroken(true)} />
    </div>
  `;
}

function Figure({ iconKey, size = 140, phase, vivid = true }) {
  const poseKey = ICON_TO_POSE[iconKey] || 'vacuum';
  const t = useFigureLoop(1450, phase == null);
  const p = phase != null ? phase : triWave(t);
  const svg = buildFigureMarkup(poseKey, p, vivid);
  return html`<div class="figure-wrap" style=${{ width: size, height: size * 1.25 }}>
    <svg viewBox="0 0 120 150" style=${{ width: '100%', height: '100%' }} dangerouslySetInnerHTML=${{ __html: svg }} />
  </div>`;
}

// Construye el SVG completo (torso + cabeza + 2 brazos + 2 piernas) por FK real,
// con gradientes de volumen, articulaciones redondeadas, manos/pies y sombra
// de suelo para una lectura mucho más realista del movimiento.
function buildFigureMarkup(poseKey, phase, vivid) {
  const cfg = FIG_POSES[poseKey] || FIG_POSES.vacuum;
  const A = cfg.A, B = cfg.B;
  const torso = lerp(A.torso, B.torso, phase), dy = lerp(A.dy, B.dy, phase);
  const legL = pairL(A.legL, B.legL, phase), legR = pairL(A.legR, B.legR, phase);
  const armL = pairL(A.armL, B.armL, phase), armR = pairL(A.armR, B.armR, phase);
  const orient = A.orient || 0;
  const { hipY, shY, headR, thigh, shin, uarm, farm, hipDx, shDx } = FIG;
  const torsoLen = hipY - shY;
  const lLeg = fkPoint(0, 0, thigh, legL[0], shin, legL[1]);
  const rLeg = fkPoint(0, 0, thigh, legR[0], shin, legR[1]);
  const lArm = fkPoint(0, 0, uarm, armL[0], farm, armL[1]);
  const rArm = fkPoint(0, 0, uarm, armR[0], farm, armR[1]);
  const bodyC = vivid ? 'url(#gBody)' : 'var(--text-dim)';
  const armC = vivid ? 'url(#gArm)' : 'var(--text-dim)';
  const legC = vivid ? 'url(#gLeg)' : 'var(--text-dim)';
  const belly = poseKey === 'vacuum' ? `<ellipse cx="0" cy="${-torsoLen * 0.42}" rx="${lerp(14, 7, triWave((phase + 0.5) % 1))}" ry="9" fill="var(--bg)" opacity="0.6"/>` : '';
  const lFootAng = legL[0] + legL[1], rFootAng = legR[0] + legR[1];
  const defs = `
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.body}"/><stop offset="100%" stop-color="${COL.bodyDark}"/>
      </linearGradient>
      <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${COL.arm}"/><stop offset="100%" stop-color="${COL.armDark}"/>
      </linearGradient>
      <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.leg}"/><stop offset="100%" stop-color="${COL.legDark}"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  const shadow = `<ellipse cx="60" cy="132" rx="${orient !== 0 ? 40 : 26}" ry="7" fill="url(#gShadow)"/>`;
  return `
    ${defs}
    ${shadow}
    <g transform="translate(60 ${hipY + dy}) rotate(${orient} 0 ${-dy})">
      <line x1="${-hipDx}" y1="0" x2="${lLeg.mx}" y2="${lLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${lLeg.mx - hipDx}" y1="${lLeg.my}" x2="${lLeg.ex - hipDx}" y2="${lLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${lLeg.mx - hipDx * 0.5}" cy="${lLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${lLeg.ex - hipDx + 6 * Math.sin(lFootAng * Math.PI / 180)}" cy="${lLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${lFootAng * 0.4} ${lLeg.ex - hipDx} ${lLeg.ey})"/>
      <line x1="${hipDx}" y1="0" x2="${rLeg.mx}" y2="${rLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${rLeg.mx + hipDx}" y1="${rLeg.my}" x2="${rLeg.ex + hipDx}" y2="${rLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${rLeg.mx + hipDx * 0.5}" cy="${rLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${rLeg.ex + hipDx + 6 * Math.sin(rFootAng * Math.PI / 180)}" cy="${rLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${rFootAng * 0.4} ${rLeg.ex + hipDx} ${rLeg.ey})"/>
      <g transform="rotate(${torso})">
        <rect x="-6" y="${-torsoLen - 8}" width="12" height="12" rx="5" fill="${bodyC}"/>
        <path d="M -21,${-torsoLen + 2} Q -22,${-torsoLen - 6} -12,${-torsoLen - 9} Q 0,${-torsoLen - 12} 12,${-torsoLen - 9} Q 22,${-torsoLen - 6} 21,${-torsoLen + 2} L 14,-6 Q 15,4 8,10 L -8,10 Q -15,4 -14,-6 Z" fill="${bodyC}"/>
        <path d="M -13,${-torsoLen + 10} Q 0,${-torsoLen + 4} 13,${-torsoLen + 10} L 13,${-torsoLen + 22} Q 0,${-torsoLen + 16} -13,${-torsoLen + 22} Z" fill="#000" opacity="0.08"/>
        <circle cx="0" cy="${-torsoLen - headR - 10}" r="${headR}" fill="${bodyC}"/>
        <path d="M ${-headR + 1},${-torsoLen - headR - 15} Q 0,${-torsoLen - headR - 24} ${headR - 1},${-torsoLen - headR - 15} Q ${headR - 1},${-torsoLen - headR - 20} 0,${-torsoLen - headR - 19} Q ${-headR + 1},${-torsoLen - headR - 20} ${-headR + 1},${-torsoLen - headR - 15} Z" fill="#000" opacity="0.16"/>
        ${belly}
        <line x1="${-shDx}" y1="${-torsoLen}" x2="${lArm.mx - shDx}" y2="${lArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${lArm.mx - shDx}" cy="${lArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${lArm.mx - shDx}" y1="${lArm.my - torsoLen}" x2="${lArm.ex - shDx}" y2="${lArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${lArm.ex - shDx}" cy="${lArm.ey - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${shDx}" y1="${-torsoLen}" x2="${rArm.mx + shDx}" y2="${rArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${rArm.mx + shDx}" cy="${rArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${rArm.mx + shDx}" y1="${rArm.my - torsoLen}" x2="${rArm.ex + shDx}" y2="${rArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${rArm.ex + shDx}" cy="${rArm.ey - torsoLen}" r="6" fill="${armC}"/>
      </g>
    </g>`;
}

function fmtTime(s) { const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec.toString().padStart(2, '0')}`; }
function useCountdown(initial, onComplete, running) {
  const [remaining, setRemaining] = useState(initial);
  const cb = useRef(onComplete); cb.current = onComplete;
  useEffect(() => { setRemaining(initial); }, [initial]);
  useEffect(() => {
    if (!running) return;
    if (remaining <= 0) { cb.current && cb.current(); return; }
    const t = setTimeout(() => setRemaining(r => r - 1), 1000);
    return () => clearTimeout(t);
  }, [remaining, running]);
  return [remaining, setRemaining];
}

function Home({ state, onStart, onOpenProgress, onOpenSettings, onOpenWeekPlan, todaySession, onSetRounds }) {

// =====================================================================
// PANTALLA: CIRCUITO (rondas de 5 ejercicios, con descanso entre rondas)
// =====================================================================
// Flujo 100% automático: trabajo (temporizado según objetivo+tempo) → confirmación
// de reps de 5s (ajustable con ±, si no se toca nada se autorregistra el objetivo)
// → descanso → siguiente ejercicio/vuelta, todo encadenado sin necesidad de tocar
// la pantalla. El botón de pausa es la única acción que corta la cadena.
const CONFIRM_SECONDS = 10;

function TrainingSession({ session, state, rounds, onFinishCircuit, onExit }) {
  const [roundIdx, setRoundIdx] = useState(0);
  const [exIdx, setExIdx] = useState(0);
  const [phase, setPhase] = useState('work'); // work | confirm | rest | roundrest
  const [setsLog, setSetsLog] = useState({});
  const [confirmReps, setConfirmReps] = useState(0);
  const [paused, setPaused] = useState(false);

  const ex = session.exercises[exIdx];
  const isLastExInRound = exIdx === session.exercises.length - 1;
  const isLastRound = roundIdx === rounds - 1;
  const pace = state.pace || 'normal';

  function finalizeCircuit() {
    playIfOn(Sound.playSessionComplete);
    const results = [];
    session.exercises.forEach(e => {
      const doneSets = setsLog[e.id] || [];
      if (doneSets.length) results.push({ exercise: e, ...applyResult(state, e, doneSets, session.phaseKey) });
    });
    completeSession(state, rounds);
    onFinishCircuit(results);
  }

  function commitSet(finalReps) {
    playIfOn(Sound.playAutoLogged);
    const rpe = estimateRpe(finalReps, ex.targetReps, session.phaseKey);
    setSetsLog(prev => ({ ...prev, [ex.id]: [...(prev[ex.id] || []), { reps: finalReps, rpe }] }));
    setPhase('rest');
  }

  // --- Temporizador de TRABAJO (auto): cuenta el tiempo estimado de la serie ---
  const workSeconds = computeWorkSeconds(ex, pace);
  const [workRemaining, setWorkRemaining] = useCountdown(workSeconds, () => {
    setConfirmReps(ex.targetReps);
    setPhase('confirm');
  }, phase === 'work' && !paused);
  useEffect(() => { if (phase === 'work') { setWorkRemaining(workSeconds); playIfOn(Sound.playWorkStart); } }, [phase, roundIdx, exIdx]);

  // --- Confirmación de reps (auto a los 5s, ajustable con ± mientras tanto) ---
  const [confirmRemaining, setConfirmRemaining] = useCountdown(CONFIRM_SECONDS, () => { commitSet(confirmReps); }, phase === 'confirm' && !paused);
  useEffect(() => { if (phase === 'confirm') { setConfirmRemaining(CONFIRM_SECONDS); playIfOn(Sound.playConfirmOpen); } }, [phase, roundIdx, exIdx]);

  // --- Descansos (entre series/ejercicios y entre vueltas) ---
  const restDuration = phase === 'roundrest' ? Math.round(ex.restSec * 1.8) : ex.restSec;
  const [restRemaining, setRestRemaining] = useCountdown(restDuration, () => {
    if (phase === 'roundrest') {
      playIfOn(Sound.playRestEnd);
      setRoundIdx(r => r + 1); setExIdx(0); setPhase('work');
      return;
    }
    playIfOn(Sound.playRestEnd);
    if (isLastExInRound) {
      if (isLastRound) finalizeCircuit();
      else { playIfOn(Sound.playRoundEnd); setPhase('roundrest'); }
    } else {
      setExIdx(i => i + 1); setPhase('work');
    }
  }, (phase === 'rest' || phase === 'roundrest') && !paused);

  const lastBeepedRef = useRef(null);
  useEffect(() => {
    if (phase !== 'rest' && phase !== 'roundrest') return;
    if (restRemaining <= 3 && restRemaining > 0 && lastBeepedRef.current !== restRemaining) {
      lastBeepedRef.current = restRemaining;
      playIfOn(() => Sound.playCountdownBeep(restRemaining === 1));
    }
  }, [phase, restRemaining]);

  const PauseBtn = html`
    <div class="session-controls">
      <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el progreso de esta vuelta sin registrar.')) onExit(); }} aria-label="Volver al inicio">←</button>
      <button class=${`pause-btn ${paused ? 'active' : ''}`} onClick=${() => setPaused(p => !p)} aria-label="Pausar">${paused ? '▶' : '❚❚'}</button>
    </div>
  `;

  if (phase === 'roundrest') {
    return html`
      <div class="screen roundrest">
        ${PauseBtn}
        <span class="roundrest-badge">Fin de vuelta ${roundIdx + 1}/${rounds}</span>
        <p class="timer-big">${fmtTime(restRemaining)}</p>
        <p class="cue-text">Descanso entre vueltas del circuito. La vuelta ${roundIdx + 2} empieza sola cuando acaba la cuenta.</p>
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'rest') {
    const nextIsRoundEnd = isLastExInRound;
    const nextName = nextIsRoundEnd ? (isLastRound ? 'Fin del circuito' : `Descanso entre vueltas`) : session.exercises[exIdx + 1].name;
    return html`
      <div class="screen rest">
        ${PauseBtn}
        <p class="eyebrow">Descanso · Vuelta ${roundIdx + 1}/${rounds}</p>
        <p class="timer-big rest-timer">${fmtTime(restRemaining)}</p>
        <p class="rest-next">Siguiente: ${nextName}</p>
        ${!nextIsRoundEnd ? html`
          <p class="rest-next-detail">
            ${session.exercises[exIdx + 1].isTimeBased ? `${session.exercises[exIdx + 1].targetReps}s` : `${session.exercises[exIdx + 1].targetReps} reps`}${session.exercises[exIdx + 1].equip === 'mancuernas' ? ` · mancuernas ${session.exercises[exIdx + 1].weight}kg` : ''}
          </p>
        ` : null}
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'confirm') {
    const pct = ((CONFIRM_SECONDS - confirmRemaining) / CONFIRM_SECONDS) * 100;
    return html`
      <div class="screen logging">
        ${PauseBtn}
        <p class="eyebrow">${ex.name} · Vuelta ${roundIdx + 1}/${rounds}</p>
        <h2>${ex.isTimeBased ? '¿Cuántos segundos aguantaste?' : '¿Cuántas repeticiones hiciste?'}</h2>
        <div class="confirm-ring">
          <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="35" class="confirm-ring-bg"/><circle cx="40" cy="40" r="35" class="confirm-ring-fg" style=${{ strokeDashoffset: 219.9 - (219.9 * pct) / 100 }}/></svg>
          <div class="confirm-ring-num">${confirmRemaining}s</div>
        </div>
        <div class="confirm-reps-row">
          <button class="confirm-adj-btn" onClick=${() => { playIfOn(Sound.playAdjustTick); setConfirmReps(r => Math.max(0, r - 1)); }}>−</button>
          <span class="confirm-reps-num">${confirmReps}</span>
          <button class="confirm-adj-btn" onClick=${() => { playIfOn(Sound.playAdjustTick); setConfirmReps(r => r + 1); }}>+</button>
        </div>
        <p class="target-hint">Objetivo propuesto: ${ex.targetReps} ${ex.isTimeBased ? 's' : 'reps'}. Se registra sola en ${confirmRemaining}s si no tocas nada.</p>
      </div>
    `;
  }

  const workPct = ((workSeconds - workRemaining) / workSeconds) * 100;
  return html`
    <div class="screen work">
      ${PauseBtn}
      <span class="round-badge">Vuelta ${roundIdx + 1} de ${rounds}</span>
      <p class="eyebrow">${session.templateName} · Ejercicio ${exIdx + 1}/${session.exercises.length}</p>
      <div class="circuit-progress">
        ${session.exercises.map((e, i) => html`<span key=${e.id} class=${`circuit-dot ${i < exIdx ? 'done' : i === exIdx ? 'current' : ''}`} />`)}
      </div>
      <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${170} />
      <h2>${ex.name}</h2>
      <div class="target-chips">
        <span class="chip chip-emphasis">${ex.isTimeBased ? `${ex.targetReps}s` : `${ex.targetReps} reps`}</span>
        <span class="chip">${ex.equip === 'mancuernas' ? `Mancuernas ${ex.weight}kg` : 'Peso corporal'}</span>
        <span class="chip">Tempo ${ex.tempo}</span>
      </div>
      <p class="exercise-cue">${ex.cue}</p>
      <p class="timer-big">${fmtTime(workRemaining)}</p>
      <button class="btn-secondary" onClick=${() => { setConfirmReps(ex.targetReps); setPhase('confirm'); }}>Ya la hice, continuar</button>
      ${roundIdx === 0 ? html`<p class="level-hint">Nivel actual: ${getExerciseLevel(state, ex.id, ex.level)}/5</p>` : null}
      <p class="auto-note">Avanza sola: ${fmtTime(workRemaining)} restantes de esta serie.</p>
    </div>
  `;
}

// =====================================================================
// PANTALLA: HIPOPRESIVOS (bloque final, no calentamiento)
// =====================================================================
function HypopressiveBlock({ onDone, onExit }) {
  const [idx, setIdx] = useState(0);
  const [running, setRunning] = useState(true);
  const step = HYPOPRESSIVE_BLOCK[idx];
  const advance = useCallback(() => {
    playIfOn(Sound.playRestEnd);
    if (idx < HYPOPRESSIVE_BLOCK.length - 1) setIdx(i => i + 1); else onDone();
  }, [idx, onDone]);
  const [remaining, setRemaining] = useCountdown(step.duration, advance, running);
  useEffect(() => { setRemaining(step.duration); }, [idx]);
  useEffect(() => { playIfOn(Sound.playHypoStep); }, [idx]);
  const pct = ((step.duration - remaining) / step.duration) * 100;

  return html`
    <div class="screen hypo">
      <div class="session-controls">
        <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el registro de esta vuelta.')) onExit(); }} aria-label="Volver al inicio">←</button>
      </div>
      <p class="eyebrow">Bloque final · Hipopresivos · Paso ${idx + 1}/${HYPOPRESSIVE_BLOCK.length}</p>
      <div class="mobility-ring">
        <svg viewBox="0 0 120 120" class="ring-svg">
          <circle cx="60" cy="60" r="54" class="ring-bg" />
          <circle cx="60" cy="60" r="54" class="ring-fg" style=${{ strokeDashoffset: 339.3 - (339.3 * pct) / 100 }} />
        </svg>
        <div class="ring-center"><${ExerciseVisual} exId=${step.id} iconKey=${step.icon} size=${120} /></div>
      </div>
      <h2>${step.name}</h2>
      <p class="cue-text">${step.cue}</p>
      <p class="timer-big">${fmtTime(remaining)}</p>
      <div class="mobility-controls">
        <button class="btn-secondary" onClick=${() => setRunning(r => !r)}>${running ? 'Pausar' : 'Reanudar'}</button>
        <button class="btn-primary" onClick=${advance}>${idx < HYPOPRESSIVE_BLOCK.length - 1 ? 'Saltar paso' : 'Finalizar'}</button>
      </div>
      <div class="mobility-dots">
        ${HYPOPRESSIVE_BLOCK.map((s, i) => html`<span key=${s.id} class=${`mdot ${i === idx ? 'active' : ''} ${i < idx ? 'done' : ''}`} />`)}
      </div>
    </div>
  `;
}

function Progress({ state, onBack }) {

  return html`

      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Tu progreso</h1></header>
      <div class="stat-row">
        <div class="stat-box"><p class="stat-num">${state.totalSessionsDone}</p><p class="stat-label">Sesiones</p></div>

            <p class="group-title">${groupLabels[g]}</p>

              const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix).sort((a, b) => a.level - b.level);
              let level = getFamilyLevel(state, prefix);
              const current = family.find(e => e.level === level) || family[0];
              return html`
                <div key=${prefix} class="level-track-row">
                  <span class="level-track-name">${current.name}</span>
                  <div class="level-track">${[1, 2, 3, 4, 5].map(l => html`<span key=${l} class=${`level-pip ${l <= level ? 'filled' : ''}`} />`)}</div>
                </div>

            })}
          </div>
        `;
      })}
      ${recentSessions.length > 0 ? html`
        <div class="progress-group">
          <p class="group-title">Últimas sesiones</p>
          <div class="history-list">
            ${recentSessions.map((s, i) => html`
              <div key=${i} class="history-row">

                <span>${s.rounds} ${s.rounds === 1 ? 'vuelta' : 'vueltas'} · Fase ${PHASES[s.phase].name}</span>
              </div>
            `)}
          </div>
        </div>
      ` : null}
    </div>
  `;
}

function SyncBlock({ state, forceRender }) {
  const [code, setCode] = useState('');
  const [status, setStatus] = useState(null); // null | 'loading' | 'ok' | 'error'
  const [copied, setCopied] = useState(false);

  useEffect(() => { if (!state.syncCode) syncCreate(state).then(() => forceRender(x => x + 1)); }, []);

  async function handleLink() {
    if (!code.trim()) return;
    setStatus('loading');
    try {
      syncing = true;
      await syncPull(code);
      syncing = false;
      setStatus('ok');
      setTimeout(() => window.location.reload(), 900);
    } catch (e) {
      syncing = false;
      setStatus('error');
    }
  }

  function handleCopy() {
    if (!state.syncCode) return;
    navigator.clipboard?.writeText(state.syncCode).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">Sincronizar entre dispositivos</p>
      <p class="settings-hint">Tu código en este dispositivo (guarda y actualiza tu progreso automáticamente):</p>
      <div class="sync-code-row">
        <span class="sync-code">${state.syncCode || 'generando…'}</span>
        <button class="btn-secondary sync-copy-btn" onClick=${handleCopy} disabled=${!state.syncCode}>${copied ? '✓ Copiado' : 'Copiar'}</button>
      </div>
      <p class="settings-hint" style=${{ marginTop: '14px' }}>¿Ya tienes progreso en otro dispositivo? Introduce aquí ese código para traerlo a este:</p>
      <div class="sync-link-row">
        <input class="sync-code-input" placeholder="Pega el código aquí" value=${code} onChange=${e => setCode(e.target.value)} />
        <button class="btn-secondary" onClick=${handleLink} disabled=${status === 'loading'}>${status === 'loading' ? '...' : 'Vincular'}</button>
      </div>
      ${status === 'ok' ? html`<p class="sync-msg sync-ok">Progreso vinculado. Recargando…</p>` : null}
      ${status === 'error' ? html`<p class="sync-msg sync-err">Código no encontrado o sin conexión. Revisa que esté bien copiado.</p>` : null}
    </div>
  `;
}

  return html`

          <button class=${`switch ${soundsEnabled ? 'on' : ''}`} onClick=${() => { onToggleSounds(); forceRender(x => x + 1); }}><span class="switch-knob" /></button>
        </div>
        <p class="settings-hint">Beep de inicio/fin de serie y cuenta atrás en los últimos 3 segundos del descanso. En iPhone, si el interruptor físico de silencio está activado, iOS silencia el sonido de cualquier web o app instalada — es una restricción del sistema, no de esta app.</p>
      </div>

      <div class="settings-block">
        <p class="settings-label">Semana del ciclo</p>
        <div class="week-picker">
          ${[1, 2, 3, 4].map(w => html`<button key=${w} class=${`week-btn ${state.cycleWeek === w ? 'active' : ''}`} onClick=${() => { state.cycleWeek = w; saveState(state); forceRender(x => x + 1); }}>${w}</button>`)}
        </div>
        <p class="settings-hint">Fuerza manualmente la fase de periodización si lo necesitas.</p>
      </div>

      <div class="settings-block">
        <p class="settings-label">Ritmo del circuito</p>
        <div class="pace-picker">
          ${[['lento', 'Lento'], ['normal', 'Normal'], ['rapido', 'Rápido']].map(([key, label]) => html`
            <button key=${key} class=${`pace-btn ${(state.pace || 'normal') === key ? 'active' : ''}`} onClick=${() => { state.pace = key; saveState(state); forceRender(x => x + 1); }}>${label}</button>
          `)}
        </div>
        <p class="settings-hint">Ajusta cuánto dura automáticamente cada serie antes de pasar a confirmar repeticiones. No afecta a los ejercicios isométricos (plancha, silla), que respetan siempre su tiempo objetivo real.</p>
      </div>

      <${SyncBlock} state=${state} forceRender=${forceRender} />

      <div class="settings-block">
        <p class="settings-label">Datos</p>
        <button class="btn-danger" onClick=${onReset}>Reiniciar todo el progreso</button>
        <p class="settings-hint">Borra niveles, historial y vuelve a Semana 1 (también en el código de sincronización).</p>
      </div>

      <div class="settings-block">
        <p class="settings-label">Acerca de</p>
        <p class="settings-hint">
          Plan mensual de 6 días/semana (domingo descanso), sin fase de adaptación inicial (perfil avanzado): Volumen → Fuerza → Intensidad → Descarga.
          Cada día es un circuito de ${EXERCISES_PER_SESSION} ejercicios que puedes repetir 1, 2 o 3 vueltas — cada vuelta se registra por separado. La fase "Volumen" (semana 1) ya trabaja al 100% de la carga base: no hay rampa de adaptación, se empieza fuerte desde el día 1. Con 3 vueltas + el bloque hipopresivo, el total diario ronda los 25-30 minutos (lo ves en Inicio, se recalcula según tus vueltas y ritmo elegidos).
          Bloque hipopresivo al final de cada sesión (no al principio) para faja abdominal y reducción de cintura.
          El circuito avanza solo: cada serie se cronometra según tus reps objetivo y el tempo del ejercicio, y al acabar tienes 10 segundos para ajustar con ± las repeticiones reales antes de que se registren automáticamente. El esfuerzo (RPE) se estima solo, comparando lo hecho con el objetivo — no hay que tocar una escala manual. Puedes pausar o terminar en cualquier momento con los botones superiores.
        </p>
      </div>
    </div>
  `;
}

// =====================================================================
// APP ROOT
// =====================================================================
function App() {
  const [state, setState] = useState(() => loadState());
  const [screen, setScreen] = useState('home'); // home | weekplan | session | hypo | summary | progress | settings
  const [activeSession, setActiveSession] = useState(null);
  const [activeRounds, setActiveRounds] = useState(2);
  const [lastResults, setLastResults] = useState([]);
  const [, forceRender] = useState(0);
  const todaySession = useMemo(() => generateSession(state), [state.cycleWeek, state.totalSessionsDone]);

  useEffect(() => { if (!state.syncCode) syncCreate(state).then(() => forceRender(x => x + 1)); }, []);

  function handleStart() {
    Sound.unlock();
    setActiveSession(generateSession(state));
    setActiveRounds(state.roundsPerDay || 2);
    setScreen('session');
  }
  function handleSetRounds(n) { state.roundsPerDay = n; saveState(state); forceRender(x => x + 1); }
  function handleCircuitFinish(results) { setLastResults(results); setScreen('hypo'); }
  function handleHypoDone() { setState({ ...state }); setScreen('summary'); }
  function handleReset() {
    if (!confirm('Esto borrará todo tu progreso. ¿Continuar?')) return;
    localStorage.removeItem(STORAGE_KEY);
    setState(loadState());
    setScreen('home');
  }
  function handleToggleSounds() { soundsOn = !soundsOn; forceRender(x => x + 1); }

  return html`
    <div class="app-shell">
      ${screen === 'home' ? html`<${Home} state=${state} onStart=${handleStart} onOpenProgress=${() => setScreen('progress')} onOpenSettings=${() => setScreen('settings')} onOpenWeekPlan=${() => setScreen('weekplan')} todaySession=${todaySession} onSetRounds=${handleSetRounds} />` : null}
      ${screen === 'weekplan' ? html`<${WeeklyPlan} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'session' && activeSession ? html`<${TrainingSession} session=${activeSession} state=${state} rounds=${activeRounds} onFinishCircuit=${handleCircuitFinish} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo' ? html`<${HypopressiveBlock} onDone=${handleHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'summary' ? html`<${SessionSummary} results=${lastResults} rounds=${activeRounds} onDone=${() => setScreen('home')} />` : null}
      ${screen === 'progress' ? html`<${Progress} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'settings' ? html`<${Settings} state=${state} onBack=${() => setScreen('home')} onReset=${handleReset} soundsEnabled=${soundsOn} onToggleSounds=${handleToggleSounds} />` : null}
    </div>
  `;
}

// =====================================================================
// PWA: manifest + icono generados dinámicamente
// =====================================================================
(function setupPWA() {
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="40" fill="#12141A"/><text x="100" y="130" font-family="Arial Black, sans-serif" font-weight="900" font-size="110" fill="#C8FF3D" text-anchor="middle">F</text></svg>`;
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);
  document.getElementById('favicon').href = iconUrl;
  document.getElementById('apple-touch-icon').href = iconUrl;
  const manifest = {
    name: 'Forma 55 — Circuito diario',
    short_name: 'Forma 55',
    start_url: './',
    display: 'standalone',
    background_color: '#12141A',
    theme_color: '#12141A',
    icons: [{ src: iconUrl, sizes: '200x200', type: 'image/svg+xml' }],
  };
  document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

const root = createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
