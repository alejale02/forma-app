function App() {
  const [state, setState] = useState(() => loadState());
  const [needsLinkPrompt, setNeedsLinkPrompt] = useState(() => { try { return !localStorage.getItem(STORAGE_KEY); } catch (e) { return false; } });
  // Enlace de sincronización recibido de otro dispositivo (?sync=CODIGO),
  // p.ej. al escanear el código QR con la cámara nativa o tocar un enlace
  // compartido por AirDrop/Mensajes. Se limpia de la URL de inmediato para
  // no re-preguntar si se recarga la página.
  const [incomingSyncCode] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('sync');
      if (code) {
        const clean = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', clean);
      }
      return code;
    } catch (e) { return null; }
  });
  const [dismissedIncoming, setDismissedIncoming] = useState(false);
  const [screen, setScreen] = useState('home'); // home | weekplan | session | hypo | summary | progress | settings

  // La música (generada o archivos propios) suena de fondo durante todo el
  // bloque de entrenamiento (circuito + hipopresivos), sin cortes entre
  // pantallas, y se para al llegar al resumen o volver a Inicio. Si hay
  // archivos propios activados, tienen prioridad y el ritmo generado no suena
  // (para no mezclar ambos, tal y como se explica en Configuración).
  useEffect(() => {
    const inWorkout = ['session', 'hypo', 'hypo-extend-prompt', 'hypo-extend'].includes(screen);
    if (!inWorkout) { Music.stop(); LocalMusicPlayer.stop(); return; }
    if (localMusicOn && LocalMusicPlayer.hasTracks()) { LocalMusicPlayer.start(); }
    else if (musicOn) { Music.start(); }
  }, [screen]);
  const [activeSession, setActiveSession] = useState(null);
  const [activeRounds, setActiveRounds] = useState(2);
  const [lastResults, setLastResults] = useState([]);
  const [, forceRender] = useState(0);
  const todaySession = useMemo(() => generateSession(state), [state.cycleWeek, state.totalSessionsDone]);

  // Mantiene la pantalla encendida mientras la app está abierta, vía Screen
  // Wake Lock API. Funciona bien con el modo de bajo consumo desactivado;
  // con el modo de bajo consumo activo, iOS puede rechazar o liberar el
  // wake lock en cualquier momento por ahorro de energía (comportamiento
  // documentado de la propia API) — en ese caso no hay forma de evitarlo
  // desde la web, así que la gestión del modo de bajo consumo se deja en
  // manos del usuario (desactivarlo antes de entrenar).
  useEffect(() => {
    if (!('wakeLock' in navigator)) return;
    let sentinel = null;
    let cancelled = false;
    const requestLock = async () => {
      try {
        const lock = await navigator.wakeLock.request('screen');
        if (cancelled) { lock.release().catch(() => {}); return; }
        sentinel = lock;
        sentinel.addEventListener('release', () => { sentinel = null; });
      } catch (e) {
        // Rechazada (a menudo por el modo de bajo consumo) o no soportada
        // en este contexto — sin más consecuencia que la pantalla podrá
        // apagarse como antes.
      }
    };
    requestLock();
    const handleVisibility = () => { if (document.visibilityState === 'visible' && !sentinel) requestLock(); };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      cancelled = true;
      document.removeEventListener('visibilitychange', handleVisibility);
      if (sentinel) sentinel.release().catch(() => {});
    };
  }, []);

  // Solo se crea un código de sincronización nuevo en cuanto el aviso de
  // "primera vez / vincular dispositivo" queda resuelto — así un móvil
  // nuevo nunca empieza a acumular progreso propio antes de dar al usuario
  // la opción de traer el que ya tenía en otro dispositivo.

  function handleStart() {
    Sound.unlock();
    if (VoiceCoach.supported) { try { window.speechSynthesis.resume(); } catch (e) {} }
    setActiveSession(generateSession(state));
    setActiveRounds(state.roundsPerDay || 2);
    setScreen('warmup');
  }
  function handleWarmupDone() { VoiceCoach.sessionStart(); setScreen('session'); }
  function handleSetRounds(n) { state.roundsPerDay = n; saveState(state); forceRender(x => x + 1); }
  function handleReviewWeightsNow() { state.weightReviewDue = false; state.lastWeightReviewDate = new Date().toISOString().slice(0, 10); state.weightReviewSnoozeUntil = null; saveState(state); forceRender(x => x + 1); setScreen('settings'); }
  function handleSnoozeWeights() { const d = new Date(); d.setDate(d.getDate() + 3); state.weightReviewSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  function handleReviewPhotosNow() { state.photoReviewDue = false; state.lastPhotoReviewDate = new Date().toISOString().slice(0, 10); state.photoReviewSnoozeUntil = null; saveState(state); forceRender(x => x + 1); setScreen('photos'); }
  function handleSnoozePhotos() { const d = new Date(); d.setDate(d.getDate() + 5); state.photoReviewSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  function handleBackupNow() {
    exportBackupFile();
    state.lastBackupDate = new Date().toISOString().slice(0, 10);
    state.backupDue = false;
    state.backupSnoozeUntil = null;
    saveState(state);
    forceRender(x => x + 1);
  }
  function handleSnoozeBackup() { const d = new Date(); d.setDate(d.getDate() + 5); state.backupSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  const hypoSecondsRef = useRef(0);
  function handleCircuitFinish(results) { setLastResults(results); hypoSecondsRef.current = 0; setScreen('circuit-rest'); }
  function handleHypoDone(hypoSec) { hypoSecondsRef.current = hypoSec || 0; setState({ ...state }); setScreen('hypo-extend-prompt'); }
  function handleExtendYes() { setScreen('hypo-extend'); }
  function handleExtendNo() { finalizeSessionStats(state, hypoSecondsRef.current); setState({ ...state }); setScreen('summary'); }
  function handleExtendDone(extraSec) { finalizeSessionStats(state, hypoSecondsRef.current + (extraSec || 0)); setState({ ...state }); setScreen('summary'); }
  function handleStartMorningHypo() { setScreen('hypo-solo'); }
  function handleMorningHypoDone(sec) { logStandaloneHypo(state, sec); forceRender(x => x + 1); setScreen('home'); }
  function handleReset() {
    if (!confirm('Esto borrará todo tu progreso. ¿Continuar?')) return;
    localStorage.removeItem(STORAGE_KEY);
    setState(loadState());
    setScreen('home');
  }
  function handleToggleSounds() { soundsOn = !soundsOn; forceRender(x => x + 1); }
  function handleToggleVoice() { voiceOn = !voiceOn; if (!voiceOn && VoiceCoach.supported) window.speechSynthesis.cancel(); forceRender(x => x + 1); }
  function handleToggleMusic() { musicOn = !musicOn; if (musicOn) Music.start(); else Music.stop(); forceRender(x => x + 1); }

  function handleLinkExisting(code) {
    return applyQuickSync(code).then(() => { window.location.reload(); });
  }
  function handleStartFresh() { setNeedsLinkPrompt(false); }

  if (incomingSyncCode && !dismissedIncoming) {
    return html`<div class="app-shell"><${IncomingSyncPrompt} code=${incomingSyncCode} onConfirm=${handleLinkExisting} onDismiss=${() => setDismissedIncoming(true)} /></div>`;
  }

  if (needsLinkPrompt) {
    return html`<div class="app-shell"><${LinkOrNewPrompt} onLink=${handleLinkExisting} onFresh=${handleStartFresh} /></div>`;
  }

  return html`
    <div class=${`app-shell ${HUB_SCREENS.includes(screen) ? 'has-tabbar' : ''}`}>
      ${lastSaveError ? html`
        <div class="save-error-banner">
          ⚠️ No se ha podido guardar tu progreso ahora mismo (${lastSaveError.message}). Sigue usando la app con normalidad, pero exporta una copia en cuanto puedas (Ajustes → Exportar) para no arriesgar nada.
        </div>
      ` : null}
      ${screen === 'home' ? html`<${Home} state=${state} onStart=${handleStart} onOpenProgress=${() => setScreen('progress')} onOpenSettings=${() => setScreen('settings')} onOpenWeekPlan=${() => setScreen('weekplan')} onOpenNutrition=${() => setScreen('nutrition')} onOpenHabitos=${() => setScreen('habitos')} todaySession=${todaySession} onSetRounds=${handleSetRounds} onReviewWeightsNow=${handleReviewWeightsNow} onSnoozeWeights=${handleSnoozeWeights} onStartMorningHypo=${handleStartMorningHypo} onReviewPhotosNow=${handleReviewPhotosNow} onSnoozePhotos=${handleSnoozePhotos} onBackupNow=${handleBackupNow} onSnoozeBackup=${handleSnoozeBackup} />` : null}
      ${screen === 'habitos' ? html`<${Habitos} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} />` : null}
      ${screen === 'weekplan' ? html`<${WeeklyPlan} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'nutrition' ? html`<${Nutrition} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} />` : null}
      ${screen === 'warmup' && activeSession ? html`<${WarmupScreen} session=${activeSession} onDone=${handleWarmupDone} />` : null}
      ${screen === 'session' && activeSession ? html`<${TrainingSession} session=${activeSession} state=${state} rounds=${activeRounds} onFinishCircuit=${handleCircuitFinish} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'circuit-rest' ? html`<${CircuitRestScreen} session=${activeSession} onDone=${() => setScreen('hypo')} />` : null}
      ${screen === 'hypo' ? html`<${HypopressiveBlock} onDone=${handleHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo-solo' ? html`<${HypopressiveBlock} steps=${HYPOPRESSIVE_MORNING} title="Rutina matutina: postura + hipopresivos" onDone=${handleMorningHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo-extend-prompt' ? html`<${ExtendHypoPrompt} onYes=${handleExtendYes} onNo=${handleExtendNo} />` : null}
      ${screen === 'hypo-extend' ? html`<${HypopressiveBlock} steps=${HYPOPRESSIVE_EXTRA} title="Extra · 2 min de abdomen" onDone=${handleExtendDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'summary' ? html`<${SessionSummary} results=${lastResults} rounds=${activeRounds} onDone=${() => setScreen('home')} />` : null}
      ${screen === 'progress' ? html`<${Progress} state=${state} onBack=${() => setScreen('home')} onOpenPhotos=${() => setScreen('photos')} />` : null}
      ${screen === 'settings' ? html`<${Settings} state=${state} onBack=${() => setScreen('home')} onReset=${handleReset} soundsEnabled=${soundsOn} onToggleSounds=${handleToggleSounds} voiceEnabled=${voiceOn} onToggleVoice=${handleToggleVoice} musicEnabled=${musicOn} onToggleMusic=${handleToggleMusic} />` : null}
      ${screen === 'photos' ? html`<${ProgressPhotos} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} onOpenCamera=${() => setScreen('camera')} />` : null}
      ${screen === 'camera' ? html`<${CameraCaptureScreen} onBack=${() => setScreen('photos')} onCaptured=${dataUrl => { savePhotoForToday(state, dataUrl); forceRender(x => x + 1); setScreen('photos'); }} />` : null}
      ${HUB_SCREENS.includes(screen) ? html`<${TabBar} screen=${screen} onNavigate=${setScreen} />` : null}
    </div>
  `;
}

// =====================================================================
// PWA: manifest + icono generados dinámicamente
// =====================================================================
(function setupPWA() {
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="40" fill="#12141A"/><text x="100" y="130" font-family="Arial Black, sans-serif" font-weight="900" font-size="110" fill="#C8FF3D" text-anchor="middle">F</text></svg>`;
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);
  document.getElementById('favicon').href = iconUrl;
  document.getElementById('apple-touch-icon').href = iconUrl;
  const manifest = {
    name: 'Forma 55 — Circuito diario',
    short_name: 'Forma 55',
    start_url: './',
    display: 'standalone',
    background_color: '#12141A',
    theme_color: '#12141A',
    icons: [{ src: iconUrl, sizes: '200x200', type: 'image/svg+xml' }],
  };
  document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

const root = createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
