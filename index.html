// PANTALLA: PROGRESO
// =====================================================================
function fmtDuration(totalSec) {
  const m = Math.floor(totalSec / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60); const rem = m % 60;
  return rem ? `${h}h ${rem}min` : `${h}h`;
}
function dateKey(iso) { return iso.slice(0, 10); }

// dateKey() sobre un ISO string (que .toISOString() genera siempre en UTC)
// se desincroniza del calendario local justo después de medianoche en
// cualquier zona horaria por delante de UTC (España incluida): durante esa
// ventana, UTC todavía marca "ayer" mientras el reloj del usuario ya marca
// "hoy". Para "qué día es hoy" o "a qué día local pertenece este instante"
// hay que usar SIEMPRE los componentes de fecha locales (getFullYear /
// getMonth / getDate), nunca toISOString().
function localDateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Suma/resta días de calendario a una clave YYYY-MM-DD sin pasar por la
// zona horaria local (Date.UTC + toISOString es siempre UTC en ambos
// sentidos), para que navegar día a día en el editor de hábitos nunca se
// desplace un día de más o de menos según la hora a la que se use.
function shiftKey(key, delta) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + delta);
  return dt.toISOString().slice(0, 10);
}

// Racha de días consecutivos con entreno REAL completado (excluye la
// rutina matutina standalone, igual que el resto de la app ya la trata
// como algo aparte del "entreno de hoy"). Calendario puro, sin asumir
// ningún día de descanso fijo — coherente con que la rotación de
// sesiones ya está desacoplada del día de la semana. Cuenta hacia atrás
// desde hoy y para en el primer día sin sesión real.
function computeTrainingStreak(sessionLog) {
  if (!sessionLog || !sessionLog.length) return 0;
  const trainedDates = new Set(
    sessionLog.filter(s => !s.standalone).map(s => localDateKey(new Date(s.date)))
  );
  let streak = 0;
  let cursor = localDateKey();
  // Si hoy aún no hay sesión registrada (p.ej. por la mañana antes de
  // entrenar), no queremos que la racha se vea en 0 todo el día — se
  // empieza a contar desde ayer, mostrando la racha "viva" que sigue en
  // pie mientras entrenes hoy antes de que acabe el día.
  if (!trainedDates.has(cursor)) cursor = shiftKey(cursor, -1);
  while (trainedDates.has(cursor)) {
    streak += 1;
    cursor = shiftKey(cursor, -1);
  }
  return streak;
}

// Racha de rutina matutina (postura + hipopresivos), aparte de la racha
// de circuito de arriba — GAP REAL encontrado en esta auditoría: cada
// sesión suelta ya se registraba correctamente en sessionLog con
// standalone:true (logStandaloneHypo), pero esos registros solo se
// usaban para EXCLUIRLOS de la racha de circuito — nunca se calculaba ni
// se mostraba una racha propia para ellos. Con datos reales del usuario:
// 26 de 27 días registrados desde que empezó (un único hueco), una
// adherencia real altísima que la app nunca le había enseñado. Mismo
// algoritmo que computeTrainingStreak, filtrando por standalone===true
// en vez de excluirlo.
function computeMorningStreak(sessionLog) {
  if (!sessionLog || !sessionLog.length) return 0;
  const doneDates = new Set(
    sessionLog.filter(s => s.standalone && !s.barHang).map(s => localDateKey(new Date(s.date)))
  );
  let streak = 0;
  let cursor = localDateKey();
  if (!doneDates.has(cursor)) cursor = shiftKey(cursor, -1);
  while (doneDates.has(cursor)) {
    streak += 1;
    cursor = shiftKey(cursor, -1);
  }
  return streak;
}

// Racha de descompresión en barra — mismo algoritmo, filtrando por
// barHang===true. Con 5 días/semana de objetivo (L-V, no fines de
// semana), una racha de "días seguidos" tal cual penalizaría el sábado/
// domingo sin motivo — se cuenta igual pero se explica así en el texto
// donde se muestra, no aquí en el cálculo puro.
function computeBarStreak(sessionLog) {
  if (!sessionLog || !sessionLog.length) return 0;
  const doneDates = new Set(
    sessionLog.filter(s => s.barHang).map(s => localDateKey(new Date(s.date)))
  );
  let streak = 0;
  let cursor = localDateKey();
  if (!doneDates.has(cursor)) cursor = shiftKey(cursor, -1);
  while (doneDates.has(cursor)) {
    streak += 1;
    cursor = shiftKey(cursor, -1);
  }
  return streak;
}

// Resumen de hábitos de un día concreto (para el calendario de Progreso).
// Devuelve null si ese día no tiene ningún dato registrado.
function getHabitDataForDay(state, key) {
  const steps = state.stepsLog && state.stepsLog[key];
  const sleep = state.sleepLog && state.sleepLog[key];
  const calEntry = state.calorieLog && state.calorieLog[key];
  const hasCal = calEntry && (Object.values(calEntry.meals || {}).some(Boolean) || (calEntry.extraKcal || 0) > 0 || Object.values(calEntry.realFoods || {}).some(arr => arr && arr.length));
  const activities = (state.extraActivityLog && state.extraActivityLog[key]) || [];
  const extraActivityKcal = activities.reduce((sum, a) => sum + (a.kcal || 0), 0);
  if (!steps && !sleep && !hasCal && !activities.length) return null;

  const nutrition = hasCal ? getDayNutritionTotals(state, key) : null;
  return {
    steps: steps || null,
    sleep: sleep || null,
    kcalTotal: nutrition ? nutrition.kcalTotal : null,
    kcalTarget: nutrition ? nutrition.kcalTarget : null,
    proteinTotal: nutrition ? nutrition.proteinTotal : null,
    carbTotal: nutrition ? nutrition.carbTotal : null,
    fatTotal: nutrition ? nutrition.fatTotal : null,
    fiberTotal: nutrition ? nutrition.fiberTotal : null,
    extraActivityKcal: activities.length ? extraActivityKcal : null
  };
}

// Serie combinada de pasos, sueño, kcal, cintura y peso para el gráfico de
// evolución. Reutiliza las mismas fuentes que ya alimentan "Últimos 7 días"
// (stepsLog/sleepLog/calorieLog) y la tarjeta de medidas de Progreso
// (measurements) — no crea ningún dato nuevo, solo los alinea por fecha.
function buildHabitsEvolution(state, days = 30) {
  const todayKey = localDateKey();
  const keys = [];
  for (let i = days - 1; i >= 0; i--) keys.push(shiftKey(todayKey, -i));

  const measureByDate = {};
  (state.measurements || []).forEach(m => { measureByDate[m.date] = m; });

  const rows = keys.map(key => {
    const h = getHabitDataForDay(state, key) || {};
    const m = measureByDate[key];
    return {
      date: key,
      steps: h.steps != null ? h.steps : null,
      sleep: h.sleep != null ? h.sleep : null,
      kcal: h.kcalTotal != null ? h.kcalTotal : null,
      waist: m ? m.waistCm : null,
      weight: m && m.weightKg ? m.weightKg : null,
    };
  });

  const series = field => rows.filter(r => r[field] != null).map(r => ({ v: r[field], date: r.date }));
  return {
    steps: series('steps'),
    sleep: series('sleep'),
    kcal: series('kcal'),
    waist: series('waist'),
    weight: series('weight'),
  };
}

// Umbral de sueño usado para la adherencia — no hay un número clínico único
// para un hombre de 55 años, pero 7h es el mínimo generalmente aceptado
// para recuperación real entrenando a diario (por debajo, more riesgo de
// que el propio entreno no se aproveche igual). Ajustable aquí si se
// prefiere otro criterio.
const SLEEP_GOAL_H = 7;
const FAT_KCAL_PER_KG = 7700; // equivalencia estándar usada en literatura de balance energético

// KPIs operativos para el dashboard de Hábitos — pensados como los usaría
// un analista para decidir si algo hay que corregir, no solo para "ver
// datos": adherencia real (día sin registrar cuenta como objetivo NO
// cumplido, criterio conservador y honesto), déficit medio de los últimos
// 7 días, y sobre todo la RECONCILIACIÓN entre el déficit que el registro
// de comida dice que ha habido y lo que la báscula confirma de verdad — si
// se separan mucho, lo más probable es que se esté subestimando lo comido
// (o sobreestimando el gasto), no que el metabolismo "no funcione".
function buildHabitsKPIs(state, days = 30) {
  const todayKey = localDateKey();
  const keys = [];
  for (let i = days - 1; i >= 0; i--) keys.push(shiftKey(todayKey, -i));
  const last7 = keys.slice(-7);
  const tdee = NUTRITION_TARGETS.tdee;

  const rowByDate = {};
  keys.forEach(key => { rowByDate[key] = getHabitDataForDay(state, key) || {}; });

  const kcalRows7 = last7.map(k => rowByDate[k]).filter(r => r.kcalTotal != null);
  const kcalVals7 = kcalRows7.map(r => r.kcalTotal);
  const kcalAvg7 = kcalVals7.length ? kcalVals7.reduce((a, b) => a + b, 0) / kcalVals7.length : null;
  // El déficit se calcula día a día con el TDEE EFECTIVO de ese día (fijo +
  // actividad extra puntual, si la hubo) y luego se promedia — no al revés
  // (promediar kcal y restar un TDEE fijo), porque eso ignoraría que un día
  // con pádel/carrera tiene un gasto real mayor que otro día normal.
  const deficitDays7 = kcalRows7.map(r => (tdee + (r.extraActivityKcal || 0)) - r.kcalTotal);
  const deficitAvg7 = deficitDays7.length ? deficitDays7.reduce((a, b) => a + b, 0) / deficitDays7.length : null;
  const extraActivityKcal7 = last7.reduce((sum, k) => sum + (rowByDate[k].extraActivityKcal || 0), 0);

  const stepsVals7 = last7.map(k => rowByDate[k].steps).filter(v => v != null);
  const stepsAvg7 = stepsVals7.length ? Math.round(stepsVals7.reduce((a, b) => a + b, 0) / stepsVals7.length) : null;

  const sleepVals7 = last7.map(k => rowByDate[k].sleep).filter(v => v != null);
  const sleepAvg7 = sleepVals7.length ? sleepVals7.reduce((a, b) => a + b, 0) / sleepVals7.length : null;

  const stepsTarget = state.stepsTarget || 8000;
  const stepsHits = last7.filter(k => rowByDate[k].steps != null && rowByDate[k].steps >= stepsTarget).length;
  const sleepHits = last7.filter(k => rowByDate[k].sleep != null && rowByDate[k].sleep >= SLEEP_GOAL_H).length;

  const deficitAllRows = keys.map(k => rowByDate[k]).filter(r => r.kcalTotal != null);
  const deficitAll = deficitAllRows.map(r => (tdee + (r.extraActivityKcal || 0)) - r.kcalTotal);
  const theoreticalKgChange = deficitAll.length ? -1 * (deficitAll.reduce((a, b) => a + b, 0) / FAT_KCAL_PER_KG) : null;

  const measurements = (state.measurements || []).filter(m => m.date >= keys[0] && m.date <= todayKey).sort((a, b) => a.date < b.date ? -1 : 1);
  const withWeight = measurements.filter(m => m.weightKg);
  const actualKgChange = withWeight.length >= 2 ? withWeight[withWeight.length - 1].weightKg - withWeight[0].weightKg : null;
  const withWaist = measurements.filter(m => m.waistCm != null);
  const waistChange = withWaist.length >= 2 ? withWaist[withWaist.length - 1].waistCm - withWaist[0].waistCm : null;

  return {
    kcalAvg7, deficitAvg7, kcalLoggedDays7: kcalVals7.length, extraActivityKcal7,
    stepsAvg7, stepsLoggedDays7: stepsVals7.length,
    sleepAvg7, sleepLoggedDays7: sleepVals7.length,
    stepsAdherence7: Math.round((stepsHits / 7) * 100),
    sleepAdherence7: Math.round((sleepHits / 7) * 100),
    theoreticalKgChange, actualKgChange, waistChange,
    stepsTarget,
  };
}

// Detecta mesetas reales (déficit mantenido pero la cintura no baja) para
// poder decir algo específico justo cuando más falta hace — sin esto, la
// app sigue mostrando números planos en la peor semana para hacerlo, que es
// cuando alguien tira la toalla sin necesidad. Deliberadamente conservador:
// solo se pronuncia con datos suficientes (≥10 días de kcal en la ventana,
// ≥12 días entre medidas) para no dar una falsa alarma ni una falsa calma.
function detectPlateau(state, days = 21) {
  const todayKey = localDateKey();
  const keys = [];
  for (let i = days - 1; i >= 0; i--) keys.push(shiftKey(todayKey, -i));
  const rowByDate = {};
  keys.forEach(k => { rowByDate[k] = getHabitDataForDay(state, k) || {}; });
  const tdee = NUTRITION_TARGETS.tdee;
  const deficits = keys.map(k => rowByDate[k]).filter(r => r.kcalTotal != null).map(r => tdee - r.kcalTotal);
  if (deficits.length < 10) return null;
  const avgDeficit = deficits.reduce((a, b) => a + b, 0) / deficits.length;

  const measurements = (state.measurements || []).filter(m => m.date >= keys[0] && m.date <= todayKey).sort((a, b) => a.date < b.date ? -1 : 1);
  const withWaist = measurements.filter(m => m.waistCm != null);
  if (withWaist.length < 2) return null;
  const spanDays = Math.round((new Date(withWaist[withWaist.length - 1].date) - new Date(withWaist[0].date)) / 86400000);
  if (spanDays < 12) return null;
  const waistChange = withWaist[withWaist.length - 1].waistCm - withWaist[0].waistCm;
  const isPlateau = avgDeficit >= 100 && waistChange >= 0;
  return { isPlateau, avgDeficit, waistChange, spanDays };
}

// Panel de recomendaciones del "entrenador" en Progreso: sintetiza en
// frases accionables lo que ya calculan buildHabitsKPIs/detectPlateau/
// computeTrainingStreak/exerciseLevels por separado — nada se inventa ni
// se genera con IA, son umbrales fijos aplicados a tus datos reales, cada
// uno verificable. Devuelve un array ordenado por prioridad (avisos antes
// que enhorabuenas) para que el dato más accionable de la semana salga
// siempre arriba del todo.
function buildCoachInsights(state) {
  const kpi = buildHabitsKPIs(state, 7);
  const plateau = detectPlateau(state);
  const streak = computeTrainingStreak(state.sessionLog);
  const insights = [];

  // 1) Meseta real detectada — la señal más importante posible, así que
  // siempre va primera si existe.
  if (plateau && plateau.isPlateau) {
    insights.push({ icon: '📉', tone: 'warn', text: `Meseta real: llevas ${plateau.spanDays} días con déficit medio de ~${Math.round(plateau.avgDeficit)}kcal/día pero la cintura no baja. No es fallo tuyo — el cuerpo se adapta. Prueba un reajuste del TDEE o revisa si el registro real está completo.` });
  }

  // 2) Racha de entreno.
  if (streak === 0) {
    insights.push({ icon: '🔥', tone: 'warn', text: 'Sin racha activa ahora mismo — entrena hoy para arrancarla de nuevo. La consistencia importa más que cualquier ejercicio suelto.' });
  } else if (streak >= 5) {
    insights.push({ icon: '🔥', tone: 'good', text: `${streak} días seguidos de entreno real — es la variable que más predice resultado a largo plazo. Sigue así.` });
  }

  // 3) Déficit real de los últimos 7 días vs objetivo.
  if (kpi.deficitAvg7 != null) {
    const targetDeficit = NUTRITION_TARGETS.tdee - NUTRITION_TARGETS.kcal;
    if (kpi.deficitAvg7 < targetDeficit * 0.5) {
      insights.push({ icon: '🍽️', tone: 'warn', text: `Déficit real de los últimos 7 días: ~${Math.round(kpi.deficitAvg7)}kcal/día, muy por debajo del objetivo (~${targetDeficit}kcal). Al ritmo actual, la pérdida de grasa va a ser mucho más lenta de lo previsto.` });
    } else if (kpi.deficitAvg7 >= targetDeficit * 0.9) {
      insights.push({ icon: '🍽️', tone: 'good', text: `Déficit real de los últimos 7 días: ~${Math.round(kpi.deficitAvg7)}kcal/día — prácticamente en el objetivo. Esto es lo que más está tirando del cambio físico ahora mismo.` });
    }
  } else {
    insights.push({ icon: '🍽️', tone: 'info', text: 'Sin datos de comida registrados esta semana en Hábitos — sin eso, es imposible saber si el déficit real está donde debería.' });
  }

  // 3b) Proteína POR COMIDA, no solo el total del día — auditoría experta
  // agosto 2026. A los 55 años la síntesis de proteína muscular responde
  // peor a la misma cantidad total si viene concentrada en 1-2 tomas en
  // vez de repartida — el umbral por comida (~0,4g/kg) importa más que a
  // los 25. Revisa los últimos días con registro real (comida/cena,
  // usando el mismo mealDisplayProtein que ya usa el resto de la app, no
  // un cálculo nuevo) y avisa solo si el patrón se repite, no por un día
  // suelto.
  const proteinPerMealTarget = Math.round(getCurrentWeightKg(state) * 0.4);
  const recentCalKeys = Object.keys(state.calorieLog || {}).sort().slice(-4);
  const lowProteinMealDays = recentCalKeys.filter(key => {
    const entry = state.calorieLog[key];
    const d = new Date(key + 'T00:00:00');
    const isoDay = d.getDay() === 0 ? 7 : d.getDay();
    const dayPlan = NUTRITION_PLAN.find(p => p.day === isoDay);
    if (!dayPlan) return false;
    const lunchP = mealDisplayProtein(entry, 'lunch', !!(entry.meals && entry.meals.lunch), dayPlan.lunchProteinG);
    const dinnerP = mealDisplayProtein(entry, 'dinner', !!(entry.meals && entry.meals.dinner), dayPlan.dinnerProteinG);
    return (lunchP > 0 && lunchP < proteinPerMealTarget) || (dinnerP > 0 && dinnerP < proteinPerMealTarget);
  });
  if (recentCalKeys.length >= 2 && lowProteinMealDays.length >= 2) {
    insights.push({ icon: '🍗', tone: 'warn', text: `Comida o cena por debajo de ~${proteinPerMealTarget}g de proteína en ${lowProteinMealDays.length} de tus últimos ${recentCalKeys.length} días registrados. A tu edad reparte más que a los 25 — no solo el total del día cuenta, cada comida principal debería acercarse a esa cifra para aprovecharla de verdad.` });
  }

  // 4) Pasos.
  if (kpi.stepsAvg7 != null && kpi.stepsAvg7 < kpi.stepsTarget * 0.75) {
    insights.push({ icon: '🚶', tone: 'warn', text: `Media de pasos 7 días: ${kpi.stepsAvg7.toLocaleString('es-ES')} de ${kpi.stepsTarget.toLocaleString('es-ES')} objetivo. Es la palanca más fácil de recuperar sin tocar más la comida.` });
  }

  // 5) Sueño.
  if (kpi.sleepAvg7 != null && kpi.sleepAvg7 < SLEEP_GOAL_H - 0.5) {
    insights.push({ icon: '😴', tone: 'warn', text: `Media de sueño 7 días: ${kpi.sleepAvg7.toFixed(1)}h, por debajo de las ${SLEEP_GOAL_H}h recomendadas. El sueño corto afecta directamente a la recuperación muscular y al control del hambre.` });
  }

  // 5b) Correlación sueño↔alcohol con TUS propios datos — auditoría
  // experta agosto 2026. No es un consejo genérico ("el alcohol afecta al
  // sueño"), es cruzar dos cosas que ya registras (calorieLog + sleepLog)
  // para ver si en TU caso concreto se cumple, con suficientes noches de
  // cada lado para que signifique algo (mínimo 3 y 3). El sueño es tu
  // punto más débil sostenido, así que si hay una palanca real aquí vale
  // la pena señalarla con tus propios números, no en abstracto.
  {
    const alcoholIds = ['cerveza', 'vino'];
    const nightsWithAlcohol = [], nightsWithoutAlcohol = [];
    Object.keys(state.calorieLog || {}).forEach(key => {
      const entry = state.calorieLog[key];
      const hadAlcohol = Object.values(entry.realFoods || {}).some(items => (items || []).some(it => alcoholIds.includes(it.foodId)));
      const sleepThatNight = state.sleepLog && state.sleepLog[key];
      if (sleepThatNight == null) return;
      (hadAlcohol ? nightsWithAlcohol : nightsWithoutAlcohol).push(sleepThatNight);
    });
    if (nightsWithAlcohol.length >= 3 && nightsWithoutAlcohol.length >= 3) {
      const avgWith = nightsWithAlcohol.reduce((a, b) => a + b, 0) / nightsWithAlcohol.length;
      const avgWithout = nightsWithoutAlcohol.reduce((a, b) => a + b, 0) / nightsWithoutAlcohol.length;
      const diff = avgWithout - avgWith;
      if (diff >= 0.4) {
        insights.push({ icon: '🍺', tone: 'warn', text: `Con tus propios datos: las noches que registras cerveza o vino duermes de media ${avgWith.toFixed(1)}h, frente a ${avgWithout.toFixed(1)}h las noches sin alcohol (${nightsWithAlcohol.length} vs ${nightsWithoutAlcohol.length} noches comparadas) — ${diff.toFixed(1)}h menos. No es un consejo genérico, es tu propio patrón real.` });
      }
    }
  }

  // 6) Reconciliación real: si el déficit teórico dice que deberías haber
  // bajado X y la báscula/cintura no lo reflejan ni de lejos, puede haber
  // subregistro de comida — dato incómodo pero honesto.
  if (kpi.theoreticalKgChange != null && kpi.actualKgChange != null) {
    const gap = kpi.theoreticalKgChange - kpi.actualKgChange;
    if (gap > 0.6) {
      insights.push({ icon: '⚖️', tone: 'info', text: `Tu déficit registrado predice ${Math.abs(kpi.theoreticalKgChange).toFixed(1)}kg perdidos, pero la báscula refleja ${Math.abs(kpi.actualKgChange).toFixed(1)}kg. La diferencia suele ser comida real no registrada — no hace falta que sea exacto, pero merece la pena revisar qué se está quedando fuera.` });
    }
  }

  // 7) Familias de ejercicio con mucho volumeBonus acumulado (estancadas
  // en el tope sin variante nueva desde hace tiempo) — mismo criterio que
  // ya se usó manualmente para detectar que retract/row/press necesitaban
  // ampliación, ahora automático y visible en el propio dashboard.
  const stuckFamilies = Object.entries(state.exerciseLevels || {})
    .filter(([, v]) => (v.volumeBonus || 0) >= 8)
    .map(([id]) => EXERCISES.find(e => e.id === id))
    .filter(Boolean);
  if (stuckFamilies.length) {
    const names = stuckFamilies.slice(0, 2).map(e => e.name).join(', ');
    insights.push({ icon: '💪', tone: 'info', text: `${names} llevan mucho tiempo al tope sin variante nueva — si notas que las repeticiones ya son muy altas ahí, coméntaselo a Claude en el chat donde se construyó esta app para que añada la siguiente progresión (esta pantalla no puede avisarle sola).` });
  }

  // 8) Techo real de mancuernas: cuando el peso guardado de una familia
  // ya toca el máximo real que tienes en casa (state.dumbbellWeight, el
  // que fijaste en Ajustes) y esa familia lleva volumen extra acumulado
  // (señal de que ya rindes de sobra con ese peso), se sugiere la
  // variante equivalente con banda si existe — para no depender de poder
  // comprar mancuernas más pesadas para seguir progresando.
  const BAND_EQUIVALENT = { curl: 'curl_06', lat: 'lat_02' };
  const ceilingHits = [];
  Object.entries(state.exerciseLevels || {}).forEach(([id, rec]) => {
    const prefix = id.split('_')[0];
    if (!BAND_EQUIVALENT[prefix]) return;
    const ex = EXERCISES.find(e => e.id === id);
    if (!ex || ex.equip !== 'mancuernas') return;
    const hasCustomWeight = !!(state.exerciseWeights && state.exerciseWeights[prefix]);
    const currentWeight = hasCustomWeight ? state.exerciseWeights[prefix] : (ex.weight || state.dumbbellWeight || 0);
    // P2.6 — no considerar que existe un techo físico conocido cuando una
    // familia tiene un peso personalizado superior al máximo global. En ese
    // caso sabemos el peso configurado, pero no conocemos el techo real del
    // material; evitamos recomendar banda por un falso 'tope'.
    const globalCeiling = state.dumbbellWeight || 4;
    const ceilingIsKnown = !hasCustomWeight || currentWeight <= globalCeiling;
    const atRealCeiling = ceilingIsKnown && currentWeight >= globalCeiling;
    if (atRealCeiling && (rec.volumeBonus || 0) >= 3) {
      const bandEx = EXERCISES.find(e => e.id === BAND_EQUIVALENT[prefix]);
      if (bandEx) ceilingHits.push({ from: ex.name, to: bandEx.name });
    }
  });
  if (ceilingHits.length) {
    const h = ceilingHits[0];
    insights.push({ icon: '🎗️', tone: 'info', text: `${h.from} ya va sobrado con el peso de mancuerna que tienes — prueba "${h.to}" con la banda esta semana en su lugar. Tensión continua en vez de peso muerto, mejor estímulo real sin necesitar comprar más kilos.` });
  }

  const priority = { warn: 0, info: 1, good: 2 };
  // P2.5 — máximo 3 insights a la vez. Con 34+ familias activas y varias
  // cerca de techo de volumeBonus, sin este corte la lista puede llegar a
  // 7-8 avisos simultáneos y diluir el único que de verdad importa esta
  // semana. Se corta DESPUÉS de ordenar por prioridad (warn > info > good),
  // así el recorte nunca descarta un aviso urgente a favor de uno positivo.
  return insights.sort((a, b) => priority[a.tone] - priority[b.tone]).slice(0, 3);
}

// Dashboard de proporciones: referencia ESTÉTICA orientativa, no un
// objetivo médico ni una fórmula validada científicamente. Revisado con
// más fuentes a petición del usuario (agosto 2026):
// - Cintura ≈ 46% de la altura. Contrastado contra el ratio
//   cintura/altura (WHtR): un estudio en población físicamente activa
//   (militares) encontró que los deportistas de élite promedian un WHtR
//   ~0.45, y el rendimiento en pruebas de peso corporal (dominadas,
//   carrera) empieza a caer a partir de ~0.48-0.50 — 0.45-0.46 es un
//   rango de cintura "atlética" real, contrastado, no solo estético.
// - Pecho ≈ cintura × 1.35. Convención de proporción en V para un físico
//   equilibrado (más moderada que el "ratio áureo" hombro/cintura de
//   1.6:1 que se cita a veces, pensado para anchura de hombros, no
//   perímetro de pecho, y da objetivos poco realistas fuera de
//   competición).
// - Brazo relajado ≈ 19% de la altura (revisado desde 18%). LIMITACIÓN
//   IMPORTANTE encontrada al revisar: cualquier ratio basado solo en
//   altura ignora el tamaño de tu estructura ósea (complexión), y es
//   justo la crítica que hace la fórmula más rigurosa que existe en este
//   terreno (Casey Butt, basada en muñeca+tobillo+altura sobre
//   culturistas naturales de élite) — con más hueso de base, el mismo
//   objetivo de altura se queda corto. Sin tu medida de muñeca no se
//   puede aplicar esa fórmula con precisión, pero subir el ratio de 18%
//   a 19% acerca la referencia a lo esperable en una complexión atlética
//   como la tuya en vez de una media genérica. Ni Casey Butt ni ningún
//   otro de estos sistemas está validado científicamente de forma
//   independiente — son convenciones del culturismo natural, útiles como
//   orientación, no como objetivo clínico.
// Con 165cm de altura: cintura ~75,9cm, pecho ~102,5cm, brazo ~31,35cm.
function computeAestheticTargets(heightCm) {
  const waistTarget = heightCm * 0.46;
  const chestTarget = waistTarget * 1.35;
  const armTarget = heightCm * 0.19;
  return { waistTarget, chestTarget, armTarget };
}

// Referencia de peso — pedido explícito de subirla por encima de la media
// genérica por complexión atlética. El IMC (versión anterior de esta
// función) trata a todo el mundo igual independientemente de cuánto
// músculo tenga o pueda desarrollar — mala base para alguien entrenando
// fuerza 6 días/semana. Se sustituye por una referencia basada en FFMI
// (Fat-Free Mass Index — masa libre de grasa relativa a la altura), el
// indicador que sí usa el ámbito del entrenamiento de fuerza natural para
// esto: FFMI = masa magra(kg) / altura(m)². Un FFMI de 22 es un físico
// atlético visible; 23 es un físico atlético avanzado natural (techo
// natural aproximado ~25, con genética muy favorable). Se usa FFMI 23
// (extremo alto pero natural) al 12% de grasa corporal como referencia —
// no un mínimo, un físico "muy esculpido" de verdad:
//   masa magra = FFMI × altura(m)² = 23 × 1.65² ≈ 62.6kg
//   peso total = masa magra / (1 − %grasa) = 62.6 / 0.88 ≈ 71.1kg
// AVISO: esto tampoco es una fórmula médica ni universalmente validada —
// FFMI es una herramienta de referencia habitual en fuerza/musculación
// natural, no un estándar clínico. Sin datos reales de composición
// corporal (una DEXA o similar), es una estimación con margen de error.
function computeWeightTarget(heightCm) {
  const heightM = heightCm / 100;
  const ffmi = 23;
  const targetBodyFatPct = 0.12;
  const leanMassKg = ffmi * heightM * heightM;
  const weightTarget = leanMassKg / (1 - targetBodyFatPct);
  return { weightTarget, leanMassKg, targetBodyFatPct };
}

function TargetChart({ title, trend, targetValue, unit, color, lowerIsBetter, noteOverride, refLabel }) {
  if (trend.length < 1) return null;
  const w = 300, h = 110, pad = 10;
  const vals = trend.map(p => p.v).concat([targetValue]);
  const min = Math.min(...vals) - 1.5;
  const max = Math.max(...vals) + 1.5;
  const range = max - min || 1;
  const xFor = i => trend.length > 1 ? pad + (i / (trend.length - 1)) * (w - pad * 2) : w / 2;
  const yFor = v => h - pad - ((v - min) / range) * (h - pad * 2);
  const coords = trend.map((p, i) => [xFor(i), yFor(p.v)]);
  const path = coords.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const targetY = yFor(targetValue);
  const last = trend[trend.length - 1];
  const diff = last.v - targetValue;
  const onTarget = Math.abs(diff) < range * 0.08;
  const closerThanStart = trend.length > 1 ? Math.abs(diff) < Math.abs(trend[0].v - targetValue) : null;
  return html`
    <div class="target-chart-block">
      <div class="target-chart-header">
        <span>${title}</span>
        <span class=${onTarget ? 'target-chart-ontarget' : ''}>
          ${onTarget ? '🎯 En la referencia' : `${diff > 0 ? '+' : ''}${diff.toFixed(1)} ${unit} de la referencia`}
        </span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" class="target-chart-svg">
        <line x1=${pad} y1=${targetY} x2=${w - pad} y2=${targetY} stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4" />
        ${trend.length >= 2 ? html`<path d=${path} fill="none" stroke=${color} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />` : null}
        ${coords.map(([x, y], i) => html`<circle key=${i} cx=${x} cy=${y} r="3" fill=${color} />`)}
      </svg>
      <div class="target-chart-legend">
        <span><i class="tc-dot" style=${{ background: color }}></i>Tu evolución real</span>
        <span><i class="tc-dash"></i>${refLabel || 'Referencia estética'} (${targetValue.toFixed(1)}${unit})</span>
      </div>
      ${noteOverride ? html`<p class="target-chart-note">${noteOverride}</p>` : (trend.length > 1 && closerThanStart != null ? html`<p class="target-chart-note">${closerThanStart ? '✓ Te has acercado a la referencia desde que empezaste a registrar' : 'Aún más lejos de la referencia que al empezar a registrar'}</p>` : null)}
    </div>
  `;
}

function Sparkline({ points, color }) {
  if (points.length < 2) return null;
  const w = 280, h = 60, pad = 6;
  const vals = points.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const coords = points.map((p, i) => {
    const x = pad + (i / (points.length - 1)) * (w - pad * 2);
    const y = h - pad - ((p.v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const path = coords.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return html`
    <svg viewBox="0 0 ${w} ${h}" class="sparkline">
      <path d=${path} fill="none" stroke=${color} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      ${coords.map(([x, y], i) => html`<circle key=${i} cx=${x} cy=${y} r="2.5" fill=${color} />`)}
    </svg>
  `;
}

function MeasurementsCard({ state }) {
  const [, rerender] = useState(0);
  const [waistInput, setWaistInput] = useState('');
  const [weightInput, setWeightInput] = useState('');
  const [armInput, setArmInput] = useState('');
  const [chestInput, setChestInput] = useState('');
  const todayKey = new Date().toISOString().slice(0, 10);
  const list = [...(state.measurements || [])].sort((a, b) => a.date.localeCompare(b.date));
  const last = list[list.length - 1];
  const first = list[0];

  function handleSave() {
    const waistCm = parseFloat(waistInput.replace(',', '.'));
    if (!waistCm || waistCm < 50 || waistCm > 200) { alert('Introduce una cintura en cm válida (entre 50 y 200).'); return; }
    const weightKg = weightInput ? parseFloat(weightInput.replace(',', '.')) : (last ? last.weightKg : BIOTYPE.weightKg);
    // Brazo: a diferencia del peso, NO arrastramos el último valor si hoy
    // no se mide — se registra con menos frecuencia (mensual, como las
    // fotos) y arrastrar el valor anterior generaría puntos falsos de
    // "sin cambio" en el gráfico entre medidas reales.
    const armInputTrim = armInput.replace(',', '.');
    const armCm = armInputTrim ? parseFloat(armInputTrim) : null;
    if (armCm != null && (armCm < 15 || armCm > 60)) { alert('Introduce un diámetro de brazo en cm válido (entre 15 y 60).'); return; }
    // Pecho: mismo criterio de cadencia mensual que el brazo — objetivo
    // físico explícito del usuario (pecho caído por postura/edad), y sin
    // esto la única señal de "pecho" era la foto de progreso, subjetiva.
    // El contorno de pecho también capta indirectamente la mejora
    // postural (hombros hacia atrás = torácica más expandida = más cm).
    const chestInputTrim = chestInput.replace(',', '.');
    const chestCm = chestInputTrim ? parseFloat(chestInputTrim) : null;
    if (chestCm != null && (chestCm < 60 || chestCm > 160)) { alert('Introduce un contorno de pecho en cm válido (entre 60 y 160).'); return; }
    const filtered = (state.measurements || []).filter(m => m.date !== todayKey);
    const entry = { date: todayKey, waistCm, weightKg };
    if (armCm != null) entry.armCm = armCm;
    if (chestCm != null) entry.chestCm = chestCm;
    state.measurements = [...filtered, entry];
    saveState(state);
    setWaistInput(''); setWeightInput(''); setArmInput(''); setChestInput('');
    rerender(x => x + 1);
  }

  const waistPoints = list.map(m => ({ v: m.waistCm }));
  const weightPoints = list.filter(m => m.weightKg).map(m => ({ v: m.weightKg }));
  const armList = list.filter(m => m.armCm != null);
  const armPoints = armList.map(m => ({ v: m.armCm }));
  const chestList = list.filter(m => m.chestCm != null);
  const chestPoints = chestList.map(m => ({ v: m.chestCm }));
  const waistDelta = first && last && list.length > 1 ? (last.waistCm - first.waistCm) : null;
  const armDelta = armList.length > 1 ? (armList[armList.length - 1].armCm - armList[0].armCm) : null;
  const chestDelta = chestList.length > 1 ? (chestList[chestList.length - 1].chestCm - chestList[0].chestCm) : null;

  const targets = computeAestheticTargets(BIOTYPE.heightCm);
  const waistTrend = list.map(m => ({ date: m.date, v: m.waistCm }));
  const chestTrend = chestList.map(m => ({ date: m.date, v: m.chestCm }));
  const armTrend = armList.map(m => ({ date: m.date, v: m.armCm }));
  const weightTrend = list.filter(m => m.weightKg).map(m => ({ date: m.date, v: m.weightKg }));

  return html`
    <div class="progress-group measurements-card">
      <p class="group-title">Cintura, peso, brazo y pecho — el dato que de verdad mide el objetivo</p>
      <p class="settings-hint" style=${{ marginTop: 0 }}>Circuitos, tiempo y calorías miden el esfuerzo. Esto mide el resultado. Registra la cintura cada 1-2 semanas, siempre en el mismo momento (p.ej. en ayunas, por la mañana) para que sea comparable. Brazo y pecho mejor 1 vez al mes (como las fotos) — cambian más despacio y a diario solo meten ruido.</p>

      <div class="measure-input-row">
        <div class="measure-input-group">
          <label>Cintura (cm)</label>
          <input type="number" inputmode="decimal" placeholder=${last ? String(last.waistCm) : 'ej. 92'} value=${waistInput} onChange=${e => setWaistInput(e.target.value)} />
        </div>
        <div class="measure-input-group">
          <label>Peso (kg) · opcional</label>
          <input type="number" inputmode="decimal" placeholder=${last && last.weightKg ? String(last.weightKg) : String(BIOTYPE.weightKg)} value=${weightInput} onChange=${e => setWeightInput(e.target.value)} />
        </div>
      </div>
      <div class="measure-input-row">
        <div class="measure-input-group">
          <label>Brazo relajado (cm) · opcional, ~1 vez/mes</label>
          <input type="number" inputmode="decimal" placeholder=${armList.length ? String(armList[armList.length - 1].armCm) : 'ej. 30.5'} value=${armInput} onChange=${e => setArmInput(e.target.value)} />
        </div>
        <div class="measure-input-group">
          <label>Pecho (cm) · opcional, ~1 vez/mes</label>
          <input type="number" inputmode="decimal" placeholder=${chestList.length ? String(chestList[chestList.length - 1].chestCm) : 'ej. 96'} value=${chestInput} onChange=${e => setChestInput(e.target.value)} />
        </div>
      </div>
      <p class="settings-hint" style=${{ marginTop: '4px' }}>Brazo colgando pegado al cuerpo, sin flexionar, cinta métrica en el punto más grueso entre codo y hombro. Pecho: cinta métrica a la altura de las tetillas, respiración normal, sin sacar pecho ni encoger hombros. Siempre el mismo momento del día — el bombeo post-entreno puede añadir hasta 1cm falso en ambos.</p>
      <button class="btn-primary" onClick=${handleSave}>Guardar medida de hoy</button>

      ${list.length >= 2 ? html`
        <div class="measure-chart-block">
          <div class="measure-chart-header">
            <span>Cintura</span>
            <span class=${waistDelta != null && waistDelta < 0 ? 'measure-delta-good' : waistDelta != null && waistDelta > 0 ? 'measure-delta-bad' : ''}>
              ${waistDelta != null ? `${waistDelta > 0 ? '+' : ''}${waistDelta.toFixed(1)} cm desde el inicio` : ''}
            </span>
          </div>
          <${Sparkline} points=${waistPoints} color="var(--accent)" />
        </div>
        ${weightPoints.length >= 2 ? html`
          <div class="measure-chart-block">
            <div class="measure-chart-header"><span>Peso</span></div>
            <${Sparkline} points=${weightPoints} color="#7DD8FF" />
          </div>
        ` : null}
      ` : list.length === 1 ? html`<p class="settings-hint">Con la siguiente medida ya se verá la evolución aquí.</p>` : null}

      ${armPoints.length >= 2 ? html`
        <div class="measure-chart-block">
          <div class="measure-chart-header">
            <span>Brazo</span>
            <span class=${armDelta != null && armDelta > 0 ? 'measure-delta-good' : armDelta != null && armDelta < 0 ? 'measure-delta-bad' : ''}>
              ${armDelta != null ? `${armDelta > 0 ? '+' : ''}${armDelta.toFixed(1)} cm desde el inicio` : ''}
            </span>
          </div>
          <${Sparkline} points=${armPoints} color="#FF6B4A" />
        </div>
      ` : armPoints.length === 1 ? html`<p class="settings-hint">Con la siguiente medida de brazo ya se verá la evolución aquí.</p>` : null}

      ${chestPoints.length >= 2 ? html`
        <div class="measure-chart-block">
          <div class="measure-chart-header">
            <span>Pecho</span>
            <span class=${chestDelta != null && chestDelta > 0 ? 'measure-delta-good' : chestDelta != null && chestDelta < 0 ? 'measure-delta-bad' : ''}>
              ${chestDelta != null ? `${chestDelta > 0 ? '+' : ''}${chestDelta.toFixed(1)} cm desde el inicio` : ''}
            </span>
          </div>
          <${Sparkline} points=${chestPoints} color="#C8FF3D" />
        </div>
      ` : chestPoints.length === 1 ? html`<p class="settings-hint">Con la siguiente medida de pecho ya se verá la evolución aquí.</p>` : null}

      <div class="proportions-dashboard">
        <p class="group-title">¿Vas en buen camino? — referencia de proporciones</p>
        <p class="settings-hint" style=${{ marginTop: 0 }}>
          <strong>Importante:</strong> esto NO es un objetivo médico ni una fórmula validada científicamente — es una convención estética habitual en culturismo natural, calculada a partir de tu altura (165cm). Tiene una limitación real: ignora tu complexión ósea (la fórmula más rigurosa que existe en este terreno, Casey Butt, usa muñeca+tobillo además de altura precisamente por eso) — para una estructura atlética como la tuya, estos números pueden quedarse algo cortos. Referencia orientativa, no una meta que "cumplir". Tu progreso real (la cintura bajando, el pecho/brazo subiendo) importa más que tocar el número exacto.
        </p>
        ${waistTrend.length ? html`<${TargetChart} title="Cintura" trend=${waistTrend} targetValue=${targets.waistTarget} unit="cm" color="var(--accent)" /> ` : null}
        ${chestTrend.length ? html`<${TargetChart} title="Pecho" trend=${chestTrend} targetValue=${targets.chestTarget} unit="cm" color="#C8FF3D" />` : html`<p class="settings-hint">Añade una medida de pecho para ver aquí tu referencia.</p>`}
        ${armTrend.length ? html`<${TargetChart} title="Brazo" trend=${armTrend} targetValue=${targets.armTarget} unit="cm" color="#FF6B4A" />` : html`<p class="settings-hint">Añade una medida de brazo para ver aquí tu referencia.</p>`}
        ${weightTrend.length ? (() => {
          const wt = computeWeightTarget(BIOTYPE.heightCm);
          const trendingDown = weightTrend.length > 1 && weightTrend[weightTrend.length - 1].v < weightTrend[0].v;
          // Nota manual en vez de la automática "te has acercado/alejado":
          // para cintura/pecho/brazo, acercarse a la referencia es siempre
          // buena señal. Para el peso NO — la referencia (71kg) asume ya
          // estar en el 12% de grasa; mientras sigas perdiendo grasa antes
          // de una futura fase de ganancia muscular, ALEJARTE de esa
          // referencia hacia abajo es exactamente lo esperado y correcto,
          // no una señal de alarma. El mensaje automático habría sido
          // engañoso aquí.
          const note = trendingDown
            ? 'Bajando hacia esta referencia todavía no toca — primero se pierde grasa (donde estás ahora), después iría subiendo músculo hacia esta referencia en una fase futura. Que el peso baje ahora mismo es correcto, no una mala señal.'
            : 'El peso solo no dice si es grasa o músculo — mira cintura, pecho y brazo para saber en qué dirección te estás moviendo de verdad.';
          return html`
            <${TargetChart} title="Peso" trend=${weightTrend} targetValue=${wt.weightTarget} unit="kg" color="#7DD8FF" refLabel="Referencia atlética (FFMI 23 @ 12% grasa)" noteOverride=${note} />
          `;
        })() : null}
        <p class="settings-hint" style=${{ marginTop: 6 }}>
          <strong>Sobre la referencia de peso:</strong> subida por encima de la media genérica a propósito, por complexión atlética — en vez de IMC (que no distingue músculo de grasa y te habría puesto un "objetivo" más bajo de lo razonable para alguien entrenando fuerza), usa FFMI (masa magra relativa a tu altura), la referencia habitual en musculación natural: ~71kg reflejando un físico atlético avanzado natural al 12% de grasa, no un mínimo a alcanzar. Tampoco es una fórmula médica — estimación sin datos reales de composición corporal (una báscula de bioimpedancia o DEXA la afinaría). No es un número a perseguir bajando ni subiendo a la fuerza: es contexto para leer mejor tu propia línea.
        </p>
      </div>

      ${list.length > 0 ? html`
        <div class="measure-list">
          ${[...list].reverse().slice(0, 6).map(m => html`
            <div key=${m.date} class="measure-list-row">
              <span>${new Date(m.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}</span>
              <span>${m.waistCm} cm${m.weightKg ? ` · ${m.weightKg} kg` : ''}${m.armCm != null ? ` · brazo ${m.armCm}cm` : ''}${m.chestCm != null ? ` · pecho ${m.chestCm}cm` : ''}</span>
            </div>
          `)}
        </div>
      ` : null}
    </div>
  `;
}

// Vista combinada: pasos, sueño, calorías, cintura y peso alineados en el
// tiempo, para ver de un vistazo si todo evoluciona en la misma dirección
// y no solo un dato suelto. Se apoya en el mismo Sparkline que ya usa
// MeasurementsCard, para mantener el mismo lenguaje visual.
function HabitsKPIDashboard({ state }) {
  const kpi = useMemo(() => buildHabitsKPIs(state, 30), [state.stepsLog, state.sleepLog, state.calorieLog, state.measurements, state.stepsTarget]);
  const plateau = useMemo(() => detectPlateau(state, 21), [state.calorieLog, state.measurements]);
  const tdee = NUTRITION_TARGETS.tdee;

  // --- Calorías: ¿estás comiendo por debajo de tu gasto estimado o no? ---
  let kcalCard = null;
  if (kpi.kcalAvg7 != null) {
    const deficitGood = kpi.deficitAvg7 >= 0;
    kcalCard = {
      cls: deficitGood ? 'is-good' : 'is-over',
      title: '🍽️ Calorías vs objetivo',
      big: `${Math.round(kpi.kcalAvg7).toLocaleString('es-ES')} kcal/día de media`,
      sub: `Tu gasto estimado (TDEE) es de ${tdee.toLocaleString('es-ES')} kcal/día · objetivo del plan: ${NUTRITION_TARGETS.kcal.toLocaleString('es-ES')} kcal/día`,
      verdict: deficitGood
        ? `✅ Vas ${Math.round(kpi.deficitAvg7)} kcal/día por debajo de tu gasto estimado — sí, estás en déficit y deberías estar perdiendo grasa a este ritmo.`
        : `⚠️ Vas ${Math.abs(Math.round(kpi.deficitAvg7))} kcal/día por ENCIMA de tu gasto estimado — con esto no vas a bajar de peso, estás en superávit.`,
      note: `Basado en ${kpi.kcalLoggedDays7}/7 días de esta semana con calorías registradas.${kpi.extraActivityKcal7 > 0 ? ` Incluye ${kpi.extraActivityKcal7.toLocaleString('es-ES')} kcal de actividad extra (pádel, correr...) repartidas esta semana.` : ''}`,
    };
  }

  // --- Pasos: ¿el movimiento extra ayuda de verdad al déficit? ---
  let stepsCard = null;
  if (kpi.stepsAvg7 != null) {
    const ratio = kpi.stepsAvg7 / kpi.stepsTarget;
    const extraKcalEst = Math.round(kpi.stepsAvg7 * 0.045); // ~0.045 kcal/paso para 70kg — estimación, no precisa
    stepsCard = {
      cls: ratio >= 1 ? 'is-good' : ratio < 0.7 ? 'is-over' : '',
      title: '🚶 Pasos vs objetivo',
      big: `${kpi.stepsAvg7.toLocaleString('es-ES')} pasos/día de media`,
      sub: `Objetivo: ${kpi.stepsTarget.toLocaleString('es-ES')} pasos/día · gasto extra estimado por el movimiento: ~${extraKcalEst} kcal/día`,
      verdict: ratio >= 1
        ? '✅ Ritmo adecuado — este movimiento extra sí está sumando al déficit de forma real, más allá de lo que comes.'
        : ratio >= 0.7
          ? '🟡 Cerca del objetivo pero por debajo — hay margen para acelerar la pérdida sin tocar la comida, solo moviéndote un poco más.'
          : '⚠️ Bastante por debajo del objetivo — es la palanca más fácil de mejorar: con trabajo de escritorio, esto es lo que más rápido cambia el balance calórico.',
      note: `Basado en ${kpi.stepsLoggedDays7}/7 días de esta semana con pasos registrados.`,
    };
  }

  // --- Sueño: ¿duermes lo suficiente para recuperar de verdad a los 55? ---
  let sleepCard = null;
  if (kpi.sleepAvg7 != null) {
    sleepCard = {
      cls: kpi.sleepAvg7 >= SLEEP_GOAL_H ? 'is-good' : kpi.sleepAvg7 < 6 ? 'is-over' : '',
      title: '😴 Sueño vs recomendado',
      big: `${kpi.sleepAvg7.toFixed(1)}h de media por noche`,
      sub: `Recomendado ≥${SLEEP_GOAL_H}h a tus 55 años entrenando a diario, para que el cuerpo recupere de verdad entre sesiones.`,
      verdict: kpi.sleepAvg7 >= SLEEP_GOAL_H
        ? '✅ Duermes lo suficiente para recuperar bien — el entreno debería aprovecharse al máximo.'
        : kpi.sleepAvg7 >= 6
          ? '🟡 Un poco por debajo de lo recomendado — no es grave puntualmente, pero si se repite semana tras semana, la recuperación y el propio entreno se resienten.'
          : '⚠️ Claramente por debajo de lo recomendado — con déficit de sueño mantenido cuesta más recuperar entre sesiones y es más fácil que el entreno no rinda igual.',
      note: `Basado en ${kpi.sleepLoggedDays7}/7 noches de esta semana registradas.`,
    };
  }

  // --- Último registro de cintura/peso — visible SIEMPRE, aunque solo haya
  // una medición (antes se ocultaba hasta tener 2, y con 1 sola no se veía
  // nada de nada). La tendencia (evolución) sigue necesitando 2+ medidas,
  // pero el dato en sí no tiene por qué desaparecer mientras tanto. ---
  const measurements = [...(state.measurements || [])].sort((a, b) => a.date.localeCompare(b.date));
  const lastMeasure = measurements[measurements.length - 1];

  // --- Reconciliación: déficit declarado vs lo que confirma la báscula ---
  let verdict = null;
  if (kpi.theoreticalKgChange != null && kpi.actualKgChange != null) {
    const diff = Math.abs(kpi.theoreticalKgChange - kpi.actualKgChange);
    verdict = diff <= 0.5
      ? { cls: 'is-good', text: `Coherente: el déficit registrado y la báscula van en la misma línea (diferencia de ${diff.toFixed(1)}kg). El registro de comida parece fiable.` }
      : { cls: 'is-over', text: `Descuadre de ${diff.toFixed(1)}kg entre lo que dice el registro (${kpi.theoreticalKgChange.toFixed(1)}kg) y lo que mide la báscula (${kpi.actualKgChange.toFixed(1)}kg). Lo más probable es que se esté subestimando lo comido (extras sin marcar) o sobreestimando el gasto — no un "metabolismo lento".` };
  } else if (kpi.theoreticalKgChange != null) {
    verdict = { cls: '', text: `Déficit teórico estimado a partir de lo registrado: ${kpi.theoreticalKgChange.toFixed(1)}kg en 30 días. Con una segunda medición de peso podrás contrastarlo con la báscula.` };
  }

  let bodyCompNote = null;
  if (kpi.actualKgChange != null && kpi.waistChange != null && kpi.waistChange < -0.5 && kpi.actualKgChange > -0.3) {
    bodyCompNote = 'La cintura baja más que el peso total — apunta a pérdida de grasa localizada / recomposición, buena señal aunque la báscula apenas se mueva.';
  }

  const cards = [kcalCard, stepsCard, sleepCard].filter(Boolean);

  return html`
    <div class="progress-group hd-dashboard">
      <p class="group-title">Panel de control (última semana)</p>
      ${plateau && plateau.isPlateau ? html`
        <div class="plateau-card">
          <p class="plateau-title">📉 ¿Cintura estancada? Es normal, sigue así</p>
          <p class="plateau-text">Llevas ${plateau.spanDays} días con un déficit real de ~${Math.round(plateau.avgDeficit)} kcal/día y la cintura no ha bajado. Esto <strong>no significa que algo falle</strong> — retención de agua, glucógeno y fluctuación hormonal pueden tapar 2-3 semanas de progreso real que sí está ocurriendo por dentro. Si el déficit se mantiene, casi siempre se nota de golpe la semana siguiente. No es motivo para restringir más ni para tirar la toalla.</p>
        </div>
      ` : null}
      ${cards.length === 0 ? html`<p class="settings-hint" style=${{ marginTop: 0 }}>Registra calorías, pasos o sueño esta semana para ver aquí si el ritmo es el adecuado.</p>` : cards.map((c, i) => html`
        <div key=${i} class=${`hd-ratio-card ${c.cls}`}>
          <p class="hd-ratio-title">${c.title}</p>
          <p class="hd-ratio-big">${c.big}</p>
          <p class="hd-ratio-sub">${c.sub}</p>
          <p class="hd-ratio-verdict">${c.verdict}</p>
          <p class="hd-ratio-note">${c.note}</p>
        </div>
      `)}

      <p class="group-title" style=${{ marginTop: 16 }}>Cintura y peso</p>
      ${lastMeasure ? html`
        <div class="hd-ratio-card">
          <p class="hd-ratio-title">📏 Última medición (${new Date(lastMeasure.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })})</p>
          <p class="hd-ratio-big">${lastMeasure.waistCm} cm${lastMeasure.weightKg ? ` · ${lastMeasure.weightKg} kg` : ''}</p>
          ${measurements.length < 2 ? html`<p class="hd-ratio-sub">Con una segunda medición (en Progreso) ya se verá aquí la tendencia y se podrá contrastar con el déficit calórico.</p>` : html`
            <div class="measure-chart-block" style=${{ marginTop: 8 }}>
              <div class="measure-chart-header">
                <span>Cintura</span>
                <span class=${kpi.waistChange != null && kpi.waistChange < 0 ? 'measure-delta-good' : kpi.waistChange != null && kpi.waistChange > 0 ? 'measure-delta-bad' : ''}>
                  ${kpi.waistChange != null ? `${kpi.waistChange > 0 ? '+' : ''}${kpi.waistChange.toFixed(1)} cm en 30d` : ''}
                </span>
              </div>
              <${Sparkline} points=${measurements.filter(m => m.waistCm != null).map(m => ({ v: m.waistCm }))} color="var(--accent)" />
            </div>
            ${measurements.filter(m => m.weightKg).length >= 2 ? html`
              <div class="measure-chart-block">
                <div class="measure-chart-header">
                  <span>Peso</span>
                  <span class=${kpi.actualKgChange != null && kpi.actualKgChange < 0 ? 'measure-delta-good' : kpi.actualKgChange != null && kpi.actualKgChange > 0 ? 'measure-delta-bad' : ''}>
                    ${kpi.actualKgChange != null ? `${kpi.actualKgChange > 0 ? '+' : ''}${kpi.actualKgChange.toFixed(1)} kg en 30d` : ''}
                  </span>
                </div>
                <${Sparkline} points=${measurements.filter(m => m.weightKg).map(m => ({ v: m.weightKg }))} color="#7DD8FF" />
              </div>
            ` : null}
          `}
        </div>
      ` : html`<p class="settings-hint" style=${{ marginTop: 0 }}>Aún no hay ninguna medición. Añádela desde Progreso → Cintura y peso.</p>`}
      ${verdict ? html`<p class=${`habit-deficit-msg ${verdict.cls}`} style=${{ marginTop: 10 }}>⚖️ ${verdict.text}</p>` : null}
      ${bodyCompNote ? html`<p class="settings-hint" style=${{ marginTop: 6 }}>${bodyCompNote}</p>` : null}
    </div>
  `;
}

function HabitsEvolutionChart({ state }) {
  const evo = useMemo(() => buildHabitsEvolution(state, 30), [state.stepsLog, state.sleepLog, state.calorieLog]);

  // Cintura y peso ya se muestran arriba, en el panel de control (con el
  // último registro siempre visible aunque solo haya uno) — aquí se deja
  // solo lo que varía día a día: pasos, sueño y calorías.
  const metrics = [
    { key: 'steps', label: '🚶 Pasos', color: 'var(--accent)', fmt: v => v.toLocaleString('es-ES'), higherIsBetter: true },
    { key: 'sleep', label: '😴 Sueño', color: '#7DD8FF', fmt: v => `${v}h`, higherIsBetter: null },
    { key: 'kcal', label: '🍽️ Calorías', color: '#FFB37A', fmt: v => `${Math.round(v)} kcal`, higherIsBetter: null },
  ];
  const withData = metrics.filter(m => evo[m.key].length >= 2);

  return html`
    <div class="progress-group habit-evolution-card">
      <p class="group-title">Evolución día a día (últimos 30 días)</p>
      ${withData.length === 0 ? html`
        <p class="settings-hint" style=${{ marginTop: 0 }}>Aún no hay suficientes datos. En cuanto tengas al menos dos días registrados de pasos, sueño o calorías, aparecerá aquí su evolución.</p>
      ` : html`
        ${withData.map(m => {
          const pts = evo[m.key];
          const first = pts[0].v, last = pts[pts.length - 1].v;
          const delta = last - first;
          const deltaClass = m.higherIsBetter == null || delta === 0 ? '' : ((delta > 0) === m.higherIsBetter ? 'measure-delta-good' : 'measure-delta-bad');
          const deltaTxt = Number.isInteger(delta) ? delta : Number(delta.toFixed(1));
          return html`
            <div key=${m.key} class="measure-chart-block">
              <div class="measure-chart-header">
                <span>${m.label}</span>
                <span class=${deltaClass}>${deltaTxt > 0 ? '+' : ''}${deltaTxt} desde el primer registro</span>
              </div>
              <${Sparkline} points=${pts} color=${m.color} />
              <div class="measure-chart-footer">
                <span>${new Date(pts[0].date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })} · ${m.fmt(first)}</span>
                <span>${new Date(pts[pts.length - 1].date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })} · ${m.fmt(last)}</span>
              </div>
            </div>
          `;
        })}
      `}
    </div>
  `;
}

// Redimensiona/comprime la foto en el propio dispositivo antes de guardarla
// (canvas, máx. 900px de lado largo, JPEG calidad 0.72) — sin esto, doce
// fotos de móvil a resolución original podrían acercarse al límite de
// localStorage en unos meses. ~40-70KB por foto da margen de sobra para
// años, incluso exportando el histórico completo por archivo (Plan B).
function resizeImageFile(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

// Fotos de progreso: privadas, 100% locales (nunca se suben a ningún sitio,
// no hay servidor detrás de esta app). El ojo detecta cambios de tono y
// definición que la báscula y la cinta métrica no capturan — complemento
// visual real al dashboard numérico, no un sustituto.
// Guarda (o sustituye si ya hay una de hoy) una foto de progreso — extraído
// como función común para que tanto la cámara con temporizador como la
// entrada de archivo/galería compartan exactamente la misma lógica.
function savePhotoForToday(state, dataUrl) {
  const key = localDateKey();
  const idx = (state.progressPhotos || []).findIndex(p => p.date === key);
  const entry = { date: key, dataUrl };
  if (idx >= 0) state.progressPhotos[idx] = entry; else state.progressPhotos.push(entry);
  saveState(state);
}

// Captura el frame actual del <video> a un canvas, redimensionado/comprimido
// igual que resizeImageFile (mismo tope de 900px y calidad 0.72, mismo
// motivo: años de margen en localStorage). Si la cámara es frontal, se
// espeja para que la foto guardada coincida con lo que se vio en la
// vista previa mientras te colocabas — si no, izquierda/derecha
// quedarían invertidas respecto a lo que viste al posicionarte.
function captureVideoFrame(video, mirror, maxDim = 900, quality = 0.72) {
  const vw = video.videoWidth, vh = video.videoHeight;
  let w = vw, h = vh;
  if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
  else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

// Cámara en la propia app con cuenta atrás — a diferencia del <input
// type="file" capture>, que abre la app Cámara nativa (sin ningún control
// nuestro sobre ella, imposible añadirle temporizador), esto usa
// getUserMedia con vista previa en vivo dentro de la propia pantalla, así
// que sí se puede programar una cuenta atrás real antes de disparar.
//
// Aviso honesto: getUserMedia dentro de una PWA instalada en pantalla de
// inicio en iOS ha tenido históricamente más bugs que en Safari normal
// (como nos pasó con Wake Lock) — debería funcionar en iOS reciente, pero
// si falla el permiso o la cámara no arranca, se ofrece automáticamente
// la alternativa de siempre (cámara nativa / galería) sin bloquear nada.
function CameraCaptureScreen({ onBack, onCaptured }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState('user');
  const [ready, setReady] = useState(false);
  const [error, setError] = useState('');
  const [counting, setCounting] = useState(null); // null | segundos restantes
  const [flashing, setFlashing] = useState(false);

  async function startStream(mode) {
    setError(''); setReady(false);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
      setReady(true);
    } catch (e) {
      setError('No se pudo acceder a la cámara desde la app. Puedes usar la cámara del sistema como alternativa.');
    }
  }

  useEffect(() => {
    startStream(facing);
    return () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, [facing]);

  function doCapture() {
    if (!videoRef.current) return;
    const dataUrl = captureVideoFrame(videoRef.current, facing === 'user');
    setFlashing(true);
    setTimeout(() => setFlashing(false), 200);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    onCaptured(dataUrl);
  }

  function startCountdown(sec) {
    setCounting(sec);
  }
  useEffect(() => {
    if (counting == null) return;
    if (counting <= 0) { doCapture(); setCounting(null); return; }
    const t = setTimeout(() => setCounting(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [counting]);

  return html`
    <div class="screen camera-screen">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Foto de progreso</h1></header>
      ${error ? html`
        <p class="settings-hint" style=${{ marginTop: 0 }}>${error}</p>
        <button class="btn-secondary" onClick=${() => startStream(facing)}>Reintentar</button>
      ` : html`
        <div class="camera-preview-wrap">
          <video ref=${videoRef} playsInline muted class=${facing === 'user' ? 'mirrored' : ''} />
          ${flashing ? html`<div class="camera-flash"></div>` : null}
          ${counting != null && counting > 0 ? html`<div class="camera-countdown">${counting}</div>` : null}
        </div>
        <p class="settings-hint" style=${{ textAlign: 'center' }}>${ready ? 'Colócate en el encuadre y elige la cuenta atrás que necesites.' : 'Abriendo cámara…'}</p>
        <div class="camera-actions">
          <button class="btn-secondary" onClick=${() => setFacing(f => f === 'user' ? 'environment' : 'user')} disabled=${!ready}>🔄 Cambiar cámara</button>
          <button class="btn-secondary" onClick=${() => startCountdown(3)} disabled=${!ready || counting != null}>3s</button>
          <button class="btn-primary" onClick=${() => startCountdown(10)} disabled=${!ready || counting != null}>⏱ 10s (para colocarte)</button>
          <button class="btn-secondary" onClick=${doCapture} disabled=${!ready || counting != null}>Disparar ya</button>
        </div>
      `}
    </div>
  `;
}

function ProgressPhotos({ state, onBack, forceRender, onOpenCamera }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [viewing, setViewing] = useState(null);

  const photos = [...(state.progressPhotos || [])].sort((a, b) => a.date < b.date ? 1 : -1);
  const first = photos[photos.length - 1];
  const latest = photos[0];

  // Comparador con fecha elegible: por defecto primera vs última (igual
  // que antes), pero ahora seleccionable — con muchas fotos acumuladas a
  // lo largo de meses, comparar siempre contra el extremo absoluto pierde
  // valor frente a comparar tramos concretos (ej. "hace 1 mes vs hoy").
  // Los índices son sobre el array ordenado desc (0 = más reciente).
  const [compareLeftIdx, setCompareLeftIdx] = useState(photos.length - 1);
  const [compareRightIdx, setCompareRightIdx] = useState(0);
  const safeLeftIdx = Math.min(compareLeftIdx, photos.length - 1);
  const safeRightIdx = Math.min(compareRightIdx, photos.length - 1);
  const compareLeft = photos[safeLeftIdx];
  const compareRight = photos[safeRightIdx];

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setBusy(true);
    setErrorMsg('');
    try {
      const dataUrl = await resizeImageFile(file);
      savePhotoForToday(state, dataUrl);
      forceRender(x => x + 1);
    } catch (err) {
      setErrorMsg('No se pudo procesar la foto. Prueba de nuevo.');
    } finally {
      setBusy(false);
    }
  }

  function handleDelete(date) {
    state.progressPhotos = (state.progressPhotos || []).filter(p => p.date !== date);
    saveState(state); forceRender(x => x + 1);
    setViewing(null);
  }

  return html`
    <div class="screen">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Fotos de progreso</h1></header>
      <p class="cue-text">Privadas, solo en este dispositivo — nunca se suben a ningún sitio. Se incluyen si exportas tu progreso a archivo (Plan B), no en el código QR (demasiado grandes para eso).</p>

      <button class="btn-primary" onClick=${onOpenCamera}>📸 Hacer foto con temporizador</button>
      <input ref=${inputRef} type="file" accept="image/*" capture="environment" style=${{ display: 'none' }} onChange=${handleFile} />
      <button class="btn-secondary" style=${{ marginTop: 8 }} onClick=${() => inputRef.current && inputRef.current.click()} disabled=${busy}>${busy ? 'Procesando…' : 'O elegir con la cámara del sistema / galería'}</button>
      ${errorMsg ? html`<p class="sync-msg sync-err">${errorMsg}</p>` : null}

      ${photos.length >= 2 ? html`
        <div class="photo-compare">
          <p class="settings-label">Comparar</p>
          <div class="photo-compare-picker">
            <select value=${safeLeftIdx} onChange=${e => setCompareLeftIdx(parseInt(e.target.value, 10))}>
              ${photos.map((p, i) => html`<option key=${p.date} value=${i}>${new Date(p.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' })}</option>`)}
            </select>
            <span>vs</span>
            <select value=${safeRightIdx} onChange=${e => setCompareRightIdx(parseInt(e.target.value, 10))}>
              ${photos.map((p, i) => html`<option key=${p.date} value=${i}>${new Date(p.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' })}</option>`)}
            </select>
          </div>
          <div class="photo-compare-row">
            <div class="photo-compare-col">
              <img src=${compareLeft.dataUrl} onClick=${() => setViewing(compareLeft)} />
              <span>${new Date(compareLeft.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}</span>
            </div>
            <div class="photo-compare-col">
              <img src=${compareRight.dataUrl} onClick=${() => setViewing(compareRight)} />
              <span>${new Date(compareRight.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}</span>
            </div>
          </div>
          <button class="btn-secondary" style=${{ marginTop: 8 }} onClick=${() => { setCompareLeftIdx(photos.length - 1); setCompareRightIdx(0); }}>Volver a primera vs última</button>
        </div>
      ` : null}

      ${photos.length === 0 ? html`<p class="settings-hint">Aún no hay ninguna foto. La primera es la más importante — a partir de ahí todo se compara contra ella.</p>` : html`
        <p class="settings-label" style=${{ marginTop: 18 }}>Todas (${photos.length})</p>
        <div class="photo-grid">
          ${photos.map(p => html`
            <button key=${p.date} class="photo-grid-item" onClick=${() => setViewing(p)}>
              <img src=${p.dataUrl} />
              <span>${new Date(p.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}</span>
            </button>
          `)}
        </div>
      `}

      ${viewing ? html`
        <div class="photo-viewer" onClick=${() => setViewing(null)}>
          <img src=${viewing.dataUrl} onClick=${e => e.stopPropagation()} />
          <p>${new Date(viewing.date + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'long' })}</p>
          <button class="btn-secondary" onClick=${e => { e.stopPropagation(); handleDelete(viewing.date); }}>Eliminar esta foto</button>
        </div>
      ` : null}
    </div>
  `;
}

// Progresión de fuerza por familia — auditoría experta agosto 2026:
// existía el nivel actual (foto fija) pero no cómo se ha llegado hasta
// ahí. Reconstruye la línea histórica recorriendo `history` en orden
// cronológico y llevando el máximo acumulado (mismo criterio que
// getFamilyLevel, pero aplicado en cada punto del tiempo en vez de solo
// al final) — así una subida de nivel se ve como escalón real en el
// gráfico, no como un número suelto.
function computeFamilyLevelHistory(history, prefix) {
  const relevant = (history || [])
    .filter(h => h.exerciseId && h.exerciseId.split('_')[0] === prefix && h.levelAfter != null)
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));
  let maxLevel = 0;
  const points = [];
  for (const h of relevant) {
    if (h.levelAfter > maxLevel) maxLevel = h.levelAfter;
    points.push({ date: h.date.slice(0, 10), v: maxLevel });
  }
  return points;
}

function StrengthProgressCard({ state }) {
  const familiesWithData = useMemo(() => {
    const counts = {};
    (state.history || []).forEach(h => {
      if (!h.exerciseId) return;
      const prefix = h.exerciseId.split('_')[0];
      counts[prefix] = (counts[prefix] || 0) + 1;
    });
    return Object.keys(counts).filter(p => counts[p] >= 2).sort();
  }, [state.history]);
  const FAMILY_LABELS = {
    bpress: 'Press de pecho', fly: 'Aperturas de pecho', press: 'Press de hombro', pu: 'Flexiones',
    row: 'Remo', retract: 'Retracción escapular', ytw: 'Y-T-W', rotator: 'Rotador (manguito)', wrist: 'Antebrazo',
    curl: 'Curl bíceps', tricep: 'Tríceps', lat: 'Elevación lateral', dip: 'Fondos',
    sq: 'Sentadilla', lu: 'Zancada', slu: 'Zancada lateral', stepup: 'Step-up', hip: 'Puente/cadera', hipabd: 'Glúteo medio',
    calf: 'Gemelo', plank: 'Plancha', deadbug: 'Dead bug', bird: 'Bird dog', hollow: 'Hollow hold', pike: 'Pike',
  };
  const [selected, setSelected] = useState(familiesWithData.includes('bpress') ? 'bpress' : familiesWithData[0]);

  if (!familiesWithData.length) return null;
  const points = computeFamilyLevelHistory(state.history, selected);
  const first = points[0], last = points[points.length - 1];
  return html`
    <div class="progress-group strength-progress-card">
      <p class="group-title">Progresión de fuerza por familia</p>
      <select class="strength-family-select" value=${selected} onChange=${e => setSelected(e.target.value)}>
        ${familiesWithData.map(p => html`<option key=${p} value=${p}>${FAMILY_LABELS[p] || p}</option>`)}

        <${Sparkline} points=${points} color="var(--accent)" />

      ` : html`<p class="settings-hint">Todavía no hay suficiente historial de esta familia para ver una línea — vuelve cuando tengas un par de sesiones más.</p>`}
    </div>
  `;
}


// =====================================================================
// P1.4 — VOLUMEN EFECTIVO POR GRUPO MUSCULAR (7 / 14 días)
// No modifica el historial: solo lo interpreta. `history` conserva una
// entrada por ejercicio y sus series con reps/RPE. Cada serie recibe un
// factor de efectividad conservador según el RPE y, cuando un ejercicio
// tiene varios focos, la serie se reparte entre ellos. Así evitamos que
// una serie multiarticular cuente como una serie completa para cada músculo.
// =====================================================================
const EFFECTIVE_VOLUME_FOCUS = {
  sq:['Cuádriceps','Glúteos'], lu:['Cuádriceps','Glúteos'], slu:['Glúteos'], stepup:['Cuádriceps','Glúteos'],
  hip:['Glúteos','Isquios'], hipabd:['Glúteo medio'], calf:['Gemelos'],
  pu:['Pecho','Tríceps'], bpress:['Pecho','Tríceps'], dip:['Pecho','Tríceps'], fly:['Pecho'],
  press:['Hombros','Tríceps'], pike:['Hombros','Tríceps'], lat:['Hombros'],
  row:['Espalda','Bíceps'], retract:['Espalda'], ytw:['Espalda','Hombros'], rotator:['Hombros'],
  curl:['Bíceps','Antebrazo'], tricep:['Tríceps'], wrist:['Antebrazo'], carry:['Antebrazo'],
  plank:['Core'], deadbug:['Core'], bird:['Core'], hollow:['Core'],
};
function effectiveSetFactor(rpe){
  const r=Number(rpe);
  if(!Number.isFinite(r)) return 0.85;
  if(r < 6) return 0.50;
  if(r < 7) return 0.75;
  if(r < 8) return 0.90;
  if(r <= 9) return 1.00;
  return 0.75;
}
function computeEffectiveVolume(state, days){
  const cutoff=Date.now()-days*24*60*60*1000;
  const totals={};
  let effectiveTotal=0, rawSets=0;
  (state.history||[]).forEach(h=>{
    const t=new Date(h.date).getTime();
    if(!Number.isFinite(t)||t<cutoff||!h.exerciseId) return;
    const prefix=h.exerciseId.split('_')[0];
    const focuses=EFFECTIVE_VOLUME_FOCUS[prefix];
    if(!focuses||!focuses.length) return;
    const sets=Array.isArray(h.setsDone)?h.setsDone:[];
    if(!sets.length) return;
    const share=1/focuses.length;
    sets.forEach(set=>{
      const factor=effectiveSetFactor(set.rpe);
      rawSets += 1; effectiveTotal += factor;
      focuses.forEach(f=>{ totals[f]=(totals[f]||0)+factor*share; });
    });
  });
  const rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const max=rows.length?rows[0][1]:0;
  return {rows,max,effectiveTotal,rawSets};
}
function EffectiveVolumeCard({state}){
  const [days,setDays]=useState(7);
  const data=useMemo(()=>computeEffectiveVolume(state,days),[state.history,days]);
  const hasData=data.rows.length>0;
  return html`
    <div class="progress-group effective-volume-card">
      <p class="group-title">Volumen efectivo por músculo</p>
      <div class="volume-window-tabs">
        <button class=${`volume-window-btn ${days===7?'is-active':''}`} onClick=${()=>setDays(7)}>7 días</button>
        <button class=${`volume-window-btn ${days===14?'is-active':''}`} onClick=${()=>setDays(14)}>14 días</button>
      </div>
      ${hasData ? html`
        <div class="volume-summary">
          <div><div class="volume-total">${data.effectiveTotal.toFixed(1)}</div><div class="volume-total-label">series efectivas estimadas</div></div>
          <div class="volume-row-meta">${data.rawSets} series registradas</div>
        </div>
        <div class="volume-list">
          ${data.rows.map(([name,value])=>html`
            <div class="volume-row" key=${name}>
              <div>
                <div class="volume-row-name">${name}</div>
                <div class="volume-bar"><div class="volume-bar-fill" style=${{width:`${data.max?Math.max(3,(value/data.max)*100):0}%`}}></div></div>
              </div>
              <div class="volume-row-value">${value.toFixed(1)}</div>
            </div>
          `)}
        </div>
        <p class="volume-note">Estimación basada en las series realmente registradas y su RPE; en ejercicios con varios focos, cada serie se reparte entre ellos. No cambia niveles ni modifica tu historial.</p>
      ` : html`<p class="settings-hint">Todavía no hay series registradas en los últimos ${days} días. Cuando completes entrenamientos, aquí verás dónde estás acumulando más trabajo y qué zonas reciben menos.</p>`}
    </div>
  `;
}

// P2.6 — techo de carga: respeta pesos personalizados por familia y no
// inventa un límite físico cuando el peso personalizado supera el máximo global.
// P2.4 — detección conservadora de meseta por familia. Requiere al menos
// 3 exposiciones comparables (mismo ejercicio, fase, nivel y, cuando está
// registrado, misma carga). Las entradas históricas antiguas sin weightUsed
// siguen siendo válidas para análisis, pero no se mezclan con exposiciones
// nuevas que sí tengan una carga distinta. No modifica niveles ni historial.
function getFamilyPlateauCandidates(state, days = 60) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  const groups = {};
  (state.history || []).forEach(h => {
    const t = new Date(h.date).getTime();
    if (!Number.isFinite(t) || t < cutoff || !h.exerciseId || !Array.isArray(h.setsDone)) return;
    const valid = h.setsDone.filter(x => Number.isFinite(Number(x.reps)) && Number.isFinite(Number(x.rpe)));
    if (valid.length < 2 || h.levelBefore == null) return;
    const ex = EXERCISES.find(e => e.id === h.exerciseId);
    if (!ex) return;
    const weightKey = h.weightUsed != null ? `w:${Number(h.weightUsed)}` : 'w:legacy';
    const key = `${h.exerciseId}|p:${h.phase}|l:${h.levelBefore}|${weightKey}`;
    if (!groups[key]) groups[key] = { exerciseId: h.exerciseId, phase: h.phase, level: h.levelBefore, weightUsed: h.weightUsed ?? null, rows: [] };
    const avgReps = valid.reduce((a, x) => a + Number(x.reps), 0) / valid.length;
    const avgRpe = valid.reduce((a, x) => a + Number(x.rpe), 0) / valid.length;
    groups[key].rows.push({ date: h.date, avgReps, avgRpe, levelAfter: h.levelAfter });
  });

  const results = [];
  Object.values(groups).forEach(g => {
    g.rows.sort((a, b) => a.date.localeCompare(b.date));
    if (g.rows.length < 3) return;
    const last3 = g.rows.slice(-3);
    const first = last3[0], last = last3[2];
    const repsChangePct = first.avgReps > 0 ? ((last.avgReps - first.avgReps) / first.avgReps) * 100 : 0;
    const rpeChange = last.avgRpe - first.avgRpe;
    const noLevelProgress = last3.every(r => Number(r.levelAfter) <= Number(g.level));
    // Meseta = rendimiento prácticamente plano o peor y sin alivio de RPE.
    // Un aumento de reps >=5% o una bajada clara de RPE invalida la señal.
    const plateau = noLevelProgress && repsChangePct < 5 && rpeChange > -0.35;
    if (!plateau) return;
    const ex = EXERCISES.find(e => e.id === g.exerciseId);
    if (!ex) return;
    results.push({
      family: g.exerciseId.split('_')[0], exerciseId: g.exerciseId,
      name: ex.name, phase: g.phase, level: g.level, weightUsed: g.weightUsed,
      exposures: last3.length, firstDate: first.date.slice(0, 10), lastDate: last.date.slice(0, 10),
      firstReps: first.avgReps, lastReps: last.avgReps,
      firstRpe: first.avgRpe, lastRpe: last.avgRpe,
      repsChangePct, rpeChange
    });
  });
  return results.sort((a, b) => b.lastDate.localeCompare(a.lastDate));
}

// P2.8 — calidad de progresión: resume las decisiones reales del motor en
// las últimas 12 exposiciones. Es una lectura de consistencia, no una orden
// automática de cambiar el entrenamiento.
function getProgressionQuality(state, limit = 12) {
  const rows = (state.progressDecisionLog || [])
    .filter(r => r && ['progress_variant','ceiling_volume_limited','ceiling_maintain','maintain','regress'].includes(r.decision))
    .slice(-limit);
  if (!rows.length) return null;
  const counts = { progress: 0, maintain: 0, regress: 0 };
  let rpeSum = 0, rpeN = 0;
  rows.forEach(r => {
    if (r.decision === 'progress_variant') counts.progress++;
    else if (r.decision === 'regress') counts.regress++;
    else counts.maintain++;
    if (Number.isFinite(Number(r.avgRpe))) { rpeSum += Number(r.avgRpe); rpeN++; }
  });
  const avgRpe = rpeN ? rpeSum / rpeN : null;
  const regressPct = counts.regress / rows.length;
  let tone = 'good', label = 'Progresión consistente';
  let text = 'La mayoría de decisiones recientes han sido de mantenimiento o progresión, sin una señal clara de que el motor esté exigiendo demasiado.';
  if (regressPct >= 0.34 && avgRpe != null && avgRpe >= 8.2) {
    tone = 'warn';
    label = 'Conviene vigilar la exigencia';
    text = 'Hay varias regresiones recientes acompañadas de RPE relativamente alto. Antes de buscar más dificultad, conviene consolidar técnica y recuperación.';
  } else if (regressPct >= 0.25) {
    tone = 'mid';
    label = 'Progresión con alguna dificultad';
    text = 'Aparecen algunas regresiones, pero no suficientes por sí solas para justificar un cambio del plan. Observa si se repiten en las mismas familias.';
  } else if (counts.progress === 0 && counts.maintain >= Math.ceil(rows.length * 0.75)) {
    tone = 'mid';
    label = 'Progresión lenta';
    text = 'La mayoría de exposiciones recientes se mantienen en el mismo nivel. Esto puede ser normal durante una fase intensa; solo merece revisión si también aparecen mesetas repetidas.';
  }
  return { rows, counts, avgRpe, regressPct, tone, label, text };
}
function ProgressionQualityCard({ state }) {
  const data = useMemo(() => getProgressionQuality(state, 12), [state.progressDecisionLog]);
  if (!data) return html`
