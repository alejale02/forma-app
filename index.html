function useFlip(period) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setOn(o => !o), period);
    return () => clearInterval(id);
  }, [period]);
  return on;
}

// Visual de un ejercicio: foto real (flipbook 2 fotogramas) si existe
// una correspondencia verificada para ESE ejercicio exacto; si no, la
// silueta animada por FK como respaldo (nunca se rompe la pantalla ni
// se repite la foto de otro ejercicio distinto).
// Divide el texto de ejecución en pasos numerados — no hay guiones escritos
// a mano por ejercicio (47 ejercicios sería inmantenible), así que se separa
// por frases; en la práctica da 2-4 pasos claros por ejercicio, que es
// justo el nivel de detalle que cabe bien en una pantalla de móvil.
function splitCueSteps(cue) {
  return (cue || '').split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ])/).map(s => s.trim()).filter(Boolean);
}

function ExerciseDetailModal({ ex, onClose }) {
  const steps = splitCueSteps(ex.cue);
  return html`
    <div class="modal-overlay" onClick=${onClose}>
      <div class="modal-card exercise-detail-card" onClick=${e => e.stopPropagation()}>
        <button class="modal-close" onClick=${onClose} aria-label="Cerrar">✕</button>
        <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${220} />
        <h2 style=${{ marginTop: 10 }}>${ex.name}</h2>
        <div class="target-chips" style=${{ marginBottom: 4 }}>
          <span class="chip">${ex.equip === 'mancuernas' ? `Mancuernas ${ex.weight}kg` : ex.equip === 'mochila' ? `Mochila ${ex.weight}kg` : ex.equip === 'banda' ? 'Banda elástica' : 'Peso corporal'}</span>
          <span class="chip">Tempo ${ex.tempo}</span>
          <span class="chip">${ex.isTimeBased ? `${ex.targetReps ?? ex.baseReps}s` : `${ex.targetReps ?? ex.baseReps} reps`}</span>
        </div>
        <p class="exercise-detail-title">Cómo se hace</p>
        <ol class="exercise-detail-steps">
          ${steps.map((s, i) => html`<li key=${i}><span class="exercise-detail-stepnum">${i + 1}</span><span class="exercise-detail-steptext">${s}</span></li>`)}
        </ol>
        <button class="btn-primary btn-huge" onClick=${onClose}>Entendido</button>
      </div>
    </div>
  `;
}

function ExerciseVisual({ exId, iconKey, size = 150 }) {
  const entry = EXERCISE_TO_PHOTO[exId];
  const [broken, setBroken] = useState(false);
  const flip = useFlip(750);
  if (!entry || broken) return html`<${Figure} iconKey=${iconKey} size=${size} />`;
  if (typeof entry === 'object') {
    return html`
      <div class="photo-wrap" style=${{ width: size, height: size }}>
        <img src=${entry.url} alt="" style=${{ background: '#fff', objectFit: 'contain', padding: '8px' }} onError=${() => setBroken(true)} />
        ${entry.credit ? html`<span class="photo-credit">${entry.credit}</span>` : null}
      </div>
    `;
  }
  return html`
    <div class="photo-wrap" style=${{ width: size, height: size }}>
      <img src=${`${PHOTO_BASE}${entry}/${flip ? 1 : 0}.jpg`} alt="" onError=${() => setBroken(true)} />
    </div>
  `;
}

function Figure({ iconKey, size = 140, phase, vivid = true }) {
  const poseKey = ICON_TO_POSE[iconKey] || 'vacuum';
  const t = useFigureLoop(1450, phase == null);
  const p = phase != null ? phase : triWave(t);
  const svg = buildFigureMarkup(poseKey, p, vivid);
  return html`<div class="figure-wrap" style=${{ width: size, height: size * 1.25 }}>
    <svg viewBox="0 0 120 150" style=${{ width: '100%', height: '100%' }} dangerouslySetInnerHTML=${{ __html: svg }} />
  </div>`;
}

// Construye el SVG completo (torso + cabeza + 2 brazos + 2 piernas) por FK real,
// con gradientes de volumen, articulaciones redondeadas, manos/pies y sombra
// de suelo para una lectura mucho más realista del movimiento.
function buildFigureMarkup(poseKey, phase, vivid) {
  const cfg = FIG_POSES[poseKey] || FIG_POSES.vacuum;
  const A = cfg.A, B = cfg.B;
  const torso = lerp(A.torso, B.torso, phase), dy = lerp(A.dy, B.dy, phase);
  const legL = pairL(A.legL, B.legL, phase), legR = pairL(A.legR, B.legR, phase);
  const armL = pairL(A.armL, B.armL, phase), armR = pairL(A.armR, B.armR, phase);
  const orient = A.orient || 0;
  const { hipY, shY, headR, thigh, shin, uarm, farm, hipDx, shDx } = FIG;
  const torsoLen = hipY - shY;
  const lLeg = fkPoint(0, 0, thigh, legL[0], shin, legL[1]);
  const rLeg = fkPoint(0, 0, thigh, legR[0], shin, legR[1]);
  const lArm = fkPoint(0, 0, uarm, armL[0], farm, armL[1]);
  const rArm = fkPoint(0, 0, uarm, armR[0], farm, armR[1]);
  const bodyC = vivid ? 'url(#gBody)' : 'var(--text-dim)';
  const armC = vivid ? 'url(#gArm)' : 'var(--text-dim)';
  const legC = vivid ? 'url(#gLeg)' : 'var(--text-dim)';
  const belly = poseKey === 'vacuum' ? `<ellipse cx="0" cy="${-torsoLen * 0.42}" rx="${lerp(14, 7, triWave((phase + 0.5) % 1))}" ry="9" fill="var(--bg)" opacity="0.6"/>` : '';
  const lFootAng = legL[0] + legL[1], rFootAng = legR[0] + legR[1];
  const defs = `
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.body}"/><stop offset="100%" stop-color="${COL.bodyDark}"/>
      </linearGradient>
      <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${COL.arm}"/><stop offset="100%" stop-color="${COL.armDark}"/>
      </linearGradient>
      <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.leg}"/><stop offset="100%" stop-color="${COL.legDark}"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  const shadow = `<ellipse cx="60" cy="132" rx="${orient !== 0 ? 40 : 26}" ry="7" fill="url(#gShadow)"/>`;
  return `
    ${defs}
    ${shadow}
    <g transform="translate(60 ${hipY + dy}) rotate(${orient} 0 ${-dy})">
      <line x1="${-hipDx}" y1="0" x2="${lLeg.mx}" y2="${lLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${lLeg.mx - hipDx}" y1="${lLeg.my}" x2="${lLeg.ex - hipDx}" y2="${lLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${lLeg.mx - hipDx * 0.5}" cy="${lLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${lLeg.ex - hipDx + 6 * Math.sin(lFootAng * Math.PI / 180)}" cy="${lLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${lFootAng * 0.4} ${lLeg.ex - hipDx} ${lLeg.ey})"/>
      <line x1="${hipDx}" y1="0" x2="${rLeg.mx}" y2="${rLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${rLeg.mx + hipDx}" y1="${rLeg.my}" x2="${rLeg.ex + hipDx}" y2="${rLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${rLeg.mx + hipDx * 0.5}" cy="${rLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${rLeg.ex + hipDx + 6 * Math.sin(rFootAng * Math.PI / 180)}" cy="${rLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${rFootAng * 0.4} ${rLeg.ex + hipDx} ${rLeg.ey})"/>
      <g transform="rotate(${torso})">
        <rect x="-6" y="${-torsoLen - 8}" width="12" height="12" rx="5" fill="${bodyC}"/>
        <path d="M -21,${-torsoLen + 2} Q -22,${-torsoLen - 6} -12,${-torsoLen - 9} Q 0,${-torsoLen - 12} 12,${-torsoLen - 9} Q 22,${-torsoLen - 6} 21,${-torsoLen + 2} L 14,-6 Q 15,4 8,10 L -8,10 Q -15,4 -14,-6 Z" fill="${bodyC}"/>

function fmtTime(s) { const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec.toString().padStart(2, '0')}`; }
function useCountdown(initial, onComplete, running) {
  const [remaining, setRemaining] = useState(initial);
  const cb = useRef(onComplete); cb.current = onComplete;
  const prevRunning = useRef(false);
  // Al activarse (running pasa de false a true), el valor debe partir SIEMPRE
  // de `initial`, nunca del remanente de la vez anterior (p.ej. el "0" con el
  // que terminó el ciclo pasado). Corregirlo aquí, durante el render, evita
  // que el efecto de abajo llegue a ver ese remanente y se autocomplete al
  // instante — que es lo que provocaba el salto de un ejercicio entero al
  // pulsar "Saltar descanso" (un fix anterior que solo corregía esto dentro
  // de un useEffect no bastaba: ambos efectos del mismo hook se ejecutan en
  // la misma pasada de render con el valor todavía obsoleto). Verificado con
  // un arnés de pruebas real (React + temporizadores simulados) antes de
  // aplicar este cambio.
  let effectiveRemaining = remaining;
  if (running && !prevRunning.current && remaining !== initial) {
    setRemaining(initial);
    effectiveRemaining = initial;
  }
  prevRunning.current = running;
  useEffect(() => {
    if (!running) return;
    if (effectiveRemaining <= 0) { cb.current && cb.current(); return; }
    const t = setTimeout(() => setRemaining(r => r - 1), 1000);
    return () => clearTimeout(t);
  }, [effectiveRemaining, running]);
  return [effectiveRemaining, setRemaining];
}

// Resumen de un vistazo en la Home: antes había que entrar en Hábitos para
// saber "¿voy bien esta semana?" — estos 3 números son los que de verdad
// resumen la semana (déficit real, si te mueves lo suficiente, si duermes
// lo bastante para recuperar), tocables para ir directo al detalle.
function HomeGlanceStrip({ state, onOpenHabitos }) {
  const kpi = useMemo(() => buildHabitsKPIs(state, 30), [state.stepsLog, state.sleepLog, state.calorieLog, state.stepsTarget]);
  const hasAnyData = kpi.kcalAvg7 != null || kpi.stepsAvg7 != null || kpi.sleepAvg7 != null;
  if (!hasAnyData) {
    return html`<p class="home-glance-empty" onClick=${onOpenHabitos}>Registra pasos, sueño o calorías en Hábitos para ver aquí tu resumen de la semana →</p>`;
  }
  const deficitGood = kpi.deficitAvg7 != null && kpi.deficitAvg7 >= 0;
  const tiles = [
    kpi.deficitAvg7 != null ? { val: `${deficitGood ? '−' : '+'}${Math.abs(Math.round(kpi.deficitAvg7))}`, label: deficitGood ? 'kcal/día déficit' : 'kcal/día superávit', cls: deficitGood ? 'is-good' : 'is-over' } : null,
    kpi.stepsAvg7 != null ? { val: kpi.stepsAvg7.toLocaleString('es-ES'), label: 'pasos/día media', cls: kpi.stepsAvg7 >= kpi.stepsTarget ? 'is-good' : kpi.stepsAvg7 < kpi.stepsTarget * 0.7 ? 'is-over' : '' } : null,
    kpi.sleepAvg7 != null ? { val: `${kpi.sleepAvg7.toFixed(1)}h`, label: 'sueño medio', cls: kpi.sleepAvg7 >= SLEEP_GOAL_H ? 'is-good' : kpi.sleepAvg7 < 6 ? 'is-over' : '' } : null,
  ].filter(Boolean);
  return html`
    <button class="home-glance" onClick=${onOpenHabitos}>
      ${tiles.map((t, i) => html`
        <div key=${i} class=${`home-glance-tile ${t.cls}`}>
          <span class="home-glance-val">${t.val}</span>
          <span class="home-glance-label">${t.label}</span>
        </div>
      `)}
    </button>
  `;
}

function Home({ state, onStart, onOpenProgress, onOpenSettings, onOpenWeekPlan, onOpenNutrition, onOpenHabitos, todaySession, onSetRounds, onReviewWeightsNow, onSnoozeWeights, onStartMorningHypo, onReviewPhotosNow, onSnoozePhotos, onBackupNow, onSnoozeBackup }) {
  const phase = PHASES[state.cycleWeek];
  const sessionsInWeek = state.totalSessionsDone % 6;
  const jsDay = new Date().getDay();
  const isoDay = jsDay === 0 ? 7 : jsDay;
  const isRestDay = isoDay === REST_DAY;

  // "Hoy" en la vista previa NO es "el día de calendario de hoy" sino "la
  // próxima sesión según el contador de sesiones" (totalSessionsDone), que
  // avanza en cuanto terminas un circuito — y con él, a veces también la
  // fase (cada 6 sesiones). Sin este control, justo después de entrenar la
  // Home vuelve a mostrar "Empezar circuito de hoy" pero con la SIGUIENTE
  // sesión de la rotación, dando la falsa impresión de que hay que hacer
  // dos entrenos el mismo día.
  const todayKeyHome = localDateKey();
  // La rutina matutina (hipopresivos en solitario) también deja una entrada
  // en sessionLog, marcada con standalone:true — no cuenta como "circuito
  // de hoy hecho", solo el circuito de fuerza real (rounds > 0) debe activar
  // esta tarjeta. Sin este filtro, hacer solo la rutina matutina ya bloqueaba
  // el circuito del día como si estuviera completado.
  const todayLogEntry = [...(state.sessionLog || [])].reverse().find(s => !s.standalone && localDateKey(new Date(s.date)) === todayKeyHome);
  // Un circuito real completado cuenta siempre, sea domingo o no — antes
  // excluía el domingo a propósito, lo que provocaba justo la confusión de
  // "si entreno en domingo para recuperar un día perdido, ¿me lo cuenta o
  // sigue diciendo que toca descanso?". Ahora si entrenas en domingo, se
  // registra y se reconoce exactamente igual que cualquier otro día.
  const alreadyTrainedToday = !!todayLogEntry;
  const [trainAnyway, setTrainAnyway] = useState(false);

  // --- Aviso automático de revisión de peso: cada 4 semanas al arrancar
  // Volumen tras el Descarga (mejor momento fisiológico para probar más
  // carga), y como red de seguridad, también si pasan 14 días sin revisar
  // aunque no haya coincidido con el cambio de fase. Se puede posponer 3
  // días sin perder el aviso de fondo. */
  const today = new Date().toISOString().slice(0, 10);
  const daysSinceReview = Math.floor((new Date(today) - new Date(state.lastWeightReviewDate)) / 86400000);
  const snoozed = state.weightReviewSnoozeUntil && state.weightReviewSnoozeUntil > today;
  const showWeightReminder = !snoozed && (state.weightReviewDue || daysSinceReview >= 14);

  // --- Aviso de foto de progreso mensual: cadencia de ~30 días, con
  // recordatorio pospuesto 5 días si se pide. Independiente del de peso
  // (cadencia y motivo distintos) para no mezclar dos avisos en el mismo
  // disparador. ---
  const daysSincePhotoReview = Math.floor((new Date(today) - new Date(state.lastPhotoReviewDate)) / 86400000);
  const photoSnoozed = state.photoReviewSnoozeUntil && state.photoReviewSnoozeUntil > today;
  const showPhotoReminder = !photoSnoozed && (state.photoReviewDue || daysSincePhotoReview >= 30);

  // --- Aviso de copia de seguridad: cadencia de 14 días. Es el más
  // importante de los tres avisos (protege TODO lo demás — historial,
  // fotos, medidas), así que la cadencia es más corta que la de fotos. ---
  const daysSinceBackup = Math.floor((new Date(today) - new Date(state.lastBackupDate)) / 86400000);
  const backupSnoozed = state.backupSnoozeUntil && state.backupSnoozeUntil > today;
  const showBackupReminder = !backupSnoozed && (state.backupDue || daysSinceBackup >= 14);

  // --- Aviso activo de pasos: a diferencia del resto de recordatorios
  // (peso/foto/backup, cadencia de días), este mira el AVANCE DE HOY a
  // media tarde. Con una media real de ~6.300 pasos/día frente a un
  // objetivo de 8.000, es la palanca más fácil de recuperar sin tocar la
  // comida — pero solo si se avisa a tiempo de actuar, no a las 23h.
  // Ritmo esperado: reparto lineal entre las 7h y las 21h (jornada
  // despierto típica). Solo avisa si vas ≥25% del objetivo por debajo del
  // ritmo esperado a esa hora, y solo entre las 14h y las 21h para dar
  // margen real de reacción.
  const nowHour = new Date().getHours();
  const todaySteps = state.stepsLog[todayKeyHome] || 0;
  const expectedFraction = Math.min(1, Math.max(0, (nowHour - 7) / (21 - 7)));
  const expectedSteps = Math.round((state.stepsTarget || 8000) * expectedFraction);
  const stepsDeficit = expectedSteps - todaySteps;
  const showStepsNudge = nowHour >= 14 && nowHour < 22 && stepsDeficit > (state.stepsTarget || 8000) * 0.25;
  const walkMinutesNeeded = Math.max(5, Math.round(stepsDeficit / 100));

  return html`
    <div class="screen home">
      <header class="home-header">
        <div>
          <p class="eyebrow">${DAY_NAMES[isoDay]} · Semana ${state.cycleWeek} del plan mensual</p>
          <h1>${phase.name}</h1>
        </div>
        <button class="icon-btn" onClick=${onOpenSettings} aria-label="Configuración">⚙</button>
      </header>

      <${HomeGlanceStrip} state=${state} onOpenHabitos=${onOpenHabitos} />

      ${showStepsNudge ? html`
        <div class="weight-reminder steps-nudge" onClick=${onOpenHabitos}>
          <p class="weight-reminder-title">🚶 Vas por debajo del ritmo de pasos de hoy</p>
          <p class="weight-reminder-text">Llevas ${todaySteps.toLocaleString('es-ES')} de los ${(state.stepsTarget || 8000).toLocaleString('es-ES')} — a esta hora deberías ir por ~${expectedSteps.toLocaleString('es-ES')}. Un paseo de ~${walkMinutesNeeded} min te pone al día.</p>
        </div>
      ` : null}

      ${showWeightReminder ? html`
        <div class="weight-reminder">
          <p class="weight-reminder-title">💪 ${state.weightReviewDue ? 'Nuevo ciclo: buen momento para subir peso' : 'Llevas 2 semanas con el mismo peso'}</p>
          <p class="weight-reminder-text">${state.weightReviewDue ? 'Empiezas Volumen tras el Descarga — el cuerpo está fresco, es el mejor momento del mes para probar más kilos en mancuernas o mochila.' : 'Si llevas dos sesiones seguidas completando series con esfuerzo bajo (RPE ≤ 6), toca subir peso.'}</p>
          <div class="weight-reminder-actions">
            <button class="btn-primary" onClick=${onReviewWeightsNow}>Revisar pesos ahora</button>
            <button class="btn-secondary" onClick=${onSnoozeWeights}>Recordar en 3 días</button>
          </div>
        </div>
      ` : null}

      ${showPhotoReminder ? html`
        <div class="weight-reminder photo-reminder">
          <p class="weight-reminder-title">📸 Toca foto de progreso del mes</p>
          <p class="weight-reminder-text">El ojo detecta cambios de tono y definición que ni la báscula ni la cinta métrica capturan. Solo se guarda en tu dispositivo, nunca se sube a ningún sitio.</p>
          <div class="weight-reminder-actions">
            <button class="btn-primary" onClick=${onReviewPhotosNow}>Hacer foto ahora</button>
            <button class="btn-secondary" onClick=${onSnoozePhotos}>Recordar en 5 días</button>
          </div>
        </div>
      ` : null}

      ${showBackupReminder ? html`
        <div class="weight-reminder backup-reminder">
          <p class="weight-reminder-title">🗂️ Haz una copia de seguridad</p>
          <p class="weight-reminder-text">Todo tu progreso vive solo en este teléfono — sin copia, un fallo del navegador o un cambio de móvil podría borrarlo todo. Un toque descarga el archivo completo (historial, fotos, medidas).</p>
          <div class="weight-reminder-actions">
            <button class="btn-primary" onClick=${onBackupNow}>Exportar ahora</button>
            <button class="btn-secondary" onClick=${onSnoozeBackup}>Recordar en 5 días</button>
          </div>
        </div>
      ` : null}

      <div class="phase-card" style=${{ '--phase-color': phase.color }}>
        <p class="phase-name">${phase.name}</p>
        <p class="phase-desc">${phase.desc}</p>
        <div class="phase-progress">
          ${[0, 1, 2, 3, 4, 5].map(i => html`<span key=${i} class=${`dot ${i < sessionsInWeek ? 'filled' : ''}`} />`)}
        </div>
        <p class="phase-progress-label">${sessionsInWeek}/6 sesiones esta semana del ciclo</p>
      </div>

      <div class="cycle-track">
        ${[1, 2, 3, 4].map(w => html`
          <div key=${w} class=${`cycle-step ${w === state.cycleWeek ? 'active' : ''} ${w < state.cycleWeek ? 'done' : ''}`}>
            <span class="cycle-num">${w}</span>
            <span class="cycle-label">${PHASES[w].name}</span>
          </div>
        `)}
      </div>

      ${alreadyTrainedToday ? html`
        <div class="rest-day-card">
          <p class="rest-day-title">✅ Entreno de hoy completado</p>
          <p class="cue-text">${todayLogEntry.rounds} ${todayLogEntry.rounds === 1 ? 'vuelta' : 'vueltas'} · fase ${PHASES[todayLogEntry.phase].name} · ~${todayLogEntry.calories} kcal estimadas. La sesión que verías aquí debajo ya es la siguiente en la rotación — grupos musculares distintos a los de hoy, no repetidos.</p>
          <button class="btn-secondary" onClick=${onStart}>Añadir una sesión extra hoy (voluntario)</button>
        </div>
      ` : (isRestDay && !trainAnyway) ? html`
        <div class="rest-day-card">
          <p class="rest-day-title">Hoy toca descanso</p>
          <p class="cue-text">Domingo: sin sesión de fuerza por defecto. El bloque hipopresivo de aquí abajo se puede hacer igualmente si quieres mantener el trabajo de faja abdominal. Si te falta una sesión de otro día, puedes recuperarla hoy sin problema.</p>
          <button class="btn-secondary" onClick=${() => setTrainAnyway(true)}>Entrenar igualmente hoy</button>
        </div>
      ` : html`
        <div class="rounds-block">
          <p class="rounds-label">¿Cuántas vueltas al circuito hoy?</p>
          <div class="rounds-picker">
            ${[1, 2, 3].map(n => html`
              <button key=${n} class=${`round-btn ${state.roundsPerDay === n ? 'active' : ''}`} onClick=${() => onSetRounds(n)}>
                <span class="rn">${n}</span><span class="rl">${n === 1 ? 'vuelta' : 'vueltas'}</span>
              </button>
            `)}
          </div>
          <p class="rounds-hint">Cada vuelta repite los ${todaySession.exercises.length} ejercicios de hoy en el mismo orden. Cada vuelta se registra por separado para calcular tu progresión.</p>
          <p class="time-estimate">⏱ Tiempo total de hoy: <strong>~${fmtMinutes(estimateDaySeconds(todaySession, state.roundsPerDay, state.pace || 'normal'))} min</strong> (${state.roundsPerDay} ${state.roundsPerDay === 1 ? 'vuelta' : 'vueltas'} + bloque hipopresivo)</p>
        </div>

        <div class="today-preview">
          <p class="today-title">Hoy: ${todaySession.templateName} · ${state.roundsPerDay} ${state.roundsPerDay === 1 ? 'vuelta' : 'vueltas'}</p>
          <div class="today-list">
            ${todaySession.exercises.map(ex => html`
              <div key=${ex.id} class="today-row">
                <span class="today-ex-name">${ex.name}</span>
                <span class="today-ex-detail">
                  ${ex.isTimeBased ? `${ex.targetReps}s` : `${ex.targetReps} reps`}${ex.equip === 'mancuernas' || ex.equip === 'mochila' ? ` · ${ex.weight}kg` : ex.equip === 'banda' ? ' · banda elástica' : ''} × ${state.roundsPerDay}
                </span>
              </div>
            `)}
          </div>
          <button class="btn-primary btn-huge" onClick=${onStart}>Empezar circuito de hoy</button>
        </div>

        <${TodayExerciseCards} exercises=${todaySession.exercises} />

      <div class="morning-hypo-card">
        <p class="morning-hypo-title">🌅 Rutina matutina: postura + hipopresivos</p>
        <p class="cue-text">~6 min, independiente del circuito de hoy — ideal recién levantado, antes del café. Empieza con 3 ejercicios contra el hombro adelantado de estar sentado (chin tuck, apertura torácica, apertura de pecho), y termina con la secuencia hipopresiva completa en ayunas. No cuenta como vuelta ni afecta al ciclo semanal, pero suma a tu tiempo y calorías del día.</p>
        <button class="btn-secondary" onClick=${onStartMorningHypo}>Empezar ahora</button>
      </div>

      <div class="stat-row">
        <div class="stat-box"><p class="stat-num">${state.totalSessionsDone}</p><p class="stat-label">Sesiones totales</p></div>
        <div class="stat-box"><p class="stat-num">${Object.keys(state.exerciseLevels).length}</p><p class="stat-label">Ejercicios calibrados</p></div>
      </div>

      <div class="quick-links-grid">
        <button class="quick-link-tile" onClick=${onOpenWeekPlan}><span class="qlt-icon">📅</span><span>Plan semanal</span></button>
        <button class="quick-link-tile" onClick=${onOpenNutrition}><span class="qlt-icon">🍽️</span><span>Nutrición</span></button>
        <button class="quick-link-tile" onClick=${onOpenHabitos}><span class="qlt-icon">📊</span><span>Hábitos</span></button>
        <button class="quick-link-tile" onClick=${onOpenProgress}><span class="qlt-icon">📈</span><span>Progreso</span></button>
      </div>
    </div>
  `;
}

function Habitos({ state, onBack, forceRender }) {
  const todayKey = localDateKey();
  // editKey es el día que se está viendo/editando. Por defecto hoy, pero se
  // puede navegar a días anteriores para corregir un olvido o un dato mal
  // introducido, sin perder el histórico ya guardado.
  const [editKey, setEditKey] = useState(todayKey);
  // Qué comida tiene abierto el calculador de kcal reales (null = ninguna),
  // y el picker de alimento/cantidad pendiente de añadir para esa comida.
  const [openCalcMeal, setOpenCalcMeal] = useState(null);
  const [foodPick, setFoodPick] = useState({ foodId: FOOD_DB[0].id, amount: '', manual: false, manualName: '', manualKcal: '' });
  const isToday = editKey === todayKey;
  const editDateObj = new Date(editKey + 'T00:00:00');
  const editJsDay = editDateObj.getDay();
  const editIso = editJsDay === 0 ? 7 : editJsDay;
  const editPlan = NUTRITION_PLAN.find(d => d.day === editIso);
  const dayTargetKcal = editPlan ? editPlan.kcal : NUTRITION_TARGETS.kcal;
  const dayLabel = isToday ? 'Hoy' : editDateObj.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'short' });

  function goToDay(delta) {
    const next = shiftKey(editKey, delta);
    if (next > todayKey) return; // no se editan días futuros
    setEditKey(next);
  }

  const steps = state.stepsLog[editKey] || '';
  const sleep = state.sleepLog[editKey] || '';
  const calEntry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };

  // --- Banco semanal de extras: en vez de que cada extra puntual (350,
  // 450, 500 kcal en días sueltos) descuadre el déficit sin que se vea
  // venir, se convierte en un presupuesto visible de 7 días. Ventana
  // móvil de 7 días terminando en editKey (mismo criterio que el resto
  // de medias semanales de la app), no semana natural — así el número
  // siempre refleja "la última semana real", no depende de qué día caiga
  // el lunes.
  const weeklyExtraBudget = state.weeklyExtraBudgetKcal || 500;
  const last7ExtraKeys = Array.from({ length: 7 }, (_, i) => shiftKey(editKey, -i));
  const weeklyExtraUsed = last7ExtraKeys.reduce((sum, k) => sum + ((state.calorieLog[k] && state.calorieLog[k].extraKcal) || 0), 0);
  const weeklyExtraLeft = weeklyExtraBudget - weeklyExtraUsed;

  function setSteps(v) { state.stepsLog[editKey] = v === '' ? undefined : Math.max(0, parseInt(v, 10) || 0); saveState(state); forceRender(x => x + 1); }
  function setStepsTarget(v) { state.stepsTarget = Math.max(1000, parseInt(v, 10) || 8000); saveState(state); forceRender(x => x + 1); }
  function setWeeklyExtraBudget(v) { state.weeklyExtraBudgetKcal = Math.max(0, parseInt(v, 10) || 500); saveState(state); forceRender(x => x + 1); }
  function setSleep(v) { state.sleepLog[editKey] = v === '' ? undefined : Math.max(0, Math.min(14, parseFloat(v) || 0)); saveState(state); forceRender(x => x + 1); }

  function toggleMeal(mealKey) {
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    entry.meals = { ...entry.meals, [mealKey]: !entry.meals[mealKey] };
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  function setExtraKcal(v) {
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    entry.extraKcal = v === '' ? 0 : Math.max(0, parseInt(v, 10) || 0);
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  // Calculador de kcal reales por comida: en vez de fiarse solo del check
  // "seguí el plan", permite anotar exactamente qué se comió (alimento +
  // cantidad) para esa comida concreta. En cuanto hay 1+ alimento
  // añadido, ese total pasa a mandar sobre la estimación fija del plan
  // para esa comida (ver mealDisplayKcal) — más preciso para afinar el
  // déficit real del día.
  function addRealFood(mealKey, foodId, amount) {
    const food = FOOD_DB.find(f => f.id === foodId);
    if (!food || !amount || amount <= 0) return;
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    const realFoods = { ...(entry.realFoods || {}) };
    const list = realFoods[mealKey] ? [...realFoods[mealKey]] : [];
    list.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, foodId, amount, name: food.name, unit: food.unit || 'g', kcal: foodKcal(food, amount), proteinG: foodProtein(food, amount) });
    realFoods[mealKey] = list;
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  // Alimento manual: para lo que no está (ni va a estar nunca del todo)
  // en FOOD_DB — un plato compuesto, una marca concreta, una ración ya
  // preparada. Se anota el nombre libre y las kcal totales de esa
  // porción directamente (no por 100g), consultando el envase o una
  // estimación razonable. Queda guardado igual que cualquier otro
  // alimento, mismo formato de item. La proteína es opcional: si no se
  // sabe, se deja en 0 en vez de inventar un número — mejor un contador
  // de proteína honesto e incompleto que uno falso.
  function addManualFood(mealKey, name, kcal, proteinG) {
    if (!name || !kcal || kcal <= 0) return;
    const entry = state.calorieLog[editKey] || { meals: {}, extraKcal: 0 };
    const realFoods = { ...(entry.realFoods || {}) };
    const list = realFoods[mealKey] ? [...realFoods[mealKey]] : [];
    list.push({ id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, foodId: null, amount: 1, name, unit: 'ud', kcal: Math.round(kcal), proteinG: proteinG > 0 ? Math.round(proteinG * 10) / 10 : 0 });
    realFoods[mealKey] = list;
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  function removeRealFood(mealKey, itemId) {
    const entry = state.calorieLog[editKey];
    if (!entry || !entry.realFoods || !entry.realFoods[mealKey]) return;
    const realFoods = { ...entry.realFoods };
    realFoods[mealKey] = realFoods[mealKey].filter(it => it.id !== itemId);
    entry.realFoods = realFoods;
    state.calorieLog[editKey] = entry;
    saveState(state); forceRender(x => x + 1);
  }
  // Proteína total del día: solo suma lo registrado con detalle (alimentos
  // reales o manuales con proteína indicada). Las comidas marcadas solo
  // con el check del plan NO suman aquí a propósito — su composición
  // exacta no se registra a ese nivel de detalle, así que inventar un
  // número sería menos honesto que dejarlo fuera. El aviso lo dice claro.
  const dayProteinG = Math.round(
    Object.values(calEntry.realFoods || {}).flat().reduce((sum, it) => sum + (it.proteinG || 0), 0) * 10
  ) / 10;
  const proteinTarget = NUTRITION_TARGETS.proteinG;
  const proteinPct = proteinTarget ? dayProteinG / proteinTarget : 0;

  // Actividad extra puntual (correr, pádel, bici...) del día que se está
  // editando — distinta de los pasos: esto es gasto adicional real que el
  // TDEE fijo no contempla, así que se suma aparte y se refleja en el
  // déficit del dashboard (buildHabitsKPIs), no solo se archiva.
  const dayActivities = state.extraActivityLog[editKey] || [];
  const [actType, setActType] = useState('correr');
  const [actMinutes, setActMinutes] = useState('');
  const currentWeightKg = useMemo(() => getCurrentWeightKg(state), [state.measurements]);
  function addActivity() {
    const minutes = parseInt(actMinutes, 10);
    if (!minutes || minutes <= 0) return;
    const kcal = estimateActivityKcal(actType, minutes, currentWeightKg);
    const list = state.extraActivityLog[editKey] ? [...state.extraActivityLog[editKey]] : [];
    list.push({ id: `${Date.now()}`, type: actType, minutes, kcal });
    state.extraActivityLog[editKey] = list;
    saveState(state); forceRender(x => x + 1);
    setActMinutes('');
  }
  function removeActivity(id) {
    state.extraActivityLog[editKey] = (state.extraActivityLog[editKey] || []).filter(a => a.id !== id);
    saveState(state); forceRender(x => x + 1);
  }

  const mealItems = editPlan ? [
    { key: 'breakfast', label: 'Desayuno', text: NUTRITION_COFFEE.text, kcal: NUTRITION_COFFEE.kcal },
    { key: 'midMorning', label: 'Media mañana', text: editPlan.midMorning, kcal: editPlan.midMorningKcal },
    { key: 'lunch', label: 'Comida', text: editPlan.lunch, kcal: editPlan.lunchKcal },
    { key: 'merienda', label: 'Merienda', text: NUTRITION_MERIENDA.text, kcal: NUTRITION_MERIENDA.kcal },
    { key: 'dinner', label: 'Cena', text: editPlan.dinner, kcal: editPlan.dinnerKcal },
  ] : [];

  const mealsKcal = mealItems.reduce((sum, m) => sum + mealDisplayKcal(calEntry, m.key, !!calEntry.meals[m.key], m.kcal), 0);
  const totalKcal = mealsKcal + (calEntry.extraKcal || 0);
  const diff = totalKcal - dayTargetKcal;
  const hasAnyLogged = mealsKcal > 0 || (calEntry.extraKcal || 0) > 0;

  const stepsPct = Math.min(100, Math.round(((state.stepsLog[editKey] || 0) / state.stepsTarget) * 100));

  return html`
    <div class="screen habitos">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Hábitos</h1></header>
      <p class="cue-text habitos-intro">Con entreno y comida ya cubiertos, esto es lo que más rápido puede acelerar o frenar el resultado sin cambiar nada más: cuánto te mueves fuera del circuito, cuánto duermes, y si de verdad te quedas en déficit cada día.</p>

      <div class="habit-day-nav">
        <button class="icon-btn small" onClick=${() => goToDay(-1)} aria-label="Día anterior">‹</button>
        <div class="habit-day-nav-label">
          <span class="habit-day-nav-main">${dayLabel}</span>
          ${!isToday ? html`<button class="habit-day-nav-today" onClick=${() => setEditKey(todayKey)}>Volver a hoy</button>` : null}
        </div>
        <button class="icon-btn small" onClick=${() => goToDay(1)} disabled=${isToday} aria-label="Día siguiente">›</button>
      </div>
      ${!isToday ? html`<p class="settings-hint habit-editing-past">✏️ Editando un día anterior para corregir un olvido — se guarda igual que "hoy".</p>` : null}

      <div class="habit-card">
        <div class="habit-card-header">
          <p class="settings-label" style=${{ marginBottom: 0 }}>🚶 ${isToday ? 'Pasos de hoy' : 'Pasos'}</p>
          <span class="habit-target-edit">
            objetivo <input class="habit-inline-input" type="number" value=${state.stepsTarget} onChange=${e => setStepsTarget(e.target.value)} />
          </span>
        </div>
        <input class="habit-big-input" type="number" placeholder="0" value=${steps} onChange=${e => setSteps(e.target.value)} />
        <div class="habit-progress-track"><div class="habit-progress-fill" style=${{ width: `${stepsPct}%` }}></div></div>
        <p class="settings-hint">${stepsPct}% del objetivo. Con trabajo de escritorio, esto es lo que más cambia el gasto calórico del día sin tocar el entreno — cada paseo cuenta.</p>
      </div>

      <div class="habit-card">
        <p class="settings-label">😴 ${isToday ? 'Horas dormidas anoche' : 'Horas dormidas'}</p>
        <input class="habit-big-input" type="number" step="0.5" placeholder="0" value=${sleep} onChange=${e => setSleep(e.target.value)} />
        <p class="settings-hint">
          ${sleep === '' ? 'Objetivo: 7-8h. Por debajo de 7h de forma sostenida, el déficit calórico pierde eficacia — peor regulación del hambre y más riesgo de perder músculo en vez de grasa, más aún a partir de los 55.'
            : sleep >= 7 ? '✅ En el rango recomendado (7-8h).'
            : sleep >= 6 ? '⚠️ Algo justo — inténtalo si puedes, sobre todo en fase de Intensidad.'
            : '⚠️ Por debajo de lo recomendable. Si se repite varios días, es más determinante para el resultado que cualquier ajuste de entreno o comida.'}
        </p>
      </div>

      <div class="habit-card">
        <p class="settings-label">🍽️ ${isToday ? 'Calorías de hoy' : 'Calorías'}</p>
        <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 10 }}>Marca lo que ${isToday ? 'de verdad has comido hoy' : 'de verdad se comió ese día'} — usa tu plan de nutrición como referencia rápida, no hace falta anotar gramos.</p>
        ${editPlan ? mealItems.map(m => {
          const realItems = (calEntry.realFoods && calEntry.realFoods[m.key]) || [];
          const realTotal = mealRealKcal(calEntry, m.key);
          const isOpen = openCalcMeal === m.key;
          return html`
          <div key=${m.key} class="habit-meal-block">
            <label class="habit-meal-row">
              <input type="checkbox" checked=${realItems.length > 0 ? true : !!calEntry.meals[m.key]} disabled=${realItems.length > 0} onChange=${() => toggleMeal(m.key)} />
              <span class="habit-meal-text"><strong>${m.label}:</strong> ${m.text}</span>
              <span class="habit-meal-kcal">${realTotal != null ? `${realTotal} real` : `~${m.kcal}`}</span>
            </label>
            <button class="habit-meal-calc-toggle" onClick=${() => setOpenCalcMeal(isOpen ? null : m.key)}>
              ${realItems.length > 0 ? `🍽️ ${realItems.length} alimento(s) registrado(s) — ${isOpen ? 'ocultar' : 'editar'}` : `🍽️ ¿Comiste otra cosa? Calcula lo real ${isOpen ? '▲' : '▼'}`}
            </button>
            ${isOpen ? html`
              <div class="habit-meal-calc">
                ${realItems.length > 0 ? html`
                  <div class="habit-food-list">
                    ${realItems.map(it => html`
                      <div key=${it.id} class="habit-food-row">
                        <span>${it.name}${it.foodId ? ` · ${it.amount}${it.unit === 'ud' ? (it.amount === 1 ? ' ud' : ' uds') : 'g'}` : ''}</span>
                        <span class="habit-food-kcal">${it.kcal} kcal${it.proteinG ? ` · ${it.proteinG}g prot` : ''}</span>
                        <button class="icon-btn small" onClick=${() => removeRealFood(m.key, it.id)} aria-label="Quitar">✕</button>
                      </div>
                    `)}
                    <div class="habit-food-row habit-food-total"><span>Total real</span><span class="habit-food-kcal">${realTotal} kcal</span></div>
                  </div>
                ` : null}
                <div class="habit-food-add-row">
                  <select value=${foodPick.foodId} onChange=${e => setFoodPick({ ...foodPick, foodId: e.target.value, manual: e.target.value === '__manual__' })}>
                    ${FOOD_DB.map(f => html`<option key=${f.id} value=${f.id}>${f.name}</option>`)}
                    <option value="__manual__">✏️ Otro alimento (kcal manual)…</option>
                  </select>
                  ${!foodPick.manual ? html`
                    <input class="habit-inline-input" type="number" placeholder=${FOOD_DB.find(f => f.id === foodPick.foodId)?.unit === 'ud' ? 'uds' : 'gramos'} value=${foodPick.amount} onChange=${e => setFoodPick({ ...foodPick, amount: e.target.value })} />
                    <button class="btn-secondary small" onClick=${() => { addRealFood(m.key, foodPick.foodId, parseFloat((foodPick.amount || '').replace(',', '.'))); setFoodPick({ ...foodPick, amount: '' }); }}>Añadir</button>
                  ` : null}
                </div>
                ${foodPick.manual ? html`
                  <div class="habit-food-add-row" style=${{ marginTop: '6px' }}>
                    <input class="habit-inline-input" style=${{ flex: 2 }} type="text" placeholder="ej. Berenjena rellena (ración)" value=${foodPick.manualName} onChange=${e => setFoodPick({ ...foodPick, manualName: e.target.value })} />
                    <input class="habit-inline-input" type="number" placeholder="kcal" value=${foodPick.manualKcal} onChange=${e => setFoodPick({ ...foodPick, manualKcal: e.target.value })} />
                  </div>
                  <div class="habit-food-add-row" style=${{ marginTop: '6px' }}>
                    <input class="habit-inline-input" type="number" placeholder="proteína (g, opcional)" value=${foodPick.manualProtein || ''} onChange=${e => setFoodPick({ ...foodPick, manualProtein: e.target.value })} />
                    <button class="btn-secondary small" onClick=${() => { addManualFood(m.key, foodPick.manualName, parseFloat((foodPick.manualKcal || '').replace(',', '.')), parseFloat((foodPick.manualProtein || '').replace(',', '.'))); setFoodPick({ ...foodPick, manualName: '', manualKcal: '', manualProtein: '' }); }}>Añadir</button>
                  </div>
                  <p class="settings-hint" style=${{ marginTop: '4px', marginBottom: 0 }}>Para platos compuestos (albóndigas con verduras, berenjena rellena…) o algo que no está en la lista: pon un nombre y las kcal totales de esa ración — de un envase, o a ojo combinando varios alimentos de la lista de arriba. La proteína es opcional: si no la sabes, déjala en blanco antes que inventarla.</p>
                ` : html`
                  <p class="settings-hint" style=${{ marginTop: '4px', marginBottom: 0 }}>Cantidad en gramos (crudo/cocido según el alimento) salvo huevo, tostada, bebidas y café, que van por unidades. Con 1+ alimento aquí, el check de arriba se desactiva y este total manda para el cálculo del día.</p>
                `}
              </div>
            ` : null}
          </div>
        `; }) : null}
        ${editPlan ? html`
          <div class="habit-protein-banner ${proteinPct >= 1 ? 'protein-ok' : proteinPct >= 0.7 ? 'protein-mid' : 'protein-low'}">
            <p class="habit-protein-title">🥩 Proteína registrada hoy: ${dayProteinG}g de ${proteinTarget}g objetivo</p>
            <p class="habit-protein-text">
              ${proteinPct >= 1
                ? '¡Objetivo cubierto! Justo lo que necesitas para no perder músculo con el déficit de hoy.'
                : proteinPct >= 0.7
                  ? `Vas bien, pero te faltan ~${Math.round(proteinTarget - dayProteinG)}g. Una fuente más (pollo, huevo, atún, yogur…) y lo cierras.`
                  : `Muy por debajo — sin suficiente proteína, el déficit calórico empieza a quemar músculo además de grasa. Añade una fuente de proteína a tu próxima comida.`}
            </p>
            <p class="settings-hint" style=${{ marginTop: '4px', marginBottom: 0 }}>Solo cuenta lo registrado con el calculador de arriba — las comidas marcadas solo con el check del plan no suman aquí (no se sabe su composición exacta). Para llevar la proteína al día, registra al menos la fuente principal de cada comida.</p>
          </div>
        ` : null}
        <div class="habit-extra-row">
          <span class="nutrition-meal-label" style=${{ width: 'auto' }}>Algo más (extra)</span>
          <input class="habit-inline-input" type="number" placeholder="0" value=${calEntry.extraKcal || ''} onChange=${e => setExtraKcal(e.target.value)} />
          <span class="nutrition-item-kcal">kcal</span>
        </div>
        <p class="settings-hint" style=${{ marginTop: '6px', marginBottom: 0, color: weeklyExtraLeft < 0 ? '#FF6B4A' : 'var(--text-dim)' }}>
          Banco semanal de extras: ${weeklyExtraUsed} / <input class="habit-inline-input" style=${{ width: '60px', display: 'inline-block' }} type="number" value=${state.weeklyExtraBudgetKcal || 500} onChange=${e => setWeeklyExtraBudget(e.target.value)} /> kcal usados (últimos 7 días)${weeklyExtraLeft >= 0 ? ` · quedan ${weeklyExtraLeft} kcal` : ` · te has pasado ${Math.abs(weeklyExtraLeft)} kcal`}
        </p>
        <div class="habit-total-row">
          <span>${isToday ? 'Total de hoy' : 'Total'}</span>
          <span class="habit-total-num">${totalKcal} kcal</span>
        </div>
        ${hasAnyLogged ? html`
          <p class=${`habit-deficit-msg ${diff <= 0 ? 'is-good' : 'is-over'}`}>
            ${diff <= 0
              ? `✅ En déficit: ${Math.abs(diff)} kcal por debajo del objetivo (${dayTargetKcal}).`
              : `⚠️ ${diff} kcal por encima del objetivo (${dayTargetKcal}) — no pasa nada por un día suelto, vigílalo si se repite.`}
          </p>
        ` : html`<p class="settings-hint">Marca al menos una comida para ver si ${isToday ? 'vas' : 'iba'} en déficit ${isToday ? 'hoy' : 'ese día'}.</p>`}
      </div>

      <div class="habit-card">
        <p class="settings-label">🏃 Actividad extra ${isToday ? 'de hoy' : 'de ese día'}</p>
        <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 10 }}>Deporte puntual (correr, pádel, bici...) — distinto de los pasos, esto SÍ suma gasto extra real al déficit del día.</p>
        ${dayActivities.length > 0 ? html`
          <div class="activity-list">
            ${dayActivities.map(a => html`
              <div key=${a.id} class="activity-row">
                <span class="activity-row-label">${(ACTIVITY_MET[a.type] || ACTIVITY_MET.otro).label} · ${a.minutes} min</span>
                <span class="activity-row-kcal">+${a.kcal} kcal</span>
                <button class="activity-row-del" onClick=${() => removeActivity(a.id)}>✕</button>
              </div>
            `)}
          </div>
        ` : null}
        <div class="activity-add-row">
          <select class="activity-select" value=${actType} onChange=${e => setActType(e.target.value)}>
            ${Object.entries(ACTIVITY_MET).map(([k, v]) => html`<option key=${k} value=${k}>${v.label}</option>`)}
          </select>
        </div>
        <div class="activity-add-row2">
          <input class="activity-minutes-input" type="number" placeholder="minutos" value=${actMinutes} onChange=${e => setActMinutes(e.target.value)} />
          <button class="btn-secondary" onClick=${addActivity} disabled=${!actMinutes || parseInt(actMinutes, 10) <= 0}>Añadir</button>
        </div>
        ${actMinutes && parseInt(actMinutes, 10) > 0 ? html`<p class="settings-hint" style=${{ marginTop: 6 }}>Estimado: ~${estimateActivityKcal(actType, parseInt(actMinutes, 10), currentWeightKg)} kcal (según tu peso actual, ${currentWeightKg}kg)</p>` : null}
      </div>

      <div class="habit-card">
        <p class="settings-label">Últimos 14 días</p>
        <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 8 }}>Toca un día para corregirlo.</p>
        <div class="habit-history-list">
          ${[...Array(14)].map((_, i) => {
            const key = shiftKey(todayKey, -i);
            const d = new Date(key + 'T00:00:00');
            const h = getHabitDataForDay(state, key);
            return html`
              <button key=${key} class=${`habit-history-row ${key === editKey ? 'is-active' : ''}`} onClick=${() => setEditKey(key)}>
                <span class="habit-history-date">${d.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit' })}</span>
                ${h ? html`
                  <span class="habit-history-data">
                    ${h.steps != null ? `🚶 ${h.steps.toLocaleString('es-ES')}` : '🚶 —'}
                    · ${h.sleep != null ? `😴 ${h.sleep}h` : '😴 —'}
                    · ${h.kcalTotal != null ? html`<span class=${h.kcalTotal <= h.kcalTarget ? 'is-good' : 'is-over'}>🍽️ ${h.kcalTotal <= h.kcalTarget ? 'déficit' : `+${h.kcalTotal - h.kcalTarget}`}</span>` : '🍽️ —'}
                  </span>
                ` : html`<span class="habit-history-data habit-history-empty">Sin registrar</span>`}
              </button>
            `;
          })}
        </div>
      </div>

      <${HabitsKPIDashboard} state=${state} />
      <${HabitsEvolutionChart} state=${state} />
    </div>
  `;
}

function Nutrition({ state, onBack, forceRender }) {
  const jsDay = new Date().getDay();
  const todayIso = jsDay === 0 ? 7 : jsDay;
  const todayKey = new Date().toISOString().slice(0, 10);
  const takenToday = !!state.creatineLog[todayKey];

  function toggleCreatineToday() {
    state.creatineLog[todayKey] = !takenToday;
    saveState(state);
    forceRender(x => x + 1);
  }

  return html`
    <div class="screen nutrition">
      <header class="sub-header"><button class="icon-btn" onClick=${onBack}>←</button><h1>Nutrición</h1></header>
      <p class="cue-text nutrition-intro">
        Guía orientativa diseñada para este perfil (hombre 55 años, 165cm, ~70kg) para maximizar el resultado del plan de entreno. No sustituye a un dietista-nutricionista — basada en fórmulas estándar, no en tu historial médico.
      </p>
      <p class="cue-text nutrition-intro">Deja pasar unas 3 horas entre la tostada de media mañana y la comida.</p>

      <div class="nutrition-targets-card">
        <p class="settings-label" style=${{ marginBottom: 10 }}>Objetivo diario</p>
        <div class="nutrition-targets-grid">
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.kcal}</span><span class="nt-label">kcal/día</span></div>
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.proteinG}g</span><span class="nt-label">proteína</span></div>
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.carbG}g</span><span class="nt-label">carbohidrato</span></div>
          <div class="nt-box"><span class="nt-num">${NUTRITION_TARGETS.fatG}g</span><span class="nt-label">grasa</span></div>

function WeeklyPlan({ state, onBack }) {
  const plan = getWeeklyPlan(state);
  // La rotación ya no está fija a un día de la semana concreto — "próxima"
  // es la que te tocaría en tu próxima sesión real, calculada por cuántas
  // llevas hechas, no por el calendario. Si te saltas un día, sigue siendo
  // exactamente la misma "próxima" hasta que entrenes, sea cuando sea.
  const nextIndex = state.totalSessionsDone % WEEKLY_TEMPLATE.length;
  return html`
    <div class="screen weekplan">
      <header class="sub-header">
        <button class="icon-btn" onClick=${onBack}>←</button>
        <h1>Plan semanal</h1>
      </header>

        6 sesiones en rotación + descanso los domingos. Qué toca hoy ya no depende del día de la semana, sino de cuántas sesiones reales llevas hechas — si te saltas un día, la sesión pendiente te espera, no se pierde. Cada sesión es un circuito de ${EXERCISES_PER_SESSION} ejercicios que repites ${state.roundsPerDay} ${state.roundsPerDay === 1 ? 'vez' : 'veces'} (ajustable cada día en Inicio). Series y repeticiones se recalculan según tu fase del mes (${PHASES[state.cycleWeek].name}).
      </p>
      ${plan.map((day, i) => html`
        <div key=${day.day} class=${`weekplan-day ${i === nextIndex ? 'is-today' : ''}`}>
          <div class="weekplan-day-header">
            <span class="weekplan-day-name">Sesión ${i + 1}</span>
            <span class="weekplan-day-focus">${day.name}</span>
            ${i === nextIndex ? html`<span class="weekplan-today-badge">Próxima</span>` : null}
          </div>
          ${day.exercises.map(ex => html`
            <div key=${ex.id} class="weekplan-ex-row">
              <span class="weekplan-ex-name">${ex.name}</span>
              <span class="weekplan-ex-detail">
                ${ex.isTimeBased ? `${ex.targetReps}s` : `${ex.targetReps} reps`}${ex.equip === 'mancuernas' || ex.equip === 'mochila' ? ` · ${ex.weight}kg` : ex.equip === 'banda' ? ' · banda elástica' : ' · peso corporal'}

  `;
}

// =====================================================================
// PANTALLA: CIRCUITO (rondas de 5 ejercicios, con descanso entre rondas)
// =====================================================================
// Flujo 100% automático: trabajo (temporizado según objetivo+tempo) → confirmación
// de reps de 5s (ajustable con ±, si no se toca nada se autorregistra el objetivo)
// → descanso → siguiente ejercicio/vuelta, todo encadenado sin necesidad de tocar
// la pantalla. El botón de pausa es la única acción que corta la cadena.
const CONFIRM_SECONDS = 10;

function TrainingSession({ session, state, rounds, onFinishCircuit, onExit }) {
  const [roundIdx, setRoundIdx] = useState(0);
  const [exIdx, setExIdx] = useState(0);
  const [phase, setPhase] = useState('countdown'); // countdown | work | rest | roundrest | extend-prompt
  const [setsLog, setSetsLog] = useState({});
  const [paused, setPaused] = useState(false);
  const [extraRounds, setExtraRounds] = useState(0);
  const [showWorkDetail, setShowWorkDetail] = useState(false);
  const circuitStartRef = useRef(Date.now());

  const ex = session.exercises[exIdx];
  const isLastExInRound = exIdx === session.exercises.length - 1;
  const effectiveRounds = rounds + extraRounds;
  const isLastRound = roundIdx === effectiveRounds - 1;
  const pace = state.pace || 'normal';

  function finalizeCircuit() {
    playIfOn(Sound.playSessionComplete);
    VoiceCoach.circuitDone();
    const results = [];
    session.exercises.forEach(e => {
      const doneSets = setsLog[e.id] || [];
      if (doneSets.length) results.push({ exercise: e, ...applyResult(state, e, doneSets, session.phaseKey) });
    });
    const circuitDurationSec = Math.round((Date.now() - circuitStartRef.current) / 1000);
    completeSession(state, effectiveRounds, circuitDurationSec);
    onFinishCircuit(results);
  }

  // --- Cuenta atrás de 5s antes de cada ejercicio (deja tiempo a la voz a
  // nombrar el ejercicio sin cortarse, transición limpia) ---
  const COUNTDOWN_SECONDS = 5;
  const [countRemaining, setCountRemaining] = useCountdown(COUNTDOWN_SECONDS, () => setPhase('work'), phase === 'countdown' && !paused);
  useEffect(() => { if (phase === 'countdown') { setCountRemaining(COUNTDOWN_SECONDS); playIfOn(Sound.playConfirmOpen); VoiceCoach.announceExercise(ex.name, ex.isTimeBased); } }, [phase, roundIdx, exIdx]);

  // --- Temporizador de TRABAJO (auto): cuenta el tiempo estimado de la serie y
  // registra sola el objetivo propuesto al terminar — sin pedir confirmación.
  // También se puede forzar a 0 con "Ya he terminado" para pasar antes. ---
  const workSeconds = computeWorkSeconds(ex, pace);
  const [workRemaining, setWorkRemaining] = useCountdown(workSeconds, () => {
    playIfOn(Sound.playAutoLogged);
    const rpe = estimateRpe(ex.targetReps, ex.targetReps, session.phaseKey, roundIdx);
    setSetsLog(prev => ({ ...prev, [ex.id]: [...(prev[ex.id] || []), { reps: ex.targetReps, rpe }] }));
    setPhase('rest');
  }, phase === 'work' && !paused);
  useEffect(() => { if (phase === 'work') { setWorkRemaining(workSeconds); playIfOn(Sound.playWorkStart); VoiceCoach.countdownGo(); } }, [phase, roundIdx, exIdx]);
  const encouragedRef = useRef(null);
  useEffect(() => {
    if (phase !== 'work') return;
    const key = `${roundIdx}-${exIdx}`;
    if (workSeconds >= 14 && workRemaining === Math.round(workSeconds / 2) && encouragedRef.current !== key) {
      encouragedRef.current = key;
      VoiceCoach.encourage();
    }
  }, [phase, workRemaining]);

  // --- Descansos (entre series/ejercicios y entre vueltas) ---
  const restDuration = phase === 'roundrest' ? Math.round(ex.restSec * 1.8) : ex.restSec;
  const [restRemaining, setRestRemaining] = useCountdown(restDuration, () => {
    if (phase === 'roundrest') {
      playIfOn(Sound.playRestEnd);
      setRoundIdx(r => r + 1); setExIdx(0); setPhase('countdown');
      return;
    }
    playIfOn(Sound.playRestEnd);
    if (isLastExInRound) {
      if (isLastRound) { playIfOn(Sound.playRoundEnd); VoiceCoach.roundDone(roundIdx + 1); setPhase('extend-prompt'); }
      else { playIfOn(Sound.playRoundEnd); VoiceCoach.roundDone(roundIdx + 1); setPhase('roundrest'); }
    } else {
      setExIdx(i => i + 1); setPhase('countdown');
    }
  }, (phase === 'rest' || phase === 'roundrest') && !paused);
  useEffect(() => { if (phase === 'rest' || phase === 'roundrest') { setRestRemaining(restDuration); VoiceCoach.rest(); } }, [phase, roundIdx, exIdx]);

  const lastBeepedRef = useRef(null);
  useEffect(() => {
    if (phase !== 'rest' && phase !== 'roundrest') return;
    if (restRemaining <= 3 && restRemaining > 0 && lastBeepedRef.current !== restRemaining) {
      lastBeepedRef.current = restRemaining;
      playIfOn(() => Sound.playCountdownBeep(restRemaining === 1));
    }
  }, [phase, restRemaining]);

  function acceptExtraRound() {
    setExtraRounds(r => r + 1);
    setRoundIdx(r => r + 1); setExIdx(0); setPhase('countdown');
  }

  const PauseBtn = html`
    <div class="session-controls">
      <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el progreso de esta vuelta sin registrar.')) onExit(); }} aria-label="Volver al inicio">←</button>
      <button class=${`pause-btn ${paused ? 'active' : ''}`} onClick=${() => setPaused(p => !p)} aria-label="Pausar">${paused ? '▶' : '❚❚'}</button>
    </div>
  `;

  if (phase === 'extend-prompt') {
    return html`
      <div class="screen extend-prompt">
        ${PauseBtn}
        <p class="eyebrow">Vuelta ${roundIdx + 1}/${effectiveRounds} completada</p>
        <h2>¿Una vuelta más para trabajar más?</h2>
        <p class="cue-text">Has terminado las vueltas previstas de hoy. Puedes añadir una vuelta extra ahora mismo o cerrar el circuito y pasar al bloque hipopresivo.</p>
        <button class="btn-primary btn-huge" onClick=${acceptExtraRound}>Sí, una vuelta más</button>
        <button class="btn-secondary" onClick=${finalizeCircuit}>No, terminar aquí</button>
      </div>
    `;
  }

  if (phase === 'roundrest') {
    return html`
      <div class="screen roundrest">
        ${PauseBtn}
        <span class="roundrest-badge">Fin de vuelta ${roundIdx + 1}/${effectiveRounds}</span>
        <p class="timer-big">${fmtTime(restRemaining)}</p>
        <p class="cue-text">Descanso entre vueltas del circuito. La vuelta ${roundIdx + 2} empieza sola cuando acaba la cuenta.</p>
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'rest') {
    const nextIsRoundEnd = isLastExInRound;
    const nextEx = nextIsRoundEnd ? null : session.exercises[exIdx + 1];
    const nextName = nextIsRoundEnd ? (isLastRound ? 'Fin del circuito' : `Descanso entre vueltas`) : nextEx.name;
    return html`
      <div class="screen rest">
        ${PauseBtn}
        <p class="eyebrow">Descanso · Vuelta ${roundIdx + 1}/${effectiveRounds}</p>
        <p class="timer-big rest-timer">${fmtTime(restRemaining)}</p>
        <p class="rest-next">Siguiente: ${nextName}</p>
        ${nextEx ? html`
          <p class="rest-next-detail">
            <span class="rest-next-reps">${nextEx.isTimeBased ? `${nextEx.targetReps}s` : `${nextEx.targetReps} reps`}</span>${nextEx.equip === 'mancuernas' ? ` · mancuernas ${nextEx.weight}kg` : nextEx.equip === 'mochila' ? ` · mochila ${nextEx.weight}kg` : nextEx.equip === 'banda' ? ' · banda elástica' : ''}
          </p>
        ` : null}
        <button class="btn-secondary" onClick=${() => setRestRemaining(0)}>Saltar descanso</button>
      </div>
    `;
  }

  if (phase === 'countdown') {
    return html`
      <div class="screen prep">
        ${PauseBtn}
        <span class="round-badge">Vuelta ${roundIdx + 1} de ${effectiveRounds}</span>
        <p class="eyebrow">Ejercicio ${exIdx + 1}/${session.exercises.length}</p>
        <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${140} />
        <h2>${ex.name}</h2>
        <p class="prep-count">${countRemaining || '¡Vamos!'}</p>
        <p class="cue-text">Prepárate: empieza sola en un momento.</p>
        <button class="btn-secondary" onClick=${() => setCountRemaining(0)}>Empezar ya</button>
      </div>
    `;
  }

  return html`
    <div class="screen work">
      ${PauseBtn}
      <span class="round-badge">Vuelta ${roundIdx + 1} de ${effectiveRounds}</span>
      <p class="eyebrow">${session.templateName} · Ejercicio ${exIdx + 1}/${session.exercises.length}</p>
      <div class="circuit-progress">
        ${session.exercises.map((e, i) => html`<span key=${e.id} class=${`circuit-dot ${i < exIdx ? 'done' : i === exIdx ? 'current' : ''}`} />`)}
      </div>
      <button class="work-photo-tap" onClick=${() => setShowWorkDetail(true)} aria-label="Ver cómo se ejecuta">
        <${ExerciseVisual} exId=${ex.id} iconKey=${ex.icon} size=${160} />
        <span class="today-card-taphint">Toca la foto para ver la ejecución</span>
      </button>
      <h2>${ex.name}</h2>
      <div class="target-reps-badge">
        <span class="target-reps-num">${ex.targetReps}</span>
        <span class="target-reps-unit">${ex.isTimeBased ? 'segundos' : 'repeticiones'}</span>
      </div>
      <div class="target-chips">
        <span class="chip">${ex.equip === 'mancuernas' ? `Mancuernas ${ex.weight}kg` : ex.equip === 'mochila' ? `Mochila ${ex.weight}kg` : ex.equip === 'banda' ? 'Banda elástica' : 'Peso corporal'}</span>
        <span class="chip">Tempo ${ex.tempo}</span>
      </div>
      <p class="exercise-cue">${ex.cue}</p>
      <p class="timer-big">${fmtTime(workRemaining)}</p>
      <button class="btn-secondary" onClick=${() => setWorkRemaining(0)}>Ya he terminado</button>
      ${roundIdx === 0 ? html`<p class="level-hint">Nivel actual: ${getExerciseLevel(state, ex.id, ex.level)}/5</p>` : null}
      <p class="auto-note">Al acabar el tiempo pasa sola a descanso.</p>
      ${showWorkDetail ? html`<${ExerciseDetailModal} ex=${ex} onClose=${() => setShowWorkDetail(false)} />` : null}
    </div>
  `;
}

// =====================================================================
// PANTALLA: HIPOPRESIVOS (bloque final, no calentamiento)
// =====================================================================
// Descanso guiado entre el fin del circuito y el bloque hipopresivo. Los
// hipopresivos trabajan en apnea con control diafragmático — hacerlos nada
// más terminar el circuito, con pulsaciones todavía altas, resta eficacia
// tanto a ellos como al trabajo de fuerza recién hecho (el cuerpo sigue en
// modo simpático/esfuerzo). No hay un tiempo "oficial" exacto para esto,
// así que se usa un valor prudente y habitual en la práctica (2 min) con
// una guía de respiración pautada 4s/4s para ayudar a bajar el ritmo
// cardíaco de forma activa, no solo esperando. Se puede saltar en cualquier
// momento si el usuario ya se nota recuperado.
const CIRCUIT_TO_HYPO_REST_SEC = 120;

// Calentamiento corto antes del circuito: un paso general (sube pulsaciones
// poco a poco) + un paso específico del grupo muscular protagonista del día
// — deliberadamente breve (dos pasos, ~50s en total) porque el objetivo es
// activar sin robarle tiempo real al entreno. Saltable en cualquier
// momento, paso a paso o entero.
const WARMUP_GENERAL = { name: 'Marcha suave + rodillas al pecho', duration: 25, cue: 'Sube el ritmo cardíaco poco a poco, sin prisa — el objetivo es activar, no fatigar.', photo: 'Running_Treadmill' };
const WARMUP_BY_GROUP = {
  inferior: { name: 'Sentadilla al aire (activación)', duration: 25, cue: 'Sentadillas sin peso, ritmo suave, bajando un poco más en cada repetición.', photo: 'Bodyweight_Squat' },
  superior_empuje: { name: 'Círculos de brazos + flexión inclinada', duration: 25, cue: 'Círculos grandes de hombro hacia atrás, luego un par de flexiones inclinadas contra una pared o encimera.', photo: 'Incline_Push-Up' },
  superior_traccion: { name: 'Retracción escapular dinámica', duration: 25, cue: 'Igual que la retracción del circuito pero más rápida y sin pausa, para activar la espalda alta.', photo: 'Band_Pull_Apart' },
  core: { name: 'Plancha corta de activación', duration: 20, cue: 'Plancha suave, solo para despertar el abdomen — no busques el fallo aquí.', photo: 'Plank' },
  cardio: { name: 'Rodillas altas suaves', duration: 25, cue: 'Ritmo cómodo, subiendo progresivamente — prepara el sistema cardiovascular sin agotarlo.', photo: 'Running_Treadmill' },
};
function buildWarmupSteps(session) {
  const steps = [WARMUP_GENERAL];
  const primaryGroup = session.groups && session.groups[0];
  if (WARMUP_BY_GROUP[primaryGroup]) steps.push(WARMUP_BY_GROUP[primaryGroup]);
  return steps;
}

function WarmupStepTimer({ step, onDone }) {
  const [remaining, setRemaining] = useCountdown(step.duration, onDone, true);
  useEffect(() => { VoiceCoach.warmupStep(step.name); }, [step.name]);
  return html`
    <div class="photo-wrap" style=${{ width: 200, height: 200, margin: '0 auto 10px' }}>
      <img src=${`${PHOTO_BASE}${step.photo}/0.jpg`} alt="" />
    </div>
    <p class="timer-big">${fmtTime(remaining)}</p>
    <p class="warmup-step-name">${step.name}</p>
    <p class="cue-text">${step.cue}</p>
    <button class="btn-secondary" onClick=${() => setRemaining(0)}>Saltar este paso</button>
  `;
}

function WarmupScreen({ session, onDone }) {
  const steps = useMemo(() => buildWarmupSteps(session), [session]);
  const [stepIdx, setStepIdx] = useState(0);
  const step = steps[stepIdx];
  const isLast = stepIdx === steps.length - 1;
  const totalSec = steps.reduce((s, x) => s + x.duration, 0);
  function handleStepDone() { if (isLast) onDone(); else setStepIdx(i => i + 1); }
  useEffect(() => { VoiceCoach.warmupStart(); }, []);
  return html`
    <div class="screen warmup-screen">
      <p class="eyebrow">Calentamiento rápido (~${totalSec}s) · paso ${stepIdx + 1}/${steps.length}</p>
      <h2>Antes de empezar</h2>
      <${WarmupStepTimer} key=${stepIdx} step=${step} onDone=${handleStepDone} />
      <button class="btn-secondary" style=${{ marginTop: 12 }} onClick=${onDone}>Saltar todo el calentamiento</button>
    </div>
  `;
}

// Estiramiento de cierre: aprovecha el mismo hueco de 2 min que ya existía
// para bajar pulsaciones antes de hipopresivos, en vez de sumar tiempo
// extra al entreno — justo lo que hace falta dado que el tiempo es
// limitado. Estiramiento post-esfuerzo, con el músculo todavía caliente,
// del grupo protagonista del día. Los hipopresivos NO sustituyen esto: son
// respiración/faja abdominal, no flexibilidad — se complementan, no se
// solapan.
const STRETCH_BY_GROUP = {
  inferior: { name: 'Estiramiento de isquios y gemelo de pie', photo: 'Standing_Hamstring_and_Calf_Stretch', cue: 'Pierna adelantada, talón en el suelo, punta hacia arriba, inclina el tronco desde la cadera. Mantén sin rebotar.' },
  superior_empuje: { name: 'Estiramiento de pecho y hombro anterior', photo: 'Chest_And_Front_Of_Shoulder_Stretch', cue: 'Brazo estirado hacia atrás apoyado en pared o marco de puerta, gira el tronco al lado contrario hasta notar el estiramiento en el pecho.' },
  superior_traccion: { name: 'Estiramiento de espalda alta', photo: 'Upper_Back_Stretch', cue: 'Brazos cruzados al frente, redondea la espalda alta como si abrazaras un tronco de árbol, alejando los omóplatos entre sí.' },
  core: { name: 'Estiramiento lateral de tronco', photo: 'Standing_Lateral_Stretch', cue: 'De pie, un brazo arriba, inclina el tronco hacia el lado contrario sin rotar la cadera.' },
  cardio: { name: 'Estiramiento de gemelo contra pared', photo: 'Standing_Gastrocnemius_Calf_Stretch', cue: 'Manos en la pared, pierna a estirar atrás con el talón clavado en el suelo, rodilla recta.' },
};
function getCooldownStretch(session) {
  const primaryGroup = session && session.groups && session.groups[0];
  return STRETCH_BY_GROUP[primaryGroup] || null;
}

function CircuitRestScreen({ session, onDone }) {
  const [remaining, setRemaining] = useCountdown(CIRCUIT_TO_HYPO_REST_SEC, onDone, true);
  const inhale = useFlip(4000);
  const stretch = useMemo(() => getCooldownStretch(session), [session]);
  useEffect(() => { VoiceCoach.beforeHypo(); }, []);
  return html`
    <div class="screen circuit-rest">
      <p class="eyebrow">Circuito terminado</p>
      <h2>Baja pulsaciones antes de los hipopresivos</h2>
      <p class="timer-big rest-timer">${fmtTime(remaining)}</p>
      ${stretch ? html`
        <div class="photo-wrap" style=${{ width: 150, height: 150, margin: '4px auto 8px' }}>
          <img src=${`${PHOTO_BASE}${stretch.photo}/0.jpg`} alt="" />
        </div>
        <p class="warmup-step-name" style=${{ fontSize: 16 }}>${stretch.name}</p>
        <p class="cue-text" style=${{ marginBottom: 4 }}>${stretch.cue}</p>
        <p class="circuit-rest-note">Aprovecha la espera para estirar mientras respiras — el músculo todavía está caliente.</p>
      ` : html`
        <div class="breathe-circle"></div>
        <p class="breathe-label">${inhale ? 'Inhala' : 'Exhala'}</p>
        <p class="cue-text">Respira despacio siguiendo el círculo — inspira 4s, espira 4s. Los hipopresivos empiezan solos al terminar la cuenta.</p>
      `}
      <p class="circuit-rest-note">Si ya notas el pulso tranquilo, puedes empezar antes.</p>
      <button class="btn-secondary" onClick=${() => setRemaining(0)}>Empezar hipopresivos ya</button>
    </div>
  `;
}

function HypopressiveBlock({ onDone, onExit, steps = HYPOPRESSIVE_BLOCK, title = 'Bloque final · Hipopresivos' }) {
  const [idx, setIdx] = useState(0);
  const [running, setRunning] = useState(true);
  const step = steps[idx];
  const startRef = useRef(Date.now());
  const advance = useCallback(() => {
    playIfOn(Sound.playRestEnd);
    if (idx < steps.length - 1) setIdx(i => i + 1);
    else onDone(Math.round((Date.now() - startRef.current) / 1000));
  }, [idx, onDone, steps]);
  const [remaining, setRemaining] = useCountdown(step.duration, advance, running);
  useEffect(() => { setRemaining(step.duration); }, [idx]);
  useEffect(() => { playIfOn(Sound.playHypoStep); VoiceCoach.hypoStep(step.name); }, [idx]);
  const pct = ((step.duration - remaining) / step.duration) * 100;

  return html`
    <div class="screen hypo">
      <div class="session-controls">
        <button class="end-btn" onClick=${() => { if (confirm('¿Volver al inicio ahora? Se perderá el registro de esta vuelta.')) onExit(); }} aria-label="Volver al inicio">←</button>
      </div>
      <p class="eyebrow">${title} · Paso ${idx + 1}/${steps.length}</p>
      <div class="mobility-ring">
        <svg viewBox="0 0 120 120" class="ring-svg">
          <circle cx="60" cy="60" r="54" class="ring-bg" />
          <circle cx="60" cy="60" r="54" class="ring-fg" style=${{ strokeDashoffset: 339.3 - (339.3 * pct) / 100 }} />
        </svg>
        <div class="ring-center"><${ExerciseVisual} exId=${step.id} iconKey=${step.icon} size=${120} /></div>
      </div>
      <h2>${step.name}</h2>
      <p class="cue-text">${step.cue}</p>
      <p class="timer-big">${fmtTime(remaining)}</p>
      <div class="mobility-controls">
        <button class="btn-secondary" onClick=${() => setRunning(r => !r)}>${running ? 'Pausar' : 'Reanudar'}</button>
        <button class="btn-primary" onClick=${advance}>${idx < steps.length - 1 ? 'Saltar paso' : 'Finalizar'}</button>
      </div>
      <div class="mobility-dots">
        ${steps.map((s, i) => html`<span key=${s.id} class=${`mdot ${i === idx ? 'active' : ''} ${i < idx ? 'done' : ''}`} />`)}
      </div>
    </div>
  `;
}
