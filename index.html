    const gapStability=gaps.length>=2?Math.max(0,1-(Math.max(...gaps)-Math.min(...gaps))/Math.max(7,Math.max(...gaps))):0.5;
    let status='estable';
    if(avgRpe!=null&&avgRpe>=8.5&&trend<0) status='recuperacion_lenta';
    else if(avgRpe!=null&&avgRpe<=6.5&&trend>=0.02) status='recuperacion_rapida';
    else if(trend>=0.03) status='progresando';
    const recoveryDays=gapMedian!=null?Math.round(gapMedian*10)/10:(meanGap!=null?Math.round(meanGap*10)/10:null);
    return {prefix,exposures:rows.length,recoveryDays,avgRpe:avgRpe!=null?Math.round(avgRpe*10)/10:null,trend,stability:Math.round(gapStability*100)/100,status,lastDate:rows.at(-1)?.date||null};
  } catch(e){ return {prefix,exposures:0,recoveryDays:null,avgRpe:null,trend:0,stability:0.5,status:'sin_datos'}; }
}
function getIndividualResponseProfiles(state, prefixes=Object.keys(AESTHETIC_FAMILY_WEIGHTS)) {
  return prefixes.map(prefix=>getIndividualExerciseResponseProfile(state,prefix)).filter(x=>x.exposures>0);
}

// =====================================================================
// V132 — MOTOR DE DOSIS POR FAMILIA
// Convierte la prioridad estética en una asignación relativa del estímulo.
// No añade tiempo, vueltas, series ni peso: decide dónde merece la pena
// colocar una oportunidad que ya existe. La dosis se estima con volumen
// efectivo reciente + respuesta individual + prioridad estética + exposición
// reciente. Las familias con déficit productivo reciben una ventaja acotada;
// las que ya acumulan suficiente estímulo no absorben automáticamente más.
// =====================================================================
function getAestheticFamilyDosePlan(state){
  try{
    const recent=getRecentMuscleEffectiveVolume(state,14);
    const priority=getPriorityFamilies(state);
    const weights=AESTHETIC_FAMILY_WEIGHTS||{};
    const responseMap={};
    priority.forEach(prefix=>{
      try{ responseMap[prefix]=getFamilyTrainingResponse(state,prefix)||{}; }catch(e){ responseMap[prefix]={}; }
    });
    const raw=priority.map(prefix=>{
      const base=Number(weights[prefix]||1);
      const focus=EFFECTIVE_VOLUME_FOCUS[prefix]||[];
      const volume=focus.length
        ? focus.reduce((sum,m)=>sum+Number(recent.totals?.[m]||0),0)/focus.length
        : Number(recent.totals?.[prefix]||0);
      const response=responseMap[prefix]||{};
      const quality=Number(response.quality);
      const trend=Number(response.trend);
      const exposures=Number(response.exposures||0);
      // Cuanto más volumen relativo reciente, menor necesidad de asignar otra
      // oportunidad. Se calcula dentro del conjunto actual, no contra un
      // volumen teórico universal.
      return {prefix,base,volume,quality,trend,exposures};
    });
    const vols=raw.map(x=>x.volume).filter(Number.isFinite);
    const max=Math.max(1,...vols), min=Math.min(0,...vols);
    const range=Math.max(1,max-min);
    const readiness=computeReadinessScore(getTodayReadiness(state));
    const recovery=getRecoveryTrend(state);
    const recoveryDrop=Number(recovery?.delta)<-0.10;
    const conservative=readiness!=null && readiness<3.0 || recoveryDrop;
    const totalBase=raw.reduce((a,x)=>a+x.base,0)||1;
    const rows=raw.map(x=>{
      const volumeGap=Math.max(0,Math.min(1,(max-x.volume)/range));
      let score=x.base/totalBase;
      score*=1 + volumeGap*0.55;
      if(x.exposures>=3 && x.quality>=0.58) score*=1.08;
      if(x.exposures>=3 && x.trend>=0.04) score*=1.06;
      if(x.exposures>=3 && x.trend<=-0.04 && x.quality<0.52) score*=0.88;
      if(conservative) score=1/Math.max(1,raw.length) + (score-1/Math.max(1,raw.length))*0.55;
      return {...x,volumeGap:Number(volumeGap.toFixed(2)),allocation:Number(score.toFixed(3))};
    });
    const sum=rows.reduce((a,x)=>a+x.allocation,0)||1;
    rows.forEach(x=>x.share=Number((x.allocation/sum).toFixed(3)));
    rows.sort((a,b)=>b.share-a.share);
    const top=rows[0]||null;
    return {rows,top,conservative,readiness,recoveryDelta:recovery?.delta??null,windowDays:14};
  }catch(e){
    console.warn('Forma55 V132 family dose plan skipped:',e);
    return {rows:[],top:null,conservative:false,readiness:null,recoveryDelta:null,windowDays:14};
  }
}

function getAestheticFamilyDoseBoost(state,prefix){
  try{
    const plan=getAestheticFamilyDosePlan(state);
    const row=plan.rows.find(x=>x.prefix===prefix);
    if(!row) return 0;
    // Solo modifica el desempate del selector: máximo ±0.45 puntos.
    const mean=plan.rows.length ? 1/plan.rows.length : 1;
    const delta=Math.max(-0.45,Math.min(0.45,(row.share-mean)*3.0));
    return Number(delta.toFixed(3));
  }catch(e){ return 0; }
}

// =====================================================================
// V133 — BUCLE CERRADO DE ESPECIALIZACIÓN ESTÉTICA
// Aprende si una prioridad reciente merece mantenerse. No atribuye por
// defecto cambios corporales a una sola familia: usa la respuesta de
// entrenamiento de la propia familia como señal de eficacia, y exige
// exposiciones suficientes antes de modificar la prioridad.
// =====================================================================
// =====================================================================
// V134 — RESULTADO GLOBAL DE TRANSFORMACIÓN CORPORAL
// Cierra el circuito a nivel del objetivo principal. No atribuye una
// variación corporal a una familia concreta: evalúa la estrategia global
// usando mediciones, rendimiento, recuperación, adherencia y composición.
// La salida es una señal de decisión, no un diagnóstico ni un cambio
// automático de dieta, cargas o volumen.
// =====================================================================
function getGlobalTransformationOutcome(state){
  try{
    const ms=(state.measurements||[]).filter(m=>m&&m.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    if(ms.length<2) return {status:'insuficiente',label:'Necesitamos más datos',score:null,confidence:0,reason:'Todavía no hay suficientes mediciones comparables para valorar el resultado corporal.'};
    const current=ms[ms.length-1];
    const targetTime=new Date(String(current.date)+'T12:00:00').getTime()-28*86400000;
    let base=ms[0];
    for(let i=ms.length-2;i>=0;i--){
      const t=new Date(String(ms[i].date)+'T12:00:00').getTime();
      if(Number.isFinite(t) && t<=targetTime){base=ms[i];break;}
      base=ms[i];
    }
    const waistA=Number(base.waistCm), waistB=Number(current.waistCm);
    const weightA=Number(base.weightKg), weightB=Number(current.weightKg);
    const chestA=Number(base.chestCm), chestB=Number(current.chestCm);
    const armA=Number(base.armCm), armB=Number(current.armCm);
    const waistDelta=Number.isFinite(waistA)&&Number.isFinite(waistB)?waistB-waistA:null;
    const weightDelta=Number.isFinite(weightA)&&Number.isFinite(weightB)?weightB-weightA:null;
    const chestDelta=Number.isFinite(chestA)&&Number.isFinite(chestB)?chestB-chestA:null;
    const armDelta=Number.isFinite(armA)&&Number.isFinite(armB)?armB-armA:null;

    const perf=getPerformanceStability(state,60)||{};
    const perfTrend=Number(perf.performanceTrend);
    const readiness=computeReadinessScore(getTodayReadiness(state));
    const recovery=getRecoveryTrend(state)||{};
    const recoveryDelta=Number(recovery.delta);
    const adherence=getAdherenceControl(state)||{};
    const adherenceScore=Number(adherence.score);
    const composition=getCompositionMotor(state)||{};
    const actualDeficit=Number(composition.actual);

    let score=50, evidence=0, positives=[], cautions=[];
    if(waistDelta!==null){ evidence++; if(waistDelta<=-0.5){score+=25;positives.push('cintura descendente');} else if(waistDelta>=0.8){score-=20;cautions.push('cintura ascendente');} }
    if(weightDelta!==null){ evidence++; if(weightDelta<=0.6 && weightDelta>=-1.2){score+=8;positives.push('peso compatible con recomposición');} else if(weightDelta<-1.2){score-=12;cautions.push('pérdida de peso rápida');} }
    if(chestDelta!==null){ evidence++; if(chestDelta>=0.3){score+=5;positives.push('pecho estable/mejorando');} }
    if(armDelta!==null){ evidence++; if(armDelta>=0.1){score+=5;positives.push('brazo estable/mejorando');} }
    if(Number.isFinite(perfTrend)){ evidence++; if(perfTrend>=-1){score+=8;positives.push('rendimiento estable');} else if(perfTrend<=-3){score-=15;cautions.push('rendimiento descendente');} }
    if(Number.isFinite(readiness)){ evidence++; if(readiness>=3.2) score+=4; else if(readiness<=2.5){score-=8;cautions.push('recuperación actual baja');} }
    if(Number.isFinite(recoveryDelta)){ evidence++; if(recoveryDelta>=-0.05) score+=3; else if(recoveryDelta<=-0.12){score-=6;cautions.push('recuperación en descenso');} }
    if(Number.isFinite(adherenceScore)){ evidence++; if(adherenceScore>=70) score+=4; else if(adherenceScore<50) score-=5;cautions.push('adherencia incompleta'); }
    if(Number.isFinite(actualDeficit)){ evidence++; if(actualDeficit>=-750 && actualDeficit<=-200) score+=3; else if(actualDeficit<-900){score-=8;cautions.push('déficit real muy elevado');} }
    score=Math.max(0,Math.min(100,Math.round(score)));
    const confidence=Math.min(100,Math.round(evidence/9*100));
    let status='estable', label='Transformación en curso', reason='Las señales globales no muestran un conflicto dominante.';
    if(evidence<4){status='insuficiente';label='Transformación en observación';reason='Hay pocas señales longitudinales comparables; no conviene sacar conclusiones fuertes.';}
    else if(score>=72 && !cautions.includes('rendimiento descendente') && !cautions.includes('pérdida de peso rápida')){status='productiva';label='Transformación productiva';reason=positives.slice(0,3).join(', ')||'Las señales globales son compatibles con avance.';}
    else if(score<=42 || cautions.includes('rendimiento descendente') || cautions.includes('déficit real muy elevado')){status='revisar';label='Revisar dosis global';reason=cautions.slice(0,3).join(', ')||'Hay señales que aconsejan consolidar antes de seguir acelerando.';}
    return {status,label,score,confidence,reason,waistDelta,weightDelta,chestDelta,armDelta,perfTrend,readiness,recoveryDelta,adherenceScore,actualDeficit,baseDate:base.date,currentDate:current.date,positives,cautions};
  }catch(e){
    console.warn('Forma55 V134 global transformation outcome skipped:',e);
    return {status:'insuficiente',label:'Transformación en observación',score:null,confidence:0,reason:'Lectura global no disponible en este momento.'};
  }
}

function getAestheticSpecializationLearning(state, prefix){
  try{
    const response=getFamilyTrainingResponse(state,prefix)||{};
    const exposures=Number(response.exposures||0);
    const quality=Number(response.quality);
    const trend=Number(response.trend);
    if(exposures<3 || !Number.isFinite(quality)) return {factor:1,confidence:0,reason:'insuficiente'};
    let factor=1;
    if(quality>=0.68 && trend>=0.03) factor+=0.08;
    else if(quality>=0.58 && trend>=0.01) factor+=0.04;
    else if(quality<0.50 && trend<=-0.04) factor-=0.08;
    // Recuperación global desfavorable limita el aprendizaje, no lo convierte
    // en una penalización fuerte: primero consolidamos y luego verificamos.
    const recovery=getRecoveryTrend(state);
    if(Number(recovery?.delta)<-0.10) factor=1+(factor-1)*0.55;
    return {factor:Number(factor.toFixed(3)),confidence:Math.min(1,exposures/6),reason:factor>1?'respuesta favorable':factor<1?'respuesta desfavorable':'respuesta estable'};
  }catch(e){ return {factor:1,confidence:0,reason:'error'}; }
}

function getAestheticSpecializationLearningMap(state){
  const out={};
  for(const prefix of getPriorityFamilies(state)) out[prefix]=getAestheticSpecializationLearning(state,prefix);
  return out;
}

function getDynamicSpecializationScore(state, prefix, recent, volumeBalancing) {
  const base = getFamilyAestheticScore(state, prefix, recent, volumeBalancing);
  const response = getFamilyTrainingResponse(state, prefix);
  // Modificador pequeño y deliberadamente acotado: el impacto estético manda;
  // la respuesta histórica solo decide cuánto conviene insistir cuando dos
  // opciones son razonablemente equivalentes.
  let modifier = 1;
  if (response.exposures >= 3) {
    if (response.trend >= 0.04 && response.quality >= 0.58) modifier += 0.14;
    else if (response.trend >= 0.02) modifier += 0.07;
    else if (response.trend <= -0.04 && response.quality < 0.52) modifier -= 0.10;
  }
  const phaseBAdj=getAdaptiveResponseAdjustment(state,prefix);
  const doseBoost=getAestheticFamilyDoseBoost(state,prefix);
  const learning=getAestheticSpecializationLearning(state,prefix);
  return base * modifier * learning.factor + phaseBAdj + doseBoost;
}

function getFamilyAestheticScore(state, prefix, recent, volumeBalancing) {
  const base = AESTHETIC_FAMILY_WEIGHTS[prefix] || 1.0;
  const focus = EFFECTIVE_VOLUME_FOCUS[prefix] || [];
  if (!focus.length) return base;
  const avg = focus.reduce((sum, m) => sum + (recent.totals[m] || 0), 0) / focus.length;
  const vals = Object.values(recent.totals).filter(v => v > 0);
  const min = vals.length ? Math.min(...vals) : 0;
  const max = vals.length ? Math.max(...vals) : 0;
  const range = Math.max(1, max - min);
  // Déficit de volumen = hasta +1.5 puntos. Solo entra cuando hay datos
  // suficientes para no penalizar familias recién incorporadas.
  const deficitBoost = recent.sessions >= 3 ? Math.max(0, Math.min(1.5, ((max - avg) / range) * 1.5)) : 0;
  // El motor da una pequeña ventaja a una meseta repetida: más oportunidades
  // de exposición, no un salto automático de carga.
  let plateauBoost = 0;
  if (recent.sessions >= 3) {
    const plateau = getFamilyPlateauCandidates(state, 60).some(x => x.family === prefix);
    plateauBoost = plateau ? 0.55 : 0;
  }
  return base + (volumeBalancing ? deficitBoost : deficitBoost * 0.65) + plateauBoost;
}


// V65 — FEEDBACK DE DOLOR COMPLETO: 'Sin dolor relevante' es también
// una respuesta válida y persistente. No debe dejar el recordatorio abierto.
// Se almacena como 'none', pero nunca se interpreta como una zona a evitar.

// P4.15 — CONEXIÓN REAL DEL OPTIMIZADOR ESTÉTICO CON LA SELECCIÓN.
// Hasta ahora getAestheticOptimization/getAestheticVolumeAllocation daban una
// lectura útil, pero el selector principal podía ignorarla parcialmente.
// Este puente convierte esa lectura en una pequeña ventaja de desempate:
// nunca añade series, nunca cambia cargas/niveles y nunca puede saltarse una
// restricción de dolor/equipamiento. Su función es decidir qué familia gana
// cuando varias opciones son razonables.
function getAestheticSelectionBoost(state, prefix) {
  try {
    const data = getAestheticVolumeAllocation(state);
    const idx = (data.top || []).findIndex(x => x.prefix === prefix);
    if (idx < 0) return 0;
    const action = getTransformationEngine(state)?.action || 'Óptimo';
    const base = idx === 0 ? 0.90 : idx === 1 ? 0.48 : 0.22;
    const measurementBoost=getAestheticMeasurementBoost(state,prefix);
    const actionBoost=action === 'Acelerar' ? base * 1.15 : action === 'Frenar' ? base * 0.35 : base;
    return actionBoost + measurementBoost;
  } catch (e) {
    return 0;
  }
}

function pickExercisesForTemplate(state, template) {
  const picked = []; const groups = template.groups; const usedIds = new Set();
  const hasEquip = e => !e.reqEquip || (state.equipment && state.equipment[e.reqEquip]);
  const todayPainAreaRaw = state.painLog && state.painLog[localDateKey()];
  const todayPainArea = todayPainAreaRaw && todayPainAreaRaw !== 'none' ? todayPainAreaRaw : null;
  const avoidFamilies = (todayPainArea && PAIN_AVOID_FAMILIES[todayPainArea]) || [];
  const notAvoided = e => !avoidFamilies.includes(e.id.split('_')[0]);
  const recentVolume = getRecentMuscleEffectiveVolume(state, 14);
  const volumeBalancing = shouldUseVolumeBalancing(state, recentVolume);

  // Paso 1: reserva un hueco a la familia correctiva prioritaria de cada
  // grupo de hoy (si el grupo tiene alguna), antes de repartir el resto.
  // Así "zancada lateral" y el trabajo postural aparecen cada semana en
  // vez de cuando le toque en la rotación.
  //
  // BUG REAL ENCONTRADO Y CORREGIDO (agosto 2026): 'superior_traccion'
  // tiene CUATRO familias prioritarias a la vez (retract/ytw/wrist/
  // rotator) e 'inferior' tiene TRES (slu/hipabd/hip), pero este paso
  // solo reservaba UN hueco por grupo y siempre cogía `[0]` — la primera
  // familia por orden de aparición en EXERCISES. Con datos reales de 24
  // sesiones (150 ejercicios registrados): ytw salió 12 veces, retract 11,
  // pero WRIST (la única familia dedicada a antebrazo) solo 1 vez, y
  // ROTATOR solo 2. Mismo patrón en 'inferior': slu salió 9 veces, hip 5,
  // pero HIPABD (glúteo medio/estabilidad de cadera) solo 2. No eran las
  // familias menos importantes las que salían menos — eran las que
  // estaban escritas más tarde en el array. Fix: cuando hay varias
  // familias prioritarias empatadas en un mismo grupo, se turnan en
  // round-robin (por `totalSessionsDone`) en vez de ganar siempre la
  // misma. Esto reparte de forma justa TANTO el trabajo de antebrazo
  // (wrist) y manguito rotador (rotator) dentro de 'superior_traccion',
  // COMO el de glúteo medio (hipabd) dentro de 'inferior' — la causa real
  // de la poca variedad que reportas en antebrazo y glúteo no era el
  // catálogo (ya tenía suficientes ejercicios), era este reparto injusto.
  const priorityFamiliesActive = getPriorityFamilies(state);
  for (const group of groups) {
    if (picked.length >= EXERCISES_PER_SESSION) break;
    const priorityCandidates = EXERCISES.filter(e => e.group === group && priorityFamiliesActive.includes(e.id.split('_')[0]) && !usedIds.has(e.id.split('_')[0]) && hasEquip(e) && notAvoided(e));
    if (priorityCandidates.length) {
      const priorityFamilies = [...new Set(priorityCandidates.map(e => e.id.split('_')[0]))];
      // Antes: empate casi puro por round-robin. Ahora se prioriza el potencial
      // estético + déficit de trabajo + meseta, y solo después se usa la rotación
      // para desempatar. Esto acelera el objetivo sin romper la variedad.
      const ranked = priorityFamilies.slice().sort((a, b) => {
        const sb = getDynamicSpecializationScore(state, b, recentVolume, volumeBalancing) + getAestheticSelectionBoost(state, b) + getAestheticGoalSelectionBoost(state, b) + getPostureBridgeFamilyBoost(state, b);
        const sa = getDynamicSpecializationScore(state, a, recentVolume, volumeBalancing) + getAestheticSelectionBoost(state, a) + getAestheticGoalSelectionBoost(state, a) + getPostureBridgeFamilyBoost(state, a);
        if (Math.abs(sb - sa) > 0.12) return sb - sa;
        const va = familyVolumePriority(state, a, recentVolume);
        const vb = familyVolumePriority(state, b, recentVolume);
        if (Math.abs(va - vb) > 0.15) return va - vb;
        return ((state.totalSessionsDone || 0) + priorityFamilies.indexOf(a)) % priorityFamilies.length
             - ((state.totalSessionsDone || 0) + priorityFamilies.indexOf(b)) % priorityFamilies.length;
      });
      const prefix = ranked[0];
      const historicalLevel = getFamilyLevel(state, prefix);
      const effective = getEffectiveExerciseLevel(state, prefix, historicalLevel);
      const variant = findVariantByLevel(prefix, effective.level, state) || priorityCandidates.find(e => e.id.split('_')[0] === prefix);
      picked.push(variant); usedIds.add(prefix);
    }
  }

  // Paso 2: el resto de huecos, con el reparto rotativo de siempre.
  let gi = 0; let guard = 0;
  // Contador real de uso por familia, a partir del historial real — se
  // calcula una vez por sesión generada, no en cada iteración del bucle.
  // SEGUNDO INTENTO DE FIX (el primero, usar totalSessionsDone en el
  // módulo, empeoró las cosas — verificado simulando 120 sesiones: jj/
  // hik/skater/burpee/carry caían a 4 apariciones y slu subía a 60).
  // Causa real del primer fallo: cualquier índice basado en módulo se
  // rompe si el grupo no aparece todas las sesiones (aquí 'cardio' solo
  // sale ciertos días de la plantilla de 6) — según la relación entre ese
  // ciclo y el número de familias competidoras, el módulo puede visitar
  // solo una fracción de los restos posibles para siempre, sin importar
  // cuánto se simule (trampa de aritmética modular, no falta de tiempo).
  // Fix real: en vez de calcular un índice, se elige directamente la
  // familia con MENOS apariciones reales en el historial — autocorrectivo
  // de verdad, no depende de que ningún ciclo de sesiones "encaje"
  // matemáticamente con el número de familias del grupo.
  const usageCounts = {};
  (state.history || []).forEach(h => {
    if (!h.exerciseId) return;
    const p = h.exerciseId.split('_')[0];
    usageCounts[p] = (usageCounts[p] || 0) + 1;
  });
  while (picked.length < EXERCISES_PER_SESSION && guard < 40) {
    guard++;
    const group = groups[gi % groups.length];
    const candidates = EXERCISES.filter(e => e.group === group && !usedIds.has(e.id.split('_')[0]) && hasEquip(e) && notAvoided(e));
    if (candidates.length) {
      const familyPrefixes = [...new Set(candidates.map(e => e.id.split('_')[0]))];
      familyPrefixes.sort((a, b) => {
        if (volumeBalancing) {
          const va = familyVolumePriority(state, a, recentVolume);
          const vb = familyVolumePriority(state, b, recentVolume);
          if (Math.abs(va - vb) > 0.18) return va - vb;
        }
        const ba = getAestheticSelectionBoost(state, a) + getAestheticGoalSelectionBoost(state, a) + getPostureBridgeFamilyBoost(state, a);
        const bb = getAestheticSelectionBoost(state, b) + getAestheticGoalSelectionBoost(state, b) + getPostureBridgeFamilyBoost(state, b);
        if (Math.abs(ba - bb) > 0.08) return bb - ba;
        return (usageCounts[a] || 0) - (usageCounts[b] || 0);
      });
      const prefix = familyPrefixes[0];
      const historicalLevel = getFamilyLevel(state, prefix);
      const effective = getEffectiveExerciseLevel(state, prefix, historicalLevel);
      const variant = findVariantByLevel(prefix, effective.level, state) || candidates[0];
      picked.push(variant); usedIds.add(prefix);
      // Se cuenta como "usada" también dentro de esta simulación de una
      // sesión, para que si el mismo grupo se repite (día full body con
      // varios grupos) no elija la misma familia dos veces por no haberse
      // actualizado el contador real todavía.
      usageCounts[prefix] = (usageCounts[prefix] || 0) + 1;
    }
    gi++;
  }
  return picked;
}
// Peso por ejercicio: hasta ahora TODOS los ejercicios de mancuernas
// compartían un único número global (state.dumbbellWeight) — por eso no
// había forma de subir la elevación lateral a 4kg sin subir también el
// Y-T-W a la vez. Ahora cada familia puede tener su propio peso
// (state.exerciseWeights[prefix]); si una familia no se ha personalizado
// todavía, cae al peso global de siempre (compatibilidad con el progreso
// ya guardado, nadie pierde nada al actualizar).
function getExerciseWeight(state, prefix, equipType, exerciseId=null) {
  const exact = exerciseId && state.exerciseWeightsById && state.exerciseWeightsById[exerciseId];
  if (exact != null) return exact;
  const custom = state.exerciseWeights && state.exerciseWeights[prefix];
  if (custom != null) return custom;
  return equipType === 'mochila' ? (state.backpackWeight || 6) : (state.dumbbellWeight || 2);
}
function setExerciseWeight(state, prefix, weight) {
  if (!state.exerciseWeights) state.exerciseWeights = {};
  state.exerciseWeights[prefix] = weight;
}
function setExactExerciseWeight(state, exerciseId, weight) {
  if (!state.exerciseWeightsById || typeof state.exerciseWeightsById !== 'object') state.exerciseWeightsById = {};
  state.exerciseWeightsById[exerciseId] = weight;
}
function withCurrentWeight(ex, state) {
  const prefix = ex.id.split('_')[0];
  if (ex.equip === 'mancuernas') return { ...ex, weight: getExerciseWeight(state, prefix, 'mancuernas', ex.id) };
  if (ex.equip === 'mochila') return { ...ex, weight: getExerciseWeight(state, prefix, 'mochila', ex.id) };
  return ex;
}
function hasReqEquip(ex, state) { return !ex.reqEquip || (state.equipment && state.equipment[ex.reqEquip]); }

// ---- Recomendación de cuándo subir el peso ----
// Criterio: si el usuario ya está en la variante más difícil disponible con
// mancuernas/mochila para una familia de ejercicio, y lleva volumeBonus >= 3
// (varias sesiones seguidas cumpliendo o superando el objetivo con buen RPE
// sin poder subir de nivel porque ya no hay variante más difícil), significa
// que el peso actual se le ha quedado corto — el próximo paso lógico es
// aumentar la carga externa, no añadir más repeticiones sin límite.
function computeWeightAdvice(state) {
  const families = [...new Set(EXERCISES.map(e => e.id.split('_')[0]))];
  // dumbbell/backpack se mantienen (texto agregado que ya se usaba en otro
  // sitio); items es la lista accionable nueva, con prefijo y peso actual
  // de CADA familia concreta, para poder subir cada una por separado.
  const advice = { dumbbell: [], backpack: [], items: [] };
  for (const prefix of families) {
    const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix);
    const rec = state.exerciseLevels[Object.keys(state.exerciseLevels).find(id => id.split('_')[0] === prefix)];
    if (!rec) continue;
    const currentLevel = rec.level;
    const currentEx = family.find(e => e.level === currentLevel);
    if (!currentEx) continue;
    const maxDumbbellLevel = Math.max(0, ...family.filter(e => e.equip === 'mancuernas').map(e => e.level));
    const maxBackpackLevel = Math.max(0, ...family.filter(e => e.equip === 'mochila').map(e => e.level));
    if (currentEx.equip === 'mancuernas' && currentLevel === maxDumbbellLevel && (rec.volumeBonus || 0) >= 3) {
      advice.dumbbell.push(currentEx.name);
      advice.items.push({ prefix, exerciseId: currentEx.id, name: currentEx.name, equipType: 'mancuernas', currentWeight: getExerciseWeight(state, prefix, 'mancuernas', currentEx.id) });
    }
    if (currentEx.equip === 'mochila' && currentLevel === maxBackpackLevel && (rec.volumeBonus || 0) >= 3) {
      advice.backpack.push(currentEx.name);
      advice.items.push({ prefix, exerciseId: currentEx.id, name: currentEx.name, equipType: 'mochila', currentWeight: getExerciseWeight(state, prefix, 'mochila', currentEx.id) });
    }
  }
  return advice;
}

// V140 — MOTOR DE COHERENCIA DE SESIÓN + CORRECCIÓN DE PROPAGACIÓN + UX DIARIA.
// Comprueba la sesión completa como una unidad: cobertura de familias prioritarias,
// redundancia, conflicto con recuperación y modalidad de progresión. No cambia
// ejercicios ni volumen automáticamente; solo identifica si la composición de hoy
// utiliza bien la dosis disponible.
function getSessionCoherenceAudit(state, session=null) {
  try {
    const s=session || generateSession(state);
    const exs=Array.isArray(s?.exercises)?s.exercises:[];
    if(!exs.length) return {status:'sin_datos',label:'Sin auditoría',score:null,summary:'No hay ejercicios suficientes para auditar la sesión.'};
    const priority=new Set(getPriorityFamilies(state)||[]);
    const prefixes=exs.map(e=>String(e.id||'').split('_')[0]);
    const unique=new Set(prefixes);
    const counts=prefixes.reduce((a,p)=>(a[p]=(a[p]||0)+1,a),{});
    const priorityPresent=prefixes.filter(p=>priority.has(p));
    const coverage=priority.size?Math.min(1,priorityPresent.length/Math.min(priority.size,Math.max(1,Math.ceil(exs.length*.5)))):1;
    const duplicatePenalty=Object.values(counts).reduce((n,c)=>n+Math.max(0,c-1),0);
    const redundantRatio=duplicatePenalty/Math.max(1,exs.length);
    const modalities=exs.map(e=>getExerciseProgressionModality(state,e,{targetReps:e.targetReps})).filter(Boolean);
    const protect=modalities.filter(m=>m.mode==='protect').length;
    const consolidate=modalities.filter(m=>m.mode==='consolidar'||m.mode==='correction').length;
    const progression=modalities.filter(m=>['variant','volume','load','quality'].includes(m.mode)).length;
    const readinessObj=state.readinessLog&&typeof state.readinessLog==='object'&&!Array.isArray(state.readinessLog)?state.readinessLog:{};
    const today=localDateKey();
    const readiness=readinessObj[today]?computeReadinessScore(readinessObj[today]):null;
    const pain=(state.painLog||{})[today];
    let score=70 + coverage*20 - redundantRatio*25;
    if(protect>0) score-=Math.min(25,protect*8);
    else if(consolidate>Math.ceil(exs.length*.5)) score-=8;
    if(progression>0 && !pain && (readiness==null || readiness>=3.2)) score+=5;
    score=Math.max(0,Math.min(100,Math.round(score)));
    let status='equilibrada',label='Sesión bien equilibrada',summary='La composición utiliza la dosis disponible sin una redundancia relevante.';
    if(protect>0){status='proteger';label='Sesión condicionada';summary=`${protect} ejercicio${protect>1?'s':''} presenta${protect===1?'':'n'} una señal de protección hoy; no conviene interpretar la sesión como una invitación a añadir dificultad.`;}
    else if(redundantRatio>=.34){status='redundante';label='Revisar composición';summary='Hay demasiadas exposiciones de la misma familia para la dosis disponible; conviene vigilar la selección antes de añadir más trabajo.';}
    else if(priority.size && coverage<.5){status='cobertura';label='Cobertura estética incompleta';summary='La sesión deja fuera parte de las familias prioritarias; la rotación debe comprobar si esa ausencia es intencionada.';}
    else if(progression>0){status='oportunidad';label='Dosis con margen productivo';summary=`${progression} ejercicio${progression>1?'s':''} tiene${progression===1?'':'n'} una modalidad de progresión disponible sin exigir más vueltas por sí misma.`;}
    return {status,label,score,summary,exerciseCount:exs.length,uniqueFamilies:unique.size,priorityCoverage:Math.round(coverage*100),duplicatePenalty,progressionCandidates:progression,protectCandidates:protect,consolidateCandidates:consolidate,modalities};
  } catch(e) { return {status:'sin_datos',label:'Auditoría no disponible',score:null,summary:'Se mantiene la sesión actual; la auditoría no ha podido completarse.'}; }
}

function generateSession(state) {
  // La sesión de hoy ya NO depende de qué día de la semana es — depende de
  // cuántas sesiones reales llevas hechas (state.totalSessionsDone). Así,
  // si un día no entrenas, esa casilla de la rotación no desaparece: la
  // próxima vez que entrenes (sea el día que sea) retoma exactamente donde
  // lo dejaste. Y si haces una sesión extra el mismo día, esto mismo hace
  // que te toque automáticamente la SIGUIENTE casilla (grupos musculares
  // distintos a los que acabas de trabajar), nunca repetir en caliente.
  const template = WEEKLY_TEMPLATE[state.totalSessionsDone % WEEKLY_TEMPLATE.length];
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  const picked = pickExercisesForTemplate(state, template);
  const exercisesWithTargets = picked.map(ex => ({ ...withCurrentWeight(ex, state), targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: computeRestSec(ex, phaseKey) }));
  return { templateName: template.name, groups: template.groups, phaseKey, phase, exercises: exercisesWithTargets };
}
function getWeeklyPlan(state) {
  const phaseKey = state.cycleWeek; const phase = PHASES[phaseKey];
  return WEEKLY_TEMPLATE.map(template => {
    const picked = pickExercisesForTemplate(state, template);
    return { day: template.day, name: template.name, exercises: picked.map(ex => ({ ...withCurrentWeight(ex, state), targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: computeRestSec(ex, phaseKey) })) };
  });
}
function recordMasterDecisionSnapshot(state){
  try{
    if(!Array.isArray(state.masterDecisionLog)) state.masterDecisionLog=[];
    const m=getMasterDecisionOrchestrator(state);
    const today=localDateKey();
    // Una sola fotografía por día/estado: evita duplicados si el circuito se completa
    // más de una vez por un flujo de interfaz inesperado.
    const exists=state.masterDecisionLog.some(x=>x && x.dateKey===today && x.totalSessionsDone===state.totalSessionsDone);
    if(exists) return;
    state.masterDecisionLog.push({
      dateKey:today, date:new Date().toISOString(), totalSessionsDone:state.totalSessionsDone,
      stateKey:m.stateKey, stateLabel:m.stateLabel, action:m.action, priority:m.priority,
      confidence:m.confidence, readiness:m.readiness, painToday:m.painToday,
      focus:m.focus, nutrition:m.nutrition, transformationScore:m.transformationScore,
      globalTransformationStatus:m.globalTransformation?.status || null,
      globalTransformationScore:m.globalTransformation?.score ?? null,
      phaseKey:m.phaseKey, why:Array.isArray(m.why)?m.why.slice(0,3):[]
    });
    // Conservamos el historial completo; solo limitamos la lectura de resultados,
    // nunca borramos decisiones ya registradas.
  }catch(e){ console.warn('Forma55 V127 decision snapshot:',e); }
}

function getMasterDecisionOutcome(state, limit=8){
  const log=Array.isArray(state.masterDecisionLog)?state.masterDecisionLog:[];
  const sessions=(state.sessionLog||[]).filter(x=>x&&!x.standalone).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const rows=[];
  for(let i=0;i<log.length;i++){
    const d=log[i], next=sessions.find(x=>String(x.date||'')>String(d.date||''));
    if(!next) continue;
    const readinessNext=state.readinessLog?.[localDateKey(new Date(next.date))];
    const effort=next.effortRating||null;
    const nextRounds=Number(next.rounds);
    let result='parcial', detail='La siguiente exposición aporta datos, pero aún no permite confirmar plenamente el efecto.';
    if(d.stateKey==='progresar'){
      if(effort==='dificil' || (Number.isFinite(nextRounds)&&nextRounds<=1)){result='no_confirmado';detail='La siguiente sesión mostró una respuesta demasiado exigente para confirmar la aceleración.';}
      else if(effort==='normal'||effort==='facil'){result='confirmado';detail='La siguiente sesión mantuvo una respuesta compatible con progresar con control.';}
    } else if(d.stateKey==='consolidar'||d.stateKey==='recuperar'){
      if(effort==='dificil'){result='no_confirmado';detail='La sesión siguiente siguió siendo exigente; la consolidación/recuperación necesita más evidencia.';}
      else if(effort==='normal'||effort==='facil'){result='confirmado';detail='La siguiente sesión mostró una respuesta compatible con haber preservado recuperación y calidad.';}
    } else if(d.stateKey==='proteger'){
      const painNext=!!state.painLog?.[localDateKey(new Date(next.date))];
      if(!painNext && (effort==='normal'||effort==='facil')){result='confirmado';detail='No reapareció dolor registrado y la siguiente sesión fue tolerable.';}
      else if(painNext){result='no_confirmado';detail='Persistió dolor registrado en la siguiente exposición.';}
    } else if(d.stateKey==='vigilar'||d.stateKey==='avance_controlado'){
      if(effort==='dificil'){result='no_confirmado';detail='La señal de seguimiento no quedó resuelta porque la siguiente sesión fue exigente.';}
      else if(effort==='normal'||effort==='facil'){result='confirmado';detail='La siguiente exposición fue compatible con continuidad controlada.';}
    }
    rows.push({date:d.date,stateKey:d.stateKey,stateLabel:d.stateLabel,result,detail,verifiedBy:next.date,effort,readinessNext});
  }
  rows.sort((a,b)=>String(b.verifiedBy).localeCompare(String(a.verifiedBy)));
  const recent=rows.slice(0,limit), confirmed=recent.filter(x=>x.result==='confirmado').length, failed=recent.filter(x=>x.result==='no_confirmado').length, partial=recent.filter(x=>x.result==='parcial').length;
  let label='Aún sin verificación';
  if(recent.length){ if(failed>=2 || (failed>=1&&failed>=confirmed)) label='Las últimas decisiones requieren más consolidación'; else if(confirmed>=2&&confirmed>=failed+partial) label='Las decisiones recientes están consiguiendo la respuesta buscada'; else label='La respuesta de las decisiones todavía es mixta'; }
  return {recent,confirmed,failed,partial,label,pending:Math.max(0,log.length-rows.length)};
}

function completeSession(state, roundsCompleted, circuitDurationSec) {
  // V127: capturamos la decisión maestra que acaba de guiar esta sesión antes
  // de mutar el contador, para poder comprobar después si funcionó.
  recordMasterDecisionSnapshot(state);
  state.totalSessionsDone += 1;
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: roundsCompleted,
    phase: state.cycleWeek,
    circuitDurationSec: Math.max(0, Math.round(circuitDurationSec || 0)),
    hypoDurationSec: 0,
    calories: estimateCalories(circuitDurationSec || 0, 0, state.cycleWeek),
  });
  if (state.totalSessionsDone % 6 === 0) {
    const wasDescarga = state.cycleWeek >= 4;
    state.cycleWeek = state.cycleWeek >= 4 ? 1 : state.cycleWeek + 1;
    setTimeout(() => VoiceCoach.phaseChanged(PHASES[state.cycleWeek].name), 1800);
    // Cada 4 semanas, al cerrar Descarga y arrancar Volumen de nuevo, es el
    // mejor momento fisiológico para probar más peso (cuerpo fresco tras el
    // deload). Se marca aquí en vez de depender de que el usuario se acuerde.
    if (wasDescarga && state.cycleWeek === 1) state.weightReviewDue = true;
  }
  saveState(state);
}

// Se llama al terminar el bloque hipopresivo (con o sin la extensión de 2 min)
// para completar el registro del día: hasta este punto no se sabe el tiempo
// real de hipopresivos, así que la entrada del calendario/progreso se rellena
// aquí y no en completeSession.
function finalizeSessionStats(state, hypoDurationSec) {
  const entry = state.sessionLog[state.sessionLog.length - 1];
  if (!entry) return;
  entry.hypoDurationSec = Math.max(0, Math.round(hypoDurationSec || 0));
  entry.calories = estimateCalories(entry.circuitDurationSec, entry.hypoDurationSec, entry.phase);
  saveState(state);
}

// Valoración general de la sesión completa (distinta de la valoración por
// serie que ya existe durante el circuito) — cómo sintió el sujeto el
// entreno en conjunto, guardada para poder revisarla después en Progreso.
// A propósito NO alimenta applyResult ni ningún cálculo de subida/bajada
// de nivel: es solo un dato histórico para que el sujeto (y quien revise
// el código después) tenga el punto de vista humano de cada sesión, nunca
// una excusa para bajar nivel — eso ya lo protege el motor de progresión
// real, basado en reps y RPE por serie, no en esta valoración global.
function rateLastSession(state, rating) {
  const entry = state.sessionLog[state.sessionLog.length - 1];
  if (!entry) return;
  entry.effortRating = rating; // 'dificil' | 'normal' | 'facil'
  saveState(state);
}

// Hipopresivos matutinos sueltos: se registran en el mismo calendario/stats
// (tiempo y calorías) pero como entrada independiente — no suman "vuelta"
// de circuito ni cuentan para el ciclo semanal de fases (eso solo avanza al
// completar el entreno del día).
function logStandaloneHypo(state, hypoDurationSec) {
  const sec = Math.max(0, Math.round(hypoDurationSec || 0));
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: 0,
    phase: state.cycleWeek,
    circuitDurationSec: 0,
    hypoDurationSec: sec,
    calories: estimateCalories(0, sec, state.cycleWeek),
    standalone: true,
  });
  saveState(state);
}

// Descompresión en barra: mismo mecanismo de registro que la rutina
// matutina (standalone:true, no cuenta como vuelta de circuito ni afecta
// al ciclo de fases), pero con su propia marca `barHang:true` para poder
// llevar una racha separada — no es lo mismo "hice postura+hipopresivos"
// que "hice la barra en el trabajo", y mezclarlas en una sola racha
// ocultaría cuál de las dos se está dejando de lado.
function logBarDecompression(state, sec) {
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: 0,
    phase: state.cycleWeek,
    circuitDurationSec: 0,
    hypoDurationSec: Math.max(0, Math.round(sec || 0)),
    calories: 0,
    standalone: true,
    barHang: true,
  });
  saveState(state);
}

// Rutina nocturna: mismo mecanismo de registro (standalone:true, no
// cuenta como vuelta ni afecta al ciclo de fases), con su propia marca
// `eveningWindDown:true` para llevar racha propia — por la misma razón
// que la barra: "hice la rutina nocturna" es una señal distinta de
// "hice la matutina", y mezclarlas ocultaría cuál se está dejando de lado.
function logEveningWindDown(state, sec) {
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: 0,
    phase: state.cycleWeek,
    circuitDurationSec: 0,
    hypoDurationSec: Math.max(0, Math.round(sec || 0)),
    calories: 0,
    standalone: true,
    eveningWindDown: true,
  });
  saveState(state);
}

function useFigureLoop(period, active) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) % period) / period), 55);
    return () => clearInterval(id);
  }, [period, active]);
  return t;
}
function triWave(t) { return t < 0.5 ? t * 2 : (1 - t) * 2; }

function useFlip(period) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setOn(o => !o), period);
    return () => clearInterval(id);
  }, [period]);
  return on;
}

// Visual de un ejercicio: foto real (flipbook 2 fotogramas) si existe
// una correspondencia verificada para ESE ejercicio exacto; si no, la
// silueta animada por FK como respaldo (nunca se rompe la pantalla ni
// se repite la foto de otro ejercicio distinto).
// Divide el texto de ejecución en pasos numerados — no hay guiones escritos
// a mano por ejercicio (47 ejercicios sería inmantenible), así que se separa
// por frases; en la práctica da 2-4 pasos claros por ejercicio, que es
// justo el nivel de detalle que cabe bien en una pantalla de móvil.
function splitCueSteps(cue) {
  return (cue || '').split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ])/).map(s => s.trim()).filter(Boolean);
}

// Política global V112: ningún ejercicio puede caer a una silueta o dibujo.
// Si falla una foto/GIF real tras los reintentos, se mantiene un marco neutro negro.
const NO_SILHOUETTE_PHOTO_IDS = new Set(['prone_thoracic_ext_am','bar_prep','bar_hang','bar_hang_1','bar_hang_2','bar_hang_3','bar_scap_pull','bar_rest','bar_rest2','bar_pull_assist','bar_finish']);
function ExerciseVisual({ exId, iconKey, size = 150, bleed = false }) {
  const entry = EXERCISE_TO_PHOTO[exId];
  const [attempt, setAttempt] = useState(0);
  const [videoFailed, setVideoFailed] = useState(false);
  const flip = useFlip(750);
  const broken = attempt > PHOTO_MAX_RETRIES;
  function handleError() {
    if (attempt < PHOTO_MAX_RETRIES) setTimeout(() => setAttempt(a => a + 1), 600);
    else setAttempt(PHOTO_MAX_RETRIES + 1);
  }
  function handleVideoError() {
    if (attempt < PHOTO_MAX_RETRIES) setTimeout(() => setAttempt(a => a + 1), 700);
    else setVideoFailed(true);
  }
  if (!entry || broken) {
    return html`<div class=${bleed ? 'photo-wrap-bleed exercise-video-frame' : 'photo-wrap exercise-video-frame'} style=${bleed ? {background:'#000'} : { width: size, height: size, background:'#000' }} aria-label="Medio real no disponible temporalmente"></div>`;
  }
  if (typeof entry === 'object') {
    if (entry.mediaType === 'video' && !videoFailed) {
      return html`
        <div class=${bleed ? 'photo-wrap-bleed exercise-video-frame' : 'photo-wrap exercise-video-frame'} style=${bleed ? {background:'#000'} : { width: size, height: size, background:'#000', overflow:'hidden' }}>
          <video
            key=${`${attempt}-video`}
            class="exercise-media-video"
            src=${entry.videoUrl}
            poster=${entry.poster || ''}
            autoPlay
            muted
            loop
            playsInline
            preload="metadata"
            aria-label="Vídeo real del ejercicio"
            onError=${handleVideoError}
          ></video>
        </div>
      `;
    }
    const fallbackSeq = Array.isArray(entry.fallbackSequence) ? entry.fallbackSequence : null;
    const fallbackSource = fallbackSeq ? fallbackSeq[flip ? 1 : 0] : entry.fallbackUrl;
    if (fallbackSource) {
      return html`
        <div class=${bleed ? 'photo-wrap-bleed exercise-video-frame' : 'photo-wrap exercise-video-frame'} style=${bleed ? {background:'#000'} : { width: size, height: size, background:'#000', overflow:'hidden' }}>
          <img key=${`${attempt}-${flip ? 1 : 0}-fallback`} src=${fallbackSource} alt="" style=${{ background:'#000', objectFit:'contain', width:'100%', height:'100%', display:'block', padding:0 }} onError=${handleError} />
        </div>
      `;
    }
    const isSequence = Array.isArray(entry.sequence) && entry.sequence.length >= 2;
    const frame = isSequence ? (flip ? 1 : 0) : 0;
    const source = isSequence ? entry.sequence[frame] : entry.url;
    const mirror = !!entry.mirrorMotion && flip;
    return html`
      <div class=${bleed ? 'photo-wrap-bleed' : 'photo-wrap'} style=${bleed ? {background:'#000'} : { width: size, height: size, background:'#000', overflow:'hidden' }}>
        <img key=${`${attempt}-${frame}-${mirror ? 'm' : 'n'}`} src=${source} alt="" style=${{ background:'#000', objectFit:'contain', width:'100%', height:'100%', display:'block', padding:0, transform: mirror ? 'scaleX(-1)' : 'none' }} onError=${handleError} />
      </div>
    `;
  }
  return html`
    <div class=${bleed ? 'photo-wrap-bleed' : 'photo-wrap'} style=${bleed ? {background:'#000'} : { width: size, height: size, background:'#000', overflow:'hidden' }}>
      <img key=${`${attempt}-${flip ? 1 : 0}`} src=${`${PHOTO_BASE}${entry}/${flip ? 1 : 0}.jpg`} alt="" style=${{background:'#000', objectFit:'contain', width:'100%', height:'100%', display:'block'}} onError=${handleError} />
    </div>
  `;
}

function BleedPhoto({ folder, iconKey }) {
  const [attempt, setAttempt] = useState(0);

  function handleError() {
    if (attempt < PHOTO_MAX_RETRIES) setTimeout(() => setAttempt(a => a + 1), 600);

  if (!folder || broken) return html`<div class="photo-wrap-bleed" style=${{background:'#000'}} aria-label="Foto real no disponible temporalmente"></div>`;

}

function Figure({ iconKey, size = 140, phase, vivid = true }) {
  const poseKey = ICON_TO_POSE[iconKey] || 'vacuum';
  const t = useFigureLoop(1450, phase == null);
  const p = phase != null ? phase : triWave(t);
  const svg = buildFigureMarkup(poseKey, p, vivid);
  return html`<div class="figure-wrap" style=${{ width: size, height: size * 1.25 }}>
    <svg viewBox="0 0 120 150" style=${{ width: '100%', height: '100%' }} dangerouslySetInnerHTML=${{ __html: svg }} />
  </div>`;
}

// Construye el SVG completo (torso + cabeza + 2 brazos + 2 piernas) por FK real,
// con gradientes de volumen, articulaciones redondeadas, manos/pies y sombra
// de suelo para una lectura mucho más realista del movimiento.
function buildFigureMarkup(poseKey, phase, vivid) {
  const cfg = FIG_POSES[poseKey] || FIG_POSES.vacuum;
  const A = cfg.A, B = cfg.B;
  const torso = lerp(A.torso, B.torso, phase), dy = lerp(A.dy, B.dy, phase);
  const legL = pairL(A.legL, B.legL, phase), legR = pairL(A.legR, B.legR, phase);
  const armL = pairL(A.armL, B.armL, phase), armR = pairL(A.armR, B.armR, phase);
  const orient = A.orient || 0;
  const { hipY, shY, headR, thigh, shin, uarm, farm, hipDx, shDx } = FIG;
  const torsoLen = hipY - shY;
  const lLeg = fkPoint(0, 0, thigh, legL[0], shin, legL[1]);
  const rLeg = fkPoint(0, 0, thigh, legR[0], shin, legR[1]);
  const lArm = fkPoint(0, 0, uarm, armL[0], farm, armL[1]);
  const rArm = fkPoint(0, 0, uarm, armR[0], farm, armR[1]);
  const bodyC = vivid ? 'url(#gBody)' : 'var(--text-dim)';
  const armC = vivid ? 'url(#gArm)' : 'var(--text-dim)';
  const legC = vivid ? 'url(#gLeg)' : 'var(--text-dim)';
  const belly = poseKey === 'vacuum' ? `<ellipse cx="0" cy="${-torsoLen * 0.42}" rx="${lerp(14, 7, triWave((phase + 0.5) % 1))}" ry="9" fill="var(--bg)" opacity="0.6"/>` : '';
  const lFootAng = legL[0] + legL[1], rFootAng = legR[0] + legR[1];
  const defs = `
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.body}"/><stop offset="100%" stop-color="${COL.bodyDark}"/>
      </linearGradient>
      <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${COL.arm}"/><stop offset="100%" stop-color="${COL.armDark}"/>
      </linearGradient>
      <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.leg}"/><stop offset="100%" stop-color="${COL.legDark}"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  const shadow = `<ellipse cx="60" cy="132" rx="${orient !== 0 ? 40 : 26}" ry="7" fill="url(#gShadow)"/>`;
  return `
    ${defs}
    ${shadow}
    <g transform="translate(60 ${hipY + dy}) rotate(${orient} 0 ${-dy})">
      <line x1="${-hipDx}" y1="0" x2="${lLeg.mx}" y2="${lLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${lLeg.mx - hipDx}" y1="${lLeg.my}" x2="${lLeg.ex - hipDx}" y2="${lLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${lLeg.mx - hipDx * 0.5}" cy="${lLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${lLeg.ex - hipDx + 6 * Math.sin(lFootAng * Math.PI / 180)}" cy="${lLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${lFootAng * 0.4} ${lLeg.ex - hipDx} ${lLeg.ey})"/>
      <line x1="${hipDx}" y1="0" x2="${rLeg.mx}" y2="${rLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${rLeg.mx + hipDx}" y1="${rLeg.my}" x2="${rLeg.ex + hipDx}" y2="${rLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${rLeg.mx + hipDx * 0.5}" cy="${rLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${rLeg.ex + hipDx + 6 * Math.sin(rFootAng * Math.PI / 180)}" cy="${rLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${rFootAng * 0.4} ${rLeg.ex + hipDx} ${rLeg.ey})"/>
      <g transform="rotate(${torso})">
        <rect x="-6" y="${-torsoLen - 8}" width="12" height="12" rx="5" fill="${bodyC}"/>
        <path d="M -21,${-torsoLen + 2} Q -22,${-torsoLen - 6} -12,${-torsoLen - 9} Q 0,${-torsoLen - 12} 12,${-torsoLen - 9} Q 22,${-torsoLen - 6} 21,${-torsoLen + 2} L 14,-6 Q 15,4 8,10 L -8,10 Q -15,4 -14,-6 Z" fill="${bodyC}"/>
        <path d="M -13,${-torsoLen + 10} Q 0,${-torsoLen + 4} 13,${-torsoLen + 10} L 13,${-torsoLen + 22} Q 0,${-torsoLen + 16} -13,${-torsoLen + 22} Z" fill="#000" opacity="0.08"/>
        <circle cx="0" cy="${-torsoLen - headR - 10}" r="${headR}" fill="${bodyC}"/>
        <path d="M ${-headR + 1},${-torsoLen - headR - 15} Q 0,${-torsoLen - headR - 24} ${headR - 1},${-torsoLen - headR - 15} Q ${headR - 1},${-torsoLen - headR - 20} 0,${-torsoLen - headR - 19} Q ${-headR + 1},${-torsoLen - headR - 20} ${-headR + 1},${-torsoLen - headR - 15} Z" fill="#000" opacity="0.16"/>
        ${belly}
        <line x1="${-shDx}" y1="${-torsoLen}" x2="${lArm.mx - shDx}" y2="${lArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${lArm.mx - shDx}" cy="${lArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${lArm.mx - shDx}" y1="${lArm.my - torsoLen}" x2="${lArm.ex - shDx}" y2="${lArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${lArm.ex - shDx}" cy="${lArm.ey - torsoLen}" r="6" fill="${armC}"/>

      </g>
    </g>`;
}
