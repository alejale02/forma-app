<!DOCTYPE html>
<!-- Forma55 V161 · auditoría visual y step-up dinámico -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Forma 55 — Circuito diario · V161</title>
<meta name="theme-color" content="#12141A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forma 55" />
<link id="manifest-link" rel="manifest" href="data:application/manifest+json,">
<link rel="apple-touch-icon" id="apple-touch-icon">
<link rel="icon" id="favicon">
<style>
:root{
  --bg:#12141A; --bg-elev:#1B1E27; --bg-elev2:#242835;
  --accent:#C8FF3D; --accent-dim:#8FBF2B;
  /* Contraste subido para presbicia: --text-dim y --text-faint eran grises
     medios (#AEB4C0 / #868C99) — perfectamente legibles con vista normal,
     pero de las primeras cosas que cuesta leer con vista cansada. Subidos
     a tonos más claros mantiene la jerarquía visual (siguen siendo más
     discretos que --text) sin sacrificar legibilidad real. */
  --text:#FFFFFF; --text-dim:#C7CCD6; --text-faint:#9DA3B0;
  --danger:#FF6B4A; --up:#7DD8FF;
  --radius:20px; --radius-sm:12px;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none; background:none; color:inherit;}
h1,h2{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); padding-top:calc(24px + env(safe-area-inset-top)); animation:fadein .25s ease;}
/* Home a petición explícita: las tarjetas (pasos, fase del mes, vueltas)
   se veían con demasiado margen a los lados en el móvil real — se
   reduce el padding lateral de la pantalla completa de Hoy para que
   aprovechen más ancho, sin tocar el resto de pantallas (settings,
   modales, etc. mantienen su padding de siempre). */
.screen.home{ padding-left:10px; padding-right:10px; }

/* =====================================================================
   FASE 1→2 (roadmap) — SIMPLIFICACIÓN DEFINITIVA DE LA BARRA INFERIOR
   Se retira POR COMPLETO el sistema de altura medida por JS
   (--app-100vh + .app-shell.has-tabbar con height/overflow:hidden +
   .screen como contenedor de scroll independiente). Ese sistema se
   introdujo para un problema menor (la barra se desplazaba unos
   milisegundos al mostrarse/ocultarse la barra de Safari) y a cambio
   introdujo TRES bugs distintos y confirmados con el tiempo: hueco al
   abrir teclado, hueco con zoom de accesibilidad, y hueco persistente en
   Hoy/Indicadores sin relación clara con ninguno de los dos anteriores.
   Cada parche arregló su síntoma y dejó el siguiente sin resolver — señal
   de que el enfoque de fondo era fràgil, no de que faltara un parche más.
   Arquitectura nueva (la misma que usa la inmensa mayoría de páginas/PWAs
   sin problema): scroll normal del documento (igual que cualquier página
   web), barra `position:fixed;bottom:0` anclada al viewport real por el
   propio navegador — sin medir nada por JS, sin recortar ninguna altura.
   El único requisito es reservar espacio al final del contenido para que
   la barra fija no lo tape, con `padding-bottom` + `env(safe-area-inset-
   bottom)`, que es CSS puro y no depende de ningún evento de resize. */
.app-shell.has-tabbar > .screen{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.app-shell.has-tabbar > .tab-bar,.tab-bar{position:fixed; left:0; right:0; bottom:0; z-index:100; display:flex; justify-content:center; background:var(--bg-elev); border-top:1px solid var(--bg-elev2); padding:0; padding-bottom:env(safe-area-inset-bottom);}
.tab-bar-inner{display:flex; width:100%; max-width:520px; margin:0 auto; box-sizing:border-box; padding:8px 10px; gap:6px;}
.tab-bar-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-height:52px; padding:7px 2px; border-radius:16px; background:none; color:var(--text-faint); font-size:12px; font-weight:700; transition:background .15s ease, color .15s ease, transform .1s ease;}
.tab-bar-btn .tbi{font-size:25px; line-height:1; filter:grayscale(1) opacity(0.75);}
.tab-bar-btn.active{background:var(--accent); color:#0C0D10; transform:translateY(-1px); box-shadow:0 4px 14px rgba(200,255,61,0.28);}
.tab-bar-btn.active .tbi{filter:none;}
@media(max-width:390px){.tab-bar-inner{padding-left:5px; padding-right:5px; gap:3px;} .tab-bar-btn{min-height:50px; font-size:11.5px;} .tab-bar-btn .tbi{font-size:24px;}}
/* V144 — modo diario accesible + cockpit de uso diario + reducción de scroll en Hoy.
   No reduce información: prioriza legibilidad, objetivos táctiles y nombres cortos
   en navegación. El detalle técnico sigue plegado donde corresponde. */
@media(max-width:390px){
  .screen{padding-left:16px;padding-right:16px;}
  .screen.home{padding-left:8px;padding-right:8px;}
  .home-header{margin-bottom:16px;}
  .home-header h1{font-size:31px;}
  .eyebrow{font-size:13px;}
  .home-action-label{font-size:16px;}
  .home-action-sub{font-size:12.5px;line-height:1.3;}
  .home-action-status{font-size:11.5px;}
  .home-secondary-action{font-size:13px;padding:11px 5px;min-height:58px;}
  .home-secondary-action span{font-size:22px;}
  .continuity-text,.continuity-action{font-size:14px;}
  .continuity-chip{font-size:12px;}
  .today-ex-name{font-size:16.5px;}
  .today-ex-detail{font-size:14.5px;}
  .tab-bar-btn{font-size:12px;min-height:52px;}
  .tab-bar-btn .tbi{font-size:25px;}
}



/* V141 — COCKPIT DIARIO: una sola lectura antes de entrar en el detalle.
   Diseñado para iPhone 11 Pro: números/textos principales grandes, pocos
   elementos, una acción contextual y acceso directo a la decisión completa. */
.home-decision-compact{margin:6px 0 10px;padding:11px 13px;border:1px solid var(--border);border-radius:16px;background:var(--card);}
.home-decision-line{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.home-decision-line strong{font-size:20px;line-height:1.15;}
.home-decision-line span{font-size:12px;font-weight:800;opacity:.7;white-space:nowrap;}
.home-decision-compact p{margin:5px 0 7px;font-size:16px;line-height:1.27;font-weight:700;}
.home-decision-compact>button{border:0;background:none;padding:1px 0;font-size:13.5px;font-weight:800;text-decoration:underline;text-underline-offset:3px;}
.home-decision-compact.orange{border-color:rgba(210,140,40,.45)}
.home-decision-compact.warn{border-color:rgba(210,110,40,.45)}
.home-decision-compact.accelerate{border-color:rgba(50,150,90,.45)}
/* V149 — la parte superior de Hoy debe caber en una sola mirada. */
.home-header-minimal{margin-bottom:6px}
.home-header-minimal .eyebrow{margin-bottom:2px;font-size:13px}
.home-header-minimal h1{margin:0;font-size:30px;line-height:1.05}
.home-decision-compact{margin:4px 0 10px;padding:9px 12px;border-radius:14px}
.home-decision-compact p{margin:4px 0 5px;font-size:15px;line-height:1.2}
.home-decision-compact>button{font-size:12.5px}
@media(max-width:390px){.home-header-minimal h1{font-size:28px}.home-decision-compact p{font-size:14.5px}}

@media (max-width:390px){.home-decision-compact{padding:10px 12px}.home-decision-line strong{font-size:19px}.home-decision-compact p{font-size:15px}}
.daily-cockpit{background:linear-gradient(145deg,rgba(200,255,61,.12),var(--bg-elev));border:1px solid rgba(200,255,61,.26);border-radius:20px;padding:16px 15px;margin:0 0 14px;box-shadow:0 5px 18px rgba(0,0,0,.12);}
.daily-cockpit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px;}
.daily-cockpit-kicker{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--accent);}
.daily-cockpit-title{font-family:var(--font-display);font-size:23px;line-height:1.08;margin-top:3px;}
.daily-cockpit-score{font-size:12px;font-weight:850;color:var(--text-dim);white-space:nowrap;padding-top:2px;}
.daily-cockpit-action{font-size:18px;line-height:1.3;font-weight:850;margin-bottom:5px;}
.daily-cockpit-reason{font-size:14px;line-height:1.42;color:var(--text-dim);}
.daily-cockpit-next{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.08);}
.daily-cockpit-next-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:var(--text-faint);margin-bottom:4px;}
.daily-cockpit-next-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.daily-cockpit-next-text{font-size:14px;line-height:1.35;font-weight:750;min-width:0;}
.daily-cockpit-next-btn{flex:0 0 auto;border-radius:12px;background:var(--accent);color:#0C0D10;font-size:13px;font-weight:900;padding:10px 12px;min-height:42px;}
.daily-cockpit-link{display:block;width:100%;margin-top:9px;text-align:left;color:var(--text-dim);font-size:12.5px;font-weight:800;padding:5px 0;}
@media(max-width:390px){
  .daily-cockpit{padding:15px 13px;margin-bottom:12px;}
  .daily-cockpit-title{font-size:21px;}
  .daily-cockpit-action{font-size:17px;}
  .daily-cockpit-reason{font-size:14px;}
  .daily-cockpit-next-text{font-size:13.5px;}
  .daily-cockpit-next-btn{font-size:12.5px;padding:9px 10px;}
}

/* V149 — Hoy ultracompacto: decisión y acción sin texto introductorio redundante.
   Una sola fila de accesos frecuentes bajo la decisión: evita recorrer
   media pantalla para llegar a Feedback, Comer o Progreso. Se mantiene
   la barra inferior como navegación global; esta fila es contextual. */
.home-details{margin:0 0 14px;border:1px solid var(--bg-elev2);background:rgba(255,255,255,.018);border-radius:15px;overflow:hidden;}
.home-details>summary{list-style:none;cursor:pointer;padding:13px 14px;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.home-details>summary::-webkit-details-marker{display:none;}
.home-details>summary::after{content:'＋';font-size:18px;color:var(--text-dim);}
.home-details[open]>summary::after{content:'−';}
.home-details-body{padding:0 12px 12px;}
.home-details-body .phase-card,.home-details-body .cycle-track{margin-left:0;margin-right:0;}
.home-more-tools{margin-top:0;}
.home-details>summary{font-size:13.5px;padding:12px 13px;}
}

@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes breathe{0%,100%{transform:scale(0.72);} 50%{transform:scale(1.18);}}
.breathe-circle{width:130px; height:130px; border-radius:50%; background:var(--accent); opacity:0.16; animation:breathe 8s ease-in-out infinite; margin:18px auto;}
.breathe-label{text-align:center; font-family:var(--font-display); font-size:23px; color:var(--accent); margin-top:-92px; margin-bottom:70px;}
/* El truco de margen negativo de arriba superponía el texto encima del
   círculo cuando eran hermanos directos en el flujo normal. Ahora, en la
   pantalla "bleed" de estiramiento/hipopresivos, el círculo vive en el
   fondo a pantalla completa (.bleed-figure-fallback) y la etiqueta va en
   el bloque de texto de abajo (.bleed-bottom) — ya no son hermanos, así
   que ese margen negativo solo la descolocaría empujándola hacia arriba
   contra el resto del texto. Se resetea aquí, específicamente donde se
   usa así. */
.bleed-bottom .breathe-label{margin-top:0; margin-bottom:4px;}
.circuit-rest-note{color:var(--text-dim); font-size:14px; text-align:center; margin-top:4px;}
.warmup-step-name{font-family:var(--font-display); font-size:21.5px; text-align:center; margin:6px 0 8px;}
.camera-preview-wrap{position:relative; width:100%; aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:#000; margin-top:10px;}
.camera-preview-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
.camera-preview-wrap video.mirrored{transform:scaleX(-1);}
.camera-flash{position:absolute; inset:0; background:#fff; animation:cameraFlash 0.25s ease;}
@keyframes cameraFlash{from{opacity:0.9;} to{opacity:0;}}
.camera-countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:82px; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,0.6); background:rgba(0,0,0,0.15);}
.camera-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.camera-actions .btn-primary{grid-column:1/-1;}


.eyebrow{font-size:13.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px;}

/* V99 — continuidad y mantenimiento */
.continuity-card{background:linear-gradient(135deg,rgba(125,216,255,0.10),var(--bg-elev));border:1px solid rgba(125,216,255,0.22);border-radius:18px;padding:15px 16px;margin:0 0 14px;}
.continuity-card.maintenance{background:linear-gradient(135deg,rgba(200,255,61,0.08),var(--bg-elev));border-color:rgba(200,255,61,0.20);}
.continuity-title{font-weight:900;font-size:16px;margin-bottom:5px;}
.continuity-text{font-size:13.5px;color:var(--text-dim);line-height:1.42;}
.continuity-action{margin-top:9px;padding-top:9px;border-top:1px solid var(--bg-elev2);font-size:13.5px;font-weight:750;color:var(--text);}
.continuity-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.continuity-chip{background:var(--bg-elev2);border-radius:20px;padding:5px 9px;font-size:11.5px;color:var(--text-dim);font-weight:700;}

/* V107 — reentrada específica por ejercicio */
.longitudinal-state{font-size:13px;line-height:1.45;margin-top:6px}
/* ---- HOME ---- */
.home-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
.home-header h1{font-size:34px;}
.home-header{position:relative;}
.home-version{position:absolute;right:4px;top:48px;font-size:10px;line-height:1;color:var(--text-dim);font-weight:600;letter-spacing:.03em;opacity:.78;}
.trainer-home-btn{display:inline-flex;align-items:center;gap:5px;margin-left:8px;vertical-align:middle;border:1px solid rgba(125,216,255,.28);background:rgba(125,216,255,.08);color:var(--text);border-radius:999px;padding:6px 9px;font-size:11.5px;font-weight:850;line-height:1;}
.trainer-home-btn:active{transform:scale(.98);background:rgba(125,216,255,.16)}
.home-header-actions{display:flex;align-items:center;gap:7px}.photo-wrap{background:#000!important;color:#fff}.photo-wrap>img{background:#000!important}.photo-wrap-bleed{background:#000!important;color:#fff}.photo-wrap-bleed>img{background:#000!important}.dynamic-real-media{background:#000!important}
.trainer-btn{border:1px solid rgba(125,216,255,.28);background:var(--bg-elev);color:var(--text);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:850;min-height:40px;white-space:nowrap}.trainer-btn:active{transform:scale(.98)}
.trainer-brief{margin:0 0 14px;padding:13px 14px;border-radius:15px;border:1px solid rgba(125,216,255,.25);background:linear-gradient(135deg,rgba(125,216,255,.09),var(--bg-elev));}
.trainer-brief-title{font-weight:900;font-size:15px;margin-bottom:5px}.trainer-brief-text{font-size:13.5px;line-height:1.45;color:var(--text-dim)}.trainer-brief-actions{display:flex;gap:8px;margin-top:9px}.trainer-brief-actions button{flex:1;font-size:13px;padding:10px 8px;}

.icon-btn{background:var(--bg-elev); color:var(--text); width:44px; height:44px; border-radius:12px; font-size:20.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.weight-reminder{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.steps-nudge{cursor:pointer;}
.bar-nudge{cursor:pointer;}
.weight-reminder.bar-nudge{background:linear-gradient(135deg, rgba(180,140,255,0.16), var(--bg-elev)); border-color:rgba(180,140,255,0.4);}
.weight-reminder.posture-nudge{background:linear-gradient(135deg, rgba(255,180,120,0.16), var(--bg-elev)); border-color:rgba(255,180,120,0.4);}
.weight-reminder.photo-reminder{background:linear-gradient(135deg, rgba(125,216,255,0.14), var(--bg-elev)); border-color:rgba(125,216,255,0.35);}
.weight-reminder.backup-reminder{background:linear-gradient(135deg, rgba(255,140,60,0.16), var(--bg-elev)); border-color:rgba(255,140,60,0.4);}
.save-error-banner{background:rgba(255,107,74,0.16); border:1px solid rgba(255,107,74,0.45); border-radius:12px; padding:10px 14px; margin:0 20px 12px; margin-top:calc(10px + env(safe-area-inset-top)); font-size:13.5px; color:var(--text); line-height:1.4;}
.photo-compare{margin-bottom:18px;}
.photo-compare-picker{display:flex; align-items:center; gap:8px; margin:8px 0 12px;}
.photo-compare-picker select{flex:1; min-width:0; background:var(--bg-elev); color:var(--text); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 6px; font-size:15px;}
.photo-compare-picker span{color:var(--text-dim); font-size:13.5px;}
.photo-compare-row{display:flex; gap:10px; margin-top:8px;}
.photo-compare-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
.photo-compare-col img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--bg-elev2);}
.photo-compare-col span{font-size:12.5px; color:var(--text-dim);}
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
.photo-grid-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none;}
.photo-grid-item img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--bg-elev2);}
.photo-grid-item span{font-size:11px; color:var(--text-faint);}
.photo-viewer{position:fixed; inset:0; z-index:50; background:rgba(6,7,10,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;}
.photo-viewer img{max-width:100%; max-height:70vh; border-radius:14px; object-fit:contain;}
.photo-viewer p{color:var(--text-dim); font-size:15px; text-transform:capitalize;}
.weight-reminder-title{font-weight:800; font-size:16.5px; margin-bottom:6px;}
.weight-reminder-text{font-size:15px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}
.weight-reminder-actions{display:flex; gap:8px; flex-wrap:wrap;}
.weight-reminder-actions .btn-primary{flex:1 1 auto; min-width:150px;}
.weight-reminder-actions .btn-secondary{flex:1 1 auto; min-width:130px;}
.alert-chip-row{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:-8px 0 16px;}
.alert-chip-hint{font-size:12.5px; color:var(--text-faint); font-weight:600;}
.alert-chip{background:var(--bg-elev2); color:var(--text-dim); border-radius:20px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap;}
.alert-chip:active{background:var(--bg-elev); color:var(--text);}
.phase-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; margin-bottom:16px; border-left:4px solid var(--phase-color);}
.phase-name{font-family:var(--font-display); font-size:27.5px; color:var(--phase-color); margin-bottom:6px;}
.phase-desc{color:var(--text-dim); font-size:16px; line-height:1.5; margin-bottom:16px;}
.phase-progress{display:flex; gap:5px; margin-bottom:8px;}
.dot{width:100%; height:6px; border-radius:3px; background:var(--bg-elev2);}
.dot.filled{background:var(--phase-color);}
.phase-progress-label{font-size:13.5px; color:var(--text-faint);}

.cycle-track{display:flex; gap:8px; margin-bottom:20px;}
.cycle-step{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--bg-elev); opacity:0.45;}
.cycle-step.active{opacity:1; background:var(--bg-elev2); outline:1.5px solid var(--accent);}
.cycle-step.done{opacity:0.7;}
.cycle-num{display:block; font-family:var(--font-display); font-size:18px;}
.cycle-label{display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.btn-primary{background:var(--accent); color:#0C0D10; font-weight:800; border-radius:var(--radius-sm); padding:16px; font-size:18px;}
.btn-primary:disabled{opacity:0.35;}
.btn-huge{width:100%; padding:20px; font-size:19.5px; border-radius:16px; margin:8px 0;}
.rate-screen{display:flex; flex-direction:column; justify-content:center; min-height:60vh;}
.rate-buttons{display:flex; flex-direction:column; gap:12px;}
.rate-btn{font-weight:700; text-align:left; padding:18px 20px;}
.rate-btn.rate-hard{background:rgba(255,107,74,0.16); color:var(--text); border:1px solid rgba(255,107,74,0.4);}

/* Foto real durante la ejecución (pantalla 'work'): antes 160px, casi el
   mismo espacio visual que el contador de repeticiones — el usuario pidió
   explícitamente ver mejor el gesto del ejercicio en marcha. Se agranda a
   costa de encoger el contador de arriba (64px→38px, que sigue siendo
   perfectamente legible) en vez de simplemente crecer y desplazar el resto
   de la pantalla. `!important` necesario porque ExerciseVisual fija
   width/height por inline style (prop `size`) — mismo patrón ya usado en
   la media query de apaisado (línea ~111) para el motivo contrario. */
.rest-next-reps{color:var(--accent); font-weight:700;}
.rest-timer{color:var(--up);}
.rest-next{color:var(--text); font-size:17px; font-weight:700; margin-bottom:2px;}

/* ---- PANTALLA "BLEED": foto real a pantalla completa de fondo, con todo
   lo demás sobreimpreso en degradados arriba/abajo — mismo patrón que
   apps de entreno de referencia. Se usa en circuito, cuenta atrás,
   calentamiento e hipopresivos/rutina matutina. Al ser position:absolute
   dentro de .bleed-screen (relative), funciona igual en vertical y en
   horizontal sin necesitar trucos de reordenar con flexbox por
   orientación — la foto siempre ocupa el 100% del contenedor. */
.bleed-screen{position:relative; padding:0 !important; overflow:hidden; background:#000;}
.photo-wrap-bleed{position:absolute; inset:0; z-index:0;}
.photo-wrap-bleed img{width:100%; height:100%; object-fit:cover; display:block;}
.bleed-figure-fallback{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, var(--bg-elev2), var(--bg));}
.bleed-scrim-top{position:absolute; top:0; left:0; right:0; height:38%; z-index:1; pointer-events:none; background:linear-gradient(to bottom, rgba(8,9,11,0.92), rgba(8,9,11,0.5) 60%, transparent);}
.bleed-scrim-bottom{position:absolute; bottom:0; left:0; right:0; height:64%; z-index:1; pointer-events:none; background:linear-gradient(to top, rgba(8,9,11,0.96) 35%, rgba(8,9,11,0.75) 65%, transparent);}
/* BUG REAL encontrado y corregido: bleed-top (flujo normal, arriba) y
   bleed-bottom (position:absolute; bottom:0) no tenían ninguna relación
   entre sí — si sus contenidos combinados eran más altos que la pantalla
   (típico en horizontal, poco alto disponible), bleed-bottom subía y se
   solapaba literalmente encima de bleed-top en vez de quedar debajo,
   como se vio en captura real (nombre del ejercicio pisando "vuelta X de
   Y" y el aviso de pasos). Fix: un único contenedor flex en columna con
   space-between envuelve a los dos — así arriba y abajo nunca pueden
   invadirse el uno al otro; si el contenido no cabe entero, es el
   contenedor el que hace scroll interno, nunca un solapado invisible. */
.bleed-overlay{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:flex-start; overflow-y:auto;}
.bleed-top{flex-shrink:0; padding:calc(16px + env(safe-area-inset-top)) 20px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;}
.bleed-bottom{flex-shrink:0; margin-top:auto; padding:8px 20px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; text-align:center;}
.bleed-info-tap{background:none; padding:2px 8px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.bleed-info-tap h2{margin:0;}
.bleed-btn-row{display:flex; gap:10px; width:100%; margin-top:6px;}
.bleed-btn-row button{flex:1;}
.bleed-progress-bar{width:100%; max-width:340px; height:5px; border-radius:3px; background:rgba(255,255,255,0.18); overflow:hidden; margin-top:4px;}
.bleed-progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width 1s linear;}
.photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.exercise-video-frame{background:#000 !important;}
.exercise-media-video{width:100%; height:100%; display:block; object-fit:contain; object-position:center; background:#000; border:0; outline:0; filter:brightness(.76) contrast(1.06);}
.photo-credit{position:absolute; bottom:2px; right:6px; font-size:9px; color:rgba(255,255,255,0.55); background:rgba(0,0,0,0.4); padding:1px 5px; border-radius:6px;}

/* Este bloque va deliberadamente AL FINAL de la hoja de estilos, justo
   antes del cierre — no es cosmético. Sus reglas comparten especificidad con las
   reglas base de estas mismas clases (.timer-big, .target-reps-badge,
   .cue-text, .btn-secondary...) definidas más arriba en este archivo; en
   CSS, con especificidad empatada, gana la que aparece MÁS TARDE en el
   documento, sin importar si está dentro de un @media o no. Estando este
   bloque casi al principio del archivo (como estaba antes), las reglas
   base de más abajo lo pisaban silenciosamente en horizontal real — bug
   confirmado con capturas reales (timer y botones sin comprimir pese a
   existir la regla). Cualquier override de horizontal nuevo debe añadirse
   AQUÍ, al final, para heredar esta garantía. */
/* ---- MÓVIL EN HORIZONTAL — pantallas de sesión activa (poco alto, ancho de sobra) ---- */
/* BUG REAL encontrado y corregido: la condición `max-height:560px` no
   coincidía con la altura real en horizontal del móvil del usuario (se
   vio en capturas reales — timer gigante, botones en columna en vez de
   fila, nada de esto se aplicaba). Esa condición era fràgil porque
   depende de density pixel ratio / modelo exacto de móvil, algo que no
   se puede fijar a ciegas. Se quita la condición de alto: estas reglas
   ahora se aplican en CUALQUIER horizontal, no solo por debajo de un
   umbral de píxeles que no se cumplía en la práctica. */
@media (orientation: landscape) {
  /* La lógica de layout de abajo (flex-row + wrap) ya estaba bien pensada,
     pero el contenedor padre .app-shell seguía limitado a 520px de ancho
     máximo — en un móvil apaisado real (800-950px de ancho) eso dejaba
     huecos enormes a los lados sin usar, exactamente lo que se reportó.
     Ampliar el ancho aquí (solo en horizontal, la vista vertical no se
     toca) es lo que faltaba para que el resto de reglas de abajo puedan
     aprovechar el espacio real. */
  .app-shell{max-width:min(94vw, 960px);}
  .tab-bar-inner{max-width:min(94vw, 960px);}
  /* work/prep/warmup-screen/hypo ya NO necesitan flex-row+reorder: ahora
     son pantallas "bleed" (foto de fondo a pantalla completa, todo lo
     demás sobreimpreso en position:absolute) — ese layout ya funciona
     igual en vertical y horizontal sin necesitar hacks de orientación.
     Este bloque se queda solo para las pantallas que NO se rediseñaron
     (rest, roundrest): esas siguen con el layout normal en flujo, que sí
     necesita reordenarse en horizontal por falta de alto. circuit-rest
     pasó a bleed-screen también (agosto 2026, segunda ronda — la primera
     migración se quedó a medio camino: se cambió el HTML pero no se
     limpiaron estas reglas viejas con `order` fijo pensadas para la
     estructura anterior, y el timer/estiramientos quedaban mal
     colocados en horizontal real — bug confirmado y corregido). */
  .screen.rest, .screen.roundrest {
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center;
    align-content: center; gap: 2px 22px; padding: 10px 26px; overflow-y: auto;
  }
  .screen.circuit-rest .breathe-circle{ width: 90px !important; height: 90px !important; }
  .screen.rest .rest-next, .screen.roundrest .roundrest-badge, .screen.rest .eyebrow {
    width: 100%; text-align: center; margin: 1px 0;
  }
  /* Las pantallas "bleed" recortan un poco el alto máximo del bloque
     inferior en horizontal (menos alto disponible que en vertical) para
     no forzar scroll salvo que el ejercicio tenga cue muy larga.
     CORRECCIÓN (el usuario aclaró que NO quiere hacer scroll durante la
     ejecución — ni para leer la cue ni para llegar a los botones; quiere
     temporizador y botones siempre visibles sin tocar la pantalla): el
     texto de la cue postural es bastante más largo que el de circuito
     (instrucciones completas de ejecución en vez de una frase corta), y
     en horizontal —mucho menos alto disponible que en vertical— ese
     texto sin límite podía empujar el temporizador y los botones fuera
     de la zona visible. Se limita la cue a un número fijo de líneas
     (line-clamp) SOLO en horizontal: el usuario ya ha visto la
     instrucción completa en vertical/antes de empezar, así que perder
     el resto del texto durante la ejecución en horizontal es aceptable
     a cambio de que temporizador y botones se vean siempre enteros. */
  .bleed-overlay{ gap:2px; overflow-y:hidden; }
  .bleed-bottom{ padding-top:4px; gap:2px; }
  .bleed-top{ padding-top:calc(8px + env(safe-area-inset-top)); gap:2px; }
  .timer-big{ font-size:34px; margin: 2px 0; }
  .prep-count{ font-size:46px; margin: 2px 0; }
  .target-reps-badge{ padding: 4px 14px; margin: 2px 0; }
  .target-reps-num{ font-size:24px; }
  .exercise-cue, .cue-text{ font-size:12.5px; line-height:1.28; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; max-height:2.6em; margin:2px 0; }
  .warmup-step-name{ font-size:16px; margin:2px 0; }
  .auto-note, .level-hint{ display: none; }
  .btn-secondary{ padding: 10px 16px; font-size:15px; }
  /* Pantalla de valoración (rate-screen): no es una pantalla "bleed", se
     quedó sin tratamiento de horizontal al quitar .screen.work de la
     regla de reordenado antigua (esta pantalla comparte esa clase pero
     nunca se rediseñó a foto de fondo). Sin esto los 3 botones + título +
     texto no cabían en el poco alto disponible y el tercer botón quedaba
     cortado fuera de pantalla, como se vio en captura real. Los 3 botones
     pasan a fila (en vez de columna) para ganar alto; el resto se
     compacta.
  */
  .rate-screen{ min-height:0; padding:10px 24px; justify-content:center; gap:4px; }
  .rate-screen h2{ font-size:18px; margin:2px 0; }
  .rate-screen .cue-text{ font-size:12.5px; margin:0 0 6px; }
  .rate-buttons{ flex-direction:row; gap:8px; width:100%; }
  .rate-btn{ flex:1; padding:10px 8px; font-size:12.5px; text-align:center; }
  .session-controls{ position: fixed; }
}

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1"
  }

<script type="module">
import React, { Component, useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';

// V149 — navegación: la barra inferior es la única navegación global;
// Feedback vive en Más herramientas y datos; no se añade otro acceso visible.
const h = React.createElement;
const html = htm.bind(h);

// =====================================================================
// FASE 1→2 — SIMPLIFICACIÓN: se retiró de aquí todo el sistema de medida
// de viewport por JS (--app-100vh, seguimiento de teclado con
// focusin/focusout, listeners de resize/visualViewport/orientationchange).
// La barra inferior ya no depende de ninguna medición: es
// `position:fixed;bottom:0` sobre scroll normal del documento — lo mismo
// que usa la inmensa mayoría de páginas y PWAs sin necesitar JS. Ver el
// comentario en la hoja de estilos (bloque junto a .app-shell.has-tabbar)
// para el razonamiento completo de por qué se abandonó el enfoque anterior.

// P2.10 / P2.11 — fotos reales + ritmo musical ligado al pace + voz más natural.
// =====================================================================
// =====================================================================
// SOUND — Web Audio API, síntesis pura (offline, sin ficheros)
// Nota iOS: si el interruptor físico de silencio está activado, Safari
// silencia el audio de las páginas web (incluida esta instalada como app).
// Es una restricción del sistema operativo, no de la aplicación.
// =====================================================================
// AudioContext único compartido entre pitidos (Sound) y música ambiental
// (Music), para poder bajar el volumen de la música cuando suena un aviso.
let sharedAudioCtx = null;
function getSharedAudioCtx() {
  if (!sharedAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; sharedAudioCtx = new AC(); }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

const Sound = (() => {
  function getCtx() { return getSharedAudioCtx(); }
  function tone(freq, duration, opts = {}) {
    const { type = 'sine', gain = 0.18, delay = 0 } = opts;
    const c = getCtx();

    osc.type = type;

    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + duration);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + duration + 0.02);

    playConfirmOpen() { tone(880, 0.07, { type: 'sine', gain: 0.13 }); tone(1174, 0.1, { type: 'sine', gain: 0.11, delay: 0.07 }); },

// =====================================================================
// MÚSICA RÍTMICA — generada en el propio navegador con Web Audio (no es
// un archivo de terceros: cero problemas de derechos de autor, funciona
// offline). Patrón de batería four-on-the-floor a 124 BPM (bombo en cada
// negra, hi-hat en corcheas, palmada en el "2" y el "4", línea de bajo
// simple) — el mismo tipo de pulso que marca el ritmo en clases de
// gimnasio, para que sea más fácil acompasar las repeticiones. Se atenúa
// sola (duck) cada vez que suena un pitido o la voz, igual que antes.
// =====================================================================
const Music = (() => {
  // V187: motor de audio robusto para iOS.
  // En V187 cada golpe creaba muchos nodos WebAudio y buffers durante el
  // entrenamiento. En Safari/iOS esto puede provocar carga de CPU, jitter
  // y sensación de tempo irregular. V187 genera UNA sola pista PCM por
  // tempo y la reproduce como AudioBufferSourceNode en bucle: el pulso no
  // depende de setTimeout ni de crear nodos continuamente.
  let masterGain = null;
  let source = null;
  let buffer = null;
  let running = false;
  let BPM = 124;
  let baseVol = 0.20;
  let duckTimer = null;
  const PHASE_BPM = { 1: 124, 2: 117, 3: 132, 4: 106 };
  const PACE_BPM_MULT = { lento: 0.90, normal: 1.00, rapido: 1.08 };
  const BARS = 8;
  const STEPS = 16;
  const SR = 44100;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!masterGain) {
      masterGain = c.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(c.destination);
    }
    return c;
  }

  function midiHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function sat(x, amount=2.8) { return Math.tanh(x * amount); }

  function addKick(a, pos, amp=1) {
    const dur=0.30, n=Math.min(a.length-pos, Math.floor(dur*SR));
    for(let i=0;i<n;i++) {
      const t=i/SR, f=145*Math.exp(-t*18)+42;
      a[pos+i] += Math.sin(2*Math.PI*f*t) * Math.exp(-t*14) * 0.72 * amp;
    }
  }
  function addSnare(a,pos,amp=1) {
    const dur=0.20,n=Math.min(a.length-pos,Math.floor(dur*SR));
    let seed=(pos+17)|0;
    for(let i=0;i<n;i++) {
      seed=(seed*1664525+1013904223)|0;
      const noise=((seed>>>8)&0xffff)/32768-1;
      const t=i/SR;
      a[pos+i] += (noise*0.42 + Math.sin(2*Math.PI*185*t)*0.08) * Math.exp(-t*20) * amp;
    }
  }
  function addHat(a,pos,open=false,amp=1) {
    const dur=open?0.16:0.055,n=Math.min(a.length-pos,Math.floor(dur*SR));
    let seed=(pos+91)|0;
    for(let i=0;i<n;i++) {
      seed=(seed*1103515245+12345)|0;
      const noise=((seed>>>10)&0x7fff)/16384-1;
      const t=i/SR;
      a[pos+i] += noise * Math.exp(-t*(open?25:65)) * 0.10 * amp;
    }
  }
  function addCrash(a,pos,amp=1) {
    const dur=.75,n=Math.min(a.length-pos,Math.floor(dur*SR)); let seed=(pos+7)|0;
    for(let i=0;i<n;i++) {
      seed=(seed*1664525+1013904223)|0;
      const noise=((seed>>>8)&0xffff)/32768-1, t=i/SR;
      a[pos+i] += noise*Math.exp(-t*5.2)*0.17*amp;
    }
  }
  function addTom(a,pos,freq,amp=1) {
    const dur=.28,n=Math.min(a.length-pos,Math.floor(dur*SR));
    for(let i=0;i<n;i++) { const t=i/SR; a[pos+i]+=Math.sin(2*Math.PI*(freq*Math.exp(-t*8))*t)*Math.exp(-t*12)*0.28*amp; }
  }
  function addBass(a,pos,freq,dur=.18,amp=1) {
    const n=Math.min(a.length-pos,Math.floor(dur*SR));
    for(let i=0;i<n;i++) { const t=i/SR; const x=Math.sin(2*Math.PI*freq*t)+0.42*Math.sin(4*Math.PI*freq*t)+0.18*Math.sin(6*Math.PI*freq*t); a[pos+i]+=sat(x,1.5)*Math.exp(-t*9)*0.24*amp; }
  }
  function addPowerChord(a,pos,root,dur=.34,amp=1) {
    const freqs=[midiHz(root),midiHz(root+7),midiHz(root+12),midiHz(root+19)];
    const n=Math.min(a.length-pos,Math.floor(dur*SR));
    for(let i=0;i<n;i++) {
      const t=i/SR, env=Math.min(1,t/.012)*Math.exp(-t*2.7);
      let x=0;
      freqs.forEach((f,j)=>{ x += (Math.sin(2*Math.PI*f*t)+0.55*Math.sin(2*Math.PI*2*f*t)+0.22*Math.sin(2*Math.PI*3*f*t))*(0.27/(j+1)); });
      a[pos+i]+=sat(x,2.5)*env*0.22*amp;
    }
  }
  function addLead(a,pos,root,dur=.12,amp=1) {
    const f=midiHz(root),n=Math.min(a.length-pos,Math.floor(dur*SR));
    for(let i=0;i<n;i++) { const t=i/SR,env=Math.min(1,t/.006)*Math.exp(-t*18); const x=Math.sin(2*Math.PI*f*t)+.3*Math.sin(2*Math.PI*2*f*t); a[pos+i]+=sat(x,3.2)*env*.10*amp; }
  }

  function buildBuffer(ctx,bpm) {
    const barSec=240/bpm, totalSec=barSec*BARS;
    const a=new Float32Array(Math.ceil(totalSec*SR)+SR);
    const stepSec=barSec/16;
    const roots=[33,33,36,31,33,29,36,31]; // power-rock E/F/G/D palette
    const riffs=[
      [52,52,55,52,59,55,52,47],
      [52,55,59,55,62,59,55,52],
      [55,55,59,55,64,59,55,52],
      [50,50,53,50,57,53,50,46]
    ];
    for(let bar=0;bar<BARS;bar++) {
      const b0=Math.floor(bar*barSec*SR), root=roots[bar%roots.length], riff=riffs[bar%riffs.length];
      addCrash(a,b0,bar===0||bar===4?1.15:.72);
      // doble bombo/rock: pulso firme, con pequeñas variaciones por compás
      const kickSteps = bar%4===3 ? [0,2,4,6,8,10,12,14] : [0,4,6,8,12,14];
      kickSteps.forEach(st=>addKick(a,b0+Math.floor(st*stepSec*SR),st===0?1.05:.86));
      [4,12].forEach(st=>addSnare(a,b0+Math.floor(st*stepSec*SR),1.0));
      if(bar%2===1) addSnare(a,b0+Math.floor(10*stepSec*SR),.58);
      for(let st=0;st<16;st+=2) addHat(a,b0+Math.floor(st*stepSec*SR),false,st%4===0?1:.72);
      if(bar%4===3) addHat(a,b0+Math.floor(14*stepSec*SR),true,1.0);
      // bajo + guitarras de acordes de potencia
      for(let st=0;st<16;st+=2) {
        const f=midiHz(root-12);
        addBass(a,b0+Math.floor(st*stepSec*SR),f,st%4===0?.20:.13,st%4===0?1:.78);
      }
      [0,4,8,12].forEach(st=>addPowerChord(a,b0+Math.floor(st*stepSec*SR),root,st===0?.42:.30,st===0?1.15:.92));
      riff.forEach((note,i)=>addLead(a,b0+Math.floor((i*2)*stepSec*SR),note,.105,i===0?1.05:.78));
      if(bar===3||bar===7) [10,12,13,14,15].forEach((st,i)=>addTom(a,b0+Math.floor(st*stepSec*SR),180-i*18,.9));
    }
    // simple master saturation/limiter to avoid peaks that could stress output
    for(let i=0;i<a.length;i++) a[i]=Math.max(-.92,Math.min(.92,sat(a[i],1.05)));
    const out=ctx.createBuffer(1,a.length,SR); out.getChannelData(0).set(a); return out;
  }

  function start(phaseKey, paceKey='normal') {
    if(running) return;
    const c=ensureGraph();
    BPM=Math.round((PHASE_BPM[phaseKey]||124)*(PACE_BPM_MULT[paceKey]||1));
    if(c.state==='suspended') c.resume().catch(()=>{});
    buffer=buildBuffer(c,BPM);
    source=c.createBufferSource(); source.buffer=buffer; source.loop=true;
    source.connect(masterGain);
    const now=c.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(0,now);
    masterGain.gain.linearRampToValueAtTime(baseVol,now+.35);
    source.start(now+.03); running=true;
  }
  function stop() {
    if(!running) return; running=false;
    const c=getSharedAudioCtx(),now=c.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value,now);
    masterGain.gain.linearRampToValueAtTime(0,now+.12);
    const s=source; source=null;
    if(s) { try{s.stop(now+.15);}catch(e){} }
  }
  function duckBriefly(ms) {
    if(!masterGain) return;
    const c=getSharedAudioCtx(),now=c.currentTime;
    masterGain.gain.cancelScheduledValues(now); masterGain.gain.setValueAtTime(masterGain.gain.value,now);
    masterGain.gain.linearRampToValueAtTime(baseVol*.30,now+.035);
    clearTimeout(duckTimer);
    duckTimer=setTimeout(()=>{ if(!running||!masterGain)return; const t=getSharedAudioCtx().currentTime; masterGain.gain.cancelScheduledValues(t); masterGain.gain.setValueAtTime(masterGain.gain.value,t); masterGain.gain.linearRampToValueAtTime(baseVol,t+.10); },Math.max(120,ms));
  }
  function duck(){ if(masterGain){const c=getSharedAudioCtx(),t=c.currentTime; masterGain.gain.cancelScheduledValues(t); masterGain.gain.setValueAtTime(masterGain.gain.value,t); masterGain.gain.linearRampToValueAtTime(baseVol*.22,t+.05);} }
  function unduck(){ if(masterGain&&running){const c=getSharedAudioCtx(),t=c.currentTime; masterGain.gain.cancelScheduledValues(t); masterGain.gain.setValueAtTime(masterGain.gain.value,t); masterGain.gain.linearRampToValueAtTime(baseVol,t+.12);} }
  function isRunning(){return running;}
  return {start,stop,duckBriefly,duck,unduck,isRunning};
})();

const LocalMusicPlayer = (() => {
  let audioEl = null, sourceNode = null, gainNode = null;
  let running = false;
  let baseVol = 0.7;
  let tracks = []; // [{ name, url }]
  let currentIdx = 0;
  let shuffled = [];
  let onTrackChange = null;
  let duckTimer = null;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!audioEl) {
      audioEl = new Audio();
      audioEl.crossOrigin = 'anonymous';
      audioEl.addEventListener('ended', () => playNext());
      sourceNode = c.createMediaElementSource(audioEl);
      gainNode = c.createGain();
      gainNode.gain.value = baseVol;
      sourceNode.connect(gainNode).connect(c.destination);
    }
    return c;
  }

  function shuffleOrder() {
    shuffled = tracks.map((_, i) => i);
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
  }

  function playIndex(pos) {
    ensureGraph();
    currentIdx = pos;
    const track = tracks[shuffled[pos]];
    if (!track) return;
    audioEl.src = track.url;
    audioEl.play().catch(() => {});
    running = true;
    if (onTrackChange) onTrackChange(track.name, pos, tracks.length);
  }

  function playNext() {
    if (!tracks.length) return;
    const next = (currentIdx + 1) % tracks.length;
    if (next === 0) shuffleOrder(); // vuelve a barajar al completar la vuelta
    playIndex(next);
  }

  return {
    setTracks(fileList) {
      // Libera las URL temporales anteriores antes de crear las nuevas
      tracks.forEach(t => URL.revokeObjectURL(t.url));
      tracks = Array.from(fileList).map(f => ({ name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) }));
      shuffleOrder();
      currentIdx = -1;
    },
    hasTracks() { return tracks.length > 0; },
    trackCount() { return tracks.length; },
    onChange(fn) { onTrackChange = fn; },
    start() {
      if (!tracks.length) return;
      Music.stop(); // no mezclar con el ritmo generado
      playIndex(0);
    },
    stop() {
      running = false;
      if (audioEl) audioEl.pause();
    },
    isRunning() { return running; },
    duckBriefly(ms) {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      clearTimeout(duckTimer);
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.2, c.currentTime + 0.1);
      duckTimer = setTimeout(() => {
        if (!running || !gainNode) return;
        const c2 = getSharedAudioCtx();
        gainNode.gain.cancelScheduledValues(c2.currentTime);
        gainNode.gain.setValueAtTime(gainNode.gain.value, c2.currentTime);
        gainNode.gain.linearRampToValueAtTime(baseVol, c2.currentTime + 0.4);
      }, Math.max(250, ms));
    },
    duck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.16, c.currentTime + 0.12);
    },
    unduck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol, c.currentTime + 0.5);
    },
  };
})();

// =====================================================================
// VOZ — Web Speech API nativa del navegador (sin claves, sin dependencias
// externas). Anuncia ejercicios, cuenta atrás y frases motivacionales.
// Se degrada sola y en silencio si el navegador no soporta síntesis de voz.

const VoiceCoach = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let esVoice = null;
  if (supported) {
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      // Preferencia estricta por castellano de España; dentro de ese grupo,
      // prioriza voces "de red"/mejoradas (Google, Microsoft Online) sobre
      // las locales del sistema, que suelen sonar más robóticas.
      //
      // Aviso honesto (confirmado con desarrolladores independientes, no
      // solo suposición): en iOS, Safari NO expone a las apps web las
      // voces "Mejoradas/Premium" que puedas tener descargadas en Ajustes
      // → Accesibilidad → Contenido hablado — solo un grupo limitado de
      // voces "compactas", y esto ha empeorado en iOS 17/18. Es una
      // limitación de la propia plataforma (misma categoría que el Wake
      // Lock), no algo que este código pueda evitar. Esta búsqueda se deja
      // por si algún día Apple lo cambia o en otros navegadores/SO sí
      // aplica — el ritmo de voz en Ajustes es la palanca real que sí
      // tenemos bajo control para sonar más natural dentro de ese límite.
      const esES = voices.filter(v => v.lang === 'es-ES');
      const esAny = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      const pool = esES.length ? esES : esAny;
      esVoice = pool.find(v => v.localService === false && /jorge|diego|pablo|hombre|male/i.test(v.name)) || pool.find(v => v.localService === false && /google|online|natural|wavenet|mejorada|enhanced|premium/i.test(v.name)) || pool.find(v => /jorge|diego|pablo|hombre|male/i.test(v.name)) || pool.find(v => /google|online|natural|wavenet|mejorada|enhanced|premium/i.test(v.name)) || pool[0] || null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, { rate = 0.97, pitch = 1.0, priority = false } = {}) {
    if (!supported || !voiceOn) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; if (esVoice) u.voice = esVoice;
      // V111 — humanización conservadora: las variaciones aleatorias de
      // tono/velocidad daban sensación de voz sintética. En iOS/Safari la
      // voz real la proporciona el sistema; aquí mejoramos la prosodia con
      // una velocidad estable, tono ligeramente natural y puntuación de las
      // frases, sin intentar falsear el timbre con randomización.
      // V185 — en iPhone no podemos sustituir el motor TTS de Safari por
      // una voz 'Enhanced' desde una PWA, pero sí podemos mejorar la prosodia:
      // velocidad algo más humana, pausas cortas entre avisos y sin cambios
      // aleatorios de tono que hacen que el sintetizador suene aún más artificial.
      u.rate = Math.max(0.80, Math.min(1.10, rate * voiceRateMult));
      u.pitch = Math.max(0.96, Math.min(1.04, pitch));
      u.volume = 1.0;
      u.preUtteranceDelay = 0.02;
      u.postUtteranceDelay = 0.10;
      u.onstart = () => { Music.duck(); LocalMusicPlayer.duck(); };
      u.onend = () => { Music.unduck(); LocalMusicPlayer.unduck(); };

    } catch (e) {}
  }
  // pickNoRepeat: igual que pick() pero recuerda la última frase elegida
  // por categoría (lastPickByCategory) y evita repetirla dos veces
  // seguidas — es lo que más rompe la sensación de "grabación en bucle"
  // cuando llevas 20 minutos oyendo las mismas 3 frases una y otra vez.
  // Con solo 2-3 frases por categoría no ayudaba mucho; con 10-12 (ver
  // pools ampliados abajo) sí se nota la diferencia real.
  const lastPickByCategory = {};
  function pickNoRepeat(category, arr) {
    if (arr.length <= 1) return arr[0];
    let choice;
    do { choice = arr[Math.floor(Math.random() * arr.length)]; }
    while (choice === lastPickByCategory[category] && arr.length > 1);
    lastPickByCategory[category] = choice;
    return choice;
  }
  const ENCOURAGEMENTS = [
    'Bien. Mantén ese ritmo.', 'Muy bien, sigue así.', 'Controla el movimiento y respira.',
    'Eso es. Sin prisas, pero con control.', 'Bien ahí. Mantén la técnica.',
    'Respira y continúa.', 'Perfecto. Quédate con ese ritmo.', 'Un poco más y terminamos.',
    'Muy bien. Sigue limpio el movimiento.', 'Eso es. Controla la vuelta.',
    'Vas bien. Mantén la postura.', 'Bien. No necesitas correr, solo hacerlo bien.',
    'Sigue así. Calidad antes que velocidad.', 'Perfecto. Últimos segundos.',
    'Muy bien. Respira y continúa.', 'Ahí está. Mantén el control.',
  ];
  const SESSION_OPENERS = [
    'Vamos a empezar. Hoy toca hacerlo con control.', 'Empezamos. Concéntrate en la técnica.',
    'Bien, vamos con el circuito de hoy.', 'Todo preparado. Empezamos cuando quieras.',
    'Vamos allá. Buen ritmo y buena técnica.', 'Empezamos. No hace falta correr.',
    'Bien. Primera vuelta, tranquila y controlada.', 'Vamos con el entrenamiento de hoy.',
  ];
  const ROUND_PHRASES = n => [
    `Vuelta ${n} completada, buen trabajo.`, `Fin de la vuelta ${n}, sigue así.`,
    `Vuelta ${n} hecha, aguanta el ritmo.`, `Eso es, vuelta ${n} terminada.`,
    `Vuelta ${n} lista, vamos con la siguiente.`, `Bien, vuelta ${n} en el bolsillo.`,
  ];
  const CIRCUIT_DONE = [
    'Circuito terminado, gran trabajo hoy.', 'Ya está, entreno completado, enhorabuena.',
    'Circuito completo, muy buen trabajo hoy.', 'Eso es todo por hoy, buen entreno.',
    'Circuito hecho, has cumplido, enhorabuena.', 'Y ya está... entreno de hoy completado.',
  ];
  const REST_PHRASES = [
    'Descansa un momento.', 'Recupera y respira.', 'Un momento de descanso.',
    'Respira tranquilo. Ahora recupera.', 'Tómate unos segundos.', 'Recupera el aire.',
    'Bien. Descansa y prepárate para la siguiente.', 'Un respiro. Enseguida seguimos.',
  ];
  const GO_PHRASES = ['Vamos', 'Adelante', 'Ahora', 'Empieza'];
  const EXERCISE_CONNECTORS = ['', 'Toca ', 'Ahora, ', 'Vamos con ', 'Siguiente: '];
  return {
    supported,
    sessionStart() { say(pickNoRepeat('opener', SESSION_OPENERS), { rate: 0.98, priority: true }); },
    announceExercise(name, isTimeBased) {
      // Pequeña variedad también aquí: no siempre "Nombre." a secas, a
      // veces un conector natural delante — de nuevo rompe la repetición,
      // que en este caso suena muchas veces por sesión (una por ejercicio).
      const connector = pickNoRepeat('connector', EXERCISE_CONNECTORS);
      const lowerName = connector ? name.charAt(0).toLowerCase() + name.slice(1) : name;
      say(isTimeBased ? `${connector}${lowerName}, mantén la posición.` : `${connector}${lowerName}.`, { priority: true });
    },
    countdownGo() {
      // Modo de energía: en vez de siempre el mismo rate/pitch base con
      // ruido encima, se sortea entre 3 "personalidades" de entrega —
      // esto es lo que de verdad rompe la sensación de "la misma persona
      // diciendo la misma frase con el mismo ánimo cada vez", más que
      // ampliar el ruido aleatorio por sí solo.
      const mode = pickNoRepeat('go-mode', [
        { rate: 1.08, pitch: 1.08 },  // enérgico
        { rate: 0.98, pitch: 1.0 },   // neutro
        { rate: 1.03, pitch: 0.96 },  // grave y firme
      ]);
      say(pickNoRepeat('go', GO_PHRASES), { ...mode, priority: true });
    },
    encourage() {
      const mode = pickNoRepeat('encourage-mode', [
        { rate: 1.05 },  // más rápido, urgente
        { rate: 0.95 },  // más pausado, tranquilizador
        { rate: 1.0 },   // neutro
      ]);
      say(pickNoRepeat('encourage', ENCOURAGEMENTS), mode);
    },
    rest() {
      const mode = pickNoRepeat('rest-mode', [
        { rate: 0.88, pitch: 0.93 },  // muy calmado
        { rate: 0.95, pitch: 0.98 },  // neutro
        { rate: 0.92, pitch: 1.0 },   // ligeramente más ligero
      ]);
      say(pickNoRepeat('restphrase', REST_PHRASES), { ...mode, priority: true });
    },
    roundDone(n) { say(pickNoRepeat('round', ROUND_PHRASES(n)), { priority: true }); },
    circuitDone() { say(pickNoRepeat('done', CIRCUIT_DONE), { priority: true }); },
    beforeHypo() { say('Antes de los hipopresivos, un par de minutos para bajar pulsaciones. Respira despacio.', { rate: 0.9, pitch: 0.97, priority: true }); },
    warmupStart() { say('Antes de empezar, un calentamiento rápido.', { priority: true }); },
    warmupStep(name) { say(`${name}.`, { priority: true }); },
    hypoStep(name) { say(`${name}.`, { rate: 0.9, priority: true }); },
    // Aviso de cambio de lado a mitad de tiempo — variedad con
    // pickNoRepeat como el resto de la voz, para que no suene siempre
    // exactamente igual en ejercicios consecutivos que lo usan.
    sideSwitch() { say(pickNoRepeat('sideswitch', ['Cambia de lado.', 'Ahora el otro lado.', 'Cambio de lado.']), { rate: 0.92, priority: true }); },
    phaseChanged(name) { say(`Nueva fase del plan, ${name}.`, { priority: true }); },
  };
})();

// =====================================================================
// DATA — hombre 55 años, 165cm, ~70kg, nivel AVANZADO.
// Peso corporal + mancuernas 2kg. Ciclo de 4 semanas SIN fase de
// adaptación (ya entrena a diario): arranca directo en Volumen.
// =====================================================================
const BIOTYPE = {
  // El usuario cumplió 55 años en abril de 2026. No se conoce el día
  // exacto, por eso la edad dinámica usa año+mes: conserva 55 hasta marzo
  // de 2027 y pasa a 56 en abril de 2027. Así BMR/TDEE no quedan congelados
  // para siempre en 55 años sin inventar un día de nacimiento.
  birthYear: 1971, birthMonth: 4,
  ageYears: 55, heightCm: 165, weightKg: 70, sex: 'male'
};

function getCurrentAgeYears() {
  const now = new Date();
  let age = now.getFullYear() - BIOTYPE.birthYear;
  if ((now.getMonth() + 1) < BIOTYPE.birthMonth) age -= 1;
  return Math.max(18, age);
}

// ---- Estimación de calorías (fórmula MET estándar: kcal/min = MET·3.5·kg/200) ----
// MET del circuito por fase: la densidad de trabajo (descanso corto = más
// intensidad media) sube el MET en Intensidad y lo baja en Descarga. Valores
// tomados del Compendium of Physical Activities para "resistance/circuit
// training" de esfuerzo moderado-vigoroso, ajustados por fase.
const MET_CIRCUIT_BY_PHASE = { 1: 6.5, 2: 6.0, 3: 7.5, 4: 5.0 };
const MET_HYPO = 2.8; // trabajo respiratorio/vacío abdominal, esfuerzo bajo
function estimateCalories(circuitSec, hypoSec, phaseKey) {
  const metCircuit = MET_CIRCUIT_BY_PHASE[phaseKey] || 6.5;
  const kcalCircuit = metCircuit * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, circuitSec) / 60);
  const kcalHypo = MET_HYPO * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, hypoSec) / 60);
  return Math.round(kcalCircuit + kcalHypo);
}

  { id: 'pu_05', name: 'Flexión declinada (pies elevados)', group: 'superior_empuje', level: 5, baseReps: 10, baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Pies apoyados en una silla estable, manos en el suelo. Cuerpo recto, baja el pecho hacia el suelo — el ángulo hace trabajar mucho más la parte alta del pectoral que la flexión estándar.' },
  { id: 'pu_06', name: 'Flexión triángulo (diamond)',        group: 'superior_empuje', level: 6, baseReps: 8,  baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Manos juntas bajo el pecho formando un triángulo con los dedos índice y pulgar. Codos pegados al cuerpo al bajar — mucho más tríceps y pecho interno que la flexión estándar.' },
  { id: 'pu_07', name: 'Flexión a una mano (asistida)',      group: 'superior_empuje', level: 7, baseReps: 5,  baseSeries: 4, tempo: '3-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Pies bien separados para más base de apoyo, una mano detrás de la espalda. Baja controlado sin rotar el tronco — progresión real hacia la flexión a una mano.' },
  { id: 'press_01', name: 'Press de hombro con mancuernas (sentado)', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'press', equip: 'mancuernas', weight: 2, cue: 'Sentado, mancuernas a la altura del hombro, empuja arriba sin bloquear codo del todo.' },
  // press_02: progresión de hombro más allá del techo de mancuerna, con
  // tensión continua de la banda en todo el recorrido del press.
  { id: 'press_02', name: 'Press de hombro con banda (de pie)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'De pie sobre la banda con los pies a la anchura de los hombros, sujeta los extremos a la altura del hombro con las palmas hacia delante. Empuja hacia arriba hasta extender los brazos, baja controlado sin bloquear el codo.' },
  { id: 'fly_01', name: 'Aperturas de pecho con mancuernas (suelo)', group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 3, tempo: '3-0-1', icon: 'fly', equip: 'mancuernas', weight: 2, cue: 'Tumbado, brazos abiertos con ligera flexión de codo, baja controlado, sube juntando.' },
  { id: 'fly_02', name: 'Cruce de poleas con banda (cross over)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'fly', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del pecho (puerta cerrada). De espaldas al anclaje, dos pasos al frente, brazos abiertos en cruz con ligera flexión de codo. Cruza los brazos por delante del pecho en semicírculo apretando el pectoral, vuelve controlado sin perder la tensión.' },
  // Aperturas en ángulo ascendente — el cross over de arriba trabaja el
  // pecho medio en un plano horizontal; esto cambia el ángulo de tracción
  // a bajo-hacia-arriba, que es lo que prioriza el pectoral clavicular
  // (la parte alta, junto a la clavícula). Es la parte que visualmente
  // "levanta" un pecho caído — sin ella, por mucho volumen que gane el
  // pecho medio, el descuelgue visual apenas cambia. Sin foto real de
  // banda tumbado en el suelo: se usa la de polea en banco inclinado
  // (mismo ángulo de tracción bajo-alto, que es lo que importa).
  { id: 'fly_03', name: 'Aperturas ascendentes con banda (pecho alto)', group: 'superior_empuje', level: 5, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'fly', equip: 'banda', reqEquip: 'banda', cue: 'Banda anclada a ras de suelo (puerta cerrada, pasa por debajo). Tumbado o semi-incorporado con la cabeza más alta que los pies (apoyado en cojines), brazos abajo a los lados con ligera flexión de codo. Sube en arco hacia arriba y al centro, como abrazando un tronco por encima de la cabeza, aprieta la parte alta del pecho arriba, baja controlado.' },
  // Progresión de tríceps más allá del techo de mancuernas: mismo patrón
  // de extensión, ahora con tensión continua de la banda en vez de solo
  // el peso muerto de la mancuerna.
  { id: 'tricep_04', name: 'Extensión de tríceps con banda (skull crusher)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'curl', equip: 'banda', reqEquip: 'banda', cue: 'Tumbado, banda anclada por detrás de la cabeza a ras de suelo (puerta cerrada o mueble pesado). Codos apuntando al techo y fijos, extiende los antebrazos hasta estirar del todo, vuelve controlado sin mover el codo del sitio.' },
  // Press de pecho con banda — cubre lo que las flexiones y aperturas no
  // pueden dar solas: tensión constante en el rango completo del press,
  // sin depender de la gravedad. En el suelo (floor press) en vez de banco,
  // lo que además protege el hombro al limitar el rango en el punto más
  // vulnerable — buena elección justo con antepulsión de hombro.
  { id: 'bpress_01', name: 'Press de pecho con banda (floor press)', group: 'superior_empuje', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'Tumbado en el suelo, banda anclada por detrás de la cabeza a la altura del hombro (puerta cerrada o mueble pesado). Sujeta los extremos a la altura del pecho, codos a 90°. Empuja hacia arriba extendiendo los brazos sin bloquear el codo, aprieta el pecho arriba, baja el doble de lento de lo que subes.' },
  // bpress_02: única familia de pecho con un solo nivel — progresión real
  // en ángulo inclinado, que prioriza el pectoral clavicular (parte alta)
  // igual que fly_03, pero en un patrón de PRESS en vez de apertura — dos
  // estímulos distintos sobre la misma zona objetivo. Es el añadido con
  // más impacto directo posible sobre "pecho caído" ahora mismo.
  { id: 'bpress_02', name: 'Press de pecho con banda en inclinado', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'Semi-incorporado con la cabeza más alta que los pies (apoyado en cojines o el borde de un sofá), banda anclada por detrás y por debajo de los hombros a ras de suelo. Empuja hacia arriba y ligeramente hacia atrás, en línea con la parte alta del pecho, aprieta arriba 1s, baja controlado. Nota cómo trabaja más la zona alta/clavicular que el press plano.' },
  // bpress_03 (agosto 2026): esta familia acaba de pasar a ser prioritaria
  // — antes de esto tenía 0 apariciones reales en 24 sesiones, ahora tiene
  // hueco garantizado cada semana. Con solo 2 niveles se iba a quedar sin
  // margen de progresión enseguida, justo cuando más frecuencia va a tener.
  // Progresión real con las mancuernas de 4kg confirmadas (antes la
  // familia entera dependía solo de banda): tumbado en el suelo con
  // mancuerna en cada mano en vez de banda — resistencia constante en
  // todo el recorrido (la banda pierde tensión al final), un estímulo
  // distinto y más exigente para seguir progresando el pecho.
  { id: 'bpress_03', name: 'Press de pecho en el suelo con mancuernas', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'mancuernas', weight: 4, cue: 'Tumbado en el suelo, rodillas flexionadas, una mancuerna en cada mano a la altura del pecho, codos apoyados en el suelo al bajar (ahí es donde paras, no sigas bajando). Empuja las mancuernas arriba hasta casi juntarlas, sin bloquear el codo, baja controlado hasta que los codos vuelvan a tocar el suelo.' },
  { id: 'dip_01', name: 'Fondos en silla',                   group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'dip', equip: 'peso corporal', cue: 'Manos en el borde de la silla, piernas extendidas. Baja hasta 90° de codo, sin hundir hombros.' },
  { id: 'pike_01', name: 'Flexión pike (hombro)',            group: 'superior_empuje', level: 4, baseReps: 8,  baseSeries: 3, tempo: '2-0-1', icon: 'pike', equip: 'peso corporal', cue: 'Cadera elevada en V invertida. Baja la cabeza entre las manos, empuja de vuelta arriba.' },
  // pike_02: familia en techo real (nivel 4 era el máximo, volumeBonus
  // alto). Progresión real hacia el hombro/pecho (objetivo explícito del
  // usuario) sin necesitar más peso: pies elevados en una silla/mochila
  // aumenta el porcentaje de peso corporal sobre los hombros, acercando
  // el ángulo hacia la vertical real (paso intermedio real hacia
  // handstand push-up, mucho más seguro que saltar directo a esa
  // variante). Foto real EXACTA en la base pública para esta variante
  // concreta de pies elevados, HTTP 200 verificado.
  { id: 'pike_02', name: 'Flexión pike con pies elevados',   group: 'superior_empuje', level: 5, baseReps: 8, baseSeries: 3, tempo: '2-0-1', icon: 'pike', equip: 'peso corporal', cue: 'Pies apoyados en una silla o superficie elevada estable, manos en el suelo, cadera elevada en V invertida más pronunciada. Baja la cabeza entre las manos, empuja de vuelta arriba. Más ángulo hacia la vertical que la pike normal, mayor exigencia de hombro.' },
  { id: 'lat_01', name: 'Elevaciones laterales con mancuernas', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'lateral', equip: 'mancuernas', weight: 2, cue: 'Brazos a los lados, sube hasta la altura del hombro con ligera flexión de codo. Sin impulso.' },
  // lat_02: equivalente real con banda — para cuando el techo de peso de
  // tus mancuernas (máx. real ~3,5kg/mano) se queda corto y no puedes
  // comprar más de momento. Tensión continua de la banda en vez de solo
  // peso muerto: a menudo notarás MÁS exigencia real que con la mancuerna
  // en la parte alta del recorrido, aunque el "peso" no suba en el papel.
  { id: 'lat_02', name: 'Elevaciones laterales con banda', group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'lateral', equip: 'banda', reqEquip: 'banda', cue: 'Pisa el centro de la banda con ambos pies, sujeta un extremo con cada mano a los lados. Sube los brazos hasta la altura del hombro con ligera flexión de codo, sin impulso, aguanta 1s arriba, baja controlado.' },

  { id: 'row_01', name: 'Remo invertido (mesa)',             group: 'superior_traccion', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'peso corporal', cue: 'Cuerpo bajo la mesa, agarra el borde, tira del pecho hacia arriba manteniendo el cuerpo recto.' },
  { id: 'row_02', name: 'Remo a una mano con mancuerna',     group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'mancuernas', weight: 2, cue: 'Apoyo con una mano en silla/mesa, tira de la mancuerna hacia la cadera, codo pegado al cuerpo.' },
  { id: 'row_03', name: 'Superman',                          group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'superman', equip: 'peso corporal', cue: 'Tumbado boca abajo, eleva brazos y piernas a la vez, aprieta lumbar y glúteo.' },
  // row_04: progresión real de remo más allá del techo de mancuerna —
  // tensión continua de la banda en un gesto de "apertura hacia atrás"
  // que además refuerza directamente la retracción escapular (postura).
  { id: 'row_04', name: 'Apertura de espalda con banda (back flyes)', group: 'superior_traccion', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del pecho (puerta cerrada). De frente al anclaje, brazos extendidos al frente sujetando los extremos. Abre los brazos hacia atrás en cruz manteniéndolos paralelos al suelo, aprieta omóplatos, vuelve controlado.' },
  { id: 'ytw_01', name: 'Y-T-W prono con mancuernas ligeras', group: 'superior_traccion', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'ytw', equip: 'mancuernas', weight: 2, cue: 'Tumbado boca abajo, dibuja las letras Y-T-W elevando los brazos. Fortalece espalda alta y postura.' },
  // ytw_02: progresión real solicitada — añade rotación externa de
  // muñeca al final del recorrido (de palmas abajo a palmas enfrentadas),
  // sumando trabajo directo de manguito rotador a la retracción escapular
  // que ya hacía el YTW. Mismo tipo de mejora que ya se aplicó a
  // retract/rotator con la banda, aquí con mancuerna.
  { id: 'ytw_02', name: 'Apertura invertida con rotación externa', group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-1-2', icon: 'ytw', equip: 'mancuernas', weight: 2, cue: 'Inclinado hacia delante (o en banco inclinado boca abajo si tienes), mancuernas colgando con palmas hacia abajo, codos con ligera flexión fija. Sube en arco hacia los lados y, al llegar arriba, gira la muñeca para que las palmas queden una frente a la otra — aprieta omóplatos en la posición final. Baja controlado deshaciendo la rotación.' },
  { id: 'retract_01', name: 'Retracción escapular',          group: 'superior_traccion', level: 1, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'peso corporal', cue: 'Junta los omóplatos hacia atrás y abajo, sin encoger hombros.' },
  // retract_02: con mancuernas ligeras (1kg recomendado, no 2kg — este es
  // un ejercicio de control postural y resistencia, no de fuerza. Más peso
  // del necesario invita a sustituir la retracción controlada por impulso
  // o encogimiento de hombros, justo lo contrario de lo que corrige.
  { id: 'retract_02', name: 'Retracción escapular prono con mancuernas ligeras', group: 'superior_traccion', level: 2, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'mancuernas', weight: 1, cue: 'Boca abajo, brazos colgando con mancuernas ligeras, sube juntando los omóplatos sin encoger los hombros hacia las orejas. El peso es solo para dar algo de resistencia — la calidad del gesto importa mucho más que la carga aquí.' },
  // Banda elástica (equipo nuevo) — resuelve el techo de las mancuernas de
  // 2-8kg en tren superior con tensión continua en vez de solo gravedad.
  // Dos añadidos van directos a la postura de hombros hacia delante:
  // retract_03 (banda, sin necesidad de anclaje — apta en cualquier sitio)
  // y rotator_01 (rotación externa, fortalece el manguito rotador externo
  // que suele estar debilitado cuando los hombros viven todo el día hacia
  // delante frente al ordenador).
  { id: 'retract_03', name: 'Band pull apart (retracción con banda)', group: 'superior_traccion', level: 3, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'banda', reqEquip: 'banda', cue: 'Brazos extendidos al frente a la altura del pecho, sujeta la banda con ambas manos. Sin doblar los codos, abre los brazos hacia los lados llevando la banda hasta el pecho, aprieta los omóplatos, vuelve controlado. No hace falta anclar la banda a nada.' },
  { id: 'rotator_01', name: 'Rotación externa de hombro con banda', group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del codo (puerta cerrada, pomo o bisagra). De perfil, codo pegado a las costillas y flexionado 90°, antebrazo cruzado por delante del cuerpo. Rota el antebrazo hacia fuera manteniendo el codo fijo en el costado, vuelve controlado. Directo al manguito rotador — clave para revertir el hombro hacia delante.' },
  // Face pull — el ejercicio de referencia mundial para revertir hombro
  // hacia delante: combina en un solo gesto retracción escapular +
  // rotación externa + trabajo de deltoides posterior, los tres puntos
  // que ya atacabas por separado con retract/rotator/ytw. No sustituye a
  // esos, los corona — es el movimiento que más carga real tolera de
  // todo el bloque postural, así que es donde más fuerza correctiva se
  // puede meter según pase el tiempo. Sin foto real de banda en la base
  // de datos: se usa la de polea (mismo gesto exacto, solo cambia la
  // fuente de resistencia — cable por banda anclada en puerta).
  { id: 'rotator_02', name: 'Face pull con banda', group: 'superior_traccion', level: 2, baseReps: 15, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura de la cara (puerta cerrada). Tira de los dos extremos hacia la cara separando las manos al final del recorrido, como si fueras a tocarte las orejas con los pulgares, codos altos por encima de los hombros. Aprieta omóplatos y deltoides posterior 1 segundo arriba antes de volver controlado.' },
  // rotator_03 (agosto 2026): misma razón que bpress_03 — familia recién
  // priorizada (antes 2 apariciones en 24 sesiones, ahora garantizada
  // cada semana), con solo 2 niveles se quedaba sin margen enseguida.
  // Progresión con mancuerna en vez de banda: tumbado de lado, mancuerna
  // en la mano de arriba, mismo gesto de rotación externa pero contra
  // gravedad en vez de contra banda — recluta el manguito rotador de
  // forma más aislada y exigente, clave para sostener el trabajo de
  // hombro hacia atrás a largo plazo.
  { id: 'rotator_03', name: 'Rotación externa de hombro con mancuerna', group: 'superior_traccion', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'mancuernas', weight: 2, sides: true, cue: 'Tumbado de lado sobre una colchoneta, codo del brazo de arriba pegado a las costillas y flexionado 90°, mancuerna en esa mano con el antebrazo apoyado sobre el abdomen. Rota el antebrazo hacia arriba hasta que quede vertical, manteniendo el codo pegado al cuerpo todo el recorrido, baja controlado. Cambia de lado a mitad de serie.' },
  // Curl de bíceps: hueco real que no existía en el plan (bíceps solo entraba
  // de rebote en el remo). Con techo de mancuernas en 8kg, la progresión aquí
  // es sobre todo de técnica/tempo, no de carga — por eso curl_03 y curl_04
  // suben dificultad con pausas y técnicas de intensidad, no con más peso.
  { id: 'curl_01', name: 'Curl de bíceps con mancuernas',    group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'De pie, codos pegados al cuerpo, sube controlado sin balancear la espalda, aprieta arriba antes de bajar.' },
  { id: 'curl_02', name: 'Curl martillo con mancuernas',     group: 'superior_traccion', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Igual que el curl estándar pero con las palmas mirándose entre sí (agarre neutro) — reparte el trabajo entre bíceps y antebrazo.' },
  { id: 'curl_03', name: 'Curl con pausa en contracción máxima', group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-2-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sube igual, pero mantén 2s de pausa apretando el bíceps arriba antes de bajar controlado. Con el mismo peso, esto ya es más difícil de lo que parece.' },
  { id: 'curl_04', name: 'Curl 21 (rango parcial + completo)', group: 'superior_traccion', level: 4, baseReps: 21, baseSeries: 2, tempo: '1-0-1', icon: 'curl', equip: 'mancuernas', weight: 2, cue: '7 reps de la mitad inferior del recorrido + 7 reps de la mitad superior + 7 reps del recorrido completo, sin soltar el peso entre bloques. Técnica clásica para exprimir más de un peso que ya dominas.' },
  // Zottman curl — el nivel más avanzado de la familia bíceps: sube como
  // un curl normal (palma arriba, bíceps) y baja con la palma girada
  // hacia abajo (pronado, antebrazo extensor). Un solo ejercicio entrena
  // bíceps Y antebrazo en el mismo movimiento — el candidato más directo
  // para volumen de brazo cuando ya dominas el curl 21 y el peso sigue
  // sin dar más de sí.
  { id: 'curl_05', name: 'Zottman curl', group: 'superior_traccion', level: 5, baseReps: 10, baseSeries: 3, tempo: '2-0-3', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sube en curl normal con las palmas hacia arriba. Arriba, gira las muñecas 180° hasta que las palmas miren hacia abajo, y baja despacio en esa posición pronada. Al llegar abajo, gira de nuevo las palmas hacia arriba para la siguiente repetición. La bajada lenta en pronación es la que más trabaja el antebrazo.' },
  // curl_06: equivalente real con banda. No existe una foto de "band
  // curl" con ese nombre exacto en la base de datos pública, así que se
  // reutiliza la foto de curl_01 (misma postura corporal exacta: de pie,
  // codos pegados al cuerpo, subiendo el antebrazo — solo cambia la
  // fuente de resistencia). Igual que con lat_02, pensado para cuando el
  // techo real de tus mancuernas se queda corto.
  { id: 'curl_06', name: 'Curl de bíceps con banda', group: 'superior_traccion', level: 6, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'banda', reqEquip: 'banda', cue: 'Pisa el centro de la banda con ambos pies, sujeta un extremo con cada mano, codos pegados al cuerpo. Sube controlado sin balancear la espalda, aprieta arriba 1s, baja despacio — la banda aprieta más cuanto más subes, así que la parte alta del recorrido es donde más se nota.' },
  // Tríceps dedicado: hasta ahora solo entraba de rebote (fondos, press,
  // flexión triángulo) — mismo hueco que tenía bíceps antes de añadir curl.
  { id: 'tricep_01', name: 'Patada de tríceps (kickback)',  group: 'superior_empuje', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Inclinado hacia delante, codo pegado al cuerpo y fijo, extiende el antebrazo hacia atrás hasta estirar del todo. Solo se mueve el antebrazo.' },
  { id: 'tricep_02', name: 'Extensión de tríceps por encima de la cabeza (sentado)', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sentado, mancuerna sujeta con ambas manos por encima de la cabeza, baja controlado por detrás de la nuca sin abrir los codos hacia los lados.' },
  { id: 'tricep_03', name: 'Extensión de tríceps a una mano (de pie)', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'De pie, un brazo por encima de la cabeza sujetando la mancuerna, baja por detrás de la nuca manteniendo el codo fijo y apuntando al techo. Más exigente de estabilidad que la versión a dos manos.' },

  // Antebrazo (familia 'wrist', nueva) — hueco real: bíceps/tríceps ya
  // cubiertos pero nada de trabajo directo de muñeca/antebrazo, que es
  // precisamente lo que da grosor visual al brazo entre codo y muñeca.
  // Peso recomendado bajo (1kg) porque el rango de movimiento es pequeño
