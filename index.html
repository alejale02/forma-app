// P1.8 — estado visible de fatiga/recuperación. Es una lectura prudente de
// señales recientes; no diagnostica ni cambia por sí sola el entrenamiento.
function computeRecoveryStatus(state){
  const history=state.history||[];
  const dates=[...new Set(history.map(h=>String(h.date||'').slice(0,10)).filter(Boolean))].sort().slice(-3);
  const sets=history.filter(h=>dates.includes(String(h.date||'').slice(0,10))).flatMap(h=>h.setsDone||[]).filter(x=>Number.isFinite(Number(x.rpe)));
  const avgRpe=sets.length?sets.reduce((a,x)=>a+Number(x.rpe),0)/sets.length:null;
  const sleepDates=Object.keys(state.sleepLog||{}).sort().slice(-3);
  const sleeps=sleepDates.map(d=>Number(state.sleepLog[d])).filter(Number.isFinite);
  const avgSleep=sleeps.length?sleeps.reduce((a,b)=>a+b,0)/sleeps.length:null;
  const readiness=computeReadinessScore(getTodayReadiness(state));
  let points=0, reasons=[];
  if(avgRpe!=null){ if(avgRpe>=8.4){points+=2;reasons.push('RPE reciente alto')} else if(avgRpe>=7.8){points+=1;reasons.push('RPE reciente moderado-alto')} }
  if(avgSleep!=null){ if(avgSleep<6.0){points+=2;reasons.push('sueño reciente bajo')} else if(avgSleep<6.5){points+=1;reasons.push('sueño algo bajo')} }
  if(readiness!=null){ if(readiness<=2.2){points+=2;reasons.push('preparación baja hoy')} else if(readiness<3.2){points+=1;reasons.push('preparación moderada hoy')} }
  let tone='good',label='Recuperación adecuada',text='No aparecen señales recientes suficientes para reducir la exigencia. Sigue el plan normal y usa tus sensaciones durante la sesión.';
  if(points>=3){tone='warn';label='Fatiga acumulada a vigilar';text='Hay varias señales recientes de fatiga. Hoy conviene priorizar técnica y recuperación y no buscar progresiones adicionales.';}
  else if(points>=1){tone='mid';label='Recuperación moderada';text='Hay alguna señal de recuperación mejorable. Mantén el volumen previsto y evita añadir trabajo extra si la sesión se siente más dura de lo habitual.';}
  return {tone,label,text,avgRpe,avgSleep,readiness,reasons};
}
// P1.9 — tendencia de carga: compara los 7 días más recientes con los 7
// anteriores. Es informativo y no modifica automáticamente el entrenamiento.
// La idea es detectar cambios bruscos de volumen antes de interpretarlos como
// una mejora o una caída de rendimiento. Requiere al menos 2 sesiones en cada
// ventana para evitar conclusiones con pocos datos.
function getRecentTrainingLoadTrend(state){
  const today=localDateKey();
  const recent=getRecentMuscleEffectiveVolume(state,7);
  const previousKeys=[];
  for(let i=13;i>=7;i--) previousKeys.push(shiftKey(today,-i));
  const hist=state.history||[];
  const prevHist=hist.filter(h=>previousKeys.includes(String(h.date||'').slice(0,10)));
  const prevState={...state,history:prevHist};
  const previous=getRecentMuscleEffectiveVolume(prevState,7);
  const recentTotal=Object.values(recent.totals||{}).reduce((a,b)=>a+b,0);
  const previousTotal=Object.values(previous.totals||{}).reduce((a,b)=>a+b,0);
  if(recent.sessions<2 || previous.sessions<2 || previousTotal<=0) return null;
  const pct=((recentTotal-previousTotal)/previousTotal)*100;
  let tone='stable',label='Carga estable';
  if(pct>=30){tone='up';label='Aumento de carga';}
  else if(pct<=-30){tone='down';label='Descenso de carga';}
  return {recentTotal,previousTotal,pct,tone,label,recentSessions:recent.sessions,previousSessions:previous.sessions};
}

// P2.12 — coherencia entre carga y recuperación.
// Lectura conservadora: cruza la tendencia de carga de 14 días con la
// recuperación reciente. Nunca cambia automáticamente el entrenamiento.
function LoadRecoveryCoherenceCard({ state }) {
  const load = useMemo(() => getRecentTrainingLoadTrend(state), [state.history]);
  const recovery = useMemo(() => computeRecoveryStatus(state), [state.history, state.sleepLog, state.readinessLog]);
  let tone = 'good';
  let label = 'Carga y recuperación coherentes';
  let text = 'No aparece una combinación clara de aumento brusco de carga y recuperación comprometida.';
  if (load && load.pct >= 30 && recovery.tone === 'warn') {
    tone = 'warn';
    label = 'Aumento de carga con recuperación a vigilar';
    text = 'La carga reciente ha subido de forma marcada y además hay varias señales de recuperación mejorable. Conviene consolidar antes de buscar más dificultad.';
  } else if (load && load.pct >= 30 && recovery.tone === 'mid') {
    tone = 'mid';
    label = 'Aumento de carga con prudencia';
    text = 'La carga ha aumentado de forma marcada y la recuperación no es perfecta. Mantén el plan previsto y evita añadir volumen extra por ahora.';
  } else if (load && load.pct <= -30 && recovery.tone === 'good') {
    tone = 'mid';
    label = 'Descenso de carga sin señales de fatiga';
    text = 'La carga reciente ha bajado de forma marcada sin señales claras de fatiga. Si la reducción no era intencionada, observa la constancia en las próximas sesiones.';
  } else if (!load) {
    text = 'Todavía no hay dos ventanas de carga suficientemente completas para cruzarlas con la recuperación. La lectura se activará con más sesiones.';
  }
  return html`

}

              `;
            })}
          </div>
        `;
      })}
      ${detailEx ? html`<${ExerciseDetailModal} ex=${detailEx} onClose=${() => setDetailEx(null)} />` : null}
      ${viewingSession ? html`
        <div class="modal-overlay" onClick=${closeSessionModal}>
          <div class="modal-card session-detail-modal" onClick=${e => e.stopPropagation()}>
            ${sessionDetailEx ? html`

              </ol>
            ` : html`

                <h2>Circuito del ${new Date(viewingSession.session.date).toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'short' })}</h2>
                <button class="icon-btn" onClick=${closeSessionModal}>✕</button>

              ${viewingSession.exercisesDone.length ? viewingSession.exercisesDone.map((h, i) => html`
                <button key=${i} class="session-detail-row" onClick=${() => setSessionDetailEx(h.exercise)}>

                </button>
              `) : html`<p class="cue-text">No se encontró el detalle exacto de ejercicios de esta sesión (puede ser de antes de esta función).</p>`}
            `}

// =====================================================================
// PANTALLA: CONFIGURACIÓN
// =====================================================================
// Pantalla de bienvenida en instalaciones nuevas: antes de generar un
// código propio (y por tanto progreso vacío), da la opción de traer el
// progreso ya acumulado en otro dispositivo. Así nunca se "empieza de
// cero" por error solo por abrir la app en un móvil distinto.
// Se muestra cuando la app se abre con ?sync=CODIGO en la URL (enlace
// compartido o código QR escaneado con la cámara nativa). Siempre pide
// confirmación explícita antes de traer el progreso — nunca sustituye los
// datos del dispositivo en silencio.
function IncomingSyncPrompt({ code, onConfirm, onDismiss }) {
  const [status, setStatus] = useState(null); // null | 'loading' | 'error'
  const [errorMsg, setErrorMsg] = useState('');
  function handleConfirm() {
    setStatus('loading');
    onConfirm(code).catch((e) => { setStatus('error'); setErrorMsg(e && e.message ? e.message : 'No se pudo vincular.'); });
  }
  return html`
    <div class="screen link-prompt">
      <h1 class="link-prompt-title">Enlace de sincronización recibido</h1>
      <p class="cue-text">Se ha recibido un código desde otro dispositivo (<strong>${code}</strong>). ¿Traer ese progreso a este dispositivo? Sustituirá los datos que hubiera guardados aquí.</p>
      <button class="btn-primary btn-huge" onClick=${handleConfirm} disabled=${status === 'loading'}>${status === 'loading' ? 'Vinculando…' : 'Sí, traer ese progreso'}</button>
      <button class="btn-secondary" onClick=${onDismiss} disabled=${status === 'loading'}>Ignorar y seguir con este dispositivo</button>
      ${status === 'error' ? html`<p class="sync-msg sync-err">${errorMsg}</p>` : null}
    </div>
  `;
}

// Genera un evento .ics recurrente con aviso 1h antes — el sistema
// operativo (iOS/Android) es quien dispara el aviso, de forma 100% fiable,
// sin depender de que esta app tenga permiso ni esté abierta en ese momento
// (una web no puede programar notificaciones push reales sin un servidor
// detrás; esto sí funciona siempre, con las mismas garantías que cualquier
// otro evento de tu calendario).
const TRAINING_SCHEDULE_PRESETS = {
  normal: { label: 'Jornada normal (8:00-17:30)', hour: 18, minute: 0, desc: 'Al salir del trabajo — mejor rendimiento físico del día y descarga la tensión postural acumulada.' },
  intensiva: { label: 'Jornada intensiva (7:30-15:15)', hour: 16, minute: 30, desc: 'Ya digerida la comida, sigues en la ventana de mejor rendimiento, y rompes la tarde libre.' },
  agosto: { label: 'Agosto (vacaciones)', hour: 8, minute: 0, desc: 'Por la mañana, antes de que apriete el calor y antes de que se cuele el "ya lo hago luego".' },
};

function buildTrainingIcs(hour, minute) {
  const now = new Date();
  const start = new Date(now);
  start.setHours(hour, minute, 0, 0);
  if (start <= now) start.setDate(start.getDate() + 1); // si ya pasó hoy, empieza mañana
  const end = new Date(start.getTime() + 45 * 60000);
  const fmt = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const uid = `forma55-entreno-${Date.now()}@forma55`;
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Forma 55//Recordatorio//ES', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${fmt(now)}`,
    `DTSTART:${fmt(start)}`,
    `DTEND:${fmt(end)}`,
    'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA',
    'SUMMARY:Hora de entrenar (Forma 55)',
    'DESCRIPTION:Circuito del día + rutina matutina si toca. Recordatorio 1h antes.',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Entreno en 1 hora', 'TRIGGER:-PT1H', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}

function CalendarReminderBlock() {
  const [preset, setPreset] = useState('normal');
  const info = TRAINING_SCHEDULE_PRESETS[preset];

  function handleDownload() {
    const ics = buildTrainingIcs(info.hour, info.minute);
    const blob = new Blob([ics], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'forma55-recordatorio-entreno.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">🔔 Recordatorio de entreno (1h antes)</p>
      <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 12 }}>
        Una web no puede mandar un aviso push fiable sin un servidor detrás. Esto hace lo mismo pero de verdad: genera un evento recurrente para tu Calendario (lunes a sábado), con aviso 1 hora antes — lo dispara el propio sistema, sin depender de tener la app abierta.
      </p>
      <div class="pace-picker" style=${{ marginBottom: 10 }}>
        ${[['normal', 'Normal'], ['intensiva', 'Intensiva'], ['agosto', 'Agosto']].map(([key, label]) => html`
          <button key=${key} class=${`pace-btn ${preset === key ? 'active' : ''}`} onClick=${() => setPreset(key)}>${label}</button>
        `)}
      </div>
      <p class="settings-hint" style=${{ marginTop: 0 }}><strong>${info.label}</strong> → entreno a las ${String(info.hour).padStart(2, '0')}:${String(info.minute).padStart(2, '0')}. ${info.desc}</p>
      <button class="btn-primary btn-huge" onClick=${handleDownload}>Añadir a mi calendario</button>
      <p class="settings-hint">Al tocar el archivo descargado, tu Calendario (iPhone o Android) te pedirá confirmar añadirlo — solo hace falta una vez, y se repite solo cada semana.</p>
    </div>
  `;
}

// Plan B — no depende de ningún servicio externo ni de escanear nada: se
// exporta todo el progreso a un archivo .json (se envía por AirDrop,
// Mensajes o iCloud Drive, igual que ya haces con tus mp3 de VLC) y se
// importa en el otro dispositivo leyendo ese mismo archivo. Es el método
// más robusto de los dos porque además lleva el historial completo de
// sesiones (fechas, calorías, duración), que el código QR no incluye por
// tamaño — úsalo siempre que quieras traspaso completo, no solo estado.
function ExportImportBlock({ state, forceRender }) {
  const [status, setStatus] = useState(null); // null | 'importing' | 'preview' | 'ok' | 'error'
  const [errorMsg, setErrorMsg] = useState('');
  const [pendingImport, setPendingImport] = useState(null); // { parsed, summary }
  const inputRef = useRef(null);

  function handleExport() {
    exportBackupFile();
    state.lastBackupDate = new Date().toISOString().slice(0, 10);
    state.backupDue = false;
    state.backupSnoozeUntil = null;
    saveState(state);
    if (forceRender) forceRender(x => x + 1);
  }

  // P3 — vista previa y confirmación antes de sustituir. Antes el import
  // reemplazaba TODO el progreso en cuanto se parseaba el archivo, sin
  // mostrar qué se iba a perder — un toque accidental podía borrar sesiones
  // reales sin aviso. Ahora se calcula un resumen comparativo (sesiones,
  // última fecha, nivel de fases) del archivo vs. el estado actual y se
  // exige un botón de confirmación explícito antes de tocar localStorage.
  function summarizeState(s) {
    const sessions = Array.isArray(s.history) ? s.history.length : 0;
    const totalDone = Number(s.totalSessionsDone) || 0;
    const dates = (s.history || []).map(h => h.date).filter(Boolean).sort();
    const lastDate = dates.length ? dates[dates.length - 1].slice(0, 10) : '—';
    const phase = (PHASES[s.cycleWeek] && PHASES[s.cycleWeek].name) || '—';
    return { sessions, totalDone, lastDate, phase };
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setStatus('importing');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object' || !('exerciseLevels' in parsed)) {
          throw new Error('Este archivo no parece un progreso válido de Forma 55.');
        }
        const incoming = summarizeState(parsed);
        const current = summarizeState(state);
        setPendingImport({ parsed, incoming, current });
        setStatus('preview');
      } catch (err) {
        setStatus('error');
        setErrorMsg(err.message || 'Archivo no válido.');
      } finally {
        e.target.value = '';
      }
    };
    reader.onerror = () => { setStatus('error'); setErrorMsg('No se pudo leer el archivo.'); };
    reader.readAsText(file);
  }

  function confirmImport() {
    if (!pendingImport) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(migrateState(pendingImport.parsed)));
    setStatus('ok');
    setPendingImport(null);
    setTimeout(() => window.location.reload(), 700);
  }

  function cancelImport() {
    setPendingImport(null);
    setStatus(null);
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">📁 Plan B: exportar/importar por archivo</p>
      <p class="settings-hint" style=${{ marginTop: 0, marginBottom: 12 }}>
        Si la sincronización de arriba falla, esto funciona siempre porque no depende de ningún servidor externo: exporta un archivo con todo tu progreso y pásalo al otro dispositivo por AirDrop, Mensajes o iCloud Drive (igual que haces con tus canciones), y ábrelo ahí para importarlo.
      </p>
      <div class="sync-share-row">
        <button class="btn-secondary" onClick=${handleExport}>⬇ Exportar a archivo</button>
        <button class="btn-secondary" onClick=${() => inputRef.current && inputRef.current.click()}>⬆ Importar desde archivo</button>
      </div>
      <input ref=${inputRef} type="file" accept="application/json,.json" style=${{ display: 'none' }} onChange=${handleImportFile} />
      ${status === 'importing' ? html`<p class="sync-msg">Leyendo archivo…</p>` : null}
      ${status === 'preview' && pendingImport ? html`
        <div class="import-preview-card" style=${{ marginTop: 10, padding: 12, borderRadius: 10, background: 'rgba(255,107,74,0.10)' }}>
          <p class="settings-label" style=${{ marginTop: 0 }}>⚠️ Vas a sustituir tu progreso actual</p>
          <p class="settings-hint" style=${{ margin: '4px 0' }}><strong>Ahora mismo:</strong> ${pendingImport.current.sessions} sesiones registradas · ${pendingImport.current.totalDone} sesiones completadas · última el ${pendingImport.current.lastDate} · fase ${pendingImport.current.phase}</p>
          <p class="settings-hint" style=${{ margin: '4px 0' }}><strong>Archivo a importar:</strong> ${pendingImport.incoming.sessions} sesiones registradas · ${pendingImport.incoming.totalDone} sesiones completadas · última el ${pendingImport.incoming.lastDate} · fase ${pendingImport.incoming.phase}</p>
          <p class="settings-hint" style=${{ margin: '8px 0 12px' }}>Esto <strong>no se puede deshacer</strong> desde este dispositivo. Si tu progreso actual es más reciente que el archivo, cancela y exporta antes una copia de seguridad.</p>

function LinkOrNewPrompt({ onLink, onFresh }) {

  function handleSubmit() {
    if (!code.trim()) return;

    onLink(code).catch((e) => { setStatus('error'); setErrorMsg(e && e.message ? e.message : 'No se pudo vincular.'); });
  }

  return html`

        <button class="btn-secondary" style=${{ marginTop: '14px' }} onClick=${() => setShowInput(false)}>Volver</button>
      `}
    </div>

}

function SyncBlock({ state, forceRender }) {
  const [code, setCode] = useState('');
  const [status, setStatus] = useState(null); // null | 'ok' | 'error'
  const [errorMsg, setErrorMsg] = useState('');
  const [copied, setCopied] = useState(false);
  const [myCode, setMyCode] = useState('');

  useEffect(() => {
    let cancelled = false;
    encodeQuickSync(state).then(c => { if (!cancelled) setMyCode(c); });
    return () => { cancelled = true; };
  }, [state.cycleWeek, state.totalSessionsDone, state.roundsPerDay, state.pace, state.dumbbellWeight, state.backpackWeight, state.equipment, state.exerciseLevels]);

  function syncUrl() {
    return `${window.location.origin}${window.location.pathname}?sync=${myCode}`;
  }

  async function handleLink() {
    if (!code.trim()) return;
    try {
      await applyQuickSync(code);
      setStatus('ok');
      setTimeout(() => window.location.reload(), 700);
    } catch (e) {
      setStatus('error');
      setErrorMsg(e && e.message ? e.message : 'No se pudo vincular.');
    }
  }

  function handleCopy() {
    navigator.clipboard?.writeText(myCode).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">📷 Sincronizar por código QR</p>
      <p class="settings-hint">Se genera al instante en este mismo dispositivo, sin conexión a ningún servidor — por eso nunca falla por falta de red ni por un servicio externo caído. Lleva tus niveles, semana del ciclo, pesos y configuración actuales; <strong>no incluye el historial detallado de sesiones pasadas</strong> (fechas, calorías, duración) — para eso usa el Plan B de más abajo.</p>
      ${myCode ? html`
        <div class="sync-qr-wrap">
          <img class="sync-qr-img" src=${`https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data=${encodeURIComponent(syncUrl())}`} alt="Código QR de sincronización" />
          <p class="settings-hint">En el otro dispositivo, escanéalo con la app Cámara (no hace falta esta app abierta ahí): abrirá el enlace y pedirá confirmar antes de vincular.</p>
        </div>
      ` : null}
      <p class="settings-hint" style=${{ marginTop: '14px' }}>Si no puedes escanear, pasa este código a mano al otro dispositivo:</p>
      <div class="sync-code-row">
        <span class="sync-code">${myCode || 'generando…'}</span>
        <button class="btn-secondary sync-copy-btn" onClick=${handleCopy} disabled=${!myCode}>${copied ? '✓ Copiado' : 'Copiar'}</button>
      </div>
      <p class="settings-hint" style=${{ marginTop: '14px' }}>¿Ya tienes progreso en otro dispositivo? Introduce aquí ese código para traerlo a este:</p>
      <div class="sync-link-row">
        <input class="sync-code-input" placeholder="Pega el código aquí" value=${code} onChange=${e => setCode(e.target.value)} />
        <button class="btn-secondary" onClick=${handleLink}>Vincular</button>
      </div>
      ${status === 'ok' ? html`<p class="sync-msg sync-ok">Progreso vinculado. Recargando…</p>` : null}
      ${status === 'error' ? html`<p class="sync-msg sync-err">${errorMsg}</p>` : null}
    </div>
  `;
}

function LocalMusicBlock() {
  const [, forceRender] = useState(0);
  const [fileNames, setFileNames] = useState([]);
  const [nowPlaying, setNowPlaying] = useState(null);
  const [playing, setPlaying] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    LocalMusicPlayer.onChange((name, idx, total) => { setNowPlaying(name); setPlaying(true); });
  }, []);

  function handleFiles(e) {
    const files = e.target.files;
    if (!files || !files.length) return;
    LocalMusicPlayer.setTracks(files);
    setFileNames(Array.from(files).map(f => f.name));
    localMusicOn = true;
    setNowPlaying(null);
    setPlaying(false);
    forceRender(x => x + 1);
  }

  function toggleEnabled() {
    localMusicOn = !localMusicOn;
    if (!localMusicOn) { LocalMusicPlayer.stop(); setPlaying(false); }
    forceRender(x => x + 1);
  }

  function togglePreview() {
    if (!LocalMusicPlayer.hasTracks()) return;
    if (LocalMusicPlayer.isRunning()) { LocalMusicPlayer.stop(); setPlaying(false); }
    else { LocalMusicPlayer.start(); setPlaying(true); }
  }

  return html`
    <div class="local-music">
      <input ref=${inputRef} type="file" multiple style=${{ display: 'none' }} onChange=${handleFiles} />
      <button class="btn-secondary" onClick=${() => inputRef.current && inputRef.current.click()}>
        ${fileNames.length ? `Cambiar selección (${fileNames.length} canciones)` : 'Elegir canciones de tu dispositivo'}
      </button>
      ${fileNames.length > 0 ? html`
        <div class="local-music-status">
          <div class="settings-toggle-row" style=${{ marginTop: 12 }}>
            <p class="settings-label" style=${{ marginBottom: 0, fontSize: '13px' }}>Usar estas canciones durante el entreno</p>
            <button class=${`switch ${localMusicOn ? 'on' : ''}`} onClick=${toggleEnabled}><span class="switch-knob" /></button>
          </div>
          <button class="local-music-preview" onClick=${togglePreview}>
            ${playing ? '⏸ Pausar previsualización' : '▶ Previsualizar'} ${nowPlaying ? `— ${nowPlaying}` : ''}
          </button>
          <p class="settings-hint" style=${{ marginTop: 6 }}>${fileNames.length} ${fileNames.length === 1 ? 'canción cargada' : 'canciones cargadas'}, orden aleatorio, se repiten en bucle.</p>
        </div>
      ` : null}
    </div>
  `;
}

// Lista completa de peso por ejercicio: responde directamente a "¿cuánto
// peso llevo en cada cosa?" sin tener que esperar a que salte el aviso de
// arriba — aquí se ve y se ajusta cualquier familia en cualquier momento,
// suba o no de nivel. Solo lista familias que de verdad usan mancuernas o
// mochila (los ejercicios de peso corporal no tienen nada que ajustar).
function ExerciseWeightsBlock({ state, forceRender }) {
  const families = useMemo(() => {
    const prefixes = [...new Set(EXERCISES.filter(e => e.equip === 'mancuernas' || e.equip === 'mochila').map(e => e.id.split('_')[0]))];
    return prefixes.map(prefix => {
      const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix).sort((a, b) => a.level - b.level);
      const rec = state.exerciseLevels[Object.keys(state.exerciseLevels).find(id => id.split('_')[0] === prefix)];
      const currentLevel = rec ? rec.level : family[0].level;
      const currentEx = family.find(e => e.level === currentLevel) || family[0];
      return { prefix, name: currentEx.name, equipType: currentEx.equip };
    }).sort((a, b) => a.name.localeCompare(b.name));
  }, [state.exerciseLevels]);

  function bump(prefix, equipType, delta) {
    const current = getExerciseWeight(state, prefix, equipType);
    const next = Math.max(1, Math.round((current + delta) * 2) / 2);
    setExerciseWeight(state, prefix, next);
    saveState(state); forceRender(x => x + 1);
  }

  return html`
    <div class="settings-block">
      <p class="settings-label">Peso por ejercicio</p>
      <p class="settings-hint" style=${{ marginTop: 0 }}>Cada ejercicio lleva su propio peso independiente — puedes tener la elevación lateral en 4kg y el Y-T-W en 2kg a la vez, sin que uno arrastre al otro.</p>
      <div class="ex-weight-list">
        ${families.map(f => html`
          <div key=${f.prefix} class="ex-weight-row">
            <span class="ex-weight-name">${f.name}</span>
            <div class="ex-weight-stepper">
              <button class="ex-weight-btn" onClick=${() => bump(f.prefix, f.equipType, -0.5)}>−</button>
              <span class="ex-weight-val">${getExerciseWeight(state, f.prefix, f.equipType)}kg</span>
              <button class="ex-weight-btn" onClick=${() => bump(f.prefix, f.equipType, 0.5)}>+</button>
            </div>
          </div>
        `)}
      </div>
    </div>
  `;
}

      <div class="tab-bar-inner">
        ${tabs.map(t => html`
          <button key=${t.key} class=${`tab-bar-btn ${screen === t.key ? 'active' : ''}`} onClick=${() => onNavigate(t.key)}>
            <span class="tbi">${t.icon}</span>
            <span>${t.label}</span>
          </button>
        `)}
      </div>
    </nav>
  `;
}

function App() {
  const [state, setState] = useState(() => loadState());
  const [needsLinkPrompt, setNeedsLinkPrompt] = useState(() => { try { return !localStorage.getItem(STORAGE_KEY); } catch (e) { return false; } });
  // Enlace de sincronización recibido de otro dispositivo (?sync=CODIGO),
  // p.ej. al escanear el código QR con la cámara nativa o tocar un enlace
  // compartido por AirDrop/Mensajes. Se limpia de la URL de inmediato para
  // no re-preguntar si se recarga la página.
  const [incomingSyncCode] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('sync');
      if (code) {
        const clean = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', clean);
      }
      return code;
    } catch (e) { return null; }
  });
  const [dismissedIncoming, setDismissedIncoming] = useState(false);
  const [screen, setScreen] = useState('home'); // home | weekplan | session | hypo | summary | progress | settings

  // BUG REAL encontrado y corregido (agosto 2026): la app no tiene su
  // propio contenedor con scroll — usa el scroll nativo de la página
  // (body/ventana). Al cambiar de pantalla (p.ej. Hábitos → Hoy tras
  // rellenar un campo cerca del final, donde la página queda desplazada
  // hacia abajo), esa posición de scroll NO se reseteaba — la siguiente
  // pantalla aparecía ya desplazada, cortando contenido de arriba
  // (la cabecera, las primeras tarjetas). Confirmado y reproducible:
  // cualquier cambio de pestaña partiendo de una pantalla más larga que
  // la de destino se veía mal encajado.
  // SEGUNDA VUELTA (el usuario confirmó que seguía pasando tras el primer
  // fix): el otro factor real es el teclado. Justo el caso que describe
  // ("tras registrar datos" en Hábitos) implica un campo de texto con foco
  // y teclado abierto — en iOS/Android el viewport visual se queda
  // encogido por el teclado, y aunque el input se desmonte al cambiar de
  // pantalla, el navegador no siempre recalcula el layout al instante.
  // Fix combinado: quitar el foco explícitamente (fuerza a cerrar el
  // teclado) y diferir el reset de scroll un frame, para que se aplique
  // ya con el viewport recalculado, no a mitad de la animación de cierre
  // del teclado.
  useEffect(() => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    requestAnimationFrame(() => window.scrollTo(0, 0));
  }, [screen]);

  // La música (generada o archivos propios) suena de fondo durante todo el
  // bloque de entrenamiento (circuito + hipopresivos), sin cortes entre
  // pantallas, y se para al llegar al resumen o volver a Inicio. Si hay
  // archivos propios activados, tienen prioridad y el ritmo generado no suena
  // (para no mezclar ambos, tal y como se explica en Configuración).
  useEffect(() => {
    const inWorkout = ['session', 'hypo', 'hypo-extend-prompt', 'hypo-extend'].includes(screen);
    if (!inWorkout) { Music.stop(); LocalMusicPlayer.stop(); return; }
    if (localMusicOn && LocalMusicPlayer.hasTracks()) { LocalMusicPlayer.start(); }
    else if (musicOn) { Music.start(state.cycleWeek, state.pace || 'normal'); }
  }, [screen]);
  const [activeSession, setActiveSession] = useState(null);
  const [activeRounds, setActiveRounds] = useState(2);
  const [lastResults, setLastResults] = useState([]);
  const [, forceRender] = useState(0);
  const todaySession = useMemo(() => generateSession(state), [state.cycleWeek, state.totalSessionsDone, state.painLog]);

  // Mantiene la pantalla encendida mientras la app está abierta, vía Screen
  // Wake Lock API. Funciona bien con el modo de bajo consumo desactivado;
  // con el modo de bajo consumo activo, iOS puede rechazar o liberar el
  // wake lock en cualquier momento por ahorro de energía (comportamiento
  // documentado de la propia API) — en ese caso no hay forma de evitarlo
  // desde la web, así que la gestión del modo de bajo consumo se deja en
  // manos del usuario (desactivarlo antes de entrenar).
  useEffect(() => {
    if (!('wakeLock' in navigator)) return;
    let sentinel = null;
    let cancelled = false;
    const requestLock = async () => {
      try {
        const lock = await navigator.wakeLock.request('screen');
        if (cancelled) { lock.release().catch(() => {}); return; }
        sentinel = lock;
        sentinel.addEventListener('release', () => { sentinel = null; });
      } catch (e) {
        // Rechazada (a menudo por el modo de bajo consumo) o no soportada
        // en este contexto — sin más consecuencia que la pantalla podrá
        // apagarse como antes.
      }
    };
    requestLock();
    const handleVisibility = () => { if (document.visibilityState === 'visible' && !sentinel) requestLock(); };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      cancelled = true;
      document.removeEventListener('visibilitychange', handleVisibility);
      if (sentinel) sentinel.release().catch(() => {});
    };
  }, []);

  // Solo se crea un código de sincronización nuevo en cuanto el aviso de
  // "primera vez / vincular dispositivo" queda resuelto — así un móvil
  // nuevo nunca empieza a acumular progreso propio antes de dar al usuario
  // la opción de traer el que ya tenía en otro dispositivo.

  function handleStart() {
    Sound.unlock();
    if (VoiceCoach.supported) { try { window.speechSynthesis.resume(); } catch (e) {} }
    setActiveSession(generateSession(state));
    setActiveRounds(state.roundsPerDay || 2);
    setScreen('warmup');
  }
  function handleWarmupDone() { VoiceCoach.sessionStart(); setScreen('session'); }
  function handleSetRounds(n) { state.roundsPerDay = n; saveState(state); forceRender(x => x + 1); }
  function handleReviewWeightsNow() { state.weightReviewDue = false; state.lastWeightReviewDate = new Date().toISOString().slice(0, 10); state.weightReviewSnoozeUntil = null; saveState(state); forceRender(x => x + 1); setScreen('settings'); }
  function handleSnoozeWeights() { const d = new Date(); d.setDate(d.getDate() + 3); state.weightReviewSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  function handleReviewPhotosNow() { state.photoReviewDue = false; state.lastPhotoReviewDate = new Date().toISOString().slice(0, 10); state.photoReviewSnoozeUntil = null; saveState(state); forceRender(x => x + 1); setScreen('photos'); }
  function handleSnoozePhotos() { const d = new Date(); d.setDate(d.getDate() + 5); state.photoReviewSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  function handleBackupNow() {
    exportBackupFile();
    state.lastBackupDate = new Date().toISOString().slice(0, 10);
    state.backupDue = false;
    state.backupSnoozeUntil = null;
    saveState(state);
    forceRender(x => x + 1);
  }
  function handleSnoozeBackup() { const d = new Date(); d.setDate(d.getDate() + 5); state.backupSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  const hypoSecondsRef = useRef(0);
  function handleCircuitFinish(results) { setLastResults(results); hypoSecondsRef.current = 0; setScreen('circuit-rest'); }
  function handleHypoDone(hypoSec) { hypoSecondsRef.current = hypoSec || 0; setState({ ...state }); setScreen('hypo-extend-prompt'); }
  function handleExtendYes() { setScreen('hypo-extend'); }
  function handleExtendNo() { finalizeSessionStats(state, hypoSecondsRef.current); setState({ ...state }); setScreen('summary'); }
  function handleExtendDone(extraSec) { finalizeSessionStats(state, hypoSecondsRef.current + (extraSec || 0)); setState({ ...state }); setScreen('summary'); }
  function handleStartMorningHypo() { setScreen('hypo-solo'); }
  function handleMorningHypoDone(sec) { logStandaloneHypo(state, sec); forceRender(x => x + 1); setScreen('home'); }
  function handleStartBar() { setScreen('bar-solo'); }
  function handleBarDone(sec) { logBarDecompression(state, sec); forceRender(x => x + 1); setScreen('home'); }
  function handleStartPostureCheckin() { setScreen('posture-checkin'); }
  function handleSnoozePostureCheckin() { const d = new Date(); d.setDate(d.getDate() + 2); state.postureCheckinSnoozeUntil = d.toISOString().slice(0, 10); saveState(state); forceRender(x => x + 1); }
  // Nueva referencia de objeto a propósito (no mutación in-place): el
  // useMemo de todaySession depende de state.painLog por identidad de
  // objeto — mutar painLog[key] sin reasignar el objeto no dispararía el
  // recálculo y el circuito de hoy no reflejaría el cambio hasta la
  // siguiente navegación.
  function handleSetTodayPain(area) {
    const todayKey = localDateKey();
    const next = { ...(state.painLog || {}) };
    if (area) next[todayKey] = area; else delete next[todayKey];
    state.painLog = next;
    saveState(state);
    forceRender(x => x + 1);
  }
  function handleSaveReadiness(vals) {
    const key = localDateKey();
    const current = state.readinessLog || {};
    const nextReadiness = { ...current };
    if (vals == null) delete nextReadiness[key];
    else nextReadiness[key] = { ...vals, updatedAt: new Date().toISOString() };
    const nextState = { ...state, readinessLog: nextReadiness };
    const ok = saveState(nextState);
    if (!ok) { alert('No se ha podido guardar la preparación de hoy en este dispositivo. Comprueba el almacenamiento del navegador.'); return; }
    setState(nextState);
    forceRender(x => x + 1);
  }
  function handleReset() {
    if (!confirm('Esto borrará todo tu progreso. ¿Continuar?')) return;
    localStorage.removeItem(STORAGE_KEY);
    setState(loadState());
    setScreen('home');
  }
  function handleToggleSounds() { soundsOn = !soundsOn; forceRender(x => x + 1); }
  function handleToggleVoice() { voiceOn = !voiceOn; if (!voiceOn && VoiceCoach.supported) window.speechSynthesis.cancel(); forceRender(x => x + 1); }
  function handleToggleMusic() { musicOn = !musicOn; if (musicOn) Music.start(state.cycleWeek, state.pace || 'normal'); else Music.stop(); forceRender(x => x + 1); }

  function handleLinkExisting(code) {
    return applyQuickSync(code).then(() => { window.location.reload(); });
  }
  function handleStartFresh() { setNeedsLinkPrompt(false); }

  if (incomingSyncCode && !dismissedIncoming) {
    return html`<div class="app-shell"><${IncomingSyncPrompt} code=${incomingSyncCode} onConfirm=${handleLinkExisting} onDismiss=${() => setDismissedIncoming(true)} /></div>`;
  }

  if (needsLinkPrompt) {
    return html`<div class="app-shell"><${LinkOrNewPrompt} onLink=${handleLinkExisting} onFresh=${handleStartFresh} /></div>`;
  }

  return html`
    <div class=${`app-shell ${HUB_SCREENS.includes(screen) ? 'has-tabbar' : ''}`}>
      ${lastSaveError ? html`
        <div class="save-error-banner">
          ⚠️ No se ha podido guardar tu progreso ahora mismo (${lastSaveError.message}). Sigue usando la app con normalidad, pero exporta una copia en cuanto puedas (Ajustes → Exportar) para no arriesgar nada.
        </div>
      ` : null}
      ${screen === 'home' ? html`<${Home} state=${state} onStart=${handleStart} onOpenProgress=${() => setScreen('progress')} onOpenSettings=${() => setScreen('settings')} onOpenWeekPlan=${() => setScreen('weekplan')} onOpenNutrition=${() => setScreen('nutrition')} onOpenHabitos=${() => setScreen('habitos')} todaySession=${todaySession} onSetRounds=${handleSetRounds} onReviewWeightsNow=${handleReviewWeightsNow} onSnoozeWeights=${handleSnoozeWeights} onStartMorningHypo=${handleStartMorningHypo} onStartBar=${handleStartBar} onReviewPhotosNow=${handleReviewPhotosNow} onSnoozePhotos=${handleSnoozePhotos} onBackupNow=${handleBackupNow} onSnoozeBackup=${handleSnoozeBackup} onStartPostureCheckin=${handleStartPostureCheckin} onSnoozePostureCheckin=${handleSnoozePostureCheckin} onSetTodayPain=${handleSetTodayPain} onSaveReadiness=${handleSaveReadiness} />` : null}
      ${screen === 'habitos' ? html`<${Habitos} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} />` : null}
      ${screen === 'weekplan' ? html`<${WeeklyPlan} state=${state} onBack=${() => setScreen('home')} />` : null}
      ${screen === 'nutrition' ? html`<${Nutrition} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} onOpenHabitos=${() => setScreen('habitos')} />` : null}
      ${screen === 'warmup' && activeSession ? html`<${WarmupScreen} session=${activeSession} onDone=${handleWarmupDone} />` : null}
      ${screen === 'session' && activeSession ? html`<${TrainingSession} session=${activeSession} state=${state} rounds=${activeRounds} onFinishCircuit=${handleCircuitFinish} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'circuit-rest' ? html`<${CircuitRestScreen} session=${activeSession} onDone=${() => setScreen('hypo')} />` : null}
      ${screen === 'hypo' ? html`<${HypopressiveBlock} onDone=${handleHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'hypo-solo' ? html`<${HypopressiveBlock} steps=${buildHypopressiveMorning(!!(state.equipment && state.equipment.banda))} title="Rutina matutina: postura + hipopresivos" onDone=${handleMorningHypoDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'bar-solo' ? html`<${HypopressiveBlock} steps=${BAR_DECOMPRESSION_STEPS} title="Descompresión en barra" onDone=${handleBarDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'posture-checkin' ? html`<${PostureCheckinScreen} state=${state} onDone=${() => { forceRender(x => x + 1); setScreen('home'); }} />` : null}
      ${screen === 'hypo-extend-prompt' ? html`<${ExtendHypoPrompt} onYes=${handleExtendYes} onNo=${handleExtendNo} />` : null}
      ${screen === 'hypo-extend' ? html`<${HypopressiveBlock} steps=${HYPOPRESSIVE_EXTRA} title="Extra · 2 min de abdomen" onDone=${handleExtendDone} onExit=${() => setScreen('home')} />` : null}
      ${screen === 'summary' ? html`<${SessionSummary} results=${lastResults} rounds=${activeRounds} onDone=${() => setScreen('home')} onRateSession=${(rating) => { rateLastSession(state, rating); forceRender(x => x + 1); }} />` : null}
      ${screen === 'progress' ? html`<${Progress} state=${state} onBack=${() => setScreen('home')} onOpenPhotos=${() => setScreen('photos')} />` : null}
      ${screen === 'settings' ? html`<${Settings} state=${state} onBack=${() => setScreen('home')} onReset=${handleReset} soundsEnabled=${soundsOn} onToggleSounds=${handleToggleSounds} voiceEnabled=${voiceOn} onToggleVoice=${handleToggleVoice} musicEnabled=${musicOn} onToggleMusic=${handleToggleMusic} />` : null}
      ${screen === 'photos' ? html`<${ProgressPhotos} state=${state} onBack=${() => setScreen('home')} forceRender=${forceRender} onOpenCamera=${() => setScreen('camera')} />` : null}
      ${screen === 'camera' ? html`<${CameraCaptureScreen} onBack=${() => setScreen('photos')} onCaptured=${dataUrl => { savePhotoForToday(state, dataUrl); forceRender(x => x + 1); setScreen('photos'); }} />` : null}
      ${HUB_SCREENS.includes(screen) ? html`<${TabBar} screen=${screen} onNavigate=${setScreen} />` : null}
    </div>
  `;
}

// =====================================================================
// PWA: manifest + icono generados dinámicamente
// =====================================================================
(function setupPWA() {
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="40" fill="#12141A"/><text x="100" y="130" font-family="Arial Black, sans-serif" font-weight="900" font-size="110" fill="#C8FF3D" text-anchor="middle">F</text></svg>`;
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);
  document.getElementById('favicon').href = iconUrl;
  document.getElementById('apple-touch-icon').href = iconUrl;
  const manifest = {
    name: 'Forma 55 — Circuito diario',
    short_name: 'Forma 55',
    start_url: './',
    display: 'standalone',
    background_color: '#12141A',
    theme_color: '#12141A',
    icons: [{ src: iconUrl, sizes: '200x200', type: 'image/svg+xml' }],
  };
  document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

const root = createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
