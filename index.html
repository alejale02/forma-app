<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Forma 55 — Circuito diario</title>
<meta name="theme-color" content="#12141A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forma 55" />
<link id="manifest-link" rel="manifest" href="data:application/manifest+json,">
<link rel="apple-touch-icon" id="apple-touch-icon">
<link rel="icon" id="favicon">
<style>
:root{
  --bg:#12141A; --bg-elev:#1B1E27; --bg-elev2:#242835;
  --accent:#C8FF3D; --accent-dim:#8FBF2B;
  --text:#F4F6F8; --text-dim:#AEB4C0; --text-faint:#868C99;
  --danger:#FF6B4A; --up:#7DD8FF;
  --radius:20px; --radius-sm:12px;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;}
h1,h2{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); padding-top:calc(24px + env(safe-area-inset-top)); animation:fadein .25s ease;}
/* Deja hueco al fondo en las 4 pantallas "hub" para que el tab bar fijo no
   tape el último contenido — se activa con la clase has-tabbar en app-shell
   en vez de tocar cada pantalla individualmente. */
.app-shell.has-tabbar > .screen{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
.tab-bar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; background:var(--bg-elev); border-top:1px solid var(--bg-elev2);}
.tab-bar-inner{display:flex; width:100%; max-width:520px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); gap:6px;}
.tab-bar-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; border-radius:14px; background:none; color:var(--text-faint); font-size:10.5px; font-weight:700; transition:background .15s ease, color .15s ease;}
.tab-bar-btn .tbi{font-size:20px; line-height:1; filter:grayscale(1) opacity(0.75);}
.tab-bar-btn.active{background:var(--accent); color:#0C0D10;}
.tab-bar-btn.active .tbi{filter:none;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes breathe{0%,100%{transform:scale(0.72);} 50%{transform:scale(1.18);}}
.breathe-circle{width:130px; height:130px; border-radius:50%; background:var(--accent); opacity:0.16; animation:breathe 8s ease-in-out infinite; margin:18px auto;}
.breathe-label{text-align:center; font-family:var(--font-display); font-size:20px; color:var(--accent); margin-top:-92px; margin-bottom:70px;}
.circuit-rest-note{color:var(--text-dim); font-size:12.5px; text-align:center; margin-top:4px;}
.warmup-step-name{font-family:var(--font-display); font-size:19px; text-align:center; margin:6px 0 8px;}
.camera-preview-wrap{position:relative; width:100%; aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:#000; margin-top:10px;}
.camera-preview-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
.camera-preview-wrap video.mirrored{transform:scaleX(-1);}
.camera-flash{position:absolute; inset:0; background:#fff; animation:cameraFlash 0.25s ease;}
@keyframes cameraFlash{from{opacity:0.9;} to{opacity:0;}}
.camera-countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:72px; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,0.6); background:rgba(0,0,0,0.15);}
.camera-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
.camera-actions .btn-primary{grid-column:1/-1;}

/* ---- MÓVIL EN HORIZONTAL — pantallas de sesión activa (poco alto, ancho de sobra) ---- */
@media (orientation: landscape) and (max-height: 560px) {
  .screen.work, .screen.prep, .screen.rest, .screen.roundrest, .screen.hypo, .screen.warmup-screen, .screen.circuit-rest {
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center;
    align-content: center; gap: 2px 22px; padding: 10px 26px; overflow-y: auto;
  }
  .screen.warmup-screen .eyebrow, .screen.warmup-screen h2, .screen.circuit-rest .eyebrow, .screen.circuit-rest h2 {
    width: 100%; text-align: center; margin: 1px 0;
  }
  .screen.warmup-screen .timer-big, .screen.circuit-rest .timer-big { order: 1; }
  .screen.warmup-screen .warmup-step-name, .screen.circuit-rest .rest-timer + .breathe-circle { order: 2; }
  .screen.circuit-rest .breathe-circle{ width: 70px !important; height: 70px !important; margin: 4px auto; }
  .screen.circuit-rest .breathe-label{ margin-top: -46px !important; margin-bottom: 30px !important; font-size: 15px; }
  .screen.work h2, .screen.prep h2, .screen.rest .rest-next, .screen.roundrest .roundrest-badge,
  .screen.work .eyebrow, .screen.prep .eyebrow, .screen.rest .eyebrow, .screen.work .round-badge, .screen.prep .round-badge,
  .screen.work .circuit-progress, .screen.hypo .eyebrow {
    width: 100%; text-align: center; margin: 1px 0;
  }
  /* Orden visual (no cambia el HTML): lo crítico para seguir el ejercicio
     sin tocar la pantalla —repeticiones y tiempo restante— se agrupa
     primero, bien arriba, para que quepa siempre sin hacer scroll. La
     foto y el texto de ejecución (son consulta puntual, no algo que se
     necesite mirar en cada repetición) bajan de prioridad visual. */
  .screen.work .round-badge{ order: 1; }
  .screen.work .eyebrow{ order: 2; }
  .screen.work .circuit-progress{ order: 3; }
  .screen.work h2{ order: 4; font-size: 17px; margin: 0; }
  .screen.work .target-reps-badge{ order: 5; }
  .screen.work .timer-big{ order: 6; }
  .screen.work .target-chips{ order: 7; }
  .screen.work .btn-secondary{ order: 8; }
  .screen.work .work-photo-tap{ order: 9; }
  .screen.work .exercise-cue{ order: 10; }
  .screen.work .today-card-taphint{ order: 9; }

  .screen.work .figure-wrap, .screen.prep .figure-wrap, .screen.work .photo-wrap, .screen.prep .photo-wrap, .screen.warmup-screen .photo-wrap { width: 88px !important; height: 88px !important; margin: 2px 0; }
  .screen.hypo .ring-center .figure-wrap, .screen.hypo .ring-center .photo-wrap { width: 78px !important; height: 78px !important; }
  .timer-big{ font-size: 34px; margin: 2px 0; }
  .prep-count{ font-size: 46px; margin: 2px 0; }
  .target-reps-badge{ padding: 8px 20px; margin: 2px 0; }
  .target-reps-num{ font-size: 32px; }
  .exercise-cue{ max-width: 240px; font-size: 12px; padding: 8px 10px; margin: 2px 0; }
  .auto-note, .level-hint, .cue-text{ display: none; }
  .btn-secondary{ padding: 10px 16px; font-size: 13px; }
  .session-controls{ position: fixed; }
}

.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:6px;}

/* ---- HOME ---- */
.home-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
.home-header h1{font-size:30px;}
.icon-btn{background:var(--bg-elev); color:var(--text); width:44px; height:44px; border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.weight-reminder{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.steps-nudge{cursor:pointer;}
.weight-reminder.photo-reminder{background:linear-gradient(135deg, rgba(125,216,255,0.14), var(--bg-elev)); border-color:rgba(125,216,255,0.35);}
.weight-reminder.backup-reminder{background:linear-gradient(135deg, rgba(255,140,60,0.16), var(--bg-elev)); border-color:rgba(255,140,60,0.4);}
.save-error-banner{background:rgba(255,107,74,0.16); border:1px solid rgba(255,107,74,0.45); border-radius:12px; padding:10px 14px; margin:0 20px 12px; margin-top:calc(10px + env(safe-area-inset-top)); font-size:12px; color:var(--text); line-height:1.4;}
.photo-compare{margin-bottom:18px;}
.photo-compare-picker{display:flex; align-items:center; gap:8px; margin:8px 0 12px;}
.photo-compare-picker select{flex:1; min-width:0; background:var(--bg-elev); color:var(--text); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 6px; font-size:13px;}
.photo-compare-picker span{color:var(--text-dim); font-size:12px;}
.photo-compare-row{display:flex; gap:10px; margin-top:8px;}
.photo-compare-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
.photo-compare-col img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--bg-elev2);}
.photo-compare-col span{font-size:11px; color:var(--text-dim);}
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
.photo-grid-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none;}
.photo-grid-item img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--bg-elev2);}
.photo-grid-item span{font-size:9.5px; color:var(--text-faint);}
.photo-viewer{position:fixed; inset:0; z-index:50; background:rgba(6,7,10,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;}
.photo-viewer img{max-width:100%; max-height:70vh; border-radius:14px; object-fit:contain;}
.photo-viewer p{color:var(--text-dim); font-size:13px; text-transform:capitalize;}
.weight-reminder-title{font-weight:800; font-size:14.5px; margin-bottom:6px;}
.weight-reminder-text{font-size:13px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}
.weight-reminder-actions{display:flex; gap:8px; flex-wrap:wrap;}
.weight-reminder-actions .btn-primary{flex:1 1 auto; min-width:150px;}
.weight-reminder-actions .btn-secondary{flex:1 1 auto; min-width:130px;}
.phase-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; margin-bottom:16px; border-left:4px solid var(--phase-color);}
.phase-name{font-family:var(--font-display); font-size:24px; color:var(--phase-color); margin-bottom:6px;}
.phase-desc{color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:16px;}
.phase-progress{display:flex; gap:5px; margin-bottom:8px;}
.dot{width:100%; height:6px; border-radius:3px; background:var(--bg-elev2);}
.dot.filled{background:var(--phase-color);}
.phase-progress-label{font-size:12px; color:var(--text-faint);}

.cycle-track{display:flex; gap:8px; margin-bottom:20px;}
.cycle-step{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--bg-elev); opacity:0.45;}
.cycle-step.active{opacity:1; background:var(--bg-elev2); outline:1.5px solid var(--accent);}
.cycle-step.done{opacity:0.7;}
.cycle-num{display:block; font-family:var(--font-display); font-size:16px;}
.cycle-label{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.btn-primary{background:var(--accent); color:#0C0D10; font-weight:800; border-radius:var(--radius-sm); padding:16px; font-size:16px;}
.btn-primary:disabled{opacity:0.35;}
.btn-huge{width:100%; padding:20px; font-size:17px; border-radius:16px; margin:8px 0;}
.btn-secondary{background:var(--bg-elev2); color:var(--text); border-radius:var(--radius-sm); padding:16px; font-size:15px; font-weight:600;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); border-radius:var(--radius-sm); padding:14px 20px; font-weight:700; width:100%;}

.stat-row{display:flex; gap:10px; margin:16px 0;}
.stat-box{flex:1; background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; text-align:center;}
.stat-num{font-family:var(--font-display); font-size:26px; color:var(--accent);}
.stat-label{font-size:12px; color:var(--text-dim); margin-top:2px;}

.link-btn{background:none; color:var(--text-dim); text-align:center; padding:10px; font-size:14px; text-decoration:underline; text-underline-offset:3px;}
.quick-links-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0 8px;}
.quick-link-tile{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--bg-elev); border-radius:14px; padding:12px 4px; color:var(--text-dim); font-size:10.5px; font-weight:700; text-align:center;}
.qlt-icon{font-size:20px;}

/* ---- ROUND SELECTOR ---- */
.rounds-block{background:var(--bg-elev); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
.rounds-label{font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
.rounds-picker{display:flex; gap:8px;}
.voice-rate-picker{display:flex; gap:8px; margin-top:8px;}
.round-btn{flex:1; padding:12px; border-radius:12px; background:var(--bg-elev2); color:var(--text); font-weight:800; text-align:center;}
.round-btn .rn{display:block; font-family:var(--font-display); font-size:20px;}
.round-btn .rl{display:block; font-size:9px; color:var(--text-dim); text-transform:uppercase; margin-top:2px;}
.round-btn.active{background:var(--accent); }
.round-btn.active .rn,.round-btn.active .rl{color:#0C0D10;}
.rounds-hint{font-size:13px; color:var(--text-faint); margin-top:10px; line-height:1.4;}
.time-estimate{font-size:13px; color:var(--text); background:var(--bg-elev2); border-radius:10px; padding:10px 12px; margin-top:10px;}
.time-estimate strong{color:var(--accent);}

/* ---- TODAY PREVIEW / REST DAY ---- */
.today-preview{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:6px;}
.today-title{font-weight:800; font-size:15px; margin-bottom:12px;}
.today-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.today-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--bg-elev2); gap:10px;}
.today-row:last-child{border-bottom:none;}
.today-ex-name{font-size:14px; flex:1;}
.today-ex-detail{font-size:12.5px; color:var(--accent); font-weight:700; white-space:nowrap;}
.rest-day-card{background:var(--bg-elev); border-radius:var(--radius); padding:22px; text-align:center;}
.morning-hypo-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
.morning-hypo-title{font-weight:800; font-size:15px; margin-bottom:6px;}
.morning-hypo-card .btn-secondary{margin-top:10px; width:100%;}
.rest-day-title{font-family:var(--font-display); font-size:20px; margin-bottom:10px; color:var(--up);}

/* ---- WEEKLY PLAN ---- */
.weekplan-intro{text-align:left; max-width:none; margin-bottom:18px;}
.weekplan-day{background:var(--bg-elev); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}

/* ---- NUTRICIÓN ---- */
.nutrition-intro{text-align:left; max-width:none; margin-bottom:18px;}
.nutrition-targets-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.nutrition-targets-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.nt-box{background:var(--bg-elev2); border-radius:10px; padding:10px 4px; text-align:center;}
.nt-num{display:block; font-family:var(--font-display); font-size:17px; color:var(--accent);}
.nt-label{display:block; font-size:10px; color:var(--text-dim); margin-top:2px;}
.creatine-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:14px; border:1px solid rgba(200,255,61,0.25);}
.nutrition-phase-card{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:20px; border-left:4px solid var(--phase-color);}
.nutrition-day{background:var(--bg-elev); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}
.nutrition-day.is-today{outline:1.5px solid var(--accent);}
.nutrition-beer{font-size:11px; color:var(--text-dim); background:var(--bg-elev2); padding:3px 9px; border-radius:20px;}
.nutrition-meal-row{display:flex; gap:10px; padding:6px 0; border-top:1px solid var(--bg-elev2); font-size:13px;}
.nutrition-meal-row:first-of-type{border-top:none;}
.nutrition-item-kcal{color:var(--text-faint); font-size:11.5px; white-space:nowrap;}
.nutrition-meal-label{flex-shrink:0; width:92px; color:var(--text-dim); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; padding-top:1px;}
.nutrition-day-kcal{font-size:11.5px; color:var(--text-faint); margin-top:8px; text-align:right;}
.weekplan-day.is-today{outline:1.5px solid var(--accent);}
.weekplan-day-header{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.weekplan-day-name{font-family:var(--font-display); font-size:15px;}
.weekplan-day-focus{font-size:12px; color:var(--text-dim);}
.weekplan-today-badge{margin-left:auto; background:var(--accent); color:#0C0D10; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.weekplan-ex-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--bg-elev2); font-size:13px;}
.weekplan-ex-row:first-of-type{border-top:none;}
.weekplan-ex-name{flex:1;}
.weekplan-ex-detail{color:var(--text-dim); white-space:nowrap; font-weight:600;}
.rest-summary{opacity:0.6;}

/* ---- WORK / REST / LOGGING / HYPO shared ---- */
.hypo,.work,.rest,.logging,.roundrest{align-items:center; text-align:center; justify-content:center;}
.mobility-ring{position:relative; width:186px; height:216px; margin:16px 0;}
.ring-svg{width:100%; height:100%; transform:rotate(-90deg); position:absolute; inset:0;}
.ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:5;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:339.3; transition:stroke-dashoffset 1s linear;}
.ring-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--accent);}

h2{font-size:23px; margin:8px 0;}
.cue-text{color:var(--text-dim); font-size:15px; line-height:1.5; max-width:340px; margin:0 auto 12px;}
.timer-big{font-family:var(--font-display); font-size:52px; margin:12px 0; letter-spacing:-0.02em;}
.prep-count{font-family:var(--font-display); font-size:88px; color:var(--accent); margin:10px 0; line-height:1;}
.target-reps-badge{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg-elev2); border:2px solid var(--accent); border-radius:18px; padding:14px 28px; margin:6px 0 14px;}
.target-reps-num{font-family:var(--font-display); font-size:56px; color:var(--accent); line-height:1;}
.target-reps-unit{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
.rest-next-reps{color:var(--accent); font-weight:700;}
.rest-timer{color:var(--up);}
.rest-next{color:var(--text); font-size:15px; font-weight:700; margin-bottom:2px;}
.rest-next-detail{color:var(--accent); font-size:13px; font-weight:700; margin-bottom:24px;}
.roundrest .timer-big{color:var(--danger);}
.roundrest-badge{background:rgba(255,107,74,0.15); color:var(--danger); font-size:12px; font-weight:800; padding:6px 14px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em;}
.extend-prompt h2{margin:10px 0 12px;}
.link-prompt{justify-content:center; text-align:center;}
.link-prompt-title{font-size:22px; margin-bottom:12px;}
.link-prompt .btn-huge, .link-prompt .btn-secondary{width:100%; margin-bottom:10px;}
.extend-prompt .btn-huge{margin-bottom:10px;}

.mobility-controls{display:flex; gap:10px; width:100%; margin-top:16px;}
.mobility-controls .btn-secondary,.mobility-controls .btn-primary{flex:1; margin:0;}
.mobility-dots{display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
.mdot{width:8px; height:8px; border-radius:50%; background:var(--bg-elev2);}
.mdot.active{background:var(--accent); width:22px; border-radius:4px;}
.mdot.done{background:var(--accent-dim);}

.figure-wrap{position:relative; width:180px; height:210px; margin:8px 0; display:flex; align-items:center; justify-content:center;}
.figure-wrap svg{width:100%; height:100%;}
.photo-wrap{position:relative; margin:8px auto; border-radius:16px; overflow:hidden; background:#000;}
.photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-credit{position:absolute; bottom:2px; right:6px; font-size:8px; color:rgba(255,255,255,0.55); background:rgba(0,0,0,0.4); padding:1px 5px; border-radius:6px;}

/* ---- STORYBOARD "Ejercicios de hoy" ---- */
.today-cards-title{font-weight:800; font-size:15px; margin:22px 0 12px;}
.today-card{background:var(--bg-elev); border-radius:var(--radius); padding:14px; margin-bottom:14px; display:flex; gap:12px;}
.today-card-num{font-family:var(--font-display); font-size:22px; color:var(--accent); width:26px; flex-shrink:0;}
.today-card-body{flex:1; min-width:0;}
.today-card-name{font-weight:800; font-size:15px; margin-bottom:4px;}
.today-card-meta{font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:2px;}
.today-card-group{font-size:12.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;}
.today-card-frames{display:flex; align-items:center; gap:2px;}
.today-card-tap{display:block; width:100%; background:none; padding:0; text-align:left;}
.today-card-taphint{display:block; text-align:center; font-size:11px; color:var(--accent); font-weight:700; margin-top:6px;}
.work-photo-tap{display:flex; flex-direction:column; align-items:center; background:none; padding:0; width:100%;}
.today-frame{flex:1; min-width:0; background:radial-gradient(circle at 50% 38%, var(--bg-elev2) 0%, var(--bg) 100%); border-radius:12px; padding:6px 2px 8px; text-align:center;}
.today-frame .figure-wrap{width:100% !important; height:104px !important; margin:0 auto;}
.today-frame-cap{font-size:10px; color:var(--text-dim); margin-top:2px; line-height:1.25; font-weight:600;}
.today-frame-arrow{color:var(--text-faint); font-size:15px; flex-shrink:0; width:12px;}
.today-card-body .photo-wrap{width:100% !important; height:160px !important; margin:2px 0 0;}

/* ---- AUTO-CONFIRM de repeticiones (sin toques obligatorios) ---- */
.confirm-ring{position:relative; width:76px; height:76px; margin:6px auto 18px;}
.confirm-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.confirm-ring-bg{fill:none; stroke:var(--bg-elev2); stroke-width:6;}
.confirm-ring-fg{fill:none; stroke:var(--up); stroke-width:6; stroke-linecap:round; stroke-dasharray:219.9; transition:stroke-dashoffset 1s linear;}
.confirm-ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; color:var(--up);}
.confirm-reps-row{display:flex; align-items:center; gap:18px; margin:10px 0 6px;}
.confirm-adj-btn{width:56px; height:56px; border-radius:50%; background:var(--bg-elev2); color:var(--text); font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.confirm-reps-num{font-family:var(--font-display); font-size:56px; color:var(--accent); min-width:90px; text-align:center;}
.confirm-hint{font-size:13px; color:var(--text-faint); margin-bottom:8px;}
.auto-note{font-size:13px; color:var(--text-faint); margin-top:14px;}
.session-controls{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:5; display:flex; justify-content:space-between;}
.pause-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text-dim); font-size:15px; display:flex; align-items:center; justify-content:center;}
.pause-btn.active{background:var(--accent); color:#0C0D10;}
.end-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--danger); font-size:15px; display:flex; align-items:center; justify-content:center;}

/* ---- Selector de ritmo (Settings) ---- */
.pace-picker{display:flex; gap:8px; flex-wrap:wrap;}
.pace-picker .pace-btn{flex:1 1 auto; min-width:56px;}
.pace-btn{flex:1; padding:12px 6px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700; font-size:13px; text-align:center;}
.pace-btn.active{background:var(--accent); color:#0C0D10;}
.sync-share-row{display:flex; gap:8px; margin:10px 0;}
.sync-share-row .btn-primary,.sync-share-row .btn-secondary{flex:1; padding:12px; font-size:13px;}
.sync-qr-wrap{text-align:center; background:var(--bg-elev2); border-radius:12px; padding:14px; margin-bottom:10px;}
.sync-qr-img{width:180px; height:180px; border-radius:8px; background:#fff; padding:8px; margin-bottom:8px;}
.sync-code-row{display:flex; align-items:center; gap:8px; background:var(--bg-elev2); border-radius:10px; padding:10px 12px;}
.sync-code{flex:1; font-family:var(--font-mono, monospace); font-size:12px; color:var(--accent); word-break:break-all;}
.sync-copy-btn{flex-shrink:0; padding:8px 12px; font-size:12.5px;}
.sync-link-row{display:flex; gap:8px; margin-top:6px;}
.sync-code-input{flex:1; background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13px;}
.sync-msg{font-size:12.5px; margin-top:8px;}
.sync-ok{color:var(--up);}
.sync-err{color:var(--danger);}
.circuit-progress{display:flex; gap:6px; margin:2px 0 4px; justify-content:center;}
.circuit-dot{width:26px; height:5px; border-radius:3px; background:var(--bg-elev2);}
.circuit-dot.done{background:var(--accent);}
.circuit-dot.current{background:var(--up);}
.round-badge{display:inline-block; background:var(--bg-elev2); color:var(--text-dim); font-size:11px; font-weight:800; padding:5px 12px; border-radius:20px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.03em;}
.target-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0 8px;}
.chip{background:var(--bg-elev); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; color:var(--text-dim);}
.chip-emphasis{background:var(--accent); color:#0C0D10; font-weight:800;}
.exercise-cue{color:var(--text-dim); font-size:14.5px; line-height:1.5; max-width:320px; margin:4px auto 8px; background:var(--bg-elev); padding:12px 14px; border-radius:var(--radius-sm);}
.level-hint{color:var(--text-faint); font-size:13px; margin-top:12px;}

.reps-input{width:140px; font-family:var(--font-display); font-size:48px; text-align:center; background:var(--bg-elev); color:var(--accent); border:2px solid var(--bg-elev2); border-radius:var(--radius-sm); padding:12px; margin:12px 0 4px;}
.reps-input:focus{outline:none; border-color:var(--accent);}
.target-hint{color:var(--text-faint); font-size:14px; margin-bottom:20px;}
.rpe-label{font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:600;}
.rpe-scale{display:flex; gap:6px; margin-bottom:6px;}
.rpe-btn{width:38px; height:38px; border-radius:10px; background:var(--bg-elev); color:var(--text); font-weight:700; font-size:14px;}
.rpe-btn.active{background:var(--accent); color:#0C0D10;}
.rpe-legend{display:flex; justify-content:space-between; width:100%; max-width:290px; font-size:11.5px; color:var(--text-faint); margin-bottom:20px; text-transform:uppercase; letter-spacing:0.05em;}

/* ---- SUMMARY ---- */
/* ---- MODAL: extensión hipopresiva opcional ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(8,9,12,0.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; animation:fadein .2s ease;}
.modal-card{background:var(--bg-elev); border-radius:var(--radius); padding:26px 22px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative;}
.exercise-detail-card{max-height:88vh; overflow-y:auto; padding-top:44px;}
.modal-close{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-size:15px;}
.exercise-detail-title{font-weight:800; font-size:14px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; text-align:left; margin:16px 0 10px;}
.exercise-detail-steps{list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:12px; text-align:left;}
.exercise-detail-steps li{display:flex; gap:12px; align-items:flex-start;}
.exercise-detail-stepnum{flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#0C0D10; font-family:var(--font-display); font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.exercise-detail-steptext{font-size:16px; line-height:1.5; color:var(--text); padding-top:2px;}
.modal-card h2{font-size:22px; margin:6px 0 12px;}
.modal-actions{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.modal-actions .btn-huge{margin:0;}

.summary h1{font-size:28px; margin-bottom:20px;}
.summary-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; text-align:left;}
.summary-title{font-weight:700; font-size:14px; margin-bottom:10px; color:var(--text-dim);}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--bg-elev2);}
.summary-row:first-of-type{border-top:none;}
.badge{font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge-up{background:rgba(200,255,61,0.15); color:var(--accent);}
.badge-down{background:rgba(255,107,74,0.15); color:var(--danger);}

/* ---- PROGRESS ---- */
.sub-header{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.sub-header h1{font-size:22px;}
/* ---- CALENDARIO DE PROGRESO ---- */
.icon-btn.small{width:34px; height:34px; font-size:16px; border-radius:9px;}
.icon-btn:disabled{opacity:0.3;}
.calendar-card{background:var(--bg-elev); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.calendar-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calendar-month{font-weight:800; font-size:15px; text-transform:capitalize;}
.calendar-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px;}
.calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:9px; background:transparent; color:var(--text-dim); font-size:12px;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.has-session{background:var(--bg-elev2); color:var(--text); font-weight:700; cursor:pointer;}
.cal-cell.is-today{outline:1.5px solid var(--accent);}
.cal-cell.is-selected{background:var(--accent); color:#0C0D10;}
.cal-cell.is-selected .cal-dot{background:#0C0D10;}
.cal-dot{width:5px; height:5px; border-radius:50%; background:var(--dot-color, var(--accent)); margin-top:2px;}
.calendar-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid var(--bg-elev2);}
.legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-dim);}
.legend-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

.day-detail-card{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:14px;}
.day-habit-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--bg-elev2);}
.day-habit-chip{background:var(--bg-elev2); color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 11px; border-radius:20px;}
.day-habit-chip.is-good{background:rgba(200,255,61,0.12); color:var(--accent);}
.day-habit-chip.is-over{background:rgba(255,140,60,0.12); color:#FFB37A;}
.measurements-card{border:1px solid rgba(200,255,61,0.25);}
.measure-input-row{display:flex; gap:10px; margin:12px 0;}
.measure-input-group{flex:1; display:flex; flex-direction:column; gap:4px;}
.measure-input-group label{font-size:12.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}
.measure-input-group input{background:var(--bg-elev2); border:1px solid var(--border, #2A2C31); border-radius:10px; padding:10px 12px; color:var(--text); font-size:15px; width:100%;}
.measure-chart-block{margin-top:16px;}
.measure-chart-header{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-dim); font-weight:700; margin-bottom:4px;}
.measure-delta-good{color:var(--up, #7DD8FF);}
.measure-delta-bad{color:var(--danger);}
.sparkline{width:100%; height:60px; display:block;}
.measure-list{margin-top:14px; border-top:1px solid var(--bg-elev2); padding-top:10px;}
.measure-list-row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); padding:5px 0;}
.day-detail-title{font-weight:800; font-size:14px; text-transform:capitalize; margin-bottom:12px;}
.day-detail-stats{display:flex; gap:8px; margin-bottom:12px;}
.day-stat{flex:1; text-align:center; background:var(--bg-elev2); border-radius:10px; padding:10px 4px;}
.day-stat-num{display:block; font-family:var(--font-display); font-size:18px; color:var(--accent);}
.day-stat-label{display:block; font-size:11px; color:var(--text-dim); margin-top:2px;}
.day-detail-breakdown{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text-dim);}

.month-summary{background:var(--bg-elev); border-radius:var(--radius-sm); padding:16px; margin-bottom:18px;}
.month-summary-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--bg-elev2);}
.month-summary-row:first-of-type{border-top:none;}
.calorie-disclaimer{font-size:12px; color:var(--text-faint); line-height:1.4; margin:-8px 0 20px;}

.progress-group{margin-bottom:20px;}
.group-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;}
.level-track-item{border-bottom:1px solid var(--bg-elev);}
.level-track-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; width:100%; background:none; text-align:left; gap:8px;}
.level-track-name{font-size:14px; color:var(--text); flex:1;}
.level-track-chevron{font-size:9px; color:var(--text-faint); flex-shrink:0;}
.level-max-badge{background:rgba(200,255,61,0.18); color:var(--accent); font-size:9px; font-weight:800; letter-spacing:0.03em; border-radius:5px; padding:2px 5px; margin-left:6px; vertical-align:middle;}
.level-track{display:flex; gap:4px; flex-shrink:0;}
.level-pip{width:14px; height:6px; border-radius:3px; background:var(--bg-elev2);}
.level-pip.filled{background:var(--accent);}
.level-detail-list{padding:2px 0 12px 4px; display:flex; flex-direction:column; gap:7px;}
.level-detail-row{display:flex; align-items:center; gap:9px;}
.level-detail-num{width:18px; height:18px; border-radius:50%; background:var(--bg-elev2); color:var(--text-faint); font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.level-detail-row.is-done .level-detail-num{background:rgba(200,255,61,0.18); color:var(--accent);}
.level-detail-row.is-current .level-detail-num{background:var(--accent); color:#0C0D10;}
.level-detail-name{font-size:12.5px; color:var(--text-dim);}
.level-detail-row.is-current .level-detail-name,.level-detail-row.is-done .level-detail-name{color:var(--text);}
.level-detail-tag{font-size:9px; font-weight:800; margin-left:6px; color:var(--accent);}
.level-detail-tag.done{color:var(--text-faint);}
.history-list{margin-top:8px;}
.history-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--bg-elev); font-size:13px;}
.history-date{color:var(--text-faint);}

/* ---- SETTINGS ---- */
.settings-block{background:var(--bg-elev); border-radius:var(--radius-sm); padding:18px; margin-bottom:14px;}
.advice-block{background:linear-gradient(135deg, rgba(200,255,61,0.14), var(--bg-elev)); border:1px solid rgba(200,255,61,0.35);}
.advice-line{font-size:13px; color:var(--text); line-height:1.5; margin-top:8px;}
.advice-item-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
.advice-item-name{flex:1; min-width:0; font-size:12.5px; color:var(--text);}
.advice-item-weight{font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;}
.advice-bump-btn{flex-shrink:0; padding:6px 10px; font-size:12px;}
.ex-weight-list{display:flex; flex-direction:column; gap:2px; margin-top:8px;}
.ex-weight-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--bg-elev2);}
.ex-weight-row:first-child{border-top:none;}
.ex-weight-name{flex:1; min-width:0; font-size:12.5px; color:var(--text);}
.ex-weight-stepper{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.ex-weight-btn{width:26px; height:26px; border-radius:8px; background:var(--bg-elev2); color:var(--text); font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.ex-weight-val{font-size:12.5px; font-weight:700; color:var(--accent); min-width:34px; text-align:center;}
.advice-line strong{color:var(--accent);}
.settings-label{font-weight:700; font-size:14px; margin-bottom:12px;}
.week-picker{display:flex; gap:8px; margin-bottom:10px;}
.week-btn{flex:1; padding:12px; border-radius:10px; background:var(--bg-elev2); color:var(--text); font-weight:700;}
.week-btn.active{background:var(--accent); color:#0C0D10;}
.settings-hint{font-size:13.5px; color:var(--text-faint); line-height:1.5; margin-top:6px;}
.settings-toggle-row{display:flex; justify-content:space-between; align-items:center;}

/* ---- HÁBITOS ---- */
.habitos-intro{text-align:left; max-width:none; margin-bottom:18px;}
.habit-card{background:var(--bg-elev); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.habit-card-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.habit-target-edit{font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
.habit-inline-input{width:64px; background:var(--bg-elev2); color:var(--accent); border:none; border-radius:8px; padding:6px 8px; font-size:13px; font-weight:700; text-align:center;}
.activity-list{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.activity-row{display:flex; align-items:center; gap:8px; background:var(--bg-elev2); border-radius:10px; padding:8px 10px;}
.activity-row-label{flex:1; min-width:0; font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.activity-row-kcal{font-size:12px; font-weight:700; color:var(--accent);}
.activity-row-del{background:none; color:var(--text-faint); font-size:14px; padding:2px 4px;}
.activity-add-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.activity-select{width:100%; min-width:0; background:var(--bg-elev2); color:var(--text); border:none; border-radius:10px; padding:11px 10px; font-size:13.5px;}
.activity-add-row2{display:flex; gap:8px; align-items:center;}
.activity-minutes-input{flex:1; min-width:0; background:var(--bg-elev2); color:var(--accent); border:none; border-radius:10px; padding:11px 10px; font-size:14px; font-weight:700; text-align:center;}
.activity-add-row2 .btn-secondary{flex-shrink:0;}
.habit-big-input{width:100%; font-family:var(--font-display); font-size:36px; text-align:center; background:var(--bg-elev2); color:var(--accent); border:none; border-radius:12px; padding:14px; margin-bottom:10px;}
.habit-progress-track{width:100%; height:8px; background:var(--bg-elev2); border-radius:4px; overflow:hidden; margin-bottom:8px;}
.habit-progress-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .3s ease;}
.habit-meal-row{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--bg-elev2); font-size:13px; cursor:pointer;}
.habit-meal-row:first-of-type{border-top:none;}
.habit-meal-row input[type=checkbox]{width:19px; height:19px; flex-shrink:0; margin-top:1px; accent-color:var(--accent);}
.habit-meal-text{flex:1; color:var(--text); line-height:1.4;}
.habit-meal-kcal{flex-shrink:0; color:var(--text-faint); font-size:12px; white-space:nowrap;}
.habit-extra-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--bg-elev2); margin-top:2px;}
.habit-meal-block{border-top:1px solid var(--bg-elev2);}
.habit-meal-block:first-of-type{border-top:none;}
.habit-meal-block .habit-meal-row{border-top:none; padding-bottom:2px;}
.habit-meal-calc-toggle{display:block; width:100%; text-align:left; background:none; border:none; color:var(--accent); font-size:12px; padding:2px 0 8px 29px; cursor:pointer;}
.habit-meal-calc{background:var(--bg-elev2); border-radius:10px; padding:10px 12px; margin:0 0 10px 29px;}
.habit-food-list{margin-bottom:8px;}

<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>

<script type="module">
import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
const h = React.createElement;
const html = htm.bind(h);

// =====================================================================
// SOUND — Web Audio API, síntesis pura (offline, sin ficheros)
// Nota iOS: si el interruptor físico de silencio está activado, Safari
// silencia el audio de las páginas web (incluida esta instalada como app).
// Es una restricción del sistema operativo, no de la aplicación.
// =====================================================================
// AudioContext único compartido entre pitidos (Sound) y música ambiental
// (Music), para poder bajar el volumen de la música cuando suena un aviso.
let sharedAudioCtx = null;
function getSharedAudioCtx() {
  if (!sharedAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; sharedAudioCtx = new AC(); }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

const Sound = (() => {
  function getCtx() { return getSharedAudioCtx(); }
  function tone(freq, duration, opts = {}) {
    const { type = 'sine', gain = 0.18, delay = 0 } = opts;
    const c = getCtx();
    Music.duckBriefly((delay + duration) * 1000 + 300);
    LocalMusicPlayer.duckBriefly((delay + duration) * 1000 + 300);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
    g.gain.setValueAtTime(0, c.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + duration);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + duration + 0.02);
  }
  return {
    unlock() { try { getCtx(); } catch (e) {} },
    playSetStart() { tone(520, 0.09, { type: 'triangle', gain: 0.2 }); tone(780, 0.11, { type: 'triangle', gain: 0.16, delay: 0.09 }); },
    playSetEnd() { tone(660, 0.12, { gain: 0.18 }); tone(440, 0.16, { gain: 0.15, delay: 0.1 }); },
    playCountdownBeep(isLast) { tone(isLast ? 880 : 600, isLast ? 0.24 : 0.11, { type: 'sine', gain: isLast ? 0.2 : 0.12 }); },
    playRestEnd() { tone(700, 0.09, { type: 'triangle', gain: 0.2 }); tone(1000, 0.14, { type: 'triangle', gain: 0.18, delay: 0.1 }); },
    playRoundEnd() { tone(392, 0.16, { type: 'triangle', gain: 0.14 }); tone(523, 0.18, { type: 'triangle', gain: 0.16, delay: 0.13 }); },
    playExerciseComplete() { tone(523, 0.1, { gain: 0.16 }); tone(659, 0.1, { gain: 0.16, delay: 0.1 }); tone(784, 0.18, { gain: 0.18, delay: 0.2 }); },
    playSessionComplete() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, { type: 'triangle', gain: 0.2, delay: i * 0.13 })); },
    playWorkStart() { tone(330, 0.09, { type: 'triangle', gain: 0.17 }); tone(494, 0.13, { type: 'triangle', gain: 0.15, delay: 0.09 }); },
    playConfirmOpen() { tone(880, 0.07, { type: 'sine', gain: 0.13 }); tone(1174, 0.1, { type: 'sine', gain: 0.11, delay: 0.07 }); },
    playAdjustTick() { tone(1046, 0.05, { type: 'triangle', gain: 0.08 }); },
    playAutoLogged() { tone(587, 0.08, { type: 'triangle', gain: 0.15 }); tone(880, 0.12, { type: 'triangle', gain: 0.16, delay: 0.07 }); },
    playHypoStep() { tone(349, 0.17, { type: 'sine', gain: 0.13 }); tone(523, 0.19, { type: 'sine', gain: 0.12, delay: 0.11 }); },
  };
})();
let soundsOn = true;
function playIfOn(fn) { if (soundsOn) fn(); }

// =====================================================================
// MÚSICA RÍTMICA — generada en el propio navegador con Web Audio (no es
// un archivo de terceros: cero problemas de derechos de autor, funciona
// offline). Patrón de batería four-on-the-floor a 124 BPM (bombo en cada
// negra, hi-hat en corcheas, palmada en el "2" y el "4", línea de bajo
// simple) — el mismo tipo de pulso que marca el ritmo en clases de
// gimnasio, para que sea más fácil acompasar las repeticiones. Se atenúa
// sola (duck) cada vez que suena un pitido o la voz, igual que antes.
// =====================================================================
const Music = (() => {
  let masterGain = null;
  let running = false;
  let schedulerTimer = null;
  let nextNoteTime = 0;
  let currentStep = 0;
  let baseVol = 0.14;

  const BPM = 124;
  const STEP_DUR = 60 / BPM / 4; // dieciseisavos (16 pasos por compás de 4/4)
  const STEPS_PER_BAR = 16;

  // ---- Secciones con distinta instrumentación (mismo groove base, pero
  // variando qué suena en cada compás) para que el ritmo evolucione en vez
  // de repetirse igual todo el entreno. A = patrón base. B = variación con
  // rim shot y bajo distinto. C = "respiro" solo con hats+shaker, sin
  // bombo/palmada, para contraste. FILL = relleno de tambores cada 8
  // compases que anuncia el regreso al patrón base. ----
  const SECTIONS = {
    A: { kick: [0, 4, 8, 12], clap: [4, 12], hatAccent: [0, 4, 8, 12], bass: [[0, 55.0], [6, 55.0], [8, 61.74], [10, 55.0], [14, 49.0]], rim: [], shaker: false, toms: [] },
    B: { kick: [0, 4, 7, 8, 12], clap: [4, 12], hatAccent: [0, 4, 8, 12, 14], bass: [[0, 49.0], [6, 49.0], [8, 55.0], [12, 58.27]], rim: [2, 10], shaker: false, toms: [] },
    C: { kick: [0, 8], clap: [], hatAccent: [0, 8], bass: [[0, 55.0], [8, 49.0]], rim: [], shaker: true, toms: [] },
    FILL: { kick: [0, 4, 8, 10, 12, 14], clap: [4, 8, 12], hatAccent: [0, 2, 4, 6, 8, 10, 12, 14], bass: [[0, 55.0], [4, 58.27], [8, 61.74], [12, 65.41]], rim: [], shaker: false, toms: [2, 6, 10, 14] },
  };
  // 8 compases (~16s a 124 BPM) antes de repetirse — suficiente variación
  // para no notar el bucle, sin perder el groove reconocible.
  const SEQUENCE = ['A', 'A', 'B', 'A', 'C', 'B', 'A', 'FILL'];
  let barIdx = 0;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!masterGain) {
      masterGain = c.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(c.destination);
    }
    return c;
  }

  function kick(t) {
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.25);
  }
  function hat(t, accent) {
    const c = getSharedAudioCtx();
    const dur = accent ? 0.06 : 0.035;
    const size = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = c.createGain();
    g.gain.setValueAtTime(accent ? 0.2 : 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(hp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + dur + 0.01);
  }
  function clap(t) {
    const c = getSharedAudioCtx();
    const size = Math.floor(c.sampleRate * 0.16);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    noise.connect(bp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + 0.18);
  }
  function bass(t, freq) {
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + STEP_DUR * 1.7);
    osc.connect(lp).connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + STEP_DUR * 2);
  }
  // ---- Instrumentos nuevos para dar variedad tímbrica ----
  function rim(t) {
    // "rim shot": clic corto y agudo, muy distinto al hi-hat/palmada
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(1400, t); osc.frequency.exponentialRampToValueAtTime(900, t + 0.03);
    g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.05);
  }
  function tom(t, freq) {
    // golpe de tambor grave melódico, para los rellenos (fills)
    const c = getSharedAudioCtx();
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.16);
    g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + 0.22);
  }
  function shaker(t) {
    // textura suave y continua (corchea), solo en la sección de "respiro"
    const c = getSharedAudioCtx();
    const dur = 0.045;
    const size = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size) * 0.6;
    const noise = c.createBufferSource(); noise.buffer = buffer;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.7;
    const g = c.createGain();
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(bp).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + dur + 0.01);
  }

  function scheduleStep(step, t) {
    const sec = SECTIONS[SEQUENCE[barIdx % SEQUENCE.length]];
    if (sec.kick.includes(step)) kick(t);
    if (sec.clap.includes(step)) clap(t);
    if (sec.rim.includes(step)) rim(t);
    if (sec.toms.includes(step)) tom(t, [220, 180, 150, 130][sec.toms.indexOf(step) % 4]);
    if (sec.shaker && step % 2 === 0) shaker(t);
    if (!sec.shaker) hat(t, sec.hatAccent.includes(step));
    const bassHit = sec.bass.find(([s]) => s === step);
    if (bassHit) bass(t, bassHit[1]);
  }

  function schedulerLoop() {
    const c = ensureGraph();
    const lookahead = 0.15;
    while (nextNoteTime < c.currentTime + lookahead) {
      const step = currentStep % STEPS_PER_BAR;
      scheduleStep(step, nextNoteTime);
      if (step === STEPS_PER_BAR - 1) barIdx++;
      nextNoteTime += STEP_DUR;
      currentStep++;
    }
    schedulerTimer = setTimeout(schedulerLoop, 30);
  }

  let duckTimer = null;
  return {
    start() {
      if (running) return;
      running = true;
      const c = ensureGraph();
      currentStep = 0;
      barIdx = 0;
      nextNoteTime = c.currentTime + 0.08;
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol, c.currentTime + 1.0);
      schedulerLoop();
    },
    stop() {
      if (!running) return;
      running = false;
      clearTimeout(schedulerTimer);
      if (masterGain) {
        const c = getSharedAudioCtx();
        masterGain.gain.cancelScheduledValues(c.currentTime);
        masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
        masterGain.gain.linearRampToValueAtTime(0, c.currentTime + 0.6);
      }
    },
    // Baja el volumen brevemente (p.ej. mientras suena un pitido) y lo
    // devuelve solo al nivel normal pasado ms milisegundos.
    duckBriefly(ms) {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      clearTimeout(duckTimer);
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol * 0.2, c.currentTime + 0.1);
      duckTimer = setTimeout(() => {
        if (!running || !masterGain) return;
        const c2 = getSharedAudioCtx();
        masterGain.gain.cancelScheduledValues(c2.currentTime);
        masterGain.gain.setValueAtTime(masterGain.gain.value, c2.currentTime);
        masterGain.gain.linearRampToValueAtTime(baseVol, c2.currentTime + 0.4);
      }, Math.max(250, ms));
    },
    // Para hablar (voz): baja mientras dura la frase, indefinido hasta unduck().
    duck() {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol * 0.16, c.currentTime + 0.12);
    },
    unduck() {
      if (!running || !masterGain) return;
      const c = getSharedAudioCtx();
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(baseVol, c.currentTime + 0.5);
    },
    isRunning() { return running; },
  };
})();
let musicOn = false;
let localMusicOn = false;

// =====================================================================
// TU MÚSICA — reproduce archivos de audio que el propio usuario elige
// desde su dispositivo (Files app / carpeta de descargas en iPhone, o el
// selector de archivos equivalente en Android). Son sus propios ficheros
// locales, así que no hay ningún problema de derechos de autor ni de red:
// todo ocurre en el propio navegador, sin subir nada a ningún servidor.
// Se enruta a través de Web Audio (igual que el ritmo generado) para
// poder atenuarse automáticamente cuando habla la voz o suena un aviso.
// Limitación real del navegador (no de la app): Safari no permite recordar
// el acceso a archivos entre sesiones, así que hay que volver a elegirlos
// cada vez que se abre la app — se avisa de esto en la propia pantalla.
// =====================================================================
const LocalMusicPlayer = (() => {
  let audioEl = null, sourceNode = null, gainNode = null;
  let running = false;
  let baseVol = 0.7;
  let tracks = []; // [{ name, url }]
  let currentIdx = 0;
  let shuffled = [];
  let onTrackChange = null;
  let duckTimer = null;

  function ensureGraph() {
    const c = getSharedAudioCtx();
    if (!audioEl) {
      audioEl = new Audio();
      audioEl.crossOrigin = 'anonymous';
      audioEl.addEventListener('ended', () => playNext());
      sourceNode = c.createMediaElementSource(audioEl);
      gainNode = c.createGain();
      gainNode.gain.value = baseVol;
      sourceNode.connect(gainNode).connect(c.destination);
    }
    return c;
  }

  function shuffleOrder() {
    shuffled = tracks.map((_, i) => i);
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
  }

  function playIndex(pos) {
    ensureGraph();
    currentIdx = pos;
    const track = tracks[shuffled[pos]];
    if (!track) return;
    audioEl.src = track.url;
    audioEl.play().catch(() => {});
    running = true;
    if (onTrackChange) onTrackChange(track.name, pos, tracks.length);
  }

  function playNext() {
    if (!tracks.length) return;
    const next = (currentIdx + 1) % tracks.length;
    if (next === 0) shuffleOrder(); // vuelve a barajar al completar la vuelta
    playIndex(next);
  }

  return {
    setTracks(fileList) {
      // Libera las URL temporales anteriores antes de crear las nuevas
      tracks.forEach(t => URL.revokeObjectURL(t.url));
      tracks = Array.from(fileList).map(f => ({ name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) }));
      shuffleOrder();
      currentIdx = -1;
    },
    hasTracks() { return tracks.length > 0; },
    trackCount() { return tracks.length; },
    onChange(fn) { onTrackChange = fn; },
    start() {
      if (!tracks.length) return;
      Music.stop(); // no mezclar con el ritmo generado
      playIndex(0);
    },
    stop() {
      running = false;
      if (audioEl) audioEl.pause();
    },
    isRunning() { return running; },
    duckBriefly(ms) {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      clearTimeout(duckTimer);
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.2, c.currentTime + 0.1);
      duckTimer = setTimeout(() => {
        if (!running || !gainNode) return;
        const c2 = getSharedAudioCtx();
        gainNode.gain.cancelScheduledValues(c2.currentTime);
        gainNode.gain.setValueAtTime(gainNode.gain.value, c2.currentTime);
        gainNode.gain.linearRampToValueAtTime(baseVol, c2.currentTime + 0.4);
      }, Math.max(250, ms));
    },
    duck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol * 0.16, c.currentTime + 0.12);
    },
    unduck() {
      if (!running || !gainNode) return;
      const c = getSharedAudioCtx();
      gainNode.gain.cancelScheduledValues(c.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(baseVol, c.currentTime + 0.5);
    },
  };
})();

// =====================================================================
// VOZ — Web Speech API nativa del navegador (sin claves, sin dependencias
// externas). Anuncia ejercicios, cuenta atrás y frases motivacionales.
// Se degrada sola y en silencio si el navegador no soporta síntesis de voz.
// =====================================================================
const VoiceCoach = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let esVoice = null;
  if (supported) {
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      // Preferencia estricta por castellano de España; dentro de ese grupo,
      // prioriza voces "de red"/mejoradas (Google, Microsoft Online) sobre
      // las locales del sistema, que suelen sonar más robóticas.
      //
      // Aviso honesto (confirmado con desarrolladores independientes, no
      // solo suposición): en iOS, Safari NO expone a las apps web las
      // voces "Mejoradas/Premium" que puedas tener descargadas en Ajustes
      // → Accesibilidad → Contenido hablado — solo un grupo limitado de
      // voces "compactas", y esto ha empeorado en iOS 17/18. Es una
      // limitación de la propia plataforma (misma categoría que el Wake
      // Lock), no algo que este código pueda evitar. Esta búsqueda se deja
      // por si algún día Apple lo cambia o en otros navegadores/SO sí
      // aplica — el ritmo de voz en Ajustes es la palanca real que sí
      // tenemos bajo control para sonar más natural dentro de ese límite.
      const esES = voices.filter(v => v.lang === 'es-ES');
      const esAny = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      const pool = esES.length ? esES : esAny;
      esVoice = pool.find(v => /google|online|natural|wavenet|mejorada|enhanced|premium/i.test(v.name)) || pool[0] || null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, { rate = 0.97, pitch = 1.0, priority = false } = {}) {
    if (!supported || !voiceOn) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; if (esVoice) u.voice = esVoice;
      // Variación aleatoria de tono/ritmo más amplia que antes (±0.07 en vez
      // de ±0.025): una persona real varía bastante más de frase a frase de
      // lo que parecía necesario en la primera versión — el rango anterior
      // sonaba "casi siempre igual" con un temblor mínimo encima, no como
      // variación real de entonación. voiceRateMult es la preferencia de
      // ritmo elegida en Ajustes (lento/normal/rápido).
      u.rate = (rate * voiceRateMult) + (Math.random() * 0.14 - 0.07);
      u.pitch = pitch + (Math.random() * 0.14 - 0.07);
      u.volume = 0.95;
      u.onstart = () => { Music.duck(); LocalMusicPlayer.duck(); };
      u.onend = () => { Music.unduck(); LocalMusicPlayer.unduck(); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  // pickNoRepeat: igual que pick() pero recuerda la última frase elegida
  // por categoría (lastPickByCategory) y evita repetirla dos veces
  // seguidas — es lo que más rompe la sensación de "grabación en bucle"
  // cuando llevas 20 minutos oyendo las mismas 3 frases una y otra vez.
  // Con solo 2-3 frases por categoría no ayudaba mucho; con 10-12 (ver
  // pools ampliados abajo) sí se nota la diferencia real.
  const lastPickByCategory = {};
  function pickNoRepeat(category, arr) {
    if (arr.length <= 1) return arr[0];
    let choice;
    do { choice = arr[Math.floor(Math.random() * arr.length)]; }
    while (choice === lastPickByCategory[category] && arr.length > 1);
    lastPickByCategory[category] = choice;
    return choice;
  }
  const ENCOURAGEMENTS = [
    'Buen ritmo, sigue así.', 'Aguanta, ya casi lo tienes.', 'Vamos, mantén la forma.',
    'Fuerza, tú puedes con esto.', 'No aflojes ahora.', 'Respira y sigue empujando.',
    'Perfecto, controla el movimiento.', 'Un poco más, no te rindas.',
    'Eso es, así, sigue.', 'Vale, ya lo tienes, aguanta.', 'Buen trabajo, no pares.',
    'Venga, un esfuerzo más.', 'Ahí, ahí, mantén la técnica.', 'Sigue empujando, casi está.',
  ];
  const SESSION_OPENERS = [
    'Empezamos, vamos a por este circuito.', 'Arranca el entreno de hoy, a por ello.',
    'Circuito listo, concéntrate y vamos.', 'Vale, toca entrenar, vamos allá.',
    'Empieza el circuito de hoy, dale caña.', 'Vamos con el entreno de hoy.',
  ];
  const ROUND_PHRASES = n => [
    `Vuelta ${n} completada, buen trabajo.`, `Fin de la vuelta ${n}, sigue así.`,
    `Vuelta ${n} hecha, aguanta el ritmo.`, `Eso es, vuelta ${n} terminada.`,
    `Vuelta ${n} lista, vamos con la siguiente.`,
  ];
  const CIRCUIT_DONE = [
    'Circuito terminado, gran trabajo hoy.', 'Ya está, entreno completado, enhorabuena.',
    'Circuito completo, muy buen trabajo hoy.', 'Eso es todo por hoy, buen entreno.',
    'Circuito hecho, has cumplido, enhorabuena.',
  ];
  const EXERCISE_CONNECTORS = ['', 'Toca ', 'Ahora, ', 'Vamos con ', 'Siguiente: '];
  return {
    supported,
    sessionStart() { say(pickNoRepeat('opener', SESSION_OPENERS), { rate: 0.98, priority: true }); },
    announceExercise(name, isTimeBased) {
      // Pequeña variedad también aquí: no siempre "Nombre." a secas, a
      // veces un conector natural delante — de nuevo rompe la repetición,
      // que en este caso suena muchas veces por sesión (una por ejercicio).
      const connector = pickNoRepeat('connector', EXERCISE_CONNECTORS);
      const lowerName = connector ? name.charAt(0).toLowerCase() + name.slice(1) : name;
      say(isTimeBased ? `${connector}${lowerName}, mantén la posición.` : `${connector}${lowerName}.`, { priority: true });
    },
    countdownGo() { say('Vamos', { rate: 1.02, pitch: 1.04, priority: true }); },
    encourage() { say(pickNoRepeat('encourage', ENCOURAGEMENTS), { rate: 1.0 + Math.random() * 0.04 }); },
    rest() { say('Descansa.', { rate: 0.92, pitch: 0.96, priority: true }); },
    roundDone(n) { say(pickNoRepeat('round', ROUND_PHRASES(n)), { priority: true }); },
    circuitDone() { say(pickNoRepeat('done', CIRCUIT_DONE), { priority: true }); },
    beforeHypo() { say('Antes de los hipopresivos, un par de minutos para bajar pulsaciones. Respira despacio.', { rate: 0.9, pitch: 0.97, priority: true }); },
    warmupStart() { say('Antes de empezar, un calentamiento rápido.', { priority: true }); },
    warmupStep(name) { say(`${name}.`, { priority: true }); },
    hypoStep(name) { say(`${name}.`, { rate: 0.9, priority: true }); },
    phaseChanged(name) { say(`Nueva fase del plan, ${name}.`, { priority: true }); },
  };
})();
let voiceOn = true;
// Preferencia de ritmo de voz — la única palanca de "sonido más natural"
// que sí controlamos del todo (la calidad del motor de voz en sí la fija
// iOS, ver comentario en VoiceCoach). Persistida junto al resto de ajustes
// de sonido en localStorage, no en el estado del progreso.
let voiceRateMult = 1;
try { const savedRate = localStorage.getItem('forma55_voice_rate'); if (savedRate) voiceRateMult = parseFloat(savedRate) || 1; } catch (e) {}
function setVoiceRateMult(v) { voiceRateMult = v; try { localStorage.setItem('forma55_voice_rate', String(v)); } catch (e) {} }

// =====================================================================
// DATA — hombre 55 años, 165cm, ~70kg, nivel AVANZADO.
// Peso corporal + mancuernas 2kg. Ciclo de 4 semanas SIN fase de
// adaptación (ya entrena a diario): arranca directo en Volumen.
// =====================================================================
const BIOTYPE = { ageYears: 55, heightCm: 165, weightKg: 70, sex: 'male' };

// ---- Estimación de calorías (fórmula MET estándar: kcal/min = MET·3.5·kg/200) ----
// MET del circuito por fase: la densidad de trabajo (descanso corto = más
// intensidad media) sube el MET en Intensidad y lo baja en Descarga. Valores
// tomados del Compendium of Physical Activities para "resistance/circuit
// training" de esfuerzo moderado-vigoroso, ajustados por fase.
const MET_CIRCUIT_BY_PHASE = { 1: 6.5, 2: 6.0, 3: 7.5, 4: 5.0 };
const MET_HYPO = 2.8; // trabajo respiratorio/vacío abdominal, esfuerzo bajo
function estimateCalories(circuitSec, hypoSec, phaseKey) {
  const metCircuit = MET_CIRCUIT_BY_PHASE[phaseKey] || 6.5;
  const kcalCircuit = metCircuit * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, circuitSec) / 60);
  const kcalHypo = MET_HYPO * 3.5 * BIOTYPE.weightKg / 200 * (Math.max(0, hypoSec) / 60);
  return Math.round(kcalCircuit + kcalHypo);
}

// =====================================================================
// SINCRONIZACIÓN ENTRE DISPOSITIVOS — sin servidor de terceros.
// Se probó primero con jsonblob.com (almacenamiento JSON público), pero
// se detectó que su API ya no es fiable para este uso: la creación
// devolvía un identificador con apariencia válida que después no existía
// al consultarlo (probablemente por un cambio reciente en su servicio).
// En vez de depender de un tercero que puede fallar sin previo aviso, el
// propio código/QR contiene el progreso esencial codificado en base64 —
// no hay ninguna petición de red de por medio, así que no puede fallar
// por falta de conexión ni por que un servidor externo esté caído.
// Para mantener el código manejable (cabe en un QR sin problema), solo
// incluye lo esencial para continuar el plan en otro dispositivo: niveles
// de cada ejercicio, semana del ciclo, peso de mancuernas/mochila, ritmo
// y vueltas por día. El historial detallado de sesiones pasadas (fechas,
// calorías, duración) NO cabe de forma razonable en un código para
// escribir o escanear, así que para llevarlo completo se usa el archivo
// de exportación/importación (ver ExportImportBlock), que sí lo incluye
// todo sin límite de tamaño.
// =====================================================================
const QUICK_SYNC_FIELDS = ['cycleWeek', 'totalSessionsDone', 'roundsPerDay', 'pace', 'dumbbellWeight', 'backpackWeight', 'equipment', 'exerciseLevels', 'exerciseWeights', 'lastWeightReviewDate', 'weightReviewDue', 'weightReviewSnoozeUntil'];

// El código lleva un marcador de una letra al principio para saber cómo
// leerlo: 'Z' = comprimido (deflate), 'R' = sin comprimir (respaldo para
// navegadores muy antiguos sin CompressionStream). Un código sin ninguno
// de los dos marcadores se trata como generado por una versión anterior de
// la app (compatibilidad hacia atrás, sin romper códigos ya compartidos).
function bytesToBase64Url(bytes) {
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function encodeQuickSync(state) {
  const payload = {};
  QUICK_SYNC_FIELDS.forEach(k => { payload[k] = state[k]; });
  const json = JSON.stringify(payload);
  if (typeof CompressionStream !== 'undefined') {
    try {
      const cs = new CompressionStream('deflate-raw');
      const writer = cs.writable.getWriter();
      writer.write(new TextEncoder().encode(json));
      writer.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'Z' + bytesToBase64Url(new Uint8Array(buf));
    } catch (e) { /* si algo falla al comprimir, cae al método sin comprimir de abajo */ }
  }
  return 'R' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function decodeQuickSync(code) {
  const trimmed = (code || '').trim();
  if (!trimmed) throw new Error('Pega o escanea un código antes de vincular.');
  const marker = trimmed[0];
  const rest = trimmed.slice(1);
  let json;
  try {
    if (marker === 'Z') {
      if (typeof DecompressionStream === 'undefined') throw new Error('unsupported');
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(base64UrlToBytes(rest));
      writer.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      json = new TextDecoder().decode(buf);
    } else if (marker === 'R') {

// con 6-8 familias más por grupo y la rotación podía dejarlas fuera
// semanas seguidas, justo lo contrario de "trabajarlas al máximo".
// 'wrist' se añade a prioritarias porque el antebrazo es objetivo
// explícito del usuario (brazos poco voluminosos) y, sin esto, competía
// en igualdad de condiciones con curl/tricep dentro de 'superior_traccion'
// y podía no salir en semanas enteras por puro azar de rotación.
// 'rotator' se añade a prioritarias por el mismo motivo que retract/ytw:
// corrección postural directa del hombro hacia delante, no debe depender
// del azar de la rotación para aparecer con regularidad.

  // Paso 1: reserva un hueco a la familia correctiva prioritaria de cada
  // grupo de hoy (si el grupo tiene alguna), antes de repartir el resto.
  // Así "zancada lateral" y el trabajo postural aparecen cada semana en
  // vez de cuando le toque en la rotación.
  for (const group of groups) {
    if (picked.length >= EXERCISES_PER_SESSION) break;
    const priorityCandidates = EXERCISES.filter(e => e.group === group && PRIORITY_FAMILIES.includes(e.id.split('_')[0]) && !usedIds.has(e.id.split('_')[0]) && hasEquip(e));

      const prefix = priorityCandidates[0].id.split('_')[0];
      const effectiveLevel = getFamilyLevel(state, prefix);

  let gi = 0; let guard = 0;
  while (picked.length < EXERCISES_PER_SESSION && guard < 40) {
    guard++;
    const group = groups[gi % groups.length];
    const candidates = EXERCISES.filter(e => e.group === group && !usedIds.has(e.id.split('_')[0]) && hasEquip(e));
    if (candidates.length) {
      const familyPrefixes = [...new Set(candidates.map(e => e.id.split('_')[0]))];
      const prefix = familyPrefixes[(picked.length + rotation) % familyPrefixes.length];
      const effectiveLevel = getFamilyLevel(state, prefix);

function useFigureLoop(period, active) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) % period) / period), 55);
    return () => clearInterval(id);
  }, [period, active]);
  return t;
}
function triWave(t) { return t < 0.5 ? t * 2 : (1 - t) * 2; }
