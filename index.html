  { id: 'slu_01', name: 'Zancada lateral asistida', group: 'inferior', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'peso corporal', cue: 'Paso amplio hacia un lado, dobla esa rodilla manteniendo la otra pierna estirada. Apóyate en una silla si necesitas equilibrio. Vuelve al centro empujando con el talón de la pierna doblada.' },
  { id: 'slu_02', name: 'Zancada lateral', group: 'inferior', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'peso corporal', cue: 'Paso amplio hacia un lado, cadera atrás, rodilla no sobrepasa la punta del pie. Siente el glúteo lateral de la pierna que trabaja, no el interior del muslo.' },
  { id: 'slu_03', name: 'Zancada lateral con mancuernas', group: 'inferior', level: 4, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'mancuernas', weight: 2, cue: 'Mancuernas a los lados. Mismo patrón que la zancada lateral, con más carga para intensificar el trabajo de glúteo medio.' },
  // Zancada cruzada por detrás (curtsy lunge). Añade rotación de cadera a
  // la zancada lateral — el glúteo medio de la pierna de apoyo tiene que
  // controlar esa rotación además del plano frontal, más exigente que la
  // zancada lateral estándar.
  { id: 'slu_04', name: 'Zancada cruzada por detrás (curtsy)', group: 'inferior', level: 5, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'lunge', equip: 'mancuernas', weight: 2, cue: 'Cruza una pierna por detrás y hacia el lado contrario, como una reverencia, bajando hasta que la rodilla trasera roce el suelo. Mantén el torso recto y las caderas mirando al frente sin rotar. Aprieta el glúteo de la pierna de apoyo al subir.' },
  // Glúteo medio (familia 'hipabd', nueva) — la zancada lateral (slu) ya
  // lo trabaja, pero como sinergista dentro de un movimiento compuesto,
  // no aislado. Para hipertrofia/fuerza real de glúteo medio hace falta
  // tensión constante en abducción pura, que es justo lo que no había en
  // el plan. hipabd_01 es activación sin carga (círculos de cadera a
  // cuatro patas), hipabd_02 añade banda para carga progresiva real —
  // el ejercicio de referencia para glúteo medio (monster walk).
  { id: 'hipabd_01', name: 'Círculos de cadera a cuatro patas', group: 'inferior', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'birddog', equip: 'peso corporal', sides: true, cue: 'A cuatro patas, eleva una rodilla flexionada a 90° hasta la altura de la cadera. Sin bajarla, dibuja un círculo amplio con la rodilla usando solo la cadera, despacio. Cambia de lado a mitad de serie.' },
  { id: 'hipabd_02', name: 'Paso lateral con banda (monster walk)', group: 'inferior', level: 2, baseReps: 30, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'lunge', equip: 'banda', reqEquip: 'banda', cue: 'Banda alrededor de los tobillos o justo por encima de las rodillas, con tensión ya al separar los pies a la anchura de hombros. Semi-sentadilla ligera, da pasos laterales cortos manteniendo la tensión de la banda en todo momento — no dejes que las rodillas se junten entre paso y paso.' },
  // hipabd_03 (agosto 2026): misma razón que bpress_03/rotator_03 —
  // familia recién priorizada (antes 2 apariciones en 24 sesiones, ahora
  // garantizada cada semana). Progresión real cambiando de plano: el
  // monster walk trabaja de pie en cadena cerrada; esta variante tumbado
  // de lado con banda en los tobillos aísla el glúteo medio en cadena
  // abierta, sin la ayuda de otros músculos de la pierna de apoyo —
  // más específico, más exigente, y complementa el ángulo del monster
  // walk en vez de repetirlo.
  { id: 'hipabd_03', name: 'Elevación lateral de pierna con banda', group: 'inferior', level: 3, baseReps: 15, baseSeries: 3, tempo: '2-1-2', icon: 'lunge', equip: 'banda', reqEquip: 'banda', sides: true, cue: 'Tumbado de lado, banda alrededor de ambos tobillos. Pierna de abajo ligeramente flexionada para estabilidad, pierna de arriba recta. Eleva la pierna de arriba contra la resistencia de la banda sin rotar la cadera hacia atrás, aprieta 1s arriba, baja controlado. Cambia de lado a mitad de serie.' },
  { id: 'hip_01', name: 'Puente de glúteo',                  group: 'inferior', level: 1, baseReps: 15, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'peso corporal', cue: 'Empuja con talones, aprieta glúteo arriba 1s antes de bajar.' },
  { id: 'hip_02', name: 'Puente de glúteo con mancuerna',    group: 'inferior', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'mancuernas', weight: 2, cue: 'Mancuerna apoyada sobre la cadera, sujeta con ambas manos. Sube y aprieta glúteo arriba.' },
  { id: 'hip_03', name: 'Peso muerto a una pierna con mancuerna', group: 'inferior', level: 4, baseReps: 8, baseSeries: 3, tempo: '3-0-1', icon: 'rdl', equip: 'mancuernas', weight: 2, cue: 'Mancuerna en la mano contraria a la pierna de apoyo. Bisagra de cadera, espalda recta.' },
  // Puente a una pierna — el trabajo unilateral obliga a que todo el
  // glúteo de esa pierna sostenga la cadera solo, mucho más activación
  // que el puente a dos piernas de nivel 1.
  { id: 'hip_04', name: 'Puente de glúteo a una pierna', group: 'inferior', level: 5, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'peso corporal', cue: 'Una pierna apoyada, la otra extendida en el aire. Empuja con el talón de apoyo, aprieta glúteo arriba 1s. Cadera nivelada, sin rotar hacia el lado de la pierna elevada.' },
  // Hip thrust elevado — la progresión real que faltaba tras el puente a
  // una pierna en nivel máximo. Con la espalda alta apoyada en un sofá o
  // silla firme en vez de en el suelo, el rango de movimiento se dobla y
  // la activación de glúteo es mayor que en cualquier variante de puente
  // a ras de suelo (es la razón por la que en cualquier gimnasio se hace
  // así, no en el suelo) — es literalmente el ejercicio que más "eleva y
  // redondea" de todo el plan. Carga con la mochila sobre la cadera para
  // progresión real de peso. Sin foto real con mochila en la base de
  // datos: se usa la de barra (mismo gesto exacto y misma posición
  // corporal, solo cambia la carga — mochila sobre la cadera en vez de
  // barra).
  { id: 'hip_05', name: 'Hip thrust elevado con mochila', group: 'inferior', level: 6, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'bridge', equip: 'mochila', reqEquip: 'mochila', weight: 6, cue: 'Espalda alta (omóplatos) apoyada en el borde de un sofá o silla firme, pies apoyados en el suelo delante, mochila cargada sobre la cadera sujeta con ambas manos. Empuja con los talones hasta que cadera y muslos queden en línea con el torso, aprieta glúteo fuerte arriba 1-2s, baja controlado sin llegar a sentarte del todo entre repeticiones.' },
  { id: 'calf_01', name: 'Elevación de talones con mancuernas', group: 'inferior', level: 2, baseReps: 20, baseSeries: 3, tempo: '1-1-1', icon: 'calf', equip: 'mancuernas', weight: 2, cue: 'Mancuernas a los lados, sube en punta de pies, pausa 1s arriba, baja controlado.' },
  // calf_02: familia en techo real del catálogo (nivel 2 era el máximo,
  // volumeBonus alto acumulado). Progresión real sin necesitar más peso:
  // pasar a una sola pierna multiplica la carga relativa por gemelo sin
  // tocar el kilaje. Foto real más cercana en la base pública es la
  // versión sentada a una pierna (mismo patrón unilateral con mancuerna);
  // se ejecuta de pie según la cue, documentado.
  { id: 'calf_02', name: 'Elevación de talones a una pierna con mancuerna', group: 'inferior', level: 3, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'calf', equip: 'mancuernas', weight: 2, sides: true, cue: 'De pie sobre una pierna (mano libre apoyada en pared para equilibrio), mancuerna en la mano del mismo lado. Sube en punta de pie, pausa 1s arriba, baja controlado. Cambia de lado a mitad de las repeticiones.' },
  { id: 'wall_01', name: 'Silla contra pared (isométrico)',  group: 'inferior', level: 2, baseReps: 35, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'chair', equip: 'peso corporal', cue: 'Espalda pegada a la pared, rodillas a 90°. Aguanta respirando de forma controlada.' },
  // wall_02: progresión real (tu histórico marcaba vol=5 en nivel único).
  // Sin foto exacta de "silla contra pared con peso" en la base de datos
  // pública; se usa la de sentadilla con el mismo ángulo de rodilla a 90°
  // como referencia visual más cercana — nombre y cue en español dejan
  // claro que es isométrico contra la pared, no una sentadilla dinámica.
  { id: 'wall_02', name: 'Silla contra pared con mochila cargada', group: 'inferior', level: 3, baseReps: 30, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'chair', equip: 'mochila', reqEquip: 'mochila', weight: 6, cue: 'Misma posición de silla contra pared, ahora con la mochila cargada apoyada sobre los muslos, sujeta con ambas manos. Mismo ángulo de 90° en rodillas, aguanta respirando controlado.' },

  { id: 'pu_01', name: 'Flexión inclinada (manos elevadas)', group: 'superior_empuje', level: 1, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Manos en una superficie elevada (mesa/banco). Cuerpo recto, baja el pecho hacia las manos.' },
  { id: 'pu_02', name: 'Flexión de rodillas',                group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Rodillas apoyadas, cadera-hombro-rodilla en línea. Codos a 45° del cuerpo.' },
  { id: 'pu_03', name: 'Flexión estándar',                   group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Cuerpo recto de cabeza a talones. Baja hasta rozar el pecho, empuja fuerte.' },
  { id: 'pu_04', name: 'Flexión con mochila cargada',        group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'mochila', reqEquip: 'mochila', cue: 'Mochila centrada sobre la parte alta de la espalda (entre los omóplatos), bien ajustada. Misma técnica que la flexión estándar, más resistencia. No la cargues más de lo que aguantes en forma estricta.' },
  // Única variante del plan que prioriza la parte ALTA del pectoral — todas
  // las demás flexiones (manos elevadas, rodillas, estándar, mochila)
  // inciden más en pecho medio/bajo. Con los pies elevados en una silla, el
  // ángulo del torso hace el mismo trabajo que un press inclinado con banco
  // sin necesitar banco. Progresión de peso corporal puro más avanzada que
  // la estándar, sin necesitar mochila.
  { id: 'pu_05', name: 'Flexión declinada (pies elevados)', group: 'superior_empuje', level: 5, baseReps: 10, baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Pies apoyados en una silla estable, manos en el suelo. Cuerpo recto, baja el pecho hacia el suelo — el ángulo hace trabajar mucho más la parte alta del pectoral que la flexión estándar.' },
  { id: 'pu_06', name: 'Flexión triángulo (diamond)',        group: 'superior_empuje', level: 6, baseReps: 8,  baseSeries: 4, tempo: '2-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Manos juntas bajo el pecho formando un triángulo con los dedos índice y pulgar. Codos pegados al cuerpo al bajar — mucho más tríceps y pecho interno que la flexión estándar.' },
  { id: 'pu_07', name: 'Flexión a una mano (asistida)',      group: 'superior_empuje', level: 7, baseReps: 5,  baseSeries: 4, tempo: '3-0-1', icon: 'pushup', equip: 'peso corporal', cue: 'Pies bien separados para más base de apoyo, una mano detrás de la espalda. Baja controlado sin rotar el tronco — progresión real hacia la flexión a una mano.' },
  { id: 'press_01', name: 'Press de hombro con mancuernas (sentado)', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'press', equip: 'mancuernas', weight: 2, cue: 'Sentado, mancuernas a la altura del hombro, empuja arriba sin bloquear codo del todo.' },
  // press_02: progresión de hombro más allá del techo de mancuerna, con
  // tensión continua de la banda en todo el recorrido del press.
  { id: 'press_02', name: 'Press de hombro con banda (de pie)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'De pie sobre la banda con los pies a la anchura de los hombros, sujeta los extremos a la altura del hombro con las palmas hacia delante. Empuja hacia arriba hasta extender los brazos, baja controlado sin bloquear el codo.' },
  { id: 'fly_01', name: 'Aperturas de pecho con mancuernas (suelo)', group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 3, tempo: '3-0-1', icon: 'fly', equip: 'mancuernas', weight: 2, cue: 'Tumbado, brazos abiertos con ligera flexión de codo, baja controlado, sube juntando.' },
  { id: 'fly_02', name: 'Cruce de poleas con banda (cross over)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'fly', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del pecho (puerta cerrada). De espaldas al anclaje, dos pasos al frente, brazos abiertos en cruz con ligera flexión de codo. Cruza los brazos por delante del pecho en semicírculo apretando el pectoral, vuelve controlado sin perder la tensión.' },
  // Aperturas en ángulo ascendente — el cross over de arriba trabaja el
  // pecho medio en un plano horizontal; esto cambia el ángulo de tracción
  // a bajo-hacia-arriba, que es lo que prioriza el pectoral clavicular
  // (la parte alta, junto a la clavícula). Es la parte que visualmente
  // "levanta" un pecho caído — sin ella, por mucho volumen que gane el
  // pecho medio, el descuelgue visual apenas cambia. Sin foto real de
  // banda tumbado en el suelo: se usa la de polea en banco inclinado
  // (mismo ángulo de tracción bajo-alto, que es lo que importa).
  { id: 'fly_03', name: 'Aperturas ascendentes con banda (pecho alto)', group: 'superior_empuje', level: 5, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'fly', equip: 'banda', reqEquip: 'banda', cue: 'Banda anclada a ras de suelo (puerta cerrada, pasa por debajo). Tumbado o semi-incorporado con la cabeza más alta que los pies (apoyado en cojines), brazos abajo a los lados con ligera flexión de codo. Sube en arco hacia arriba y al centro, como abrazando un tronco por encima de la cabeza, aprieta la parte alta del pecho arriba, baja controlado.' },
  // Progresión de tríceps más allá del techo de mancuernas: mismo patrón
  // de extensión, ahora con tensión continua de la banda en vez de solo
  // el peso muerto de la mancuerna.
  { id: 'tricep_04', name: 'Extensión de tríceps con banda (skull crusher)', group: 'superior_empuje', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'curl', equip: 'banda', reqEquip: 'banda', cue: 'Tumbado, banda anclada por detrás de la cabeza a ras de suelo (puerta cerrada o mueble pesado). Codos apuntando al techo y fijos, extiende los antebrazos hasta estirar del todo, vuelve controlado sin mover el codo del sitio.' },
  // Press de pecho con banda — cubre lo que las flexiones y aperturas no
  // pueden dar solas: tensión constante en el rango completo del press,
  // sin depender de la gravedad. En el suelo (floor press) en vez de banco,
  // lo que además protege el hombro al limitar el rango en el punto más
  // vulnerable — buena elección justo con antepulsión de hombro.
  { id: 'bpress_01', name: 'Press de pecho con banda (floor press)', group: 'superior_empuje', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'Tumbado en el suelo, banda anclada por detrás de la cabeza a la altura del hombro (puerta cerrada o mueble pesado). Sujeta los extremos a la altura del pecho, codos a 90°. Empuja hacia arriba extendiendo los brazos sin bloquear el codo, aprieta el pecho arriba, baja el doble de lento de lo que subes.' },
  // bpress_02: única familia de pecho con un solo nivel — progresión real
  // en ángulo inclinado, que prioriza el pectoral clavicular (parte alta)
  // igual que fly_03, pero en un patrón de PRESS en vez de apertura — dos
  // estímulos distintos sobre la misma zona objetivo. Es el añadido con
  // más impacto directo posible sobre "pecho caído" ahora mismo.
  { id: 'bpress_02', name: 'Press de pecho con banda en inclinado', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'banda', reqEquip: 'banda', cue: 'Semi-incorporado con la cabeza más alta que los pies (apoyado en cojines o el borde de un sofá), banda anclada por detrás y por debajo de los hombros a ras de suelo. Empuja hacia arriba y ligeramente hacia atrás, en línea con la parte alta del pecho, aprieta arriba 1s, baja controlado. Nota cómo trabaja más la zona alta/clavicular que el press plano.' },
  // bpress_03 (agosto 2026): esta familia acaba de pasar a ser prioritaria
  // — antes de esto tenía 0 apariciones reales en 24 sesiones, ahora tiene
  // hueco garantizado cada semana. Con solo 2 niveles se iba a quedar sin
  // margen de progresión enseguida, justo cuando más frecuencia va a tener.
  // Progresión real con las mancuernas de 4kg confirmadas (antes la
  // familia entera dependía solo de banda): tumbado en el suelo con
  // mancuerna en cada mano en vez de banda — resistencia constante en
  // todo el recorrido (la banda pierde tensión al final), un estímulo
  // distinto y más exigente para seguir progresando el pecho.
  { id: 'bpress_03', name: 'Press de pecho en el suelo con mancuernas', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-1-2', icon: 'press', equip: 'mancuernas', weight: 4, cue: 'Tumbado en el suelo, rodillas flexionadas, una mancuerna en cada mano a la altura del pecho, codos apoyados en el suelo al bajar (ahí es donde paras, no sigas bajando). Empuja las mancuernas arriba hasta casi juntarlas, sin bloquear el codo, baja controlado hasta que los codos vuelvan a tocar el suelo.' },
  { id: 'dip_01', name: 'Fondos en silla',                   group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'dip', equip: 'peso corporal', cue: 'Manos en el borde de la silla, piernas extendidas. Baja hasta 90° de codo, sin hundir hombros.' },
  { id: 'pike_01', name: 'Flexión pike (hombro)',            group: 'superior_empuje', level: 4, baseReps: 8,  baseSeries: 3, tempo: '2-0-1', icon: 'pike', equip: 'peso corporal', cue: 'Cadera elevada en V invertida. Baja la cabeza entre las manos, empuja de vuelta arriba.' },
  // pike_02: familia en techo real (nivel 4 era el máximo, volumeBonus
  // alto). Progresión real hacia el hombro/pecho (objetivo explícito del
  // usuario) sin necesitar más peso: pies elevados en una silla/mochila
  // aumenta el porcentaje de peso corporal sobre los hombros, acercando
  // el ángulo hacia la vertical real (paso intermedio real hacia
  // handstand push-up, mucho más seguro que saltar directo a esa
  // variante). Foto real EXACTA en la base pública para esta variante
  // concreta de pies elevados, HTTP 200 verificado.
  { id: 'pike_02', name: 'Flexión pike con pies elevados',   group: 'superior_empuje', level: 5, baseReps: 8, baseSeries: 3, tempo: '2-0-1', icon: 'pike', equip: 'peso corporal', cue: 'Pies apoyados en una silla o superficie elevada estable, manos en el suelo, cadera elevada en V invertida más pronunciada. Baja la cabeza entre las manos, empuja de vuelta arriba. Más ángulo hacia la vertical que la pike normal, mayor exigencia de hombro.' },
  { id: 'lat_01', name: 'Elevaciones laterales con mancuernas', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'lateral', equip: 'mancuernas', weight: 2, cue: 'Brazos a los lados, sube hasta la altura del hombro con ligera flexión de codo. Sin impulso.' },
  // lat_02: equivalente real con banda — para cuando el techo de peso de
  // tus mancuernas (máx. real ~3,5kg/mano) se queda corto y no puedes
  // comprar más de momento. Tensión continua de la banda en vez de solo
  // peso muerto: a menudo notarás MÁS exigencia real que con la mancuerna
  // en la parte alta del recorrido, aunque el "peso" no suba en el papel.
  { id: 'lat_02', name: 'Elevaciones laterales con banda', group: 'superior_empuje', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'lateral', equip: 'banda', reqEquip: 'banda', cue: 'Pisa el centro de la banda con ambos pies, sujeta un extremo con cada mano a los lados. Sube los brazos hasta la altura del hombro con ligera flexión de codo, sin impulso, aguanta 1s arriba, baja controlado.' },

  { id: 'row_01', name: 'Remo invertido (mesa)',             group: 'superior_traccion', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'peso corporal', cue: 'Cuerpo bajo la mesa, agarra el borde, tira del pecho hacia arriba manteniendo el cuerpo recto.' },
  { id: 'row_02', name: 'Remo a una mano con mancuerna',     group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-1', icon: 'row', equip: 'mancuernas', weight: 2, cue: 'Apoyo con una mano en silla/mesa, tira de la mancuerna hacia la cadera, codo pegado al cuerpo.' },
  { id: 'row_03', name: 'Superman',                          group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-1', icon: 'superman', equip: 'peso corporal', cue: 'Tumbado boca abajo, eleva brazos y piernas a la vez, aprieta lumbar y glúteo.' },
  // row_04: progresión real de remo más allá del techo de mancuerna —
  // tensión continua de la banda en un gesto de "apertura hacia atrás"
  // que además refuerza directamente la retracción escapular (postura).
  { id: 'row_04', name: 'Apertura de espalda con banda (back flyes)', group: 'superior_traccion', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del pecho (puerta cerrada). De frente al anclaje, brazos extendidos al frente sujetando los extremos. Abre los brazos hacia atrás en cruz manteniéndolos paralelos al suelo, aprieta omóplatos, vuelve controlado.' },
  { id: 'ytw_01', name: 'Y-T-W prono con mancuernas ligeras', group: 'superior_traccion', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'ytw', equip: 'mancuernas', weight: 2, cue: 'Tumbado boca abajo, dibuja las letras Y-T-W elevando los brazos. Fortalece espalda alta y postura.' },
  // ytw_02: progresión real solicitada — añade rotación externa de
  // muñeca al final del recorrido (de palmas abajo a palmas enfrentadas),
  // sumando trabajo directo de manguito rotador a la retracción escapular
  // que ya hacía el YTW. Mismo tipo de mejora que ya se aplicó a
  // retract/rotator con la banda, aquí con mancuerna.
  { id: 'ytw_02', name: 'Apertura invertida con rotación externa', group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-1-2', icon: 'ytw', equip: 'mancuernas', weight: 2, cue: 'Inclinado hacia delante (o en banco inclinado boca abajo si tienes), mancuernas colgando con palmas hacia abajo, codos con ligera flexión fija. Sube en arco hacia los lados y, al llegar arriba, gira la muñeca para que las palmas queden una frente a la otra — aprieta omóplatos en la posición final. Baja controlado deshaciendo la rotación.' },
  { id: 'retract_01', name: 'Retracción escapular',          group: 'superior_traccion', level: 1, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'peso corporal', cue: 'Junta los omóplatos hacia atrás y abajo, sin encoger hombros.' },
  // retract_02: con mancuernas ligeras (1kg recomendado, no 2kg — este es
  // un ejercicio de control postural y resistencia, no de fuerza. Más peso
  // del necesario invita a sustituir la retracción controlada por impulso
  // o encogimiento de hombros, justo lo contrario de lo que corrige.
  { id: 'retract_02', name: 'Retracción escapular prono con mancuernas ligeras', group: 'superior_traccion', level: 2, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'mancuernas', weight: 1, cue: 'Boca abajo, brazos colgando con mancuernas ligeras, sube juntando los omóplatos sin encoger los hombros hacia las orejas. El peso es solo para dar algo de resistencia — la calidad del gesto importa mucho más que la carga aquí.' },
  // Banda elástica (equipo nuevo) — resuelve el techo de las mancuernas de
  // 2-8kg en tren superior con tensión continua en vez de solo gravedad.
  // Dos añadidos van directos a la postura de hombros hacia delante:
  // retract_03 (banda, sin necesidad de anclaje — apta en cualquier sitio)
  // y rotator_01 (rotación externa, fortalece el manguito rotador externo
  // que suele estar debilitado cuando los hombros viven todo el día hacia
  // delante frente al ordenador).
  { id: 'retract_03', name: 'Band pull apart (retracción con banda)', group: 'superior_traccion', level: 3, baseReps: 15, baseSeries: 3, tempo: '1-1-1', icon: 'scapula', equip: 'banda', reqEquip: 'banda', cue: 'Brazos extendidos al frente a la altura del pecho, sujeta la banda con ambas manos. Sin doblar los codos, abre los brazos hacia los lados llevando la banda hasta el pecho, aprieta los omóplatos, vuelve controlado. No hace falta anclar la banda a nada.' },
  { id: 'rotator_01', name: 'Rotación externa de hombro con banda', group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura del codo (puerta cerrada, pomo o bisagra). De perfil, codo pegado a las costillas y flexionado 90°, antebrazo cruzado por delante del cuerpo. Rota el antebrazo hacia fuera manteniendo el codo fijo en el costado, vuelve controlado. Directo al manguito rotador — clave para revertir el hombro hacia delante.' },
  // Face pull — el ejercicio de referencia mundial para revertir hombro
  // hacia delante: combina en un solo gesto retracción escapular +
  // rotación externa + trabajo de deltoides posterior, los tres puntos
  // que ya atacabas por separado con retract/rotator/ytw. No sustituye a
  // esos, los corona — es el movimiento que más carga real tolera de
  // todo el bloque postural, así que es donde más fuerza correctiva se
  // puede meter según pase el tiempo. Sin foto real de banda en la base
  // de datos: se usa la de polea (mismo gesto exacto, solo cambia la
  // fuente de resistencia — cable por banda anclada en puerta).
  { id: 'rotator_02', name: 'Face pull con banda', group: 'superior_traccion', level: 2, baseReps: 15, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'banda', reqEquip: 'banda', cue: 'Ancla la banda a la altura de la cara (puerta cerrada). Tira de los dos extremos hacia la cara separando las manos al final del recorrido, como si fueras a tocarte las orejas con los pulgares, codos altos por encima de los hombros. Aprieta omóplatos y deltoides posterior 1 segundo arriba antes de volver controlado.' },
  // rotator_03 (agosto 2026): misma razón que bpress_03 — familia recién
  // priorizada (antes 2 apariciones en 24 sesiones, ahora garantizada
  // cada semana), con solo 2 niveles se quedaba sin margen enseguida.
  // Progresión con mancuerna en vez de banda: tumbado de lado, mancuerna
  // en la mano de arriba, mismo gesto de rotación externa pero contra
  // gravedad en vez de contra banda — recluta el manguito rotador de
  // forma más aislada y exigente, clave para sostener el trabajo de
  // hombro hacia atrás a largo plazo.
  { id: 'rotator_03', name: 'Rotación externa de hombro con mancuerna', group: 'superior_traccion', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'row', equip: 'mancuernas', weight: 2, sides: true, cue: 'Tumbado de lado sobre una colchoneta, codo del brazo de arriba pegado a las costillas y flexionado 90°, mancuerna en esa mano con el antebrazo apoyado sobre el abdomen. Rota el antebrazo hacia arriba hasta que quede vertical, manteniendo el codo pegado al cuerpo todo el recorrido, baja controlado. Cambia de lado a mitad de serie.' },
  // Curl de bíceps: hueco real que no existía en el plan (bíceps solo entraba
  // de rebote en el remo). Con techo de mancuernas en 8kg, la progresión aquí
  // es sobre todo de técnica/tempo, no de carga — por eso curl_03 y curl_04
  // suben dificultad con pausas y técnicas de intensidad, no con más peso.
  { id: 'curl_01', name: 'Curl de bíceps con mancuernas',    group: 'superior_traccion', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'De pie, codos pegados al cuerpo, sube controlado sin balancear la espalda, aprieta arriba antes de bajar.' },
  { id: 'curl_02', name: 'Curl martillo con mancuernas',     group: 'superior_traccion', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Igual que el curl estándar pero con las palmas mirándose entre sí (agarre neutro) — reparte el trabajo entre bíceps y antebrazo.' },
  { id: 'curl_03', name: 'Curl con pausa en contracción máxima', group: 'superior_traccion', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-2-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sube igual, pero mantén 2s de pausa apretando el bíceps arriba antes de bajar controlado. Con el mismo peso, esto ya es más difícil de lo que parece.' },
  { id: 'curl_04', name: 'Curl 21 (rango parcial + completo)', group: 'superior_traccion', level: 4, baseReps: 21, baseSeries: 2, tempo: '1-0-1', icon: 'curl', equip: 'mancuernas', weight: 2, cue: '7 reps de la mitad inferior del recorrido + 7 reps de la mitad superior + 7 reps del recorrido completo, sin soltar el peso entre bloques. Técnica clásica para exprimir más de un peso que ya dominas.' },
  // Zottman curl — el nivel más avanzado de la familia bíceps: sube como
  // un curl normal (palma arriba, bíceps) y baja con la palma girada
  // hacia abajo (pronado, antebrazo extensor). Un solo ejercicio entrena
  // bíceps Y antebrazo en el mismo movimiento — el candidato más directo
  // para volumen de brazo cuando ya dominas el curl 21 y el peso sigue
  // sin dar más de sí.
  { id: 'curl_05', name: 'Zottman curl', group: 'superior_traccion', level: 5, baseReps: 10, baseSeries: 3, tempo: '2-0-3', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sube en curl normal con las palmas hacia arriba. Arriba, gira las muñecas 180° hasta que las palmas miren hacia abajo, y baja despacio en esa posición pronada. Al llegar abajo, gira de nuevo las palmas hacia arriba para la siguiente repetición. La bajada lenta en pronación es la que más trabaja el antebrazo.' },
  // curl_06: equivalente real con banda. No existe una foto de "band
  // curl" con ese nombre exacto en la base de datos pública, así que se
  // reutiliza la foto de curl_01 (misma postura corporal exacta: de pie,
  // codos pegados al cuerpo, subiendo el antebrazo — solo cambia la
  // fuente de resistencia). Igual que con lat_02, pensado para cuando el
  // techo real de tus mancuernas se queda corto.
  { id: 'curl_06', name: 'Curl de bíceps con banda', group: 'superior_traccion', level: 6, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'banda', reqEquip: 'banda', cue: 'Pisa el centro de la banda con ambos pies, sujeta un extremo con cada mano, codos pegados al cuerpo. Sube controlado sin balancear la espalda, aprieta arriba 1s, baja despacio — la banda aprieta más cuanto más subes, así que la parte alta del recorrido es donde más se nota.' },
  // Tríceps dedicado: hasta ahora solo entraba de rebote (fondos, press,
  // flexión triángulo) — mismo hueco que tenía bíceps antes de añadir curl.
  { id: 'tricep_01', name: 'Patada de tríceps (kickback)',  group: 'superior_empuje', level: 1, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Inclinado hacia delante, codo pegado al cuerpo y fijo, extiende el antebrazo hacia atrás hasta estirar del todo. Solo se mueve el antebrazo.' },
  { id: 'tricep_02', name: 'Extensión de tríceps por encima de la cabeza (sentado)', group: 'superior_empuje', level: 2, baseReps: 12, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'Sentado, mancuerna sujeta con ambas manos por encima de la cabeza, baja controlado por detrás de la nuca sin abrir los codos hacia los lados.' },
  { id: 'tricep_03', name: 'Extensión de tríceps a una mano (de pie)', group: 'superior_empuje', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 2, cue: 'De pie, un brazo por encima de la cabeza sujetando la mancuerna, baja por detrás de la nuca manteniendo el codo fijo y apuntando al techo. Más exigente de estabilidad que la versión a dos manos.' },

  // Antebrazo (familia 'wrist', nueva) — hueco real: bíceps/tríceps ya
  // cubiertos pero nada de trabajo directo de muñeca/antebrazo, que es
  // precisamente lo que da grosor visual al brazo entre codo y muñeca.
  // Peso recomendado bajo (1kg) porque el rango de movimiento es pequeño
  // y la articulación de la muñeca no tolera la misma carga que el codo.
  { id: 'wrist_01', name: 'Curl de muñeca (palmas arriba)', group: 'superior_traccion', level: 1, baseReps: 15, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 1, cue: 'Antebrazo apoyado en el muslo o una mesa, palma hacia arriba, sujeta la mancuerna. Sube la muñeca doblando solo la muñeca (el antebrazo no se mueve), baja controlado hasta notar el estiramiento.' },
  { id: 'wrist_02', name: 'Curl de muñeca inverso (palmas abajo)', group: 'superior_traccion', level: 2, baseReps: 15, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'mancuernas', weight: 1, cue: 'Misma posición, palma hacia abajo. Trabaja el extensor del antebrazo — el que da grosor visual y protege la muñeca en el curl de bíceps. Rango pequeño, movimiento lento y controlado.' },
  // wrist_03: progresión real más allá del techo de mancuernas de 1kg —
  // tensión continua de la banda en un rango de movimiento pequeño, que
  // es exactamente donde más se nota la diferencia con un peso muerto.
  { id: 'wrist_03', name: 'Curl de muñeca con banda', group: 'superior_traccion', level: 3, baseReps: 18, baseSeries: 3, tempo: '2-0-2', icon: 'curl', equip: 'banda', reqEquip: 'banda', cue: 'Pisa un extremo de la banda con el pie, sujeta el otro con la mano, antebrazo apoyado en el muslo con la palma hacia arriba. Sube la muñeca contra la resistencia de la banda, aguanta 1s arriba, baja controlado. Rango pequeño, movimiento lento.' },

  // Paseo del granjero — máxima demanda de agarre/antebrazo del circuito,
  // además de core anti-flexión lateral y activación postural bajo carga
  // (hombros atrás, no dejarlos caer hacia delante mientras caminas).
  // Entra en nivel 3 porque exige ya cierta base de estabilidad de tronco.
  { id: 'carry_01', name: 'Paseo del granjero con mancuernas', group: 'cardio', level: 3, baseReps: 30, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'standing', equip: 'mancuernas', weight: 2, cue: 'Una mancuerna en cada mano, camina en el sitio o en línea recta con los hombros atrás y el core apretado — no dejes que los hombros caigan hacia delante. Agarre firme todo el tiempo.' },

  { id: 'plank_01', name: 'Plancha frontal',                 group: 'core', level: 2, baseReps: 35, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'plank', equip: 'peso corporal', cue: 'Línea recta cabeza-talón, abdomen y glúteo activos, no dejes caer la cadera.' },
  { id: 'plank_02', name: 'Plancha lateral',                 group: 'core', level: 3, baseReps: 25, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'sideplank', equip: 'peso corporal', cue: 'Apoyo en antebrazo, cuerpo recto de lado, cadera elevada, no rotes el tronco.' },
  // plank_03: progresión real de la plancha lateral — pierna y brazo de
  // arriba elevados a la vez ("star plank"). La única foto real de la
  // base de datos pública que se acerca es "Push Up to Side Plank": su
  // segundo fotograma muestra exactamente esta posición (plancha lateral
  // con el brazo de arriba extendido al techo), aunque el nombre del
  // ejercicio en la base de datos incluya una flexión previa que aquí no
  // se pide — el nombre y el cue en español ya dejan claro qué se hace,
  // así que se usa esta foto real en vez de la silueta.
  { id: 'plank_03', name: 'Plancha lateral en estrella (pierna y brazo arriba)', group: 'core', level: 4, baseReps: 22, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'sideplank', equip: 'peso corporal', cue: 'Misma base que la plancha lateral: cadera arriba sin tocar el suelo en todo el tiempo. Añade la pierna de arriba elevada y estirada, y el brazo de arriba extendido hacia el techo, ambos a la vez. Si pierdes el equilibrio, baja antes el brazo que la pierna.' },
  { id: 'bird_01', name: 'Bird Dog',                         group: 'core', level: 1, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'birddog', equip: 'peso corporal', cue: 'Brazo y pierna contraria extendidos, cadera estable, sin rotar el tronco.' },
  // bird_02: progresión real (tu histórico marcaba vol=5 en nivel único).
  // Foto real de "Glute Kickback" — misma posición inicial exacta a
  // cuatro patas, aunque en esa foto solo se extiende la pierna (aquí se
  // añade también el brazo contrario, como en bird_01, con la banda
  // dando la resistencia real que faltaba).
  { id: 'bird_02', name: 'Bird Dog con banda', group: 'core', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'birddog', equip: 'banda', reqEquip: 'banda', cue: 'A cuatro patas, banda enlazada alrededor del pie que vas a extender y pisada en el suelo con la rodilla de apoyo contraria. Extiende brazo y pierna contraria a la vez, como en el bird dog normal, notando ahora la resistencia real de la banda al final del recorrido. Cadera estable, sin rotar el tronco.' },
  { id: 'deadbug_01', name: 'Dead Bug',                      group: 'core', level: 2, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'deadbug', equip: 'peso corporal', cue: 'Tumbado, baja brazo y pierna contraria a la vez sin despegar la lumbar del suelo.' },
  // deadbug_02: familia en techo real (nivel 2 era el máximo, volumeBonus
  // alto). Progresión real sin banda ni mancuerna: sujetar la mochila con
  // ambos brazos extendidos hacia el techo durante todo el movimiento
  // exige mucho más control anti-extensión lumbar que el dead bug libre
  // (mismo patrón exacto, ver bird_02 para el precedente de progresión
  // con carga en familias de core). Sin foto real de "dead bug con
  // mochila" en la base pública: se reutiliza la foto real del dead bug
  // estándar (mismo gesto exacto, solo cambia la carga sostenida).
  { id: 'deadbug_02', name: 'Dead Bug con mochila en brazos', group: 'core', level: 3, baseReps: 10, baseSeries: 3, tempo: '2-1-1', icon: 'deadbug', equip: 'mochila', reqEquip: 'mochila', cue: 'Tumbado, mochila sujeta con ambas manos y brazos extendidos hacia el techo durante todo el ejercicio. Baja brazo y pierna contraria a la vez sin despegar la lumbar del suelo ni dejar que la mochila se incline.' },
  { id: 'legraise_01', name: 'Elevación de piernas',         group: 'core', level: 3, baseReps: 12, baseSeries: 3, tempo: '2-0-1', icon: 'legraise', equip: 'peso corporal', cue: 'Tumbado, piernas rectas, sube hasta 90° sin despegar la zona lumbar del suelo.' },
  // Reverse crunch: complemento directo al bloque pélvico matutino
  // (báscula posterior + estiramiento de psoas). Ese bloque es
  // movilidad/activación en frío; esto es fuerza real de abdomen inferior
  // bajo carga, que es lo que sostiene la báscula posterior de pelvis
  // durante el día, no solo por la mañana. Antepulsión pélvica = psoas
  // acortado + abdomen inferior débil — el bloque matutino ataca lo
  // primero, esto ataca lo segundo.
  { id: 'legraise_02', name: 'Reverse crunch', group: 'core', level: 4, baseReps: 12, baseSeries: 3, tempo: '2-1-2', icon: 'legraise', equip: 'peso corporal', cue: 'Tumbado, piernas arriba con cadera y rodilla a 90°, brazos apoyados a los lados sin ayudarte con ellos. Lleva las rodillas hacia el pecho enroscando la pelvis hacia arriba (despegando el glúteo del suelo), no solo doblando cadera. Baja controlado sin dejar caer las piernas de golpe.' },
  { id: 'mtnclimb_01', name: 'Mountain Climbers',            group: 'core', level: 3, baseReps: 24, baseSeries: 3, tempo: 'X-0-X', icon: 'climber', equip: 'peso corporal', cue: 'En posición de plancha, lleva rodillas al pecho alternando rápido, cadera estable.' },
  // mtnclimb_02: familia en techo real (nivel 3 era el máximo, volumeBonus
  // alto). Progresión real sin más impacto: mochila cargada sobre la
  // espalda alta durante el mismo gesto, más exigencia de estabilidad de
  // hombro y core sin añadir salto ni velocidad extra. Sin foto real
  // específica con mochila: se reutiliza la foto real del mountain
  // climber estándar (mismo gesto exacto, solo cambia la carga).
  { id: 'mtnclimb_02', name: 'Mountain Climbers con mochila cargada', group: 'core', level: 4, baseReps: 22, baseSeries: 3, tempo: 'X-0-X', icon: 'climber', equip: 'mochila', reqEquip: 'mochila', cue: 'Misma posición de plancha con la mochila cargada centrada sobre la parte alta de la espalda, bien ajustada. Lleva rodillas al pecho alternando rápido, cadera estable, sin dejar que la mochila se balancee.' },
  { id: 'hollow_01', name: 'Hollow Hold',                    group: 'core', level: 4, baseReps: 25, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'hollow', equip: 'peso corporal', cue: 'Tumbado, lumbar pegada al suelo, brazos y piernas ligeramente elevados formando una "U".' },
  // hollow_02: familia en techo real (nivel 4 era el máximo, volumeBonus
  // alto). Progresión real de un isométrico ya dominado: sujetar la
  // mochila con ambos brazos extendidos por encima del pecho durante
  // todo el mantenimiento, mismo patrón exacto con más brazo de palanca
  // y carga añadida. Sin foto real de "hollow hold cargado" en la base
  // pública: se usa la foto real de trabajo abdominal cargado más
  // cercana en gesto (tronco flexionado sosteniendo peso).
  { id: 'hollow_02', name: 'Hollow Hold con mochila en brazos', group: 'core', level: 5, baseReps: 25, baseSeries: 3, tempo: 'iso', isTimeBased: true, icon: 'hollow', equip: 'mochila', reqEquip: 'mochila', cue: 'Misma posición de "U" tumbado, mochila cargada sujeta con ambas manos y brazos extendidos por encima del pecho durante todo el mantenimiento. Lumbar pegada al suelo, no dejes que la mochila se balancee.' },
  { id: 'russtwist_01', name: 'Giro ruso con mancuerna',     group: 'core', level: 3, baseReps: 20, baseSeries: 3, tempo: '1-0-1', icon: 'twist', equip: 'mancuernas', weight: 2, cue: 'Sentado, tronco inclinado atrás 45°, gira la mancuerna de lado a lado tocando el suelo. Aprieta el oblicuo del lado hacia el que giras.' },
  // Progresión más exigente — antes esta familia se quedaba siempre en el
  // mismo nivel sin margen de avanzar; con pies elevados el core tiene que
  // estabilizar sin apoyo, mucho más oblicuo implicado.
  { id: 'russtwist_02', name: 'Giro ruso con pies elevados', group: 'core', level: 4, baseReps: 16, baseSeries: 3, tempo: '1-0-1', icon: 'twist', equip: 'mancuernas', weight: 2, cue: 'Misma posición que el giro ruso, pero con los pies despegados del suelo. Mucho más exigente para el oblicuo y el core profundo — baja el número de reps si notas que pierdes la forma.' },

  { id: 'jj_01', name: 'Jumping Jacks',                      group: 'cardio', level: 1, baseReps: 30, baseSeries: 3, tempo: 'X-0-X', icon: 'jj', equip: 'peso corporal', cue: 'Salta abriendo piernas y brazos a la vez, aterriza suave con rodillas ligeramente flexionadas.' },
  // jj_02: familia en techo real (nivel 1 era el único que existía,
  // volumeBonus alto). Progresión real sin añadir impacto extra al
  // gesto de salto (ya es el único nivel de la familia): mochila cargada
  // sobre la espalda alta durante el mismo movimiento, más exigencia
  // cardiovascular y de estabilidad de core sin cambiar el patrón de

// Versión alfabética de FOOD_DB para el desplegable — el array base se
// mantiene en su orden original (agrupado con comentarios por tipo de
// alimento, más fácil de mantener), pero listar 45 alimentos sin orden
// alfabético en un desplegable de móvil es casi imposible de recorrer
// rápido. localeCompare con 'es' para que ordene bien acentos y ñ.
const FOOD_DB_SORTED = [...FOOD_DB].sort((a, b) => a.name.localeCompare(b.name, 'es'));
// Semáforo de salubridad: verde = ayuda al objetivo (recuperación,
// saciedad, densidad nutricional), amarillo = neutro/moderación, rojo =
// entorpece el ritmo de recuperación o el déficit (alcohol, ultraprocesado,
// azúcar añadida sin apenas proteína/fibra). Es un criterio de "para ESTE
// plan", no una etiqueta médica general.
function semaforoEmoji(color) {
  return color === 'verde' ? '🟢' : color === 'amarillo' ? '🟡' : color === 'rojo' ? '🔴' : '';
}
function foodKcal(food, amount) {
  if (!food) return 0;
  return food.unit === 'ud' ? Math.round(food.kcalPerUnit * amount) : Math.round(food.kcalPer100 * amount / 100);
}
function foodProtein(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.proteinPerUnit || 0) * amount : (food.proteinPer100 || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
// Carbohidrato/grasa/fibra por ración — mismo patrón que foodProtein.
// Todos los alimentos de FOOD_DB ya llevan carbG/fatG/fiberG por 100g
// (o por unidad, para los que usan kcalPerUnit) desde la ampliación de
// macros completos (agosto 2026).
function foodCarb(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.carbG || 0) * amount : (food.carbG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
function foodFat(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.fatG || 0) * amount : (food.fatG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
function foodFiber(food, amount) {
  if (!food) return 0;
  const raw = food.unit === 'ud' ? (food.fiberG || 0) * amount : (food.fiberG || 0) * amount / 100;
  return Math.round(raw * 10) / 10;
}
// Normalización no destructiva de registros históricos: si una entrada
// antigua tiene foodId y cantidad pero no carb/fat/fiber, los recuperamos
// automáticamente desde FOOD_DB al mostrar/calcular. No se reescribe el
// histórico hasta que el usuario vuelva a guardar esa comida.
function normalizeFoodItem(item) {
  if (!item || !item.foodId) return item;
  const food = FOOD_DB.find(f => f.id === item.foodId);
  if (!food || !item.amount) return item;
  return {
    ...item,
    carbG: item.carbG != null ? item.carbG : foodCarb(food, Number(item.amount) || 0),
    fatG: item.fatG != null ? item.fatG : foodFat(food, Number(item.amount) || 0),
    fiberG: item.fiberG != null ? item.fiberG : foodFiber(food, Number(item.amount) || 0)
  };
}

// Total real de una comida a partir de los alimentos añadidos con el
// calculador (calEntry.realFoods[mealKey]) — si el usuario ha metido al
// menos un alimento ahí, ese total manda sobre la estimación fija del
// plan (checkbox), porque es más preciso.
function mealRealKcal(calEntry, mealKey) {
  const items = calEntry.realFoods && calEntry.realFoods[mealKey];
  if (!items || !items.length) return null;
  return items.reduce((sum, it) => sum + it.kcal, 0);
}
function mealDisplayKcal(calEntry, mealKey, planChecked, planKcal) {
  const real = mealRealKcal(calEntry, mealKey);
  if (real != null) return real;
  return planChecked ? planKcal : 0;
}
// Mismo mecanismo que mealDisplayKcal pero para proteína: antes solo
// sumaba si usabas la calculadora manual, lo que causaba el bug real de
// "0g de proteína" aunque hubieras marcado todas las comidas del plan.
// Ahora, igual que con las kcal, marcar el check usa la estimación de
// proteína de esa comida (planProteinG) si no has registrado el detalle
// real — consistente en los dos sitios en vez de solo en uno.
function mealRealProtein(calEntry, mealKey) {
  const items = calEntry.realFoods && calEntry.realFoods[mealKey];
  if (!items || !items.length) return null;
  return Math.round(items.reduce((sum, it) => sum + (it.proteinG || 0), 0) * 10) / 10;
}
function mealDisplayProtein(calEntry, mealKey, planChecked, planProteinG) {
  const real = mealRealProtein(calEntry, mealKey);
  if (real != null) return real;
  return planChecked ? (planProteinG || 0) : 0;
}

// Totales nutricionales de un día: ÚNICA fuente para Nutrición, Hábitos y
// el dashboard. Una comida marcada como "seguí el plan" usa la estimación
// del plan; si tiene alimentos reales registrados, esos sustituyen esa comida.
// Así los tres apartados muestran exactamente el mismo dato y no hay dos
// cálculos distintos que puedan desincronizarse.
function getDayNutritionTotals(state, key) {
  const calEntry = (state.calorieLog && state.calorieLog[key]) || { meals:{}, realFoods:{} };
  const d = new Date(key + 'T00:00:00');
  const jsDay = d.getDay();
  const isoDay = jsDay === 0 ? 7 : jsDay;
  const dayPlan = NUTRITION_PLAN.find(p => p.day === isoDay);
  if (!dayPlan) return null;
  const mealItems = [
    { key:'breakfast', kcal:NUTRITION_COFFEE.kcal, proteinG:NUTRITION_COFFEE.proteinG },
    { key:'midMorning', kcal:dayPlan.midMorningKcal, proteinG:dayPlan.midMorningProteinG },
    { key:'lunch', kcal:dayPlan.lunchKcal, proteinG:dayPlan.lunchProteinG },
    { key:'merienda', kcal:NUTRITION_MERIENDA.kcal, proteinG:NUTRITION_MERIENDA.proteinG },
    { key:'dinner', kcal:dayPlan.dinnerKcal, proteinG:dayPlan.dinnerProteinG }
  ].map(m => ({...m, planMacros:planMealMacros(dayPlan.day,m.key)}));
  let kcal=0, protein=0, carb=0, fat=0, fiber=0, any=false;
  mealItems.forEach(m => {
    const checked=!!(calEntry.meals && calEntry.meals[m.key]);
    const realItems=(calEntry.realFoods && calEntry.realFoods[m.key]) || [];
    if (checked || realItems.length) any=true;
    kcal += mealDisplayKcal(calEntry,m.key,checked,m.kcal);
    protein += mealDisplayProtein(calEntry,m.key,checked,m.proteinG);
    const mm=mealDisplayMacros(calEntry,m.key,checked,m.planMacros);
    carb += mm.carbG; fat += mm.fatG; fiber += mm.fiberG;
  });
  kcal += Number(calEntry.extraKcal) || 0;
  return {
    kcalTotal: any || (Number(calEntry.extraKcal)||0)>0 ? Math.round(kcal*10)/10 : null,
    kcalTarget: dayPlan.kcal,
    proteinTotal: any ? Math.round(protein*10)/10 : null,
    carbTotal: any ? Math.round(carb*10)/10 : null,
    fatTotal: any ? Math.round(fat*10)/10 : null,
    fiberTotal: any ? Math.round(fiber*10)/10 : null,
    dayPlan,
    hasFoodOrPlan: any
  };
}

// Construye el bloque postural del día: rota por día del mes (no por día

function buildTodaysPostureBlock(hasBanda) {

      : { id: 'retract_am', name: 'Retracción escapular isométrica', duration: 30, cue: 'De pie o sentado, brazos a los lados. Junta los omóplatos hacia atrás y abajo con fuerza real, como si quisieras sujetar un lápiz entre ellos, sin encoger los hombros hacia las orejas. Aguanta la tensión, no es un movimiento rápido — es fuerza isométrica sostenida.', icon: 'scapula' };
    // BUG REAL encontrado y corregido (confirmado con Node antes de
    // entregar): esta rama reconstruía la lista a mano con índices fijos
    // [0] y [1] e ignoraba cualquier elemento posterior de
    // POSTURE_MORNING_DAY2 — wall_slide_am (estiramiento de pecho) ya se
    // perdía silenciosamente 1 de cada 3 mañanas desde antes de esta
    // sesión, y ahora también se habría perdido pushup_plus_am. Fix:
    // insertar retractSlot en su sitio dentro de la lista completa en vez
    // de reconstruirla a mano con índices que quedan desactualizados en
    // cuanto se añade algo nuevo al día 2.
    return [POSTURE_MORNING_DAY2[0], POSTURE_MORNING_DAY2[1], retractSlot, ...POSTURE_MORNING_DAY2.slice(2)];
  }
  return rotationIdx === 2 ? POSTURE_MORNING_DAY3 : POSTURE_MORNING_DAY1;
}

  // entre vueltas depende más del sueño reciente que de la fase del mes.
  const sleepDates = Object.keys(state.sleepLog || {}).sort().slice(-3);

  // adicional para ajustar vueltas, nunca para cambiar ejercicios, niveles o
  // historial. El dolor ya entra invertido en el índice (5 = mejor ausencia
  // de dolor), por lo que una puntuación baja reduce una vuelta como máximo.

  }

  // vueltas aunque el RPE reciente esté bajo — RPE bajo en descarga es el
  // objetivo de la semana, no una señal de margen. Tope duro en 2.
  const preCapRecommended = recommended;

  // de "hay margen para más" quedaría contradicho por el número final sin
  // explicación — se añade una aclaración explícita en vez de dejarlo caer.
  if (phaseKey === 4 && preCapRecommended > recommended) {
    reasons.push('en fase Descarga se prioriza bajar la exigencia total sobre aprovechar ese margen, aunque el RPE esté bajo');

  recommended = Math.max(1, Math.min(5, recommended));
  if (!reasons.length) reasons.push(`base estándar de la fase ${PHASES[phaseKey].name}`);

}

// El esfuerzo estimado ya no es fijo por fase: sube con cada vuelta extra
// que haces ese día (+0.4 RPE por vuelta después de la primera), reflejando
// la fatiga real de encadenar series sin descanso completo entre vueltas —

function estimateRpe(actualReps, targetReps, phaseKey, roundIdx = 0) {
  const base = { 1: 7, 2: 7.5, 3: 8.5, 4: 6 }[phaseKey] || 7;

  }
  const validSets = setsDone.filter(x => Number.isFinite(Number(x.reps)) && Number.isFinite(Number(x.rpe)));
  if (!validSets.length) {
    const levelNow = getExerciseLevel(state, exercise.id, exercise.level);
    return { levelBefore: levelNow, levelAfter: levelNow, progressed: false, regressed: false, decision: 'invalid' };
  }

  const avgReps = validSets.reduce((sum, x) => sum + Number(x.reps), 0) / validSets.length;
  const avgRpe = validSets.reduce((sum, x) => sum + Number(x.rpe), 0) / validSets.length;
  const levelBefore = getExerciseLevel(state, exercise.id, exercise.level);
  const volBefore = Math.max(0, Math.min(MAX_VOLUME_BONUS_DEFAULT, getVolumeBonus(state, exercise.id)));
  let levelAfter = levelBefore;
  let volAfter = volBefore;
  let decision = 'maintain';
  const pctOfTarget = avgReps / Math.max(1, targetReps);
  const familyPrefix = exercise.id.split('_')[0];

    const nextVariant = findVariantByLevel(familyPrefix, levelBefore + 1, state);

    ...(state.exerciseLevels[exercise.id] || {}),
    level: levelAfter,
    volumeBonus: volAfter,
    updatedAt: now,
    lastDecision: decision

    date: now, exerciseId: exercise.id, phase: phaseKey,
    pctOfTarget: Number(pctOfTarget.toFixed(3)), avgRpe: Number(avgRpe.toFixed(2)),
    levelBefore, levelAfter, volumeBefore: volBefore, volumeAfter: volAfter, decision

    date: now, phase: phaseKey, exerciseId: exercise.id, setsDone: validSets,
    levelBefore, levelAfter,

// Familias correctivas de puntos débiles identificados en este plan

// 'wrist' se añade a prioritarias porque el antebrazo es objetivo
// explícito del usuario (brazos poco voluminosos) y, sin esto, competía
// en igualdad de condiciones con curl/tricep dentro de 'superior_traccion'

// el plan no tenía ningún ejercicio que lo aislara bajo tensión

// dos frentes que más se percibe visualmente en este sujeto (hombro hacia
// delante por años de oficina, glúteo sin volumen por sedestación

// 'bpress' y 'fly' priorizados (agosto 2026): el usuario reporta

// abultado en la zona baja. Cruce con datos reales: `bpress` (variante 2

// `fly` estaba estancado en su variante plana (nivel 3) 3+ semanas sin

const PRIORITY_FAMILIES = ['slu', 'retract', 'ytw', 'wrist', 'rotator', 'hipabd', 'hip', 'bpress', 'fly'];

  lumbar: ['hip', 'mtnclimb', 'russtwist', 'legraise'],
  muneca: ['wrist', 'curl', 'pu', 'bpress', 'press'],

// P1.5 — ajuste conservador de selección por volumen reciente.
// Solo influye en qué familia se elige cuando hay varias opciones válidas;
// no cambia niveles, series objetivo, reps ni historial. Se activa únicamente

function getRecentMuscleEffectiveVolume(state, days=14) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  const totals = {};

  (state.history || []).forEach(h => {
    const t = new Date(h.date).getTime();
    if (!Number.isFinite(t) || t < cutoff || !h.exerciseId) return;
    seenDays.add(String(h.date).slice(0,10));
    const prefix = h.exerciseId.split('_')[0];
    const focuses = EFFECTIVE_VOLUME_FOCUS[prefix];
    if (!focuses || !Array.isArray(h.setsDone)) return;
    const share = 1 / focuses.length;
    h.setsDone.forEach(set => {
      const factor = effectiveSetFactor(set.rpe);
      focuses.forEach(m => totals[m] = (totals[m] || 0) + factor * share);

}

function familyVolumePriority(state, prefix, recent) {
  const focuses = EFFECTIVE_VOLUME_FOCUS[prefix] || [];
  if (!focuses.length || recent.sessions < 3) return 0;
  return focuses.reduce((sum, m) => sum + (recent.totals[m] || 0), 0) / focuses.length;

  if (recent.sessions < 3) return false;

function pickExercisesForTemplate(state, template) {
  const picked = []; const groups = template.groups; const usedIds = new Set();

  const avoidFamilies = (todayPainArea && PAIN_AVOID_FAMILIES[todayPainArea]) || [];
  const notAvoided = e => !avoidFamilies.includes(e.id.split('_')[0]);
  const recentVolume = getRecentMuscleEffectiveVolume(state, 14);
  const volumeBalancing = shouldUseVolumeBalancing(state, recentVolume);

  // Paso 1: reserva un hueco a la familia correctiva prioritaria de cada
  // grupo de hoy (si el grupo tiene alguna), antes de repartir el resto.
  // Así "zancada lateral" y el trabajo postural aparecen cada semana en
  // vez de cuando le toque en la rotación.
  //
  // BUG REAL ENCONTRADO Y CORREGIDO (agosto 2026): 'superior_traccion'
  // tiene CUATRO familias prioritarias a la vez (retract/ytw/wrist/
  // rotator) e 'inferior' tiene TRES (slu/hipabd/hip), pero este paso
  // solo reservaba UN hueco por grupo y siempre cogía `[0]` — la primera
  // familia por orden de aparición en EXERCISES. Con datos reales de 24
  // sesiones (150 ejercicios registrados): ytw salió 12 veces, retract 11,
  // pero WRIST (la única familia dedicada a antebrazo) solo 1 vez, y
  // ROTATOR solo 2. Mismo patrón en 'inferior': slu salió 9 veces, hip 5,
  // pero HIPABD (glúteo medio/estabilidad de cadera) solo 2. No eran las
  // familias menos importantes las que salían menos — eran las que
  // estaban escritas más tarde en el array. Fix: cuando hay varias
  // familias prioritarias empatadas en un mismo grupo, se turnan en
  // round-robin (por `totalSessionsDone`) en vez de ganar siempre la
  // misma. Esto reparte de forma justa TANTO el trabajo de antebrazo
  // (wrist) y manguito rotador (rotator) dentro de 'superior_traccion',
  // COMO el de glúteo medio (hipabd) dentro de 'inferior' — la causa real
  // de la poca variedad que reportas en antebrazo y glúteo no era el
  // catálogo (ya tenía suficientes ejercicios), era este reparto injusto.
  for (const group of groups) {
    if (picked.length >= EXERCISES_PER_SESSION) break;
    const priorityCandidates = EXERCISES.filter(e => e.group === group && PRIORITY_FAMILIES.includes(e.id.split('_')[0]) && !usedIds.has(e.id.split('_')[0]) && hasEquip(e) && notAvoided(e));
    if (priorityCandidates.length) {
      const priorityFamilies = [...new Set(priorityCandidates.map(e => e.id.split('_')[0]))];
      const prefix = volumeBalancing
        ? priorityFamilies.slice().sort((a,b) => familyVolumePriority(state,a,recentVolume) - familyVolumePriority(state,b,recentVolume))[0]

      const variant = findVariantByLevel(prefix, effectiveLevel, state) || priorityCandidates.find(e => e.id.split('_')[0] === prefix);

  // SEGUNDO INTENTO DE FIX (el primero, usar totalSessionsDone en el
  // módulo, empeoró las cosas — verificado simulando 120 sesiones: jj/
  // hik/skater/burpee/carry caían a 4 apariciones y slu subía a 60).
  // Causa real del primer fallo: cualquier índice basado en módulo se
  // rompe si el grupo no aparece todas las sesiones (aquí 'cardio' solo
  // sale ciertos días de la plantilla de 6) — según la relación entre ese
  // ciclo y el número de familias competidoras, el módulo puede visitar
  // solo una fracción de los restos posibles para siempre, sin importar
  // cuánto se simule (trampa de aritmética modular, no falta de tiempo).
  // Fix real: en vez de calcular un índice, se elige directamente la
  // familia con MENOS apariciones reales en el historial — autocorrectivo
  // de verdad, no depende de que ningún ciclo de sesiones "encaje"

      // sesión, para que si el mismo grupo se repite (día full body con
      // varios grupos) no elija la misma familia dos veces por no haberse
      // actualizado el contador real todavía.

// había forma de subir la elevación lateral a 4kg sin subir también el
// Y-T-W a la vez. Ahora cada familia puede tener su propio peso

// Criterio: si el usuario ya está en la variante más difícil disponible con
// mancuernas/mochila para una familia de ejercicio, y lleva volumeBonus >= 3
// (varias sesiones seguidas cumpliendo o superando el objetivo con buen RPE
// sin poder subir de nivel porque ya no hay variante más difícil), significa
// que el peso actual se le ha quedado corto — el próximo paso lógico es
// aumentar la carga externa, no añadir más repeticiones sin límite.
function computeWeightAdvice(state) {
  const families = [...new Set(EXERCISES.map(e => e.id.split('_')[0]))];
  // dumbbell/backpack se mantienen (texto agregado que ya se usaba en otro
  // sitio); items es la lista accionable nueva, con prefijo y peso actual
  // de CADA familia concreta, para poder subir cada una por separado.
  const advice = { dumbbell: [], backpack: [], items: [] };
  for (const prefix of families) {
    const family = EXERCISES.filter(e => e.id.split('_')[0] === prefix);

    }

  // si un día no entrenas, esa casilla de la rotación no desaparece: la
  // próxima vez que entrenes (sea el día que sea) retoma exactamente donde
  // lo dejaste. Y si haces una sesión extra el mismo día, esto mismo hace
  // que te toque automáticamente la SIGUIENTE casilla (grupos musculares
  // distintos a los que acabas de trabajar), nunca repetir en caliente.

    const picked = pickExercisesForTemplate(state, template);
    return { day: template.day, name: template.name, exercises: picked.map(ex => ({ ...withCurrentWeight(ex, state), targetReps: computeTargetReps(ex, phaseKey, state), targetSeries: computeTargetSeries(ex, phaseKey), restSec: computeRestSec(ex, phaseKey) })) };

    rounds: roundsCompleted,
    phase: state.cycleWeek,
    circuitDurationSec: Math.max(0, Math.round(circuitDurationSec || 0)),
    hypoDurationSec: 0,

    const wasDescarga = state.cycleWeek >= 4;

    // mejor momento fisiológico para probar más peso (cuerpo fresco tras el

// aquí y no en completeSession.

  if (!entry) return;
  entry.hypoDurationSec = Math.max(0, Math.round(hypoDurationSec || 0));

  saveState(state);
}

// Valoración general de la sesión completa (distinta de la valoración por
// serie que ya existe durante el circuito) — cómo sintió el sujeto el
// entreno en conjunto, guardada para poder revisarla después en Progreso.
// A propósito NO alimenta applyResult ni ningún cálculo de subida/bajada
// de nivel: es solo un dato histórico para que el sujeto (y quien revise
// el código después) tenga el punto de vista humano de cada sesión, nunca
// una excusa para bajar nivel — eso ya lo protege el motor de progresión
// real, basado en reps y RPE por serie, no en esta valoración global.
function rateLastSession(state, rating) {
  const entry = state.sessionLog[state.sessionLog.length - 1];
  if (!entry) return;
  entry.effortRating = rating; // 'dificil' | 'normal' | 'facil'
  saveState(state);
}

// Hipopresivos matutinos sueltos: se registran en el mismo calendario/stats
// (tiempo y calorías) pero como entrada independiente — no suman "vuelta"
// de circuito ni cuentan para el ciclo semanal de fases (eso solo avanza al
// completar el entreno del día).
function logStandaloneHypo(state, hypoDurationSec) {
  const sec = Math.max(0, Math.round(hypoDurationSec || 0));
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: 0,
    phase: state.cycleWeek,
    circuitDurationSec: 0,
    hypoDurationSec: sec,
    calories: estimateCalories(0, sec, state.cycleWeek),
    standalone: true,
  });
  saveState(state);
}

// Descompresión en barra: mismo mecanismo de registro que la rutina
// matutina (standalone:true, no cuenta como vuelta de circuito ni afecta
// al ciclo de fases), pero con su propia marca `barHang:true` para poder
// llevar una racha separada — no es lo mismo "hice postura+hipopresivos"
// que "hice la barra en el trabajo", y mezclarlas en una sola racha
// ocultaría cuál de las dos se está dejando de lado.
function logBarDecompression(state, sec) {
  state.sessionLog.push({
    date: new Date().toISOString(),
    rounds: 0,
    phase: state.cycleWeek,
    circuitDurationSec: 0,
    hypoDurationSec: Math.max(0, Math.round(sec || 0)),
    calories: 0,
    standalone: true,
    barHang: true,
  });
  saveState(state);
}

  const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180;
  const mx = ox + len1 * Math.sin(r1), my = oy + len1 * Math.cos(r1);

}

function useFigureLoop(period, active) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) % period) / period), 55);
    return () => clearInterval(id);
  }, [period, active]);
  return t;
}
function triWave(t) { return t < 0.5 ? t * 2 : (1 - t) * 2; }

function useFlip(period) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setOn(o => !o), period);
    return () => clearInterval(id);
  }, [period]);
  return on;
}

// Visual de un ejercicio: foto real (flipbook 2 fotogramas) si existe
// una correspondencia verificada para ESE ejercicio exacto; si no, la
// silueta animada por FK como respaldo (nunca se rompe la pantalla ni
// se repite la foto de otro ejercicio distinto).
// Divide el texto de ejecución en pasos numerados — no hay guiones escritos
// a mano por ejercicio (47 ejercicios sería inmantenible), así que se separa
// por frases; en la práctica da 2-4 pasos claros por ejercicio, que es
// justo el nivel de detalle que cabe bien en una pantalla de móvil.
function splitCueSteps(cue) {
  return (cue || '').split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ])/).map(s => s.trim()).filter(Boolean);
}

// MEJORA REAL (agosto 2026): antes, un solo fallo de carga de imagen
// (típico con señal móvil débil — confirmado por el usuario con capturas
// reales mostrando 4G de 1 barra) marcaba la foto como "rota" para
// siempre en esa sesión de la pantalla, cayendo a la silueta aunque la
// foto real siguiera perfectamente disponible (verificado con curl: las
// URLs seguían dando HTTP 200). No era un error de datos ni de código —
// el mapeo a la foto real seguía intacto — era un fallo de red puntual
// sin reintento. Fix: hasta 2 reintentos con pequeño retraso antes de
// caer a silueta de verdad; `key=${attempt}` fuerza que el navegador
// vuelva a intentar la descarga en vez de reusar el fallo cacheado.
const PHOTO_MAX_RETRIES = 2;
function ExerciseVisual({ exId, iconKey, size = 150, bleed = false }) {
  const entry = EXERCISE_TO_PHOTO[exId];
  const [attempt, setAttempt] = useState(0);
  const flip = useFlip(750);
  const broken = attempt > PHOTO_MAX_RETRIES;
  function handleError() {
    if (attempt < PHOTO_MAX_RETRIES) setTimeout(() => setAttempt(a => a + 1), 600);
    else setAttempt(PHOTO_MAX_RETRIES + 1);
  }
  if (!entry || broken) return html`<div class=${bleed ? 'bleed-figure-fallback' : ''}><${Figure} iconKey=${iconKey} size=${bleed ? 230 : size} /></div>`;
  if (typeof entry === 'object') {
    return html`
      <div class=${bleed ? 'photo-wrap-bleed' : 'photo-wrap'} style=${bleed ? undefined : { width: size, height: size }}>
        <img key=${attempt} src=${entry.url} alt="" style=${{ background: '#fff', objectFit: bleed ? 'cover' : 'contain', padding: bleed ? 0 : '8px' }} onError=${handleError} />
        ${entry.credit ? html`<span class="photo-credit">${entry.credit}</span>` : null}
      </div>
    `;
  }
  return html`
    <div class=${bleed ? 'photo-wrap-bleed' : 'photo-wrap'} style=${bleed ? undefined : { width: size, height: size }}>
      <img key=${attempt} src=${`${PHOTO_BASE}${entry}/${flip ? 1 : 0}.jpg`} alt="" onError=${handleError} />
    </div>
  `;
}

// Igual que ExerciseVisual pero para pasos de calentamiento/estiramiento,
// que guardan la foto directamente como nombre de carpeta (step.photo) en

function BleedPhoto({ folder, iconKey }) {
  const [attempt, setAttempt] = useState(0);
  const flip = useFlip(750);
  const broken = attempt > PHOTO_MAX_RETRIES;

    if (attempt < PHOTO_MAX_RETRIES) setTimeout(() => setAttempt(a => a + 1), 600);
    else setAttempt(PHOTO_MAX_RETRIES + 1);
  }
  if (!folder || broken) return html`<div class="bleed-figure-fallback"><${Figure} iconKey=${iconKey} size=${230} /></div>`;
  return html`<div class="photo-wrap-bleed"><img key=${attempt} src=${`${PHOTO_BASE}${folder}/${flip ? 1 : 0}.jpg`} alt="" onError=${handleError} /></div>`;
}

function Figure({ iconKey, size = 140, phase, vivid = true }) {
  const poseKey = ICON_TO_POSE[iconKey] || 'vacuum';
  const t = useFigureLoop(1450, phase == null);
  const p = phase != null ? phase : triWave(t);
  const svg = buildFigureMarkup(poseKey, p, vivid);
  return html`<div class="figure-wrap" style=${{ width: size, height: size * 1.25 }}>
    <svg viewBox="0 0 120 150" style=${{ width: '100%', height: '100%' }} dangerouslySetInnerHTML=${{ __html: svg }} />
  </div>`;
}

// Construye el SVG completo (torso + cabeza + 2 brazos + 2 piernas) por FK real,
// con gradientes de volumen, articulaciones redondeadas, manos/pies y sombra
// de suelo para una lectura mucho más realista del movimiento.
function buildFigureMarkup(poseKey, phase, vivid) {
  const cfg = FIG_POSES[poseKey] || FIG_POSES.vacuum;
  const A = cfg.A, B = cfg.B;
  const torso = lerp(A.torso, B.torso, phase), dy = lerp(A.dy, B.dy, phase);
  const legL = pairL(A.legL, B.legL, phase), legR = pairL(A.legR, B.legR, phase);
  const armL = pairL(A.armL, B.armL, phase), armR = pairL(A.armR, B.armR, phase);
  const orient = A.orient || 0;
  const { hipY, shY, headR, thigh, shin, uarm, farm, hipDx, shDx } = FIG;
  const torsoLen = hipY - shY;
  const lLeg = fkPoint(0, 0, thigh, legL[0], shin, legL[1]);
  const rLeg = fkPoint(0, 0, thigh, legR[0], shin, legR[1]);
  const lArm = fkPoint(0, 0, uarm, armL[0], farm, armL[1]);
  const rArm = fkPoint(0, 0, uarm, armR[0], farm, armR[1]);
  const bodyC = vivid ? 'url(#gBody)' : 'var(--text-dim)';
  const armC = vivid ? 'url(#gArm)' : 'var(--text-dim)';
  const legC = vivid ? 'url(#gLeg)' : 'var(--text-dim)';
  const belly = poseKey === 'vacuum' ? `<ellipse cx="0" cy="${-torsoLen * 0.42}" rx="${lerp(14, 7, triWave((phase + 0.5) % 1))}" ry="9" fill="var(--bg)" opacity="0.6"/>` : '';
  const lFootAng = legL[0] + legL[1], rFootAng = legR[0] + legR[1];
  const defs = `
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.body}"/><stop offset="100%" stop-color="${COL.bodyDark}"/>
      </linearGradient>
      <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${COL.arm}"/><stop offset="100%" stop-color="${COL.armDark}"/>
      </linearGradient>
      <linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${COL.leg}"/><stop offset="100%" stop-color="${COL.legDark}"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>`;
  const shadow = `<ellipse cx="60" cy="132" rx="${orient !== 0 ? 40 : 26}" ry="7" fill="url(#gShadow)"/>`;
  return `
    ${defs}
    ${shadow}
    <g transform="translate(60 ${hipY + dy}) rotate(${orient} 0 ${-dy})">
      <line x1="${-hipDx}" y1="0" x2="${lLeg.mx}" y2="${lLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${lLeg.mx - hipDx}" y1="${lLeg.my}" x2="${lLeg.ex - hipDx}" y2="${lLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${lLeg.mx - hipDx * 0.5}" cy="${lLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${lLeg.ex - hipDx + 6 * Math.sin(lFootAng * Math.PI / 180)}" cy="${lLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${lFootAng * 0.4} ${lLeg.ex - hipDx} ${lLeg.ey})"/>
      <line x1="${hipDx}" y1="0" x2="${rLeg.mx}" y2="${rLeg.my}" stroke="${legC}" stroke-width="17" stroke-linecap="round"/>
      <line x1="${rLeg.mx + hipDx}" y1="${rLeg.my}" x2="${rLeg.ex + hipDx}" y2="${rLeg.ey}" stroke="${legC}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${rLeg.mx + hipDx * 0.5}" cy="${rLeg.my}" r="7.5" fill="${legC}"/>
      <ellipse cx="${rLeg.ex + hipDx + 6 * Math.sin(rFootAng * Math.PI / 180)}" cy="${rLeg.ey + 4}" rx="9" ry="5" fill="${legC}" transform="rotate(${rFootAng * 0.4} ${rLeg.ex + hipDx} ${rLeg.ey})"/>
      <g transform="rotate(${torso})">
        <rect x="-6" y="${-torsoLen - 8}" width="12" height="12" rx="5" fill="${bodyC}"/>
        <path d="M -21,${-torsoLen + 2} Q -22,${-torsoLen - 6} -12,${-torsoLen - 9} Q 0,${-torsoLen - 12} 12,${-torsoLen - 9} Q 22,${-torsoLen - 6} 21,${-torsoLen + 2} L 14,-6 Q 15,4 8,10 L -8,10 Q -15,4 -14,-6 Z" fill="${bodyC}"/>
        <path d="M -13,${-torsoLen + 10} Q 0,${-torsoLen + 4} 13,${-torsoLen + 10} L 13,${-torsoLen + 22} Q 0,${-torsoLen + 16} -13,${-torsoLen + 22} Z" fill="#000" opacity="0.08"/>
        <circle cx="0" cy="${-torsoLen - headR - 10}" r="${headR}" fill="${bodyC}"/>
        <path d="M ${-headR + 1},${-torsoLen - headR - 15} Q 0,${-torsoLen - headR - 24} ${headR - 1},${-torsoLen - headR - 15} Q ${headR - 1},${-torsoLen - headR - 20} 0,${-torsoLen - headR - 19} Q ${-headR + 1},${-torsoLen - headR - 20} ${-headR + 1},${-torsoLen - headR - 15} Z" fill="#000" opacity="0.16"/>
        ${belly}
        <line x1="${-shDx}" y1="${-torsoLen}" x2="${lArm.mx - shDx}" y2="${lArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${lArm.mx - shDx}" cy="${lArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${lArm.mx - shDx}" y1="${lArm.my - torsoLen}" x2="${lArm.ex - shDx}" y2="${lArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${lArm.ex - shDx}" cy="${lArm.ey - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${shDx}" y1="${-torsoLen}" x2="${rArm.mx + shDx}" y2="${rArm.my - torsoLen}" stroke="${armC}" stroke-width="13" stroke-linecap="round"/>
        <circle cx="${rArm.mx + shDx}" cy="${rArm.my - torsoLen}" r="6" fill="${armC}"/>
        <line x1="${rArm.mx + shDx}" y1="${rArm.my - torsoLen}" x2="${rArm.ex + shDx}" y2="${rArm.ey - torsoLen}" stroke="${armC}" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="${rArm.ex + shDx}" cy="${rArm.ey - torsoLen}" r="6" fill="${armC}"/>
      </g>
    </g>`;
}

function fmtTime(s) { const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec.toString().padStart(2, '0')}`; }
function useCountdown(initial, onComplete, running) {
  const [remaining, setRemaining] = useState(initial);
  const cb = useRef(onComplete); cb.current = onComplete;
  const prevRunning = useRef(false);
  // Al activarse (running pasa de false a true), el valor debe partir SIEMPRE
  // de `initial`, nunca del remanente de la vez anterior (p.ej. el "0" con el
  // que terminó el ciclo pasado). Corregirlo aquí, durante el render, evita
  // que el efecto de abajo llegue a ver ese remanente y se autocomplete al
  // instante — que es lo que provocaba el salto de un ejercicio entero al
  // pulsar "Saltar descanso" (un fix anterior que solo corregía esto dentro
  // de un useEffect no bastaba: ambos efectos del mismo hook se ejecutan en
  // la misma pasada de render con el valor todavía obsoleto). Verificado con
  // un arnés de pruebas real (React + temporizadores simulados) antes de
  // aplicar este cambio.
  let effectiveRemaining = remaining;
  if (running && !prevRunning.current && remaining !== initial) {
    setRemaining(initial);
    effectiveRemaining = initial;
  }
  prevRunning.current = running;
  useEffect(() => {
    if (!running) return;
    if (effectiveRemaining <= 0) { cb.current && cb.current(); return; }
    const t = setTimeout(() => setRemaining(r => r - 1), 1000);
    return () => clearTimeout(t);
  }, [effectiveRemaining, running]);
  return [effectiveRemaining, setRemaining];
}
