<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Forma 55 · Performance</title>
<meta name="theme-color" content="#12141A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forma 55" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
<style>
:root{
  --bg:#12141A;
  --bg-elev:#1B1E27;
  --bg-elev2:#242835;
  --accent:#C8FF3D;
  --accent-dim:#8FBF2B;
  --text:#FFFFFF;
  --text-dim:#C7CCD6;
  --text-faint:#9DA3B0;
  --danger:#FF6B4A;
  --up:#7DD8FF;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;}
input{user-select:text;-webkit-user-select:text;}
#root{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none; background:none; color:inherit;}
h1,h2,h3{font-family:var(--font-display); font-weight:900; letter-spacing:-0.02em; margin:0;}
p{margin:0;}

.app-shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  padding-bottom: 90px; /* Espacio para la tab bar */
}

.screen {
  flex: 1;
  padding: 24px 20px;
  padding-top: calc(24px + env(safe-area-inset-top));
  animation: fadein .3s ease;
}
@keyframes fadein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* --- COCKPIT HOME --- */
.cockpit { display: flex; flex-direction: column; gap: 20px; }
.cockpit-status {
  text-align: center;
  padding: 20px;
  background: var(--bg-elev);
  border-radius: 20px;
}
.status-label { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;}
.status-value {
  font-family: var(--font-display);
  font-size: 42px;
  line-height: 1.1;
  margin-top: 8px;
}
.status-value.good { color: var(--accent); }
.status-value.warn { color: var(--danger); }

.cockpit-action {
  background: var(--bg-elev2);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  border: 1px solid rgba(200, 255, 61, 0.2);
}
.action-kicker { font-size: 14px; font-weight: 700; color: var(--accent); }
.action-title { font-size: 24px; font-weight: 800; margin: 4px 0; }
.action-subtitle { font-size: 16px; color: var(--text-dim); }
.btn-huge {
  display: block;
  width: 100%;
  padding: 20px;
  font-size: 20px;
  font-weight: 900;
  border-radius: 16px;
  margin-top: 20px;
  background: var(--accent);
  color: #0C0D10;
}

/* --- ACORDEONES DE DETALLE --- */
.home-details {
  margin-top: 10px;
  background: rgba(255,255,255,.03);
  border-radius: 16px;
  border: 1px solid var(--bg-elev2);
  overflow: hidden;
}
.home-details > summary {
  padding: 16px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  list-style: none;
}
.home-details > summary::-webkit-details-marker { display: none; }
.home-details > summary::after { content: '➕'; font-size: 16px; color: var(--text-dim); transition: transform 0.2s; }
.home-details[open] > summary::after { transform: rotate(45deg); }
.details-body { padding: 0 16px 16px; font-size: 16px; line-height: 1.5; color: var(--text-dim); }

/* --- TAB BAR --- */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--bg-elev);
  border-top: 1px solid var(--bg-elev2);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-bar-inner {
  display: flex;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 8px;
}
.tab-bar-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 2px;
  border-radius: 12px;
  color: var(--text-faint);
  font-size: 12px;
  font-weight: 700;
  transition: all .2s ease;
}
.tab-bar-btn .tbi { font-size: 24px; line-height: 1; }
.tab-bar-btn.active {
  background-color: var(--bg-elev2);
  color: var(--accent);
}
</style>
</head>
<body>
<div id="root"></div>

  "imports": {
    "react": "https://esm.sh/react@18.3.1",

    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>

<script type="module">
import React, { Component, useState, useEffect, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';

const h = React.createElement;
const html = htm.bind(h);
console.log("Forma55 V1b - Arrancando...");

// =====================================================================
// MOTORES Y LÓGICA (SIMPLIFICADO PARA EL EJEMPLO)
// En una implementación real, todo el código de V253 se incluiría aquí.
// Por ahora, usamos funciones stub que simulan la inteligencia.
// =====================================================================
const useSimulatedEngine = (state) => {
  // Simula la lógica de los motores de V253
  const decision = {
    status: 'Progresar',
    action: 'Circuito de seguimiento',
    why: 'Buena recuperación y adherencia sostenida.',
    focus: 'Pecho alto',
    details: {
      lastSession: 'Hace 2 días, 4 rondas, RPE 7.5',
      weightTrend: '67.5 kg (bajando)',
      waistTrend: '86.0 cm (bajando)',
    }
  };
  if (state.readiness < 3) {
    decision.status = 'Frenar';
    decision.action = 'Priorizar recuperación';
    decision.why = 'Readiness bajo. El descanso es la prioridad.';
  }
  return decision;
};

// =====================================================================
// COMPONENTES
// =====================================================================
const TabBar = ({ activeTab, onNavigate }) => {
  const tabs = [
    { id: 'control', label: 'Control', icon: '🕹️' },
    { id: 'evolution', label: 'Evolución', icon: '📈' },
    { id: 'data', label: 'Datos', icon: '📋' },
    { id: 'settings', label: 'Ajustes', icon: '⚙️' },
  ];
  return html`
    <nav class="tab-bar">
      <div class="tab-bar-inner">
        ${tabs.map(tab => html`
          <button
            key=${tab.id}
            class="tab-bar-btn ${activeTab === tab.id ? 'active' : ''}"
            onClick=${() => onNavigate(tab.id)}
          >
            <span class="tbi">${tab.icon}</span>
            <span>${tab.label}</span>
          </button>
        `)}
      </div>
    </nav>
  `;
};

const ControlScreen = ({ decision }) => {
  return html`
    <div class="cockpit">
      <div class="cockpit-status">
        <div class="status-label">Estado general</div>
        <div class="status-value ${decision.status === 'Progresar' ? 'good' : 'warn'}">${decision.status}</div>
      </div>

      <div class="cockpit-action">
        <div class="action-kicker">Acción recomendada</div>
        <div class="action-title">${decision.action}</div>
        <div class="action-subtitle">Foco: ${decision.focus}</div>
        <button class="btn-huge">Empezar sesión</button>
      </div>

      <details class="home-details">
        <summary>¿Por qué esta decisión?</summary>
        <div class="details-body">${decision.why}</div>
      </details>
      <details class="home-details">
        <summary>Ver detalles y contexto</summary>
        <div class="details-body">
          <p><strong>Última sesión:</strong> ${decision.details.lastSession}</p>
          <p><strong>Tendencia de peso:</strong> ${decision.details.weightTrend}</p>
          <p><strong>Tendencia de cintura:</strong> ${decision.details.waistTrend}</p>
        </div>
      </details>
    </div>
  `;
};

const PlaceholderScreen = ({ title }) => html`
  <div class="screen">
    <h1>${title}</h1>
    <p>Esta sección se implementaría aquí.</p>
  </div>
`;

// =====================================================================
// APP PRINCIPAL
// =====================================================================
function App() {
  const [state, setState] = useState({ screen: 'control', readiness: 4 });
  const decision = useSimulatedEngine(state);

  const handleNavigate = useCallback((screen) => {
    setState(prevState => ({ ...prevState, screen }));
  }, []);

  const renderScreen = () => {
    switch (state.screen) {
      case 'control':
        return html`<${ControlScreen} decision=${decision} />`;
      case 'evolution':
        return html`<${PlaceholderScreen} title="Evolución" />`;
      case 'data':
        return html`<${PlaceholderScreen} title="Datos y Registros" />`;
      case 'settings':
        return html`<${PlaceholderScreen} title="Ajustes" />`;
      default:
        return html`<div>Pantalla no encontrada</div>`;
    }
  };

  return html`
    <div class="app-shell">
      <main class="screen">
        ${renderScreen()}
      </main>
      <${TabBar} activeTab=${state.screen} onNavigate=${handleNavigate} />
    </div>
  `;
}
